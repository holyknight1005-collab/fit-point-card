<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランク（楽天式5段）プレビュー</title>
<style>
  :root{--orange:#F0A030;--orange-d:#D9832A;--bg:#FBF6EE;--surface:#FFFFFF;--border:#EADFCB;--text:#3B342B;--muted:#9A8F7D;--radius-sm:10px}
  *{box-sizing:border-box}
  body{margin:0;background:#efe7da;font-family:'Noto Sans JP',-apple-system,sans-serif;color:var(--text);padding:20px 16px}
  .note{max-width:400px;margin:0 auto 12px;font-size:12px;color:#6b6156;text-align:center;line-height:1.6}
  .card{max-width:400px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
  h2{margin:0 0 10px;font-size:17px}
  .rank-card{margin:6px 0 12px;padding:14px 16px;border-radius:var(--radius-sm);background:linear-gradient(var(--rkt),var(--rkt)),var(--surface);border:1px solid var(--rk)}
  .rank-top{display:flex;align-items:center;gap:12px}
  .rank-lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .rank-name{font-size:20px;font-weight:900;color:var(--text);line-height:1.1}
  .rank-pt{margin-left:auto;font-size:20px;font-weight:900;color:var(--orange-d)}
  .rank-pt span{font-size:11px;font-weight:700;color:var(--muted);margin-left:2px}
  .rank-bar{height:8px;border-radius:999px;background:#EEE3CE;overflow:hidden;margin:12px 0 6px}
  .rank-fill{height:100%;border-radius:999px;background:var(--rk)}
  .rank-next{font-size:12px;color:var(--muted)}.rank-next b{color:var(--orange-d)}
  .medal{position:relative;flex:none;width:var(--ms,46px);height:var(--ms,46px)}
  .medal .coin{width:100%;height:100%;border-radius:50%;background:var(--mc);border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:calc(var(--ms,46px)*.42);position:relative;z-index:2}
  .medal .coin::after{content:'';position:absolute;inset:3px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5)}
  .medal::before,.medal::after{content:'';position:absolute;bottom:-5px;width:7px;height:13px;background:var(--mc);opacity:.85;z-index:1;border-radius:1px}
  .medal::before{left:calc(50% - 11px);transform:rotate(14deg)}
  .medal::after{right:calc(50% - 11px);transform:rotate(-14deg)}
  .rank-ladder{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .rank-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
  .rank-row.cur{border-color:var(--rr);background:linear-gradient(var(--rrt),var(--rrt)),var(--surface)}
  .rank-row .rr-name{font-weight:800;font-size:13px}
  .rank-row .rr-req{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
  .rank-row .rr-cur{font-size:10px;font-weight:800;color:#fff;background:var(--rr);border-radius:999px;padding:2px 8px}
</style></head>
<body>
<div class="note">確認用プレビュー（楽天式5段）。現在「ゴールド／250pt」の例。しきい値・色は後から変更できます。</div>
<div class="card"><h2>マイページ</h2><div id="mount"></div></div>
<script>
function rgba(hex,a){let h=hex.replace('#','');const n=parseInt(h,16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function medal(color,label,size){return '<div class="medal" style="--mc:'+color+(size?';--ms:'+size+'px':'')+'"><div class="coin">'+label+'</div></div>';}
const L={regular:'R',silver:'S',gold:'G',platinum:'P',diamond:'D'};
const ranks=[
 {key:'regular',name:'レギュラー',min:0,color:'#8FB63C'},
 {key:'silver',name:'シルバー',min:80,color:'#A8AEB6'},
 {key:'gold',name:'ゴールド',min:200,color:'#E3B23C'},
 {key:'platinum',name:'プラチナ',min:400,color:'#7FB0D4'},
 {key:'diamond',name:'ダイヤモンド',min:800,color:'#9B87E0'}];
const points=250; let idx=0,next=null;
for(let i=0;i<ranks.length;i++){if(points>=ranks[i].min)idx=i;else{next=ranks[i];break;}}
const c=ranks[idx],color=c.color;
const span=Math.max(1,(next.min-c.min));const pct=Math.round((points-c.min)/span*100);
let html='<div class="rank-card" style="--rk:'+color+';--rkt:'+rgba(color,.13)+'">'
 +'<div class="rank-top">'+medal(color,L[c.key],52)
 +'<div><div class="rank-lbl">現在のランク</div><div class="rank-name">'+c.name+'</div></div>'
 +'<div class="rank-pt">'+points+'<span>pt</span></div></div>'
 +'<div class="rank-bar"><div class="rank-fill" style="width:'+pct+'%"></div></div>'
 +'<div class="rank-next">あと <b>'+(next.min-points)+'pt</b> で '+next.name+'</div></div>';
html+='<div class="rank-ladder">'+ranks.map((r,i)=>{
  const cur=i===idx;const req=r.min===0?'登録で開始':(r.min+'pt〜');
  return '<div class="rank-row'+(cur?' cur':'')+'" style="--rr:'+r.color+';--rrt:'+rgba(r.color,.12)+'">'
   +medal(r.color,L[r.key],32)+'<span class="rr-name">'+r.name+'</span>'
   +(cur?'<span class="rr-cur">現在</span>':'')+'<span class="rr-req">'+req+'</span></div>';
}).join('')+'</div>';
document.getElementById('mount').innerHTML=html;
</script></body></html>

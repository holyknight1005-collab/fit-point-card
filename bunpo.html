<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文法77ステップ 超基礎編</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#222;--sub:#666;--line:#ddd;--accent:#1f6f8b;--ok:#2e8b57;--ng:#c0392b;--chip:#eef4f7;--pass:#e8f5ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--card:#202327;--ink:#eee;--sub:#aaa;--line:#3a3d42;--accent:#5fb3d1;--ok:#5cc28a;--ng:#ec6b5e;--chip:#26323a;--pass:#1f3327}}
:root[data-theme="dark"]{--bg:#16181b;--card:#202327;--ink:#eee;--sub:#aaa;--line:#3a3d42;--accent:#5fb3d1;--ok:#5cc28a;--ng:#ec6b5e;--chip:#26323a;--pass:#1f3327}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.stage{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.stage:hover{border-color:var(--accent)}
.stage.passed{background:var(--pass)}
.num{flex:0 0 40px;height:40px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700}
.stage .name{font-weight:700}
.stage .meta{font-size:12px;color:var(--sub)}
.stage .badge{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar>div{height:100%;background:var(--accent);transition:width .2s}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.sec{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:6px}
.q{font-size:18px;margin:6px 0 14px;word-break:break-word}
.ja{font-size:15px;color:var(--sub);margin-bottom:4px}
.note{font-size:12px;color:var(--ng);font-weight:700}
.choices{display:grid;gap:8px}
button{font:inherit;color:inherit}
.choice{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:16px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.choice.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 15%,transparent)}
.s1{font-size:15px;color:var(--sub);margin-bottom:4px}
.fillline{font-size:17px;line-height:2.4}
.fillline input{font:inherit;width:110px;padding:2px 6px;border:none;border-bottom:2px solid var(--accent);background:transparent;color:var(--ink);text-align:center}
.fillline input.ok{border-color:var(--ok)}.fillline input.ng{border-color:var(--ng)}
.answerbox{min-height:52px;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:16px}
.answerbox .fixed{color:var(--sub)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--chip);cursor:pointer;font-size:16px}
.chip.used{visibility:hidden}
.btn{padding:12px 18px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:16px}
.btn.sub{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.fb{margin-top:14px;padding:12px;border-radius:10px;border:1px solid var(--line)}
.fb.ok{border-color:var(--ok)}.fb.ng{border-color:var(--ng)}
.fb .v{font-weight:700;font-size:17px}
.fb.ok .v{color:var(--ok)}.fb.ng .v{color:var(--ng)}
.fb .ans{margin:4px 0;font-size:15px}
.fb .ex{font-size:14px;color:var(--ink)}
.score{font-size:40px;font-weight:800;text-align:center;margin:8px 0}
.result-msg{text-align:center;font-weight:700;font-size:18px}
.wrong-list{font-size:14px;margin-top:10px}
.wrong-list li{margin-bottom:6px}
.back{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-size:14px}
.foot{font-size:12px;color:var(--sub);text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* =========================================================
   英文法77ステップ 超基礎編（ひとまず版）
   問題の形：
   c = 4択   {t:"c", q, o:[4つ], a:正解の番号(0始まり), e:解説}
   f = 書き換え {t:"f", s1:元の文, s2:"( )" を空所にした文, a:["正解|別解", ...], e}
   o = 並べかえ {t:"o", ja, pre:前に固定, post:後ろに固定, w:"正しい順に / で区切る", x:"不要な語", e}
   ========================================================= */
const PASS_RATE = 0.8;   // 合格ライン（仮）
const STORE_KEY = "bunpo77_chokiso_v1";

const STAGES = [
{id:0,name:"動詞",qs:[
{t:"c",q:"My sister ( ) eat carrots.",o:["don't","doesn't","isn't","hasn't"],a:1,e:"主語 My sister は三人称単数。一般動詞（eat）の否定は doesn't＋原形。isn't は be 動詞の否定。"},
{t:"c",q:"This soup looks plain, but it ( ) delicious.",o:["eats","makes","tastes","does"],a:2,e:"「〜な味がする」は taste＋形容詞。look・smell・taste・sound・feel は後ろに形容詞を置いて「〜に見える／〜なにおい・味がする」。"},
{t:"c",q:"Yuki and Mai ( ) on the tennis team.",o:["is","am","are","was"],a:2,e:"A and B は2人なので複数扱い → are。"},
{t:"c",q:"My uncle ( ) a lot of money on books every month.",o:["uses","spends","makes","puts"],a:1,e:"spend＋お金・時間＋on〜「〜にお金・時間を使う」。"},
{t:"c",q:"Let's ( ) a break. We've been working for two hours.",o:["take","go","do","leave"],a:0,e:"take a break「休憩する」。take a walk「散歩する」と同じ take。"},
{t:"f",s1:"There are four bedrooms in this house.",s2:"This house ( ) four bedrooms.",a:["has"],e:"There is/are 〜 in A ＝ A has 〜。「Aの中に〜がある」を「Aは〜を持っている」と言いかえる。"},
{t:"f",s1:"I felt sad when I read the letter.",s2:"The letter ( ) me sad.",a:["made"],e:"make＋人＋形容詞「人を〜（な気持ち）にする」。主語を「手紙」にして言いかえる。"},
{t:"o",ja:"私の姉はふつう8時に会社へ出かけます。",pre:"",post:".",w:"My sister / usually / leaves / home / for / work / at / eight",x:"",e:"usually などの頻度の副詞は一般動詞の前。leave home for〜「〜に向けて家を出る」。"},
{t:"o",ja:"あなたはこの映画が難しいとわかるでしょう。",pre:"You",post:".",w:"will / find / this / movie / difficult",x:"",e:"find＋O＋形容詞「Oが〜だとわかる」。O＝this movie, 形容詞＝difficult。"},
{t:"o",ja:"祖母は私にセーターを編んで（作って）くれました。",pre:"",post:".",w:"My grandmother / made / a sweater / for / me",x:"",e:"make A for B「BにAを作る」。make・buy・cook は for、give・send・show は to を使う。"},
{t:"o",ja:"彼とは長い間会っていません。",pre:"I",post:".",w:"haven't / seen / him / for / a long time",x:"",e:"過去から今まで「ずっと会っていない」→ 現在完了（継続）have＋過去分詞＋for＋期間。"},
{t:"o",ja:"私たちはこの犬をポチと呼んでいます。",pre:"We",post:".",w:"call / this / dog / Pochi",x:"",e:"call＋O＋C「OをCと呼ぶ」。"}
]},
{id:1,name:"時制",qs:[
{t:"c",q:"My father ( ) to work by train every day.",o:["is going","going","goes","went"],a:2,e:"every day（毎日）＝ふだんの習慣 → 現在形。主語が三人称単数なので goes。"},
{t:"c",q:"My sister ( ) a bath when the phone rang.",o:["has taken","is taking","takes","was taking"],a:3,e:"電話が鳴った（過去）その時に「〜している最中だった」→ 過去進行形 was＋〜ing。"},
{t:"c",q:"I ( ) such a big fish before.",o:["haven't seeing","haven't seen","didn't seen","didn't seeing"],a:1,e:"before「以前に」＋経験 → 現在完了 have＋過去分詞（seen）。didn't の後ろは原形。"},
{t:"c",q:"( ) your brother cleaned his room yet?",o:["Does","Did","Has","Have"],a:2,e:"yet「もう」と過去分詞 cleaned → 現在完了の疑問文。主語 your brother は三人称単数なので Has。"},
{t:"c",q:"Our class ( ) a trip to Kyoto next month.",o:["take","took","will take","has taken"],a:2,e:"next month はこれからのこと → 未来の will。"},
{t:"f",s1:"Ken moved to Osaka two years ago, and he still lives there.",s2:"Ken has ( ) ( ) Osaka for two years.",a:["lived|been","in"],e:"2年前から今までずっと住んでいる → 現在完了（継続）has lived in。has been in でも可。"},
{t:"f",s1:"My sister caught a cold last week and she is still sick.",s2:"My sister has ( ) sick ( ) last week.",a:["been","since"],e:"「先週からずっと具合が悪い」→ has been sick。since＋起点「〜以来」、for＋期間「〜の間」。"},
{t:"f",s1:"The Smiths arrived in Japan last month and they are still here.",s2:"The Smiths ( ) been in Japan since last month.",a:["have"],e:"The Smiths（スミス家の人たち）は複数 → have been。"},
{t:"o",ja:"姉はたいてい夕食後に散歩に出かけます。（1語不要）",pre:"My sister",post:".",w:"usually / goes / for / a / walk / after / dinner",x:"takes",e:"go for a walk「散歩に出かける」。for があるので take ではなく go。usually は一般動詞の前。"},
{t:"o",ja:"私は1週間に3回ピアノを練習します。",pre:"",post:"a week.",w:"I / practice / the piano / three times",x:"",e:"回数（three times a week）は文の終わりに置く。"},
{t:"o",ja:"私は試験のことが心配になってきた。",pre:"",post:".",w:"I / am / getting / worried / about / the / exam",x:"",e:"get＋形容詞「〜になる」。進行形 am getting で「〜になってきている」。"},
{t:"o",ja:"北海道に行ったことがありますか。",pre:"Have",post:"?",w:"you / ever / been / to / Hokkaido",x:"",e:"have been to〜「〜へ行ったことがある」。ever は過去分詞の前。"},
{t:"o",ja:"私は3年間ずっと中国語を勉強しています。",pre:"I",post:"three years.",w:"have / studied / Chinese / for",x:"",e:"過去から今まで続いている → have＋過去分詞＋for＋期間。"}
]},
{id:2,name:"助動詞",qs:[
{t:"c",q:"( ) your father going to come to the school festival?",o:["Has","Is","Does","Will"],a:1,e:"be going to〜 の疑問文は be 動詞を前に出す → Is your father going to〜?"},
{t:"c",q:"My brother ( ) very fast.",o:["can swimming","cans swim","can swim","can swam"],a:2,e:"助動詞の後ろは動詞の原形。can に s はつかない。"},
{t:"c",q:"You don't ( ) to get up early tomorrow. It's Sunday.",o:["can","have","make","must"],a:1,e:"don't have to〜「〜する必要はない」。"},
{t:"c",q:"“Do I have to finish this today?” “No, you ( ).”",o:["must not","don't","can't","haven't"],a:1,e:"Do I have to〜? に No で答えるときは No, you don't (have to).「その必要はない」。must not だと「してはいけない」になる。"},
{t:"c",q:"“Must I clean the room now?” “No, you don't ( ).”",o:["clean","may","must","have to"],a:3,e:"Must I〜? に No で答えるときも don't have to「その必要はない」。mustn't は「禁止」なので合わない。"},
{t:"c",q:"She ( ) be tired. She has just woken up.",o:["should","may","must","cannot"],a:3,e:"今起きたばかり → 疲れている「はずがない」= cannot be。must be は「〜にちがいない」。"},
{t:"c",q:"“( ) I carry your bag?” “Yes, please. That's very kind.”",o:["Will","Shall","Did","Have"],a:1,e:"Shall I〜?「（私が）〜しましょうか」。申し出の言い方。"},
{t:"c",q:"I ( ) like to visit London someday.",o:["would","will","must","may"],a:0,e:"would like to〜「〜したい」（want to のていねいな言い方）。"},
{t:"c",q:"( ) I borrow your pen for a moment?",o:["Will","Should","May","Shall"],a:2,e:"May I〜?「〜してもいいですか」。許可を求める言い方。"},
{t:"c",q:"You had better ( ) a jacket. It's cold outside.",o:["wear","wore","to wear","wearing"],a:0,e:"had better は助動詞のはたらき → 後ろは原形。"},
{t:"f",s1:"Don't run in the hallway.",s2:"You ( ) ( ) run in the hallway.",a:["must","not"],e:"Don't〜. ＝ You must not〜.「〜してはいけない」（禁止）。"},
{t:"f",s1:"My sister must practice the piano every day.",s2:"My sister ( ) to practice the piano every day.",a:["has"],e:"must ＝ have to。主語が三人称単数なので has to。"},
{t:"f",s1:"You don't have to hurry.",s2:"You ( ) not hurry.",a:["need"],e:"don't have to〜 ＝ need not〜「〜する必要はない」。"},
{t:"f",s1:"Let's play cards after dinner.",s2:"( ) we play cards after dinner?",a:["Shall"],e:"Let's〜. ＝ Shall we〜?「（いっしょに）〜しましょうか」。"},
{t:"f",s1:"Tom was able to answer the question.",s2:"Tom ( ) answer the question.",a:["could"],e:"was able to〜 ≒ could〜「〜することができた」。"},
{t:"o",ja:"医者になるためには、一生懸命勉強しなければならない。",pre:"You",post:".",w:"must / study / hard / to / be / a doctor",x:"",e:"must＋原形。to be〜「〜になるために」（目的を表す不定詞）。"},
{t:"o",ja:"誰もその問題を解くことができなかった。",pre:"",post:".",w:"No one / was / able / to / solve / the / problem",x:"",e:"be able to〜「〜できる」。No one（誰も〜ない）が主語。"},
{t:"o",ja:"手伝ってくれて、何とお礼を言ったらいいかわかりません。",pre:"",post:".",w:"I / cannot / thank / you / enough / for / your / help",x:"",e:"cannot〜 enough「いくら〜してもしたりない」。"},
{t:"o",ja:"夜に運転するときは、いくら注意してもしすぎることはない。（1語不要）",pre:"You",post:"at night.",w:"cannot / be / too / careful / when / you / drive",x:"must",e:"cannot〜 too …「いくら…に〜してもしすぎることはない」。"},
{t:"o",ja:"私はいつかもう一度パリを訪れたいです。",pre:"",post:"someday.",w:"I / would / like / to / visit / Paris / again",x:"",e:"would like to＋原形「〜したい」。"},
{t:"o",ja:"あなたは今日そこへ行く必要はありません。",pre:"",post:"today.",w:"You / do / not / have / to / go / there",x:"",e:"do not have to〜「〜する必要はない」。"},
{t:"o",ja:"彼が言ったことを忘れてはいけません。（1語不要）",pre:"",post:".",w:"You / must / not / forget / what / he / said",x:"don't",e:"must not〜「〜してはいけない」。what he said「彼が言ったこと」。"},
{t:"o",ja:"少し休んだ方がいいですよ。（1語不要）",pre:"",post:".",w:"You / had / better / take / a / rest",x:"to",e:"had better の後ろは原形。to は入らない。"},
{t:"o",ja:"夜遅くに一人で出かけない方がいい。",pre:"",post:"late at night.",w:"You / had / better / not / go / out / alone",x:"",e:"had better not＋原形。not の位置（better の後ろ）に注意。"},
{t:"o",ja:"祖父は以前、毎朝ジョギングをしていた。（1語不要）",pre:"",post:"every morning.",w:"My grandfather / used / to / jog",x:"was",e:"used to＋原形「以前は〜していた（今はしていない）」。"}
]},
{id:3,name:"代名詞",qs:[
{t:"c",q:"I like ( ) shoes very much.",o:["it","this","that","these"],a:3,e:"shoes は複数 → these（これらの）。"},
{t:"c",q:"There's ( ) wrong with my bike, so I can't ride it today.",o:["something","anything","nothing","everything"],a:0,e:"肯定文で「どこか（何か）おかしい」→ something wrong。形容詞は something の後ろ。"},
{t:"c",q:"Mike, a friend of ( ), is visiting Japan next week.",o:["I","my","me","mine"],a:3,e:"a friend of mine「私の友だちの一人」。of の後ろは所有代名詞。"},
{t:"c",q:"Their school is big, but not as big as ( ).",o:["ours","ourselves","us","we"],a:0,e:"ours ＝ our school（私たちの学校）。"},
{t:"c",q:"His bag is black and ( ) is red.",o:["my","mine","mines","mine's"],a:1,e:"mine ＝ my bag。1語で「私のもの」。"},
{t:"c",q:"Please make ( ) at home, Mr. Brown.",o:["your","you","yourself","myself"],a:2,e:"make yourself at home「くつろいでください」。自分自身 → 再帰代名詞 yourself。"},
{t:"c",q:"“Are you and Lisa sisters?” “Yes, ( ) are.”",o:["you and I","she and me","we","they"],a:2,e:"you and Lisa と聞かれた本人が答える → 自分を含めて we。"},
{t:"c",q:"I saw Mr. Tanaka at the station ( ).",o:["in a day","the other day","some day","tomorrow"],a:1,e:"saw（過去）→ the other day「先日」。some day は未来の「いつか」。"},
{t:"c",q:"I lost my umbrella, so I have to buy a new ( ).",o:["any","one","few","that"],a:1,e:"同じ種類の別のもの（a new umbrella）→ one。なくした「その傘」そのものなら it。"},
{t:"c",q:"( ) of the students has a tablet.",o:["Each","Both","Many","Some"],a:0,e:"動詞が has（単数）→ Each of〜。Both・Many・Some は複数扱い。"},
{t:"f",s1:"The girl didn't have any money then.",s2:"The girl had ( ) money then.",a:["no"],e:"not any ＝ no「少しも〜ない」。"},
{t:"f",s1:"I could not hear anything.",s2:"I could hear ( ).",a:["nothing"],e:"not anything ＝ nothing「何も〜ない」。"},
{t:"f",s1:"Lisa doesn't have any brothers or sisters.",s2:"Lisa is an only ( ).",a:["child"],e:"an only child「一人っ子」。"},
{t:"f",s1:"Every student in this class likes music.",s2:"All the ( ) in this class like music.",a:["students"],e:"every＋単数名詞 ＝ all the＋複数名詞。動詞の形（likes／like）も変わる。"},
{t:"f",s1:"Is this your bag?",s2:"Is this bag ( )?",a:["yours"],e:"your bag ＝ yours「あなたのもの」。"},
{t:"f",s1:"That is not his car.",s2:"That car is not ( ).",a:["his"],e:"his は「彼の」「彼のもの」の両方の意味がある。"},
{t:"f",s1:"Her idea is better than mine.",s2:"My idea is not as good as ( ).",a:["hers"],e:"her idea ＝ hers「彼女のもの」。"},
{t:"f",s1:"English is spoken in Australia.",s2:"( ) speak English in Australia.",a:["They|People"],e:"「（その国の）人々」を主語にするときは they を使う。"},
{t:"f",s1:"I was given this book by Ken.",s2:"Ken gave ( ) this book.",a:["me"],e:"give＋人＋物。人の位置は目的格 me。"},
{t:"f",s1:"She made the cake. Nobody helped her.",s2:"She made the cake by ( ).",a:["herself"],e:"by oneself「ひとりで」。"},
{t:"o",ja:"私はこの映画のほうが、昨日見た映画よりおもしろいと思う。",pre:"I think",post:".",w:"this movie / is / more / interesting / than / the / one / I / saw / yesterday",x:"",e:"the one ＝ the movie。同じ名詞のくり返しをさける one。"},
{t:"o",ja:"コーヒーをもう一杯いかがですか。",pre:"Will",post:"?",w:"you / have / another / cup / of / coffee",x:"",e:"another「もう一つの」。a cup of coffee の a が another になる。"},
{t:"o",ja:"このシャツをもっと小さいものと交換していただけませんか。",pre:"",post:"?",w:"Could / you / change / this / shirt / for / a / smaller / one",x:"",e:"change A for B「AをBと交換する」。a smaller one ＝ a smaller shirt。"},
{t:"o",ja:"明日は雨が降らないと思います。",pre:"",post:"tomorrow.",w:"I / don't / think / it / will / rain",x:"",e:"英語では「〜ないと思う」を I don't think〜 と think の方を否定する。"},
{t:"o",ja:"私は旅行中に鍵の1つをなくした。",pre:"",post:".",w:"I / lost / one / of / my / keys / during / the / trip",x:"",e:"one of＋複数名詞「〜のうちの1つ」。"}
]},
{id:4,name:"中間チェック 1-1",check:true,qs:[
{t:"c",q:"Tom and his brother ( ) good at soccer.",o:["am","are","is","does"],a:1,e:"A and B は複数 → are。"},
{t:"c",q:"A: Have you finished the report?  B: No, ( ).",o:["I have already finished it","I want to finish it again","I won't finish it again","I haven't finished it yet"],a:3,e:"No の答え → not〜 yet「まだ〜していない」。"},
{t:"c",q:"I don't know when my sister ( ) home tonight.",o:["to come","will come","come","coming"],a:1,e:"「いつ〜するか」の部分（間接疑問）が、これから先のこと（tonight）→ will come。"},

/* ---------- 保存 ---------- */
function load(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{}}catch(e){return {}}}
function save(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d))}catch(e){}}
let rec = load();

/* ---------- 便利 ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).replace(/[’‘`]/g,"'").replace(/\s+/g," ").trim().toLowerCase();
const split = s => s ? s.split("/").map(x=>x.trim()).filter(Boolean) : [];
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today = () => {const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};
const SEC = {c:"（　）に入るのに最も適当なものを選ぼう",f:"2つの文が同じ意味になるように（　）に適語を入れよう",o:"日本文に合うように語を並べかえよう"};

/* ---------- ステージ一覧 ---------- */
function home(){
  const passed = STAGES.filter(s=>rec[s.id]&&rec[s.id].passed).length;
  let h = `<h1>英文法77ステップ　超基礎編</h1>
  <p class="lead">STAGE 0〜13（ひとまず版）　合格 ${passed} / ${STAGES.length}　・合格ライン ${Math.round(PASS_RATE*100)}%</p>`;
  for(const s of STAGES){
    const r = rec[s.id]||{};
    const meta = r.tries ? `${r.tries}回　最高 ${r.best}/${s.qs.length}` : `${s.qs.length}問`;
    h += `<div class="card stage ${r.passed?"passed":""}" data-id="${s.id}">
      <div class="num">${s.id}</div>
      <div><div class="name">${esc(s.name)}</div><div class="meta">${meta}</div></div>
      ${r.passed?`<div class="badge">合格 ${esc(r.passed)}</div>`:""}
    </div>`;
  }
  h += `<div class="foot">記録はこの端末のブラウザに保存されます　<button class="back" id="reset">記録を消す</button></div>`;
  $app.innerHTML = h;
  $app.querySelectorAll(".stage").forEach(el=>el.onclick=()=>start(+el.dataset.id));
  document.getElementById("reset").onclick=()=>{if(confirm("この端末の記録をすべて消しますか？")){rec={};save(rec);home()}};
  window.scrollTo(0,0);
}

/* ---------- 解く ---------- */
let S=null; // {stage, list:[qIndex], pos, results:{qIndex:bool}, retry}
function start(id, onlyList){
  const st = STAGES.find(s=>s.id===id);
  S = {stage:st, list: onlyList || st.qs.map((_,i)=>i), pos:0, results:{}, retry:!!onlyList};
  show();
}
function show(){
  const st=S.stage, qi=S.list[S.pos], q=st.qs[qi];
  const n=S.list.length;
  let h = `<div class="top"><button class="back" id="quit">← 一覧へ</button><span>STAGE ${st.id} ${esc(st.name)}${S.retry?"（解き直し）":""}</span><span>${S.pos+1} / ${n}</span></div>
  <div class="bar"><div style="width:${S.pos/n*100}%"></div></div>
  <div class="card"><div class="sec">${SEC[q.t]}</div>`;
  if(q.t==="c"){
    h += `<div class="q">${esc(q.q).replace("( )","(　　　)")}</div><div class="choices">`;
    q.o.forEach((o,i)=>h+=`<button class="choice" data-i="${i}">${"①②③④"[i]}　${esc(o)}</button>`);
    h += `</div>`;
  }else if(q.t==="f"){
    let k=0;
    const line = esc(q.s2).replace(/\( \)/g,()=>`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-k="${k++}">`);
    h += `<div class="s1">① ${esc(q.s1)}</div><div class="fillline">② ${line}</div>
      <div class="row"><button class="btn" id="check">答え合わせ</button></div>`;
  }else{
    const words = split(q.w), extra = split(q.x);
    S.pool = shuffle(words.concat(extra)); S.picked=[];
    const note = q.ja.match(/（[^）]*(不要|補足)[^）]*）/);
    h += `<div class="ja">${esc(q.ja.replace(/（[^）]*(不要|補足)[^）]*）/,""))}</div>${note?`<div class="note">${esc(note[0])}</div>`:""}
      <div class="answerbox" id="abox"></div>
      <div class="pool" id="pool"></div>
      <div class="row"><button class="btn sub" id="clear">やり直す</button><button class="btn" id="check" disabled>答え合わせ</button></div>`;
  }
  h += `<div id="fb"></div></div>`;
  $app.innerHTML=h;
  document.getElementById("quit").onclick=()=>{if(S.pos===0||confirm("途中でやめますか？（記録は残りません）"))home()};
  if(q.t==="c"){
    $app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, ok=i===q.a;
      $app.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("ok")});
      if(!ok)b.classList.add("ng");
      feedback(ok, `${"①②③④"[q.a]} ${q.o[q.a]}`, q.e);
    });
  }else if(q.t==="f"){
    const ins=[...$app.querySelectorAll(".fillline input")];
    ins[0].focus();
    ins.forEach((inp,i)=>inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault(); if(i<ins.length-1)ins[i+1].focus(); else document.getElementById("check").click();}});
    document.getElementById("check").onclick=()=>{
      let all=true;
      ins.forEach((inp,i)=>{const ok=q.a[i].split("|").some(a=>norm(a)===norm(inp.value)); inp.classList.add(ok?"ok":"ng"); inp.disabled=true; if(!ok)all=false;});
      document.getElementById("check").remove();
      const ans = q.s2.replace(/\( \)/g,(()=>{let k=0;return()=>`( ${q.a[k++].split("|").join(" / ")} )`})());
      feedback(all, ans, q.e);
    };
  }else{
    drawOrder(q);
    document.getElementById("clear").onclick=()=>{S.picked=[];drawOrder(q)};
    document.getElementById("check").onclick=()=>{
      const got=S.picked.map(i=>S.pool[i]), want=split(q.w);
      const ok = got.length===want.length && got.every((w,i)=>norm(w)===norm(want[i]));
      document.getElementById("clear").remove(); document.getElementById("check").remove();
      $app.querySelectorAll("#pool .chip,#abox .chip").forEach(c=>c.onclick=null);
      const full = [q.pre, want.join(" "), q.post].filter(Boolean).join(" ").replace(/ ([.?!])$/,"$1");
      feedback(ok, full + (q.x?`　（不要：${split(q.x).join("・")}）`:""), q.e);
    };
  }
  window.scrollTo(0,0);
}
function drawOrder(q){
  const ab=document.getElementById("abox"), pool=document.getElementById("pool");
  let h = q.pre?`<span class="fixed">${esc(q.pre)}</span>`:"";
  S.picked.forEach((pi,k)=>h+=`<button class="chip" data-k="${k}">${esc(S.pool[pi])}</button>`);
  if(!S.picked.length) h+=`<span class="fixed">…</span>`;
  h += q.post?`<span class="fixed">${esc(q.post)}</span>`:"";
  ab.innerHTML=h;
  pool.innerHTML = S.pool.map((w,i)=>`<button class="chip ${S.picked.includes(i)?"used":""}" data-i="${i}">${esc(w)}</button>`).join("");
  pool.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const i=+c.dataset.i; if(!S.picked.includes(i)){S.picked.push(i);drawOrder(q)}});
  ab.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{S.picked.splice(+c.dataset.k,1);drawOrder(q)});
  const need = split(q.w).length;
  document.getElementById("check").disabled = S.picked.length!==need;
}
function feedback(ok, ans, ex){
  S.results[S.list[S.pos]] = ok;
  const last = S.pos===S.list.length-1;
  document.getElementById("fb").innerHTML = `<div class="fb ${ok?"ok":"ng"}">
    <div class="v">${ok?"○ 正解":"× ざんねん"}</div>
    <div class="ans">正解：${esc(ans)}</div>
    <div class="ex">💡 ${esc(ex)}</div></div>
    <div class="row"><button class="btn" id="next">${last?"結果を見る":"次へ"}</button></div>`;
  const nb=document.getElementById("next"); nb.focus();
  nb.onclick=()=>{ if(last) result(); else {S.pos++; show();} };
}

/* ---------- 結果 ---------- */
function result(){
  const st=S.stage, total=S.list.length;
  const score=S.list.filter(i=>S.results[i]).length;
  const wrong=S.list.filter(i=>!S.results[i]);
  let msg="";
  if(!S.retry){
    const r = rec[st.id]||{tries:0,best:0};
    r.tries++; r.best=Math.max(r.best,score);
    const pass = score/total>=PASS_RATE;
    if(pass && !r.passed) r.passed=today();
    rec[st.id]=r; save(rec);
    msg = pass ? "合格！" : `合格まであと ${Math.ceil(total*PASS_RATE)-score} 問`;
  }else{
    msg = wrong.length ? "もう一度確かめよう" : "全部できた！";
  }
  const label = q => q.t==="c"?q.q : q.t==="f"?q.s2 : q.ja;
  let h = `<div class="top"><span>STAGE ${st.id} ${esc(st.name)}${S.retry?"（解き直し）":""}</span></div>
  <div class="card"><div class="score">${score} / ${total}</div><div class="result-msg">${msg}</div>`;
  if(wrong.length){
    h += `<ul class="wrong-list">${wrong.map(i=>`<li>${esc(label(st.qs[i]))}</li>`).join("")}</ul>`;
  }
  h += `<div class="row">${wrong.length?`<button class="btn" id="redo">まちがえた問題だけ解き直す</button>`:""}
    <button class="btn sub" id="again">もう一度ぜんぶ</button><button class="btn sub" id="home">一覧へ</button></div></div>`;
  $app.innerHTML=h;
  if(wrong.length) document.getElementById("redo").onclick=()=>start(st.id, wrong);
  document.getElementById("again").onclick=()=>start(st.id);
  document.getElementById("home").onclick=home;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>

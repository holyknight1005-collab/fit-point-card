<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>座席登録</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --accent-d:#1d4ed8; --ok:#16a34a; --danger:#dc2626;
    --empty:#f9fafb; --empty-bd:#cbd5e1; --taken:#e5e7eb; --taken-ink:#9ca3af;
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 64px}
  .wrap.wide{max-width:1100px}
  h1{font-size:1.25rem;margin:.2em 0 .1em}
  h2{font-size:1.05rem;margin:1.2em 0 .5em;border-left:4px solid var(--accent);padding-left:.5em}
  .sub{color:var(--sub);font-size:.9rem;margin:.1em 0 1em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  label{display:block;font-weight:600;font-size:.92rem;margin:.9em 0 .3em}
  input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{
    width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:1rem;background:#fff;color:var(--ink)}
  textarea{min-height:120px;resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;width:100%;padding:14px;border:0;border-radius:12px;
    background:var(--accent);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:14px}
  .btn:active{background:var(--accent-d)}
  .btn[disabled]{background:#9ca3af;cursor:not-allowed}
  .btn.ghost{background:#eef2ff;color:var(--accent-d)}
  .btn.sec{background:#f3f4f6;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:var(--danger)}
  .btn.sm{width:auto;padding:8px 14px;font-size:.9rem;margin:0}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:120px}
  .msg{padding:12px 14px;border-radius:10px;font-size:.92rem;margin:10px 0}
  .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .msg.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  .msg.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;color:#fff}
  .center{text-align:center}
  .muted{color:var(--sub);font-size:.85rem}
  .stage{background:#111827;color:#fff;text-align:center;border-radius:8px;padding:6px;font-weight:700;letter-spacing:.3em;margin:6px 0 12px}
  .screen{background:#e5e7eb;color:#374151;text-align:center;border-radius:8px;padding:6px;font-weight:700;letter-spacing:.3em;margin:12px 0}

  /* 座席グリッド */
  .seatArea{overflow-x:auto;padding:6px 2px}
  .seatRow{display:flex;align-items:center;gap:14px;margin:5px 0;width:max-content}
  .rowNo{width:34px;flex:0 0 34px;text-align:center;font-size:.75rem;color:var(--sub)}
  .blk{display:flex;gap:5px}
  .seat{width:40px;height:38px;border-radius:8px;border:1px solid var(--empty-bd);background:var(--empty);
    display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#94a3b8;cursor:pointer;user-select:none;flex:0 0 auto}
  .seat.taken{background:var(--taken);color:var(--taken-ink);border-color:var(--taken);cursor:default}
  .seat.mine{outline:3px solid #22c55e;outline-offset:1px}
  .seat.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .seat.pick{cursor:pointer}
  .seat.pick:active{transform:scale(.94)}
  /* スタッフ地図 */
  .mapSeat{width:26px;height:24px;border-radius:5px;font-size:.6rem}
  .mapSeat .nm{display:block;transform:scale(.9);white-space:nowrap;overflow:hidden;max-width:24px}
  .blkgap{width:16px;flex:0 0 16px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0}
  .legend span{font-size:.82rem;display:inline-flex;align-items:center;gap:5px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}

  /* タブ */
  .tabs{display:flex;gap:6px;margin:6px 0 14px}
  .tabs button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;color:var(--sub);cursor:pointer}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* 集計 */
  .stat{display:flex;gap:10px;flex-wrap:wrap}
  .stat .box{flex:1;min-width:120px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .n{font-size:1.6rem;font-weight:800}
  .stat .k{font-size:.8rem;color:var(--sub)}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
  th{color:var(--sub);font-weight:700}

  /* モーダル */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .foot{margin-top:24px;text-align:center}
  .foot a{color:var(--sub);font-size:.8rem;text-decoration:underline;cursor:pointer}
  .cfgblk{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
  .cfgblk .row{align-items:center}
  .x{flex:0 0 auto;min-width:auto;width:auto;background:#fee2e2;color:#b91c1c;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="card center">読み込み中…</div></div>

<script>
/* ============================================================
   ホール座席登録アプリ  hall.html
   ============================================================ */
const APP_VERSION = 'hall-0.1.0';
const SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const REST = SB_URL + '/rest/v1/';
const EVENT = 'main';
const H = () => ({ 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY });

/* ---- Supabase ヘルパー ---- */
async function sbGet(t, q){ const r = await fetch(REST+t+'?'+q, {headers:H()}); if(!r.ok) throw new Error('GET '+t+' '+r.status); return r.json(); }
async function sbPatch(t, q, body){ const r = await fetch(REST+t+'?'+q, {method:'PATCH', headers:{...H(),'Content-Type':'application/json','Prefer':'return=representation'}, body:JSON.stringify(body)}); if(!r.ok) throw new Error('PATCH '+t+' '+r.status); return r.json(); }
async function sbDelete(t, q){ const r = await fetch(REST+t+'?'+q, {method:'DELETE', headers:{...H(),'Prefer':'return=representation'}}); if(!r.ok) throw new Error('DELETE '+t+' '+r.status); return r.json(); }
async function sbClaim(body){ /* INSERT。409=席が既に埋まっている */ const r = await fetch(REST+'hall_event_regs', {method:'POST', headers:{...H(),'Content-Type':'application/json','Prefer':'return=representation'}, body:JSON.stringify(body)}); if(r.status===409) return {conflict:true}; if(!r.ok){ const tx=await r.text(); throw new Error('INSERT '+r.status+' '+tx); } const d=await r.json(); return {reg:d[0]}; }

/* ---- ユーティリティ ---- */
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clientId(){ let c=localStorage.getItem('hall_cid'); if(!c){ c='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); localStorage.setItem('hall_cid',c);} return c; }
function myRec(){ try{ return JSON.parse(localStorage.getItem('hall_'+EVENT)||'null'); }catch(e){ return null; } }
function setMyRec(o){ if(o) localStorage.setItem('hall_'+EVENT, JSON.stringify(o)); else localStorage.removeItem('hall_'+EVENT); }
function seatKey(b,r,c){ return b+'-'+r+'-'+c; }
function seatLabel(cfg, reg){ const b=(cfg.layout.blocks||[]).find(x=>x.id===reg.block_id); const bn=b?b.name:reg.block_id; return bn+' '+reg.seat_row+'列'+reg.seat_col+'番'; }
function affColor(cfg, affId){ const a=(cfg.affiliations||[]).find(x=>x.id===affId); return a?a.color:'#64748b'; }
function fbOpen(cfg){
  if(cfg.feedback_mode==='open') return true;
  if(cfg.feedback_mode==='closed') return false;
  if(!cfg.event_date) return false;
  const t=(cfg.feedback_open_time||'21:00');
  const openAt = Date.parse(cfg.event_date+'T'+t+':00+09:00');
  return !isNaN(openAt) && Date.now() >= openAt;
}

/* ---- 状態 ---- */
const S = { role:'participant', screen:'loading', cfg:null, regs:[], selSeat:null, staffTab:'map', staffAuthed:false, err:'' };
let refreshTimer = null;
function stopTimer(){ if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null; } }

async function loadCfg(){ const d=await sbGet('hall_event_config','event_id=eq.'+EVENT+'&select=*'); if(!d.length) throw new Error('config-missing'); const c=d[0]; if(!c.layout) c.layout={blocks:[],rows:20}; if(!c.affiliations) c.affiliations=[]; return c; }
async function loadRegs(){ return sbGet('hall_event_regs','event_id=eq.'+EVENT+'&select=*&order=registered_at.asc'); }
function regBySeat(k){ return S.regs.find(r=>r.seat_key===k); }

/* ============================================================
   起動
   ============================================================ */
async function boot(){
  try{
    S.cfg = await loadCfg();
    S.regs = await loadRegs();
  }catch(e){
    if(String(e.message).includes('config-missing') || String(e.message).includes('400')){
      $('app').innerHTML='<div class="card"><h1>準備ができていません</h1><div class="msg err">データベースの初期設定が見つかりません。<br>Supabaseで <b>hall_event.sql</b> を実行してから、このページを開き直してください。</div></div>';
      return;
    }
    $('app').innerHTML='<div class="card"><h1>通信エラー</h1><div class="msg err">'+esc(e.message)+'</div><button class="btn" onclick="location.reload()">再読み込み</button></div>';
    return;
  }
  if(location.hash.indexOf('staff')>=0){ S.role='staff'; }
  if(S.role==='staff'){ S.staffAuthed = (sessionStorage.getItem('hall_staff')==='1'); render(); return; }
  // 参加者: 既に登録済みか？
  const m=myRec();
  if(m && m.seat_key){
    const r = S.regs.find(x=>x.seat_key===m.seat_key && x.client_id===clientId());
    if(r){ S.screen='done'; render(); return; }
  }
  S.screen='register'; render();
}

/* ============================================================
   描画ルーター
   ============================================================ */
function render(){
  stopTimer();
  const app=$('app');
  app.className='wrap'+(S.role==='staff'&&S.staffAuthed?' wide':'');
  if(S.role==='staff'){ return S.staffAuthed ? renderStaff() : renderStaffLogin(); }
  if(S.screen==='register') return renderRegister();
  if(S.screen==='seat')     return renderSeatPick();
  if(S.screen==='done')     return renderDone();
}

/* ---------- 参加者: 登録 ---------- */
function renderRegister(){
  const cfg=S.cfg, affs=cfg.affiliations||[];
  let inner='';
  inner+='<h1>'+esc(cfg.title||'座席登録')+'</h1>';
  inner+='<div class="sub">お名前と所属を選んで、座席を登録してください。</div>';
  if(!affs.length){
    inner+='<div class="msg warn">ただいま準備中です。会場スタッフにお声がけください。</div>';
    $('app').innerHTML='<div class="card">'+inner+'</div>'+footer();
    wireFooter(); return;
  }
  inner+='<div class="card">';
  inner+='<label>お名前</label><input type="text" id="f_name" placeholder="山田 太郎" autocomplete="off">';
  inner+='<label>所属</label><select id="f_aff"><option value="">選択してください</option>'+
    affs.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name)+'</option>').join('')+'</select>';
  inner+='<div id="regerr"></div>';
  inner+='<button class="btn" id="toSeat">席をえらぶ →</button>';
  inner+='</div>';
  $('app').innerHTML=inner+footer();
  $('toSeat').onclick=()=>{
    const name=$('f_name').value.trim(); const aff=$('f_aff').value;
    if(!name){ $('regerr').innerHTML='<div class="msg err">お名前を入力してください。</div>'; return; }
    if(!aff){ $('regerr').innerHTML='<div class="msg err">所属を選択してください。</div>'; return; }
    S.form={name, affId:aff}; S.screen='seat'; render();
  };
  wireFooter();
}

/* ---------- 参加者: 席選択（自分のブロックのみ） ---------- */
async function renderSeatPick(){
  const cfg=S.cfg;
  const aff=(cfg.affiliations||[]).find(a=>a.id===S.form.affId);
  const blk=(cfg.layout.blocks||[]).find(b=>b.id===(aff&&aff.block_id));
  if(!aff||!blk){
    $('app').innerHTML='<div class="card"><div class="msg err">この所属の座席ブロックが未設定です。スタッフにお声がけください。</div><button class="btn sec" onclick="S.screen=\'register\';render()">戻る</button></div>';
    return;
  }
  try{ S.regs=await loadRegs(); }catch(e){}
  const rows=cfg.layout.rows||20;
  let grid='';
  for(let r=1;r<=rows;r++){
    let seats='';
    for(let c=1;c<=blk.seats;c++){
      const k=seatKey(blk.id,r,c);
      const taken=regBySeat(k);
      const sel = S.selSeat===k;
      const cls = taken?'seat taken':(sel?'seat pick sel':'seat pick');
      seats+='<div class="'+cls+'" data-k="'+k+'"'+(taken?'':' role="button"')+'>'+ (taken?'×':c) +'</div>';
    }
    grid+='<div class="seatRow"><div class="rowNo">'+r+'列</div><div class="blk">'+seats+'</div></div>';
  }
  let inner='';
  inner+='<div class="card">';
  inner+='<h1>'+esc(blk.name)+'</h1>';
  inner+='<div class="sub">'+esc(S.form.name)+' / '+esc(aff.name)+'　—　空いている席をタップしてください</div>';
  inner+='<div class="stage">舞　台</div>';
  inner+='<div class="seatArea">'+grid+'</div>';
  inner+='<div class="muted center" style="margin-top:8px">× ＝ 登録済み</div>';
  inner+='<div id="pickbar"></div>';
  inner+='<button class="btn sec" id="backReg">← 名前・所属にもどる</button>';
  inner+='</div>';
  $('app').innerHTML=inner+footer();
  $('backReg').onclick=()=>{ S.selSeat=null; S.screen='register'; render(); };
  document.querySelectorAll('.seat.pick').forEach(el=>{
    el.onclick=()=>{ S.selSeat=el.getAttribute('data-k'); render(); };
  });
  if(S.selSeat){
    const [,rr,cc]=S.selSeat.split('-');
    $('pickbar').innerHTML='<div class="msg info">選択中： <b>'+esc(blk.name)+' '+rr+'列'+cc+'番</b></div>'+
      '<button class="btn" id="confirmSeat">この席で登録する</button>';
    $('confirmSeat').onclick=()=>doRegister(blk,parseInt(rr),parseInt(cc),aff);
  }
  wireFooter();
  // 選択中でなければ、他端末の埋まりを反映（軽いポーリング）
  refreshTimer=setInterval(async()=>{ if(S.screen!=='seat'||S.selSeat) return; try{ S.regs=await loadRegs(); render(); }catch(e){} }, 8000);
}

async function doRegister(blk,r,c,aff){
  const btn=$('confirmSeat'); if(btn){ btn.disabled=true; btn.textContent='登録中…'; }
  const k=seatKey(blk.id,r,c);
  try{
    const res=await sbClaim({
      event_id:EVENT, seat_key:k, block_id:blk.id, seat_row:r, seat_col:c,
      affiliation_id:aff.id, affiliation_name:aff.name, name:S.form.name, client_id:clientId()
    });
    if(res.conflict){
      S.selSeat=null; try{S.regs=await loadRegs();}catch(e){}
      render();
      $('pickbar').innerHTML='<div class="msg err">申し訳ありません。その席は今埋まりました。別の席を選んでください。</div>';
      return;
    }
    setMyRec({seat_key:k, reg_id:res.reg.id});
    S.selSeat=null; S.screen='done';
    try{S.regs=await loadRegs();}catch(e){}
    render();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='この席で登録する'; }
    $('pickbar').innerHTML='<div class="msg err">登録に失敗しました。通信環境をご確認のうえ、もう一度お試しください。</div>';
  }
}

/* ---------- 参加者: 完了 / 感想 ---------- */
function renderDone(){
  const cfg=S.cfg, m=myRec();
  const reg = m && S.regs.find(x=>x.seat_key===m.seat_key && x.client_id===clientId());
  if(!reg){ setMyRec(null); S.screen='register'; return render(); }
  let inner='<div class="card center">';
  inner+='<div class="pill" style="background:var(--ok)">登録完了</div>';
  inner+='<h1 style="margin-top:.4em">'+esc(seatLabel(cfg,reg))+'</h1>';
  inner+='<div class="sub">'+esc(reg.name)+' / '+esc(reg.affiliation_name)+'</div>';
  inner+='</div>';

  inner+='<div class="card">';
  inner+='<h2>感想</h2>';
  if(fbOpen(cfg)){
    inner+='<div class="sub">本日の感想をお聞かせください。</div>';
    inner+='<textarea id="fb" placeholder="ご感想をどうぞ">'+esc(reg.feedback||'')+'</textarea>';
    inner+='<div id="fberr"></div>';
    inner+='<button class="btn" id="sendFb">'+(reg.feedback?'感想を更新する':'感想を送信する')+'</button>';
    if(reg.feedback_at) inner+='<div class="muted center" style="margin-top:8px">送信済み</div>';
  }else{
    const t=cfg.feedback_open_time||'21:00';
    inner+='<div class="msg info">感想は <b>'+esc(t)+'</b> から入力できます。この画面を開いたままお待ちください。</div>';
  }
  inner+='</div>';

  inner+='<div class="card"><button class="btn sec" id="redo">登録をやり直す（席を変える）</button></div>';
  $('app').innerHTML=inner+footer();

  if(fbOpen(cfg)){
    $('sendFb').onclick=async()=>{
      const txt=$('fb').value.trim(); const b=$('sendFb'); b.disabled=true; b.textContent='送信中…';
      try{
        await sbPatch('hall_event_regs','id=eq.'+reg.id+'&event_id=eq.'+EVENT,{feedback:txt, feedback_at:new Date().toISOString()});
        S.regs=await loadRegs(); render();
        $('fberr').innerHTML='<div class="msg info">ありがとうございました。送信しました。</div>';
      }catch(e){ b.disabled=false; b.textContent='感想を送信する'; $('fberr').innerHTML='<div class="msg err">送信に失敗しました。もう一度お試しください。</div>'; }
    };
  }
  $('redo').onclick=async()=>{
    if(!confirm('この登録を取り消して、席を選び直しますか？')) return;
    try{ await sbDelete('hall_event_regs','id=eq.'+reg.id+'&event_id=eq.'+EVENT); }catch(e){}
    setMyRec(null); S.regs=await loadRegs(); S.screen='register'; render();
  };
  wireFooter();
  // 感想開放を検知するため、閉じている間は定期チェック
  if(!fbOpen(cfg)){ refreshTimer=setInterval(async()=>{ try{ S.cfg=await loadCfg(); if(fbOpen(S.cfg)){ S.regs=await loadRegs(); render(); } }catch(e){} }, 15000); }
}

/* ============================================================
   スタッフ
   ============================================================ */
function renderStaffLogin(){
  let inner='<div class="card"><h1>スタッフ用</h1><div class="sub">パスコードを入力してください。</div>';
  inner+='<input type="password" id="pass" inputmode="numeric" placeholder="パスコード">';
  inner+='<div id="loginerr"></div>';
  inner+='<button class="btn" id="login">ログイン</button>';
  inner+='<div class="foot"><a id="toPart">← 参加者画面へ</a></div></div>';
  $('app').innerHTML=inner;
  $('login').onclick=()=>{
    if(($('pass').value||'')===String(S.cfg.staff_pass||'')){ S.staffAuthed=true; sessionStorage.setItem('hall_staff','1'); render(); }
    else $('loginerr').innerHTML='<div class="msg err">パスコードが違います。</div>';
  };
  $('pass').onkeydown=e=>{ if(e.key==='Enter') $('login').click(); };
  $('toPart').onclick=()=>{ location.hash=''; S.role='participant'; S.screen='register'; render(); };
}

function renderStaff(){
  const t=S.staffTab;
  let inner='<h1>スタッフ画面 <span class="muted" style="font-weight:400">'+esc(S.cfg.title||'')+'</span></h1>';
  inner+='<div class="tabs">'+
    '<button data-t="map" class="'+(t==='map'?'on':'')+'">座席マップ</button>'+
    '<button data-t="tally" class="'+(t==='tally'?'on':'')+'">集計・感想</button>'+
    '<button data-t="settings" class="'+(t==='settings'?'on':'')+'">設定</button>'+
    '</div><div id="tabbody"></div>';
  $('app').innerHTML=inner;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ S.staffTab=b.getAttribute('data-t'); render(); });
  if(t==='map') staffMap();
  else if(t==='tally') staffTally();
  else staffSettings();
}

async function staffMap(){
  try{ S.regs=await loadRegs(); }catch(e){}
  const cfg=S.cfg, blocks=cfg.layout.blocks||[], rows=cfg.layout.rows||20;
  const total=blocks.reduce((s,b)=>s+b.seats*rows,0);
  const taken=S.regs.length;
  let legend='<div class="legend">'+(cfg.affiliations||[]).map(a=>'<span><i class="dot" style="background:'+a.color+'"></i>'+esc(a.name)+'</span>').join('')+
    (blocks.length?'':'<span class="muted">ブロック未設定</span>')+'</div>';
  let grid='';
  for(let r=1;r<=rows;r++){
    let cells='';
    blocks.forEach((b,bi)=>{
      let bs='';
      for(let c=1;c<=b.seats;c++){
        const k=seatKey(b.id,r,c); const reg=regBySeat(k);
        if(reg){ const col=affColor(cfg,reg.affiliation_id);
          bs+='<div class="seat mapSeat taken" style="background:'+col+';color:#fff;border-color:'+col+'" data-id="'+reg.id+'" role="button"><span class="nm">'+esc((reg.name||'').slice(0,3))+'</span></div>';
        }else{
          bs+='<div class="seat mapSeat" title="'+k+'">'+c+'</div>';
        }
      }
      cells+='<div class="blk">'+bs+'</div>'+(bi<blocks.length-1?'<div class="blkgap"></div>':'');
    });
    grid+='<div class="seatRow"><div class="rowNo">'+r+'列</div>'+cells+'</div>';
  }
  let body='<div class="card">';
  body+='<div class="stat"><div class="box"><div class="n">'+taken+'</div><div class="k">登録</div></div>'+
        '<div class="box"><div class="n">'+total+'</div><div class="k">総座席</div></div>'+
        '<div class="box"><div class="n">'+(total-taken)+'</div><div class="k">空席</div></div></div>';
  body+=legend;
  body+='<div class="stage">舞　台</div>';
  body+='<div class="seatArea">'+grid+'</div>';
  body+='<div class="screen">スクリーン</div>';
  body+='<div class="muted center">自動更新中（5秒ごと）・座席をタップで詳細</div>';
  body+='</div>';
  $('tabbody').innerHTML=body;
  document.querySelectorAll('.mapSeat.taken').forEach(el=>{
    el.onclick=()=>seatDetail(parseInt(el.getAttribute('data-id')));
  });
  refreshTimer=setInterval(async()=>{ if(S.role==='staff'&&S.staffTab==='map'){ try{ S.regs=await loadRegs(); staffMap(); }catch(e){} } }, 5000);
}

function seatDetail(id){
  const reg=S.regs.find(r=>r.id===id); if(!reg) return; const cfg=S.cfg;
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="modal"><h2 style="border:0;padding:0;margin-top:0">'+esc(seatLabel(cfg,reg))+'</h2>'+
    '<p><b>'+esc(reg.name)+'</b><br><span class="muted">'+esc(reg.affiliation_name)+'</span></p>'+
    '<p class="muted">登録: '+new Date(reg.registered_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'</p>'+
    '<p><b>感想:</b><br>'+(reg.feedback?esc(reg.feedback):'<span class="muted">未入力</span>')+'</p>'+
    '<div class="row"><button class="btn sec sm" id="mClose" style="flex:1">閉じる</button>'+
    '<button class="btn danger sm" id="mDel" style="flex:1">この登録を取消</button></div></div>';
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector('#mClose').onclick=()=>ov.remove();
  ov.querySelector('#mDel').onclick=async()=>{
    if(!confirm(reg.name+' さんの登録を取り消します。よろしいですか？')) return;
    try{ await sbDelete('hall_event_regs','id=eq.'+reg.id+'&event_id=eq.'+EVENT); }catch(e){}
    ov.remove(); S.regs=await loadRegs(); staffMap();
  };
}

async function staffTally(){
  try{ S.regs=await loadRegs(); }catch(e){}
  const cfg=S.cfg, blocks=cfg.layout.blocks||[], rows=cfg.layout.rows||20;
  const fbCount=S.regs.filter(r=>r.feedback&&r.feedback.trim()).length;
  // ブロック別
  let byBlock=blocks.map(b=>{ const n=S.regs.filter(r=>r.block_id===b.id).length; return {name:b.name,n,cap:b.seats*rows}; });
  // 所属別
  let byAff=(cfg.affiliations||[]).map(a=>({name:a.name,color:a.color,n:S.regs.filter(r=>r.affiliation_id===a.id).length}));
  let body='<div class="card"><div class="stat">'+
    '<div class="box"><div class="n">'+S.regs.length+'</div><div class="k">登録総数</div></div>'+
    '<div class="box"><div class="n">'+fbCount+'</div><div class="k">感想あり</div></div></div>';
  body+='<button class="btn ghost" id="csv" style="margin-top:12px">CSVをダウンロード</button></div>';

  body+='<div class="card"><h2>ブロック別</h2><table><tr><th>ブロック</th><th>登録</th><th>定員</th></tr>'+
    byBlock.map(b=>'<tr><td>'+esc(b.name)+'</td><td>'+b.n+'</td><td>'+b.cap+'</td></tr>').join('')+'</table></div>';

  if(byAff.length) body+='<div class="card"><h2>所属別</h2><table><tr><th>所属</th><th>登録</th></tr>'+
    byAff.map(a=>'<tr><td><i class="dot" style="background:'+a.color+'"></i> '+esc(a.name)+'</td><td>'+a.n+'</td></tr>').join('')+'</table></div>';

  const fbs=S.regs.filter(r=>r.feedback&&r.feedback.trim()).sort((a,b)=>new Date(b.feedback_at)-new Date(a.feedback_at));
  body+='<div class="card"><h2>感想一覧（'+fbs.length+'件）</h2>';
  if(!fbs.length) body+='<div class="muted">まだありません。</div>';
  else body+='<table><tr><th>席</th><th>名前 / 所属</th><th>感想</th></tr>'+
    fbs.map(r=>'<tr><td>'+esc(seatLabel(cfg,r))+'</td><td>'+esc(r.name)+'<br><span class="muted">'+esc(r.affiliation_name)+'</span></td><td>'+esc(r.feedback)+'</td></tr>').join('')+'</table>';
  body+='</div>';
  $('tabbody').innerHTML=body;
  $('csv').onclick=()=>downloadCSV();
}

function downloadCSV(){
  const cfg=S.cfg;
  const head=['席','ブロック','列','番','名前','所属','登録時刻','感想','感想時刻'];
  const rows=S.regs.slice().sort((a,b)=>(a.block_id+'').localeCompare(b.block_id)||a.seat_row-b.seat_row||a.seat_col-b.seat_col)
    .map(r=>[seatLabel(cfg,r),r.block_id,r.seat_row,r.seat_col,r.name,r.affiliation_name,
      new Date(r.registered_at).toLocaleString('ja-JP'), (r.feedback||''), r.feedback_at?new Date(r.feedback_at).toLocaleString('ja-JP'):'' ]);
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='\uFEFF'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='seats_'+EVENT+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- スタッフ: 設定 ---------- */
function staffSettings(){
  const cfg=S.cfg;
  const blocks=cfg.layout.blocks||[], affs=cfg.affiliations||[];
  const blkOpts=b=>blocks.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===b?' selected':'')+'>'+esc(x.name)+'</option>').join('');
  let body='<div class="card"><h2>イベント</h2>';
  body+='<label>イベント名</label><input type="text" id="c_title" value="'+esc(cfg.title||'')+'">';
  body+='<div class="row"><div><label>開催日</label><input type="date" id="c_date" value="'+esc(cfg.event_date||'')+'"></div>'+
        '<div><label>感想の開放時刻</label><input type="time" id="c_time" value="'+esc(cfg.feedback_open_time||'21:00')+'"></div></div>';
  body+='<label>感想モード</label><select id="c_mode">'+
    ['auto:自動（開催日＋時刻で開放）','open:今すぐ開放','closed:閉じる'].map(o=>{const[v,l]=o.split(':');return '<option value="'+v+'"'+(cfg.feedback_mode===v?' selected':'')+'>'+l+'</option>';}).join('')+'</select>';
  body+='<label>スタッフ用パスコード</label><input type="text" id="c_pass" value="'+esc(cfg.staff_pass||'')+'">';
  body+='</div>';

  body+='<div class="card"><h2>座席レイアウト</h2><div class="muted" style="margin-bottom:6px">列数・ブロック・席数は途中でも変更できます。</div>';
  body+='<label>列数（前→後）</label><input type="number" id="c_rows" min="1" max="60" value="'+(cfg.layout.rows||20)+'">';
  body+='<div id="blkList">';
  blocks.forEach((b,i)=>{
    body+='<div class="cfgblk" data-i="'+i+'"><div class="row">'+
      '<div style="flex:2"><label>ブロック名</label><input type="text" class="b_name" value="'+esc(b.name)+'"></div>'+
      '<div style="flex:1"><label>席数</label><input type="number" class="b_seats" min="1" max="30" value="'+b.seats+'"></div>'+
      '<div style="flex:0 0 auto;min-width:auto"><label>色</label><input type="color" class="b_color" value="'+esc(b.color||'#2563eb')+'" style="width:44px;height:44px;padding:2px"></div>'+
      '<button class="x b_del" style="align-self:flex-end">削除</button></div>'+
      '<div class="muted">ID: '+esc(b.id)+'</div></div>';
  });
  body+='</div><button class="btn sec sm" id="addBlk" style="margin-top:10px">＋ ブロックを追加</button></div>';

  body+='<div class="card"><h2>所属</h2><div class="muted" style="margin-bottom:6px">所属ごとに座るブロックを割り当てます（同じブロックに複数の所属も可）。</div>';
  body+='<div id="affList">';
  affs.forEach((a,i)=>{
    body+='<div class="cfgblk" data-i="'+i+'"><div class="row">'+
      '<div style="flex:2"><label>所属名</label><input type="text" class="a_name" value="'+esc(a.name)+'"></div>'+
      '<div style="flex:2"><label>ブロック</label><select class="a_block">'+blkOpts(a.block_id)+'</select></div>'+
      '<div style="flex:0 0 auto;min-width:auto"><label>色</label><input type="color" class="a_color" value="'+esc(a.color||'#2563eb')+'" style="width:44px;height:44px;padding:2px"></div>'+
      '<button class="x a_del" style="align-self:flex-end">削除</button></div></div>';
  });
  body+='</div>';
  if(!blocks.length) body+='<div class="msg warn">先にブロックを追加・保存してください。</div>';
  body+='<button class="btn sec sm" id="addAff" style="margin-top:10px"'+(blocks.length?'':' disabled')+'>＋ 所属を追加</button></div>';

  body+='<div id="saveerr"></div><button class="btn" id="saveCfg">設定を保存</button>';

  body+='<div class="card" style="margin-top:18px;border-color:#fecaca"><h2 style="border-color:var(--danger)">危険な操作</h2>'+
    '<div class="muted">全ての登録データを削除します（本番前のテスト消去用）。</div>'+
    '<button class="btn danger" id="resetAll">全登録を削除する</button></div>';

  body+='<div class="foot"><a id="showPart">参加者用URL / QRを表示</a></div>';
  $('tabbody').innerHTML=body;

  // ブロック追加/削除
  $('addBlk').onclick=()=>{ const id='X'+Date.now().toString(36).slice(-4); (S.cfg.layout.blocks=S.cfg.layout.blocks||[]).push({id,name:'新ブロック',seats:5,color:'#0ea5e9'}); pullSettingsToState(); render(); };
  document.querySelectorAll('.b_del').forEach((btn,i)=>btn.onclick=()=>{ pullSettingsToState(); S.cfg.layout.blocks.splice(i,1); render(); });
  // 所属追加/削除
  $('addAff').onclick=()=>{ if(!(S.cfg.layout.blocks||[]).length) return; pullSettingsToState(); const id='aff'+Date.now().toString(36).slice(-5); (S.cfg.affiliations=S.cfg.affiliations||[]).push({id,name:'新しい所属',block_id:S.cfg.layout.blocks[0].id,color:'#8b5cf6'}); render(); };
  document.querySelectorAll('.a_del').forEach((btn,i)=>btn.onclick=()=>{ pullSettingsToState(); S.cfg.affiliations.splice(i,1); render(); });

  $('saveCfg').onclick=saveSettings;
  $('resetAll').onclick=async()=>{
    const p=prompt('全ての登録を削除します。よろしければスタッフパスコードを入力してください。');
    if(p===null) return;
    if(p!==String(S.cfg.staff_pass||'')){ alert('パスコードが違います。'); return; }
    try{ await sbDelete('hall_event_regs','event_id=eq.'+EVENT); alert('削除しました。'); S.regs=await loadRegs(); }catch(e){ alert('削除に失敗しました。'); }
  };
  $('showPart').onclick=showPartURL;
}

// 画面の入力値を S.cfg に取り込む（再描画で消えないように）
function pullSettingsToState(){
  const cfg=S.cfg; if(!$('c_title')) return;
  cfg.title=$('c_title').value; cfg.event_date=$('c_date').value||null;
  cfg.feedback_open_time=$('c_time').value||'21:00'; cfg.feedback_mode=$('c_mode').value;
  cfg.staff_pass=$('c_pass').value; cfg.layout.rows=parseInt($('c_rows').value)||20;
  const bn=document.querySelectorAll('.b_name'), bs=document.querySelectorAll('.b_seats'), bc=document.querySelectorAll('.b_color');
  (cfg.layout.blocks||[]).forEach((b,i)=>{ if(bn[i]){ b.name=bn[i].value; b.seats=parseInt(bs[i].value)||1; b.color=bc[i].value; } });
  const an=document.querySelectorAll('.a_name'), ab=document.querySelectorAll('.a_block'), ac=document.querySelectorAll('.a_color');
  (cfg.affiliations||[]).forEach((a,i)=>{ if(an[i]){ a.name=an[i].value; a.block_id=ab[i].value; a.color=ac[i].value; } });
}

async function saveSettings(){
  pullSettingsToState(); const cfg=S.cfg; const b=$('saveCfg'); b.disabled=true; b.textContent='保存中…';
  try{
    await sbPatch('hall_event_config','event_id=eq.'+EVENT,{
      title:cfg.title, event_date:cfg.event_date, feedback_open_time:cfg.feedback_open_time,
      feedback_mode:cfg.feedback_mode, staff_pass:cfg.staff_pass,
      layout:cfg.layout, affiliations:cfg.affiliations, updated_at:new Date().toISOString()
    });
    S.cfg=await loadCfg(); render();
    $('saveerr') && ($('saveerr').innerHTML='');
    alert('保存しました。');
  }catch(e){ b.disabled=false; b.textContent='設定を保存'; alert('保存に失敗しました: '+e.message); }
}

function showPartURL(){
  const url=location.origin+location.pathname;
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="modal center"><h2 style="border:0;padding:0;margin-top:0">参加者用URL</h2>'+
    '<div id="qr" style="display:flex;justify-content:center;margin:10px 0"></div>'+
    '<div style="word-break:break-all;background:#f3f4f6;padding:10px;border-radius:8px;font-size:.85rem">'+esc(url)+'</div>'+
    '<div class="row" style="margin-top:12px"><button class="btn sec sm" id="cp" style="flex:1">URLをコピー</button>'+
    '<button class="btn sm" id="cl" style="flex:1">閉じる</button></div></div>';
  document.body.appendChild(ov);
  try{ if(window.QRCode){ new QRCode(ov.querySelector('#qr'),{text:url,width:180,height:180}); } else { ov.querySelector('#qr').innerHTML='<span class="muted">QRライブラリ未読込</span>'; } }catch(e){}
  ov.querySelector('#cl').onclick=()=>ov.remove();
  ov.querySelector('#cp').onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(url); ov.querySelector('#cp').textContent='コピーしました'; };
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
}

/* ---------- 共通フッター ---------- */
function footer(){ return '<div class="foot"><a id="staffLink">スタッフ用ページ</a></div>'; }
function wireFooter(){ const l=$('staffLink'); if(l) l.onclick=()=>{ location.hash='staff'; S.role='staff'; S.staffAuthed=(sessionStorage.getItem('hall_staff')==='1'); render(); }; }

/* 起動 */
boot();
</script>

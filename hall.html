<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>座席登録</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --accent-d:#1d4ed8; --ok:#16a34a; --danger:#dc2626;
    --empty:#f9fafb; --empty-bd:#cbd5e1; --taken:#e5e7eb; --taken-ink:#9ca3af;
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 64px}
  .wrap.wide{max-width:1100px}
  h1{font-size:1.25rem;margin:.2em 0 .1em}
  h2{font-size:1.05rem;margin:1.2em 0 .5em;border-left:4px solid var(--accent);padding-left:.5em}
  .sub{color:var(--sub);font-size:.9rem;margin:.1em 0 1em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  label{display:block;font-weight:600;font-size:.92rem;margin:.9em 0 .3em}
  .opt{font-weight:400;color:var(--sub);font-size:.85rem}
  input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],input[type=email],select,textarea{
    width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:1rem;background:#fff;color:var(--ink)}
  textarea{min-height:120px;resize:vertical}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;width:100%;padding:14px;border:0;border-radius:12px;
    background:var(--accent);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:14px}
  .btn:active{background:var(--accent-d)}
  .btn[disabled]{background:#9ca3af;cursor:not-allowed}
  .btn.ghost{background:#eef2ff;color:var(--accent-d)}
  .btn.sec{background:#f3f4f6;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:var(--danger)}
  .btn.sm{width:auto;padding:8px 14px;font-size:.9rem;margin:0}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:120px}
  .msg{padding:12px 14px;border-radius:10px;font-size:.92rem;margin:10px 0}
  .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .msg.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  .msg.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
  .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;color:#fff}
  .center{text-align:center}
  .muted{color:var(--sub);font-size:.85rem}
  .stage{background:#111827;color:#fff;text-align:center;border-radius:8px;padding:6px;font-weight:700;letter-spacing:.3em;margin:6px 0 12px}
  .screen{background:#e5e7eb;color:#374151;text-align:center;border-radius:8px;padding:6px;font-weight:700;letter-spacing:.3em;margin:12px 0}
  .ticketno{font-size:2.2rem;font-weight:800;letter-spacing:.15em;font-variant-numeric:tabular-nums}
  .kv{width:100%;border-collapse:collapse;font-size:.95rem}
  .kv td{padding:6px 0;border-bottom:1px solid #f1f5f9}
  .kv td:last-child{text-align:right;font-weight:600}
  .seatbox{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
  .match-ok{color:var(--ok);font-size:.85rem} .match-ng{color:var(--danger);font-size:.85rem}
  .seatArea{overflow-x:auto;padding:6px 2px}
  .seatRow{display:flex;align-items:center;gap:14px;margin:5px 0;width:max-content}
  .rowNo{width:34px;flex:0 0 34px;text-align:center;font-size:.75rem;color:var(--sub)}
  .blk{display:flex;gap:5px}
  .seat{width:30px;height:26px;border-radius:5px;border:1px solid var(--empty-bd);background:var(--empty);
    display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#94a3b8;flex:0 0 auto;overflow:hidden}
  .blkgap{width:16px;flex:0 0 16px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0}
  .legend span{font-size:.82rem;display:inline-flex;align-items:center;gap:5px}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block}
  .tabs{display:flex;gap:6px;margin:6px 0 14px}
  .tabs button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;color:var(--sub);cursor:pointer}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stat{display:flex;gap:10px;flex-wrap:wrap}
  .stat .box{flex:1;min-width:110px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .n{font-size:1.6rem;font-weight:800}
  .stat .k{font-size:.8rem;color:var(--sub)}
  table.list{width:100%;border-collapse:collapse;font-size:.9rem}
  table.list th,table.list td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
  table.list th{color:var(--sub);font-weight:700}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .foot{margin-top:24px;text-align:center}
  .foot a{color:var(--sub);font-size:.8rem;text-decoration:underline;cursor:pointer}
  .cfgblk{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
  .x{flex:0 0 auto;min-width:auto;width:auto;background:#fee2e2;color:#b91c1c;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="card center">読み込み中…</div></div>
<script>
/* ===== ホール座席登録アプリ hall.html v2 ===== */
const APP_VERSION = 'hall-2.0.0';
const SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const REST = SB_URL + '/rest/v1/';
const EVENT = 'main';
const H = () => ({ 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY });

async function sbGet(t, q){ const r = await fetch(REST+t+'?'+q, {headers:H()}); if(!r.ok) throw new Error('GET '+t+' '+r.status); return r.json(); }
async function sbPatch(t, q, body){ const r = await fetch(REST+t+'?'+q, {method:'PATCH', headers:{...H(),'Content-Type':'application/json','Prefer':'return=representation'}, body:JSON.stringify(body)}); if(!r.ok) throw new Error('PATCH '+t+' '+r.status); return r.json(); }
async function sbDelete(t, q){ const r = await fetch(REST+t+'?'+q, {method:'DELETE', headers:{...H(),'Prefer':'return=representation'}}); if(!r.ok) throw new Error('DELETE '+t+' '+r.status); return r.json(); }
async function sbInsert(body){ const r = await fetch(REST+'hall_event_regs', {method:'POST', headers:{...H(),'Content-Type':'application/json','Prefer':'return=representation'}, body:JSON.stringify(body)}); if(r.status===409) return {conflict:true}; if(!r.ok){ const tx=await r.text(); throw new Error('INSERT '+r.status+' '+tx); } const d=await r.json(); return {reg:d[0]}; }

const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clientId(){ let c=localStorage.getItem('hall_cid'); if(!c){ c='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); localStorage.setItem('hall_cid',c);} return c; }
function myRec(){ try{ return JSON.parse(localStorage.getItem('hall_v2_'+EVENT)||'null'); }catch(e){ return null; } }
function setMyRec(o){ if(o) localStorage.setItem('hall_v2_'+EVENT, JSON.stringify(o)); else localStorage.removeItem('hall_v2_'+EVENT); }
function seatKey(b,r,c){ return b+'-'+r+'-'+c; }
function blockOf(id){ return (S.cfg.layout.blocks||[]).find(b=>b.id===id); }
function catOf(id){ return (S.cfg.categories||[]).find(c=>c.id===id); }
function catColor(id){ const c=catOf(id); return c?c.color:'#64748b'; }
function seatLabel(reg){ const b=blockOf(reg.block_id); return (b?b.name:reg.block_id)+' '+reg.seat_row+'列'+reg.seat_col+'番'; }
function emailRequired(band){ return band && band!=='中学生以下'; }
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
const TYPO={'gmial.com':'gmail.com','gmai.com':'gmail.com','gmail.co':'gmail.com','gmaill.com':'gmail.com','gnail.com':'gmail.com','yahooo.co.jp':'yahoo.co.jp','yaho.co.jp':'yahoo.co.jp','yhoo.co.jp':'yahoo.co.jp','icloud.co':'icloud.com','outlook.co':'outlook.com','hotmial.com':'hotmail.com'};
function typoSuggest(e){ const m=/@(.+)$/.exec(e||''); if(!m) return null; const d=m[1].toLowerCase(); return TYPO[d]? e.slice(0,m.index+1)+TYPO[d] : null; }
function fbOpen(cfg){ if(cfg.feedback_mode==='open') return true; if(cfg.feedback_mode==='closed') return false; if(!cfg.event_date) return false; const at=Date.parse(cfg.event_date+'T'+(cfg.feedback_open_time||'21:00')+':00+09:00'); return !isNaN(at) && Date.now()>=at; }

const S = { role:'participant', screen:'loading', cfg:null, regs:[], form:{}, staffTab:'map', staffAuthed:false };
let refreshTimer=null; function stopTimer(){ if(refreshTimer){ clearInterval(refreshTimer); refreshTimer=null; } }

async function loadCfg(){ const d=await sbGet('hall_event_config','event_id=eq.'+EVENT+'&select=*'); if(!d.length) throw new Error('config-missing'); const c=d[0]; if(!c.layout) c.layout={blocks:[],rows:20}; if(!c.categories) c.categories=[]; if(!c.bands) c.bands=['中学生以下','高校生','大学生','社会人']; return c; }
async function loadRegs(){ return sbGet('hall_event_regs','event_id=eq.'+EVENT+'&select=*&order=registered_at.asc'); }
function takenSet(){ return new Set(S.regs.map(r=>r.seat_key)); }
function nextFreeSeat(block){ const taken=takenSet(); const rows=S.cfg.layout.rows||20; for(let r=1;r<=rows;r++){ for(let c=1;c<=(block.seats||0);c++){ const k=seatKey(block.id,r,c); if(!taken.has(k)) return {row:r,col:c,key:k}; } } return null; }

async function boot(){
  try{ S.cfg=await loadCfg(); S.regs=await loadRegs(); }
  catch(e){
    if(String(e.message).includes('config-missing')||String(e.message).includes('400')){
      $('app').innerHTML='<div class="card"><h1>準備ができていません</h1><div class="msg err">初期設定が見つかりません。Supabaseで <b>hall_event.sql</b> と <b>hall_v2_migration.sql</b> を実行してから開き直してください。</div></div>'; return;
    }
    $('app').innerHTML='<div class="card"><h1>通信エラー</h1><div class="msg err">'+esc(e.message)+'</div><button class="btn" onclick="location.reload()">再読み込み</button></div>'; return;
  }
  if(location.hash.indexOf('staff')>=0){ S.role='staff'; S.staffAuthed=(sessionStorage.getItem('hall_staff')==='1'); return render(); }
  const m=myRec();
  if(m && m.reg_id){ const r=S.regs.find(x=>x.id===m.reg_id); if(r){ S.screen='ticket'; return render(); } }
  S.screen='register'; render();
}

function render(){
  stopTimer();
  $('app').className='wrap'+(S.role==='staff'&&S.staffAuthed?' wide':'');
  if(S.role==='staff') return S.staffAuthed?renderStaff():renderStaffLogin();
  if(S.screen==='ticket') return renderTicket();
  return renderRegister();
}

/* ---------- 参加者：登録 ---------- */
function renderRegister(){
  const cfg=S.cfg, cats=cfg.categories||[], bands=cfg.bands||[];
  if(!cats.length){ $('app').innerHTML='<div class="card"><h1>'+esc(cfg.title||'座席登録')+'</h1><div class="msg warn">ただいま準備中です。会場スタッフにお声がけください。</div></div>'+footer(); return wireFooter(); }
  const f=S.form;
  let h='<div class="card"><h1>'+esc(cfg.title||'座席登録')+'</h1><div class="sub">お名前と区分を入れて登録してください。席は自動で割り当てられます。</div>';
  h+='<label>お名前</label><input type="text" id="f_name" value="'+esc(f.name||'')+'" placeholder="山田 太郎" autocomplete="name">';
  h+='<label>カテゴリ</label><select id="f_cat"><option value="">選択してください</option>'+cats.map(c=>'<option value="'+esc(c.id)+'"'+(f.catId===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>';
  h+='<label>区分</label><select id="f_band"><option value="">選択してください</option>'+bands.map(b=>'<option value="'+esc(b)+'"'+(f.band===b?' selected':'')+'>'+esc(b)+'</option>').join('')+'</select>';
  h+='<div id="refwrap"></div>';
  h+='<div id="mailwrap"></div>';
  h+='<div id="regerr"></div><button class="btn" id="doReg">登録してチケットを発行</button></div>';
  h+='<div class="card center"><div class="muted">登録がお済みの方</div><button class="btn sec sm" id="recover" style="margin-top:8px">受付番号で表示</button></div>';
  $('app').innerHTML=h+footer();

  const paint=()=>{
    const cat=$('f_cat').value, band=$('f_band').value;
    $('refwrap').innerHTML = (cat && cat!=='cur') ? '<label>紹介者（つながり） <span class="opt">任意</span></label><input type="text" id="f_ref" value="'+esc(f.referrer||'')+'" placeholder="例）◯◯先生の紹介 / 卒業生 田中">' : '';
    if(!band){ $('mailwrap').innerHTML=''; return; }
    if(emailRequired(band)){
      $('mailwrap').innerHTML='<label>メールアドレス</label><input type="email" id="f_mail" value="'+esc(f.email||'')+'" placeholder="taro@example.com" autocomplete="email">'
        +'<label>メールアドレス（確認）</label><input type="email" id="f_mail2" value="'+esc(f.email2||'')+'" placeholder="もう一度入力"><div id="mailchk"></div>';
      const chk=()=>{ const a=$('f_mail').value.trim(), b=$('f_mail2').value.trim(); let m=''; const t=typoSuggest(a); if(t) m+='<div class="msg warn" style="margin:6px 0">もしかして <b>'+esc(t)+'</b> ？ <a href="#" id="fixmail" style="color:#92400e">修正</a></div>'; if(a&&b){ m+= a===b?'<div class="match-ok">✓ 一致しています</div>':'<div class="match-ng">✕ 一致しません</div>'; } $('mailchk').innerHTML=m; const fx=$('fixmail'); if(fx) fx.onclick=(e)=>{ e.preventDefault(); $('f_mail').value=t; f.email=t; chk(); }; };
      $('f_mail').oninput=()=>{ f.email=$('f_mail').value; chk(); }; $('f_mail2').oninput=()=>{ f.email2=$('f_mail2').value; chk(); }; chk();
    }else{
      const no=f.noEmail?'checked':'';
      $('mailwrap').innerHTML='<label>メールアドレス <span class="opt">任意（中学生以下）</span></label>'
        +'<div style="margin:2px 0 8px"><label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="f_noemail" style="width:auto" '+no+'> メールを持っていない（受付番号で受け取る）</label></div>'
        +'<div id="mailopt"></div>';
      const drawOpt=()=>{ if($('f_noemail').checked){ f.noEmail=true; $('mailopt').innerHTML='<div class="muted">受付番号で受け取ります。</div>'; return; } f.noEmail=false; $('mailopt').innerHTML='<input type="email" id="f_mail" value="'+esc(f.email||'')+'" placeholder="任意：連絡用メール"><label style="margin-top:8px">確認</label><input type="email" id="f_mail2" value="'+esc(f.email2||'')+'" placeholder="もう一度入力"><div id="mailchk2" style="margin-top:4px"></div>'; const chk2=()=>{ const a=$('f_mail').value.trim(),b=$('f_mail2').value.trim(); $('mailchk2').innerHTML=(a&&b)?(a===b?'<div class="match-ok">✓ 一致</div>':'<div class="match-ng">✕ 一致しません</div>'):''; }; $('f_mail').oninput=()=>{f.email=$('f_mail').value;chk2();}; $('f_mail2').oninput=()=>{f.email2=$('f_mail2').value;chk2();}; chk2(); };
      $('f_noemail').onchange=drawOpt; drawOpt();
    }
  };
  $('f_cat').onchange=()=>{ f.catId=$('f_cat').value; paint(); };
  $('f_band').onchange=()=>{ f.band=$('f_band').value; paint(); };
  $('f_name').oninput=()=>{ f.name=$('f_name').value; };
  paint();
  $('doReg').onclick=doRegister;
  $('recover').onclick=recover;
  wireFooter();
}

async function doRegister(){
  const f=S.form; const err=$('regerr'); err.innerHTML='';
  const name=($('f_name').value||'').trim();
  const catId=$('f_cat').value, band=$('f_band').value;
  const refEl=$('f_ref'); const referrer=refEl?refEl.value.trim():'';
  if(!name) return err.innerHTML='<div class="msg err">お名前を入力してください。</div>';
  if(!catId) return err.innerHTML='<div class="msg err">カテゴリを選択してください。</div>';
  if(!band) return err.innerHTML='<div class="msg err">区分を選択してください。</div>';
  let email='';
  const mailEl=$('f_mail'), mail2El=$('f_mail2');
  if(emailRequired(band)){
    email=(mailEl?mailEl.value:'').trim(); const e2=(mail2El?mail2El.value:'').trim();
    if(!email) return err.innerHTML='<div class="msg err">メールアドレスを入力してください。</div>';
    if(!validEmail(email)) return err.innerHTML='<div class="msg err">メールアドレスの形式をご確認ください。</div>';
    if(email!==e2) return err.innerHTML='<div class="msg err">確認用メールアドレスが一致しません。</div>';
  }else{
    if(!(f.noEmail)){ email=(mailEl?mailEl.value:'').trim(); const e2=(mail2El?mail2El.value:'').trim(); if(email){ if(!validEmail(email)) return err.innerHTML='<div class="msg err">メールアドレスの形式をご確認ください。</div>'; if(email!==e2) return err.innerHTML='<div class="msg err">確認用メールアドレスが一致しません。</div>'; } }
  }
  const cat=catOf(catId); const block=cat?blockOf(cat.block_id):null;
  if(!block) return err.innerHTML='<div class="msg err">このカテゴリの座席エリアが未設定です。スタッフにお声がけください。</div>';

  const btn=$('doReg'); btn.disabled=true; btn.textContent='登録中…';
  try{
    let reg=null;
    for(let attempt=0; attempt<6 && !reg; attempt++){
      S.regs=await loadRegs();
      const seat=nextFreeSeat(block);
      if(!seat){ btn.disabled=false; btn.textContent='登録してチケットを発行'; return err.innerHTML='<div class="msg err">'+esc(block.name)+'は満席です。受付にお声がけください。</div>'; }
      const res=await sbInsert({ event_id:EVENT, seat_key:seat.key, block_id:block.id, seat_row:seat.row, seat_col:seat.col,
        category_id:catId, category_name:cat.name, band:band, referrer:referrer||null, email:email||null, name:name, client_id:clientId() });
      if(res.conflict) continue;
      reg=res.reg;
    }
    if(!reg){ btn.disabled=false; btn.textContent='登録してチケットを発行'; return err.innerHTML='<div class="msg err">混雑のため登録できませんでした。もう一度お試しください。</div>'; }
    const receipt='R-'+String(reg.id).padStart(3,'0');
    try{ const up=await sbPatch('hall_event_regs','id=eq.'+reg.id+'&event_id=eq.'+EVENT,{receipt_no:receipt}); reg=up[0]||Object.assign(reg,{receipt_no:receipt}); }catch(e){ reg.receipt_no=receipt; }
    setMyRec({reg_id:reg.id, receipt_no:reg.receipt_no}); S.form={};
    S.regs=await loadRegs(); S.screen='ticket'; render();
  }catch(e){ btn.disabled=false; btn.textContent='登録してチケットを発行'; err.innerHTML='<div class="msg err">登録に失敗しました。通信環境をご確認のうえ、もう一度お試しください。</div>'; }
}

async function recover(){
  const no=prompt('受付番号を入力してください（例：R-032）'); if(no===null) return;
  const q=no.trim(); if(!q) return;
  try{ const d=await sbGet('hall_event_regs','event_id=eq.'+EVENT+'&receipt_no=eq.'+encodeURIComponent(q)+'&select=*'); if(!d.length){ alert('その受付番号は見つかりませんでした。'); return; } const reg=d[0]; setMyRec({reg_id:reg.id, receipt_no:reg.receipt_no}); S.regs=await loadRegs(); S.screen='ticket'; render(); }catch(e){ alert('照会に失敗しました。'); }
}

/* ---------- 参加者：チケット ---------- */
function renderTicket(){
  const cfg=S.cfg, m=myRec(); const reg=m&&S.regs.find(x=>x.id===m.reg_id);
  if(!reg){ setMyRec(null); S.screen='register'; return render(); }
  let h='<div class="card center"><div class="pill" style="background:var(--ok)">登録完了</div>';
  h+='<div class="muted" style="margin-top:10px">受付番号</div><div class="ticketno">'+esc(reg.receipt_no||'-')+'</div></div>';
  h+='<div class="card"><table class="kv">'
    +'<tr><td>お名前</td><td>'+esc(reg.name)+'</td></tr>'
    +'<tr><td>カテゴリ</td><td>'+esc(reg.category_name||'')+'</td></tr>'
    +'<tr><td>区分</td><td>'+esc(reg.band||'')+'</td></tr>'
    +(reg.email?'<tr><td>メール</td><td>'+esc(reg.email)+'</td></tr>':'')
    +'</table><div class="seatbox"><div class="muted">あなたの席</div><div style="font-size:1.4rem;font-weight:800">'+(reg.seat_key?esc(seatLabel(reg)):'追ってご案内します')+'</div></div>';
  h+='<div class="msg info" style="margin-top:12px">この受付番号は席の再確認に使います。<b>スクリーンショット推奨</b>。別の端末でも「受付番号で表示」から呼び出せます。</div></div>';

  h+='<div class="card"><h2>感想</h2>';
  if(fbOpen(cfg)){
    h+='<div class="sub">本日の感想をお聞かせください。</div><textarea id="fb" placeholder="ご感想をどうぞ">'+esc(reg.feedback||'')+'</textarea><div id="fberr"></div><button class="btn" id="sendFb">'+(reg.feedback?'感想を更新する':'感想を送信する')+'</button>';
    if(reg.feedback_at) h+='<div class="muted center" style="margin-top:8px">送信済み</div>';
  }else{ h+='<div class="msg info">感想は <b>'+esc(cfg.feedback_open_time||'21:00')+'</b> から入力できます。この画面のままお待ちください。</div>'; }
  h+='</div><div class="card"><button class="btn sec" id="redo">登録をやり直す</button></div>';
  $('app').innerHTML=h+footer();

  if(fbOpen(cfg)){ $('sendFb').onclick=async()=>{ const t=$('fb').value.trim(); const b=$('sendFb'); b.disabled=true; b.textContent='送信中…'; try{ await sbPatch('hall_event_regs','id=eq.'+reg.id+'&event_id=eq.'+EVENT,{feedback:t,feedback_at:new Date().toISOString()}); S.regs=await loadRegs(); render(); }catch(e){ b.disabled=false; b.textContent='感想を送信する'; $('fberr').innerHTML='<div class="msg err">送信に失敗しました。</div>'; } }; }
  $('redo').onclick=async()=>{ if(!confirm('この登録を取り消して、最初からやり直しますか？')) return; try{ await sbDelete('hall_event_regs','id=eq.'+reg.id+'&event_id=eq.'+EVENT); }catch(e){} setMyRec(null); S.regs=await loadRegs(); S.screen='register'; render(); };
  wireFooter();
  if(!fbOpen(cfg)) refreshTimer=setInterval(async()=>{ try{ S.cfg=await loadCfg(); if(fbOpen(S.cfg)){ S.regs=await loadRegs(); render(); } }catch(e){} },15000);
}

/* ---------- スタッフ ---------- */
function renderStaffLogin(){
  $('app').innerHTML='<div class="card"><h1>スタッフ用</h1><div class="sub">パスコードを入力してください。</div><input type="password" id="pass" inputmode="numeric" placeholder="パスコード"><div id="loginerr"></div><button class="btn" id="login">ログイン</button><div class="foot"><a id="toPart">← 参加者画面へ</a></div></div>';
  $('login').onclick=()=>{ if(($('pass').value||'')===String(S.cfg.staff_pass||'')){ S.staffAuthed=true; sessionStorage.setItem('hall_staff','1'); render(); } else $('loginerr').innerHTML='<div class="msg err">パスコードが違います。</div>'; };
  $('pass').onkeydown=e=>{ if(e.key==='Enter') $('login').click(); };
  $('toPart').onclick=()=>{ location.hash=''; S.role='participant'; S.screen='register'; render(); };
}
function renderStaff(){
  const t=S.staffTab;
  let h='<h1>スタッフ画面 <span class="muted" style="font-weight:400">'+esc(S.cfg.title||'')+'</span></h1>';
  h+='<div class="tabs"><button data-t="map" class="'+(t==='map'?'on':'')+'">座席マップ</button><button data-t="tally" class="'+(t==='tally'?'on':'')+'">集計・感想</button><button data-t="settings" class="'+(t==='settings'?'on':'')+'">設定</button></div><div id="tabbody"></div>';
  $('app').innerHTML=h;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ S.staffTab=b.getAttribute('data-t'); render(); });
  if(t==='map') staffMap(); else if(t==='tally') staffTally(); else staffSettings();
}
async function staffMap(){
  try{ S.regs=await loadRegs(); }catch(e){}
  const cfg=S.cfg, blocks=cfg.layout.blocks||[], rows=cfg.layout.rows||20;
  const total=blocks.reduce((s,b)=>s+(b.seats||0)*rows,0), taken=S.regs.length;
  const bySeat={}; S.regs.forEach(r=>bySeat[r.seat_key]=r);
  let legend='<div class="legend">'+(cfg.categories||[]).map(c=>'<span><i class="dot" style="background:'+c.color+'"></i>'+esc(c.name)+'</span>').join('')+'</div>';
  let grid='';
  for(let r=1;r<=rows;r++){ let cells='';
    blocks.forEach((b,bi)=>{ let bs=''; for(let c=1;c<=(b.seats||0);c++){ const reg=bySeat[seatKey(b.id,r,c)]; if(reg){ const col=catColor(reg.category_id); bs+='<div class="seat" style="background:'+col+';color:#fff;border-color:'+col+';cursor:pointer" data-id="'+reg.id+'" title="'+esc((reg.name||'')+' / '+(reg.category_name||''))+'">'+esc((reg.name||'').slice(0,2))+'</div>'; } else { bs+='<div class="seat">'+c+'</div>'; } }
      cells+='<div class="blk">'+bs+'</div>'+(bi<blocks.length-1?'<div class="blkgap"></div>':''); });
    grid+='<div class="seatRow"><div class="rowNo">'+r+'列</div>'+cells+'</div>'; }
  let body='<div class="card"><div class="stat"><div class="box"><div class="n">'+taken+'</div><div class="k">登録</div></div><div class="box"><div class="n">'+total+'</div><div class="k">総座席</div></div><div class="box"><div class="n">'+(total-taken)+'</div><div class="k">空席</div></div></div>'+legend
    +'<div class="stage">舞　台</div><div class="seatArea">'+grid+'</div><div class="screen">スクリーン</div><div class="muted center">自動更新（5秒）・座席タップで詳細</div></div>';
  $('tabbody').innerHTML=body;
  document.querySelectorAll('.seat[data-id]').forEach(el=>el.onclick=()=>seatDetail(parseInt(el.getAttribute('data-id'))));
  refreshTimer=setInterval(async()=>{ if(S.role==='staff'&&S.staffTab==='map'){ try{ S.regs=await loadRegs(); staffMap(); }catch(e){} } },5000);
}
function seatDetail(id){
  const reg=S.regs.find(r=>r.id===id); if(!reg) return;
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="modal"><h2 style="border:0;padding:0;margin-top:0">'+esc(seatLabel(reg))+'</h2>'
    +'<table class="kv"><tr><td>受付番号</td><td>'+esc(reg.receipt_no||'-')+'</td></tr><tr><td>お名前</td><td>'+esc(reg.name)+'</td></tr><tr><td>カテゴリ</td><td>'+esc(reg.category_name||'')+'</td></tr><tr><td>区分</td><td>'+esc(reg.band||'')+'</td></tr>'+(reg.referrer?'<tr><td>紹介者</td><td>'+esc(reg.referrer)+'</td></tr>':'')+(reg.email?'<tr><td>メール</td><td>'+esc(reg.email)+'</td></tr>':'')+'</table>'
    +'<div style="margin:10px 0"><b>感想:</b><br>'+(reg.feedback?esc(reg.feedback):'<span class="muted">未入力</span>')+'</div>'
    +'<div class="row"><button class="btn sec sm" id="mc" style="flex:1">閉じる</button><button class="btn danger sm" id="md" style="flex:1">この登録を取消</button></div></div>';
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector('#mc').onclick=()=>ov.remove();
  ov.querySelector('#md').onclick=async()=>{ if(!confirm(reg.name+' さんの登録を取り消します。よろしいですか？')) return; try{ await sbDelete('hall_event_regs','id=eq.'+reg.id+'&event_id=eq.'+EVENT); }catch(e){} ov.remove(); S.regs=await loadRegs(); staffMap(); };
}
async function staffTally(){
  try{ S.regs=await loadRegs(); }catch(e){}
  const cfg=S.cfg, cats=cfg.categories||[]; const fb=S.regs.filter(r=>r.feedback&&r.feedback.trim());
  let body='<div class="card"><div class="stat"><div class="box"><div class="n">'+S.regs.length+'</div><div class="k">登録総数</div></div><div class="box"><div class="n">'+fb.length+'</div><div class="k">感想あり</div></div></div><button class="btn ghost" id="csv" style="margin-top:12px">CSVをダウンロード</button></div>';
  body+='<div class="card"><h2>カテゴリ別</h2><table class="list"><tr><th>カテゴリ</th><th>登録</th></tr>'+cats.map(c=>'<tr><td><i class="dot" style="background:'+c.color+'"></i> '+esc(c.name)+'</td><td>'+S.regs.filter(r=>r.category_id===c.id).length+'</td></tr>').join('')+'</table></div>';
  const bands=cfg.bands||[]; body+='<div class="card"><h2>区分別</h2><table class="list"><tr><th>区分</th><th>登録</th></tr>'+bands.map(b=>'<tr><td>'+esc(b)+'</td><td>'+S.regs.filter(r=>r.band===b).length+'</td></tr>').join('')+'</table></div>';
  body+='<div class="card"><h2>感想一覧（'+fb.length+'件）</h2>'+(fb.length?('<table class="list"><tr><th>席</th><th>名前/カテゴリ</th><th>感想</th></tr>'+fb.slice().sort((a,b)=>new Date(b.feedback_at||0)-new Date(a.feedback_at||0)).map(r=>'<tr><td>'+esc(seatLabel(r))+'</td><td>'+esc(r.name)+'<br><span class="muted">'+esc(r.category_name||'')+'</span></td><td>'+esc(r.feedback)+'</td></tr>').join('')+'</table>'):'<div class="muted">まだありません。</div>')+'</div>';
  $('tabbody').innerHTML=body;
  $('csv').onclick=downloadCSV;
}
function downloadCSV(){
  const head=['受付番号','席','ブロック','列','番','名前','カテゴリ','区分','紹介者','メール','登録時刻','感想','感想時刻'];
  const rows=S.regs.slice().sort((a,b)=>(''+a.block_id).localeCompare(''+b.block_id)||a.seat_row-b.seat_row||a.seat_col-b.seat_col)
    .map(r=>[r.receipt_no||'',seatLabel(r),r.block_id,r.seat_row,r.seat_col,r.name,r.category_name||'',r.band||'',r.referrer||'',r.email||'',r.registered_at?new Date(r.registered_at).toLocaleString('ja-JP'):'',(r.feedback||''),r.feedback_at?new Date(r.feedback_at).toLocaleString('ja-JP'):'']);
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='\uFEFF'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='seats_'+EVENT+'_'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- スタッフ：設定 ---------- */
function staffSettings(){
  const cfg=S.cfg, blocks=cfg.layout.blocks||[], cats=cfg.categories||[];
  const blkOpts=sel=>blocks.map(b=>'<option value="'+esc(b.id)+'"'+(b.id===sel?' selected':'')+'>'+esc(b.name)+'</option>').join('');
  let body='<div class="card"><h2>イベント</h2><label>イベント名</label><input type="text" id="c_title" value="'+esc(cfg.title||'')+'">'
    +'<div class="row"><div><label>開催日</label><input type="date" id="c_date" value="'+esc(cfg.event_date||'')+'"></div><div><label>感想の開放時刻</label><input type="time" id="c_time" value="'+esc(cfg.feedback_open_time||'21:00')+'"></div></div>'
    +'<label>感想モード</label><select id="c_mode">'+['auto:自動（開催日＋時刻）','open:今すぐ開放','closed:閉じる'].map(o=>{const p=o.split(':');return '<option value="'+p[0]+'"'+(cfg.feedback_mode===p[0]?' selected':'')+'>'+p[1]+'</option>';}).join('')+'</select>'
    +'<label>スタッフ用パスコード</label><input type="text" id="c_pass" value="'+esc(cfg.staff_pass||'')+'"></div>';

  body+='<div class="card"><h2>座席エリア</h2><label>列数（前→後）</label><input type="number" id="c_rows" min="1" max="60" value="'+(cfg.layout.rows||20)+'"><div id="blkList">';
  blocks.forEach(b=>{ body+='<div class="cfgblk"><div class="row"><div style="flex:2"><label>エリア名</label><input type="text" class="b_name" value="'+esc(b.name)+'"></div><div style="flex:1"><label>席数</label><input type="number" class="b_seats" min="1" max="30" value="'+b.seats+'"></div><div style="flex:0 0 auto;min-width:auto"><label>色</label><input type="color" class="b_color" value="'+esc(b.color||'#2563eb')+'" style="width:44px;height:44px;padding:2px"></div><button class="x b_del" style="align-self:flex-end">削除</button></div><div class="muted">ID: '+esc(b.id)+'</div></div>'; });
  body+='</div><button class="btn sec sm" id="addBlk" style="margin-top:10px">＋ エリアを追加</button></div>';

  body+='<div class="card"><h2>カテゴリ → エリア</h2><div class="muted" style="margin-bottom:6px">各カテゴリが座るエリアを割り当てます。</div><div id="catList">';
  cats.forEach(c=>{ body+='<div class="cfgblk"><div class="row"><div style="flex:2"><label>カテゴリ名</label><input type="text" class="k_name" value="'+esc(c.name)+'"></div><div style="flex:2"><label>エリア</label><select class="k_block">'+blkOpts(c.block_id)+'</select></div><div style="flex:0 0 auto;min-width:auto"><label>色</label><input type="color" class="k_color" value="'+esc(c.color||'#2563eb')+'" style="width:44px;height:44px;padding:2px"></div><button class="x k_del" style="align-self:flex-end">削除</button></div><div class="muted">ID: '+esc(c.id)+'</div></div>'; });
  body+='</div>'+(blocks.length?'':'<div class="msg warn">先にエリアを追加・保存してください。</div>')+'<button class="btn sec sm" id="addCat" style="margin-top:10px"'+(blocks.length?'':' disabled')+'>＋ カテゴリを追加</button></div>';

  body+='<button class="btn" id="saveCfg">設定を保存</button>';
  body+='<div class="card" style="margin-top:18px;border-color:#fecaca"><h2 style="border-color:var(--danger)">危険な操作</h2><div class="muted">全ての登録データを削除します（本番前のテスト消去用）。</div><button class="btn danger" id="resetAll">全登録を削除する</button></div>';
  body+='<div class="foot"><a id="showURL">参加者用URL / QRを表示</a></div>';
  $('tabbody').innerHTML=body;

  $('addBlk').onclick=()=>{ pullSettings(); const id='X'+Date.now().toString(36).slice(-4); S.cfg.layout.blocks.push({id,name:'新エリア',seats:5,color:'#0ea5e9'}); render(); };
  document.querySelectorAll('.b_del').forEach((btn,i)=>btn.onclick=()=>{ pullSettings(); S.cfg.layout.blocks.splice(i,1); render(); });
  $('addCat').onclick=()=>{ if(!(S.cfg.layout.blocks||[]).length) return; pullSettings(); const id='cat'+Date.now().toString(36).slice(-5); (S.cfg.categories=S.cfg.categories||[]).push({id,name:'新カテゴリ',block_id:S.cfg.layout.blocks[0].id,color:'#8b5cf6'}); render(); };
  document.querySelectorAll('.k_del').forEach((btn,i)=>btn.onclick=()=>{ pullSettings(); S.cfg.categories.splice(i,1); render(); });
  $('saveCfg').onclick=saveSettings;
  $('resetAll').onclick=async()=>{ const p=prompt('全ての登録を削除します。スタッフパスコードを入力してください。'); if(p===null) return; if(p!==String(S.cfg.staff_pass||'')){ alert('パスコードが違います。'); return; } try{ await sbDelete('hall_event_regs','event_id=eq.'+EVENT); alert('削除しました。'); S.regs=await loadRegs(); }catch(e){ alert('削除に失敗しました。'); } };
  $('showURL').onclick=showURL;
}
function pullSettings(){
  const cfg=S.cfg; if(!$('c_title')) return;
  cfg.title=$('c_title').value; cfg.event_date=$('c_date').value||null; cfg.feedback_open_time=$('c_time').value||'21:00'; cfg.feedback_mode=$('c_mode').value; cfg.staff_pass=$('c_pass').value; cfg.layout.rows=parseInt($('c_rows').value)||20;
  const bn=document.querySelectorAll('.b_name'),bs=document.querySelectorAll('.b_seats'),bc=document.querySelectorAll('.b_color');
  (cfg.layout.blocks||[]).forEach((b,i)=>{ if(bn[i]){ b.name=bn[i].value; b.seats=parseInt(bs[i].value)||1; b.color=bc[i].value; } });
  const kn=document.querySelectorAll('.k_name'),kb=document.querySelectorAll('.k_block'),kc=document.querySelectorAll('.k_color');
  (cfg.categories||[]).forEach((c,i)=>{ if(kn[i]){ c.name=kn[i].value; c.block_id=kb[i].value; c.color=kc[i].value; } });
}
async function saveSettings(){
  pullSettings(); const cfg=S.cfg; const b=$('saveCfg'); b.disabled=true; b.textContent='保存中…';
  try{ await sbPatch('hall_event_config','event_id=eq.'+EVENT,{ title:cfg.title, event_date:cfg.event_date, feedback_open_time:cfg.feedback_open_time, feedback_mode:cfg.feedback_mode, staff_pass:cfg.staff_pass, layout:cfg.layout, categories:cfg.categories, updated_at:new Date().toISOString() }); S.cfg=await loadCfg(); render(); alert('保存しました。'); }catch(e){ b.disabled=false; b.textContent='設定を保存'; alert('保存に失敗しました: '+e.message); }
}
function showURL(){
  const url=location.origin+location.pathname; const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="modal center"><h2 style="border:0;padding:0;margin-top:0">参加者用URL</h2><div id="qr" style="display:flex;justify-content:center;margin:10px 0"></div><div style="word-break:break-all;background:#f3f4f6;padding:10px;border-radius:8px;font-size:.85rem">'+esc(url)+'</div><div class="row" style="margin-top:12px"><button class="btn sec sm" id="cp" style="flex:1">URLをコピー</button><button class="btn sm" id="cl" style="flex:1">閉じる</button></div></div>';
  document.body.appendChild(ov);
  try{ if(window.QRCode) new QRCode(ov.querySelector('#qr'),{text:url,width:180,height:180}); else ov.querySelector('#qr').innerHTML='<span class="muted">QR未読込</span>'; }catch(e){}
  ov.querySelector('#cl').onclick=()=>ov.remove(); ov.querySelector('#cp').onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(url); ov.querySelector('#cp').textContent='コピーしました'; }; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
}

function footer(){ return '<div class="foot"><a id="staffLink">スタッフ用ページ</a></div>'; }
function wireFooter(){ const l=$('staffLink'); if(l) l.onclick=()=>{ location.hash='staff'; S.role='staff'; S.staffAuthed=(sessionStorage.getItem('hall_staff')==='1'); render(); }; }

boot();
</script>
</body>
</html>

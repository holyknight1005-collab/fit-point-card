const H = () => ({ 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY });

async function sbGet(t,q){ const r=await fetch(REST+t+'?'+q,{headers:H()}); if(!r.ok) throw new Error('GET '+t+' '+r.status); return r.json(); }
async function sbPatchRaw(t,q,body){ return fetch(REST+t+'?'+q,{method:'PATCH',headers:{...H(),'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(body)}); }
async function sbPatch(t,q,body){ const r=await sbPatchRaw(t,q,body); if(!r.ok) throw new Error('PATCH '+t+' '+r.status); return r.json(); }
async function sbDelete(t,q){ const r=await fetch(REST+t+'?'+q,{method:'DELETE',headers:{...H(),'Prefer':'return=representation'}}); if(!r.ok) throw new Error('DELETE '+t+' '+r.status); return r.json(); }
async function sbInsert(body){ const r=await fetch(REST+'hall_event_regs',{method:'POST',headers:{...H(),'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(body)}); if(r.status===409) return {conflict:true}; if(!r.ok){ const tx=await r.text(); throw new Error('INSERT '+r.status+' '+tx); } const d=await r.json(); return {reg:d[0]}; }

const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clientId(){ let c=localStorage.getItem('hall_cid'); if(!c){ c='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); localStorage.setItem('hall_cid',c);} return c; }
function genToken(){ return 'tk'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10); }
function myRec(){ try{ return JSON.parse(localStorage.getItem('hall_v2_'+EVENT)||'null'); }catch(e){ return null; } }
function setMyRec(o){ if(o) localStorage.setItem('hall_v2_'+EVENT, JSON.stringify(o)); else localStorage.removeItem('hall_v2_'+EVENT); }
function seatKey(b,r,c){ return b+'-'+r+'-'+c; }
function blockOf(id){ return (S.cfg.layout.blocks||[]).find(b=>b.id===id); }
function catOf(id){ return (S.cfg.categories||[]).find(c=>c.id===id); }
function catColor(id){ const c=catOf(id); return c?c.color:'#64748b'; }
function colLetter(c){ return String.fromCharCode(64+c); } /* 1→A … 20→T */
function seatLabel(reg){ if(!reg.seat_key) return '未着席'; return reg.seat_row+'列目 '+colLetter(reg.seat_col); }
function seatMiniMap(reg){
  if(!reg.seat_key) return '';
  const cfg=S.cfg, blocks=cfg.layout.blocks||[], rows=cfg.layout.rows||20;
  const GROUP=5, gap='<div style="width:10px;flex:0 0 auto"></div>', dis=disabledSet();
  let grid='';
  for(let r=1;r<=rows;r++){ let cells='';
    blocks.forEach((b,bi)=>{ const seats=b.seats||0; for(let c=1;c<=seats;c++){ const k=seatKey(b.id,r,c); const mine=(b.id===reg.block_id&&r===reg.seat_row&&c===reg.seat_col); const off=dis.has(k); cells+='<div style="width:13px;height:12px;border-radius:2px;flex:0 0 auto;background:'+(mine?'#f97316':(off?'#374151':'#e5e7eb'))+';'+(mine?'box-shadow:0 0 0 2px #f97316':'')+'"></div>'; if(c%GROUP===0 && c<seats) cells+=gap; }
      if(bi<blocks.length-1) cells+=gap; });
    grid+='<div style="display:flex;gap:3px;margin:3px 0;width:max-content;justify-content:center">'+cells+'</div>';
  }
  return '<div style="margin-top:12px"><div class="muted" style="margin-bottom:4px">会場での位置（🟧があなたのお席）</div>'
    +'<div style="background:#111827;color:#fff;text-align:center;border-radius:6px;padding:5px;font-size:.8rem;font-weight:700;letter-spacing:.2em">ステージ（前）</div>'
    +'<div style="overflow-x:auto;padding:8px 6px;border:1px solid var(--line);border-radius:8px;margin-top:4px"><div style="width:max-content;margin:0 auto;display:flex;align-items:stretch;gap:8px"><div>'+grid+'</div>'
    +'<div style="display:flex;flex-direction:column;justify-content:flex-end"><span style="background:#dc2626;color:#fff;font-size:.72rem;font-weight:700;padding:10px 5px;border-radius:6px;writing-mode:vertical-rl;text-orientation:upright">入口</span></div></div></div>'
    +'<div class="center" style="font-size:.95rem;margin-top:6px;font-weight:700">前から '+reg.seat_row+' 列目・座席 '+colLetter(reg.seat_col)+'</div><div class="muted center" style="font-size:.78rem">（ステージに向かって左から A〜T）</div></div>';
}
function emailRequired(band){ return band && band!=='中学生以下'; }

const TYPO={'gmial.com':'gmail.com','gmai.com':'gmail.com','gmail.co':'gmail.com','gmaill.com':'gmail.com','gnail.com':'gmail.com','yahooo.co.jp':'yahoo.co.jp','yaho.co.jp':'yahoo.co.jp','yhoo.co.jp':'yahoo.co.jp','icloud.co':'icloud.com','outlook.co':'outlook.com','hotmial.com':'hotmail.com'};
function typoSuggest(e){ const m=/@(.+)$/.exec(e||''); if(!m) return null; const d=m[1].toLowerCase(); return TYPO[d]? e.slice(0,m.index+1)+TYPO[d] : null; }
function fbOpen(cfg){ if(cfg.feedback_mode==='open') return true; if(cfg.feedback_mode==='closed') return false; if(!cfg.event_date) return false; const at=Date.parse(cfg.event_date+'T'+(cfg.feedback_open_time||'21:00')+':00+09:00'); return !isNaN(at)&&Date.now()>=at; }

async function loadCfg(){ const d=await sbGet('hall_event_config','event_id=eq.'+EVENT+'&select=*'); if(!d.length) throw new Error('config-missing'); const c=d[0]; if(!c.layout) c.layout={blocks:[],rows:20}; if(!c.categories) c.categories=[]; if(!c.bands) c.bands=['中学生以下','高校生','大学生','社会人']; return c; }
async function loadRegs(){ return sbGet('hall_event_regs','event_id=eq.'+EVENT+'&select=*&order=registered_at.asc'); }
function takenSet(){ return new Set(S.regs.filter(r=>r.seat_key).map(r=>r.seat_key)); }
function disabledSet(){ return new Set((S.cfg.layout&&S.cfg.layout.disabled)||[]); }
function nextFrontSeat(){ const taken=takenSet(), dis=disabledSet(), rows=S.cfg.layout.rows||20, blocks=S.cfg.layout.blocks||[]; for(let r=1;r<=rows;r++){ for(const b of blocks){ for(let c=1;c<=(b.seats||0);c++){ const k=seatKey(b.id,r,c); if(!taken.has(k)&&!dis.has(k)) return {key:k,blk:b.id,row:r,col:c}; } } } return null; }
function isHold(r){ return r.source==='hold'; }
function holdRows(){ return S.regs.filter(isHold); }
function holdGroupList(){ const map={}; holdRows().forEach(r=>{ const g=r.hold_group||'_'; (map[g]=map[g]||[]).push(r); }); return Object.keys(map).map(g=>({gid:g, seats:map[g].sort((a,b)=>a.seat_row-b.seat_row||a.seat_col-b.seat_col)})); }
function nextFreeSeatsFrom(startKey, n){ /* startKey から row-major に前方の空席を n 席集める（占有席・確保席・着席不可席はスキップ） */ const taken=takenSet(), dis=disabledSet(), rows=S.cfg.layout.rows||20, blocks=S.cfg.layout.blocks||[]; const flat=[]; for(let r=1;r<=rows;r++){ for(const b of blocks){ for(let c=1;c<=(b.seats||0);c++){ flat.push({key:seatKey(b.id,r,c),blk:b.id,row:r,col:c}); } } } let si=flat.findIndex(s=>s.key===startKey); if(si<0) si=0; const out=[]; for(let i=si;i<flat.length&&out.length<n;i++){ if(!taken.has(flat[i].key)&&!dis.has(flat[i].key)) out.push(flat[i]); } return out; }

async function boot(){
  try{ S.cfg=await loadCfg(); S.regs=await loadRegs(); }
  catch(e){
    if(String(e.message).includes('config-missing')||String(e.message).includes('400')){ $('app').innerHTML='<div class="card"><h1>準備ができていません</h1><div class="msg err">初期設定が見つかりません。Supabaseで <b>hall_event.sql</b> → <b>hall_v2_migration.sql</b> → <b>hall_v3_migration.sql</b> を実行してから開き直してください。</div></div>'; return; }
    $('app').innerHTML='<div class="card"><h1>通信エラー</h1><div class="msg err">'+esc(e.message)+'</div><button class="btn" onclick="location.reload()">再読み込み</button></div>'; return;
  }
  if(location.hash.indexOf('staff')>=0){ S.role='staff'; S.staffAuthed=(sessionStorage.getItem('hall_staff')==='1'); return render(); }
  try{ const tok=new URLSearchParams(location.search).get('t'); if(tok){ const d=await sbGet('hall_event_regs','event_id=eq.'+EVENT+'&token=eq.'+encodeURIComponent(tok)+'&select=*'); if(d.length){ const reg=d[0]; setMyRec({reg_id:reg.id,receipt_no:reg.receipt_no}); S.screen='ticket'; return render(); } } }catch(e){}
  const m=myRec(); if(m&&m.reg_id){ const r=S.regs.find(x=>x.id===m.reg_id); if(r){ S.screen='ticket'; return render(); } }
  S.screen='register'; render();
}
function render(){ stopTimer(); $('app').className='wrap'+(S.role==='staff'&&S.staffAuthed?' wide':''); if(S.role==='staff') return S.staffAuthed?renderStaff():renderStaffLogin(); if(S.screen==='ticket') return renderTicket(); return renderRegister(); }

  if(!cats.length){ $('app').innerHTML='<div class="card"><h1>'+esc(cfg.title||'座席登録')+'</h1><div class="msg warn">ただいま準備中です。会場スタッフにお声がけください。</div></div>'+footer(); return wireFooter(); }
  const f=S.form;
  let h='<div class="card"><h1>9/27(日)「超感覚英語ライブ」当日受付URL</h1><div class="sub">こちらにご登録ください</div>';
  h+='<label>お名前</label><input type="text" id="f_name" value="'+esc(f.name||'')+'" placeholder="山田 太郎" autocomplete="name">';
  h+='<label>所属</label><select id="f_cat"><option value="">選択してください</option>'+cats.map(c=>'<option value="'+esc(c.id)+'"'+(f.catId===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>';

async function doRegister(){
  const f=S.form, err=$('regerr'); err.innerHTML='';
  const name=($('f_name').value||'').trim(), catId=$('f_cat').value;
  const isExt=(catId==='ext');
  const band = isExt ? (f.band||'') : ($('f_band')?$('f_band').value:'');
  const school = isExt ? (($('f_school')?$('f_school').value:'')||'').trim() : '';
  const refEl=$('f_ref'), referrer=refEl?refEl.value.trim():'';
  if(!name) return err.innerHTML='<div class="msg err">お名前を入力してください。</div>';
  if(!catId) return err.innerHTML='<div class="msg err">所属を選択してください。</div>';
  if(isExt){ if(!f.schoolType) return err.innerHTML='<div class="msg err">中学／高校を選んでください。</div>'; if(!school) return err.innerHTML='<div class="msg err">学校名を入力してください。</div>'; }
  if(!band) return err.innerHTML='<div class="msg err">区分を選択してください。</div>';
  const pref=($('f_pref')?$('f_pref').value:'');
  if(!pref) return err.innerHTML='<div class="msg err">都道府県を選択してください。</div>';
  let email=''; const mailEl=$('f_mail');
  if(emailRequired(band)){ email=(mailEl?mailEl.value:'').trim();
    if(!email) return err.innerHTML='<div class="msg err">メールアドレスを入力してください。</div>';
    if(!validEmail(email)) return err.innerHTML='<div class="msg err">メールアドレスの形式をご確認ください。</div>';
  }else{ if(!f.noEmail){ email=(mailEl?mailEl.value:'').trim(); if(email && !validEmail(email)) return err.innerHTML='<div class="msg err">メールアドレスの形式をご確認ください。</div>'; } }
  const cat=catOf(catId);
  const btn=$('doReg'); btn.disabled=true; btn.textContent='登録中…';
  try{
    const res=await sbInsert({ event_id:EVENT, seat_key:null, token:genToken(), category_id:catId, category_name:cat?cat.name:'', band:band, pref:pref||null, referrer:referrer||null, school:school||null, email:email||null, name:name, client_id:clientId(), source:'self' });

    setMyRec({reg_id:reg.id, receipt_no:reg.receipt_no}); S.form={};
    S.regs=await loadRegs(); S.screen='ticket'; render();
  }catch(e){ btn.disabled=false; btn.textContent='登録してチケットを発行'; err.innerHTML='<div class="msg err">登録に失敗しました。通信環境をご確認のうえ、もう一度お試しください。</div>'; }
}

}

/* ---------- グループ確保 ---------- */
function startGroupHold(){
  const v=prompt('確保する人数を入力してください（例：4）'); if(v===null) return;
  const n=parseInt(v,10); if(!n||n<1||n>40){ alert('1〜40の人数を入れてください。'); return; }
  placeGroupN=n; seatMoveId=null; placingId=null; stopScan(); S.staffTab='map'; render();
}
async function placeGroupAt(startKey){
  const n=placeGroupN; if(!n) return;
  try{ S.regs=await loadRegs(); }catch(e){}
  const seats=nextFreeSeatsFrom(startKey,n);
  if(seats.length<n){ alert('空席が足りません（残り'+seats.length+'席）。'); return; }
  const gid='g'+Date.now().toString(36);
  try{
    for(const s of seats){ await sbInsert({ event_id:EVENT, seat_key:s.key, block_id:s.blk, seat_row:s.row, seat_col:s.col, name:'（確保）', source:'hold', hold_group:gid, client_id:'hold' }); }
  }catch(e){ alert('席の確保に失敗しました。埋まった席が混ざった可能性があります。もう一度お試しください。'); }
  placeGroupN=null; S.activeGroup=gid; try{ S.regs=await loadRegs(); }catch(e){}
  S.staffTab='checkin'; render();
}
function activeGroupSlots(){ const g=holdGroupList().find(x=>x.gid===S.activeGroup); return g?g.seats:[]; }

async function fillGroupSlot(personReg){
  // personReg: 既存登録者の行（QR/受付番号/未着席一覧）。null はチケットなし。
  try{ S.regs=await loadRegs(); }catch(e){}
  const slots=activeGroupSlots();
  if(!slots.length){ alert('このグループの確保席は満席です。'); S.activeGroup=null; if(personReg) startPlacing(personReg.id); else ticketlessSeat(); return; }
  const slot=slots[0];
  if(personReg){
    if(personReg.seat_key && !isHold(personReg)){ S.lastSeated={name:personReg.name,seat:seatLabel(personReg)+'（着席済み）'}; renderCheckin(); return; }
    // 確保席を空けて本人をそこへ（本人の行ID・トークンは維持）
    try{ await sbDelete('hall_event_regs','id=eq.'+slot.id+'&event_id=eq.'+EVENT); }catch(e){ alert('着席に失敗しました。'); return; }
    const rr=await sbPatchRaw('hall_event_regs','id=eq.'+personReg.id+'&event_id=eq.'+EVENT+'&seat_key=is.null',{seat_key:slot.seat_key,block_id:slot.block_id,seat_row:slot.seat_row,seat_col:slot.seat_col,checkin_at:new Date().toISOString()});
    if(!rr.ok){ alert('着席に失敗しました。'); try{ S.regs=await loadRegs(); }catch(e){} renderCheckin(); return; }
    const arr=await rr.json(); const seated=arr[0]||personReg;
    S.lastSeated={name:seated.name,seat:seatLabel(slot)};
  }else{
    const name=(prompt('お名前（後で入力も可・空でもOK）')||'').trim();
    const receipt='R-'+String(slot.id).padStart(3,'0');
    try{ await sbPatch('hall_event_regs','id=eq.'+slot.id+'&event_id=eq.'+EVENT,{name:name||'（受付発券）',source:'reception',hold_group:null,receipt_no:receipt,checkin_at:new Date().toISOString()}); }
    catch(e){ alert('着席に失敗しました。'); return; }
    S.lastSeated={name:name||'（受付発券）',seat:seatLabel(slot)};
  }
  try{ S.regs=await loadRegs(); }catch(e){}
  if(!activeGroupSlots().length) S.activeGroup=null;
  renderCheckin();
  if(!personReg){ const filled=S.regs.find(x=>x.id===slot.id); if(filled) editReg(filled.id); }
}

async function releaseGroup(gid){
  if(!confirm('このグループの未着席の確保席を解除します。よろしいですか？')) return;
  try{ await sbDelete('hall_event_regs','event_id=eq.'+EVENT+'&source=eq.hold&hold_group=eq.'+encodeURIComponent(gid)); }catch(e){ alert('解除に失敗しました。'); }
  if(S.activeGroup===gid) S.activeGroup=null;
  try{ S.regs=await loadRegs(); }catch(e){} renderCheckin();
}

function startScan(){
  if(!window.jsQR){ alert('QR読み取り機能を読み込めませんでした。通信環境をご確認のうえページを再読み込みするか、受付番号の手入力をお使いください。'); return; }
  const cam=$('ci-cam'); if(cam) cam.style.display='block';
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{ scanStream=stream; const v=$('qr-video'); v.srcObject=stream; v.setAttribute('playsinline',''); v.play(); scanLoop(); }).catch(e=>{ alert('カメラを起動できませんでした。受付番号の手入力をご利用ください。'); if(cam) cam.style.display='none'; });
}
function scanLoop(){
  if(!scanStream) return; const v=$('qr-video'), cv=$('qr-canvas'); if(!v||!cv){ return; }
  if(v.readyState===v.HAVE_ENOUGH_DATA && window.jsQR){ cv.width=v.videoWidth; cv.height=v.videoHeight; const ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.drawImage(v,0,0,cv.width,cv.height); const img=ctx.getImageData(0,0,cv.width,cv.height); const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'}); if(code&&code.data){ const txt=code.data.trim(); stopScan(); onScanCode(txt); return; } }
  scanRAF=requestAnimationFrame(scanLoop);
}
function stopScan(){ if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; } const cam=$('ci-cam'); if(cam) cam.style.display='none'; }

function onScanCode(txt){ const m=/[?&]t=([^&\s]+)/.exec(txt); if(m){ return checkinByToken(decodeURIComponent(m[1])); } return checkinByReceipt(txt); }
async function checkinByToken(tok){ try{ const d=await sbGet('hall_event_regs','event_id=eq.'+EVENT+'&token=eq.'+encodeURIComponent(tok)+'&select=*'); if(!d.length){ alert('該当するQRが見つかりません。'); return; } const reg=d[0]; S.regs=await loadRegs(); if(reg.seat_key&&!isHold(reg)){ S.lastSeated={name:reg.name,seat:seatLabel(reg)+'（着席済み）'}; renderCheckin(); return; } if(S.activeGroup) return fillGroupSlot(reg); startPlacing(reg.id); }catch(e){ alert('照合に失敗しました。'); } }
async function checkinByReceipt(no){
  try{ const d=await sbGet('hall_event_regs','event_id=eq.'+EVENT+'&receipt_no=eq.'+encodeURIComponent(no)+'&select=*'); if(!d.length){ alert('該当する受付番号が見つかりません：'+no); return; } const reg=d[0]; S.regs=await loadRegs(); if(reg.seat_key&&!isHold(reg)){ S.lastSeated={name:reg.name,seat:seatLabel(reg)+'（着席済み）'}; renderCheckin(); return; } if(S.activeGroup) return fillGroupSlot(reg); startPlacing(reg.id); }catch(e){ alert('照合に失敗しました。'); }
}

function startPlacing(id){ seatMoveId=null; placingId=id; stopScan(); S.staffTab='map'; render(); }

async function seatAssign(id, key, blk, r, c, mode){
  try{ S.regs=await loadRegs(); }catch(e){}
  if(S.regs.some(x=>x.seat_key===key)){ alert('その席は今埋まりました。別の空席を選んでください。'); return staffMap(); }
  let seated=null;
  try{ const up=await sbPatch('hall_event_regs','id=eq.'+id+'&event_id=eq.'+EVENT, mode==='place'?{seat_key:key,block_id:blk,seat_row:r,seat_col:c,checkin_at:new Date().toISOString()}:{seat_key:key,block_id:blk,seat_row:r,seat_col:c}); seated=up[0]; }
  catch(e){ alert('着席に失敗しました。別の席でお試しください。'); return staffMap(); }
  seatMoveId=null; placingId=null; try{ S.regs=await loadRegs(); }catch(e){}
  if(mode==='place'){ if(seated){ S.lastSeated={name:seated.name,seat:seatLabel(seated)}; } S.staffTab='checkin'; render(); if(seated&&seated.source==='reception'&&!seated.category_id){ editReg(seated.id); } }
  else { staffMap(); }
}

async function assignFrontSeat(reg){
  placingId=null;
  for(let attempt=0; attempt<8; attempt++){
    S.regs=await loadRegs();
    const fresh=S.regs.find(x=>x.id===reg.id) || reg;
    if(fresh.seat_key){ S.lastSeated={name:fresh.name,seat:seatLabel(fresh)+'（着席済み）'}; S.staffTab='checkin'; render(); return; }
    const seat=nextFrontSeat(); if(!seat){ alert('満席です。'); return; }
    const r=await sbPatchRaw('hall_event_regs','id=eq.'+reg.id+'&event_id=eq.'+EVENT+'&seat_key=is.null',{seat_key:seat.key,block_id:seat.blk,seat_row:seat.row,seat_col:seat.col,checkin_at:new Date().toISOString()});
    if(!r.ok){ if(r.status===409){ continue; } alert('着席に失敗しました。'); return; }
    const arr=await r.json(); if(!arr.length){ continue; }
    const seated=arr[0]; S.lastSeated={name:seated.name,seat:seatLabel(seated)};
    S.regs=await loadRegs(); S.staffTab='checkin'; render(); return;
  }
  alert('混雑のため着席できませんでした。もう一度お試しください。');
}

async function ticketlessSeat(){
  if(S.activeGroup && activeGroupSlots().length) return fillGroupSlot(null);
  try{
    const res=await sbInsert({ event_id:EVENT, seat_key:null, name:'（受付発券）', client_id:'reception', source:'reception' });
    let reg=res.reg; const receipt='R-'+String(reg.id).padStart(3,'0');
    try{ const up=await sbPatch('hall_event_regs','id=eq.'+reg.id+'&event_id=eq.'+EVENT,{receipt_no:receipt}); reg=up[0]||Object.assign(reg,{receipt_no:receipt}); }catch(e){ reg.receipt_no=receipt; }
    S.regs=await loadRegs(); startPlacing(reg.id);
  }catch(e){ alert('発券に失敗しました。もう一度お試しください。'); }
}

/* ---------- 座席マップ（色分け＝カテゴリ・席移動） ---------- */
async function staffMap(){
  try{ S.regs=await loadRegs(); }catch(e){}
  const cfg=S.cfg, blocks=cfg.layout.blocks||[], rows=cfg.layout.rows||20;
  const dis=disabledSet();
  const cap=blocks.reduce((s,b)=>s+(b.seats||0)*rows,0)-dis.size;
  const total=cap;
  const taken=S.regs.filter(r=>r.seat_key&&!isHold(r)).length;
  const reserved=holdRows().length;
  const bySeat={}; S.regs.forEach(r=>{ if(r.seat_key) bySeat[r.seat_key]=r; });
  const moving=seatMoveId?S.regs.find(r=>r.id===seatMoveId):null;
  const placing=placingId?S.regs.find(r=>r.id===placingId):null;
  const acting=moving||placing;
  const grouping=!!placeGroupN;
  let legend='<div class="legend">'+(cfg.categories||[]).map(c=>'<span><i class="dot" style="background:'+c.color+'"></i>'+esc(c.name)+'</span>').join('')+'</div>';
  let grid='';
  for(let r=1;r<=rows;r++){ let cells='';
    blocks.forEach((b,bi)=>{ let bs=''; const seats=b.seats||0; for(let c=1;c<=seats;c++){ const k=seatKey(b.id,r,c); const reg=bySeat[k]; if(dis.has(k)){ bs+='<div class="seat" style="background:#374151;color:#fff;border-color:#374151" title="配信用（着席不可）">配</div>'; } else if(reg&&isHold(reg)){ bs+='<div class="seat reserved" title="グループ確保中">確</div>'; } else if(reg){ const col=catColor(reg.category_id); const mine=(moving&&reg.id===moving.id); bs+='<div class="seat'+(mine?' moving':'')+'" style="background:'+col+';color:#fff;border-color:'+col+';cursor:pointer" data-id="'+reg.id+'" title="'+esc((reg.name||'')+' / '+(reg.category_name||''))+'">'+esc((reg.name||'').slice(0,2))+'</div>'; } else { bs+='<div class="seat'+((acting||grouping)?' moveable':'')+'" data-empty="'+k+'" data-blk="'+b.id+'" data-r="'+r+'" data-c="'+c+'">'+colLetter(c)+'</div>'; } if(c%5===0 && c<seats) bs+='<div class="blkgap"></div>'; }
      cells+='<div class="blk">'+bs+'</div>'+(bi<blocks.length-1?'<div class="blkgap"></div>':''); });
    grid+='<div class="seatRow"><div class="rowNo">'+r+'列</div>'+cells+'</div>'; }
  const banner = moving ? '<div class="msg warn" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>移動中：<b>'+esc(moving.name)+'</b>（'+esc(seatLabel(moving))+'）→ 移動先の空席をタップ</span><button class="btn sec sm" id="mvcancel">キャンセル</button></div>'
    : placing ? '<div class="msg info" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>🎫 <b>'+esc(placing.name)+'</b> を着席：<b>空席をタップ</b></span><span style="display:flex;gap:6px"><button class="btn ok sm" id="plauto">前から自動</button><button class="btn sec sm" id="plcancel">キャンセル</button></span></div>'
    : grouping ? '<div class="msg warn" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>👥 <b>'+placeGroupN+'席を確保</b>：開始席をタップ（そこから連続'+placeGroupN+'席）</span><button class="btn sec sm" id="grpcancel">キャンセル</button></div>'
    : '';
  let body='<div class="card">'+banner+'<div class="stat"><div class="box"><div class="n">'+taken+'</div><div class="k">着席</div></div><div class="box"><div class="n">'+reserved+'</div><div class="k">確保中</div></div><div class="box"><div class="n">'+(total-taken-reserved)+'</div><div class="k">空席</div></div></div>'+legend+'<div class="stage">ステージ（前）</div><div class="seatArea"><div style="display:flex;align-items:stretch;gap:8px;width:max-content"><div>'+grid+'</div><div style="display:flex;flex-direction:column;justify-content:flex-end"><span style="background:#dc2626;color:#fff;font-size:.75rem;font-weight:700;padding:12px 6px;border-radius:6px;writing-mode:vertical-rl;text-orientation:upright">入口</span></div></div></div><div class="muted center" style="margin-top:8px">自動更新（5秒）・座席タップで詳細/移動・「確」＝グループ確保中・赤＝入口（右後ろ）</div></div>';
  $('tabbody').innerHTML=body;
  if(grouping){
    document.querySelectorAll('.seat[data-empty]').forEach(el=>el.onclick=()=>placeGroupAt(el.getAttribute('data-empty')));
    const gc=$('grpcancel'); if(gc) gc.onclick=()=>{ placeGroupN=null; S.staffTab='checkin'; render(); };
  } else if(acting){
    document.querySelectorAll('.seat[data-empty]').forEach(el=>el.onclick=()=>seatAssign(acting.id, el.getAttribute('data-empty'), el.getAttribute('data-blk'), parseInt(el.getAttribute('data-r')), parseInt(el.getAttribute('data-c')), moving?'move':'place'));
    const cx=$('mvcancel'); if(cx) cx.onclick=()=>{ seatMoveId=null; staffMap(); };
    const cp=$('plcancel'); if(cp) cp.onclick=()=>{ placingId=null; staffMap(); };
    const pa=$('plauto'); if(pa) pa.onclick=()=>{ const reg=placing; placingId=null; assignFrontSeat(reg); };
  }
  document.querySelectorAll('.seat[data-id]').forEach(el=>el.onclick=()=>{ if(seatMoveId||placingId||placeGroupN) return; seatDetail(parseInt(el.getAttribute('data-id'))); });
  refreshTimer=setInterval(async()=>{ if(S.role==='staff'&&S.staffTab==='map'&&!seatMoveId&&!placingId&&!placeGroupN){ try{ S.regs=await loadRegs(); staffMap(); }catch(e){} } },5000);
}
async function seatMoveTo(key,blk,r,c){
  const id=seatMoveId; if(!id) return; try{ S.regs=await loadRegs(); }catch(e){}
  if(S.regs.some(x=>x.seat_key===key)){ alert('その席は今埋まりました。別の空席を選んでください。'); return staffMap(); }
  try{ await sbPatch('hall_event_regs','id=eq.'+id+'&event_id=eq.'+EVENT,{seat_key:key,block_id:blk,seat_row:r,seat_col:c}); }catch(e){ alert('移動に失敗しました。'); return; }

/* ---------- 集計・CSV ---------- */
async function staffTally(){

  const cfg=S.cfg, cats=cfg.categories||[], bands=cfg.bands||[]; const people=S.regs.filter(r=>!isHold(r)); const fb=people.filter(r=>r.feedback&&r.feedback.trim());

  body+='<div class="card"><h2>所属別</h2><table class="list"><tr><th>所属</th><th>登録</th></tr>'+cats.map(c=>'<tr><td><i class="dot" style="background:'+c.color+'"></i> '+esc(c.name)+'</td><td>'+people.filter(r=>r.category_id===c.id).length+'</td></tr>').join('')+'</table></div>';
  body+='<div class="card"><h2>区分別</h2><table class="list"><tr><th>区分</th><th>登録</th></tr>'+bands.map(b=>'<tr><td>'+esc(b)+'</td><td>'+people.filter(r=>r.band===b).length+'</td></tr>').join('')+'</table></div>';
  body+='<div class="card"><h2>感想一覧（'+fb.length+'件）</h2>'+(fb.length?('<table class="list"><tr><th>席</th><th>名前/所属</th><th>感想</th></tr>'+fb.slice().sort((a,b)=>new Date(b.feedback_at||0)-new Date(a.feedback_at||0)).map(r=>'<tr><td>'+esc(seatLabel(r))+'</td><td>'+esc(r.name)+'<br><span class="muted">'+esc(r.category_name||'')+'</span></td><td>'+esc(r.feedback)+'</td></tr>').join('')+'</table>'):'<div class="muted">まだありません。</div>')+'</div>';
  $('tabbody').innerHTML=body; $('csv').onclick=downloadCSV;
}
function downloadCSV(){
  const head=['受付番号','席','名前','所属','学校','区分','都道府県','紹介者','メール','発券元','登録時刻','着席時刻','感想'];
  const rows=S.regs.filter(r=>!isHold(r)).slice().sort((a,b)=>(a.seat_row||999)-(b.seat_row||999)||(a.seat_col||999)-(b.seat_col||999))
    .map(r=>[r.receipt_no||'',seatLabel(r),r.name||'',r.category_name||'',r.school||'',r.band||'',r.pref||'',r.referrer||'',r.email||'',r.source||'',r.registered_at?new Date(r.registered_at).toLocaleString('ja-JP'):'',r.checkin_at?new Date(r.checkin_at).toLocaleString('ja-JP'):'',(r.feedback||'')]);
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='\uFEFF'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='seats_'+EVENT+'_'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 設定 ---------- */
function staffSettings(){
  const cfg=S.cfg, blocks=cfg.layout.blocks||[], cats=cfg.categories||[];
  const blkOpts=sel=>blocks.map(b=>'<option value="'+esc(b.id)+'"'+(b.id===sel?' selected':'')+'>'+esc(b.name)+'</option>').join('');
  let body='<div class="card"><h2>イベント</h2><label>イベント名</label><input type="text" id="c_title" value="'+esc(cfg.title||'')+'"><div class="row"><div><label>開催日</label><input type="date" id="c_date" value="'+esc(cfg.event_date||'')+'"></div><div><label>感想の開放時刻</label><input type="time" id="c_time" value="'+esc(cfg.feedback_open_time||'21:00')+'"></div></div><label>感想モード</label><select id="c_mode">'+['auto:自動（開催日＋時刻）','open:今すぐ開放','closed:閉じる'].map(o=>{const p=o.split(':');return '<option value="'+p[0]+'"'+(cfg.feedback_mode===p[0]?' selected':'')+'>'+p[1]+'</option>';}).join('')+'</select><label>スタッフ用パスコード</label><input type="text" id="c_pass" value="'+esc(cfg.staff_pass||'')+'"></div>';
  body+='<div class="card"><h2>座席エリア</h2><div class="muted" style="margin-bottom:6px">前から詰めて着席します（列1の左→右→列2…）。単一エリア推奨。</div><label>列数（前→後）</label><input type="number" id="c_rows" min="1" max="60" value="'+(cfg.layout.rows||20)+'"><div id="blkList">';
  blocks.forEach(b=>{ body+='<div class="cfgblk"><div class="row"><div style="flex:2"><label>エリア名</label><input type="text" class="b_name" value="'+esc(b.name)+'"></div><div style="flex:1"><label>席数/列</label><input type="number" class="b_seats" min="1" max="40" value="'+b.seats+'"></div><div style="flex:0 0 auto;min-width:auto"><label>色</label><input type="color" class="b_color" value="'+esc(b.color||'#2563eb')+'" style="width:44px;height:44px;padding:2px"></div><button class="x b_del" style="align-self:flex-end">削除</button></div><div class="muted">ID: '+esc(b.id)+'</div></div>'; });
  body+='</div><button class="btn sec sm" id="addBlk" style="margin-top:10px">＋ エリアを追加</button></div>';
  body+='<div class="card"><h2>所属（記録用）</h2><div class="muted" style="margin-bottom:6px">色分け・集計に使います（着席順には影響しません）。</div><div id="catList">';
  cats.forEach(c=>{ body+='<div class="cfgblk"><div class="row"><div style="flex:2"><label>所属名</label><input type="text" class="k_name" value="'+esc(c.name)+'"></div><div style="flex:0 0 auto;min-width:auto"><label>色</label><input type="color" class="k_color" value="'+esc(c.color||'#2563eb')+'" style="width:44px;height:44px;padding:2px"></div><button class="x k_del" style="align-self:flex-end">削除</button></div><div class="muted">ID: '+esc(c.id)+'</div></div>'; });
  body+='</div><button class="btn sec sm" id="addCat" style="margin-top:10px">＋ 所属を追加</button></div>';
  body+='<button class="btn" id="saveCfg">設定を保存</button>';
  body+='<div class="card" style="margin-top:18px;border-color:#fecaca"><h2 style="border-color:var(--danger)">危険な操作</h2><div class="muted">全ての登録データを削除します。</div><button class="btn danger" id="resetAll">全登録を削除する</button></div>';
  body+='<div class="foot"><a id="showURL">参加者用URL / QRを表示</a></div>';
  $('tabbody').innerHTML=body;
  $('addBlk').onclick=()=>{ pullSettings(); const id='X'+Date.now().toString(36).slice(-4); S.cfg.layout.blocks.push({id,name:'新エリア',seats:20,color:'#0ea5e9'}); render(); };
  document.querySelectorAll('.b_del').forEach((btn,i)=>btn.onclick=()=>{ pullSettings(); S.cfg.layout.blocks.splice(i,1); render(); });
  $('addCat').onclick=()=>{ pullSettings(); const id='cat'+Date.now().toString(36).slice(-5); (S.cfg.categories=S.cfg.categories||[]).push({id,name:'新しい所属',color:'#8b5cf6'}); render(); };
  document.querySelectorAll('.k_del').forEach((btn,i)=>btn.onclick=()=>{ pullSettings(); S.cfg.categories.splice(i,1); render(); });
  $('saveCfg').onclick=saveSettings;
  $('resetAll').onclick=async()=>{ const p=prompt('全ての登録を削除します。スタッフパスコードを入力してください。'); if(p===null) return; if(p!==String(S.cfg.staff_pass||'')){ alert('パスコードが違います。'); return; } try{ await sbDelete('hall_event_regs','event_id=eq.'+EVENT); alert('削除しました。'); S.regs=await loadRegs(); }catch(e){ alert('削除に失敗しました。'); } };
  $('showURL').onclick=showURL;
}
function pullSettings(){
  const cfg=S.cfg; if(!$('c_title')) return;
  cfg.title=$('c_title').value; cfg.event_date=$('c_date').value||null; cfg.feedback_open_time=$('c_time').value||'21:00'; cfg.feedback_mode=$('c_mode').value; cfg.staff_pass=$('c_pass').value; cfg.layout.rows=parseInt($('c_rows').value)||20;
  const bn=document.querySelectorAll('.b_name'),bs=document.querySelectorAll('.b_seats'),bc=document.querySelectorAll('.b_color');
  (cfg.layout.blocks||[]).forEach((b,i)=>{ if(bn[i]){ b.name=bn[i].value; b.seats=parseInt(bs[i].value)||1; b.color=bc[i].value; } });
  const kn=document.querySelectorAll('.k_name'),kc=document.querySelectorAll('.k_color');
  (cfg.categories||[]).forEach((c,i)=>{ if(kn[i]){ c.name=kn[i].value; c.color=kc[i].value; } });
}
async function saveSettings(){
  pullSettings(); const cfg=S.cfg; const b=$('saveCfg'); b.disabled=true; b.textContent='保存中…';
  try{ await sbPatch('hall_event_config','event_id=eq.'+EVENT,{title:cfg.title,event_date:cfg.event_date,feedback_open_time:cfg.feedback_open_time,feedback_mode:cfg.feedback_mode,staff_pass:cfg.staff_pass,layout:cfg.layout,categories:cfg.categories,updated_at:new Date().toISOString()}); S.cfg=await loadCfg(); render(); alert('保存しました。'); }catch(e){ b.disabled=false; b.textContent='設定を保存'; alert('保存に失敗しました: '+e.message); }
}
function showURL(){
  const url=location.origin+location.pathname; const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="modal center"><h2 style="border:0;padding:0;margin-top:0">参加者用URL</h2><div id="qr" style="display:flex;justify-content:center;margin:10px 0"></div><div style="word-break:break-all;background:#f3f4f6;padding:10px;border-radius:8px;font-size:.85rem">'+esc(url)+'</div><div class="row" style="margin-top:12px"><button class="btn sec sm" id="cp" style="flex:1">URLをコピー</button><button class="btn sm" id="cl" style="flex:1">閉じる</button></div></div>';
  document.body.appendChild(ov);
  try{ if(window.QRCode) new QRCode(ov.querySelector('#qr'),{text:url,width:180,height:180}); }catch(e){}
  ov.querySelector('#cl').onclick=()=>ov.remove(); ov.querySelector('#cp').onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(url); ov.querySelector('#cp').textContent='コピーしました'; }; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
}

function footer(){ return '<div class="foot"><a id="staffLink">スタッフ用ページ</a></div>'; }
function wireFooter(){ const l=$('staffLink'); if(l) l.onclick=()=>{ location.hash='staff'; S.role='staff'; S.staffAuthed=(sessionStorage.getItem('hall_staff')==='1'); render(); }; }

boot();
</script>

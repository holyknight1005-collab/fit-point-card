<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>fit漢字テスト | fit塾</title>
<style>
  :root{
    --purple:#7B2D8B;--purple-d:#4A1060;--purple-l:#F3E8FB;
    --bg:#F8F4FC;--surface:#fff;--text:#2C2C2A;--muted:#7A7770;--border:#E0D0E8;
    --indigo:#2E4A8B;--indigo-l:#E8EDFB;
    --vermilion:#C7422E;--vermilion-l:#FCEAE6;
    --gold:#B8892B;
    --ok:#2E8B57;--ok-l:#E6F5EC;
    --red:#D94040;--red-l:#FFECEC;
    --radius:16px;--radius-sm:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column;padding:18px 16px 32px}
  .screen.active{display:flex}

  /* ローディング・トースト */
  #loading{position:fixed;inset:0;background:rgba(248,244,252,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:500}
  #loading.hidden{display:none}
  .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading-text{font-size:13px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:600;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--ok)}
  .toast.info{background:#444}

  /* ログイン */
  #screen-login{align-items:center;justify-content:center;gap:20px}
  .login-logo{text-align:center}
  .login-logo .ico{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:30px;font-weight:700;color:var(--purple);letter-spacing:.03em}
  .login-logo .ttl{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:24px;font-weight:700;color:var(--purple-d);margin-top:6px;letter-spacing:.04em}
  .login-logo .sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  .login-card{width:100%;background:var(--surface);border-radius:var(--radius);padding:22px 20px;box-shadow:0 2px 12px rgba(74,16,96,.08);border:1px solid var(--border)}
  .field-label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field-input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;color:var(--text);background:var(--bg);transition:border-color .15s;margin-bottom:14px}
  .field-input:focus{outline:none;border-color:var(--purple)}
  .primary-btn{width:100%;border:0;border-radius:var(--radius-sm);padding:14px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple-d));cursor:pointer}
  .error-msg{background:var(--red-l);border:1px solid #F5BABA;border-radius:var(--radius-sm);padding:9px 13px;font-size:12px;color:var(--red);margin-top:10px;display:none}
  .error-msg.show{display:block}

  /* ヘッダー */
  .top{background:linear-gradient(135deg,var(--purple) 0%,var(--purple-d) 100%);color:#fff;padding:16px 18px 18px;border-radius:0 0 22px 22px;box-shadow:0 4px 18px rgba(74,16,96,.22);position:relative;overflow:hidden}
  .top::after{content:"あ";position:absolute;right:-6px;bottom:-22px;font-size:110px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;opacity:.10;font-weight:700}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
  .top-eyebrow{font-size:11px;letter-spacing:.2em;opacity:.82;font-weight:600}
  .top-title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:24px;font-weight:700;margin-top:3px;letter-spacing:.04em}
  .top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .point-pill{background:rgba(255,255,255,.22);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700}
  .logout-btn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:16px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer}

  .section-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:22px 4px 10px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(74,16,96,.05)}

  .seg{display:flex;gap:6px;background:var(--purple-l);padding:5px;border-radius:12px}
  .seg button{flex:1;border:0;background:transparent;color:var(--purple-d);font-weight:700;font-size:13px;padding:10px 6px;border-radius:9px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--surface);box-shadow:0 1px 4px rgba(74,16,96,.14)}

  /* 範囲（複数選択） */
  .rng-hint{font-size:11.5px;color:var(--muted);margin:0 4px 8px}
  .rng-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rng-chip{border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 6px;text-align:center;cursor:pointer;transition:.12s;position:relative}
  .rng-chip .rn{font-weight:700;font-size:13.5px;color:var(--purple-d)}
  .rng-chip .rd{font-size:10px;color:var(--muted);margin-top:1px}
  .rng-chip.on{border-color:var(--purple);background:var(--purple-l);box-shadow:0 2px 8px rgba(123,45,139,.16)}
  .rng-chip.on::after{content:"✓";position:absolute;top:4px;right:7px;font-size:11px;color:var(--purple);font-weight:900}
  .rng-tools{display:flex;gap:8px;margin-top:10px}
  .rng-tools button{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .rng-summary{text-align:center;font-size:12.5px;font-weight:700;color:var(--purple-d);margin-top:12px;min-height:18px}

  .cfg-row{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;font-size:13.5px}
  .cfg-row + .cfg-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .cfg-row .lbl{color:var(--muted);font-weight:700}
  .pick{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pick button{border:1.5px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--text);cursor:pointer;min-width:42px}
  .pick button.on{border-color:var(--purple);background:var(--purple-l);color:var(--purple-d)}

  .start-btn{width:100%;margin-top:20px;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple-d));cursor:pointer;box-shadow:0 4px 14px rgba(123,45,139,.3);transition:.15s}
  .start-btn:active{transform:translateY(1px)}
  .start-btn:disabled{opacity:.5;box-shadow:none}
  .spell-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;font-size:15px;box-sizing:border-box;margin-bottom:10px}
  .spell-input:focus{outline:none;border-color:var(--purple)}
  .ta-block{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .ta-hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin:2px 0 12px}
  .ta-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .ta-lbl{font-size:13px;font-weight:700;color:var(--text);min-width:40px}
  .ta-ranges{display:flex;flex-wrap:wrap;gap:8px;flex:1}
  .ta-range-chip{border:1.5px solid var(--border);background:#fff;color:var(--text);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
  .ta-range-chip.on{border-color:var(--vermilion);background:var(--vermilion-l);color:var(--vermilion)}
  .ta-start-btn{width:100%;margin-top:6px;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f0a020,#e0552a);cursor:pointer;box-shadow:0 4px 14px rgba(224,85,42,.28)}
  .ta-start-btn:active{transform:translateY(1px)}
  .ta-hud{margin-left:auto;font-size:13px;font-weight:700;color:var(--vermilion);display:inline-flex;align-items:center;gap:2px}
  .ta-hud .ta-time{font-size:16px}
  .ta-hero{background:linear-gradient(135deg,#f0a020,#e0552a)}
  .ta-result-eyebrow{font-size:13px;font-weight:700;opacity:.9;letter-spacing:.04em;margin-bottom:4px}
  .ta-r-meta{font-size:12.5px;opacity:.92;margin-top:8px}
  .ta-reg{margin:18px 0}
  .ta-reg-label{font-size:13px;font-weight:700;margin-bottom:8px}
  .ta-reg-notice{font-size:11.5px;line-height:1.6;color:#8a3a6a;background:#faf2f7;border:1px solid #ecd8e8;border-radius:9px;padding:8px 10px;margin:2px 0 10px}
  .ta-board-title{font-size:14px;font-weight:800;margin:16px 0 10px}
  .ta-board-load,.ta-board-empty{font-size:13px;color:var(--muted);text-align:center;padding:14px 0}
  .ta-board-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;background:var(--bg);margin-bottom:7px}
  .ta-board-row.top{background:var(--vermilion-l)}
  .tb-rank{font-size:15px;font-weight:800;min-width:34px}
  .tb-name{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tb-score{font-size:14px;font-weight:800;color:var(--vermilion)}
  .ta-board-home{margin-top:18px}
  .ta-board-toggle{width:100%;margin-top:6px;border:1px solid var(--border);background:#fff;color:var(--vermilion);border-radius:10px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer}
  .tb-real{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#6a4a7a;background:#efe4f5;border-radius:6px;padding:1px 6px}
  .tb-hide{margin-left:6px;border:1px solid var(--border);background:#fff;color:#8a3a6a;border-radius:7px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
  .ta-board-row.hiddenrow{opacity:.5}
  .ta-board-row.hiddenrow .tb-name{text-decoration:line-through}

  /* 苦手な単語カード */
  .weak-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--vermilion);border-radius:var(--radius);padding:14px 16px;margin-top:10px}
  .weak-card .wt{font-size:13px;font-weight:700;color:var(--vermilion)}
  .weak-card .wd{font-size:12px;color:var(--muted);margin-top:2px}
  .weak-review-btn{margin-top:10px;width:100%;border:1.5px solid var(--vermilion);background:var(--vermilion-l);color:var(--vermilion);border-radius:11px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}

  /* クイズ */
  .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .q-back{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;padding:6px 4px}
  .q-prog{font-size:13px;font-weight:700;color:var(--purple-d)}
  .bar{height:6px;background:var(--purple-l);border-radius:99px;overflow:hidden;margin-bottom:20px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple-d));border-radius:99px;transition:width .3s}
  .prompt-label{text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}
  .prompt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 20px;text-align:center;box-shadow:0 2px 12px rgba(74,16,96,.06);margin-bottom:18px;min-height:112px;display:flex;align-items:center;justify-content:center}
  .prompt .word{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:30px;font-weight:700;color:var(--purple-d);letter-spacing:.03em;word-break:break-word}
  .prompt .word.meaning{font-size:20px;line-height:1.5;font-family:-apple-system,sans-serif;font-weight:600}

  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{border:1.5px solid var(--border);background:var(--surface);border-radius:13px;padding:14px 16px;font-size:15px;text-align:left;cursor:pointer;transition:.12s;color:var(--text);line-height:1.45}
  .choice:active{transform:scale(.99)}
  .choice.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:18px;font-weight:600}
  .choice.correct{border-color:var(--ok);background:var(--ok-l);color:var(--ok);font-weight:700}
  .choice.wrong{border-color:var(--vermilion);background:var(--vermilion-l);color:var(--vermilion)}
  .choice.dim{opacity:.5}
  .choice.dunno{border-style:dashed;color:var(--muted);text-align:center;font-weight:700}
  .choice:disabled{cursor:default}

  .kanji-hint{margin-top:14px;text-align:center;background:var(--indigo-l);border:1px solid #c9d5f0;border-radius:12px;padding:12px 14px;animation:fade .2s}
  .kanji-hint .kh-lead{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--indigo);opacity:.8}
  .kanji-hint .kh-word{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;font-weight:700;color:var(--indigo);margin-top:3px}
  .kanji-hint .kh-mean{font-size:13.5px;color:var(--indigo);margin-top:2px}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .reveal-btn{width:100%;border:1.5px solid var(--purple);background:var(--purple-l);color:var(--purple-d);border-radius:13px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:4px}
  .answer-box{background:var(--indigo-l);border:1px solid #c9d5f0;border-radius:13px;padding:18px 16px;text-align:center;margin-bottom:14px;animation:fade .2s}
  .answer-box .a-mean{font-size:16px;font-weight:700;color:var(--indigo);line-height:1.5;margin-top:4px}
  .answer-box .a-word{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:23px;font-weight:700;color:var(--indigo)}
  .judge{display:flex;gap:10px}
  .judge button{flex:1;border:0;border-radius:13px;padding:16px;font-size:15px;font-weight:700;cursor:pointer}
  .judge .miss{background:var(--vermilion-l);color:var(--vermilion);border:1.5px solid var(--vermilion)}
  .judge .got{background:var(--ok-l);color:var(--ok);border:1.5px solid var(--ok)}

  /* 結果 */
  .result-hero{text-align:center;padding:24px 0 6px}
  .result-score{font-family:"Hiragino Mincho ProN",serif;font-size:56px;font-weight:700;color:var(--purple-d);line-height:1}
  .result-score small{font-size:22px;color:var(--muted)}
  .result-msg{font-size:15px;font-weight:700;margin-top:8px;color:var(--purple-d)}
  .result-pct{font-size:13px;color:var(--muted);margin-top:2px}
  .point-earned{display:inline-block;margin-top:10px;background:var(--ok-l);color:var(--ok);border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700}
  .miss-label{font-size:12px;font-weight:700;color:var(--vermilion);letter-spacing:.06em;margin:22px 4px 10px}
  .miss-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--vermilion);border-radius:10px;padding:11px 14px;margin-bottom:8px}
  .miss-item .mw{font-family:"Hiragino Mincho ProN",serif;font-size:17px;font-weight:700;color:var(--text)}
  .miss-item .mm{font-size:13px;color:var(--muted);margin-top:2px}
  .result-actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .btn-primary{border:0;border-radius:13px;padding:15px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple-d));cursor:pointer}
  .btn-ghost{border:1.5px solid var(--border);background:var(--surface);border-radius:13px;padding:15px;font-size:15px;font-weight:700;color:var(--purple-d);cursor:pointer}
  .foot{text-align:center;font-size:11px;color:var(--muted);padding:16px;opacity:.7}
  /* ==== 漢字テスト追加スタイル ==== */
  .mode-tabs{display:flex;gap:8px;margin:16px 0}
  .mode-tabs button{flex:1;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:700;font-size:14px;color:var(--purple-d);cursor:pointer}
  .mode-tabs button.on{border-color:var(--purple);background:var(--purple-l)}
  .today-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:var(--radius);padding:16px;margin-top:12px}
  .today-card .tc-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--purple);margin-bottom:4px}
  .today-card .tc-range{font-size:20px;font-weight:800;color:var(--purple-d)}
  .today-card .tc-meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .today-card .tc-done{display:inline-block;margin-top:8px;background:var(--ok-l);color:var(--ok);border-radius:16px;padding:5px 14px;font-size:12.5px;font-weight:700}
  .today-card .tc-score{display:inline-block;margin-top:8px;background:var(--indigo-l);color:var(--indigo);border-radius:16px;padding:5px 14px;font-size:12.5px;font-weight:700}
  .test-start-btn{width:100%;margin-top:12px;border:0;border-radius:13px;padding:15px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple-d));cursor:pointer}
  .test-start-btn:disabled{opacity:.5}
  .empty-note{text-align:center;color:var(--muted);font-size:13px;padding:20px 10px;line-height:1.7}

  /* 例文プロンプト */
  .ex-sentence{font-size:19px;line-height:1.9;color:var(--text);text-align:left;font-weight:600}
  .ex-sentence .ul{display:inline-block;border-bottom:3px solid var(--vermilion);color:var(--vermilion);font-weight:800;padding:0 2px;font-family:"Hiragino Kaku Gothic ProN",sans-serif}
  .prompt.exwrap{padding:24px 20px;text-align:left;min-height:auto}
  .choice.kanji{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;font-weight:600;text-align:center}

  /* 先生: 配信管理 */
  .adm-section{margin-top:18px}
  .adm-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .adm-row label{font-size:12.5px;font-weight:700;color:var(--muted);min-width:56px}
  .adm-input,.adm-select{border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--surface);color:var(--text)}
  .adm-input{flex:1;min-width:90px}
  .adm-select{flex:1;min-width:120px}
  .adm-add-btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--indigo),#1c2f5c);cursor:pointer;margin-top:4px}
  .sched-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .sched-item .si-main{font-weight:700;font-size:14px;color:var(--purple-d)}
  .sched-item .si-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .sched-del{border:1px solid var(--red);background:var(--red-l);color:var(--red);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}

  /* 先生: 成績・正答率 */
  .stat-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
  .stat-bar-label{min-width:64px;font-weight:700;color:var(--text)}
  .stat-bar-track{flex:1;height:16px;background:var(--purple-l);border-radius:8px;overflow:hidden}
  .stat-bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--purple-d));border-radius:8px}
  .stat-bar-val{min-width:52px;text-align:right;font-weight:700;font-size:12.5px;color:var(--purple-d)}
  .stat-q-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--bg);margin-bottom:5px;font-size:13px}
  .stat-q-no{min-width:34px;font-weight:800;color:var(--purple-d)}
  .stat-q-ex{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}

      <input id="login-pin" class="field-input" type="password" inputmode="numeric" placeholder="パスワード" autocomplete="current-password">

    </div>
  </div>

  <!-- ===== 生徒ホーム ===== -->
  <div id="screen-home" class="screen">

          <div class="top-title">fit漢字テスト</div>
        </div>
        <div class="top-right">
          <button class="logout-btn" onclick="logout()">ログアウト</button>
        </div>
      </div>
    </div>

    <div id="today-wrap"></div>

    <div class="section-label" style="margin-top:20px">事前勉強（練習・記録なし）</div>

          <button data-n="20">20</button>
          <button data-n="30">30</button>
          <button data-n="50">50</button>
        </div>
      </div>
    </div>
    <button class="start-btn" id="study-start" onclick="startStudy()">練習をはじめる</button>

    </div>

  <!-- ===== クイズ（事前勉強・テスト共通） ===== -->
  <div id="screen-quiz" class="screen">

    </div>

    <div class="choices" id="choices"></div>
    <div id="kanji-hint" class="kanji-hint" style="display:none"></div>
  </div>

  <!-- ===== 事前勉強の結果 ===== -->
  <div id="screen-result" class="screen">
    <div class="result-hero">
      <div class="result-score" id="r-score">0<small>/10</small></div>

      <div class="result-pct" id="r-pct"></div>
    </div>
    <div id="miss-wrap"></div>
    <div class="result-actions">

    </div>
  </div>

  <div id="screen-test-result" class="screen">

    <div id="tr-miss-wrap"></div>
    <div class="result-actions">
      <button class="btn-primary" onclick="goHome()">ホームに戻る</button>
    </div>
  </div>

let currentStudent = null;
let isStaff = false;
let currentStaffTags = [];

async function hashPin(staffId, pin){
  const salt='fit-juku::'+String(staffId).toLowerCase()+'::';
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+String(pin)));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function saveLoginState(email,pin){ localStorage.setItem('fit_email',email); localStorage.setItem('fit_pin',pin); localStorage.setItem('fit_role','student'); }
function clearLoginState(){ localStorage.removeItem('fit_email'); localStorage.removeItem('fit_pin'); localStorage.removeItem('fit_role'); localStorage.removeItem('fit_staff_id'); localStorage.removeItem('fit_staff_hash'); }

async function tryStaffLogin(idOrEmail, pin){
  const staffId=String(idOrEmail).trim().toLowerCase();
  const data=await sbGet('staff','staff_id=eq.'+encodeURIComponent(staffId)+'&is_active=eq.true&select=*');
  if(!data||!data.length) return false;
  const st=data[0];
  let ok=false, hash=null;
  if(st.pin_hash){ hash=await hashPin(staffId,pin); ok=(hash===st.pin_hash); }
  else { ok=(String(st.pin)===String(pin)); if(ok) hash=await hashPin(staffId,pin); }
  if(!ok) return false;
  isStaff=true;
  currentStaffTags=Array.isArray(st.tags)?st.tags:[];
  currentStudent={ id:st.id, name:st.name+'（スタッフ）', points:0 };
  localStorage.setItem('fit_staff_id',staffId);
  localStorage.setItem('fit_staff_hash',hash||st.pin_hash||'');
  localStorage.setItem('fit_role','staff');
  return true;
}

      const sid=localStorage.getItem('fit_staff_id'), shash=localStorage.getItem('fit_staff_hash');

        const data=await sbGet('staff','staff_id=eq.'+encodeURIComponent(sid)+'&is_active=eq.true&select=*');
        if(data&&data.length&&data[0].pin_hash&&data[0].pin_hash===shash){

    const data=await sbGet('students','email=eq.'+encodeURIComponent(email)+'&pin=eq.'+encodeURIComponent(pin)+'&select=*');

// 1000行超を分割取得
async function sbGetAll(table, query){
  let all=[]; let from=0; const step=1000;
  while(true){
    const res=await fetch(SB_URL+'/rest/v1/'+table+'?'+query,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Range-Unit':'items','Range':from+'-'+(from+step-1)}});
    if(!res.ok) throw new Error(await res.text());
    const rows=await res.json();
    all=all.concat(rows);
    if(rows.length<step) break;
    from+=step;
    if(from>50000) break;
  }
  return all;
}

/* KANJI データは kanji_data.js で埋め込み。
   形式: [番号, 正解idx(1-4), 例文(傍線={カナ}), 選1,選2,選3,選4] */
const RANGE_MAX = 299;
const BLOCK = 50;
// ブロック定義（1-50, 51-100, ..., 251-299）
const BLOCKS = [];
for(let lo=1; lo<=RANGE_MAX; lo+=BLOCK){
  const hi=Math.min(lo+BLOCK-1, RANGE_MAX);
  BLOCKS.push({lo,hi});
}
function kanjiInRange(lo,hi){ return KANJI.filter(k=>k[0]>=lo && k[0]<=hi); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
// 例文 {カナ} → 下線付き表示
function renderSentence(sent){
  return escapeHtml(sent).replace(/\{([^}]*)\}/g, '<span class="ul">$1</span>');
}

/* ==== クイズ本体（事前勉強・テスト共通） ==== */
let quiz=null;
// quiz = { mode:'study'|'test', qs:[{k, opts:[...]}], i, correct, miss:[], answered, range?, date? }
function buildQuiz(pool, count, mode, range, date){
  let list = shuffle(pool);
  if(count>0) list=list.slice(0, Math.min(count, list.length));
  const qs=list.map(k=>{
    // 選択肢: 元の4択(k[3..6])。正解idx=k[1]。順序シャッフルして正解位置を追跡
    const opts=[
      {text:k[3], correct:k[1]===1},
      {text:k[4], correct:k[1]===2},
      {text:k[5], correct:k[1]===3},
      {text:k[6], correct:k[1]===4},
    ];
    return { k, opts: shuffle(opts) };
  });
  return { mode, qs, i:0, correct:0, miss:[], answered:false, range, date, answerLog:[] };
}
function startStudy(){
  const pool=studyPool();
  if(!pool.length){ showToast('範囲を選んでください','info'); return; }
  quiz=buildQuiz(pool, study.count, 'study');
  showScreen('screen-quiz'); renderQ();
}
async function startTest(lo, hi, date){
  // 二重受験ガード（念のため再確認）
  try{
    const r=await sbGet('kanji_test_results','student_id=eq.'+encodeURIComponent(currentStudent.id)+'&range_lo=eq.'+lo+'&range_hi=eq.'+hi+'&test_date=eq.'+date+'&select=id&limit=1');
    if(r&&r.length){ showToast('このテストは受験済みです','info'); await renderToday(); return; }
  }catch(e){}
  const pool=kanjiInRange(lo,hi);
  if(!pool.length){ showToast('この範囲には問題がありません','info'); return; }
  quiz=buildQuiz(pool, 0, 'test', {lo,hi}, date); // count=0 → 全問
  showScreen('screen-quiz'); renderQ();
}
function renderQ(){
  const q=quiz.qs[quiz.i];
  quiz.answered=false;
  document.getElementById('kanji-hint').style.display='none';
  document.getElementById('q-prog').textContent=(quiz.i+1)+' / '+quiz.qs.length;
  document.getElementById('q-bar').style.width=(quiz.i/quiz.qs.length*100)+'%';
  document.getElementById('prompt-label').textContent = quiz.mode==='test' ? '傍線部を漢字にすると？（テスト）' : '傍線部を漢字にすると？';
  document.getElementById('prompt-sentence').innerHTML=renderSentence(q.k[2]);
  const choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  q.opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='choice kanji';
    btn.textContent=o.text;
    btn.dataset.correct=o.correct?'1':'0';
    btn.onclick=()=>pickChoice(btn,q);
    choicesEl.appendChild(btn);
  });
  if(quiz.mode==='study'){
    const dunno=document.createElement('button');
    dunno.className='choice dunno';
    dunno.textContent='わからない';
    dunno.dataset.correct='0';
    dunno.onclick=()=>pickChoice(dunno,q,true);
    choicesEl.appendChild(dunno);
  }
}
function pickChoice(btn,q,forceDunno){
  if(quiz.answered) return;
  quiz.answered=true;
  const isCorrect = !forceDunno && btn.dataset.correct==='1';
  document.querySelectorAll('#choices .choice').forEach(b=>{ b.disabled=true;
    if(b.dataset.correct==='1' && !b.classList.contains('dunno')) b.classList.add('correct');
    else b.classList.add('dim');
  });
  if(!isCorrect){ btn.classList.remove('dim'); if(!forceDunno) btn.classList.add('wrong'); }
  // こたえ表示
  const correctText=q.opts.find(o=>o.correct).text;
  const el=document.getElementById('kanji-hint');
  el.innerHTML='<div class="kh-lead">こたえ</div><div class="kh-word">'+escapeHtml(correctText)+'</div>';
  el.style.display='block';
  // 記録
  if(isCorrect) quiz.correct++; else quiz.miss.push(q.k);
  quiz.answerLog.push({ no:q.k[0], correct:isCorrect });
  const wait = isCorrect ? 1100 : 1900;
  setTimeout(next, wait);
}
function next(){
  quiz.i++;
  if(quiz.i>=quiz.qs.length){ finishQuiz(); return; }
  renderQ();
}
function quitQuiz(){
  const msg = quiz && quiz.mode==='test'
    ? 'テストを中断するとこの範囲は未受験のままです。やめますか？'
    : 'やめてホームに戻りますか？';
  if(confirm(msg)) goHome();
}
async function finishQuiz(){
  document.getElementById('q-bar').style.width='100%';
  if(quiz.mode==='study'){ showStudyResult(); }
  else { await submitTestResult(); }
}

/* ==== 事前勉強の結果 ==== */
function showStudyResult(){
  const total=quiz.qs.length, c=quiz.correct, pct=Math.round(c/total*100);
  document.getElementById('r-score').innerHTML=c+'<small>/'+total+'</small>';
  document.getElementById('r-pct').textContent='正答率 '+pct+'%';
  document.getElementById('r-msg').textContent = pct===100?'満点！お見事' : pct>=80?'よくできました' : pct>=60?'あと少し' : 'まちがえた問題を覚え直そう';
  const wrap=document.getElementById('miss-wrap');
  if(quiz.miss.length){
    let html='<div class="miss-label">✕ まちがえた問題 '+quiz.miss.length+'</div>';
    quiz.miss.forEach(k=>{
      const correctText=k[k[1]+2];
      html+='<div class="miss-item"><div class="mw" style="font-size:15px">'+renderSentence(k[2])+'</div><div class="mm">こたえ：'+escapeHtml(correctText)+'</div></div>';
    });
    wrap.innerHTML=html;
    document.getElementById('retry-miss-btn').style.display='block';
  }else{
    wrap.innerHTML='<div style="text-align:center;color:var(--ok);font-weight:700;margin:18px 0">全問正解！</div>';
    document.getElementById('retry-miss-btn').style.display='none';
  }
  showScreen('screen-result');
}
function retryStudy(){ quiz=buildQuiz(studyPool(), study.count, 'study'); showScreen('screen-quiz'); renderQ(); }
function retryStudyMiss(){
  const pool=quiz.miss.slice();
  if(!pool.length){ retryStudy(); return; }
  quiz=buildQuiz(pool, 0, 'study'); showScreen('screen-quiz'); renderQ();
}

/* ==== テスト結果の記録 ==== */
async function submitTestResult(){
  const total=quiz.qs.length, c=quiz.correct, pct=Math.round(c/total*100);
  const {lo,hi}=quiz.range;
  // 結果保存（1範囲1回。UNIQUE制約で重複はエラーになるので握りつぶす）
  try{
    await sbPost('kanji_test_results',{
      student_id: currentStudent.id,
      range_lo: lo, range_hi: hi,
      test_date: quiz.date,
      score: c, total: total,
      taken_at: new Date().toISOString()
    });
  }catch(e){ /* 二重送信など。結果表示は続ける */ }
  // 問題別ログ
  try{
    const rows=quiz.answerLog.map(a=>({ student_id: currentStudent.id, question_no: a.no, is_correct: a.correct, test_date: quiz.date, range_lo: lo, range_hi: hi }));
    if(rows.length) await sbPost('kanji_answer_logs', rows);
  }catch(e){}
  // 表示
  document.getElementById('tr-score').innerHTML=c+'<small>/'+total+'</small>';
  document.getElementById('tr-pct').textContent='正答率 '+pct+'%';
  document.getElementById('tr-range').textContent='範囲 '+lo+'〜'+hi+' ・ '+quiz.date;
  document.getElementById('tr-msg').textContent = pct>=90?'よくできました' : pct>=70?'合格ライン' : '復習しよう';
  const wrap=document.getElementById('tr-miss-wrap');
  if(quiz.miss.length){
    let html='<div class="miss-label">✕ まちがえた問題 '+quiz.miss.length+'</div>';
    quiz.miss.forEach(k=>{
      const correctText=k[k[1]+2];
      html+='<div class="miss-item"><div class="mw" style="font-size:15px">'+renderSentence(k[2])+'</div><div class="mm">こたえ：'+escapeHtml(correctText)+'</div></div>';
    });
    wrap.innerHTML=html;
  }else{ wrap.innerHTML='<div style="text-align:center;color:var(--ok);font-weight:700;margin:18px 0">全問正解！</div>'; }
  showScreen('screen-test-result');
}

/* ==== 先生: クラスマスタ ==== */
let classMaster=[]; // [{id, name}]
async function loadClassMaster(){
  try{
    const rows=await sbGet('class_master','select=id,name&order=name.asc');
    classMaster=rows||[];
  }catch(e){ classMaster=[]; }
  // セレクトに反映
  ['adm-class','stat-class'].forEach(id=>{
    const sel=document.getElementById(id); if(!sel) return;
    sel.innerHTML=classMaster.map(c=>'<option value="'+c.id+'">'+escapeHtml(c.name||c.id)+'</option>').join('');
  });
  // 成績の範囲セレクト
  const rs=document.getElementById('stat-range');
  if(rs) rs.innerHTML=BLOCKS.map(b=>'<option value="'+b.lo+'-'+b.hi+'">'+b.lo+'〜'+b.hi+'</option>').join('');
}

/* ==== 先生: 配信管理 ==== */
function openAdmin(){
  const d=document.getElementById('adm-date'); if(!d.value) d.value=getTodayJST();
  loadSchedules();
  showScreen('screen-admin');
}
async function addSchedule(){
  const classId=document.getElementById('adm-class').value;
  const date=document.getElementById('adm-date').value;
  const lo=parseInt(document.getElementById('adm-lo').value,10);
  const hi=parseInt(document.getElementById('adm-hi').value,10);
  if(!classId){ showToast('クラスを選んでください','info'); return; }
  if(!date){ showToast('日付を選んでください','info'); return; }
  if(!lo||!hi||lo<1||hi>RANGE_MAX||lo>hi){ showToast('範囲が正しくありません（1〜'+RANGE_MAX+'）','info'); return; }
  try{
    await sbPost('kanji_test_schedule',{ class_master_id:classId, test_date:date, range_lo:lo, range_hi:hi, created_by:(currentStudent&&currentStudent.id)||null });
    showToast('配信を登録しました','success');
    document.getElementById('adm-lo').value=''; document.getElementById('adm-hi').value='';
    loadSchedules();
  }catch(e){ showToast('登録に失敗しました（SQL適用を確認）','info'); }
}
let admFilter='upcoming';
(function(){ /* フィルタタブ */
  document.addEventListener('DOMContentLoaded',()=>{
    const f=document.getElementById('adm-filter');
    if(f) f.querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ f.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); admFilter=b.dataset.f; loadSchedules(); }; });
  });
})();
async function loadSchedules(){
  const list=document.getElementById('sched-list');
  list.innerHTML='<div class="empty-note">読み込み中...</div>';
  const classMap={}; classMaster.forEach(c=>classMap[c.id]=c.name||c.id);
  try{
    let q='select=*&order=test_date.desc';
    if(admFilter==='upcoming') q='test_date=gte.'+getTodayJST()+'&select=*&order=test_date.asc';
    const rows=await sbGet('kanji_test_schedule', q);
    if(!rows||!rows.length){ list.innerHTML='<div class="empty-note">登録された配信はありません。</div>'; return; }
    list.innerHTML=rows.map(s=>{
      const cname=classMap[s.class_master_id]||'(不明なクラス)';
      return '<div class="sched-item"><div><div class="si-main">'+escapeHtml(cname)+' ／ '+s.range_lo+'〜'+s.range_hi+'</div><div class="si-sub">'+s.test_date+'</div></div>'+
        '<button class="sched-del" onclick="delSchedule(\''+s.id+'\')">削除</button></div>';
    }).join('');
  }catch(e){ list.innerHTML='<div class="empty-note">読み込みに失敗しました。</div>'; }
}
async function delSchedule(id){
  if(!confirm('この配信を削除しますか？')) return;
  try{
    await sbDelete('kanji_test_schedule','id=eq.'+encodeURIComponent(id));
    showToast('削除しました','info'); loadSchedules();
  }catch(e){ showToast('削除に失敗しました','info'); }
}

/* ==== 先生: 成績・正答率 ==== */
let statView='summary';
function openStats(){ loadClassMaster().then(()=>{ bindStatTabs(); loadStats(); }); showScreen('screen-stats'); }
function bindStatTabs(){
  const t=document.getElementById('stat-view-tabs');
  t.querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ t.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); statView=b.dataset.v; loadStats(); }; });
  document.getElementById('stat-class').onchange=loadStats;
  document.getElementById('stat-range').onchange=loadStats;
}
async function loadStats(){
  const body=document.getElementById('stats-body');
  const classId=document.getElementById('stat-class').value;
  const rangeVal=document.getElementById('stat-range').value;
  if(!classId||!rangeVal){ body.innerHTML='<div class="empty-note">クラスと範囲を選んでください</div>'; return; }
  const [lo,hi]=rangeVal.split('-').map(Number);
  body.innerHTML='<div class="empty-note">集計中...</div>';
  // クラスの生徒ID一覧
  let studentIds=[];
  try{
    const enr=await sbGet('class_enrollments','class_master_id=eq.'+encodeURIComponent(classId)+'&ended_on=is.null&select=student_id');
    studentIds=[...new Set((enr||[]).map(e=>e.student_id).filter(Boolean))];
  }catch(e){ studentIds=[]; }
  if(!studentIds.length){ body.innerHTML='<div class="empty-note">このクラスに在籍生徒がいません。</div>'; return; }
  if(statView==='summary'){ await renderStatSummary(body, studentIds, lo, hi); }
  else { await renderStatQuestions(body, studentIds, lo, hi); }
}
async function renderStatSummary(body, studentIds, lo, hi){
  // kanji_test_results から該当範囲の結果
  let results=[];
  try{
    const q='range_lo=eq.'+lo+'&range_hi=eq.'+hi+'&student_id=in.('+studentIds.map(id=>'"'+id+'"').join(',')+')&select=student_id,score,total,test_date';
    results=await sbGetAll('kanji_test_results', q);
  }catch(e){ results=[]; }
  if(!results.length){ body.innerHTML='<div class="empty-note">この範囲の受験結果はまだありません。</div>'; return; }
  // 生徒名解決
  const names=await resolveNames(studentIds);
  // 生徒ごとに最新1件（1範囲1回なので基本1件）
  const byStudent={};
  results.forEach(r=>{ byStudent[r.student_id]=r; });
  const taken=Object.keys(byStudent).length;
  const avgPct=Math.round(Object.values(byStudent).reduce((s,r)=>s+(r.score/r.total*100),0)/taken);
  let html='<div class="card" style="margin-bottom:14px"><div class="cfg-row"><span class="lbl">受験者数</span><b>'+taken+' / '+studentIds.length+' 人</b></div>'+
    '<div class="cfg-row"><span class="lbl">平均正答率</span><b style="color:var(--purple-d)">'+avgPct+'%</b></div></div>';
  html+='<div class="section-label">生徒別</div>';
  const rows=Object.entries(byStudent).map(([sid,r])=>({name:names[sid]||'(不明)', pct:Math.round(r.score/r.total*100), score:r.score, total:r.total}));
  rows.sort((a,b)=>b.pct-a.pct);
  rows.forEach(r=>{
    html+='<div class="stat-bar-row"><span class="stat-bar-label" style="min-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(r.name)+'</span>'+
      '<div class="stat-bar-track"><div class="stat-bar-fill" style="width:'+r.pct+'%"></div></div>'+
      '<span class="stat-bar-val">'+r.score+'/'+r.total+'</span></div>';
  });
  // 未受験者
  const notTaken=studentIds.filter(id=>!byStudent[id]);
  if(notTaken.length){
    html+='<div class="section-label" style="margin-top:16px">未受験（'+notTaken.length+'人）</div>';
    html+='<div class="empty-note" style="text-align:left;padding:6px 4px">'+notTaken.map(id=>escapeHtml(names[id]||'(不明)')).join('、')+'</div>';
  }
  body.innerHTML=html;
}
async function renderStatQuestions(body, studentIds, lo, hi){
  let logs=[];
  try{
    const q='range_lo=eq.'+lo+'&range_hi=eq.'+hi+'&student_id=in.('+studentIds.map(id=>'"'+id+'"').join(',')+')&select=question_no,is_correct';
    logs=await sbGetAll('kanji_answer_logs', q);
  }catch(e){ logs=[]; }
  if(!logs.length){ body.innerHTML='<div class="empty-note">この範囲の解答データはまだありません。</div>'; return; }
  // 問題別集計
  const agg={};
  logs.forEach(l=>{ const n=l.question_no; if(!agg[n]) agg[n]={c:0,t:0}; agg[n].t++; if(l.is_correct) agg[n].c++; });
  const items=Object.entries(agg).map(([no,v])=>({no:parseInt(no,10), rate:Math.round(v.c/v.t*100), t:v.t}));
  items.sort((a,b)=>a.rate-b.rate); // 正答率が低い順（=苦手が上）
  const kanjiMap={}; KANJI.forEach(k=>kanjiMap[k[0]]=k);
  let html='<div class="section-label">正答率が低い順（要復習）</div>';
  items.forEach(it=>{
    const k=kanjiMap[it.no];
    const ex=k?renderSentence(k[2]):'';
    const cls=it.rate<50?'low':it.rate<80?'mid':'high';
    html+='<div class="stat-q-item"><span class="stat-q-no">'+it.no+'</span><span class="stat-q-ex">'+ex+'</span><span class="stat-q-rate '+cls+'">'+it.rate+'%</span></div>';
  });
  body.innerHTML=html;
}

/* 生徒名解決 */
const nameCache={};
async function resolveNames(ids){
  const need=ids.filter(id=>id && !(id in nameCache));
  if(need.length){
    try{
      const rows=await sbGet('students','id=in.('+need.map(id=>'"'+id+'"').join(',')+')&select=id,name');
      (rows||[]).forEach(r=>{ nameCache[r.id]=r.name; });
    }catch(e){}
    need.forEach(id=>{ if(!(id in nameCache)) nameCache[id]='(不明)'; });
  }
  const out={}; ids.forEach(id=>out[id]=nameCache[id]||'(不明)'); return out;
}

/* ==== ナビ ==== */
async function goHome(){ if(!isStaff){ await renderToday(); } showScreen('screen-home'); }

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>f i t 冬期講習2026 めくるパンフ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* レイアウト：1画面に収める。上に題とページ番号、まん中に本（広い画面は見開き・スマホは1ページ）、下にめくるボタン */
:root{ --bg:#e9eef3; --bar:#ffffff; --ink:#3d4248; --sub:#6b737c; --line:#cfd6dd; --orange:#d96a08; --on-orange:#ffffff; --shade:rgb(40 60 80 / .25);
  --body:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#14181d; --bar:#1d232a; --ink:#e6eaee; --sub:#a3adb7; --line:#38424d; --orange:#f08a2c; --on-orange:#1a1206; --shade:rgb(0 0 0 / .5); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#14181d; --bar:#1d232a; --ink:#e6eaee; --sub:#a3adb7; --line:#38424d; --orange:#f08a2c; --on-orange:#1a1206; --shade:rgb(0 0 0 / .5); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; display:flex; flex-direction:column; overflow:hidden}
.row{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
header{background:var(--bar); border-bottom:1px solid var(--line); padding-block:8px; display:flex; gap:12px; align-items:center; justify-content:space-between}
h1{margin:0; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
#count{flex:none; font-variant-numeric:tabular-nums; font-weight:700; color:var(--sub)}
.stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding-block:12px; position:relative}
.fit{width:100%; max-height:100%; display:flex; justify-content:center}
#book{filter:drop-shadow(0 6px 18px var(--shade))}
.page{background:#fff}
.page img{display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none; pointer-events:none}
footer{background:var(--bar); border-top:1px solid var(--line); padding-block:8px; display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap}
button{font:inherit; font-weight:700; color:var(--ink); background:var(--bar); border:1px solid var(--line); border-radius:8px; padding:8px 16px; cursor:pointer; min-height:40px}
button.main{background:var(--orange); color:var(--on-orange); border-color:var(--orange)}
button:disabled{opacity:.4; cursor:default}
button:focus-visible{outline:3px solid var(--orange); outline-offset:2px}
.hint{flex-basis:100%; margin:0; text-align:center; font-size:12px; color:var(--sub)}
#zoom{position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
#zoom .zbar{background:var(--bar); border-bottom:1px solid var(--line); padding-block:8px; display:flex; gap:8px; align-items:center; justify-content:space-between}
#zoom .zscroll{flex:1; overflow:auto; -webkit-overflow-scrolling:touch}
#zoom img{display:block; width:200%; max-width:none; background:#fff}
@media (min-width:900px){ #zoom img{width:100%; max-width:1240px; margin-inline:auto} }
</style>

<header class="row"><h1>f i t 冬期講習 2026 - 2027（高1・2生）</h1><span id="count" aria-live="polite">1 / 8</span></header>
<div class="stage row"><div class="fit"><div id="book">
  <div class="page" data-density="hard"><img src="winter2026/p-1.jpg" alt="表紙"></div>
  <div class="page"><img src="winter2026/p-2.jpg" alt="2ページ目 冬期講習のご案内"></div>
  <div class="page"><img src="winter2026/p-3.jpg" alt="3ページ目 英語"></div>
  <div class="page"><img src="winter2026/p-4.jpg" alt="4ページ目 数学"></div>
  <div class="page"><img src="winter2026/p-5.jpg" alt="5ページ目 国語"></div>
  <div class="page"><img src="winter2026/p-6.jpg" alt="6ページ目 理科"></div>
  <div class="page"><img src="winter2026/p-7.jpg" alt="7ページ目 料金・お申し込み"></div>
  <div class="page" data-density="hard"><img src="winter2026/p-8.jpg" alt="8ページ目 冬の2大キャンペーン"></div>
</div></div></div>
<footer class="row">
  <button type="button" id="prev">‹ 前へ</button>
  <button type="button" id="zoomb">拡大して読む</button>
  <button type="button" id="next" class="main">次へ ›</button>
  <p class="hint">ページの端を引っぱるか、ボタンでめくれます。</p>
</footer>
<div id="zoom" hidden>
  <div class="zbar row"><span id="ztitle" style="font-weight:700"></span><span><button type="button" id="zprev">‹</button> <button type="button" id="znext">›</button> <button type="button" id="zclose" class="main">閉じる</button></span></div>
  <div class="zscroll"><img id="zimg" alt=""></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
  var N=8, $=function(id){return document.getElementById(id);};
  var stage=document.querySelector('.stage'), fit=document.querySelector('.fit');
  // 本の大きさ：画面の高さに合わせて幅を決める（A4の縦横比 620:877）
  function sizeFit(){
    var h=stage.clientHeight-24, w=stage.clientWidth-32;
    var two = w>=h*1.1 && w>=640;               // 見開きにできる広さ（幅640未満は1ページ）
    var pw=Math.min(two? w/2 : w, h*620/877, two? 900 : 620);
    if(two && pw*2<640){ two=false; pw=Math.min(w, h*620/877, 620); }
    fit.style.maxWidth=Math.floor(pw*(two?2:1))+'px';
  }
  sizeFit();
  var pf=new St.PageFlip($('book'),{width:620,height:877,size:'stretch',minWidth:315,maxWidth:900,minHeight:200,maxHeight:1273,
    showCover:true,usePortrait:true,mobileScrollSupport:true,maxShadowOpacity:.35,flippingTime:700,autoSize:true});
  pf.loadFromHTML(document.querySelectorAll('.page'));
  function label(i){ return (i+1)+' / '+N; }
  function sync(){ var i=pf.getCurrentPageIndex(); $('count').textContent=label(i); $('prev').disabled=i<=0; $('next').disabled=i>=N-1; }
  pf.on('flip',sync); pf.on('changeOrientation',sync); sync();
  $('prev').addEventListener('click',function(){pf.flipPrev();});
  $('next').addEventListener('click',function(){pf.flipNext();});
  var rt; addEventListener('resize',function(){clearTimeout(rt); rt=setTimeout(function(){sizeFit(); pf.update();},150);});
  // 拡大
  var z=0;
  function showZ(i){ z=Math.max(0,Math.min(N-1,i)); $('zimg').src='winter2026/p-'+(z+1)+'.jpg'; $('zimg').alt=(z+1)+'ページ目'; $('ztitle').textContent=label(z);
    $('zprev').disabled=z<=0; $('znext').disabled=z>=N-1; document.querySelector('.zscroll').scrollTo(0,0); }
  $('zoomb').addEventListener('click',function(){ $('zoom').hidden=false; showZ(pf.getCurrentPageIndex()); $('zclose').focus(); });
  $('zprev').addEventListener('click',function(){showZ(z-1);});
  $('znext').addEventListener('click',function(){showZ(z+1);});
  function closeZ(){ $('zoom').hidden=true; pf.turnToPage(z); sync(); $('zoomb').focus(); }
  $('zclose').addEventListener('click',closeZ);
  addEventListener('keydown',function(e){
    var open=!$('zoom').hidden;
    if(e.key==='Escape'&&open) closeZ();
    else if(e.key==='ArrowRight') open? showZ(z+1) : pf.flipNext();
    else if(e.key==='ArrowLeft') open? showZ(z-1) : pf.flipPrev();
  });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC 模擬テスト</title>
<style>
  :root{
    --navy:#12284c; --navy2:#1c3b6b; --accent:#c8102e; --accent2:#e23c53;
    --bg:#f5f6f8; --card:#ffffff; --line:#e2e6ec; --ink:#1a2233; --sub:#5c6a80;
    --ok:#1f9d55; --okbg:#e7f6ee; --ng:#c8102e; --ngbg:#fbe9ec;
    --shadow:0 1px 3px rgba(18,40,76,.08),0 4px 16px rgba(18,40,76,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%}
  header.app{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}
  header.app .brand{display:flex;align-items:baseline;gap:10px}
  header.app .brand b{font-size:20px;letter-spacing:.5px}
  header.app .brand span{font-size:12px;opacity:.8}
  header.app .nav{display:flex;gap:6px}
  header.app .nav button{background:rgba(255,255,255,.12);color:#fff;border:0;padding:8px 14px;border-radius:999px;
    font-size:13px;cursor:pointer;transition:.15s}
  header.app .nav button:hover{background:rgba(255,255,255,.24)}
  header.app .nav button.on{background:#fff;color:var(--navy)}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px;margin-bottom:16px}
  h2.sec{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
  h2.sec::before{content:"";width:4px;height:18px;background:var(--accent);border-radius:2px}
  .muted{color:var(--sub);font-size:13px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;
    padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;background:var(--navy);color:#fff}
  .btn:hover{background:var(--navy2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.accent{background:var(--accent)} .btn.accent:hover{background:var(--accent2)}
  .btn.ghost{background:#eef1f6;color:var(--navy)} .btn.ghost:hover{background:#e2e8f2}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .grid{display:grid;gap:12px}
  .part-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .part-tile{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;background:#fff;transition:.15s;text-align:left}
  .part-tile:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:var(--shadow)}
  .part-tile .pn{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.5px}
  .part-tile .pt{font-size:15px;font-weight:700;margin-top:2px}
  .part-tile .pd{font-size:12px;color:var(--sub);margin-top:4px}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#eef1f6;color:var(--navy);font-weight:600}
  .badge.list{background:#e8f0fe;color:#1a56db} .badge.read{background:#fdeced;color:var(--accent)}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .set-row:last-child{border-bottom:0}
  .set-row .meta{font-size:13px;color:var(--sub)}
  label.fld{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--navy)}
  input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:80px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .q-audio{background:#f0f4fa;border:1px solid #dbe4f2;border-radius:12px;padding:14px;margin-bottom:14px}
  .q-audio audio{width:100%;margin-top:6px}
  .q-img{width:100%;max-height:340px;object-fit:contain;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;background:#fafbfc}
  .passage-text{background:#fbfbfd;border:1px solid var(--line);border-radius:10px;padding:16px;
    font-size:15px;line-height:1.9;white-space:pre-wrap;margin-bottom:16px}
  .q-block{margin-bottom:22px;padding-bottom:20px;border-bottom:1px dashed var(--line)}
  .q-block:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
  .q-num{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:700;
    padding:2px 9px;border-radius:6px;margin-right:8px}
  .q-text{font-weight:600;margin-bottom:12px}
  .choice{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.12s;background:#fff}
  .choice:hover{border-color:var(--navy);background:#f7f9fc}
  .choice.picked{border-color:var(--navy);background:#eef3fb;box-shadow:inset 0 0 0 1px var(--navy)}
  .choice.correct{border-color:var(--ok);background:var(--okbg)}
  .choice.wrong{border-color:var(--ng);background:var(--ngbg)}
  .choice .ltr{font-weight:700;color:var(--navy);min-width:20px}
  .expl{background:#fffdf5;border:1px solid #f0e4bd;border-radius:9px;padding:10px 12px;font-size:13px;margin-top:8px;color:#6b5a17}
  .score-hero{text-align:center;padding:28px 16px}
  .score-total{font-size:56px;font-weight:800;color:var(--navy);line-height:1}
  .score-lr{display:flex;gap:24px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .score-lr .b{background:#f5f7fa;border:1px solid var(--line);border-radius:12px;padding:14px 22px;min-width:130px}
  .score-lr .b .k{font-size:12px;color:var(--sub)} .score-lr .b .v{font-size:28px;font-weight:800;color:var(--navy)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:11px 20px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);z-index:99;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1}
  .hidden{display:none!important}
  .config-warn{background:#fdeCeb;border:1px solid #f3c6b8;color:#8a2b12;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px}
  .admin-q{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fafbfc}
  .flex-end{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
  .pill-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .pill-tabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer}
  .pill-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  @media(max-width:560px){.row2{grid-template-columns:1fr}.score-total{font-size:44px}}
</style>
</head>
<body>
<header class="app">
  <div class="brand"><b>TOEIC<span style="color:var(--accent2)">®</span> 模試</b><span>practice test</span></div>
  <div class="nav">
    <button id="navTake" class="on" onclick="showView('take')">受験</button>

    ⚠ Supabaseの接続情報が未設定です。ファイル冒頭の <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を設定してください。

  </div>

  <!-- ========== 管理ビュー ========== -->
  <div id="view-admin" class="hidden">
    <div class="pill-tabs">
      <button id="atCreate" class="on" onclick="adminTab('create')">テスト作成</button>
      <button id="atList" onclick="adminTab('list')">テスト一覧・編集</button>
      <button id="atResults" onclick="adminTab('results')">受験結果</button>
    </div>

    <!-- テスト作成 -->
    <div id="admin-create">
      <div class="card">
        <h2 class="sec">新しいテストを作成</h2>
        <div class="row2">
          <div>
            <label class="fld">パート</label>
            <select id="acPart" onchange="acPartChanged()">
              <option value="1">Part 1（写真描写）</option>
              <option value="2">Part 2（応答問題）</option>
              <option value="3">Part 3（会話）</option>

              <option value="5">Part 5（短文穴埋め）</option>
              <option value="6">Part 6（長文穴埋め）</option>
              <option value="7">Part 7（読解）</option>
            </select>
          </div>
          <div>
            <label class="fld">タイトル</label>
            <input type="text" id="acTitle" placeholder="例: Part5 実戦①">
          </div>
        </div>

        <input type="text" id="acBy" placeholder="スタッフ名など">
        <p class="muted" id="acHint" style="margin-top:10px"></p>
        <div class="flex-end">
          <button class="btn" onclick="createSet()">テストを作成して設問登録へ</button>

    </div>

    <!-- 設問登録エディタ -->
    <div id="admin-editor" class="hidden">
      <div class="card">
        <button class="btn ghost sm" onclick="adminTab('list')">← 一覧に戻る</button>
        <h2 class="sec" style="margin-top:14px" id="edTitle">設問を登録</h2>
        <p class="muted" id="edMeta"></p>

        <div id="edPassages"></div>

        <div style="border-top:2px dashed var(--line);margin:18px 0;padding-top:18px">

      </div>
    </div>

    <!-- テスト一覧 -->

      <div class="card">
        <h2 class="sec">テスト一覧</h2>
        <div id="adminSetsList"><p class="muted">読み込み中…</p></div>
      </div>

    <!-- 受験結果 -->
    <div id="admin-results" class="hidden">
      <div class="card">
        <h2 class="sec">受験結果</h2>
        <div id="adminResultsList"><p class="muted">読み込み中…</p></div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ▼▼▼ 接続設定：新しいSupabaseプロジェクト作成後にここを書き換える ▼▼▼
   ========================================================= */
const SUPABASE_URL      = "https://jjkfdvvbpzkagbtpqkzp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impra2ZkdnZicHprYWdidHBxa3pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNTg1ODIsImV4cCI6MjEwMTczNDU4Mn0.fRiZZeJVfxYh3XDarK9UDLWj94pAhB0Tnt3yl10_ovs";
/* ========================================================= */

const APP_VERSION = "toeic-20260808a";

const PARTS = {
  1:{t:"写真描写",d:"写真を見て正しい説明を選ぶ",sec:"listening",choices:4,type:"photo"},
  2:{t:"応答問題",d:"質問に対する応答を選ぶ",sec:"listening",choices:3,type:"audio"},
  3:{t:"会話問題",d:"会話を聞いて設問に答える",sec:"listening",choices:4,type:"audio"},
  4:{t:"説明文問題",d:"説明を聞いて設問に答える",sec:"listening",choices:4,type:"audio"},
  5:{t:"短文穴埋め",d:"空所に入る語句を選ぶ",sec:"reading",choices:4,type:"text"},
  6:{t:"長文穴埋め",d:"長文の空所を埋める",sec:"reading",choices:4,type:"text"},
  7:{t:"読解",d:"長文を読んで設問に答える",sec:"reading",choices:4,type:"text"},
};

/* ---- 近似スコア換算表（正答数→スコア）。5点刻み。実務用の目安値 ---- */
/* index = 正答数(0〜100)。Listening / Reading それぞれ100問想定で補間 */
function scaledScore(section, correct, total){
  // 正答率ベースで 5〜495 に線形＋端点補正した近似
  if(total<=0) return 0;
  const rate = correct/total;
  // TOEIC実データに寄せた近似カーブ（0%→5, 50%→約250, 100%→495）
  let s;
  if(section==="listening"){
    s = 5 + rate*490;
    // Listeningは中〜上位で緩やかに高め
    s = s * (0.85 + 0.15*Math.sqrt(rate));
  }else{
    s = 5 + rate*490;
    s = s * (0.80 + 0.20*Math.pow(rate,0.9));
  }
  s = Math.round(s/5)*5;
  return Math.max(5, Math.min(495, s));
}

/* ---------- Supabase REST ヘルパ ---------- */
function sbHeaders(extra){
  return Object.assign({
    "apikey":SUPABASE_ANON_KEY,
    "Authorization":"Bearer "+SUPABASE_ANON_KEY,
    "Content-Type":"application/json"
  }, extra||{});
}
async function sbGet(table, query){
  const url = SUPABASE_URL+"/rest/v1/"+table+(query?("?"+query):"");
  const r = await fetch(url,{headers:sbHeaders()});
  if(!r.ok) throw new Error(table+" GET "+r.status+" "+(await r.text()));
  return r.json();
}
async function sbPostReturn(table, body){
  const url = SUPABASE_URL+"/rest/v1/"+table;
  const r = await fetch(url,{method:"POST",headers:sbHeaders({"Prefer":"return=representation"}),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(table+" POST "+r.status+" "+(await r.text()));
  return r.json();
}
async function sbPost(table, body){
  const url = SUPABASE_URL+"/rest/v1/"+table;
  const r = await fetch(url,{method:"POST",headers:sbHeaders({"Prefer":"return=minimal"}),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(table+" POST "+r.status+" "+(await r.text()));
}
async function sbPatch(table, query, body){
  const url = SUPABASE_URL+"/rest/v1/"+table+"?"+query;
  const r = await fetch(url,{method:"PATCH",headers:sbHeaders({"Prefer":"return=minimal"}),body:JSON.stringify(body)});
  if(!r.ok) throw new Error(table+" PATCH "+r.status+" "+(await r.text()));
}

/* ---------- UI ヘルパ ---------- */
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function isConfigured(){return !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_ANON_KEY.includes("YOUR_ANON");}

function showView(v){
  document.getElementById("view-take").classList.toggle("hidden",v!=="take");
  document.getElementById("view-admin").classList.toggle("hidden",v!=="admin");
  document.getElementById("navTake").classList.toggle("on",v==="take");
  document.getElementById("navAdmin").classList.toggle("on",v==="admin");
  if(v==="admin") adminTab(currentAdminTab||"create");
}

/* ================= 受験フロー ================= */
let curSet=null, curPassages=[], curQuestions={}, examAnswers={};

function renderPartGrid(){
  const g=document.getElementById("partGrid"); g.innerHTML="";
  for(let p=1;p<=7;p++){
    const info=PARTS[p];
    const el=document.createElement("button");
    el.className="part-tile";
    el.innerHTML=`<div class="pn">PART ${p}</div><div class="pt">${info.t}</div>
      <div class="pd">${info.d}</div>
      <div style="margin-top:8px"><span class="badge ${info.sec==='listening'?'list':'read'}">${info.sec==='listening'?'Listening':'Reading'}</span></div>`;
    el.onclick=()=>openPart(p);
    g.appendChild(el);
  }
}

function backToParts(){
  ["take-sets","take-exam","take-result"].forEach(id=>document.getElementById(id).classList.add("hidden"));
  document.getElementById("take-parts").classList.remove("hidden");
}

async function openPart(p){
  if(!isConfigured()){toast("接続設定が未完了です");return;}
  document.getElementById("take-parts").classList.add("hidden");
  document.getElementById("take-sets").classList.remove("hidden");
  document.getElementById("setsTitle").textContent=`Part ${p} — テストを選ぶ`;
  const list=document.getElementById("setsList");
  list.innerHTML="<p class='muted'>読み込み中…</p>";
  try{
    const sets=await sbGet("toeic_sets",`part=eq.${p}&is_active=eq.true&order=created_at.desc`);
    if(!sets.length){list.innerHTML="<p class='muted'>このパートのテストはまだありません。</p>";return;}
    list.innerHTML="";
    sets.forEach(s=>{
      const row=document.createElement("div");row.className="set-row";
      row.innerHTML=`<div><b>${esc(s.title)}</b><div class="meta">${new Date(s.created_at).toLocaleDateString('ja-JP')}${s.created_by?' / '+esc(s.created_by):''}</div></div>`;
      const b=document.createElement("button");b.className="btn sm";b.textContent="受験する";b.onclick=()=>startExam(s);
      row.appendChild(b);list.appendChild(row);
    });
  }catch(e){list.innerHTML="<p class='muted'>読み込みに失敗しました: "+esc(e.message)+"</p>";}
}

async function startExam(set){
  curSet=set; examAnswers={};
  try{
    curPassages=await sbGet("toeic_passages",`set_id=eq.${set.id}&order=seq.asc`);
    const pids=curPassages.map(p=>`"${p.id}"`).join(",");
    let qs=[];
    if(curPassages.length) qs=await sbGet("toeic_questions",`passage_id=in.(${pids})&order=seq.asc`);
    curQuestions={};
    qs.forEach(q=>{(curQuestions[q.passage_id]=curQuestions[q.passage_id]||[]).push(q);});
  }catch(e){toast("読み込み失敗: "+e.message);return;}

  document.getElementById("take-sets").classList.add("hidden");
  document.getElementById("take-exam").classList.remove("hidden");
  const info=PARTS[set.part];
  document.getElementById("examBadge").textContent="PART "+set.part+" · "+info.t;
  document.getElementById("examBadge").className="badge "+(info.sec==='listening'?'list':'read');
  document.getElementById("examTitle").textContent=set.title;
  renderExamBody();
}

function renderExamBody(){
  const body=document.getElementById("examBody"); body.innerHTML="";
  const nChoices=PARTS[curSet.part].choices;
  let globalQ=0;
  curPassages.forEach(pas=>{
    const block=document.createElement("div");
    // passage素材（音声/画像/長文）
    if(pas.image_url){
      const img=document.createElement("img");img.className="q-img";img.src=pas.image_url;img.alt="写真";
      block.appendChild(img);
    }
    if(pas.audio_url){
      const wrap=document.createElement("div");wrap.className="q-audio";
      wrap.innerHTML=`<div class="muted">🎧 音声を再生してください</div><audio controls preload="none" src="${esc(pas.audio_url)}"></audio>`;
      block.appendChild(wrap);
    }
    if(pas.passage_text){
      const pt=document.createElement("div");pt.className="passage-text";pt.textContent=pas.passage_text;
      block.appendChild(pt);
    }
    const qlist=curQuestions[pas.id]||[];
    qlist.forEach(q=>{
      globalQ++;
      const qb=document.createElement("div");qb.className="q-block";
      const choices=Array.isArray(q.choices)?q.choices:[];
      let html=`<div class="q-text"><span class="q-num">Q${globalQ}</span>${q.question_text?esc(q.question_text):""}</div>`;
      html+=`<div class="choices" data-qid="${q.id}">`;
      const letters=["A","B","C","D"];
      choices.slice(0,nChoices).forEach((c,i)=>{
        html+=`<div class="choice" onclick="pickChoice('${q.id}',${i},this)"><span class="ltr">${letters[i]}</span><span>${esc(c)}</span></div>`;
      });
      html+=`</div>`;
      qb.innerHTML=html;
      block.appendChild(qb);
    });
    body.appendChild(block);
  });
  if(globalQ===0) body.innerHTML="<p class='muted'>このテストには設問がまだ登録されていません。</p>";
}

function pickChoice(qid,idx,el){
  examAnswers[qid]=idx;
  const parent=el.parentElement;
  [...parent.children].forEach(c=>c.classList.remove("picked"));
  el.classList.add("picked");
}

async function submitExam(){
  const allQ=[];
  curPassages.forEach(p=>(curQuestions[p.id]||[]).forEach(q=>allQ.push(q)));
  if(!allQ.length){toast("設問がありません");return;}
  let correct=0;
  allQ.forEach(q=>{if(examAnswers[q.id]===q.correct_index) correct++;});
  const total=allQ.length;
  const section=PARTS[curSet.part].sec;
  const scaled=scaledScore(section,correct,total);

  // 結果表示
  document.getElementById("take-exam").classList.add("hidden");
  document.getElementById("take-result").classList.remove("hidden");
  document.getElementById("scoreTotal").textContent=scaled;
  const lr=document.getElementById("scoreLR");
  lr.innerHTML=`
    <div class="b"><div class="k">正答数</div><div class="v">${correct}/${total}</div></div>
    <div class="b"><div class="k">${section==='listening'?'Listening 換算':'Reading 換算'}</div><div class="v">${scaled}</div></div>`;

  // レビュー用に保持
  window._lastReview={allQ,answers:{...examAnswers}};
  document.getElementById("reviewBody").classList.add("hidden");
  document.getElementById("reviewBody").innerHTML="";

  // 保存
  try{
    await sbPost("toeic_results",{
      set_id:curSet.id,
      student_ref:document.getElementById("studentRef").value.trim()||null,
      answers:examAnswers, num_correct:correct, total:total,
      scaled_score:scaled, section:section
    });
  }catch(e){console.warn("result save failed",e);}
  window.scrollTo({top:0,behavior:"smooth"});
}

function toggleReview(){
  const rb=document.getElementById("reviewBody");
  if(!rb.classList.contains("hidden")){rb.classList.add("hidden");return;}
  rb.classList.remove("hidden");
  const {allQ,answers}=window._lastReview;
  const letters=["A","B","C","D"];
  let html="<div class='card'><h2 class='sec'>解説</h2>";
  allQ.forEach((q,gi)=>{
    const picked=answers[q.id];
    const choices=Array.isArray(q.choices)?q.choices:[];
    html+=`<div class="q-block"><div class="q-text"><span class="q-num">Q${gi+1}</span>${q.question_text?esc(q.question_text):""}</div>`;
    choices.forEach((c,i)=>{
      let cls="choice";
      if(i===q.correct_index) cls+=" correct";
      else if(i===picked) cls+=" wrong";
      html+=`<div class="${cls}"><span class="ltr">${letters[i]}</span><span>${esc(c)}</span></div>`;
    });
    if(q.explanation) html+=`<div class="expl">💡 ${esc(q.explanation)}</div>`;
    html+=`</div>`;
  });
  html+="</div>";
  rb.innerHTML=html;
}

/* ================= 管理フロー ================= */
let currentAdminTab="create", editingSet=null;

function adminTab(t){
  currentAdminTab=t;
  ["create","list","results"].forEach(x=>{
    document.getElementById("at"+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle("on",x===t);
  });
  document.getElementById("admin-create").classList.toggle("hidden",t!=="create");
  document.getElementById("admin-list").classList.toggle("hidden",t!=="list");
  document.getElementById("admin-results").classList.toggle("hidden",t!=="results");
  document.getElementById("admin-editor").classList.add("hidden");
  if(t==="create") acPartChanged();
  if(t==="list") loadAdminSets();
  if(t==="results") loadAdminResults();
}

function acPartChanged(){
  const p=+document.getElementById("acPart").value;
  const info=PARTS[p];
  const hints={
    1:"写真1枚につき設問1つ（4択）。passageに画像URL＋音声URLを登録。",
    2:"質問音声1つにつき設問1つ（3択）。passageに音声URLを登録。",
    3:"会話音声1つに設問3つ（4択）。passageに音声URL、設問を複数登録。",
    4:"説明音声1つに設問3つ（4択）。passageに音声URL、設問を複数登録。",
    5:"1問完結（4択）。passageは器のみ、設問1つずつ登録。",
    6:"長文1つに空所4つ（4択）。passageに本文、設問を複数登録。",
    7:"長文1つに設問複数（4択）。passageに本文、設問を複数登録。"
  };
  document.getElementById("acHint").textContent=hints[p]||"";
}

async function createSet(){
  if(!isConfigured()){toast("接続設定が未完了です");return;}
  const p=+document.getElementById("acPart").value;
  const title=document.getElementById("acTitle").value.trim();
  if(!title){toast("タイトルを入力してください");return;}
  try{
    const rows=await sbPostReturn("toeic_sets",{
      title, part:p, section:PARTS[p].sec, created_by:document.getElementById("acBy").value.trim()||null
    });
    toast("テストを作成しました");
    document.getElementById("acTitle").value="";
    openEditor(rows[0]);
  }catch(e){toast("作成失敗: "+e.message);}
}

async function loadAdminSets(){
  const list=document.getElementById("adminSetsList");
  list.innerHTML="<p class='muted'>読み込み中…</p>";
  try{
    const sets=await sbGet("toeic_sets","order=created_at.desc");
    if(!sets.length){list.innerHTML="<p class='muted'>まだテストがありません。</p>";return;}
    list.innerHTML="";
    sets.forEach(s=>{
      const row=document.createElement("div");row.className="set-row";
      row.innerHTML=`<div><b>${esc(s.title)}</b> <span class="badge ${s.section==='listening'?'list':'read'}">Part ${s.part}</span>
        <div class="meta">${new Date(s.created_at).toLocaleDateString('ja-JP')}${s.is_active?'':' / 非公開'}</div></div>`;
      const wrap=document.createElement("div");wrap.style.display="flex";wrap.style.gap="6px";
      const b=document.createElement("button");b.className="btn sm";b.textContent="編集";b.onclick=()=>openEditor(s);
      const t=document.createElement("button");t.className="btn ghost sm";t.textContent=s.is_active?"非公開に":"公開に";
      t.onclick=async()=>{try{await sbPatch("toeic_sets","id=eq."+s.id,{is_active:!s.is_active});loadAdminSets();}catch(e){toast(e.message);}};
      wrap.appendChild(b);wrap.appendChild(t);row.appendChild(wrap);list.appendChild(row);
    });
  }catch(e){list.innerHTML="<p class='muted'>失敗: "+esc(e.message)+"</p>";}
}

async function openEditor(set){
  editingSet=set;
  adminTab('list'); // reset tabs base
  document.getElementById("admin-list").classList.add("hidden");
  document.getElementById("admin-editor").classList.remove("hidden");
  document.getElementById("edTitle").textContent=`設問登録：${set.title}`;
  document.getElementById("edMeta").textContent=`Part ${set.part}（${PARTS[set.part].t}） / ${PARTS[set.part].choices}択`;
  await renderEditorPassages();
  renderNewPassageForm();
}

async function renderEditorPassages(){
  const box=document.getElementById("edPassages");box.innerHTML="";
  let passages=[];
  try{passages=await sbGet("toeic_passages",`set_id=eq.${editingSet.id}&order=seq.asc`);}catch(e){box.innerHTML="<p class='muted'>"+esc(e.message)+"</p>";return;}
  if(!passages.length){box.innerHTML="<p class='muted'>設問グループはまだありません。下から追加してください。</p>";return;}
  for(const pas of passages){
    let qs=[];
    try{qs=await sbGet("toeic_questions",`passage_id=eq.${pas.id}&order=seq.asc`);}catch(e){}
    const div=document.createElement("div");div.className="admin-q";
    let head=`<b>グループ ${pas.seq}</b> <span class="muted">(${pas.passage_type})</span>`;
    if(pas.image_url) head+=` 🖼`; if(pas.audio_url) head+=` 🎧`; if(pas.passage_text) head+=` 📄`;
    let inner=`<div>${head}</div>`;
    inner+=`<div class="muted" style="margin:6px 0">設問 ${qs.length}件</div>`;
    qs.forEach(q=>{
      const letters=["A","B","C","D"];const ch=Array.isArray(q.choices)?q.choices:[];
      inner+=`<div style="font-size:13px;padding:4px 0;border-top:1px solid var(--line)">
        Q${q.seq}. ${esc(q.question_text||"")} <span style="color:var(--ok)">正解: ${letters[q.correct_index]}</span></div>`;
    });
    div.innerHTML=inner;
    // 設問追加フォーム
    const addBtn=document.createElement("button");addBtn.className="btn ghost sm";addBtn.style.marginTop="8px";
    addBtn.textContent="＋この グループに設問を追加";
    addBtn.onclick=()=>showAddQuestion(pas,div);
    div.appendChild(addBtn);
    box.appendChild(div);
  }
}

function choiceInputs(nChoices,prefix){
  const letters=["A","B","C","D"];let h="";
  for(let i=0;i<nChoices;i++){
    h+=`<label class="fld" style="margin-top:6px">選択肢 ${letters[i]}</label><input type="text" id="${prefix}_c${i}">`;
  }
  h+=`<label class="fld">正解</label><select id="${prefix}_correct">`;
  for(let i=0;i<nChoices;i++) h+=`<option value="${i}">${letters[i]}</option>`;
  h+=`</select>`;
  return h;
}

function showAddQuestion(pas,container){
  const nChoices=PARTS[editingSet.part].choices;
  const pfx="aq"+pas.id.slice(0,8);
  const form=document.createElement("div");
  form.style.cssText="border-top:1px dashed var(--line);margin-top:10px;padding-top:10px";
  form.innerHTML=`
    <label class="fld">設問文（Part1/2は空欄可）</label>
    <input type="text" id="${pfx}_q" placeholder="設問文">
    ${choiceInputs(nChoices,pfx)}
    <label class="fld">解説（任意）</label>
    <textarea id="${pfx}_expl" placeholder="解説"></textarea>
    <div class="flex-end"><button class="btn sm" id="${pfx}_save">保存</button></div>`;
  container.appendChild(form);
  document.getElementById(pfx+"_save").onclick=async()=>{
    const choices=[];for(let i=0;i<nChoices;i++)choices.push((document.getElementById(pfx+"_c"+i).value||"").trim());
    if(choices.some(c=>!c)){toast("選択肢を全て入力してください");return;}
    let existing=[];try{existing=await sbGet("toeic_questions",`passage_id=eq.${pas.id}&order=seq.desc&limit=1`);}catch(e){}
    const nextSeq=existing.length?existing[0].seq+1:1;
    try{
      await sbPost("toeic_questions",{
        passage_id:pas.id, seq:nextSeq,
        question_text:document.getElementById(pfx+"_q").value.trim()||null,
        choices, correct_index:+document.getElementById(pfx+"_correct").value,
        explanation:document.getElementById(pfx+"_expl").value.trim()||null
      });
      toast("設問を追加しました");
      renderEditorPassages();
    }catch(e){toast("失敗: "+e.message);}
  };
}

function renderNewPassageForm(){
  const p=editingSet.part;const info=PARTS[p];
  const box=document.getElementById("edNewPassage");
  let f=`<div class="row2">`;
  if(info.type==="photo"||info.type==="audio"){
    f+=`<div><label class="fld">音声URL${p===1?'（任意）':''}</label><input type="text" id="np_audio" placeholder="https://.../audio.mp3"></div>`;
  }else f+=`<div></div>`;
  if(info.type==="photo"){
    f+=`<div><label class="fld">画像URL</label><input type="text" id="np_image" placeholder="https://.../photo.jpg"></div>`;
  }else f+=`<div></div>`;
  f+=`</div>`;
  if(info.type==="text"&&(p===6||p===7)){
    f+=`<label class="fld">長文本文</label><textarea id="np_text" placeholder="長文を貼り付け"></textarea>`;
  }
  f+=`<div class="flex-end"><button class="btn sm" id="np_save">グループを追加</button></div>`;
  box.innerHTML=f;
  document.getElementById("np_save").onclick=addPassage;
}

async function addPassage(){
  const p=editingSet.part;const info=PARTS[p];
  let existing=[];try{existing=await sbGet("toeic_passages",`set_id=eq.${editingSet.id}&order=seq.desc&limit=1`);}catch(e){}
  const nextSeq=existing.length?existing[0].seq+1:1;
  const body={set_id:editingSet.id, seq:nextSeq, passage_type:info.type};
  const au=document.getElementById("np_audio"); if(au&&au.value.trim()) body.audio_url=au.value.trim();
  const im=document.getElementById("np_image"); if(im&&im.value.trim()) body.image_url=im.value.trim();
  const tx=document.getElementById("np_text"); if(tx&&tx.value.trim()) body.passage_text=tx.value.trim();
  try{
    await sbPost("toeic_passages",body);
    toast("グループを追加しました");
    await renderEditorPassages();
    renderNewPassageForm();
  }catch(e){toast("失敗: "+e.message);}
}

async function loadAdminResults(){
  const list=document.getElementById("adminResultsList");
  list.innerHTML="<p class='muted'>読み込み中…</p>";
  try{
    const rows=await sbGet("toeic_results","order=taken_at.desc&limit=100");
    if(!rows.length){list.innerHTML="<p class='muted'>まだ受験結果がありません。</p>";return;}
    let sets={};
    try{(await sbGet("toeic_sets","select=id,title,part")).forEach(s=>sets[s.id]=s);}catch(e){}
    list.innerHTML="";
    rows.forEach(r=>{
      const s=sets[r.set_id]||{};
      const row=document.createElement("div");row.className="set-row";
      row.innerHTML=`<div><b>${esc(r.student_ref||"（匿名）")}</b>
        <div class="meta">${s.title?esc(s.title):"?"}${s.part?' / Part '+s.part:''} · ${new Date(r.taken_at).toLocaleString('ja-JP')}</div></div>
        <div style="text-align:right"><div style="font-weight:800;color:var(--navy)">${r.scaled_score??'—'}</div>
        <div class="meta">${r.num_correct}/${r.total}正解</div></div>`;
      list.appendChild(row);
    });
  }catch(e){list.innerHTML="<p class='muted'>失敗: "+esc(e.message)+"</p>";}
}

  console.log("APP_VERSION",APP_VERSION);
  if(!isConfigured()) document.getElementById("configWarn").classList.remove("hidden");
  renderPartGrid();
  acPartChanged();
})();

<style>

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.8 "Noto Sans JP",sans-serif}
button,input,textarea,select{font-family:inherit;color:inherit}

<body>
<div id="hero"></div>
<div class="bar" id="bar" hidden><div class="bar-in">

<script>
// ===== fit 共通ログイン（Supabase Auth セッション）sec1 =====
// ・ID＋PINの照合はサーバー（Edge Function fit-login）で行い、ブラウザには PIN を残さない。
// ・発行されたセッションは localStorage 'fit_session_v1' に保存し、同じサイトの全アプリで共有する。
// ・Supabase への fetch は自動でログイン中のトークンに差し替え、期限切れなら自動更新して1回だけ再送する。
const FIT_SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const FIT_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const FIT_SESSION_KEY = 'fit_session_v1';
const FIT_LEGACY_KEYS = ['fit_pin', 'fit_parent_pin', 'fit_staff_hash', 'fit_staff_pin'];
let fitSession = null;
let fitRefreshing = null;
const fitRawFetch = window.fetch.bind(window);

function fitLoadSession() {
  try { fitSession = JSON.parse(localStorage.getItem(FIT_SESSION_KEY) || 'null'); } catch (e) { fitSession = fitSession || null; }
  return fitSession;
}
function fitSaveSession(s) {
  fitSession = s || null;
  try { if (s) localStorage.setItem(FIT_SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(FIT_SESSION_KEY); } catch (e) {}
}
function fitClearLegacy() {
  try { FIT_LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
// 'ok' | 'invalid'（ログインし直しが必要） | 'error'（通信エラー等。セッションは残す）| 'none'
async function fitRefresh(force) {
  const cur = fitLoadSession();
  if (!cur || !cur.refresh_token) return 'none';
  const now = Math.floor(Date.now() / 1000);
  if (!force && (cur.expires_at || 0) - now > 300) return 'ok';
  if (fitRefreshing) return fitRefreshing;
  fitRefreshing = (async () => {
    try {
      const r = await fitRawFetch(FIT_SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: cur.refresh_token })
      });
      if (r.status === 400 || r.status === 401 || r.status === 403) {
        // 別タブが先に更新していればそちらを使う
        const latest = fitLoadSession();
        if (latest && latest.refresh_token !== cur.refresh_token) return 'ok';
        fitSaveSession(null);
        return 'invalid';
      }
      if (!r.ok) return 'error';
      const j = await r.json();
      fitSaveSession(Object.assign({}, cur, {
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        expires_at: j.expires_at || (now + (j.expires_in || 3600))
      }));
      return 'ok';
    } catch (e) { return 'error'; }
    finally { fitRefreshing = null; }
  })();
  return fitRefreshing;
}
// ログイン：kind = 'staff' | 'student' | 'parent' | 'online'
// 戻り値 { ok:true, kind, account } / { ok:false, error:'invalid'|'blocked'|'locked'|... }
async function fitLogin(kind, id, pin) {
  let r, j = null;
  try {
    r = await fitRawFetch(FIT_SB_URL + '/functions/v1/fit-login', {
      method: 'POST',
      headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, id: id, pin: pin })
    });
    j = await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
  if (!j) return { ok: false, error: 'network' };
  if (j.ok) {
    fitSaveSession(Object.assign({}, j.session, { kind: j.kind, account_id: String(j.account.id) }));
    fitClearLegacy();
  }
  return j;
}
function fitLoginErrorText(j, fallback) {
  if (!j) return fallback;
  if (j.error === 'locked') return 'ログインの失敗が続いたため、15分ほど待ってからお試しください。';
  if (j.error === 'blocked') return 'このアカウントは現在ご利用いただけません。塾までお問い合わせください。';
  if (j.error === 'network' || j.error === 'server') return '通信がうまくつながりませんでした。電波の良い場所でもう一度お試しください。';
  return fallback;
}
// ===== 段階B：サーバー関数（RPC）=====
// ポイント加算・ログインボーナス・面談共有メモなどは、サーバー側の関数で行う（生徒は直接書き換えできない）。
async function fitRpc(name, args) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/rpc/' + name, {
    method: 'POST',
    headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  const tx = await r.text();
  if (!r.ok) throw new Error('rpc ' + name + ' ' + r.status + ' ' + tx);
  return tx ? JSON.parse(tx) : null;
}
// 戻り値 { awarded: 実際に加算された点, points: 加算後の合計 }
async function fitAwardPoints(type, points, reason, ref) {
  return await fitRpc('fit_award_points', { p_type: type, p_points: points, p_reason: reason || null, p_ref: ref == null ? null : String(ref) });
}
function fitLogout() {
  const s = fitSession || fitLoadSession();
  fitSaveSession(null);
  fitClearLegacy();
  if (s && s.access_token) {
    fitRawFetch(FIT_SB_URL + '/auth/v1/logout?scope=local', {
      method: 'POST', headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
    }).catch(() => {});
  }
}
// 保存済みセッションから本人の行を取り直す。旧方式（PIN保存）の端末は1回だけ自動で移行する。
// 戻り値 { kind, row } / null（未ログイン）。通信エラー時は例外（ログイン情報は消さない）。
async function fitResume() {
  let s = fitLoadSession();
  if (!s) {
    let email = null, pin = null, pid = null, ppin = null, role = null;
    try {
      email = localStorage.getItem('fit_email'); pin = localStorage.getItem('fit_pin');
      pid = localStorage.getItem('fit_parent_id'); ppin = localStorage.getItem('fit_parent_pin');
      role = localStorage.getItem('fit_role');
    } catch (e) {}
    let j = null;
    if (email && pin) j = await fitLogin(role === 'staff' ? 'staff' : 'student', email, pin);
    else if (pid && ppin) j = await fitLogin('parent', pid, ppin);
    if (j && j.error === 'network') throw new Error('network');
    fitClearLegacy();
    s = fitLoadSession();
    if (!s) return null;
  }
  const rr = await fitRefresh(false);
  if (rr === 'invalid' || rr === 'none') return null;
  s = fitLoadSession();
  if (!s) return null;
  const table = { staff: 'staff', student: 'students', parent: 'parent_accounts', online: 'online_students' }[s.kind];
  if (!table) { fitLogout(); return null; }
  // sec4: 生徒・保護者は students を直接読まず、表示用の列だけ返す関数から受け取る（生徒は自分の1行）
  const res = s.kind === 'student'
    ? await fitRawFetch(FIT_SB_URL + '/rest/v1/rpc/fit_my_students', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
        body: '{}'
      })
    : await fitRawFetch(FIT_SB_URL + '/rest/v1/' + table + '?id=eq.' + encodeURIComponent(s.account_id) + '&select=*', {
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
      });
  if (res.status === 401 || res.status === 403) {
    const again = await fitRefresh(true);
    if (again === 'invalid' || again === 'none') return null;
    throw new Error('auth ' + res.status);
  }
  if (!res.ok) throw new Error('resume ' + res.status);
  const rows = await res.json();
  if (!rows.length || rows[0].is_active === false && s.kind !== 'student') { fitLogout(); return null; }
  return { kind: s.kind, row: rows[0] };
}
// Supabase への fetch をログイン中のトークンに差し替える（各画面のコードはそのまま使える）
window.fetch = async function (input, init) {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (url.indexOf(FIT_SB_URL) !== 0 || url.indexOf('/auth/v1/') > 0 || url.indexOf('/functions/v1/fit-login') > 0) {
    return fitRawFetch(input, init);
  }
  // 呼び出し時点のトークンを控えておく（直後にログアウトしても、その前に始めた保存は通す）
  const tokenAtCall = fitLoadSession() ? fitSession.access_token : null;
  if (tokenAtCall) await fitRefresh(false);
  const send = () => {
    const opt = Object.assign({}, init || {});
    const h = new Headers(opt.headers || (input && typeof input !== 'string' ? input.headers : undefined));
    const tok = (fitSession && fitSession.access_token) || tokenAtCall;
    if (tok) h.set('Authorization', 'Bearer ' + tok);
    opt.headers = h;
    return fitRawFetch(input, opt);
  };
  let res = await send();
  if (res.status === 401 && fitSession && fitSession.refresh_token) {
    const rr = await fitRefresh(true);
    if (rr === 'ok') res = await send();
  }
  return res;
};
setInterval(() => { if (fitSession) fitRefresh(false); }, 60000);

// ============================================================
// 話の記録さがし（kiroku.html）2026-11-15
// ・田尾先生などの講義・講演の「まとめと全文」を、大学ごと・日付ごとに並べて、言葉でさがす
// ・見られるのは fitアプリにスタッフでログインした人だけ（表 talk_records・talk_paragraphs はスタッフだけ）
// ・記録を足す：Claude が作った「まとめと全文」の .md を選ぶ（＋YouTube の URL）
// ============================================================
const KR_VERSION = '20261115kr1';
const KR_HDR = { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' };
const REC_COLS = 'id,title,talk_date,univ,category,place,speaker,theme,keywords,hitokoto,koma,youtube_id,source_name';
let ME = null, RECS = [], PARAS = {}, view = 'list', backY = 0, seq = 0;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lower = s => String(s).toLowerCase();
const st = t => String(t || '').replace(/^.*?講義の記録[｜|]\s*/, '');
const ymd = d => d ? d.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, '$1年$2月$3日') : '日付なし';
const fmt = t => { if (t == null) return ''; const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };

async function rest(method, path, body, extra) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/' + path, { method, headers: Object.assign({}, KR_HDR, extra || {}), body: body == null ? undefined : JSON.stringify(body) });
  const tx = await r.text();
  if (!r.ok) { let m = tx; try { m = JSON.parse(tx).message || tx; } catch (e) {} throw new Error(method + ' ' + r.status + ' ' + String(m).slice(0, 160)); }
  return tx ? JSON.parse(tx) : null;
}
function errText(e) {
  const m = String((e && e.message) || e || '');
  if (/Failed to fetch|NetworkError|network/i.test(m)) return '通信がうまくつながりませんでした。もう一度お試しください。';
  if (/talk_records|talk_paragraphs/.test(m) && /does not exist|schema cache|404/.test(m)) return 'まだ表（talk_records）ができていません。SQL kr1 を流してください。';
  return 'うまくいきませんでした。（' + m.slice(0, 120) + '）';
}

// ---------- YouTube ----------
function ytId(s) {
  s = String(s || '').trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/live\/|\/shorts\/)([\w-]{11})/);
  return m ? m[1] : '';
}
function timeBtn(r, t) {
  if (t == null) return '';
  if (r.youtube_id) return `<button class="btn play small" data-play="${r.id}" data-t="${t}">▶ ${fmt(t)} から</button>`;
  return `<span class="time">動画の ${fmt(t)} ごろ</span>`;
}
function play(id, t) {
  const r = RECS.find(x => x.id === id); if (!r || !r.youtube_id) return;
  const src = 'https://www.youtube.com/embed/' + r.youtube_id + '?start=' + t + '&autoplay=1&playsinline=1&rel=0';
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal video"><div class="vtop"><span>${esc(st(r.title))}　${fmt(t)}〜</span>
    <span><a href="https://youtu.be/${r.youtube_id}?t=${t}" target="_blank" rel="noopener">YouTubeで開く</a>　<a href="#" data-close>閉じる ×</a></span></div>
    <div class="vframe"><iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div></div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) { e.preventDefault(); bg.remove(); } });
  document.body.append(bg);
}

// ---------- 小窓 ----------
function modal(html) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.append(bg);
  return bg;
}
function ask(title, text, okLabel, danger) {
  return new Promise(res => {
    const bg = modal(`<h3>${esc(title)}</h3><div style="font-size:14px;white-space:pre-wrap">${esc(text)}</div>
      <div class="mb"><button class="btn sub" data-no>やめる</button><button class="btn ${danger ? 'danger' : ''}" data-ok>${esc(okLabel)}</button></div>`);
    bg.querySelector('[data-no]').onclick = () => { bg.remove(); res(false); };
    bg.querySelector('[data-ok]').onclick = () => { bg.remove(); res(true); };
  });
}

// ---------- 起動 ----------
function hero() {
  const who = ME && ME.kind === 'staff' ? ('スタッフ：' + esc(ME.row.name || '')) : '';
  $('#hero').innerHTML = `<div class="hero"><div class="hero-in"><a class="back" href="app.html">‹ アプリに戻る</a>
    ${who ? `<span class="who">${who}</span>` : ''}<h1>話の記録さがし</h1></div></div>`;
}
async function boot() {
  let netErr = false;
  try { ME = await fitResume(); } catch (e) { netErr = true; }
  hero();
  if (!ME || ME.kind !== 'staff') {
    $('#list').innerHTML = `<div class="card"><p style="margin:0 0 8px;font-weight:700">${netErr ? '通信がうまくつながりませんでした。' : (ME ? 'このページはスタッフだけが見られます。' : 'fitアプリのログインが必要です。')}</p>
      <p class="msg">${netErr ? '少し待ってから、このページを開き直してください。' : 'fitアプリにスタッフでログインしてから、もう一度開いてください。'}</p>
      <p style="margin:12px 0 0"><a href="app.html" class="btn">fitアプリを開く</a></p></div>`;
    return;
  }
  $('#bar').hidden = false;
  await loadRecs();
}
async function loadRecs() {
  try { RECS = await rest('GET', 'talk_records?select=' + REC_COLS); }
  catch (e) { $('#list').innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; return; }
  sortRecs(); fillFilters(); renderList(); if ($('#q').value.trim()) renderSearch();
}
function sortRecs() {
  const latest = {};
  RECS.forEach(r => { r.univ = r.univ || 'そのほか'; latest[r.univ] = (latest[r.univ] || '') > (r.talk_date || '') ? latest[r.univ] : (r.talk_date || ''); });
  RECS.sort((a, b) => (latest[b.univ] || '').localeCompare(latest[a.univ] || '') || a.univ.localeCompare(b.univ)
    || (b.talk_date || '').localeCompare(a.talk_date || '') || (a.koma || 0) - (b.koma || 0) || a.title.localeCompare(b.title));
}
function fillFilters() {
  const keep = { y: $('#fy').value, c: $('#fc').value, r: $('#fr').value };
  $('#fy').innerHTML = '<option value="">すべての年</option>' + [...new Set(RECS.map(r => (r.talk_date || '').slice(0, 4)).filter(Boolean))].sort().reverse().map(y => `<option value="${y}">${y}年</option>`).join('');
  $('#fc').innerHTML = '<option value="">すべての分類</option>' + [...new Set(RECS.map(r => r.category || 'そのほか'))].sort().map(c => `<option>${esc(c)}</option>`).join('');
  let h = '<option value="">講義をえらぶ</option>', last = null;
  RECS.forEach(r => { if (r.univ !== last) { if (last !== null) h += '</optgroup>'; h += `<optgroup label="${esc(r.univ)}">`; last = r.univ; } h += `<option value="${r.id}">${ymd(r.talk_date)}　${esc(st(r.title))}</option>`; });
  if (last !== null) h += '</optgroup>';
  $('#fr').innerHTML = h;
  $('#fy').value = keep.y; $('#fc').value = keep.c; $('#fr').value = keep.r;
}
function pass(r) {
  const y = $('#fy').value, c = $('#fc').value, i = $('#fr').value;
  return (!y || (r.talk_date || '').startsWith(y)) && (!c || (r.category || 'そのほか') === c) && (!i || String(r.id) === i);
}
function show(v) {
  if (v === 'reader') backY = window.scrollY;
  ['list', 'search', 'reader'].forEach(x => $('#' + x).hidden = x !== v);
  if (v !== 'reader') { view = v; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v)); }
}

// ---------- 一覧 ----------
function renderList() {
  const rs = RECS.filter(pass);
  let h = `<div class="btns" style="margin:0 0 10px"><span class="note" style="margin:0;flex:1">${rs.length} 件（大学ごと・新しい講義から）。押すと中身が読めます。</span><button class="btn small" data-add>＋ 記録を足す</button></div>`;
  if (!RECS.length) h += `<div class="empty">まだ記録がありません。「＋ 記録を足す」から、Claude が作った「まとめと全文」の .md ファイルを入れてください。</div>`;
  else if (!rs.length) h += `<div class="empty">この条件の講義はありません。</div>`;
  let last = null;
  rs.forEach(r => {
    if (r.univ !== last) { h += `<div class="ug">${esc(r.univ)}</div>`; last = r.univ; }
    const d = r.talk_date ? `<span>${r.talk_date.slice(0, 4)}</span><b>${+r.talk_date.slice(5, 7)}/${+r.talk_date.slice(8, 10)}</b>` : '<span>日付<br>なし</span>';
    h += `<div class="card lrow" data-open-row="${r.id}"><div class="ldate">${d}</div><div class="lbody"><p class="rtitle">${esc(st(r.title))}</p>
      <div class="rmeta"><span class="badge">${esc(r.category || 'そのほか')}</span>${esc(r.place || '')}${r.youtube_id ? '｜▶ 動画あり' : ''}</div>
      ${r.theme ? `<div style="font-size:14px">${esc(r.theme)}</div>` : ''}
      ${(r.hitokoto || []).length ? `<ul class="hk">${r.hitokoto.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div></div>`;
  });
  $('#list').innerHTML = h;
}

// ---------- さがす ----------
function highlight(tx, words, cut) {
  const n = lower(tx), ranges = [];
  if (n.length === tx.length) words.forEach(w => { let i = 0; while ((i = n.indexOf(w, i)) >= 0) { ranges.push([i, i + w.length]); i += w.length; } });
  ranges.sort((a, b) => a[0] - b[0]);
  let from = 0, to = tx.length;
  if (cut && tx.length > 220) { const c = ranges.length ? ranges[0][0] : 0; from = Math.max(0, c - 80); to = Math.min(tx.length, from + 220); }
  let out = '', pos = from;
  ranges.forEach(([a, b]) => { if (a < pos || b > to) return; out += esc(tx.slice(pos, a)) + '<mark>' + esc(tx.slice(a, b)) + '</mark>'; pos = b; });
  out += esc(tx.slice(pos, to));
  return (from > 0 ? '…' : '') + out + (to < tx.length ? '…' : '');
}
function qWords() { return lower($('#q').value.trim()).replace(/[*%(),"\\]/g, ' ').split(/\s+/).filter(Boolean); }
async function renderSearch() {
  const box = $('#search');
  const words = qWords();
  if (!words.length) { box.innerHTML = ''; return; }
  const my = ++seq;
  const ids = RECS.filter(pass).map(r => r.id);
  if (!ids.length) { box.innerHTML = '<div class="empty">この条件の講義はありません。</div>'; return; }
  box.innerHTML = '<div class="msg">さがしています…</div>';
  let rows;
  try {
    const and = 'and=(' + words.map(w => 'body.ilike."*' + w + '*"').join(',') + ')';
    rows = await rest('GET', 'talk_paragraphs?select=record_id,ord,part,head,time_sec,body&record_id=in.(' + ids.join(',') + ')&' + encodeURI(and).replace(/#/g, '%23').replace(/&/g, '%26').replace(/\+/g, '%2B') + '&order=record_id,ord&limit=800');
  } catch (e) { if (my === seq) box.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; return; }
  if (my !== seq) return;
  const byR = new Map();
  RECS.forEach(r => { if (ids.includes(r.id)) byR.set(r.id, []); });
  rows.forEach(p => { if (byR.has(p.record_id)) byR.get(p.record_id).push(p); });
  const titleHit = r => { const t = lower([r.title, r.place, r.theme, (r.keywords || []).join(' ')].join(' ')); return words.every(w => t.includes(w)); };
  const show_ = RECS.filter(r => byR.has(r.id) && (byR.get(r.id).length || titleHit(r)));
  if (!show_.length) { box.innerHTML = `<div class="note">「${esc($('#q').value.trim())}」は見つかりませんでした。言葉を短くするか、ひらがな・カタカナ・漢字を変えてみてください。</div>`; return; }
  const rank = p => /全文|文字起こし/.test(p.part || '') ? 0 : /大枠/.test(p.part || '') ? 1 : 2;
  let h = `<p class="note">${show_.length} 件の講義・${rows.length} か所で見つかりました${rows.length >= 800 ? '（多いので800か所まで）' : ''}</p>`;
  show_.forEach(r => {
    const ps = byR.get(r.id).sort((a, b) => rank(a) - rank(b) || a.ord - b.ord);
    h += `<div class="card"><p class="rtitle">${esc(st(r.title))}</p><div class="rmeta"><span class="badge">${esc(r.univ)}</span>${ymd(r.talk_date)}　${ps.length} か所</div>`;
    ps.forEach((p, i) => {
      h += `<div class="hit" ${i >= 3 ? 'data-extra hidden' : ''}><div class="hhead">${esc([p.part, p.head].filter(Boolean).join('｜'))}</div>
        <div class="htext">${highlight(p.body, words, true)}</div>
        <div class="btns">${timeBtn(r, p.time_sec)}<button class="btn sub small" data-open="${r.id}" data-ord="${p.ord}">全文の中で見る</button></div></div>`;
    });
    if (ps.length > 3) h += `<button class="more" data-more>ほかの ${ps.length - 3} か所も見る ▼</button>`;
    if (!ps.length) h += `<div class="btns"><button class="btn sub small" data-open="${r.id}">全文を読む</button></div>`;
    h += '</div>';
  });
  box.innerHTML = h;
}

// ---------- 読む ----------
async function openReader(id, ord) {
  const r = RECS.find(x => x.id === id); if (!r) return;
  show('reader');
  const box = $('#reader');
  if (!PARAS[id]) {
    box.innerHTML = '<div class="msg">読み込み中…</div>';
    try { PARAS[id] = await rest('GET', 'talk_paragraphs?select=ord,part,head,time_sec,body&record_id=eq.' + id + '&order=ord&limit=5000'); }
    catch (e) { box.innerHTML = `<button class="btn sub small" data-back>← もどる</button><div class="msg err">${esc(errText(e))}</div>`; return; }
  }
  const words = qWords();
  let h = `<div class="btns"><button class="btn sub small" data-back>← もどる</button><span style="flex:1"></span>
    <button class="btn sub small" data-yt="${r.id}">${r.youtube_id ? '▶ YouTube の URL を直す' : '▶ YouTube の URL を入れる'}</button></div>
    <h2>${esc(st(r.title))}</h2>
    <div class="rmeta"><span class="badge">${esc(r.univ)}</span>${ymd(r.talk_date)}${r.place ? '｜' + esc(r.place) : ''}${r.speaker ? '｜話し手：' + esc(r.speaker) : ''}</div>`;
  if (r.youtube_id) h += `<div class="btns"><button class="btn play small" data-play="${r.id}" data-t="0">▶ 動画をはじめから</button></div>`;
  if ((r.hitokoto || []).length) h += `<h3>ひとことで</h3><ul class="hk">${r.hitokoto.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  let lastPart = null, lastHead = null;
  PARAS[id].forEach(p => {
    if (p.part !== lastPart) { h += `<h3>${esc(p.part || '')}</h3>`; lastPart = p.part; lastHead = null; }
    if ((p.head || p.time_sec != null) && p.head !== lastHead) { h += `<h4>${esc(p.head || '')} ${timeBtn(r, p.time_sec)}</h4>`; lastHead = p.head; }
    h += `<p id="p_${p.ord}">${words.length ? highlight(p.body, words, false) : esc(p.body)}</p>`;
  });
  h += `<div style="margin-top:40px;padding-top:12px;border-top:1px dashed var(--border);text-align:right"><button class="btn danger small" data-del="${r.id}">この記録を消す</button></div>`;
  box.innerHTML = h;
  const elp = ord != null ? document.getElementById('p_' + ord) : null;
  if (elp) { elp.scrollIntoView({ block: 'center' }); elp.classList.add('flash'); setTimeout(() => elp.classList.remove('flash'), 1600); }
  else window.scrollTo(0, 0);
}

// ---------- 記録を足す（.md を読む） ----------
const KOMA = { '①': 1, '②': 2, '③': 3, '④': 4, '⑤': 5, '⑥': 6, '⑦': 7, '⑧': 8, '⑨': 9, '⑩': 10 };
function komaOrder(t) {
  t = String(t);
  for (const k in KOMA) if (t.includes(k)) return KOMA[k];
  t = t.normalize('NFKC');
  const m = t.match(/(\d+)\s*コマ/) || t.match(/第\s*(\d+)\s*回/);
  return m ? +m[1] : 0;
}
function findDate(...ts) {
  for (let t of ts) {
    if (!t) continue; t = String(t).normalize('NFKC');
    const m = t.match(/(20\d\d)年\s*(\d{1,2})月\s*(\d{1,2})日/) || t.match(/(20\d\d)[.\-\/_ ](\d{1,2})[.\-\/_ ](\d{1,2})/);
    if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
  }
  return null;
}
function guessUniv(...ts) {
  for (let t of ts) {
    if (!t) continue; t = String(t).normalize('NFKC');
    const m = t.match(/([一-龥ぁ-んァ-ヶ]{1,6}?)大学?(?![一-龥])/);
    if (m) return m[1] + '大学';
  }
  return 'そのほか';
}
function toSec(t) { return t.split(':').reduce((a, x) => a * 60 + (+x), 0); }
function paras(lines) {
  const out = []; let cur = [];
  const flush = () => { if (cur.length) { out.push(cur.join('\n')); cur = []; } };
  lines.forEach(l => { if (!l.trim()) flush(); else cur.push(l.trim().replace(/^- /, '・')); });
  flush();
  return out;
}
function parseMd(txt, fname) {
  txt = String(txt).replace(/\r/g, '').normalize('NFC');
  let title = fname.replace(/\.md$/i, '');
  const meta = {}, secs = []; let cur = null;
  txt.split('\n').forEach(l => {
    const m = l.match(/^(#{1,3}) (.+)$/);
    if (m) {
      const lv = m[1].length;
      if (lv === 1 && !secs.length && !cur) { title = m[2].trim(); cur = { lv: 0, head: 'はじめ', body: [] }; secs.push(cur); return; }
      cur = { lv, head: m[2].trim(), body: [] }; secs.push(cur); return;
    }
    if (!cur) { cur = { lv: 0, head: 'はじめ', body: [] }; secs.push(cur); }
    cur.body.push(l);
    if (cur.head === 'はじめ') { const mm = l.match(/^- ([^：:]+)[：:](.*)$/); if (mm) meta[mm[1].trim()] = mm[2].trim(); }
  });
  const rec = {
    title, talk_date: findDate(meta['日付'], fname, title),
    univ: meta['大学'] || guessUniv(meta['場所・対象'], title, fname),
    place: meta['場所・対象'] || meta['場所'] || null, speaker: meta['話し手'] || null,
    theme: meta['テーマ'] || meta['内容'] || null,
    keywords: (meta['キーワード'] || '').split(/[、,]/).map(s => s.trim()).filter(Boolean),
    hitokoto: [], koma: komaOrder(title + ' ' + fname), source_name: fname, source_md: txt
  };
  const ps = []; let part = '';
  secs.forEach(s => {
    if (s.lv === 1) part = s.head.replace(/^\d+\.\s*/, '');
    if (s.head === 'はじめ' || part.startsWith('直した言葉')) return;
    if (s.lv === 1 && part.startsWith('ひとことで')) { rec.hitokoto = s.body.filter(b => b.startsWith('- ')).map(b => b.slice(2).trim()); return; }
    const tm = s.head.match(/〔(\d{1,2}(?::\d\d){1,2})〕/);
    const head = s.lv > 1 ? s.head.replace(/〔\d{1,2}(?::\d\d){1,2}〕/, '').trim() : '';
    paras(s.body).forEach(b => ps.push({ part, head, time_sec: tm ? toSec(tm[1]) : null, body: b }));
  });
  ps.forEach((p, i) => p.ord = i);
  return { rec, ps, times: ps.filter(p => p.time_sec != null).length };
}
function addDialog() {
  const cats = [...new Set(RECS.map(r => r.category).filter(Boolean))];
  if (!cats.includes('田尾先生')) cats.unshift('田尾先生');
  const bg = modal(`<h3>記録を足す</h3>
    <div class="msg" style="margin-top:0">Claude が作った「まとめと全文」の .md ファイルを選んでください。</div>
    <label class="lbl">ファイル（.md）</label><input type="file" id="af" accept=".md,text/markdown,text/plain">
    <label class="lbl">YouTube の URL（あとからでも入れられます）</label><input class="in" id="ay" placeholder="https://youtu.be/…">
    <label class="lbl">分類</label><input class="in" id="ac" list="acl" value="田尾先生"><datalist id="acl">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <div id="ap" class="msg"></div>
    <div class="mb"><button class="btn sub" data-no>やめる</button><button class="btn" data-ok disabled>入れる</button></div>`);
  let parsed = null;
  const ok = bg.querySelector('[data-ok]');
  bg.querySelector('[data-no]').onclick = () => bg.remove();
  bg.querySelector('#af').onchange = async e => {
    const f = e.target.files[0]; parsed = null; ok.disabled = true;
    if (!f) return;
    try {
      parsed = parseMd(await f.text(), f.name);
      const r = parsed.rec;
      const dup = RECS.find(x => x.title === r.title && x.talk_date === r.talk_date);
      bg.querySelector('#ap').innerHTML = `<b>${esc(st(r.title))}</b><br>${ymd(r.talk_date)}｜${esc(r.univ)}｜段落 ${parsed.ps.length}（動画の時刻つきの見出しの段落 ${parsed.times}）`
        + (dup ? '<br><span style="color:var(--red)">同じ題名・日付の記録があります。入れると入れかえます。</span>' : '')
        + (!parsed.ps.length ? '<br><span style="color:var(--red)">中身が読めませんでした。</span>' : '');
      ok.disabled = !parsed.ps.length;
    } catch (err) { bg.querySelector('#ap').textContent = '読めませんでした：' + err.message; }
  };
  ok.onclick = async () => {
    if (!parsed) return;
    const yraw = bg.querySelector('#ay').value.trim(), yid = ytId(yraw);
    if (yraw && !yid) { bg.querySelector('#ap').insertAdjacentHTML('beforeend', '<br><span style="color:var(--red)">YouTube の URL の形が読めませんでした。</span>'); return; }
    ok.disabled = true; ok.textContent = '入れています…';
    const rec = Object.assign({}, parsed.rec, { category: bg.querySelector('#ac').value.trim() || '田尾先生', youtube_id: yid || null, created_by: ME.row.name || null });
    let newId = null;
    try {
      const dup = RECS.find(x => x.title === rec.title && x.talk_date === rec.talk_date);
      const ins = await rest('POST', 'talk_records?select=id', rec, { 'Prefer': 'return=representation' });
      newId = ins[0].id;
      for (let i = 0; i < parsed.ps.length; i += 200) {
        await rest('POST', 'talk_paragraphs', parsed.ps.slice(i, i + 200).map(p => Object.assign({ record_id: newId }, p)), { 'Prefer': 'return=minimal' });
      }
      if (dup) { await rest('DELETE', 'talk_records?id=eq.' + dup.id); delete PARAS[dup.id]; }
      bg.remove();
      await loadRecs();
    } catch (err) {
      if (newId) { try { await rest('DELETE', 'talk_records?id=eq.' + newId); } catch (e2) {} }
      ok.disabled = false; ok.textContent = '入れる';
      bg.querySelector('#ap').insertAdjacentHTML('beforeend', `<br><span style="color:var(--red)">${esc(errText(err))}</span>`);
    }
  };
}
function ytDialog(id) {
  const r = RECS.find(x => x.id === id); if (!r) return;
  const bg = modal(`<h3>YouTube の URL</h3><div class="msg" style="margin-top:0">${esc(st(r.title))}</div>
    <input class="in" id="yu" placeholder="https://youtu.be/…" value="${r.youtube_id ? 'https://youtu.be/' + r.youtube_id : ''}">
    <div class="msg">限定公開の動画でもかまいません。空にして保存すると、動画のリンクを外します。</div><div id="ym" class="msg"></div>
    <div class="mb"><button class="btn sub" data-no>やめる</button><button class="btn" data-ok>保存する</button></div>`);
  bg.querySelector('[data-no]').onclick = () => bg.remove();
  bg.querySelector('[data-ok]').onclick = async () => {
    const raw = bg.querySelector('#yu').value.trim(), yid = ytId(raw);
    if (raw && !yid) { bg.querySelector('#ym').innerHTML = '<span style="color:var(--red)">URL の形が読めませんでした。</span>'; return; }
    try { await rest('PATCH', 'talk_records?id=eq.' + id, { youtube_id: yid || null, updated_at: new Date().toISOString() }); r.youtube_id = yid || null; bg.remove(); renderList(); openReader(id); }
    catch (e) { bg.querySelector('#ym').innerHTML = `<span style="color:var(--red)">${esc(errText(e))}</span>`; }
  };
}
async function delRecord(id) {
  const r = RECS.find(x => x.id === id); if (!r) return;
  if (!await ask('この記録を消しますか', st(r.title) + '\n（元の .md ファイルは消えません。あとで入れ直せます）', '消す', true)) return;
  try { await rest('DELETE', 'talk_records?id=eq.' + id); delete PARAS[id]; show('list'); await loadRecs(); }
  catch (e) { alert(errText(e)); }
}

// ---------- 操作 ----------
let timer;
$('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { if ($('#q').value.trim()) { show('search'); renderSearch(); } else { show('list'); renderList(); } }, 350); });
['#fy', '#fc'].forEach(s => $(s).addEventListener('change', () => { renderList(); if ($('#q').value.trim()) renderSearch(); }));
$('#fr').addEventListener('change', () => { renderList(); if ($('#q').value.trim()) renderSearch(); else if ($('#fr').value) openReader(+$('#fr').value); });
document.addEventListener('click', e => {
  const row = e.target.closest('[data-open-row]'); if (row) { openReader(+row.dataset.openRow); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v) { show(b.dataset.v); if (b.dataset.v === 'list') renderList(); else renderSearch(); }
  else if (b.dataset.open) openReader(+b.dataset.open, b.dataset.ord != null ? +b.dataset.ord : null);
  else if (b.dataset.play) play(+b.dataset.play, +b.dataset.t);
  else if (b.dataset.back != null) { show(view); window.scrollTo(0, backY); }
  else if (b.dataset.more != null) { b.parentElement.querySelectorAll('[data-extra]').forEach(x => x.hidden = false); b.remove(); }
  else if (b.dataset.add != null) addDialog();
  else if (b.dataset.yt) ytDialog(+b.dataset.yt);
  else if (b.dataset.del) delRecord(+b.dataset.del);

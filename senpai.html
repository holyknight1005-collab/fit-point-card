button{cursor:pointer}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;flex:1;letter-spacing:.04em}
.top .who{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.top .who button{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
.wrap{padding:14px 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:13px}
.lead{font-size:14px;color:var(--muted);margin:0 0 12px}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--orange);color:#fff;width:100%}
.btn:active{transform:scale(.98)}
.btn.sub{background:var(--surface2);color:var(--text)}
.btn.small{width:auto;padding:7px 12px;font-size:13px;border-radius:10px;white-space:nowrap}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.5}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.sug{border:1px solid var(--line,#dde3ec);border-radius:10px;margin-top:4px;max-height:260px;overflow:auto;background:#fff}
.sug button{display:block;width:100%;text-align:left;border:none;background:none;padding:10px 12px;font-size:15px;border-bottom:1px solid #eef1f5;cursor:pointer;color:inherit}
.sug button:hover,.sug button:focus{background:#fff4ea}
.sug button small{color:var(--muted);margin-left:6px;font-size:12px}
.sug .sug-new{color:#c25a00;font-weight:700}
.sug .sug-none{padding:10px 12px;font-size:13px;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted);margin-top:2px}
.input,textarea.input,select.input{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;background:#fff;color:var(--text)}
.input:focus{outline:none;border-color:var(--orange)}
.err{color:var(--red);font-size:13px;margin:6px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text);white-space:nowrap}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.chip .n{opacity:.7;margin-left:3px}
.tag{display:inline-block;background:var(--orange-l);color:var(--orange-d);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0}
.group-h{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px;letter-spacing:.06em}
.univ-h{font-size:15px;font-weight:700;margin:10px 0 6px;padding-left:8px;border-left:4px solid var(--orange)}
.sp-card .row1{display:flex;align-items:center;gap:10px}
.avatar.av-none{background:#f1f3f6;border:1px dashed #cfd5dd;overflow:hidden;align-items:flex-end}
.viewas{position:sticky;top:0;z-index:30;background:#16233A;color:#fff;font-size:13px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pv-box{pointer-events:none;user-select:none}
.pv-h{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;background:var(--orange-l);color:var(--orange-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.sp-card .nm{font-weight:700;font-size:16px}
.sp-card .uvx{font-size:13px;color:var(--muted)}
.sp-card .msg{margin:8px 0 6px;font-size:14px}
.sp-card .meta{font-size:12px;color:var(--muted)}
.paused{display:inline-block;background:var(--surface2);color:var(--muted);border-radius:6px;padding:0 6px;font-size:12px;margin-left:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:640px;width:100%}
.nav button{flex:1;border:none;background:none;padding:10px 4px 9px;font-size:12px;color:var(--muted);position:relative}
.nav button .ic{display:block;font-size:20px;line-height:1.2}
.nav button.on{color:var(--orange-d);font-weight:700}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}
.room-row{display:flex;gap:10px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;width:100%;text-align:left;color:var(--text)}
.room-row .mid{flex:1;min-width:0}
.room-row .t{font-weight:700}
.room-row .l{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-row .tm{font-size:11px;color:var(--muted);text-align:right;flex:none}
.room-row .ub{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;margin-top:3px}
.stopped-lb{display:inline-block;background:var(--surface2);color:var(--muted);border-radius:6px;font-size:11px;padding:0 6px;margin-left:4px}
.wait-lb{display:inline-block;background:var(--red-l);color:var(--red);border-radius:6px;font-size:11px;padding:0 6px;margin-left:4px}
/* 部屋 */
.room{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.room-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.room-top .back{border:none;background:none;font-size:22px;padding:0 6px;color:var(--text)}
.room-top .tt{flex:1;min-width:0}
.room-top .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-top .tt span{font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:12px}
.bub{max-width:80%;margin:6px 0;display:flex;flex-direction:column}
.bub.me{margin-left:auto;align-items:flex-end}
.bub .b{padding:9px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);white-space:pre-wrap;word-break:break-word}
.bub.me .b{background:var(--orange-l);border-color:#F6DDB0}
.bub .s{font-size:11px;color:var(--muted);margin-top:2px}
.bub .who{font-size:11px;color:var(--muted);margin-bottom:2px}
.bub.thanks .b{background:var(--green-l);border-color:#CDE6BE}
.sys{text-align:center;font-size:12px;color:var(--muted);margin:10px 0}
.room-bottom{border-top:1px solid var(--border);background:var(--surface);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.room-bottom .rowx{display:flex;gap:8px;align-items:flex-end}
.room-bottom textarea{flex:1;resize:none;min-height:42px;max-height:120px}
.room-bottom .send{width:auto;padding:10px 14px}
.room-tools{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px;margin:8px 0}
.warn{font-size:13px;color:#8a5a00;background:var(--orange-l);border-radius:10px;padding:8px 10px;margin:6px 0}
/* モーダル */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
.modal h2{font-size:17px;margin:0 0 8px}
.rules{margin:8px 0 10px;padding-left:20px;font-size:14px}
.rules li{margin:3px 0}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0 12px}
.check input{margin-top:5px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2C2C2A;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;max-width:90%}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--border);padding:7px 4px;text-align:left}
.sum{display:flex;gap:8px;margin-bottom:12px}
.sum div{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;text-align:center}
.sum b{display:block;font-size:20px}
.sum span{font-size:11px;color:var(--muted)}
.login-tabs{display:flex;gap:6px;margin-bottom:12px}
.login-tabs button{flex:1;border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:8px;font-size:14px}
.login-tabs button.on{border-color:var(--orange);background:var(--orange-l);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
/* ---- 先輩図鑑：追加 ---- */
:root{--navy:#16233A;--navy2:#24344F}
.av-img{flex:none;border-radius:50%;object-fit:cover;background:var(--surface2);display:block}
.av-wrap{flex:none;text-align:center}
.av-lb{display:inline-block;margin-top:4px;font-size:10.5px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:0 8px}
.fac-h{font-size:13px;font-weight:700;color:var(--navy);margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.fac-h:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
.demo-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));z-index:90;background:rgba(22,35,58,.94);color:#fff;font-size:12px;padding:7px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);width:max-content;max-width:96vw;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.demo-bar button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
.demo-bar button.on{background:var(--orange);border-color:var(--orange);font-weight:700}
.img-box{display:flex;gap:14px;align-items:center;margin:6px 0 10px}
.st-pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 10px;font-weight:700}
.st-wait{background:var(--orange-l);color:var(--orange-d)}
.st-ok{background:var(--green-l);color:var(--green-d)}
.st-red{background:var(--red-l);color:var(--red)}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0}
.radio input{margin-top:5px}
.wish-box{background:var(--blue-l);border-radius:var(--radius);padding:14px;margin:12px 0}
.wish-box b{color:var(--blue)}
/* ---- PC（f i t のパソコン） ---- */
body.pc{max-width:none;padding-bottom:0;background:#FBF7F1}
body.pc .top,body.pc #main,body.pc .nav{display:none!important}
#pc{display:none}
body.pc #pc{display:flex;flex-direction:column;min-height:100vh}
.pc-hd{position:sticky;top:0;z-index:40;height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 28px;gap:22px}
.pc-logo{font-weight:700;font-size:24px;letter-spacing:.06em;white-space:nowrap}
.pc-logo i{font-style:normal;color:var(--orange)}
.pc-logo small{display:block;font-size:12px;font-weight:400;opacity:.75;letter-spacing:.02em}
.pc-srch{flex:1;max-width:560px;margin-left:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:11px 18px;font-size:14px;color:#fff;outline:none}
.pc-srch::placeholder{color:rgba(255,255,255,.65)}
.pc-sbox{flex:1;max-width:620px;margin-left:16px;display:flex;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 4px 4px 6px;min-width:0}
.pc-sbox .pc-srch{margin:0;border:none;background:transparent;max-width:none;padding:7px 12px;min-width:0}
.pc-sbox select{flex:none;border:none;border-radius:999px;background:var(--orange);color:#fff;font-weight:700;font-size:13px;padding:6px 10px;cursor:pointer}
.qkinds{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.qkinds button{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text)}
.qkinds button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.cand{display:flex;flex-wrap:wrap;gap:8px}
.cand button{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--text)}
.cand button:hover{border-color:var(--orange)}
.cand button span{color:var(--orange-d);font-weight:700;margin-left:4px}
.modes{display:flex;gap:6px;background:var(--surface2);border-radius:14px;padding:4px;margin-bottom:14px}
.modes button{flex:1;border:none;background:transparent;border-radius:11px;padding:10px 12px;font-size:16px;font-weight:700;color:var(--muted)}
.modes button.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.jb{border:1.5px solid #F1E8DA;background:#fff;border-radius:16px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;color:var(--text)}
.jb .ji{flex:none;width:46px;height:46px;border-radius:12px;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:24px}
.jb .jn{font-weight:700;font-size:15px;line-height:1.35}
.jb .jc{font-size:13px;color:var(--orange-d);font-weight:700}
.jb.zero{opacity:.55}.jb.zero .jc{color:var(--muted);font-weight:400}
.jb.on{border-color:var(--orange);background:var(--orange-l)}
.grp-h{font-size:15px;font-weight:700;margin:14px 0 4px;padding:6px 10px;border-radius:8px;background:#f3efe7}
.wk{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:#2A9D8F;border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:3px}
.job-line{font-size:14px;font-weight:700;color:#1F6F66;margin:2px 0 2px}
.only-wk,.only-st{display:none}
.sns{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:12px 6px}
.sns a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--text);min-width:0}
.sns .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.12);transition:transform .12s}
.sns a:active .ic,.sns a:hover .ic{transform:scale(1.06)}
.sns .ic.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.sns .ic.ig i{width:26px;height:26px;border:3px solid #fff;border-radius:8px;position:relative}
.sns .ic.ig i:before{content:"";position:absolute;inset:5px;border:3px solid #fff;border-radius:50%}
.sns .ic.ig i:after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:#fff;border-radius:50%}
.sns .ic.x{background:#111}
.sns .pic{position:relative;width:60px;height:60px;border-radius:50%;padding:3px;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%);box-shadow:0 4px 10px rgba(0,0,0,.12)}
.sns .pic.x{background:#111}.sns .pic.web{background:var(--navy)}
.sns .pic img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;display:block;background:#fff}
.sns .pic em{position:absolute;right:-3px;bottom:-3px;width:22px;height:22px;border-radius:7px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.sns .pic em.x{background:#111}.sns .pic em.web{background:var(--navy)}
.sns .pic em i{width:10px;height:10px;border:1.6px solid #fff;border-radius:3px;position:relative}
.sns .pic em i:before{content:"";position:absolute;inset:2px;border:1.4px solid #fff;border-radius:50%}
.sns a:hover .pic{transform:scale(1.05)}
.a2hs{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#16233A,#24344F);color:#fff;border:none}
.a2hs .muted{color:rgba(255,255,255,.75)}
.a2-ic{flex:none;width:48px;height:48px;border-radius:12px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--orange);font-weight:700;border:1px solid rgba(255,255,255,.25)}
.a2-ic img{width:100%;height:100%}
.a2-steps{list-style:none;padding:0;margin:8px 0}
.a2-steps li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.a2-n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.a2-i{flex:none;width:30px;text-align:center;font-size:20px;line-height:1.3}
.kbd{display:inline-block;border:1px solid var(--border);background:#fff;border-radius:8px;padding:0 6px;font-size:12px;color:var(--text);white-space:nowrap}
.a2-done{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:10px;font-size:13px}
.a2-done img{width:44px;height:44px;border-radius:11px}
.sns .ic.web{background:#fff;border:1px solid var(--border);overflow:hidden}
.sns .ic.web img{width:100%;height:100%}
.sns .ic.web b{font-size:15px;color:var(--orange);letter-spacing:0}
.sns .lb{font-size:11.5px;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.insta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insta a{display:flex;gap:8px;align-items:center;border:1.5px solid var(--border);border-radius:12px;padding:8px 10px;text-decoration:none;color:var(--text);min-width:0}
.insta a .ig{flex:none;width:30px;height:30px;border-radius:9px;background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.insta a .ig.xx{background:#111}
.insta a b{display:block;font-size:13px}
.insta a small{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insta a span:last-child{min-width:0}
.news-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.news .new{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px}
.news-t{font-size:17px;font-weight:700;margin:6px 0 2px}
.news-d{font-size:14px;color:var(--orange-d);font-weight:700}
.news-img{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin:8px 0}
.news-b{white-space:pre-wrap;font-size:14px;margin-top:4px}
.news-l{display:inline-block;margin-top:6px;font-size:14px}
.pf-wk .only-wk,.pf-st .only-st{display:block}
.only-wk-i{display:none}
.pf-link{display:inline-block;margin:2px 0 4px;font-size:13px;font-weight:700;color:#1f6fd1;text-decoration:none;border:1px solid #cfe0f7;background:#f3f8ff;border-radius:999px;padding:3px 10px}
.edu-s{display:none}.pf-wk.edu-senmon .edu-s{display:block}.pf-wk.edu-senmon .edu-u,.pf-wk.edu-hs .edu-u{display:none}
.qkinds{flex-wrap:wrap}.pf-wk .only-wk-i{display:inline}
.pc-me{margin-left:auto;font-size:12px;opacity:.8;text-align:right;line-height:1.45;white-space:nowrap}
.pc-btn{border:none;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px;background:var(--orange);color:#fff;white-space:nowrap;position:relative}
.pc-btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.pc-btn .badge{top:-4px;left:auto;right:2px}
.pc-who{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 8px 6px 16px;font-size:14px;white-space:nowrap}
.pc-who b{color:var(--orange)}
.pc-main{flex:1;display:flex;gap:24px;padding:24px 28px;align-items:flex-start}
.pc-map{flex:0 0 auto;width:clamp(560px,calc(100vw - 560px),1100px);max-height:calc(100vh - 120px);overflow-y:auto;background:#fff;border-radius:22px;padding:22px 24px;box-shadow:0 14px 34px -18px rgba(90,60,20,.25);border:1px solid #F1E8DA;position:sticky;top:96px}
.pc-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}

let session = null;
let refreshing = null;
const rawFetch = window.fetch.bind(window);
function loadSession() { try { session = JSON.parse(localStorage.getItem(FIT_SESSION_KEY) || 'null'); } catch (e) { session = null; } return session; }
function saveSession(s) { session = s || null; try { if (s) localStorage.setItem(FIT_SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(FIT_SESSION_KEY); } catch (e) {} }
async function refresh(force) {
  const cur = loadSession();
  if (!cur || !cur.refresh_token) return 'none';
  const now = Math.floor(Date.now() / 1000);
  if (!force && (cur.expires_at || 0) - now > 300) return 'ok';
  if (refreshing) return refreshing;
  refreshing = (async () => {
    try {
      const r = await rawFetch(FIT_SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', headers: { apikey: FIT_ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: cur.refresh_token })
      });
      if (r.status === 400 || r.status === 401 || r.status === 403) {
        const latest = loadSession();
        if (latest && latest.refresh_token !== cur.refresh_token) return 'ok';
        saveSession(null); return 'invalid';
      }
      if (!r.ok) return 'error';
      const j = await r.json();
      saveSession(Object.assign({}, cur, { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (now + (j.expires_in || 3600)) }));
      return 'ok';
    } catch (e) { return 'error'; } finally { refreshing = null; }
  })();
  return refreshing;
}
async function login(kind, id, pin) {
  let j = null;
  try {
    const r = await rawFetch(FIT_SB_URL + '/functions/v1/fit-login', {
      method: 'POST', headers: { apikey: FIT_ANON, Authorization: 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, id: id, pin: pin })
    });
    j = await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
  if (j && j.ok) saveSession(Object.assign({}, j.session, { kind: j.kind, account_id: String(j.account.id) }));
  return j || { ok: false, error: 'network' };
}

// 関数を呼ぶ
//   見本：demoRpc ／ f i t のパソコン：senpai_k（端末の合言葉＋QRで入った生徒の番号）／ふつう：ログイン中のトークン
async function rpc(name, args, anonOk) {
  if (S.viewAs) {
    if (name === 'senpai_links_mine' || name === 'senpai_rooms_list') return [];
    if (name === 'senpai_news_seen') return null;
    if (VIEW_OK.indexOf(name) === -1) throw new Error('見るだけのモードです（スタッフに戻ってから操作してください）');
  }
  if (DEMO) return demoRpc(name, args || {});
  if (S.kiosk && name !== 'senpai_apply') {
    const r = await rawFetch(FIT_SB_URL + '/rest/v1/rpc/senpai_k', {
      method: 'POST', headers: { apikey: FIT_ANON, Authorization: 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_device: S.kiosk.token, p_session: S.ks ? S.ks.token : null, p_fn: name, p_args: args || {} })
    });
    const tx = await r.text();
    if (!r.ok) {
      let m = tx; try { m = JSON.parse(tx).message || tx; } catch (e) {}
      if (/kiosk_session_expired/.test(m) && S.ks) { kioskOut('時間がたったので、ログアウトしました。'); }
      if (/device_revoked|device_unknown/.test(m)) { try { localStorage.removeItem(DEVICE_KEY); } catch (e) {} }
      throw new Error(m);
    }
    return tx ? JSON.parse(tx) : null;
  }
  for (let i = 0; i < 2; i++) {
    const s = loadSession();
    const token = s && s.access_token ? s.access_token : (anonOk ? FIT_ANON : null);
    if (!token) throw new Error('login');
    const r = await rawFetch(FIT_SB_URL + '/rest/v1/rpc/' + name, {
      method: 'POST', headers: { apikey: FIT_ANON, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(args || {})
    });
    const tx = await r.text();
    if (r.status === 401 && i === 0 && s) { const rr = await refresh(true); if (rr === 'ok') continue; throw new Error('login'); }
    if (!r.ok) { let m = tx; try { m = JSON.parse(tx).message || tx; } catch (e) {} throw new Error(m); }
    return tx ? JSON.parse(tx) : null;
  }
}

// 画像を小さくする（JPEG・長い辺 px）
function shrinkImage(src, px, q) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, px / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q || 0.82));
    };
    img.onerror = () => rej(new Error('画像を読めませんでした'));
    img.src = src;
  });
}
// 正方形に切って小さくする（公開用 256px）
function squareImage(src, px) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      const c = document.createElement('canvas'); c.width = c.height = px;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, px, px); g.drawImage(img, sx, sy, m, m, 0, 0, px, px);
      res(c.toDataURL('image/jpeg', 0.84));
    };
    img.onerror = () => rej(new Error('画像を読めませんでした'));
    img.src = src;
  });
}
function readFile(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }

async function newQR() {

async function otpSend(email, mode) {

}
async function otpVerify(email, code) {

  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) return { ok: false };
  saveSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600)), kind: 'alumni', account_id: j.user && j.user.id });

function closeRoom() {

async function pullMsgs(first) {
  if (!S.room) return;
  let j;
  try { j = await rpc('senpai_messages_get', { p_room: S.room.id, p_after: first ? 0 : S.lastId }); }
  catch (e) { if (first) $('msgs').innerHTML = '<div class="err">' + esc(errText(e)) + '</div>'; return; }
  const add = j.messages || [];
  if (first) S.msgs = add; else S.msgs = S.msgs.concat(add);
  if (add.length) S.lastId = add[add.length - 1].id;
  const changed = first || add.length || j.other_read !== S.otherRead || !!j.room.stopped !== !!S.room.stopped;
  S.otherRead = j.other_read || 0;
  S.room.stopped = j.room.stopped; S.room.stopped_by_kind = j.room.stopped_by_kind;
  if (changed) drawMsgs(first || add.length > 0);
}
function drawMsgs(scroll) {
  const box = $('msgs'); if (!box) return;
  const staff = S.me.role === 'staff';
  let lastMine = 0; S.msgs.forEach((m) => { if (m.mine) lastMine = m.id; });
  let h = '<div class="note">' + 'やりとりはこのアプリの中だけです。連絡先は送れません。スタッフが見守っています。' + '</div>';
  if (!S.msgs.length) h += '<div class="empty">まだメッセージはありません。</div>';
  S.msgs.forEach((m) => {
    if (m.kind === 'system') { h += '<div class="sys">— ' + esc(m.body) + '（' + esc(jst(m.at)) + '）—</div>'; return; }
    const me = !staff && m.mine;
    const who = staff ? (S.room && S.room.kind === 'alumni' ? (m.sender_name || '先輩') : (m.role === 'student' ? '生徒' : '先輩')) : '';
    h += '<div class="bub' + (me ? ' me' : '') + (m.kind === 'thanks' ? ' thanks' : '') + '">' + (who ? '<div class="who">' + who + '</div>' : '') +
      '<div class="b">' + (m.kind === 'thanks' ? '💐 ' : '') + esc(m.body) + '</div>' +
      '<div class="s">' + esc(jst(m.at)) + (me && m.id === lastMine && S.otherRead >= m.id ? '　既読' : '') + '</div></div>';
  });
  box.innerHTML = h;
  if (scroll) box.scrollTop = box.scrollHeight;
  const bt = $('rm-bottom');
  if (staff) {
    const sb = $('rm-stop');
    if (sb) { sb.textContent = S.room.stopped ? '再開する' : '止める'; sb.className = 'btn small ' + (S.room.stopped ? 'green' : 'red'); }
    bt.innerHTML = '<div class="muted">スタッフは見るだけです（書きこめません）。' + (S.room.stopped ? 'このやりとりは止まっています。' : '') + '</div>';
    return;
  }
  if (S.room.stopped) {
    bt.innerHTML = '<div class="muted">このやりとりは止まっています。' + (S.room.stopped_by_kind === 'staff' ? 'スタッフに相談してください。' : '') + '</div>';
    return;
  }
  if (!$('rm-text')) {
    bt.innerHTML = '<div class="warn hide" id="rm-warn"></div><div class="rowx"><textarea class="input" id="rm-text" rows="1" placeholder="メッセージ" oninput="autoGrow(this)"></textarea><button class="btn send" id="rm-send" onclick="sendMsg(\'text\')">送る</button></div>' +
      '<div class="room-tools">' + (S.me.role === 'student' ? '<button class="btn small sub" onclick="sendThanks()">💐 ありがとうを送る</button>' : '') +
      '<button class="btn small sub" onclick="endRoom()">やりとりを終える</button></div>';
  }
}
function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; }
async function sendMsg(kind, text) {
  const ta = $('rm-text'), w = $('rm-warn');
  const body = (text != null ? text : ta.value).trim();
  if (!body) return;
  w.classList.add('hide');
  if (hasContact(body)) { w.textContent = ERR.contact_not_allowed; w.classList.remove('hide'); return; }
  const h = new Date(Date.now() + 9 * 3600000).getUTCHours();
  if ((h >= 22 || h < 6) && !DEMO && !confirm('夜遅い時間です。送ってよいですか？（相手には朝に読んでもらう形でもOKです）')) return;
  $('rm-send').disabled = true;
  try {
    await rpc('senpai_send', { p_room: S.room.id, p_body: body, p_kind: kind });
    if (text == null) { ta.value = ''; autoGrow(ta); }
    await pullMsgs(false);
  } catch (e) { w.textContent = errText(e); w.classList.remove('hide'); }
  $('rm-send').disabled = false;
}
function sendThanks() {
  const t = prompt('先輩へのありがとうのメッセージ', 'ありがとうございました！とても参考になりました。');
  if (t && t.trim()) sendMsg('thanks', t);
}
async function endRoom() {
  if (!confirm('このやりとりを終えますか？終えると、どちらも書きこめなくなります。')) return;

}
async function staffStop() {
  const reopen = !!S.room.stopped;
  let reason = null;
  if (!reopen) { reason = prompt('止める理由（スタッフだけが見ます。空でもOK）', ''); if (reason === null) return; }
  else if (!confirm('このやりとりを再開しますか？')) return;
  try { await rpc('senpai_stop_room', { p_room: S.room.id, p_reason: reason, p_reopen: reopen }); await pullMsgs(false); drawMsgs(true); } catch (e) { toast(errText(e)); }
}

async function jobAdd() { const n = $('jb-n').value.trim(), f = $('jb-f').value; if (!n || !f) { toast('仕事の名前と分野を入れてください'); return; } try { await rpc('senpai_job_save', { p_name: n, p_field: f }); toast('足しました'); loadSettings(); } catch (e) { toast(errText(e)); } }
async function jobOk(n) { try { await rpc('senpai_job_save', { p_name: n, p_ok: true }); loadSettings(); } catch (e) { toast(errText(e)); } }
async function jobDel(n) { if (!confirm('「' + n + '」を一覧から消しますか？（登録している先輩の紹介はそのまま）')) return; try { await rpc('senpai_job_delete', { p_name: n }); loadSettings(); } catch (e) { toast(errText(e)); } }
function snsKind(u) { return /instagram\.com/.test(u) ? 'ig' : /(x|twitter)\.com/.test(u) ? 'x' : 'web'; }
function snsAccount(u) { const m = String(u).match(/(?:instagram\.com|x\.com|twitter\.com)\/([^/?#]+)/); return m ? m[1] : String(u).replace(/^https?:\/\//, '').replace(/\/.*$/, ''); }
async function snsSave(x) { await rpc('senpai_sns_save', { p: x }); loadSettings(); }
async function snsImg(id, inp) { const f = inp.files && inp.files[0]; if (!f) return; try { const img = await squareImage(await readFile(f), 160); const x = S.sns.find((y) => y.id === id); await snsSave(Object.assign({}, x, { img: img })); toast('画像を入れました'); } catch (e) { toast(errText(e)); } }
async function snsMove(id, d) { try { await rpc('senpai_sns_move', { p_id: id, p_dir: d }); loadSettings(); } catch (e) { toast(errText(e)); } }
async function snsDel(id) { if (!confirm('このアイコンを消しますか？')) return; try { await rpc('senpai_sns_delete', { p_id: id }); loadSettings(); } catch (e) { toast(errText(e)); } }
async function snsAdd() {
  const n = $('sn-n').value.trim(), u = $('sn-u').value.trim().replace(/\?.*$/, '');
  if (!n || !/^https?:\/\//.test(u)) { toast('名前と https:// から始まるURLを入れてください'); return; }
  try { await snsSave({ id: null, name: n, url: u, kind: snsKind(u), account: snsAccount(u), img: null }); } catch (e) { toast(errText(e)); }
}
async function registerDevice() {
  const n = $('dv-name').value.trim();
  if (!n) { toast('名前を入れてください'); return; }
  if (!confirm('このパソコンを「' + n + '」として登録します。スタッフのログインは消えます。よいですか？')) return;
  try {
    const r = await rpc('senpai_device_register', { p_name: n });
    if (DEMO) { toast('（見本）登録したことにしました'); return; }
    localStorage.setItem(DEVICE_KEY, JSON.stringify({ token: r.token, name: n }));
    dropStaffSession();
    location.href = location.pathname;
  } catch (e) { toast(errText(e)); }
}
async function revokeDevice(id) { if (!confirm('このパソコンの登録を取り消しますか？')) return; try { await rpc('senpai_device_revoke', { p_id: id }); loadSettings(); } catch (e) { toast(errText(e)); } }
async function saveUniv(name, pref) {
  if (!name) { name = $('un-name').value.trim(); pref = $('un-pref').value; if (!name || !pref) { toast('大学名と県を入れてください'); return; } }
  try { await rpc('senpai_univ_save', { p_name: name, p_pref: pref }); toast('保存しました'); if (!pref || $('un-name') && $('un-name').value) loadSettings(); } catch (e) { toast(errText(e)); }
}

function askNotify() { if (window.Notification) Notification.requestPermission().then(() => { if (S.tab === 'rooms') renderRooms(); }); }
function notify(t, b) { try { if (window.Notification && Notification.permission === 'granted') new Notification(t, { body: b }); } catch (e) {} }
function startPoll() {
  clearInterval(pollTimer);
  if (S.me && S.me.role === 'kiosk') return;
  refreshRooms();
  pollTimer = setInterval(async () => {
    if (document.visibilityState !== 'visible' && !(window.Notification && Notification.permission === 'granted')) return;
    if (S.room) return;
    if (S.me && S.me.role === 'senpai' && S.tab === 'rooms' && !S.viewAs) { try { S.smThreads = await rpc('senpai_staffmsg_threads') || []; } catch (e) {} }
    const ok = await refreshRooms();
    if (ok && document.visibilityState === 'visible') {
      if (S.tab === 'rooms' && !document.body.classList.contains('pc')) renderRooms();
      // 卒業生へ連絡：一覧（既読・未読）だけ読み直す（書きかけの内容・選んだ人はそのまま）
      if (S.tab === 'contact' && !$('sm-box') && Date.now() - (S.smListAt || 0) > 15000) { S.smListAt = Date.now(); smLists(); }
    }
  }, 20000);
}

    case 'senpai_staffmsg_people': return out(D.profiles.map((p) => ({ id: p.id, nickname: p.nickname, real: p.real, kind: p.kind === 'worker' ? 'worker' : 'student', ehime: p.pref === '愛媛' || p.work_pref === '愛媛' })));

        const M = D.sm.filter((m) => m.senpai === t.senpai && m.staff === t.staff), l = M[M.length - 1] || {}, p = D.profiles.find((x) => x.id === t.senpai) || {};

          unread: M.filter((m) => (st ? m.from === 'senpai' && m.id > t.tr && t.staff === 'fit003' : m.from === 'staff' && m.id > t.sr)).length };
      }).sort((x, y) => String(y.last_at).localeCompare(String(x.last_at))));
    }

      const st = r === 'staff', sid = st ? a.p_senpai : me, sc = a.p_staff || 'fit003', k = sid + '|' + sc, t = D.smT[k], p = D.profiles.find((x) => x.id === sid) || {};
      if (!st && !t) dErr('not_found');
      const M = D.sm.filter((m) => m.senpai === sid && m.staff === sc), own = st ? sc === 'fit003' : true;

      return out({ senpai_id: sid, staff_code: sc, staff_name: t ? t.name : '見本 スタッフ', can_send: own, other_read: t ? (st ? t.sr : t.tr) : 0, nickname: p.nickname, real: st ? p.real : null,
        messages: M.filter((m) => m.id > (a.p_after || 0)).map((m) => ({ id: m.id, role: m.from, staff_name: m.name, body: m.body, at: m.at, mine: (st && m.from === 'staff') || (!st && m.from === 'senpai'), broadcast: D.sm.filter((b) => b.batch && b.batch === m.batch).length > 1 })) });
    }
    case 'senpai_staffmsg_reply': { const t = D.smT[me + '|' + a.p_staff]; if (!t) dErr('not_found'); D.sm.push({ id: ++D.seq, senpai: me, staff: a.p_staff, from: 'senpai', body: a.p_body, at: now }); t.sr = D.seq; return D.seq; }
    case 'senpai_staffmsg_notify': { const res = []; Object.values(D.smT).filter((t) => t.staff === 'fit003' && (/^batch:/.test(a.p_senpai || '') ? D.sm.some((m) => m.batch === Number(a.p_senpai.slice(6)) && m.senpai === t.senpai && m.staff === 'fit003' && m.id > t.sr) : (!a.p_senpai || t.senpai === a.p_senpai))).forEach((t) => { const n = D.sm.filter((m) => m.senpai === t.senpai && m.staff === t.staff && m.from === 'staff' && m.id > t.sr).length; if (n) { t.notified = now; res.push({ email: 'x', count: n }); } }); return res; }
    case 'senpai_staffmsg_unread': return Object.values(D.smT).reduce((n, t) => n + D.sm.filter((m) => m.senpai === t.senpai && m.staff === t.staff && (r === 'staff' ? t.staff === 'fit003' && m.from === 'senpai' && m.id > t.tr : t.senpai === me && m.from === 'staff' && m.id > t.sr)).length, 0);

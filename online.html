<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>fit オンライン講座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F0A030; --orange-d:#D9832A; --orange-l:#F7D9A8;
    --bg:#FBF6EE; --surface:#FFFFFF; --border:#EADFCB;
    --text:#3B342B; --muted:#9A8F7D; --green-d:#1E6B3F;
    --radius:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
  .brand{text-align:center;margin:18px 0 8px}
  .brand .logo{
    width:64px;height:64px;border-radius:20px;margin:0 auto 10px;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;
  }
  .brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.08em}
  .brand p{font-size:12px;color:var(--muted);margin:4px 0 0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px}
  .card h2{font-size:16px;margin:0 0 4px;font-weight:700}
  .card .sub{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.7}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
  input[type=text],input[type=password]{
    width:100%;padding:13px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;font-family:inherit;background:var(--bg);
  }
  input:focus{outline:none;border-color:var(--orange)}
  .btn{
    width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn:active{opacity:.85}
  .btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted);font-weight:700}
  .err{display:none;background:#FDECEA;border:1px solid #E6B0AA;color:#943126;border-radius:10px;padding:10px;font-size:13px;margin-top:12px;line-height:1.6}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .topbar .who{font-size:13px;color:var(--text);font-weight:700}
  .topbar .who span{color:var(--muted);font-weight:400;font-size:12px}
  .course{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
  .course h3{margin:0 0 4px;font-size:15px;font-weight:700}
  .course .desc{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 10px}
  .course .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .course.hero{position:relative;overflow:hidden;border:0;padding:20px;color:#fff;
    background:radial-gradient(circle at 92% 8%,rgba(255,255,255,.22) 0,rgba(255,255,255,0) 38%),linear-gradient(135deg,#F2A23A 0%,#E07B2A 55%,#C9601F 100%);
    box-shadow:0 10px 28px rgba(217,131,42,.35)}
  .course.hero::after{content:'▶';position:absolute;right:-6px;bottom:-34px;font-size:130px;opacity:.10;line-height:1}
  .course.hero h3{font-size:20px;font-weight:900;color:#fff;margin:4px 0 4px;letter-spacing:.02em}
  .course.hero .desc{color:rgba(255,255,255,.92);font-size:13px}
  .course.hero .chip{background:rgba(255,255,255,.22);color:#fff}
  .hero-eyebrow{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px}
  .hero-prog{position:relative;z-index:1}
  .hero-count{font-size:13px;display:flex;align-items:baseline;gap:4px}
  .hero-count b{font-size:22px;font-weight:900}
  .hero-count span{margin-left:auto;font-weight:800}
  .hero-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden;margin:6px 0 8px}
  .hero-bar i{display:block;height:100%;background:#fff;border-radius:999px}
  .hero-next{font-size:12.5px;color:rgba(255,255,255,.95);margin-bottom:4px}
  .hero-btn{position:relative;z-index:1;width:100%;margin-top:10px;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;color:#D9832A;background:#fff;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.12);transition:transform .1s}
  .hero-btn:active{transform:scale(.98)}
  .hero-zone{margin-bottom:6px}
  .hero-zone .course.hero{margin-top:14px}
  .hero-main{display:flex;flex-direction:column;gap:12px;margin-top:4px;position:relative;z-index:1}
  .hero-thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:14px;cursor:pointer;padding:0;
    background:#3B2A1A center/cover no-repeat;box-shadow:0 8px 22px rgba(0,0,0,.25);overflow:hidden}
  .hero-thumb::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.35))}
  .hero-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);color:#D9832A;font-size:26px;display:flex;align-items:center;justify-content:center;padding-left:5px;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s}
  .hero-thumb:hover .hero-play{transform:translate(-50%,-50%) scale(1.08)}
  .hero-dur{position:absolute;right:8px;bottom:10px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px}
  .hero-tbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.35)}
  .hero-tbar i,.hs-bar i{display:block;height:100%;background:#FF3B30}
  .hero-info{display:flex;flex-direction:column}
  .hero-feat-lbl{font-size:12px;font-weight:800;opacity:.95}
  .hero-feat-ttl{font-size:19px;font-weight:900;line-height:1.35;margin:2px 0 10px}
  .hero-strip-h{position:relative;z-index:1;display:flex;align-items:center;font-size:12.5px;font-weight:800;margin:16px 0 8px}
  .hero-strip-h button{margin-left:auto;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
  .hero-strip{position:relative;z-index:1;display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .hero-strip::-webkit-scrollbar{height:6px}.hero-strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.4);border-radius:3px}
  .hs-item{flex:none;width:148px;scroll-snap-align:start;border:0;background:rgba(255,255,255,.14);border-radius:12px;padding:6px;text-align:left;color:#fff;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:3px}
  .hs-item.cur{background:#fff;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .hs-item.lock{opacity:.55;cursor:not-allowed}
  .hs-th{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:8px;background:#3B2A1A center/cover no-repeat;overflow:hidden}
  .hs-done{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:#2E9E6B;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .hs-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);font-size:18px}
  .hs-bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.4)}
  .hs-no{font-size:10px;font-weight:800;opacity:.85}
  .hs-ttl{font-size:12px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* 右カラム内に収まるサイズ：幅があるときはサムネ左・情報右 */
  @media (min-width:560px){
    .hero-main{flex-direction:row;align-items:center;gap:16px}
    .hero-thumb{width:48%;flex:none}
    .hero-info{flex:1;min-width:0}
  }
  .home-right .course.hero{margin-top:0}
  .hero-play{width:52px;height:52px;font-size:21px}
  .hero-feat-ttl{font-size:17px}
  .hs-item{width:128px}
  .course.hero.locked{background:linear-gradient(135deg,#B9AE9E,#9A8F7D);box-shadow:none}
  .course.hero.locked .hero-btn{color:#9A8F7D;cursor:not-allowed;opacity:.8}
  .chip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px}
  .chip.ok{background:#E8F6EE;color:var(--green-d)}
  .chip.lock{background:#FDECEA;color:#943126}
  .chip.info{background:#EAF2FB;color:#1E4276}
  .empty{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;margin-top:12px}
  .loading{text-align:center;color:var(--muted);font-size:13px;padding:24px}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}
  .hidden{display:none}
  /* ===== 視聴画面レイアウト ===== */
  .watch-head{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:16px}
  .watch-head .crumb{font-size:11px;color:var(--muted);margin-bottom:2px}
  .watch-head h2{font-size:17px;margin:0;font-weight:800}
  .watch-grid{display:flex;flex-direction:column;gap:14px;margin-top:14px}
  .watch-main{min-width:0}
  .watch-side{min-width:0}
  .player-wrap{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
  .player-wrap #yt-player{position:absolute;inset:0;width:100%;height:100%}
  .player-wm{position:absolute;top:8%;left:6%;z-index:5;font-size:11px;font-weight:600;
    color:rgba(255,255,255,.32);text-shadow:0 1px 3px rgba(0,0,0,.55);
    pointer-events:none;letter-spacing:.04em;white-space:nowrap;max-width:60%;
    overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity 1.1s ease}
  .player-wm.show{opacity:1}
  @media (prefers-reduced-motion:reduce){ .player-wm{transition:none} }
  .goal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .goal-box .lbl{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700}
  .goal-box .goal-txt{font-size:14px;line-height:1.75;color:var(--text)}
  .goal-box .ov-txt{font-size:13px;line-height:1.75;color:var(--muted)}
  .goal-box .divider{height:1px;background:var(--border);margin:14px 0}
  .side-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 16px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer}
  .side-toggle .chev{transition:transform .2s;color:var(--muted)}
  .side-toggle.open .chev{transform:rotate(180deg)}
  .dl-btn{display:flex;align-items:center;gap:8px;width:100%;justify-content:flex-start;
    background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:13px 14px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;text-decoration:none;margin-bottom:10px}
  .dl-btn:active{opacity:.85}
  /* 感想ロック（動画視聴前） */
  .btn.locked{opacity:.45;cursor:not-allowed}
  #reflection:disabled{opacity:.6;cursor:not-allowed}
  #reflection-hint.done{color:var(--accent, #C9822E)}
  @media (min-width:820px){
    body.watching .wrap{max-width:1080px}
    .watch-grid{display:grid;grid-template-columns:230px minmax(0,1fr) 250px;gap:16px;align-items:start}
    .side-toggle{display:none}
    #side-body{display:block !important}
  }
  @media (max-width:819px){
    .watch-left:empty{display:none}
  }
  /* ====== 追加：デザイン刷新 ====== */
  .brand h1{font-weight:900;letter-spacing:.04em}
  body.logged-in .brand p{display:none}
  .card h2{font-weight:800}

  /* 講座の進捗サマリー */
  .progress-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
  .pc-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .pc-lbl{font-size:12px;color:var(--muted);font-weight:700}
  .pc-num{font-size:15px;font-weight:900;color:var(--text)}
  .pc-num b{color:var(--orange-d)}

  /* 進捗バー */
  .bar{height:7px;background:var(--orange-l);border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-d));border-radius:999px;transition:width .4s ease}
  .bar.sm{height:6px;margin:9px 0 5px}

  /* ダッシュボード風の授業カード */
  .lesson{display:flex;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:12px}
  .lesson.is-locked{opacity:.72}
  .lesson .thumb{position:relative;flex:0 0 120px;aspect-ratio:16/9;border-radius:10px;
    background:#EEE7D8 center/cover no-repeat;overflow:hidden}
  .lesson .thumb.noimg{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
  .lesson .thumb .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.74);color:#fff;
    font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;letter-spacing:.02em}
  .lesson .thumb .done{position:absolute;left:5px;top:5px;width:21px;height:21px;border-radius:50%;
    background:var(--green-d);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .lesson-body{flex:1;min-width:0;display:flex;flex-direction:column}
  .lesson-body h3{margin:1px 0 6px;font-size:14px;font-weight:700;line-height:1.5}
  .lesson-body .pct{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .btn.sm{width:auto;align-self:flex-start;margin-top:8px;padding:9px 18px;font-size:13px;border-radius:10px}

  /* 視聴画面のツール（拡大・全画面） */
  .player-tools{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .tool-btn{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:6px 13px;
    font-size:12px;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit}
  .tool-btn:active{opacity:.85}
  .watch-note{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 2px}

  /* 動画の全画面（player-wrapを画面いっぱいに） */
  .player-wrap:fullscreen{padding-top:0;width:100vw;height:100vh;border-radius:0}
  .player-wrap:-webkit-full-screen{padding-top:0;width:100vw;height:100vh;border-radius:0}

  /* 自作の動画コントロール（YouTube操作面は隠す） */
  .pw-catch{position:absolute;inset:0;z-index:4;cursor:pointer}
  .pv-bar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0))}
  .pv-btn{background:none;border:none;color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:2px 4px;flex:none;font-family:inherit}
  .pv-btn:active{opacity:.7}
  .pv-time{color:#fff;font-size:11px;font-variant-numeric:tabular-nums;flex:none;min-width:32px;text-align:center}
  .pv-seek{flex:1;min-width:40px;height:4px;accent-color:var(--orange);cursor:pointer}
  .pv-vol{width:64px;flex:none;height:4px;accent-color:var(--orange);cursor:pointer}
  .pv-rate{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:6px;font-size:11px;padding:3px 4px;flex:none;font-family:inherit;cursor:pointer}
  .pv-rate option{color:#111}
  @media (max-width:520px){ .pv-vol{display:none} }

  /* 感想の出現アニメーション＋完了バッジ */
  .reveal-hidden{display:none}
  @keyframes revealIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .reveal-in{animation:revealIn .45s ease both}
  .done-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
    color:var(--green-d);background:#E8F6EE;border:1px solid #A9DFBF;border-radius:999px;padding:4px 12px;margin-bottom:12px}

  /* 視聴中も通常のクリーム背景（シアター表示は取りやめ） */

  /* 拡大モード（左は残して中央＝動画を右へ広げる） */
  @media (min-width:820px){
    body.watching.wide .wrap{max-width:1320px}
    .watch-grid.wide{grid-template-columns:230px minmax(0,1fr)}
    .watch-grid.wide .watch-side{grid-column:1 / -1}
  }
  @media (max-width:819px){
    .tool-wide{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .reveal-in{animation:none}
    .bar-fill{transition:none}
  }
  /* 完了証 */
  .cert-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .cert-sheet{background:#fff;color:#333;max-width:520px;width:100%;border-radius:14px;padding:34px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px double var(--orange)}
  .cert-emoji{font-size:44px;line-height:1}
  .cert-title{font-size:26px;font-weight:800;letter-spacing:.35em;margin:10px 0 20px;color:#222}
  .cert-name{font-size:20px;font-weight:700;margin-bottom:18px;border-bottom:1px solid #ddd;padding-bottom:14px}
  .cert-body{font-size:15px;line-height:2;margin-bottom:22px}
  .cert-date{font-size:13px;color:#666;margin-bottom:4px}
  .cert-issuer{font-size:14px;font-weight:700;color:#444;margin-bottom:22px}
  .cert-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  @media print{
    body.printing-cert *{visibility:hidden}
    body.printing-cert #cert-overlay,body.printing-cert #cert-overlay *{visibility:visible}
    body.printing-cert #cert-overlay{position:absolute;inset:0;background:#fff;padding:0}
    body.printing-cert .cert-sheet{box-shadow:none;border-color:#c8792e}
    body.printing-cert #cert-actions{display:none}
  }
  /* トースト */
  .o-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s,transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
  .o-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* マイページ ステータス（連続ログイン・ポイント）*/
  .mp-stats{display:flex;gap:10px;margin:6px 0 2px}
  .mp-stat{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 10px;text-align:center}
  .mp-stat .v{font-size:22px;font-weight:800;color:var(--orange-d);line-height:1.1}
  .mp-stat .l{font-size:11px;color:var(--muted);margin-top:3px}
  .mp-badge{display:inline-block;font-size:12px;font-weight:700;color:#8a5a00;background:#FFF3DC;border:1px solid #F0D08A;border-radius:999px;padding:4px 11px;margin:0 6px 6px 0}
  /* ランク章（楽天式・メダル＋一覧）*/
  .rank-card{margin:6px 0 12px;padding:14px 16px;border-radius:var(--radius-sm);
    background:linear-gradient(var(--rkt),var(--rkt)),var(--surface);
    border:1px solid var(--rk)}
  .rank-top{display:flex;align-items:center;gap:12px}
  .rank-lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .rank-name{font-size:20px;font-weight:900;color:var(--text);line-height:1.1;letter-spacing:.02em}
  .rank-pt{margin-left:auto;font-size:20px;font-weight:900;color:var(--orange-d)}
  .rank-pt span{font-size:11px;font-weight:700;color:var(--muted);margin-left:2px}
  .rank-bar{height:8px;border-radius:999px;background:#EEE3CE;overflow:hidden;margin:12px 0 6px}
  .rank-fill{height:100%;border-radius:999px;background:var(--rk);transition:width .5s ease}
  .rank-next{font-size:12px;color:var(--muted)}

// ---- REST ヘルパー（app.html と同じ作法）----
async function sbGet(table, query) {
  const res = await fetch(SB_URL + '/rest/v1/' + table + '?' + query, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
  if (!res.ok) { let t = ''; try { t = (await res.text()).slice(0, 160); } catch (e) {} throw new Error('取得エラー(' + res.status + ') ' + table + ' ' + t); }
  return res.json();
}

// 取得に失敗したら別のクエリ（列を減らしたもの）で取り直す。それでもダメなら空配列。
async function sbGetSafe(table, query, fallbackQuery) {
  try { return await sbGet(table, query); }
  catch (e1) {
    console.warn('[sbGetSafe]', table, e1.message);
    if (fallbackQuery) { try { return await sbGet(table, fallbackQuery); } catch (e2) { console.warn('[sbGetSafe:fallback]', table, e2.message); } }
    return [];
  }
}

async function sbPost(table, body, prefer) {
  const res = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: {
      apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      Prefer: prefer || 'return=representation'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) { let t = ''; try { t = (await res.text()).slice(0, 200); } catch (e) {} throw new Error('登録エラー(' + res.status + ') ' + table + ' ' + t); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function sbPatch(table, query, body) {
  const res = await fetch(SB_URL + '/rest/v1/' + table + '?' + query, {
    method: 'PATCH',
    headers: {
      apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      Prefer: 'return=representation'
    },

  });

  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// timestamptz を JST の「M/D HH:MM」で表示（UTCドリフト回避）
function fmtJST(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const p = new Intl.DateTimeFormat('ja-JP', {
    timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{});
  return p.month + '/' + p.day + ' ' + p.hour + ':' + p.minute;
}

// YouTube ID の抽出（生ID / URL / 短縮URL いずれでも）
function extractYouTubeId(v) {
  if (!v) return '';
  const s = String(v).trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}

// 秒 → m:ss
function fmtDur(sec){ sec=Math.max(0,Math.floor(sec||0)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
// JSTの今日を 'YYYY-MM-DD' で返す

function ensureNickname() {
  const s = currentOnlineStudent;
  if (!s || !('nickname' in s) || (s.nickname && String(s.nickname).trim())) return Promise.resolve();   // 列未追加 or 設定済み
  return new Promise(function (resolve) {
    const ov = document.createElement('div');
    ov.className = 'nick-ov';
    ov.innerHTML = '<div class="nick-card">'
      + '<div class="nick-emoji">👋</div>'
      + '<div class="nick-ttl">ニックネームを決めよう</div>'
      + '<div class="nick-sub">チームのメンバーやランキングには、この名前で表示されます。本名のままでもOKです。<br><b>会社名・学校名は表示されません。</b></div>'
      + '<input id="nick-first" maxlength="12" placeholder="例：たろう、Taro、ゆうき" autocomplete="off">'
      + '<div class="nick-err" id="nick-first-err"></div>'
      + '<button class="btn" id="nick-first-btn">この名前ではじめる</button>'
      + (s.name ? '<button class="nick-real" id="nick-real-btn">本名（' + esc(s.name) + '）で表示する</button>' : '')
      + '<div class="nick-note">あとからヘッダーの「✏️ニックネーム」で変更できます（12文字まで）</div>'
      + '</div>';
    document.body.appendChild(ov);
    const inp = ov.querySelector('#nick-first'), err = ov.querySelector('#nick-first-err'), btn = ov.querySelector('#nick-first-btn');
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
    async function save() {
      const v = (inp.value || '').trim().slice(0, 12);
      if (!v) { err.textContent = 'ニックネームを入力してください'; return; }
      btn.disabled = true; btn.textContent = '保存中…';
      try {
        await sbPatch('online_students', 'id=eq.' + s.id, { nickname: v });
        s.nickname = v; renderWho();
        ov.remove(); resolve();
      } catch (e) { btn.disabled = false; btn.textContent = 'この名前ではじめる'; err.textContent = '保存できませんでした。電波の良い場所でもう一度押してください。'; }
    }
    btn.onclick = save;
    const rb = ov.querySelector('#nick-real-btn');
    if (rb) rb.onclick = function () { inp.value = String(s.name).slice(0, 12); save(); };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });
  });
}

      sbGet('online_sessions', 'online_student_id=' + inIds + '&source=eq.manual&is_active=not.is.false&select=online_student_id,minutes,login_at,session_date,source').catch(() => []),
      sbGet('online_assignments', 'online_student_id=' + inIds + '&status=eq.done&is_active=not.is.false&created_at=gte.' + encodeURIComponent(startIso) + '&select=id,online_student_id,title,category,source,status,study_minutes,created_at,done_at&order=created_at.desc').catch(() => []),
      sbGet('online_views', 'online_student_id=' + inIds + '&select=*').catch(() => [])   // 列の有無に左右されないよう全列取得
    ]);
    const allViews = (views || []).filter(v => (v.last_viewed_at || v.completed_at || v.first_viewed_at || '') >= startIso);
    views = allViews.filter(v => v.completed && v.completed_at && v.completed_at >= startIso);   // タイムライン用（完了した動画）
    // 動画タイトル
    let lessonTitle = {};
    const lids = [...new Set((views || []).map(v => v.online_lesson_id).filter(Boolean))];
    if (lids.length) { try { (await sbGet('online_lessons', 'id=in.(' + lids.join(',') + ')&select=id,title')).forEach(l => { lessonTitle[l.id] = l.title; }); } catch (e) {} }
    // 👏
    let cheers = [];
    const logIds = (logs || []).map(l => l.id), viewIds = (views || []).map(v => v.id);
    try {
      const qs = [];
      if (logIds.length) qs.push(sbGet('online_cheers', 'target_type=eq.log&target_id=in.(' + logIds.join(',') + ')&select=from_student_id,target_type,target_id'));
      if (viewIds.length) qs.push(sbGet('online_cheers', 'target_type=eq.view&target_id=in.(' + viewIds.join(',') + ')&select=from_student_id,target_type,target_id'));
      (await Promise.all(qs)).forEach(r => { cheers = cheers.concat(r || []); });
    } catch (e) { cheers = null; }   // テーブル未作成 → 👏ボタンは出さない

    // 日別の学習分（メンバー×日）
    const perDay = {};
    ids.forEach(id => { perDay[id] = {}; days.forEach(k => perDay[id][k] = 0); });
    // 学習時間はダッシュボードと同じ定義（アプリ滞在は含めない）
    studyEntries(sessions, logs, allViews).forEach(e => { if (perDay[e.sid] && e.date in perDay[e.sid]) perDay[e.sid][e.date] += e.min; });

    const nameOf = {};
    // 本名は出さない（ニックネーム未設定のメンバーは「未設定のメンバー」）
    (studs || []).forEach(x => { nameOf[x.id] = x.nickname || '未設定のメンバー'; });
    const list = (studs || []).filter(x => x.is_active !== false).map(x => {
      const pd = perDay[x.id] || {};
      const since = x.studying_since ? new Date(x.studying_since).getTime() : 0;
      const studying = since && (Date.now() - since) < 5 * 3600000;
      return {
        id: x.id, me: x.id === myId, name: nameOf[x.id],
        points: Number(x.points || 0), streak: Number(x.login_streak || 0),
        last: x.last_active_date ? String(x.last_active_date).slice(0, 10) : '',
        day: pd, today: pd[today] || 0, week: days.reduce((t, k) => t + (pd[k] || 0), 0),
        studying: !!studying, studyingSince: since, studyingCat: x.studying_cat
      };
    });
    // タイムライン
    const tl = [];
    (logs || []).forEach(r => tl.push({ type:'log', id:r.id, sid:r.online_student_id, ts:r.done_at || r.created_at,
      cat: r.source === 'self' ? (r.category || 'self') : 'task', title: r.title, mins: r.study_minutes }));
    (views || []).forEach(v => tl.push({ type:'view', id:v.id, sid:v.online_student_id, ts:v.completed_at, cat:'lesson', title: lessonTitle[v.online_lesson_id] || '動画', mins: null }));
    tl.sort((a, b) => new Date(b.ts) - new Date(a.ts));
    teamState = { team, list, tl, cheers, nameOf, days, today, myId };
    renderTeam();
  } catch (e) {
    body.innerHTML = '<h2>👥 マイチーム</h2><p class="sub">読み込みに失敗しました。</p>';
  }
  // 1分半ごとに更新（画面が見えている時だけ）
  if (!teamRefreshTimer) teamRefreshTimer = setInterval(function () { if (!document.hidden && document.getElementById('team-card')) loadMyTeam(); }, 90000);
}

function renderTeam() {
  const st = teamState; const body = document.getElementById('team-body');
  if (!st || !body) return;
  const { team, list, tl, cheers, nameOf, days, today, myId } = st;
  const sorted = list.slice().sort((a, b) => (b.studying - a.studying) || (b.today - a.today) || (b.week - a.week) || (b.points - a.points));
  const totalPt = list.reduce((t, x) => t + x.points, 0);
  const totalToday = list.reduce((t, x) => t + x.today, 0);
  const totalWk = list.reduce((t, x) => t + x.week, 0);
  const maxWk = Math.max(1, ...list.map(x => x.week));
  const ranks = onlineRanksCache;
  const rankOf = pts => { if (!ranks) return null; let cur = ranks[0], idx = 0; ranks.forEach((r, i) => { if (pts >= r.min_points) { cur = r; idx = i; } }); return { r: cur, idx: idx }; };
  const lastTxt = d => {
    if (!d) return 'まだログインなし';
    const n = Math.round((new Date(today + 'T00:00:00+09:00') - new Date(d + 'T00:00:00+09:00')) / 86400000);
    return n <= 0 ? '今日ログイン' : n === 1 ? '昨日ログイン' : n + '日前にログイン';
  };
  const wd = ['日','月','火','水','木','金','土'];
  const nStudying = list.filter(x => x.studying).length;

  let html = '<h2 style="display:flex;align-items:center;gap:6px">👥 マイチーム <span style="font-size:13px;color:var(--orange-d)">' + esc(team.name) + '</span>'
    + '<button class="nick-link" style="margin-left:auto" onclick="loadMyTeam()">↻ 更新</button></h2>'
    + (nStudying ? '<div class="tm-live">🔥 いま <b>' + nStudying + '人</b> が勉強中</div>' : '')
    + '<div class="team-stats">'
    +   '<div class="team-stat"><div class="v">' + fmtMin(totalToday) + '</div><div class="l">今日のチーム</div></div>'
    +   '<div class="team-stat"><div class="v">' + fmtMin(totalWk) + '</div><div class="l">今週のチーム</div></div>'
    +   '<div class="team-stat"><div class="v">' + totalPt + '</div><div class="l">チーム合計pt</div></div>'
    + '</div>'
    + '<div style="font-size:11px;color:var(--muted);margin-bottom:4px">タップでその人の1週間が見られます</div>';

  html += sorted.map(x => {
    const rk = rankOf(x.points);
    const medal = rk ? medalHtml(rk.r.color || '#F0A030', rankLetter(rk.r, rk.idx), 30) : '';
    const live = x.studying ? '<span class="tm-studying">勉強中 ' + fmtMin(Math.floor((Date.now() - x.studyingSince) / 60000)) + '</span>' : '';
    let graph = '';
    if (teamOpenMember === x.id) {
      const mx = Math.max(1, ...days.map(k => x.day[k] || 0));
      graph = '<div class="tm-graph"><div class="dash-bars" style="height:70px">' + days.map(k => {
        const m = x.day[k] || 0; const dow = new Date(k + 'T00:00:00+09:00').getDay();
        return '<div class="dash-bcol' + (k === today ? ' today' : '') + '"><div class="b" style="height:' + Math.round(m / mx * 100) + '%" title="' + m + '分"></div><div class="d">' + wd[dow] + '</div></div>';
      }).join('') + '</div><div class="tm-graph-sub">1週間の合計 <b>' + fmtMin(x.week) + '</b> ・ 1日平均 ' + fmtMin(Math.round(x.week / 7)) + '</div></div>';
    }
    return '<div class="tm-row' + (x.me ? ' me' : '') + (teamOpenMember === x.id ? ' open' : '') + '" onclick="toggleTeamMember(' + x.id + ')">'
      + '<div class="tm-line">'
      +   medal
      +   '<div class="tm-main">'
      +     '<div class="tm-nm">' + esc(x.name) + (x.me ? '<span class="tm-me">あなた</span>' : '') + live + '</div>'
      +     '<div class="tm-sub">' + (rk ? esc(rk.r.name) + ' ・ ' : '') + x.points + 'pt ・ 🔥' + x.streak + ' ・ ' + lastTxt(x.last) + '</div>'
      +     '<div class="tm-bar"><i style="width:' + Math.round(x.week / maxWk * 100) + '%"></i></div>'
      +   '</div>'
      +   '<div class="tm-wk">' + fmtMin(x.today) + '<span>今日</span><em>今週 ' + fmtMin(x.week) + '</em></div>'
      + '</div>'
      + graph
      + '</div>';
  }).join('');

  // タイムライン
  html += '<div class="tl-h">📣 タイムライン <span>（直近7日）</span></div>';
  if (!tl.length) {
    html += '<div class="sub" style="margin:0">まだ記録がありません。最初の記録をつけてチームを盛り上げよう！</div>';
  } else {
    const cheerCount = {}, cheeredByMe = {};
    (cheers || []).forEach(c => { const k = c.target_type + ':' + c.target_id; cheerCount[k] = (cheerCount[k] || 0) + 1; if (c.from_student_id === myId) cheeredByMe[k] = true; });
    html += tl.slice(0, teamTlShow).map(it => {
      const k = it.type + ':' + it.id;
      const cnt = cheerCount[k] || 0, mine = it.sid === myId, done = !!cheeredByMe[k];
      const catLbl = it.cat === 'task' ? '📋 課題' : (TL_CAT[it.cat] || '✍️ 自習');
      const name = nameOf[it.sid] || '';
      const btn = (cheers === null) ? ''
        : mine ? (cnt ? '<span class="tl-cheer got">👏 ' + cnt + '</span>' : '')
        : '<button class="tl-cheer' + (done ? ' on' : '') + '" ' + (done ? 'disabled' : 'onclick="sendCheer(\'' + it.type + '\',' + it.id + ',' + it.sid + ',this)"') + '>👏' + (cnt ? ' ' + cnt : '') + '</button>';
      return '<div class="tl-item">'
        + '<div class="tl-av">' + esc((name || '?').slice(0, 1)) + '</div>'
        + '<div class="tl-main">'
        +   '<div class="tl-top"><b>' + esc(name) + '</b><span>' + relTime(it.ts) + '</span></div>'
        +   '<div class="tl-body">' + catLbl + (it.mins ? ' <b class="tl-min">' + fmtMin(it.mins) + '</b>' : ' 完了') + '</div>'
        +   ((it.title && !/^(DMMレッスン|DMM英会話|DMM単語|自習)(（タイマー）)?$/.test(it.title)) ? '<div class="tl-title">' + esc(it.title) + '</div>' : '')
        + '</div>'
        + btn
        + '</div>';
    }).join('');
    if (tl.length > teamTlShow) html += '<button class="tl-more" onclick="teamTlShow+=10;renderTeam()">もっと見る（残り' + (tl.length - teamTlShow) + '件）</button>';
  }

  const meRow = list.find(x => x.me);
  html += '<div style="margin-top:12px;font-size:12px;color:var(--muted)">チームでのあなたの表示名：<b style="color:var(--text)">' + esc(meRow ? meRow.name : '') + '</b>'
    + '<button class="nick-link" onclick="editNickname()">✏️ ニックネームを' + (currentOnlineStudent.nickname ? '変更' : '設定') + '</button></div>';
  body.innerHTML = html;
}
function toggleTeamMember(id) { teamOpenMember = (teamOpenMember === id) ? null : id; renderTeam(); }

async function sendCheer(type, targetId, toId, btn) {
  if (!currentOnlineStudent || toId === currentOnlineStudent.id) return;
  if (btn) { btn.disabled = true; btn.classList.add('on', 'pop'); }
  try {
    await sbPost('online_cheers', { from_student_id: currentOnlineStudent.id, to_student_id: toId, target_type: type, target_id: targetId }, 'return=minimal');
    if (teamState && teamState.cheers) teamState.cheers.push({ from_student_id: currentOnlineStudent.id, target_type: type, target_id: targetId });
    setTimeout(renderTeam, 350);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.classList.remove('on'); }
    showOnlineToast('送れませんでした');
  }
}

// ===== プラン・期・フォロー日程（受講者側）=====
let myCohort = null;   // { cohort, plan, events }
async function loadMyCohort() {
  myCohort = null;
  if (!currentOnlineStudent) return;
  try {
    const mem = await sbGet('online_cohort_members', 'online_student_id=eq.' + currentOnlineStudent.id + '&select=cohort_id');
    const ids = (mem || []).map(m => m.cohort_id);
    if (!ids.length) return;
    const cs = await sbGet('online_cohorts', 'id=in.(' + ids.join(',') + ')&is_active=not.is.false&select=*&order=start_date.desc');
    if (!cs || !cs.length) return;
    const today = getTodayJST();
    // 開講中 → 開始前 → 直近に終わった期 の順で選ぶ
    const cohort = cs.find(c => c.start_date <= today && today <= c.end_date)
      || cs.filter(c => c.start_date > today).sort((a, b) => a.start_date < b.start_date ? -1 : 1)[0]
      || cs[0];
    const [plans, events] = await Promise.all([
      sbGet('online_plans', 'id=eq.' + cohort.plan_id + '&select=id,name,months&limit=1'),
      sbGet('online_follow_events', 'cohort_id=eq.' + cohort.id + '&is_active=not.is.false&select=*&order=scheduled_date.asc,sort_order.asc')
    ]);
    // 個別フォローは人ごとの日時（スタッフが設定）を優先
    let pers = [];
    try { pers = await sbGet('online_follow_personal', 'online_student_id=eq.' + currentOnlineStudent.id + '&select=*'); } catch (e) { pers = []; }
    const pm = {}; (pers || []).forEach(r => { pm[r.event_id] = r; });
    const evs = (events || []).map(e => {
      if (e.kind === 'group') return Object.assign({}, e, { date: e.scheduled_date, fixed: !!e.start_time });
      const r = pm[e.id] || {};
      return Object.assign({}, e, { date: r.scheduled_date || e.scheduled_date, start_time: r.start_time || null, zoom_url: r.zoom_url || null, fixed: !!(r.scheduled_date && r.start_time) });
    }).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.start_time || '') < (b.start_time || '') ? -1 : 1));
    myCohort = { cohort: cohort, plan: (plans && plans[0]) || {}, events: evs };
  } catch (e) { myCohort = null; }   // テーブル未作成時は何も出さない
}
function renderFollowShell() {
  return '<div class="card" id="follow-card" style="display:none"><div id="follow-body"></div></div>';
}
function fmtMDW(ds) { const w = '日月火水木金土'[new Date(ds + 'T00:00:00+09:00').getDay()]; return Number(ds.slice(5, 7)) + '/' + Number(ds.slice(8, 10)) + '（' + w + '）'; }
function renderFollowCard() {
  const card = document.getElementById('follow-card'), body = document.getElementById('follow-body');
  if (!card || !body) return;
  if (!myCohort) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  const { cohort, plan, events } = myCohort;
  const today = getTodayJST();
  const next = events.find(e => e.date >= today);
  const total = Math.max(1, diffDays(cohort.start_date, cohort.end_date) + 1);
  const passed = Math.max(0, Math.min(total, diffDays(cohort.start_date, today) + 1));
  const pct = Math.round(passed / total * 100);
  const phase = today < cohort.start_date ? '開始まで あと' + diffDays(today, cohort.start_date) + '日'
    : today > cohort.end_date ? '修了しました 🎉' : (passed + '日目 / ' + total + '日');
  let html = '<h2>🗓 フォロー日程</h2>'
    + '<div class="fl-plan"><b>' + esc(plan.name || 'プログラム') + '</b><span>' + esc(cohort.name) + '　' + fmtMDW(cohort.start_date) + '〜' + fmtMDW(cohort.end_date) + '</span></div>'
    + '<div class="fl-prog"><i style="width:' + (today < cohort.start_date ? 0 : pct) + '%"></i></div>'
    + '<div class="fl-phase">' + phase + '</div>';
  if (next) {
    const d = diffDays(today, next.date);
    const grp = next.kind === 'group';
    const when = !next.fixed && !grp ? '目安' : (d === 0 ? '今日' : d === 1 ? '明日' : 'あと' + d + '日');
    let meta;
    if (next.fixed) meta = fmtMDW(next.date) + ' ' + esc(next.start_time) + '〜 ・ ' + next.minutes + '分 ・ ' + (grp ? '全体（Zoom）' : 'あなたの個別フォロー');
    else if (grp) meta = fmtMDW(next.date) + '（時間は後日お知らせ） ・ ' + next.minutes + '分 ・ 全体（Zoom）';
    else meta = fmtMDW(next.date) + 'ごろ ・ ' + next.minutes + '分 ・ 個別';
    html += '<div class="fl-next' + (d <= 1 && next.fixed ? ' soon' : '') + '">'
      + '<div class="fl-next-lbl">次のフォロー <span>' + when + '</span></div>'
      + '<div class="fl-next-ttl">' + esc(next.title) + '</div>'
      + '<div class="fl-next-meta">' + meta + '</div>'
      + (next.zoom_url
          ? '<a class="btn fl-btn" href="' + esc(next.zoom_url) + '" target="_blank" rel="noopener">🎥 Zoomに参加する</a>'
          : '<div class="fl-note">' + (grp || next.fixed ? 'Zoomのリンクは開催日までにここに表示されます。' : '日時は先生からお知らせします。決まるとここに表示されます。') + '</div>')
      + '</div>';
  }
  html += '<div class="fl-list">' + events.map(e => {
    const past = e.date < today, isNext = next && e.id === next.id;
    const grp = e.kind === 'group';
    return '<div class="fl-item' + (past ? ' past' : '') + (isNext ? ' now' : '') + '">'
      + '<span class="fl-dot">' + (past ? '✓' : '') + '</span>'
      + '<span class="fl-date">' + fmtMDW(e.date) + (e.fixed ? '<small>' + esc(e.start_time) + '</small>' : (!grp ? '<small>ごろ</small>' : '')) + '</span>'
      + '<span class="fl-ttl">' + esc(e.title) + '<small>' + e.minutes + '分 ・ ' + (grp ? '全体' : '個別' + (e.fixed ? '' : '（日時調整中）')) + '</small></span>'
      + '</div>';
  }).join('') + '</div>';
  body.innerHTML = html;
}

// ===== 連続ログイン（ストリーク）＋ ログインボーナス =====
async function updateOnlineStreak() {
  if (!currentOnlineStudent) return;
  const today = getTodayJST();
  let row;
  try {
    const rows = await sbGet('online_students',
      'id=eq.' + currentOnlineStudent.id + '&select=id,login_streak,last_active_date,points&limit=1');
    row = rows && rows[0];
  } catch (e) { return; }   // 列が未追加なら何もしない
  if (!row) return;
  const last = row.last_active_date || null;
  let streak = row.login_streak || 0;
  let points = row.points || 0;
  currentOnlineStudent.login_streak = streak;
  currentOnlineStudent.points = points;
  currentOnlineStudent.last_active_date = last;
  if (last === today) return;   // 今日はカウント済み
  let diff = null;
  if (last) {
    const a = new Date(last + 'T00:00:00+09:00');
    const b = new Date(today + 'T00:00:00+09:00');
    diff = Math.round((b - a) / 86400000);
  }
  streak = (diff === 1) ? streak + 1 : 1;
  const bonus = Math.min(streak, 3);
  const newPoints = points + bonus;
  try {
    await sbPatch('online_students', 'id=eq.' + currentOnlineStudent.id,
      { login_streak: streak, last_active_date: today, points: newPoints });
    await sbPost('online_point_logs', {
      online_student_id: currentOnlineStudent.id, points: bonus,
      reason: 'ログインボーナス（連続' + streak + '日）', type: 'login_bonus'
    });
    currentOnlineStudent.login_streak = streak;
    currentOnlineStudent.last_active_date = today;
    currentOnlineStudent.points = newPoints;
    showOnlineToast('🎁 ログインボーナス +' + bonus + 'pt（連続' + streak + '日）');
  } catch (e) { /* 列未追加時は無視 */ }
}

// 授業を初めて完了したときの視聴ボーナス（+5pt、1コマ1回）
async function awardLessonComplete() {
  if (viewAlreadyCompleted) return;   // 既に完了済み → 付与しない

// ===== 学習時間の定義（ダッシュボード・チームで共通）=====
// 返り値: [{ date:'YYYY-MM-DD', min:分, kind:'lesson'|'dmm_lesson'|'dmm_vocab'|'eitango'|'self'|'task'|'manual' }]
function studyEntries(sessions, assigns, views) {
  const out = [];
  (sessions || []).forEach(s => {
    if (s.source !== 'manual') return;   // アプリ滞在(auto)は数えない
    const k = s.session_date ? String(s.session_date).slice(0, 10) : jstDateStr(s.login_at);
    const m = Number(s.minutes || 0); if (k && m > 0) out.push({ date: k, min: m, kind: 'manual', sid: s.online_student_id });
  });
  (assigns || []).forEach(a => {
    const m = Number(a.study_minutes || 0); if (!m) return;
    if (a.source !== 'self' && a.status !== 'done') return;
    const k = jstDateStr(a.source === 'self' ? a.created_at : (a.done_at || a.created_at));
    const c = (a.category === 'dmm_lesson' || a.category === 'eitango') ? a.category : 'self';   // 旧 DMM単語/その他 は自習扱い
    if (k) out.push({ date: k, min: m, kind: a.source === 'self' ? c : 'task', sid: a.online_student_id });
  });
  (views || []).forEach(v => {
    const m = Math.round(Number(v.active_sec || 0) / 60); if (m <= 0) return;
    const k = jstDateStr(v.last_viewed_at || v.completed_at || v.first_viewed_at);
    if (k) out.push({ date: k, min: m, kind: 'lesson', sid: v.online_student_id });
  });
  return out;
}
function addDaysStr(k, n) { const d = new Date(k + 'T00:00:00+09:00'); d.setDate(d.getDate() + n); return jstDateStr(d.toISOString()); }
function diffDays(a, b) { return Math.round((new Date(b + 'T00:00:00+09:00') - new Date(a + 'T00:00:00+09:00')) / 86400000); }

let calEvents = {};    // 'YYYY-MM-DD' → [{ type, time, title, sub, url, tentative, minutes }]

  calEvents = {};

  if (myCohort && myCohort.events) {
    myCohort.events.forEach(e => {

      else add(e.date, { type: 'personal', time: e.fixed ? e.start_time : '', title: e.title, minutes: e.minutes, url: e.zoom_url || '', tentative: !e.fixed, note: e.note || '' });

const CAL_EV_META = {

// ===== ランク（Light）＋バッジ（メダルコレクション）=====
let onlineRanksCache = null;
let onlineBadgeMasterCache = null;

function hexToRgba(hex, a) {
  let h = String(hex || '#F0A030').replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const n = parseInt(h, 16);
  if (isNaN(n)) return 'rgba(240,160,48,' + a + ')';
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

async function loadOnlineRanks() {
  if (onlineRanksCache) return onlineRanksCache;
  try {
    const rows = await sbGet('online_ranks',
      'is_active=not.is.false&segment=is.null&select=rank_key,name,min_points,sort_order,color&order=min_points.asc');
    onlineRanksCache = (rows && rows.length) ? rows : null;
  } catch (e) { onlineRanksCache = null; }
  return onlineRanksCache;
}

async function computeOnlineRank(points) {
  const ranks = await loadOnlineRanks();
  if (!ranks) return null;
  let current = ranks[0], next = null, idx = 0;
  for (let i = 0; i < ranks.length; i++) {
    if (points >= ranks[i].min_points) { current = ranks[i]; idx = i; }
    else { next = ranks[i]; break; }
  }
  return { current: current, next: next, ranks: ranks, idx: idx };
}

// ランクの頭文字（楽天式 R/S/G/P/D）。未知キーは番号でフォールバック
function rankLetter(r, i) {
  const m = { regular:'R', silver:'S', gold:'G', platinum:'P', diamond:'D' };
  return (r && r.rank_key && m[r.rank_key]) ? m[r.rank_key] : String((i || 0) + 1);
}
// メダル（コイン＋リボン）
function medalHtml(color, label, size) {
  const s = size ? (';--ms:' + size + 'px') : '';
  return '<div class="medal" style="--mc:' + esc(color || '#F0A030') + s + '"><div class="coin">' + esc(label) + '</div></div>';
}

function renderRankCard(info, points) {
  if (!info || !info.current) return '';
  const c = info.current, n = info.next;
  const ranks = info.ranks || [c];
  const color = c.color || '#F0A030';
  const style = '--rk:' + esc(color) + ';--rkt:' + hexToRgba(color, .13);
  let sub, pct;
  if (n) {
    const span = Math.max(1, n.min_points - c.min_points);
    pct = Math.max(0, Math.min(100, Math.round((points - c.min_points) / span * 100)));
    sub = 'あと <b>' + (n.min_points - points) + 'pt</b> で ' + esc(n.name);
  } else { pct = 100; sub = '最高ランクに到達しました！🎉'; }

  // ヒーロー：現ランクのメダル＋名前＋pt＋次まで
  let html = '<div class="rank-card" style="' + style + '">'
    + '<div class="rank-top">'
    +   medalHtml(color, rankLetter(c, info.idx), 52)
    +   '<div><div class="rank-lbl">現在のランク</div><div class="rank-name">' + esc(c.name) + '</div></div>'
    +   '<div class="rank-pt">' + points + '<span>pt</span></div>'
    + '</div>'
    + '<div class="rank-bar"><div class="rank-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="rank-next">' + sub + '</div>'
    + '</div>';

  // ランク一覧（楽天式）：初期は現ランク周辺のみ、ボタンで全表示
  const rows = ranks.map(function (r, i) {
    const isCur = (i === info.idx);
    const rc = r.color || '#F0A030';
    const req = (r.min_points === 0) ? '登録で開始' : (r.min_points + 'pt〜');
    return '<div class="rank-row' + (isCur ? ' cur' : '') + '" data-i="' + i + '" style="--rr:' + esc(rc) + ';--rrt:' + hexToRgba(rc, .12) + '">'
      + medalHtml(rc, rankLetter(r, i), 32)
      + '<span class="rr-name">' + esc(r.name) + '</span>'
      + (isCur ? '<span class="rr-cur">現在</span>' : '')
      + '<span class="rr-req">' + req + '</span>'
      + '</div>';
  }).join('');
  html += '<div class="rank-ladder" id="rank-ladder" data-open="0">' + rows + '</div>'
    + '<button class="rank-toggle" id="rank-toggle" onclick="toggleRankLadder()">すべてのランクを見る ▾</button>';
  return html;
}

// 一覧の開閉（初期は現ランク±1のみ表示してコンパクトに）
function applyRankLadderView() {
  const lad = document.getElementById('rank-ladder');
  const btn = document.getElementById('rank-toggle');
  if (!lad) return;
  const open = lad.getAttribute('data-open') === '1';
  const rows = lad.querySelectorAll('.rank-row');
  let curIdx = 0;
  rows.forEach(function (r) { if (r.classList.contains('cur')) curIdx = parseInt(r.getAttribute('data-i'), 10); });
  rows.forEach(function (r) {
    const i = parseInt(r.getAttribute('data-i'), 10);
    const near = Math.abs(i - curIdx) <= 1;
    r.style.display = (open || near) ? 'flex' : 'none';
  });
  if (btn) btn.textContent = open ? '閉じる ▴' : 'すべてのランクを見る ▾';
}
function toggleRankLadder() {
  const lad = document.getElementById('rank-ladder');
  if (!lad) return;
  lad.setAttribute('data-open', lad.getAttribute('data-open') === '1' ? '0' : '1');
  applyRankLadderView();
}

function badgeMet(b, ctx) {
  const t = b.threshold || 0;
  switch (b.condition_type) {
    case 'videos_done':     return (ctx.videos_done || 0)     >= t;
    case 'streak':          return (ctx.streak || 0)          >= t;
    case 'reflections':     return (ctx.reflections || 0)     >= t;
    case 'meeting':         return (ctx.meeting || 0)         >= t;
    case 'course_complete': return (ctx.course_complete || 0) >= t;
    case 'points':          return (ctx.points || 0)          >= t;
    default:                return false;   // 'manual' は自動付与しない
  }
}

// 条件を満たしたバッジを付与し、コレクション表示用の状態を返す（テーブル未整備でもフェイルセーフ）
async function syncOnlineBadges(ctx) {
  if (!onlineBadgeMasterCache) {
    try {
      onlineBadgeMasterCache = await sbGet('online_badges',
        'is_active=not.is.false&select=badge_key,name,description,icon,color,condition_type,threshold,sort_order&order=sort_order.asc');
    } catch (e) { onlineBadgeMasterCache = null; }
  }
  const master = onlineBadgeMasterCache;
  if (!master || !master.length) return null;
  let earned = [];
  try {
    earned = await sbGet('online_student_badges',
      'online_student_id=eq.' + currentOnlineStudent.id + '&is_active=not.is.false&select=badge_key,awarded_at');
  } catch (e) { earned = []; }
  const earnedMap = {};
  (earned || []).forEach(e => { earnedMap[e.badge_key] = e.awarded_at; });
  const newly = [];
  for (let i = 0; i < master.length; i++) {
    const b = master[i];
    if (earnedMap[b.badge_key] || !badgeMet(b, ctx)) continue;
    try {
      await sbPost('online_student_badges', { online_student_id: currentOnlineStudent.id, badge_key: b.badge_key });
      earnedMap[b.badge_key] = new Date().toISOString();
      newly.push(b);
    } catch (e) { /* 一意制約=既得 / 列未整備 → 無視 */ }
  }
  return { master: master, earnedMap: earnedMap, newly: newly };
}

function renderBadgeCollection(state) {
  if (!state || !state.master || !state.master.length) return '';
  const items = state.master.map(b => {
    const at = state.earnedMap[b.badge_key];
    const got = !!at;
    const color = b.color || '#F0A030';
    const style = '--bc:' + esc(color) + ';--bcg:' + hexToRgba(color, .40) + ';--bct:' + hexToRgba(color, .12);
    let dateLine = '';
    if (got) {
      const d = new Date(at);
      const ds = isNaN(d) ? '' : new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
      dateLine = '<div class="badge-date">' + esc(ds || '獲得') + '</div>';
    }
    return '<div class="badge-item ' + (got ? 'got' : 'locked') + '" style="' + style + '" title="' + esc(b.description || '') + '">'
      + (got ? '<div class="badge-check">✓</div>' : '<div class="badge-lock">🔒</div>')
      + '<div class="badge-ic">' + esc(b.icon || '🏅') + '</div>'
      + '<div class="badge-nm">' + esc(b.name) + '</div>'
      + '<div class="badge-sub">' + esc(b.description || '') + '</div>'
      + dateLine
      + '</div>';
  }).join('');
  const gotN = state.master.filter(b => state.earnedMap[b.badge_key]).length;
  return '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">バッジコレクション <span style="color:var(--orange-d)">' + gotN + ' / ' + state.master.length + '</span></div>'
    + '<div class="badge-grid">' + items + '</div></div>';
}

async function loadMyPage() {
  const body = document.getElementById('mypage-body');

    .filter(en => { const c = en.online_courses || {}; return c.id && courseAccess(en, c).ok; })
    .map(en => en.online_courses);
  if (!accessible.length) {
    body.innerHTML = '<h2 style="margin-top:0">マイページ</h2>'
      + '<p class="sub">受講できる講座が登録されると、ここに進捗と「次にやること」が表示されます。</p>';
    return;
  }
  try {
    const ids = accessible.map(c => c.id).join(',');
    const [lessons, views] = await Promise.all([
      sbGet('online_lessons', 'online_course_id=in.(' + ids + ')&is_active=not.is.false&select=id,online_course_id,title,sort_order,available_from,available_until&order=sort_order.asc,id.asc'),
      sbGet('online_views', 'online_student_id=eq.' + currentOnlineStudent.id + '&select=online_lesson_id,completed,reflection,completed_at')
    ]);
    const doneSet = {};
    (views || []).forEach(v => { if (v.completed) doneSet[v.online_lesson_id] = true; });
    const byCourse = {};
    accessible.forEach(c => { byCourse[c.id] = { course: c, lessons: [], done: 0 }; });
    (lessons || []).forEach(l => {
      const g = byCourse[l.online_course_id];
      if (!g) return;
      g.lessons.push(l);
      if (doneSet[l.id]) g.done++;
    });
    let sumTotal = 0, sumDone = 0, next = null;
    const completedCourses = [];
    accessible.forEach(c => {
      const g = byCourse[c.id];
      const total = g.lessons.length;
      sumTotal += total; sumDone += g.done;
      if (total > 0 && g.done >= total) completedCourses.push(c);
      if (!next) {
        for (let i = 0; i < g.lessons.length; i++) {
          const l = g.lessons[i];
          if (!doneSet[l.id] && lessonWindow(l).ok) { next = { courseId: c.id, courseTitle: c.title, lesson: l }; break; }
        }
      }
    });
    const pct = sumTotal ? Math.round(sumDone / sumTotal * 100) : 0;
    const streak = (currentOnlineStudent && currentOnlineStudent.login_streak) || 0;
    const points = (currentOnlineStudent && currentOnlineStudent.points) || 0;
    // 感想の提出数
    const reflections = (views || []).filter(v => v.reflection && String(v.reflection).trim()).length;
    // 面談の実施済み回数
    let meetingDone = 0;
    try {
      const ms = await sbGet('online_meetings',
        'online_student_id=eq.' + currentOnlineStudent.id + '&status=eq.done&is_active=not.is.false&select=id');
      meetingDone = (ms || []).length;
    } catch (e) { meetingDone = 0; }
    // ランク（Light）＋バッジ（online_ranks / online_badges を使用。SQL未実行でもフェイルセーフ）
    const rankInfo = await computeOnlineRank(points);
    const badgeState = await syncOnlineBadges({
      videos_done: sumDone, streak: streak, reflections: reflections,
      meeting: meetingDone, course_complete: completedCourses.length, points: points
    });
    // 学習カレンダー用データ（ログイン日＋動画視聴日）
    calSessionDays = new Set(); calVideoDays = new Set();
    try {
      const sess = await sbGet('online_sessions', 'online_student_id=eq.' + currentOnlineStudent.id + '&is_active=not.is.false&select=session_date,login_at');
      (sess || []).forEach(function (r) { const k = r.session_date ? String(r.session_date).slice(0, 10) : jstDateStr(r.login_at); if (k) calSessionDays.add(k); });
    } catch (e) {}
    (views || []).forEach(function (v) { if (v.completed && v.completed_at) { const k = jstDateStr(v.completed_at); if (k) calVideoDays.add(k); } });
    await buildCalEvents();
    const nowJ = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit' }).format(new Date()).split('-');
    calY = parseInt(nowJ[0], 10); calM = parseInt(nowJ[1], 10) - 1;
    // 最近のポイント履歴
    let logs = [];
    try {
      logs = await sbGet('online_point_logs',
        'online_student_id=eq.' + currentOnlineStudent.id + '&order=created_at.desc&select=points,reason,created_at&limit=6');
    } catch (e) { logs = []; }

    let html = '<h2 style="margin-top:0">マイページ</h2>';
    html += renderRankCard(rankInfo, points);
    html += '<div class="mp-stats">'
      + '<div class="mp-stat"><div class="v">🔥 ' + streak + '</div><div class="l">連続ログイン</div></div>'
      + '<div class="mp-stat"><div class="v">⭐ ' + points + '</div><div class="l">ポイント</div></div>'
      + '</div>';
    html += '<div class="progress-card" style="margin-top:6px">'
      + '<div class="pc-row"><span class="pc-lbl">全体の進み具合</span>'
      + '<span class="pc-num"><b>' + sumDone + '</b> / ' + sumTotal + ' 回</span></div>'
      + '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
      + '<div class="pct" style="text-align:right;margin-top:6px">' + pct + '%</div>'
      + '</div>';
    if (next) {
      html += '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">次にやること</div>'
        + '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px">'
        +   '<div style="font-size:11px;color:var(--orange-d);font-weight:700">' + esc(next.courseTitle || '') + '</div>'
        +   '<div style="font-weight:700;font-size:15px;margin:3px 0 10px">' + esc(next.lesson.title || '(授業)') + '</div>'
        +   '<button class="btn" style="margin-top:0" onclick="goToLesson(' + next.courseId + ',' + next.lesson.id + ')">▶ 続きを見る</button>'
        + '</div></div>';
    } else if (sumTotal > 0) {
      html += '<div style="margin-top:16px;background:#E8F6EE;border:1px solid #A9DFBF;border-radius:var(--radius-sm);padding:14px;text-align:center;color:#1E6B3F;font-weight:700">🎉 いまの授業はすべて視聴済みです！</div>';
    }
    if (completedCourses.length) {
      html += '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">完了証</div>'
        + completedCourses.map(c =>
            '<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px">'
            + '<div style="font-size:22px">🎓</div>'
            + '<div style="font-weight:700;font-size:14px;flex:1">' + esc(c.title || '') + '</div>'
            + '<button class="btn" style="width:auto;margin:0;padding:8px 14px;font-size:13px" onclick="openCertificate(' + c.id + ')">完了証を見る</button>'
            + '</div>'
          ).join('')
        + '</div>';
    }
    html += renderBadgeCollection(badgeState);
    html += '<div id="study-cal" style="margin-top:16px"></div>';
    if (logs && logs.length) {
      html += '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">最近のポイント</div>'
        + logs.map(l =>
            '<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)">'
            + '<span>' + esc(l.reason || '') + '<span style="color:var(--muted);font-size:11px;margin-left:6px">' + esc(fmtJST(l.created_at)) + '</span></span>'
            + '<span style="font-weight:700;white-space:nowrap;color:' + ((l.points >= 0) ? '#1E6B3F' : '#943126') + '">' + (l.points >= 0 ? '+' : '') + l.points + 'pt</span>'
            + '</div>'
          ).join('')
        + '</div>';
    }
    body.innerHTML = html;
    renderStudyCal();
    applyRankLadderView();
    if (badgeState && badgeState.newly && badgeState.newly.length) {
      showOnlineToast('🏅 新しいバッジを獲得！ ' + badgeState.newly.map(b => (b.icon || '') + ' ' + b.name).join('、'));
    }
  } catch (e) {
    body.innerHTML = '<h2 style="margin-top:0">マイページ</h2><p class="sub">進捗の読み込みに失敗しました。</p>';
  }
}

    +   '<button onclick="closeCertificate()" class="btn ghost" style="width:auto;margin:0;padding:10px 18px">閉じる</button>'
    + '</div>'
    + '</div>';

}
function closeCertificate() { const o = document.getElementById('cert-overlay'); if (o) o.remove(); }

}

    // --- 学習時間（タイマー・記録・単語帳・動画の実再生・手動記録。アプリ滞在は含めない）---

let dashData = null;
let dashMode = 'week';       // 'week' | 'program'
let dashWeekSel = null;      // プログラム表示で開いている週（0始まり）
const KIND_DEFS = [
  { key:'lesson',     label:'講座（動画）', color:'#F5A623' },
  { key:'dmm_lesson', label:'DMM英会話',    color:'#5DA9E9' },
  { key:'eitango',    label:'fit単語帳',    color:'#1B8A93' },
  { key:'self',       label:'自習',         color:'#E3934A' },
  { key:'task',       label:'課題',         color:'#B07CD8' },
  { key:'manual',     label:'先生が記録',   color:'#9AA0A6' }
];
// 受講中の講座（受講権）の開始日〜期限日をプログラム期間とみなす
function getProgramRange(today) {
  if (myCohort && myCohort.cohort) {
    const c = myCohort.cohort;
    return { start: c.start_date, end: c.end_date, title: (myCohort.plan && myCohort.plan.name) || c.name, nWeeks: Math.max(1, Math.ceil((diffDays(c.start_date, c.end_date) + 1) / 7)), many: false };
  }
  const ens = (myEnrollments || []).filter(en => en.granted_at);
  if (!ens.length) return null;
  const withExp = ens.filter(en => en.expires_at);
  const base = withExp.length ? withExp : ens;
  let start = null, end = null, title = '';
  base.forEach(en => {
    const st = jstDateStr(en.granted_at);
    const ed = en.expires_at ? String(en.expires_at).slice(0, 10) : null;
    if (!start || st < start) { start = st; title = (en.online_courses && en.online_courses.title) || ''; }
    if (ed && (!end || ed > end)) end = ed;
  });
  if (!end) end = today;
  if (end < start) end = start;
  const nWeeks = Math.max(1, Math.ceil((diffDays(start, end) + 1) / 7));
  return { start: start, end: end, title: title, nWeeks: nWeeks, many: base.length > 1 };
}
function setDashMode(m) { dashMode = m; dashWeekSel = null; renderDashChart(); }
function selDashWeek(i) { dashWeekSel = (dashWeekSel === i) ? null : i; renderDashChart(); }
function fmtMD(k) { return Number(k.slice(5, 7)) + '/' + Number(k.slice(8, 10)); }
function dayBarsHtml(dayKeys, minByDate, today, height) {
  const wd = ['日','月','火','水','木','金','土'];
  const mx = Math.max(1, ...dayKeys.map(k => minByDate[k] || 0));
  return '<div class="dash-bars"' + (height ? ' style="height:' + height + 'px"' : '') + '>' + dayKeys.map(k => {
    const m = minByDate[k] || 0;
    const fut = k > today;
    return '<div class="dash-bcol' + (k === today ? ' today' : '') + (fut ? ' fut' : '') + '"><div class="v2">' + (m ? fmtMin(m) : '') + '</div><div class="b" style="height:' + Math.round(m / mx * 100) + '%" title="' + k + '：' + m + '分"></div><div class="d">' + wd[new Date(k + 'T00:00:00+09:00').getDay()] + '</div></div>';
  }).join('') + '</div>';
}
function renderDashChart() {
  const box = document.getElementById('dash-chart');
  if (!box || !dashData) return;
  const { entries, minByDate, today, days, program } = dashData;
  let html = '';
  if (program) {
    html += '<div class="dash-tabs"><button class="' + (dashMode === 'week' ? 'on' : '') + '" onclick="setDashMode(\'week\')">今週</button>'
      + '<button class="' + (dashMode === 'program' ? 'on' : '') + '" onclick="setDashMode(\'program\')">プログラム全体</button></div>';
  }
  if (dashMode !== 'program' || !program) {
    html += dayBarsHtml(days, minByDate, today);
    box.innerHTML = html; return;
  }
  // --- プログラム全体（週ごと）---
  const p = program;
  const weeks = [];
  for (let i = 0; i < p.nWeeks; i++) {
    const ws = addDaysStr(p.start, i * 7);
    const keys = []; for (let d = 0; d < 7; d++) keys.push(addDaysStr(ws, d));
    const inRange = keys.filter(k => k <= p.end);
    weeks.push({ i: i, start: ws, keys: inRange, min: inRange.reduce((t, k) => t + (minByDate[k] || 0), 0), fut: ws > today, cur: ws <= today && today <= keys[6] });
  }
  const passed = today < p.start ? 0 : Math.min(p.nWeeks, Math.floor(diffDays(p.start, today) / 7) + 1);
  const progMin = entries.filter(e => e.date >= p.start && e.date <= p.end).reduce((t, e) => t + e.min, 0);
  const studyDays = new Set(entries.filter(e => e.date >= p.start && e.date <= p.end && e.min > 0).map(e => e.date)).size;
  const avg = passed ? Math.round(progMin / passed) : 0;
  const mx = Math.max(1, ...weeks.map(w => w.min));
  html += '<div class="prog-head"><b>' + esc(p.title || 'プログラム') + (p.many ? ' ほか' : '') + '</b>'
    + '<span>' + fmtMD(p.start) + '〜' + fmtMD(p.end) + (passed ? ' ・ ' + passed + '週目 / ' + p.nWeeks + '週' : ' ・ 開始前') + '</span></div>'
    + '<div class="prog-stats"><div><b>' + fmtMin(progMin) + '</b><span>期間中の累計</span></div><div><b>' + fmtMin(avg) + '</b><span>1週平均</span></div><div><b>' + studyDays + '日</b><span>学習した日</span></div></div>'
    + '<div class="wk-bars">' + weeks.map(w =>
        '<button class="wk-col' + (w.cur ? ' cur' : '') + (w.fut ? ' fut' : '') + (dashWeekSel === w.i ? ' sel' : '') + '" onclick="selDashWeek(' + w.i + ')" title="' + fmtMD(w.start) + '〜：' + w.min + '分">'
        + '<i style="height:' + Math.round(w.min / mx * 100) + '%"></i><span>' + (w.i + 1) + '</span></button>'
      ).join('') + '</div>'
    + '<div class="wk-cap">週ごとの学習時間（棒をタップで詳細）</div>';
  if (dashWeekSel !== null && weeks[dashWeekSel]) {
    const w = weeks[dashWeekSel];
    const byKind = {};
    entries.filter(e => w.keys.indexOf(e.date) !== -1).forEach(e => { byKind[e.kind] = (byKind[e.kind] || 0) + e.min; });
    const kmx = Math.max(1, ...Object.values(byKind));
    html += '<div class="wk-detail"><div class="wk-dh">' + (w.i + 1) + '週目　' + fmtMD(w.keys[0]) + '〜' + fmtMD(w.keys[w.keys.length - 1]) + '　<b>' + fmtMin(w.min) + '</b></div>'
      + dayBarsHtml(w.keys, minByDate, today, 70)
      + (Object.keys(byKind).length ? KIND_DEFS.filter(d => byKind[d.key]).map(d =>
          '<div class="cat-row" style="--cc:' + d.color + '"><span class="cl">' + esc(d.label) + '</span><span class="ct"><span class="cf" style="width:' + Math.round(byKind[d.key] / kmx * 100) + '%"></span></span><span class="cn">' + fmtMin(byKind[d.key]) + '</span></div>').join('')
        : '<div class="sub" style="margin:6px 0 0">この週の記録はありません。</div>')
      + '</div>';
  }
  box.innerHTML = html;
}

// 分を「◯時間◯分」表記に
function fmtMin(min) {
  min = Math.max(0, Math.round(min||0));
  const h = Math.floor(min/60), m = min%60;
  return h > 0 ? (h + 'h' + (m ? m + 'm' : '')) : (m + 'm');
}

// ===== 自習タイマー（スタート→終了で自動記録）=====
// 計測中の状態は端末に保存（ページを閉じても続きから計測できる）。
const TIMER_CATS = [ { key:'self', label:'✍️ 自習' } ];   // タイマーは自習のみ
let timerPickCat = 'self';
let timerMem = null;          // localStorage が使えない時の保険
let timerTick = null;
function timerKey() { return 'fit_online_timer_' + (currentOnlineStudent ? currentOnlineStudent.id : ''); }
function getStudyTimer() {
  if (!currentOnlineStudent) return null;
  try { const raw = localStorage.getItem(timerKey()); if (raw) return JSON.parse(raw); } catch (e) {}
  return timerMem;
}
function setStudyTimer(v) {
  timerMem = v;
  try { if (v) localStorage.setItem(timerKey(), JSON.stringify(v)); else localStorage.removeItem(timerKey()); } catch (e) {}
}
function fmtClock(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
  return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(sec).padStart(2, '0');
}
function timerCatLabel(k) { const c = TIMER_CATS.find(x => x.key === k); return c ? c.label : '✍️ 自習'; }
function renderTimerInner() {
  const t = getStudyTimer();
  if (t) {
    return '<div class="st-box run">'
      + '<div class="st-run-top"><span class="st-dot"></span><span class="st-lbl">計測中 ・ ' + esc(timerCatLabel(t.cat)) + '</span></div>'
      + '<div class="st-clock" id="st-clock">' + fmtClock(Date.now() - t.start) + '</div>'
      + '<div class="st-btns"><button class="st-stop" onclick="stopStudyTimer()">■ 終了して記録</button>'
      + '<button class="st-cancel" onclick="cancelStudyTimer()">取り消し</button></div>'
      + '<div class="st-note">画面を閉じても計測は続きます。終わったらこの画面で「終了して記録」を押してください。</div>'
      + '</div>';
  }
  return '<div class="st-box">'
    + '<button class="st-start" onclick="startStudyTimer()">⏱ 自習スタート</button>'
    + '<div class="st-note">押すと計測が始まり、終了すると学習時間に自動で記録されます。</div>'
    + '</div>';
}
function refreshTimerUI() {
  const box = document.getElementById('st-timer');
  if (box) box.innerHTML = renderTimerInner();
  ensureTimerTick();
}
function ensureTimerTick() {
  const running = !!getStudyTimer();
  if (running && !timerTick) {
    timerTick = setInterval(function () {
      const t = getStudyTimer();
      const el = document.getElementById('st-clock');
      if (!t) { clearInterval(timerTick); timerTick = null; return; }
      if (el) el.textContent = fmtClock(Date.now() - t.start);
    }, 1000);
  } else if (!running && timerTick) { clearInterval(timerTick); timerTick = null; }
}
function pickTimerCat(k) { timerPickCat = k; refreshTimerUI(); }
// タイマー状態をDBにも保存（チームの「勉強中」表示・別端末での終了に使う）
function syncTimerToDb(t) {
  if (!currentOnlineStudent) return;
  sbPatch('online_students', 'id=eq.' + currentOnlineStudent.id,
    t ? { studying_since: new Date(t.start).toISOString(), studying_cat: t.cat } : { studying_since: null, studying_cat: null }
  ).catch(function () {});   // 列未追加でも動作は止めない
}
// ログイン時：DBの計測状態を端末に反映（PCで開始→スマホで終了 などに対応）
function restoreTimerFromDb() {
  const s = currentOnlineStudent; if (!s || !('studying_since' in s)) return;
  const local = getStudyTimer();
  if (s.studying_since) {
    const start = new Date(s.studying_since).getTime();
    if (!local || local.start !== start) setStudyTimer({ start: start, cat: s.studying_cat || 'self' });
  } else if (local) {
    setStudyTimer(null);   // 別の端末で終了済み
  }
}
function startStudyTimer() {
  if (getStudyTimer()) return;
  setStudyTimer({ start: Date.now(), cat: 'self' });
  syncTimerToDb(getStudyTimer());
  showOnlineToast('⏱ 計測スタート！がんばろう');
  refreshTimerUI();
  setTimeout(loadMyTeam, 800);
}
async function stopStudyTimer() {
  const t = getStudyTimer(); if (!t) return;
  let mins = Math.round((Date.now() - t.start) / 60000);
  if (mins < 1) {
    if (confirm('まだ1分たっていません。記録せずに終了しますか？')) { setStudyTimer(null); syncTimerToDb(null); refreshTimerUI(); }
    return;
  }
  if (mins > 300) {
    const r = prompt('計測が' + fmtMin(mins) + 'になっています（止め忘れかも）。\n実際に勉強した時間を分で入力してください（最大300分）', '60');
    if (r === null) return;
    mins = Math.max(1, Math.min(300, parseInt(String(r).replace(/[^0-9]/g, ''), 10) || 0));
    if (!mins) return;
  }
  const preset = '自習';
  const title = prompt('やったことを入力（任意・空欄でもOK）\n計測：' + fmtMin(mins), '');
  if (title === null) return;   // キャンセル → 計測は続行
  try {
    await postSelfLog({
      online_student_id: currentOnlineStudent.id,
      title: (title || '').trim() || (preset + '（タイマー）'),
      source: 'self', status: 'done', category: 'self',
      study_minutes: mins, done_at: new Date().toISOString()
    });
    setStudyTimer(null);
    syncTimerToDb(null);
    showOnlineToast('✓ ' + fmtMin(mins) + ' を記録しました。おつかれさま！');
    loadMyTeam();
    loadStudyLog();
  } catch (e) { console.error('[stopStudyTimer]', e); showOnlineToast('記録に失敗しました：' + (e.message || '').slice(0, 80)); }
}
function cancelStudyTimer() {
  if (!getStudyTimer()) return;
  if (!confirm('計測を取り消しますか？（記録されません）')) return;
  setStudyTimer(null);
  syncTimerToDb(null);
  refreshTimerUI();
}

// ワンタップ記録（DMMなど・プリセット時間で即記録）
// 自習ログの保存。列が足りない等で失敗したら、項目を減らして保存し直す
async function postSelfLog(body) {
  const tries = [
    body,
    Object.assign({}, body, { done_at: undefined }),
    { online_student_id: body.online_student_id, title: body.title, source: 'self', status: 'done', study_minutes: body.study_minutes },
    { online_student_id: body.online_student_id, title: body.title, source: 'self', study_minutes: body.study_minutes }
  ];
  let lastErr = null;
  for (const b of tries) {
    try { await sbPost('online_assignments', JSON.parse(JSON.stringify(b)), 'return=minimal'); return; }
    catch (e) { lastErr = e; console.warn('[postSelfLog]', e.message); }
  }
  throw lastErr;
}

async function quickLog(cat) {
  const p = CAT_PRESET[cat] || { title:'記録', min:0 };
  try {
    await postSelfLog({
      online_student_id: currentOnlineStudent.id,
      title: p.title, source: 'self', status: 'done',
      category: cat, study_minutes: p.min, done_at: new Date().toISOString()
    });
    showOnlineToast('✓ ' + p.title + ' を記録（' + p.min + '分）');
    loadStudyLog();
  } catch (e) { console.error('[quickLog]', e); showOnlineToast('記録に失敗しました：' + (e.message || '').slice(0, 80)); }
}

async function doneAssignment(id) {
  const note = prompt('やったこと・気づきがあれば入力してください（任意）', '');
  if (note === null) return;   // キャンセル
  const minRaw = prompt('かかった時間（分・任意）', '');
  const mins = minRaw ? Math.max(0, parseInt(String(minRaw).replace(/[^0-9]/g,''),10) || 0) : null;
  try {
    await sbPatch('online_assignments', 'id=eq.' + id, {
      status: 'done', done_at: new Date().toISOString(),
      student_note: (note || '').trim() || null, study_minutes: mins
    });
    showOnlineToast('✓ 課題を完了にしました');
    loadStudyLog();
  } catch (e) { showOnlineToast('保存に失敗しました'); }
}


function renderQBoxShell() {
  return '<div class="card" id="qbox-card">'
    + '<h2>質問箱</h2>'
    + '<p class="sub">授業でわからないところや相談を送れます。先生が回答するとここに表示されます。</p>'
    + '<textarea id="q-input" rows="3" style="width:100%;padding:13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;background:var(--bg);resize:vertical" placeholder="質問・相談を入力"></textarea>'
    + '<button class="btn" id="q-submit" onclick="submitQuestion()">質問を送る</button>'
    + '<div id="q-msg" class="err" style="display:none"></div>'
    + '<div id="q-list" style="margin-top:14px"></div>'
    + '</div>';
}

async function loadMyQuestions() {
  const box = document.getElementById('q-list');
  if (!box || !currentOnlineStudent) return;
  try {
    const rows = await sbGet('online_questions',
      'online_student_id=eq.' + currentOnlineStudent.id +
      '&is_active=not.is.false&select=*&order=created_at.desc');
    if (!rows.length) { box.innerHTML = ''; return; }
    box.innerHTML = '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">これまでの質問</div>'
      + rows.map(r => {
        const answered = r.status === 'answered' && r.answer;
        return '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px">'
          + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
          +   '<div style="font-size:11px;color:var(--muted)">' + esc(fmtJST(r.created_at)) + '</div>'
          +   (answered ? '<span class="chip ok">回答あり</span>' : '<span class="chip info">回答待ち</span>')
          + '</div>'
          + '<div style="font-size:14px;line-height:1.7;margin-top:6px;white-space:pre-wrap">' + esc(r.body || '') + '</div>'
          + (answered
              ? '<div style="margin-top:10px;border-top:1px dashed var(--border);padding-top:8px">'
                + '<div style="font-size:11px;color:var(--green-d);font-weight:700;margin-bottom:4px">先生からの回答</div>'
                + '<div style="font-size:14px;line-height:1.7;white-space:pre-wrap">' + esc(r.answer || '') + '</div>'
                + '</div>'
              : '')
          + '</div>';
      }).join('');
  } catch (e) { box.innerHTML = ''; }
}

async function submitQuestion() {
  const ta = document.getElementById('q-input');
  const btn = document.getElementById('q-submit');
  const msg = document.getElementById('q-msg');
  const text = ((ta && ta.value) || '').trim();
  if (msg) msg.style.display = 'none';
  if (!text) {
    if (msg) { msg.textContent = '質問を入力してください。'; msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.color = '#943126'; msg.style.display = 'block'; }
    return;
  }
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    await sbPost('online_questions', {
      online_student_id: currentOnlineStudent.id,
      body: text,
      status: 'open'
    });
    ta.value = '';
    msg.textContent = '質問を送信しました。回答をお待ちください。';
    msg.style.background = '#E8F6EE'; msg.style.borderColor = '#A9DFBF'; msg.style.color = '#1E6B3F'; msg.style.display = 'block';
    loadMyQuestions();
  } catch (e) {
    msg.textContent = '送信に失敗しました。時間をおいて試してください。';
    msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.color = '#943126'; msg.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '質問を送る';
  }
}

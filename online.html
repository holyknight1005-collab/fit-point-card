async function loadMeetings() {
  const slotBox = document.getElementById('mt-slot-list');
  const mineBox = document.getElementById('mt-mine');
  if (!currentOnlineStudent) return;
  try {
    const nowIso = new Date().toISOString();
    const [slots, mine] = await Promise.all([
      sbGet('online_meeting_slots',
        'status=eq.open&is_active=not.is.false&start_at=gte.' + encodeURIComponent(nowIso) + '&select=*&order=start_at.asc'),
      sbGet('online_meetings',
        'online_student_id=eq.' + currentOnlineStudent.id + '&is_active=not.is.false&select=*&order=scheduled_at.desc')
    ]);
    if (slotBox) {
      if (!slots.length) {
        slotBox.innerHTML = '<div class="empty" style="margin-top:0">いまは予約できる枠がありません。<br>枠が追加されるとここに表示されます。</div>';
      } else {
        slotBox.innerHTML = '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">空いている時間</div>'
          + slots.map(s => {
            return '<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;flex-wrap:wrap">'
              + '<div style="font-weight:700;font-size:14px">' + esc(fmtJST(s.start_at)) + '</div>'
              + '<div style="font-size:12px;color:var(--muted)">' + (s.duration_min || 30) + '分'
              +   (s.staff_name ? ' ／ ' + esc(s.staff_name) : '') + '</div>'
              + '<button onclick="bookSlot(' + s.id + ',\'' + s.start_at + '\')" style="margin-left:auto;padding:8px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--orange-d));color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit">予約する</button>'
              + '</div>';
          }).join('');
      }
    }
    if (mineBox) {
      const active = mine.filter(m => m.status !== 'cancelled');
      if (!active.length) { mineBox.innerHTML = ''; }
      else {
        mineBox.innerHTML = '<div style="font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 8px">あなたの面談</div>'
          + active.map(m => {
            const done = m.status === 'done';
            const upcoming = new Date(m.scheduled_at) >= new Date();
            const chip = done ? '<span class="chip ok">実施済</span>' : '<span class="chip info">予約済</span>';
            return '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px">'
              + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
              +   '<div style="font-weight:700;font-size:14px">' + esc(fmtJST(m.scheduled_at)) + '</div>' + chip
              + '</div>'
              + (m.student_topic ? '<div style="font-size:12px;color:var(--muted);margin-top:4px;white-space:pre-wrap">相談: ' + esc(m.student_topic) + '</div>' : '')
              + (done && m.record_content ? '<div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:8px"><div style="font-size:11px;color:var(--green-d);font-weight:700;margin-bottom:3px">面談の記録</div><div style="font-size:13px;line-height:1.7;white-space:pre-wrap">' + esc(m.record_content) + '</div></div>' : '')
              + (done && m.next_homework ? '<div style="margin-top:8px"><div style="font-size:11px;color:var(--orange-d);font-weight:700;margin-bottom:3px">次回までの課題</div><div style="font-size:13px;line-height:1.7;white-space:pre-wrap">' + esc(m.next_homework) + '</div></div>' : '')
              + (!done && upcoming ? '<button onclick="cancelMeetingStudent(' + m.id + ',' + (m.slot_id || 'null') + ')" style="margin-top:8px;padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">予約をキャンセル</button>' : '')
              + '</div>';
          }).join('');
      }
    }
  } catch (e) {
    if (slotBox) slotBox.innerHTML = '<div class="empty" style="margin-top:0">面談情報の読み込みに失敗しました。</div>';
  }
}

async function bookSlot(slotId, startAtIso) {
  const topicEl = document.getElementById('mt-topic');
  const msg = document.getElementById('mt-msg');
  const topic = ((topicEl && topicEl.value) || '').trim();
  if (msg) msg.style.display = 'none';
  try {
    // 楽観ロック：まだ open のときだけ booked に更新（同時予約対策）
    const upd = await sbPatch('online_meeting_slots', 'id=eq.' + slotId + '&status=eq.open', { status: 'booked' });
    if (!upd || !upd.length) {
      if (msg) { msg.textContent = 'この時間はちょうど埋まってしまいました。別の枠を選んでください。'; msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.color = '#943126'; msg.style.display = 'block'; }
      loadMeetings();
      return;
    }
    await sbPost('online_meetings', {
      online_student_id: currentOnlineStudent.id,
      slot_id: slotId,
      scheduled_at: startAtIso,
      status: 'confirmed',
      student_topic: topic || null
    });
    if (topicEl) topicEl.value = '';
    if (msg) { msg.textContent = '面談を予約しました。当日はオンラインでお待ちください。'; msg.style.background = '#E8F6EE'; msg.style.borderColor = '#A9DFBF'; msg.style.color = '#1E6B3F'; msg.style.display = 'block'; }
    loadMeetings();
  } catch (e) {
    try { await sbPatch('online_meeting_slots', 'id=eq.' + slotId, { status: 'open' }); } catch(_) {}
    if (msg) { msg.textContent = '予約に失敗しました。時間をおいて試してください。'; msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.color = '#943126'; msg.style.display = 'block'; }
  }
}

async function cancelMeetingStudent(meetingId, slotId) {
  if (!confirm('この予約をキャンセルしますか？')) return;
  try {
    await sbPatch('online_meetings', 'id=eq.' + meetingId, { status: 'cancelled' });
    if (slotId) await sbPatch('online_meeting_slots', 'id=eq.' + slotId, { status: 'open' });
    loadMeetings();
  } catch (e) {
    alert('キャンセルに失敗しました。時間をおいて試してください。');
  }
}

// --- 講座レベルの可否（受講権 AND 個別スイッチ AND 講座スイッチ AND 受講期限）---
function courseAccess(en, course) {
  const now = new Date();
  if (en.is_unlocked === false) return { ok:false, label:'停止中' };
  if (course.is_active === false) return { ok:false, label:'休止中' };
  if (course.is_streaming === false) return { ok:false, label:'配信停止中' };
  if (en.expires_at && new Date(en.expires_at) < now) return { ok:false, label:'受講期限切れ' };
  return { ok:true, label:'' };
}

// --- コマ単位の時間枠判定（開放時間だけ視聴できる）---
function lessonWindow(lesson) {
  const now = new Date();
  const from = lesson.available_from ? new Date(lesson.available_from) : null;
  const until = lesson.available_until ? new Date(lesson.available_until) : null;
  if (from && from > now)  return { ok:false, state:'before', label:fmtJST(from) + ' から視聴できます' };
  if (until && until < now) return { ok:false, state:'ended', label:'視聴期間が終了しました' };
  // from/until 未設定のコマは常時開放扱い
  return { ok:true, state:'open', label:'視聴できます' };
}

// ---- 講座を開く：コマ一覧を表示 ----
// ===== 映像講座ヒーロー（ページで一番目立つ場所）=====
// 「最近見た／次に見る」回を大きなサムネで表示し、その下に全授業のサムネを横スクロールで並べる
function ytThumb(ls, size) {
  const id = (ls && ls.source_type === 'youtube') ? extractYouTubeId(ls.source_id) : '';
  return id ? 'https://img.youtube.com/vi/' + id + '/' + (size || 'hqdefault') + '.jpg' : '';
}
async function fillCourseProgress(ids) {
  if (!ids.length || !currentOnlineStudent) return;
  let lessons = [], views = [];
  try {
    [lessons, views] = await Promise.all([
      sbGet('online_lessons', 'online_course_id=in.(' + ids.join(',') + ')&is_active=not.is.false&select=*&order=sort_order.asc,id.asc'),
      sbGet('online_views', 'online_student_id=eq.' + currentOnlineStudent.id + '&select=*')
    ]);
  } catch (e) { return; }   // 取れなくてもカード自体は使える
  const vmap = {}; (views || []).forEach(v => { vmap[v.online_lesson_id] = v; });
  ids.forEach(cid => {
    const el = document.getElementById('crs-prog-' + cid); if (!el) return;
    const ls = (lessons || []).filter(l => l.online_course_id === cid);
    if (!ls.length) { el.innerHTML = '<div class="hero-next">授業は準備中です。公開されるとここに表示されます。</div>'; return; }
    const isDone = l => !!(vmap[l.id] && vmap[l.id].completed);
    const n = ls.filter(isDone).length;
    const pct = Math.round(n / ls.length * 100);
    // 注目の回：途中まで見た回（最近見た順）→ まだ見ていない最初の回 → 最後に見た回
    const seenAt = l => { const v = vmap[l.id] || {}; return v.last_viewed_at || v.completed_at || v.first_viewed_at || ''; };
    const partial = ls.filter(l => !isDone(l) && vmap[l.id] && (vmap[l.id].progress_pct || 0) > 0 && lessonWindow(l).ok)
                      .sort((a, b) => seenAt(b) < seenAt(a) ? -1 : 1)[0];
    const nextNew = ls.find(l => !isDone(l) && lessonWindow(l).ok);
    const lastSeen = ls.filter(l => vmap[l.id]).sort((a, b) => seenAt(b) < seenAt(a) ? -1 : 1)[0];
    const feat = partial || nextNew || lastSeen || ls[0];
    const fv = vmap[feat.id] || {};
    const fDone = isDone(feat);
    const fPct = fDone ? 100 : Math.min(100, fv.progress_pct || 0);
    const fIdx = ls.indexOf(feat) + 1;
    const label = partial === feat ? '▶ 続きから再生（' + fPct + '%まで視聴）' : (nextNew === feat ? (n === 0 ? '▶ 第1回から始めよう' : '▶ 次の授業') : '✓ 最近見た授業');
    const th = ytThumb(feat, 'hqdefault');
    let html = '<div class="hero-main">'
      + '<button class="hero-thumb" onclick="goToLesson(' + cid + ',' + feat.id + ')"' + (th ? ' style="background-image:url(\'' + th + '\')"' : '') + '>'
      +   '<span class="hero-play">▶</span>'
      +   (feat.duration_sec ? '<span class="hero-dur">' + fmtDur(feat.duration_sec) + '</span>' : '')
      +   (fPct > 0 && !fDone ? '<span class="hero-tbar"><i style="width:' + fPct + '%"></i></span>' : '')
      + '</button>'
      + '<div class="hero-info">'
      +   '<div class="hero-feat-lbl">' + label + '</div>'
      +   '<div class="hero-feat-ttl">第' + fIdx + '回　' + esc(feat.title || '') + '</div>'
      +   '<div class="hero-count"><b>' + n + '</b> / ' + ls.length + '本 視聴済み<span>' + pct + '%</span></div>'
      +   '<div class="hero-bar"><i style="width:' + pct + '%"></i></div>'
      +   '<button class="hero-btn" onclick="goToLesson(' + cid + ',' + feat.id + ')">' + (partial === feat ? '▶ 続きを見る' : fDone ? '▶ もう一度見る' : '▶ 今すぐ見る') + '</button>'
      + '</div></div>';
    // 全授業のサムネ（横スクロール）
    html += '<div class="hero-strip-h">すべての授業 <button onclick="openCourse(' + cid + ')">一覧で見る ›</button></div>'
      + '<div class="hero-strip">' + ls.map((l, i) => {
        const v = vmap[l.id] || {}, done = isDone(l), w = lessonWindow(l);
        const p = done ? 100 : Math.min(100, v.progress_pct || 0);
        const t = ytThumb(l, 'mqdefault');
        return '<button class="hs-item' + (l.id === feat.id ? ' cur' : '') + (w.ok ? '' : ' lock') + '" ' + (w.ok ? 'onclick="goToLesson(' + cid + ',' + l.id + ')"' : 'disabled') + '>'
          + '<span class="hs-th"' + (t ? ' style="background-image:url(\'' + t + '\')"' : '') + '>'
          +   (done ? '<span class="hs-done">✓</span>' : '') + (!w.ok ? '<span class="hs-lock">🔒</span>' : '')
          +   (p > 0 && !done ? '<span class="hs-bar"><i style="width:' + p + '%"></i></span>' : '')
          + '</span>'
          + '<span class="hs-no">第' + (i + 1) + '回</span>'
          + '<span class="hs-ttl">' + esc(l.title || '') + '</span>'
          + '</button>';
      }).join('') + '</div>';
    el.innerHTML = html;
    const card = el.closest('.course'); const btn = card && card.querySelector('.hero-btn.fallback');
    if (btn) btn.style.display = 'none';
    // 現在の回が見えるようにスクロール
    const cur = el.querySelector('.hs-item.cur'); const strip = el.querySelector('.hero-strip');
    if (cur && strip) strip.scrollLeft = Math.max(0, cur.offsetLeft - 16);
  });
}

async function openCourse(courseId) {
  document.body.classList.remove('watching');
  const en = myEnrollments.find(e => (e.online_courses||{}).id === courseId);
  const c = en ? en.online_courses : null;
  if (!en || !c) return;
  currentCourse = c;
  currentEnrollment = en;

  const area = document.getElementById('course-area');
  area.innerHTML =
    '<div class="card">'
    + '<button class="btn ghost" style="width:auto;margin-top:0;padding:8px 14px;font-size:12px" onclick="loadMyCourses()">← 講座一覧へ</button>'
    + '<h2 style="margin-top:12px">' + esc(c.title || '') + '</h2>'
    + (c.description ? '<p class="sub">' + esc(c.description) + '</p>' : '')
    + '</div>'
    + '<div id="lesson-area"><div class="loading">読み込み中…</div></div>';

  const la = document.getElementById('lesson-area');
  try {
    const lessons = await sbGet('online_lessons',
      'online_course_id=eq.' + c.id + '&is_active=not.is.false&select=*&order=sort_order.asc,id.asc');
    if (!lessons.length) {
      la.innerHTML = '<div class="empty">この講座にはまだ授業が登録されていません。</div>';
      return;
    }
    // 視聴状況（進捗％・完了）を取得
    let viewMap = {};
    try {
      const ids = lessons.map(l => l.id).join(',');
      const views = await sbGet('online_views',
        'online_student_id=eq.' + currentOnlineStudent.id +
        '&online_lesson_id=in.(' + ids + ')&select=online_lesson_id,progress_pct,completed');
      views.forEach(v => { viewMap[v.online_lesson_id] = v; });
    } catch(e){ /* 進捗は付加情報なので失敗しても続行 */ }

    const total = lessons.length;
    const doneCount = lessons.filter(l => (viewMap[l.id]||{}).completed).length;
    const coursePct = total ? Math.round(doneCount / total * 100) : 0;

    const summary =
      '<div class="progress-card">'
      + '<div class="pc-row"><span class="pc-lbl">受講の進み具合</span>'
      + '<span class="pc-num"><b>' + doneCount + '</b> / ' + total + ' 回</span></div>'
      + '<div class="bar"><div class="bar-fill" style="width:' + coursePct + '%"></div></div>'
      + '</div>';

    const list = lessons.map((ls) => {
      const w = lessonWindow(ls);
      const v = viewMap[ls.id] || {};
      const done = !!v.completed;
      const pct = done ? 100 : Math.min(100, v.progress_pct || 0);
      const lvid = (ls.source_type === 'youtube') ? extractYouTubeId(ls.source_id) : '';
      const thumb = lvid ? 'https://img.youtube.com/vi/' + lvid + '/mqdefault.jpg' : '';
      const durTxt = ls.duration_sec ? fmtDur(ls.duration_sec) : '';

      const thumbHtml =
        '<div class="thumb' + (thumb ? '' : ' noimg') + '"'
        + (thumb ? ' style="background-image:url(\'' + thumb + '\')"' : '') + '>'
        + (thumb ? '' : '▶')
        + (durTxt ? '<span class="dur">' + durTxt + '</span>' : '')
        + (done ? '<span class="done">✓</span>' : '')
        + '</div>';

      const chips = [];
      if (ls.available_from || ls.available_until) {
        chips.push('<span class="chip info">' +
          esc(fmtJST(ls.available_from) || '—') + '〜' + esc(fmtJST(ls.available_until) || '') + '</span>');
      }
      if (!w.ok) chips.push('<span class="chip lock">' + esc(w.label) + '</span>');

      const progHtml = (!done && pct > 0)
        ? '<div class="bar sm"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
          + '<div class="pct">' + pct + '% まで視聴</div>'
        : '';

      const btnLabel = w.ok
        ? (done ? 'もう一度見る' : (pct > 0 ? '▶ 続きから' : '▶ 視聴する'))
        : (w.state === 'before' ? '公開前' : '公開終了');

      return '<div class="lesson' + (w.ok ? '' : ' is-locked') + '">'
        + thumbHtml
        + '<div class="lesson-body">'
        +   '<h3>' + esc(ls.title || '(授業)') + '</h3>'
        +   (chips.length ? '<div class="meta">' + chips.join('') + '</div>' : '')
        +   progHtml
        +   '<button class="btn sm" ' + (w.ok ? '' : 'disabled style="opacity:.5;cursor:not-allowed"')
        +     ' onclick="openLesson(' + ls.id + ')">' + btnLabel + '</button>'
        + '</div>'
      + '</div>';
    }).join('');

    la.innerHTML = summary + list;
  } catch (e) {
    la.innerHTML = '<div class="empty">授業一覧の読み込みに失敗しました。<br>時間をおいて開き直してください。</div>';
  }
}

// ---- コマを開く：動画プレーヤー + 感想提出 ----
async function openLesson(lessonId) {
  const area = document.getElementById('course-area');
  area.innerHTML = '<div class="loading">読み込み中…</div>';
  let ls;
  try {
    const rows = await sbGet('online_lessons', 'id=eq.' + lessonId + '&select=*&limit=1');
    ls = rows && rows[0];
  } catch(e){ ls = null; }
  if (!ls) { area.innerHTML = '<div class="empty">授業が見つかりませんでした。</div>'; return; }

  // 時間枠を再判定（一覧表示から時間が経っている可能性に備える）
  const w = lessonWindow(ls);
  if (!w.ok) {
    area.innerHTML =
      '<div class="card"><button class="btn ghost" style="width:auto;margin-top:0;padding:8px 14px;font-size:12px" onclick="openCourse(' + ls.online_course_id + ')">← 授業一覧へ</button>'

  }

  const vid = (ls.source_type === 'youtube') ? extractYouTubeId(ls.source_id) : '';
  const hasVideo = !!vid;
  reflectionUnlocked = !hasVideo;   // 動画がある回は視聴後に感想を出す。準備中/既提出は最初から
  const _wmId = (currentOnlineStudent && currentOnlineStudent.id);
  const wmName = _wmId ? esc('No.' + String(_wmId).padStart(4,'0')) : '';
  const player = hasVideo
    ? '<div class="player-wrap"><div id="yt-player"></div>'
      + '<div class="pw-catch" id="pw-catch" onclick="pvTogglePlay()"></div>'
      + (wmName ? '<div class="player-wm" id="player-wm">' + wmName + '</div>' : '')
      + '<div class="pv-bar" id="pv-bar">'
      +   '<button class="pv-btn" id="pv-play" onclick="pvTogglePlay()" aria-label="再生 / 一時停止">▶</button>'
      +   '<span class="pv-time" id="pv-cur">0:00</span>'

      +   '<button class="pv-btn" id="pv-wide" onclick="toggleWide()" aria-label="拡大">⤢</button>'
      +   '<button class="pv-btn" onclick="toggleFullscreen()" aria-label="全画面">⛶</button>'

  // 左：目標・要旨（overview 列。空なら非表示）
  const goalHtml = ls.overview
    ? '<div class="goal-box"><div class="lbl">この回の目標・要旨</div>'

      + '📄 レジュメをダウンロード</a>'

  const sideHtml =
    '<div class="goal-box">'
    + '<div class="lbl">教材</div>'
    + materialHtml

  // 感想フォーム（動画がある回は視聴後に出現。準備中/既提出は最初から表示）
  const reflectionCard =
    '<div class="card reflect-card' + (reflectionUnlocked ? '' : ' reveal-hidden') + '" id="reflection-card">'
    + (hasVideo ? '<div class="done-badge">✓ 視聴おつかれさまでした</div>' : '')
    + '<h2>感想の提出</h2>'
    + '<p class="sub">今日の授業でわかったこと・質問などを書いて提出してください。</p>'
    + '<textarea id="reflection" rows="5" style="width:100%;padding:13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;background:var(--bg);resize:vertical" placeholder="今日の授業でわかったこと・質問など"></textarea>'

    + '<div id="reflection-msg" class="err" style="background:#E8F6EE;border-color:#A9DFBF;color:#1E6B3F;display:none"></div>'
    + '</div>';

  // 視聴前の待ち案内（動画がある回のみ）
  const waitHtml = reflectionUnlocked ? '' :
    '<div class="watch-note" id="reflection-wait">動画を最後まで視聴すると、感想フォームが開きます。</div>';

  document.body.classList.remove('wide');
  document.body.classList.add('watching');
  area.innerHTML =
    '<div class="watch-head">'
    + '<button class="btn ghost" style="width:auto;margin:0 0 10px;padding:7px 13px;font-size:12px" onclick="leaveLesson(' + ls.online_course_id + ')">← 授業一覧へ</button>'

    + '<div class="watch-main">'
    +   '<div class="card" style="margin-top:0;padding:14px">' + player + waitHtml + '</div>'
    +   reflectionCard
    + '</div>'
    // 右カラム：教材（スマホはトグルで開閉、PCは常時表示）
    + '<div class="watch-side collapsed" id="watch-side">'
    +   '<button class="side-toggle" id="side-toggle" onclick="toggleSide()">'
    +     '<span>教材・資料</span><span class="chev">▾</span></button>'
    +   '<div id="side-body" style="margin-top:10px;display:none">' + sideHtml + '</div>'
    + '</div>'
    + '</div>';

  // 視聴レコードを用意 → プレーヤー起動（進捗記録）
  currentLesson = ls;
  await ensureView(ls.id);
  if (viewAlreadyCompleted) unlockReflection();   // 既に提出済みなら再視聴を求めず解除
  showReflectionReplyIfAny();                      // 既提出なら前回の感想を復元＋先生の返信を表示
  startWatermarkCycle();                            // 氏名＋ID透かしの巡回を開始
  if (vid) startPlayer(vid);
}

// 感想フォームの出現（動画を最後まで視聴 or 既提出で呼ばれる）
function unlockReflection() {
  reflectionUnlocked = true;
  const wait = document.getElementById('reflection-wait');
  const card = document.getElementById('reflection-card');
  if (wait) wait.remove();
  if (card && card.classList.contains('reveal-hidden')) {
    card.classList.remove('reveal-hidden');
    card.classList.add('reveal-in');
  }
}

// 既に感想提出済みなら、前回の感想を復元し、先生からの返信があれば表示する
function showReflectionReplyIfAny() {
  const card = document.getElementById('reflection-card');
  if (!card) return;
  if (viewAlreadyCompleted && viewPrevReflection) {
    const ta = document.getElementById('reflection');
    if (ta && !ta.value) ta.value = viewPrevReflection;
  }
  if (viewReply) {
    let box = document.getElementById('reflection-reply-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'reflection-reply-box';
      box.style.cssText = 'margin-top:12px;border-top:1px dashed var(--border);padding-top:10px';
      card.appendChild(box);
    }
    box.innerHTML =
      '<div style="font-size:12px;color:var(--green-d);font-weight:800;margin-bottom:5px">先生からの返信'
      + (viewReplyAt ? '<span style="color:var(--muted);font-weight:400;margin-left:6px">' + esc(fmtJST(viewReplyAt)) + '</span>' : '')
      + '</div>'
      + '<div style="font-size:14px;line-height:1.75;white-space:pre-wrap;background:#E8F6EE;border:1px solid #A9DFBF;border-radius:10px;padding:12px">'
      + esc(viewReply) + '</div>';
  }
}

// 通し番号の透かし：ふだんは透明で、ときどき一瞬だけランダムな位置に薄く表示する。
// 視聴中はほぼ気にならないが、録画にはランダムな位置・タイミングで写るので追跡に使える。
let wmTimeout = null;
function showWatermarkOnce() {
  const el = document.getElementById('player-wm');
  if (!el) return;
  el.style.top = (8 + Math.random() * 76) + '%';
  el.style.left = (5 + Math.random() * 58) + '%';
  el.classList.add('show');
  setTimeout(function(){ const e = document.getElementById('player-wm'); if (e) e.classList.remove('show'); }, 3500); // 約3.5秒だけ表示
  wmTimeout = setTimeout(showWatermarkOnce, 20000 + Math.random() * 20000); // 次は20〜40秒後
}
function startWatermarkCycle() {
  const el = document.getElementById('player-wm');
  if (!el) return;
  stopWatermarkCycle();
  wmTimeout = setTimeout(showWatermarkOnce, 5000); // 最初は5秒後に一瞬表示
}
function stopWatermarkCycle() {
  if (wmTimeout) { clearTimeout(wmTimeout); wmTimeout = null; }
  if (wmTimer) { clearInterval(wmTimer); wmTimer = null; }
}

// 動画の拡大（左は残して中央＝動画を右へ広げる。PC幅のみ効果）
function toggleWide() {
  const grid = document.getElementById('watch-grid');
  const btn  = document.getElementById('pv-wide');
  if (!grid) return;
  const wide = grid.classList.toggle('wide');
  document.body.classList.toggle('wide', wide);
  if (btn) btn.textContent = wide ? '⤡' : '⤢';
}

// 動画の全画面表示
function toggleFullscreen() {
  const el = document.querySelector('.player-wrap');
  if (!el) return;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (!fsEl) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitEnterFullscreen;
      if (req) req.call(el);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  } catch(e){}
}

// 右カラム（教材）の開閉。スマホではボタンで body を出し入れ、PCはCSSで常時表示。
function toggleSide() {
  const side = document.getElementById('watch-side');
  const body = document.getElementById('side-body');
  const btn  = document.getElementById('side-toggle');
  if (!side || !body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (btn) btn.classList.toggle('open', !open);
}

// 視聴レコードの用意（既存があれば流用、なければ作成）
async function ensureView(lessonId) {
  maxWatchedSec = 0;
  activeSec = 0; lastActiveTs = 0;
  viewPrevReflection = ''; viewReply = ''; viewReplyAt = '';
  lessonDurationSec = (currentLesson && currentLesson.duration_sec) ? currentLesson.duration_sec : 0;
  try {
    const rows = await sbGet('online_views',
      'online_student_id=eq.' + currentOnlineStudent.id +
      '&online_lesson_id=eq.' + lessonId +
      '&select=id,completed,watched_sec,active_sec,first_viewed_at,reflection,reflection_reply,reflection_replied_at&limit=1');
    if (rows && rows[0]) {
      currentViewId = rows[0].id;
      maxWatchedSec = rows[0].watched_sec || 0;   // 前回までの到達点を引き継ぐ
      activeSec = rows[0].active_sec || 0;         // 前回までの実視聴時間を引き継ぐ
      viewHadFirst = !!rows[0].first_viewed_at;
      viewAlreadyCompleted = !!rows[0].completed;
      viewPrevReflection = rows[0].reflection || '';
      viewReply = rows[0].reflection_reply || '';
      viewReplyAt = rows[0].reflection_replied_at || '';
      return;
    }
    const created = await sbPost('online_views', {
      online_student_id: currentOnlineStudent.id,
      online_lesson_id: lessonId,
      completed: false
    });
    currentViewId = created && created[0] ? created[0].id : null;
    viewHadFirst = false;
    viewAlreadyCompleted = false;
  } catch(e){ currentViewId = null; }
}

// ---- 自作の動画コントロール（YT IFrame API 操作）----
function pvTogglePlay() {
  if (!ytPlayer) return;
  let st = -1;
  try { st = ytPlayer.getPlayerState(); } catch(e){}
  try { if (st === YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); else ytPlayer.playVideo(); } catch(e){}
}
function pvToggleMute() {
  if (!ytPlayer) return;
  const btn = document.getElementById('pv-mute'), vol = document.getElementById('pv-vol');
  try {
    if (ytPlayer.isMuted()) {
      ytPlayer.unMute();
      if (vol && +vol.value === 0) { vol.value = '50'; ytPlayer.setVolume(50); }
      if (btn) btn.textContent = '🔊';
    } else {
      ytPlayer.mute();
      if (btn) btn.textContent = '🔇';
    }
  } catch(e){}
}
function pvVolInput() {
  if (!ytPlayer) return;
  const vol = document.getElementById('pv-vol'), btn = document.getElementById('pv-mute');
  const v = +vol.value;
  try {
    ytPlayer.setVolume(v);
    if (v === 0) { ytPlayer.mute(); if (btn) btn.textContent = '🔇'; }
    else { ytPlayer.unMute(); if (btn) btn.textContent = '🔊'; }
  } catch(e){}
}
function pvSeekInput() {
  pvScrubbing = true;
  if (!ytPlayer) return;
  let dur = 0; try { dur = ytPlayer.getDuration() || 0; } catch(e){}
  const seek = document.getElementById('pv-seek'), curEl = document.getElementById('pv-cur');
  if (curEl && dur) curEl.textContent = fmtDur((+seek.value) / 1000 * dur);
}
function pvSeekCommit() {
  if (!ytPlayer) { pvScrubbing = false; return; }
  let dur = 0; try { dur = ytPlayer.getDuration() || 0; } catch(e){}
  const seek = document.getElementById('pv-seek');
  try { ytPlayer.seekTo((+seek.value) / 1000 * dur, true); } catch(e){}
  pvScrubbing = false;
}
function pvTick() {
  if (!ytPlayer) return;
  let dur = 0, cur = 0, st = -1;
  try { dur = ytPlayer.getDuration() || 0; cur = ytPlayer.getCurrentTime() || 0; st = ytPlayer.getPlayerState(); } catch(e){ return; }
  // 実視聴時間の積算：再生中のみカウント。1tickの加算上限を2秒にして
  // バックグラウンド放置（タイマー間引き）や早送りでの水増しを防ぐ。
  const now = Date.now();
  const playing = (st === YT.PlayerState.PLAYING) && !pvScrubbing;
  if (playing) {
    if (lastActiveTs) activeSec += Math.min((now - lastActiveTs) / 1000, 2);
    lastActiveTs = now;
  } else {
    lastActiveTs = 0;
  }
  // 実視聴が規定割合（85%）に達したら感想を解除。シーク／早送りでは到達しない。
  if (dur > 0) { if (activeSec >= dur * 0.85) unlockReflection(); }
  else if (cur > 30) { unlockReflection(); }   // 尺不明時のフォールバック
  // 表示更新
  const durEl = document.getElementById('pv-dur'), curEl = document.getElementById('pv-cur'), seek = document.getElementById('pv-seek');
  if (durEl && dur) durEl.textContent = fmtDur(dur);
  if (!pvScrubbing) {
    if (curEl) curEl.textContent = fmtDur(cur);
    if (seek && dur) seek.value = String(Math.round(cur / dur * 1000));
  }
}

// ---- YouTube IFrame API プレーヤー＋進捗記録 ----
function startPlayer(vid) {
  function create() {
    ytPlayer = new YT.Player('yt-player', {
      videoId: vid,
      playerVars: { rel:0, modestbranding:1, playsinline:1, controls:0, disablekb:1, fs:0, iv_load_policy:3, cc_load_policy:0 },
      events: { onReady: onPlayerReady, onStateChange: onPlayerState }
    });
  }
  if (window.YT && window.YT.Player) { create(); return; }
  // APIコールバックを登録
  window.onYouTubeIframeAPIReady = create;
  if (!ytApiLoading) {
    ytApiLoading = true;
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
}

function onPlayerReady() {
  // 自作コントロールのUI更新を開始＋初期値
  if (!uiTimer) uiTimer = setInterval(pvTick, 300);
  try { const vEl = document.getElementById('pv-vol'); if (vEl) vEl.value = String(Math.round(ytPlayer.getVolume())); } catch(e){}
  try { ytPlayer.setPlaybackRate(1); } catch(e){}
  pvTick();
  // 総尺を取得し、未登録なら online_lessons.duration_sec を補完
  try {
    const dur = Math.floor(ytPlayer.getDuration() || 0);
    if (dur > 0) {
      lessonDurationSec = dur;
      if (currentLesson && !currentLesson.duration_sec) {
        currentLesson.duration_sec = dur;
        sbPatch('online_lessons', 'id=eq.' + currentLesson.id, { duration_sec: dur }).catch(()=>{});
      }
    }
  } catch(e){}
  // 初回視聴時刻
  if (currentViewId && !viewHadFirst) {
    viewHadFirst = true;
    sbPatch('online_views', 'id=eq.' + currentViewId, { first_viewed_at: new Date().toISOString() }).catch(()=>{});
  }
}

function onPlayerState(ev) {
  const pb = document.getElementById('pv-play');
  if (pb) pb.textContent = (ev.data === YT.PlayerState.PLAYING) ? '⏸' : '▶';
  // 1=再生中：定期保存を開始 / それ以外：停止して1回保存
  if (ev.data === YT.PlayerState.PLAYING) {
    if (!progressTimer) progressTimer = setInterval(tickProgress, 15000); // 15秒ごと
  } else {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    tickProgress(); // 一時停止・終了・離脱直前に確定保存
  }
}

function tickProgress() {
  if (!ytPlayer || !currentViewId) return;
  let cur = 0;
  try { cur = Math.floor(ytPlayer.getCurrentTime() || 0); } catch(e){ return; }
  if (cur > maxWatchedSec) maxWatchedSec = cur;
  const pct = lessonDurationSec > 0
    ? Math.min(100, Math.round(maxWatchedSec / lessonDurationSec * 100)) : 0;
  sbPatch('online_views', 'id=eq.' + currentViewId, {
    watched_sec: maxWatchedSec,
    progress_pct: pct,
    active_sec: Math.round(activeSec),
    last_viewed_at: new Date().toISOString()
  }).catch(()=>{});
}

// ホームに戻る（視聴中ならプレーヤーを止めて視聴位置を保存してから）
function goHome() {
  if (ytPlayer || progressTimer || document.body.classList.contains('watching')) {
    document.body.classList.remove('watching','wide');
    stopWatermarkCycle();
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
    try { tickProgress(); } catch (e) {}
    try { if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy(); } catch (e) {}
    ytPlayer = null;
  }
  loadMyCourses();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 授業一覧へ戻る（プレーヤー破棄＋最終保存）
function leaveLesson(courseId) {
  document.body.classList.remove('watching','wide');
  stopWatermarkCycle();
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
  tickProgress();
  try { if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy(); } catch(e){}
  ytPlayer = null;
  openCourse(courseId);
}

// 感想提出 → completed=true + reflection 保存
async function submitReflection(lessonId) {
  const btn = document.getElementById('submit-reflection');
  const msg = document.getElementById('reflection-msg');
  const text = (document.getElementById('reflection').value || '').trim();
  msg.style.display = 'none';
  if (!text) {
    msg.textContent = '感想を入力してください。'; msg.style.color = '#943126';
    msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.display = 'block';
    return;
  }
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    const payload = { completed: true, reflection: text, completed_at: new Date().toISOString() };
    if (currentViewId) {
      await sbPatch('online_views', 'id=eq.' + currentViewId, payload);
    } else {
      // 念のため：レコードが無ければ作成
      await sbPost('online_views', Object.assign({
        online_student_id: currentOnlineStudent.id, online_lesson_id: lessonId
      }, payload));
    }
    msg.textContent = '感想を提出しました。お疲れさまでした！';
    msg.style.color = '#1E6B3F'; msg.style.background = '#E8F6EE'; msg.style.borderColor = '#A9DFBF';
    msg.style.display = 'block';
    btn.textContent = '提出済み';
    await awardLessonComplete();   // 初回完了なら +5pt
  } catch(e) {
    btn.disabled = false; btn.textContent = '感想を提出する';
    msg.textContent = '送信に失敗しました。時間をおいて試してください。';
    msg.style.color = '#943126'; msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA';
    msg.style.display = 'block';
  }
}

// タブを閉じる/バックグラウンド化する直前に進捗を確定保存（モバイル対策）
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') tickProgress();
});
window.addEventListener('pagehide', function(){ tickProgress(); });

// 起動時
tryAutoLogin();

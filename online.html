<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>fit オンライン講座</title>
<style>
  :root{
    --orange:#F0A030; --orange-d:#D9832A; --orange-l:#F7D9A8;
    --bg:#FBF6EE; --surface:#FFFFFF; --border:#EADFCB;
    --text:#3B342B; --muted:#9A8F7D; --green-d:#1E6B3F;
    --radius:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
  .brand{text-align:center;margin:18px 0 8px}
  .brand .logo{
    width:64px;height:64px;border-radius:20px;margin:0 auto 10px;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;
  }
  .brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.08em}
  .brand p{font-size:12px;color:var(--muted);margin:4px 0 0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px}
  .card h2{font-size:16px;margin:0 0 4px;font-weight:700}
  .card .sub{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.7}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
  input[type=text],input[type=password]{
    width:100%;padding:13px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;font-family:inherit;background:var(--bg);
  }
  input:focus{outline:none;border-color:var(--orange)}
  .btn{
    width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn:active{opacity:.85}
  .btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted);font-weight:700}
  .err{display:none;background:#FDECEA;border:1px solid #E6B0AA;color:#943126;border-radius:10px;padding:10px;font-size:13px;margin-top:12px;line-height:1.6}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .topbar .who{font-size:13px;color:var(--text);font-weight:700}
  .topbar .who span{color:var(--muted);font-weight:400;font-size:12px}
  .course{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
  .course h3{margin:0 0 4px;font-size:15px;font-weight:700}
  .course .desc{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 10px}
  .course .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .chip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px}
  .chip.ok{background:#E8F6EE;color:var(--green-d)}
  .chip.lock{background:#FDECEA;color:#943126}
  .chip.info{background:#EAF2FB;color:#1E4276}
  .empty{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;margin-top:12px}
  .loading{text-align:center;color:var(--muted);font-size:13px;padding:24px}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo">fit</div>
    <h1>オンライン講座</h1>
    <p>お渡ししたIDとパスワードでログインしてください</p>
  </div>

  <!-- ログイン画面 -->
  <div id="login-view" class="card">
    <h2>ログイン</h2>
    <p class="sub">受講登録の際にお渡ししたログインIDとパスワードを入力してください。</p>
    <label for="in-id">ログインID</label>
    <input id="in-id" type="text" autocomplete="username" placeholder="on-xxxx" autocapitalize="none" spellcheck="false">
    <label for="in-pw">パスワード</label>
    <input id="in-pw" type="password" autocomplete="current-password" placeholder="パスワード">
    <button class="btn" onclick="doLogin()">ログイン</button>
    <div id="login-err" class="err"></div>
  </div>

  <!-- 講座一覧画面 -->
  <div id="home-view" class="hidden">
    <div class="card">
      <div class="topbar">
        <div class="who" id="who"></div>
        <button class="btn ghost" style="width:auto;margin-top:0;padding:8px 14px;font-size:12px" onclick="doLogout()">ログアウト</button>
      </div>
    </div>
    <div id="course-area">
      <div class="loading">読み込み中…</div>
    </div>
  </div>

  <div class="foot">総合学習塾 fit</div>
</div>

<script>
const SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const LS_KEY = 'fit_online_student';

// ---- REST ヘルパー（app.html と同じ作法）----
async function sbGet(table, query) {
  const res = await fetch(SB_URL + '/rest/v1/' + table + '?' + query, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
  if (!res.ok) throw new Error('取得エラー(' + res.status + ')');
  return res.json();
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let currentOnlineStudent = null;

// ---- ログイン ----
async function doLogin() {
  const id = (document.getElementById('in-id').value || '').trim();
  const pw = (document.getElementById('in-pw').value || '').trim();
  const errBox = document.getElementById('login-err');
  errBox.style.display = 'none';
  if (!id || !pw) { errBox.textContent = 'IDとパスワードを入力してください'; errBox.style.display = 'block'; return; }
  try {
    const rows = await sbGet('online_students',
      'login_id=eq.' + encodeURIComponent(id) + '&select=*&limit=1');
    const stu = rows && rows[0];
    if (!stu || stu.password !== pw) {
      errBox.textContent = 'IDまたはパスワードが違います'; errBox.style.display = 'block'; return;
    }
    if (stu.is_active === false) {
      errBox.textContent = 'このアカウントは現在利用できません。塾までお問い合わせください。'; errBox.style.display = 'block'; return;
    }
    currentOnlineStudent = stu;
    localStorage.setItem(LS_KEY, JSON.stringify({ id: stu.id, login_id: stu.login_id }));
    showHome();
  } catch (e) {
    errBox.textContent = '通信エラーが発生しました。時間をおいて試してください。'; errBox.style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem(LS_KEY);
  currentOnlineStudent = null;
  document.getElementById('in-pw').value = '';
  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
}

// 自動ログイン（保存済みIDを検証しなおす）
async function tryAutoLogin() {
  const raw = localStorage.getItem(LS_KEY);
  if (!raw) return;
  try {
    const saved = JSON.parse(raw);
    const rows = await sbGet('online_students', 'id=eq.' + saved.id + '&select=*&limit=1');
    const stu = rows && rows[0];
    if (stu && stu.is_active !== false) { currentOnlineStudent = stu; showHome(); }
    else localStorage.removeItem(LS_KEY);
  } catch (e) { /* 失敗時はログイン画面のまま */ }
}

function showHome() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('home-view').classList.remove('hidden');
  document.getElementById('who').innerHTML =
    esc(currentOnlineStudent.name) + ' さん <span>（' + esc(currentOnlineStudent.login_id) + '）</span>';
  loadMyCourses();
}

// ---- 受講できる講座一覧（ガワ：受講権のある講座を出すところまで）----
async function loadMyCourses() {
  const area = document.getElementById('course-area');
  area.innerHTML = '<div class="loading">読み込み中…</div>';
  try {
    const enrolls = await sbGet('online_enrollments',
      'online_student_id=eq.' + currentOnlineStudent.id +
      '&select=*,online_courses(id,title,description,is_streaming,is_active)&order=granted_at.desc');
    if (!enrolls.length) {
      area.innerHTML = '<div class="empty">受講できる講座はまだありません。<br>入金確認後に塾が受講権を付与すると、ここに表示されます。</div>';
      return;
    }
    area.innerHTML = enrolls.map(en => {
      const c = en.online_courses || {};
      // 視聴可否のAND判定（ガワ版：実際の視聴導線は次回）
      const reasons = viewability(en, c);
      const canView = reasons.ok;
      const chips = [];
      chips.push('<span class="chip info">視聴 ' + (en.consumed_views||0) + '/' + (en.max_views||1) + '回</span>');
      if (en.expires_at) chips.push('<span class="chip info">期限 ' + String(en.expires_at).slice(0,10) + '</span>');
      chips.push(canView ? '<span class="chip ok">視聴できます</span>'
                         : '<span class="chip lock">' + esc(reasons.label) + '</span>');
      return '<div class="course">'
        + '<h3>' + esc(c.title || '(講座)') + '</h3>'
        + (c.description ? '<div class="desc">' + esc(c.description) + '</div>' : '')
        + '<div class="meta">' + chips.join('') + '</div>'
        + '<button class="btn" ' + (canView ? '' : 'disabled style="opacity:.5;cursor:not-allowed"')
        + ' onclick="openCourse(' + (c.id||0) + ')">'
        + (canView ? '▶ 受講する' : '視聴できません') + '</button>'
        + '</div>';
    }).join('');
  } catch (e) {
    area.innerHTML = '<div class="empty">読み込みに失敗しました。<br>時間をおいて開き直してください。</div>';
  }
}

// AND判定（スタッフ側で設計した6条件のうち、この画面で判断できる分）
// 受講権 AND 個別スイッチ AND 講座スイッチ AND 期限 AND 回数 AND 時間帯
function viewability(en, course) {
  const now = new Date();
  if (en.is_unlocked === false) return { ok:false, label:'停止中' };
  if (course.is_active === false) return { ok:false, label:'休止中' };
  if (course.is_streaming === false) return { ok:false, label:'配信停止中' };
  if (en.expires_at && new Date(en.expires_at) < now) return { ok:false, label:'期限切れ' };
  if ((en.consumed_views||0) >= (en.max_views||1)) return { ok:false, label:'視聴回数の上限' };
  if (en.available_from && new Date(en.available_from) > now) return { ok:false, label:'視聴開始前' };
  if (en.available_until && new Date(en.available_until) < now) return { ok:false, label:'視聴期間終了' };
  return { ok:true, label:'' };
}

// 受講画面へ（次回：動画プレーヤー＋感想提出＋consumed_views+1 を実装）
function openCourse(courseId) {
  alert('受講画面は準備中です。\n（次回：動画の視聴・感想の提出をここに実装します）');
}

// 起動時
tryAutoLogin();
</script>
</body>
</html>

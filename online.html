<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>fit オンライン講座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F0A030; --orange-d:#D9832A; --orange-l:#F7D9A8;
    --bg:#FBF6EE; --surface:#FFFFFF; --border:#EADFCB;
    --text:#3B342B; --muted:#9A8F7D; --green-d:#1E6B3F;
    --radius:16px; --radius-sm:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
  .brand{text-align:center;margin:18px 0 8px}
  .brand .logo{
    width:64px;height:64px;border-radius:20px;margin:0 auto 10px;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;
  }
  .brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.08em}
  .brand p{font-size:12px;color:var(--muted);margin:4px 0 0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px}
  .card h2{font-size:16px;margin:0 0 4px;font-weight:700}
  .card .sub{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.7}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
  input[type=text],input[type=password]{
    width:100%;padding:13px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;font-family:inherit;background:var(--bg);
  }
  input:focus{outline:none;border-color:var(--orange)}
  .btn{
    width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--orange),var(--orange-d));color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn:active{opacity:.85}
  .btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted);font-weight:700}
  .err{display:none;background:#FDECEA;border:1px solid #E6B0AA;color:#943126;border-radius:10px;padding:10px;font-size:13px;margin-top:12px;line-height:1.6}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .topbar .who{font-size:13px;color:var(--text);font-weight:700}
  .topbar .who span{color:var(--muted);font-weight:400;font-size:12px}
  .course{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px}
  .course h3{margin:0 0 4px;font-size:15px;font-weight:700}
  .course .desc{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 10px}
  .course .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .chip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px}
  .chip.ok{background:#E8F6EE;color:var(--green-d)}
  .chip.lock{background:#FDECEA;color:#943126}
  .chip.info{background:#EAF2FB;color:#1E4276}
  .empty{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;margin-top:12px}
  .loading{text-align:center;color:var(--muted);font-size:13px;padding:24px}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}
  .hidden{display:none}
  /* ===== 視聴画面レイアウト ===== */
  .watch-head{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:16px}
  .watch-head .crumb{font-size:11px;color:var(--muted);margin-bottom:2px}
  .watch-head h2{font-size:17px;margin:0;font-weight:800}
  .watch-grid{display:flex;flex-direction:column;gap:14px;margin-top:14px}
  .watch-main{min-width:0}
  .watch-side{min-width:0}
  .player-wrap{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
  .player-wrap #yt-player{position:absolute;inset:0;width:100%;height:100%}
  .player-wm{position:absolute;top:8%;left:6%;z-index:5;font-size:11px;font-weight:600;
    color:rgba(255,255,255,.32);text-shadow:0 1px 3px rgba(0,0,0,.55);
    pointer-events:none;letter-spacing:.04em;white-space:nowrap;max-width:60%;
    overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity 1.1s ease}
  .player-wm.show{opacity:1}
  @media (prefers-reduced-motion:reduce){ .player-wm{transition:none} }
  .goal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .goal-box .lbl{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700}
  .goal-box .goal-txt{font-size:14px;line-height:1.75;color:var(--text)}
  .goal-box .ov-txt{font-size:13px;line-height:1.75;color:var(--muted)}
  .goal-box .divider{height:1px;background:var(--border);margin:14px 0}
  .side-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 16px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer}
  .side-toggle .chev{transition:transform .2s;color:var(--muted)}
  .side-toggle.open .chev{transform:rotate(180deg)}
  .dl-btn{display:flex;align-items:center;gap:8px;width:100%;justify-content:flex-start;
    background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:13px 14px;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;text-decoration:none;margin-bottom:10px}
  .dl-btn:active{opacity:.85}
  /* 感想ロック（動画視聴前） */
  .btn.locked{opacity:.45;cursor:not-allowed}
  #reflection:disabled{opacity:.6;cursor:not-allowed}
  #reflection-hint.done{color:var(--accent, #C9822E)}
  @media (min-width:820px){
    body.watching .wrap{max-width:1080px}
    .watch-grid{display:grid;grid-template-columns:230px minmax(0,1fr) 250px;gap:16px;align-items:start}
    .side-toggle{display:none}
    #side-body{display:block !important}
  }
  @media (max-width:819px){
    .watch-left:empty{display:none}
  }
  /* ====== 追加：デザイン刷新 ====== */
  .brand h1{font-weight:900;letter-spacing:.04em}
  body.logged-in .brand p{display:none}
  .card h2{font-weight:800}

  /* 講座の進捗サマリー */
  .progress-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
  .pc-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .pc-lbl{font-size:12px;color:var(--muted);font-weight:700}
  .pc-num{font-size:15px;font-weight:900;color:var(--text)}
  .pc-num b{color:var(--orange-d)}

  /* 進捗バー */
  .bar{height:7px;background:var(--orange-l);border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-d));border-radius:999px;transition:width .4s ease}
  .bar.sm{height:6px;margin:9px 0 5px}

  /* ダッシュボード風の授業カード */
  .lesson{display:flex;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:12px}
  .lesson.is-locked{opacity:.72}
  .lesson .thumb{position:relative;flex:0 0 120px;aspect-ratio:16/9;border-radius:10px;
    background:#EEE7D8 center/cover no-repeat;overflow:hidden}
  .lesson .thumb.noimg{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
  .lesson .thumb .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.74);color:#fff;
    font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;letter-spacing:.02em}
  .lesson .thumb .done{position:absolute;left:5px;top:5px;width:21px;height:21px;border-radius:50%;
    background:var(--green-d);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .lesson-body{flex:1;min-width:0;display:flex;flex-direction:column}
  .lesson-body h3{margin:1px 0 6px;font-size:14px;font-weight:700;line-height:1.5}
  .lesson-body .pct{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .btn.sm{width:auto;align-self:flex-start;margin-top:8px;padding:9px 18px;font-size:13px;border-radius:10px}

  /* 視聴画面のツール（拡大・全画面） */
  .player-tools{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .tool-btn{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:6px 13px;
    font-size:12px;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit}
  .tool-btn:active{opacity:.85}
  .watch-note{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 2px}

  /* 動画の全画面（player-wrapを画面いっぱいに） */
  .player-wrap:fullscreen{padding-top:0;width:100vw;height:100vh;border-radius:0}
  .player-wrap:-webkit-full-screen{padding-top:0;width:100vw;height:100vh;border-radius:0}

  /* 自作の動画コントロール（YouTube操作面は隠す） */
  .pw-catch{position:absolute;inset:0;z-index:4;cursor:pointer}
  .pv-bar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0))}
  .pv-btn{background:none;border:none;color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:2px 4px;flex:none;font-family:inherit}
  .pv-btn:active{opacity:.7}
  .pv-time{color:#fff;font-size:11px;font-variant-numeric:tabular-nums;flex:none;min-width:32px;text-align:center}
  .pv-seek{flex:1;min-width:40px;height:4px;accent-color:var(--orange);cursor:pointer}
  .pv-vol{width:64px;flex:none;height:4px;accent-color:var(--orange);cursor:pointer}
  .pv-rate{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:6px;font-size:11px;padding:3px 4px;flex:none;font-family:inherit;cursor:pointer}
  .pv-rate option{color:#111}
  @media (max-width:520px){ .pv-vol{display:none} }

  /* 感想の出現アニメーション＋完了バッジ */
  .reveal-hidden{display:none}
  @keyframes revealIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .reveal-in{animation:revealIn .45s ease both}
  .done-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
    color:var(--green-d);background:#E8F6EE;border:1px solid #A9DFBF;border-radius:999px;padding:4px 12px;margin-bottom:12px}

  /* 視聴中も通常のクリーム背景（シアター表示は取りやめ） */

  /* 拡大モード（左は残して中央＝動画を右へ広げる） */
  @media (min-width:820px){
    body.watching.wide .wrap{max-width:1320px}
    .watch-grid.wide{grid-template-columns:230px minmax(0,1fr)}
    .watch-grid.wide .watch-side{grid-column:1 / -1}
  }
  @media (max-width:819px){
    .tool-wide{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .reveal-in{animation:none}
    .bar-fill{transition:none}
  }
  /* 完了証 */
  .cert-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .cert-sheet{background:#fff;color:#333;max-width:520px;width:100%;border-radius:14px;padding:34px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px double var(--orange)}
  .cert-emoji{font-size:44px;line-height:1}
  .cert-title{font-size:26px;font-weight:800;letter-spacing:.35em;margin:10px 0 20px;color:#222}
  .cert-name{font-size:20px;font-weight:700;margin-bottom:18px;border-bottom:1px solid #ddd;padding-bottom:14px}
  .cert-body{font-size:15px;line-height:2;margin-bottom:22px}
  .cert-date{font-size:13px;color:#666;margin-bottom:4px}
  .cert-issuer{font-size:14px;font-weight:700;color:#444;margin-bottom:22px}
  .cert-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  @media print{
    body.printing-cert *{visibility:hidden}
    body.printing-cert #cert-overlay,body.printing-cert #cert-overlay *{visibility:visible}
    body.printing-cert #cert-overlay{position:absolute;inset:0;background:#fff;padding:0}
    body.printing-cert .cert-sheet{box-shadow:none;border-color:#c8792e}
    body.printing-cert #cert-actions{display:none}
  }
  /* トースト */
  .o-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s,transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
  .o-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* マイページ ステータス（連続ログイン・ポイント）*/
  .mp-stats{display:flex;gap:10px;margin:6px 0 2px}
  .mp-stat{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 10px;text-align:center}
  .mp-stat .v{font-size:22px;font-weight:800;color:var(--orange-d);line-height:1.1}
  .mp-stat .l{font-size:11px;color:var(--muted);margin-top:3px}
  .mp-badge{display:inline-block;font-size:12px;font-weight:700;color:#8a5a00;background:#FFF3DC;border:1px solid #F0D08A;border-radius:999px;padding:4px 11px;margin:0 6px 6px 0}
  /* ランク章（Light テーマ）*/
  .rank-card{margin:6px 0 12px;padding:14px 16px;border-radius:var(--radius-sm);
    background:linear-gradient(var(--rkt),var(--rkt)),var(--surface);
    border:1px solid var(--rk);box-shadow:0 6px 20px var(--rkg)}
  .rank-top{display:flex;align-items:center;gap:12px}
  .rank-orb{width:34px;height:34px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 32% 30%,#fff 0%,var(--rk) 62%,var(--rk) 100%);
    box-shadow:0 0 14px 2px var(--rkg)}
  .rank-lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .rank-name{font-size:20px;font-weight:900;color:var(--text);line-height:1.1;letter-spacing:.02em}
  .rank-pt{margin-left:auto;font-size:20px;font-weight:900;color:var(--orange-d)}
  .rank-pt span{font-size:11px;font-weight:700;color:var(--muted);margin-left:2px}
  .rank-bar{height:8px;border-radius:999px;background:var(--rkt);overflow:hidden;margin:12px 0 6px}
  .rank-fill{height:100%;border-radius:999px;background:var(--rk);box-shadow:0 0 10px var(--rkg);transition:width .5s ease}
  .rank-next{font-size:12px;color:var(--muted)}
  .rank-next b{color:var(--orange-d)}
  /* バッジコレクション */
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
  .badge-item{border-radius:14px;padding:12px 8px 10px;text-align:center;border:1px solid var(--border);background:var(--bg)}
  .badge-item.got{border-color:var(--bc);background:linear-gradient(var(--bct),var(--bct)),var(--surface);box-shadow:0 4px 14px var(--bcg)}
  .badge-ic{width:42px;height:42px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:#fff;border:1px solid var(--border)}
  .badge-item.got .badge-ic{border-color:var(--bc);box-shadow:0 0 12px 1px var(--bcg)}
  .badge-item.locked{opacity:.6;filter:grayscale(.85)}
  .badge-item.locked .badge-ic{filter:grayscale(1);opacity:.7}
  .badge-nm{font-size:12px;font-weight:800;color:var(--text);line-height:1.2}
  .badge-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3;min-height:13px}
  /* ホーム 2カラム（タブレット・PC）左=ステータス / 右=コンテンツ */
  .home-grid{display:flex;flex-direction:column;gap:14px}
  .home-left,.home-right{display:flex;flex-direction:column;gap:14px;min-width:0}
  .home-grid .card{margin-top:0}
  @media (min-width:820px){
    body.logged-in:not(.watching) .wrap{max-width:1120px}
    .home-grid{display:grid;grid-template-columns:340px minmax(0,1fr);align-items:start;gap:20px}
  }
  /* 学習カレンダー */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .cal-wd{text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding:2px 0}
  .cal-cell{position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:3px;display:flex;align-items:flex-start;justify-content:flex-end}
  .cal-cell.empty{border:none;background:transparent}
  .cal-cell.login{background:linear-gradient(rgba(240,160,48,.16),rgba(240,160,48,.16)),var(--surface);border-color:var(--orange-l)}
  .cal-d{font-size:11px;color:var(--text);font-weight:600}
  .cal-vid{position:absolute;left:4px;bottom:2px;font-size:10px;color:var(--green-d);line-height:1}
  .cal-nav{border:1px solid var(--border);background:var(--bg);border-radius:6px;font-size:13px;line-height:1;padding:3px 9px;cursor:pointer;color:var(--text);font-family:inherit}
  .cal-legend{margin-top:8px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lg{display:inline-block;width:12px;height:12px;border-radius:3px}
  .lg-login{background:rgba(240,160,48,.35);border:1px solid var(--orange-l)}
  .lg-vid{color:var(--green-d);font-size:11px}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo">fit</div>
    <h1>オンライン講座</h1>
    <p>お渡ししたIDとパスワードでログインしてください</p>
  </div>

  <!-- ログイン画面 -->
  <div id="login-view" class="card">
    <h2>ログイン</h2>
    <p class="sub">受講登録の際にお渡ししたログインIDとパスワードを入力してください。</p>
    <label for="in-id">ログインID</label>
    <input id="in-id" type="text" autocomplete="username" placeholder="on-xxxx" autocapitalize="none" spellcheck="false">
    <label for="in-pw">パスワード</label>
    <input id="in-pw" type="password" autocomplete="current-password" placeholder="パスワード">
    <button class="btn" onclick="doLogin()">ログイン</button>
    <div id="login-err" class="err"></div>
  </div>

  <!-- 講座一覧画面 -->
  <div id="home-view" class="hidden">
    <div class="card">
      <div class="topbar">
        <div class="who" id="who"></div>
        <button class="btn ghost" style="width:auto;margin-top:0;padding:8px 14px;font-size:12px" onclick="doLogout()">ログアウト</button>
      </div>
    </div>
    <div id="course-area">
      <div class="loading">読み込み中…</div>
    </div>
  </div>

  <div class="foot">総合学習塾 fit</div>
</div>

<script>
const SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const LS_KEY = 'fit_online_student';

// ---- REST ヘルパー（app.html と同じ作法）----
async function sbGet(table, query) {
  const res = await fetch(SB_URL + '/rest/v1/' + table + '?' + query, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
  if (!res.ok) throw new Error('取得エラー(' + res.status + ')');
  return res.json();
}

async function sbPost(table, body, prefer) {
  const res = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: {
      apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      Prefer: prefer || 'return=representation'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('登録エラー(' + res.status + ')');
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function sbPatch(table, query, body) {
  const res = await fetch(SB_URL + '/rest/v1/' + table + '?' + query, {
    method: 'PATCH',
    headers: {
      apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      Prefer: 'return=representation'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('更新エラー(' + res.status + ')');
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// timestamptz を JST の「M/D HH:MM」で表示（UTCドリフト回避）
function fmtJST(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const p = new Intl.DateTimeFormat('ja-JP', {
    timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{});
  return p.month + '/' + p.day + ' ' + p.hour + ':' + p.minute;
}

// YouTube ID の抽出（生ID / URL / 短縮URL いずれでも）
function extractYouTubeId(v) {
  if (!v) return '';
  const s = String(v).trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}

// 秒 → m:ss
function fmtDur(sec){ sec=Math.max(0,Math.floor(sec||0)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
// JSTの今日を 'YYYY-MM-DD' で返す
function getTodayJST(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }

async function doLogin() {

  const pw = (document.getElementById('in-pw').value || '').trim();

  errBox.style.display = 'none';

  try {
    const rows = await sbGet('online_students',
      'login_id=eq.' + encodeURIComponent(id) + '&select=*&limit=1');
    const stu = rows && rows[0];
    if (!stu || stu.password !== pw) {
      errBox.textContent = 'IDまたはパスワードが違います'; errBox.style.display = 'block'; return;

    errBox.textContent = '通信エラーが発生しました。時間をおいて試してください。'; errBox.style.display = 'block';

// ===== 連続ログイン（ストリーク）＋ ログインボーナス =====
async function updateOnlineStreak() {
  if (!currentOnlineStudent) return;
  const today = getTodayJST();
  let row;
  try {
    const rows = await sbGet('online_students',
      'id=eq.' + currentOnlineStudent.id + '&select=id,login_streak,last_active_date,points&limit=1');
    row = rows && rows[0];
  } catch (e) { return; }   // 列が未追加なら何もしない
  if (!row) return;
  const last = row.last_active_date || null;
  let streak = row.login_streak || 0;
  let points = row.points || 0;
  currentOnlineStudent.login_streak = streak;
  currentOnlineStudent.points = points;
  currentOnlineStudent.last_active_date = last;
  if (last === today) return;   // 今日はカウント済み
  let diff = null;
  if (last) {
    const a = new Date(last + 'T00:00:00+09:00');
    const b = new Date(today + 'T00:00:00+09:00');
    diff = Math.round((b - a) / 86400000);
  }
  streak = (diff === 1) ? streak + 1 : 1;
  const bonus = Math.min(streak, 3);
  const newPoints = points + bonus;
  try {
    await sbPatch('online_students', 'id=eq.' + currentOnlineStudent.id,
      { login_streak: streak, last_active_date: today, points: newPoints });
    await sbPost('online_point_logs', {
      online_student_id: currentOnlineStudent.id, points: bonus,
      reason: 'ログインボーナス（連続' + streak + '日）', type: 'login_bonus'
    });
    currentOnlineStudent.login_streak = streak;
    currentOnlineStudent.last_active_date = today;
    currentOnlineStudent.points = newPoints;
    showOnlineToast('🎁 ログインボーナス +' + bonus + 'pt（連続' + streak + '日）');
  } catch (e) { /* 列未追加時は無視 */ }
}

async function startStudySession() {
  if (!currentOnlineStudent) return;
  const sid = currentOnlineStudent.id;
  try {
    // 閉じ忘れセッションを締める（最後のハートビート分で終了・上限300分）
    const open = await sbGet('online_sessions', 'online_student_id=eq.' + sid + '&logout_at=is.null&is_active=not.is.false&select=id,login_at,minutes');
    for (let i = 0; i < (open || []).length; i++) {
      const o = open[i];
      const mins = Math.min(300, Math.max(0, Number(o.minutes || 0)));
      const end = new Date(new Date(o.login_at).getTime() + mins * 60000).toISOString();
      try { await sbPatch('online_sessions', 'id=eq.' + o.id, { logout_at: end, minutes: mins }); } catch (e2) {}
    }
    await sbPost('online_sessions', { online_student_id: sid, source: 'auto' });
    studyStartMs = Date.now();
  } catch (e) { studyStartMs = 0; }
  if (studyHeartbeat) clearInterval(studyHeartbeat);
  studyHeartbeat = setInterval(studyHeartbeatTick, 120000);
}

function studyHeartbeatTick() {
  if (!currentOnlineStudent || !studyStartMs) return;
  const mins = Math.min(300, Math.round((Date.now() - studyStartMs) / 60000));
  sbPatch('online_sessions', 'online_student_id=eq.' + currentOnlineStudent.id + '&logout_at=is.null', { minutes: mins }).catch(function () {});
}

function endStudySession() {
  if (studyHeartbeat) { clearInterval(studyHeartbeat); studyHeartbeat = null; }
  const stu = currentOnlineStudent;
  if (!stu || !studyStartMs) { studyStartMs = 0; return; }
  const sid = stu.id;
  const mins = Math.min(300, Math.round((Date.now() - studyStartMs) / 60000));
  studyStartMs = 0;
  sbPatch('online_sessions', 'online_student_id=eq.' + sid + '&logout_at=is.null', { logout_at: new Date().toISOString(), minutes: mins }).catch(function () {});
}

let onlineRanksCache = null;
let onlineBadgeMasterCache = null;

function hexToRgba(hex, a) {
  let h = String(hex || '#F0A030').replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const n = parseInt(h, 16);
  if (isNaN(n)) return 'rgba(240,160,48,' + a + ')';
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

async function loadOnlineRanks() {
  if (onlineRanksCache) return onlineRanksCache;
  try {
    const rows = await sbGet('online_ranks',
      'is_active=not.is.false&segment=is.null&select=rank_key,name,min_points,sort_order,color&order=min_points.asc');
    onlineRanksCache = (rows && rows.length) ? rows : null;
  } catch (e) { onlineRanksCache = null; }
  return onlineRanksCache;
}

async function computeOnlineRank(points) {
  const ranks = await loadOnlineRanks();
  if (!ranks) return null;
  let current = ranks[0], next = null;
  for (let i = 0; i < ranks.length; i++) {
    if (points >= ranks[i].min_points) current = ranks[i];
    else { next = ranks[i]; break; }
  }
  return { current: current, next: next };
}

function renderRankCard(info, points) {
  if (!info || !info.current) return '';
  const c = info.current, n = info.next;
  const color = c.color || '#F0A030';
  const style = '--rk:' + esc(color) + ';--rkg:' + hexToRgba(color, .45) + ';--rkt:' + hexToRgba(color, .13);
  let sub, pct;
  if (n) {
    const span = Math.max(1, n.min_points - c.min_points);
    pct = Math.max(0, Math.min(100, Math.round((points - c.min_points) / span * 100)));
    sub = 'あと <b>' + (n.min_points - points) + 'pt</b> で ' + esc(n.name);
  } else { pct = 100; sub = '最高ランクに到達しました！🎉'; }
  return '<div class="rank-card" style="' + style + '">'
    + '<div class="rank-top">'
    +   '<div class="rank-orb"></div>'
    +   '<div><div class="rank-lbl">現在のランク</div><div class="rank-name">' + esc(c.name) + '</div></div>'
    +   '<div class="rank-pt">' + points + '<span>pt</span></div>'
    + '</div>'
    + '<div class="rank-bar"><div class="rank-fill" style="width:' + pct + '%"></div></div>'
    + '<div class="rank-next">' + sub + '</div>'
    + '</div>';
}

function badgeMet(b, ctx) {
  const t = b.threshold || 0;
  switch (b.condition_type) {
    case 'videos_done':     return (ctx.videos_done || 0)     >= t;
    case 'streak':          return (ctx.streak || 0)          >= t;
    case 'reflections':     return (ctx.reflections || 0)     >= t;
    case 'meeting':         return (ctx.meeting || 0)         >= t;
    case 'course_complete': return (ctx.course_complete || 0) >= t;
    case 'points':          return (ctx.points || 0)          >= t;
    default:                return false;   // 'manual' は自動付与しない
  }
}

// 条件を満たしたバッジを付与し、コレクション表示用の状態を返す（テーブル未整備でもフェイルセーフ）
async function syncOnlineBadges(ctx) {
  if (!onlineBadgeMasterCache) {
    try {
      onlineBadgeMasterCache = await sbGet('online_badges',
        'is_active=not.is.false&select=badge_key,name,description,icon,color,condition_type,threshold,sort_order&order=sort_order.asc');
    } catch (e) { onlineBadgeMasterCache = null; }
  }
  const master = onlineBadgeMasterCache;
  if (!master || !master.length) return null;
  let earned = [];
  try {
    earned = await sbGet('online_student_badges',
      'online_student_id=eq.' + currentOnlineStudent.id + '&is_active=not.is.false&select=badge_key,awarded_at');
  } catch (e) { earned = []; }
  const earnedMap = {};
  (earned || []).forEach(e => { earnedMap[e.badge_key] = e.awarded_at; });
  const newly = [];
  for (let i = 0; i < master.length; i++) {
    const b = master[i];
    if (earnedMap[b.badge_key] || !badgeMet(b, ctx)) continue;
    try {
      await sbPost('online_student_badges', { online_student_id: currentOnlineStudent.id, badge_key: b.badge_key });
      earnedMap[b.badge_key] = new Date().toISOString();
      newly.push(b);
    } catch (e) { /* 一意制約=既得 / 列未整備 → 無視 */ }
  }
  return { master: master, earnedMap: earnedMap, newly: newly };
}

function renderBadgeCollection(state) {
  if (!state || !state.master || !state.master.length) return '';
  const items = state.master.map(b => {
    const at = state.earnedMap[b.badge_key];
    const got = !!at;
    const color = b.color || '#F0A030';
    const style = '--bc:' + esc(color) + ';--bcg:' + hexToRgba(color, .40) + ';--bct:' + hexToRgba(color, .12);
    let sub;
    if (got) {
      const d = new Date(at);
      sub = isNaN(d) ? '獲得' : new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
    } else { sub = b.description || ''; }
    return '<div class="badge-item ' + (got ? 'got' : 'locked') + '" style="' + style + '" title="' + esc(b.description || '') + '">'
      + '<div class="badge-ic">' + esc(b.icon || '🏅') + '</div>'
      + '<div class="badge-nm">' + esc(b.name) + '</div>'
      + '<div class="badge-sub">' + esc(sub) + '</div>'
      + '</div>';
  }).join('');
  const gotN = state.master.filter(b => state.earnedMap[b.badge_key]).length;
  return '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">バッジコレクション <span style="color:var(--orange-d)">' + gotN + ' / ' + state.master.length + '</span></div>'
    + '<div class="badge-grid">' + items + '</div></div>';
}

  if (!accessible.length) {
    body.innerHTML = '<h2 style="margin-top:0">マイページ</h2>'
      + '<p class="sub">受講できる講座が登録されると、ここに進捗と「次にやること」が表示されます。</p>';
    return;
  }
  try {
    const ids = accessible.map(c => c.id).join(',');
    const [lessons, views] = await Promise.all([
      sbGet('online_lessons', 'online_course_id=in.(' + ids + ')&is_active=not.is.false&select=id,online_course_id,title,sort_order,available_from,available_until&order=sort_order.asc,id.asc'),
      sbGet('online_views', 'online_student_id=eq.' + currentOnlineStudent.id + '&select=online_lesson_id,completed,reflection,completed_at')
    ]);
    const doneSet = {};
    (views || []).forEach(v => { if (v.completed) doneSet[v.online_lesson_id] = true; });
    const byCourse = {};
    accessible.forEach(c => { byCourse[c.id] = { course: c, lessons: [], done: 0 }; });
    (lessons || []).forEach(l => {
      const g = byCourse[l.online_course_id];
      if (!g) return;
      g.lessons.push(l);
      if (doneSet[l.id]) g.done++;
    });
    let sumTotal = 0, sumDone = 0, next = null;
    const completedCourses = [];
    accessible.forEach(c => {
      const g = byCourse[c.id];
      const total = g.lessons.length;
      sumTotal += total; sumDone += g.done;
      if (total > 0 && g.done >= total) completedCourses.push(c);
      if (!next) {
        for (let i = 0; i < g.lessons.length; i++) {
          const l = g.lessons[i];
          if (!doneSet[l.id] && lessonWindow(l).ok) { next = { courseId: c.id, courseTitle: c.title, lesson: l }; break; }
        }
      }
    });
    const pct = sumTotal ? Math.round(sumDone / sumTotal * 100) : 0;
    const streak = (currentOnlineStudent && currentOnlineStudent.login_streak) || 0;
    const points = (currentOnlineStudent && currentOnlineStudent.points) || 0;
    // 感想の提出数
    const reflections = (views || []).filter(v => v.reflection && String(v.reflection).trim()).length;
    // 面談の実施済み回数
    let meetingDone = 0;
    try {
      const ms = await sbGet('online_meetings',
        'online_student_id=eq.' + currentOnlineStudent.id + '&status=eq.done&is_active=not.is.false&select=id');
      meetingDone = (ms || []).length;
    } catch (e) { meetingDone = 0; }
    // ランク（Light）＋バッジ（online_ranks / online_badges を使用。SQL未実行でもフェイルセーフ）
    const rankInfo = await computeOnlineRank(points);
    const badgeState = await syncOnlineBadges({
      videos_done: sumDone, streak: streak, reflections: reflections,
      meeting: meetingDone, course_complete: completedCourses.length, points: points
    });
    // 学習カレンダー用データ（ログイン日＋動画視聴日）
    calSessionDays = new Set(); calVideoDays = new Set();
    try {
      const sess = await sbGet('online_sessions', 'online_student_id=eq.' + currentOnlineStudent.id + '&is_active=not.is.false&select=session_date,login_at');
      (sess || []).forEach(function (r) { const k = r.session_date ? String(r.session_date).slice(0, 10) : jstDateStr(r.login_at); if (k) calSessionDays.add(k); });
    } catch (e) {}
    (views || []).forEach(function (v) { if (v.completed && v.completed_at) { const k = jstDateStr(v.completed_at); if (k) calVideoDays.add(k); } });
    const nowJ = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit' }).format(new Date()).split('-');
    calY = parseInt(nowJ[0], 10); calM = parseInt(nowJ[1], 10) - 1;
    // 最近のポイント履歴
    let logs = [];
    try {
      logs = await sbGet('online_point_logs',
        'online_student_id=eq.' + currentOnlineStudent.id + '&order=created_at.desc&select=points,reason,created_at&limit=6');
    } catch (e) { logs = []; }

    let html = '<h2 style="margin-top:0">マイページ</h2>';
    html += renderRankCard(rankInfo, points);
    html += '<div class="mp-stats">'
      + '<div class="mp-stat"><div class="v">🔥 ' + streak + '</div><div class="l">連続ログイン</div></div>'
      + '<div class="mp-stat"><div class="v">⭐ ' + points + '</div><div class="l">ポイント</div></div>'
      + '</div>';
    html += '<div class="progress-card" style="margin-top:6px">'
      + '<div class="pc-row"><span class="pc-lbl">全体の進み具合</span>'
      + '<span class="pc-num"><b>' + sumDone + '</b> / ' + sumTotal + ' 回</span></div>'
      + '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
      + '<div class="pct" style="text-align:right;margin-top:6px">' + pct + '%</div>'
      + '</div>';
    if (next) {
      html += '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">次にやること</div>'
        + '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px">'
        +   '<div style="font-size:11px;color:var(--orange-d);font-weight:700">' + esc(next.courseTitle || '') + '</div>'
        +   '<div style="font-weight:700;font-size:15px;margin:3px 0 10px">' + esc(next.lesson.title || '(授業)') + '</div>'
        +   '<button class="btn" style="margin-top:0" onclick="goToLesson(' + next.courseId + ',' + next.lesson.id + ')">▶ 続きを見る</button>'
        + '</div></div>';
    } else if (sumTotal > 0) {
      html += '<div style="margin-top:16px;background:#E8F6EE;border:1px solid #A9DFBF;border-radius:var(--radius-sm);padding:14px;text-align:center;color:#1E6B3F;font-weight:700">🎉 いまの授業はすべて視聴済みです！</div>';
    }
    if (completedCourses.length) {
      html += '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">完了証</div>'
        + completedCourses.map(c =>
            '<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px">'
            + '<div style="font-size:22px">🎓</div>'
            + '<div style="font-weight:700;font-size:14px;flex:1">' + esc(c.title || '') + '</div>'
            + '<button class="btn" style="width:auto;margin:0;padding:8px 14px;font-size:13px" onclick="openCertificate(' + c.id + ')">完了証を見る</button>'
            + '</div>'
          ).join('')
        + '</div>';
    }
    html += renderBadgeCollection(badgeState);
    html += '<div id="study-cal" style="margin-top:16px"></div>';
    if (logs && logs.length) {
      html += '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">最近のポイント</div>'
        + logs.map(l =>
            '<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)">'
            + '<span>' + esc(l.reason || '') + '<span style="color:var(--muted);font-size:11px;margin-left:6px">' + esc(fmtJST(l.created_at)) + '</span></span>'
            + '<span style="font-weight:700;white-space:nowrap;color:' + ((l.points >= 0) ? '#1E6B3F' : '#943126') + '">' + (l.points >= 0 ? '+' : '') + l.points + 'pt</span>'
            + '</div>'
          ).join('')
        + '</div>';
    }
    body.innerHTML = html;
    renderStudyCal();
    if (badgeState && badgeState.newly && badgeState.newly.length) {
      showOnlineToast('🏅 新しいバッジを獲得！ ' + badgeState.newly.map(b => (b.icon || '') + ' ' + b.name).join('、'));
    }
  } catch (e) {
    body.innerHTML = '<h2 style="margin-top:0">マイページ</h2><p class="sub">進捗の読み込みに失敗しました。</p>';
  }
}

// 完了証
function openCertificate(courseId) {
  const en = myEnrollments.find(e => (e.online_courses || {}).id === courseId);
  const title = en ? (en.online_courses.title || '') : '';
  const name = (currentOnlineStudent && currentOnlineStudent.name) || '';
  const t = new Date();
  const dstr = t.getFullYear() + '年' + (t.getMonth() + 1) + '月' + t.getDate() + '日';
  closeCertificate();
  const ov = document.createElement('div');
  ov.id = 'cert-overlay';
  ov.className = 'cert-overlay';
  ov.onclick = function (e) { if (e.target === ov) closeCertificate(); };
  ov.innerHTML =
    '<div class="cert-sheet">'
    + '<div class="cert-emoji">🎓</div>'
    + '<div class="cert-title">修了証</div>'
    + '<div class="cert-name">' + esc(name) + ' 殿</div>'
    + '<div class="cert-body">あなたは<br><b>「' + esc(title) + '」</b><br>の全課程を修了したことを証します。</div>'
    + '<div class="cert-date">発行日　' + dstr + '</div>'
    + '<div class="cert-issuer">総合学習塾fit　オンライン講座</div>'
    + '<div id="cert-actions" class="cert-actions">'
    +   '<button onclick="printCertificate()" class="btn" style="width:auto;margin:0;padding:10px 18px">印刷 / PDF保存</button>'
    +   '<button onclick="closeCertificate()" class="btn ghost" style="width:auto;margin:0;padding:10px 18px">閉じる</button>'
    + '</div>'
    + '</div>';
  document.body.appendChild(ov);
}
function closeCertificate() { const o = document.getElementById('cert-overlay'); if (o) o.remove(); }
function printCertificate() {
  document.body.classList.add('printing-cert');
  window.print();
  setTimeout(function () { document.body.classList.remove('printing-cert'); }, 400);
}

async function submitQuestion() {
  const ta = document.getElementById('q-input');
  const btn = document.getElementById('q-submit');
  const msg = document.getElementById('q-msg');
  const text = ((ta && ta.value) || '').trim();
  if (msg) msg.style.display = 'none';
  if (!text) {
    if (msg) { msg.textContent = '質問を入力してください。'; msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.color = '#943126'; msg.style.display = 'block'; }
    return;
  }
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    await sbPost('online_questions', {
      online_student_id: currentOnlineStudent.id,
      body: text,
      status: 'open'
    });
    ta.value = '';
    msg.textContent = '質問を送信しました。回答をお待ちください。';
    msg.style.background = '#E8F6EE'; msg.style.borderColor = '#A9DFBF'; msg.style.color = '#1E6B3F'; msg.style.display = 'block';
    loadMyQuestions();
  } catch (e) {
    msg.textContent = '送信に失敗しました。時間をおいて試してください。';
    msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.color = '#943126'; msg.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '質問を送る';
  }
}

async function loadMeetings() {
  const slotBox = document.getElementById('mt-slot-list');
  const mineBox = document.getElementById('mt-mine');
  if (!currentOnlineStudent) return;
  try {
    const nowIso = new Date().toISOString();
    const [slots, mine] = await Promise.all([
      sbGet('online_meeting_slots',
        'status=eq.open&is_active=not.is.false&start_at=gte.' + encodeURIComponent(nowIso) + '&select=*&order=start_at.asc'),
      sbGet('online_meetings',
        'online_student_id=eq.' + currentOnlineStudent.id + '&is_active=not.is.false&select=*&order=scheduled_at.desc')
    ]);
    if (slotBox) {
      if (!slots.length) {
        slotBox.innerHTML = '<div class="empty" style="margin-top:0">いまは予約できる枠がありません。<br>枠が追加されるとここに表示されます。</div>';
      } else {
        slotBox.innerHTML = '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">空いている時間</div>'
          + slots.map(s => {
            return '<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;flex-wrap:wrap">'
              + '<div style="font-weight:700;font-size:14px">' + esc(fmtJST(s.start_at)) + '</div>'
              + '<div style="font-size:12px;color:var(--muted)">' + (s.duration_min || 30) + '分'
              +   (s.staff_name ? ' ／ ' + esc(s.staff_name) : '') + '</div>'
              + '<button onclick="bookSlot(' + s.id + ',\'' + s.start_at + '\')" style="margin-left:auto;padding:8px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--orange-d));color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit">予約する</button>'
              + '</div>';
          }).join('');
      }
    }
    if (mineBox) {
      const active = mine.filter(m => m.status !== 'cancelled');
      if (!active.length) { mineBox.innerHTML = ''; }
      else {
        mineBox.innerHTML = '<div style="font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 8px">あなたの面談</div>'
          + active.map(m => {
            const done = m.status === 'done';
            const upcoming = new Date(m.scheduled_at) >= new Date();
            const chip = done ? '<span class="chip ok">実施済</span>' : '<span class="chip info">予約済</span>';
            return '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px">'
              + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
              +   '<div style="font-weight:700;font-size:14px">' + esc(fmtJST(m.scheduled_at)) + '</div>' + chip
              + '</div>'
              + (m.student_topic ? '<div style="font-size:12px;color:var(--muted);margin-top:4px;white-space:pre-wrap">相談: ' + esc(m.student_topic) + '</div>' : '')
              + (done && m.record_content ? '<div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:8px"><div style="font-size:11px;color:var(--green-d);font-weight:700;margin-bottom:3px">面談の記録</div><div style="font-size:13px;line-height:1.7;white-space:pre-wrap">' + esc(m.record_content) + '</div></div>' : '')
              + (done && m.next_homework ? '<div style="margin-top:8px"><div style="font-size:11px;color:var(--orange-d);font-weight:700;margin-bottom:3px">次回までの課題</div><div style="font-size:13px;line-height:1.7;white-space:pre-wrap">' + esc(m.next_homework) + '</div></div>' : '')
              + (!done && upcoming ? '<button onclick="cancelMeetingStudent(' + m.id + ',' + (m.slot_id || 'null') + ')" style="margin-top:8px;padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">予約をキャンセル</button>' : '')
              + '</div>';

    }
  } catch (e) {
    if (slotBox) slotBox.innerHTML = '<div class="empty" style="margin-top:0">面談情報の読み込みに失敗しました。</div>';
  }
}

async function bookSlot(slotId, startAtIso) {
  const topicEl = document.getElementById('mt-topic');
  const msg = document.getElementById('mt-msg');
  const topic = ((topicEl && topicEl.value) || '').trim();
  if (msg) msg.style.display = 'none';
  try {
    // 楽観ロック：まだ open のときだけ booked に更新（同時予約対策）
    const upd = await sbPatch('online_meeting_slots', 'id=eq.' + slotId + '&status=eq.open', { status: 'booked' });
    if (!upd || !upd.length) {
      if (msg) { msg.textContent = 'この時間はちょうど埋まってしまいました。別の枠を選んでください。'; msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.color = '#943126'; msg.style.display = 'block'; }
      loadMeetings();
      return;
    }
    await sbPost('online_meetings', {
      online_student_id: currentOnlineStudent.id,
      slot_id: slotId,
      scheduled_at: startAtIso,
      status: 'confirmed',
      student_topic: topic || null
    });
    if (topicEl) topicEl.value = '';
    if (msg) { msg.textContent = '面談を予約しました。当日はオンラインでお待ちください。'; msg.style.background = '#E8F6EE'; msg.style.borderColor = '#A9DFBF'; msg.style.color = '#1E6B3F'; msg.style.display = 'block'; }
    loadMeetings();
  } catch (e) {
    try { await sbPatch('online_meeting_slots', 'id=eq.' + slotId, { status: 'open' }); } catch(_) {}
    if (msg) { msg.textContent = '予約に失敗しました。時間をおいて試してください。'; msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.color = '#943126'; msg.style.display = 'block'; }
  }
}

async function cancelMeetingStudent(meetingId, slotId) {
  if (!confirm('この予約をキャンセルしますか？')) return;
  try {
    await sbPatch('online_meetings', 'id=eq.' + meetingId, { status: 'cancelled' });
    if (slotId) await sbPatch('online_meeting_slots', 'id=eq.' + slotId, { status: 'open' });
    loadMeetings();
  } catch (e) {
    alert('キャンセルに失敗しました。時間をおいて試してください。');
  }
}

// --- 講座レベルの可否（受講権 AND 個別スイッチ AND 講座スイッチ AND 受講期限）---
function courseAccess(en, course) {
  const now = new Date();
  if (en.is_unlocked === false) return { ok:false, label:'停止中' };
  if (course.is_active === false) return { ok:false, label:'休止中' };
  if (course.is_streaming === false) return { ok:false, label:'配信停止中' };
  if (en.expires_at && new Date(en.expires_at) < now) return { ok:false, label:'受講期限切れ' };
  return { ok:true, label:'' };
}

// --- コマ単位の時間枠判定（開放時間だけ視聴できる）---
function lessonWindow(lesson) {
  const now = new Date();
  const from = lesson.available_from ? new Date(lesson.available_from) : null;
  const until = lesson.available_until ? new Date(lesson.available_until) : null;
  if (from && from > now)  return { ok:false, state:'before', label:fmtJST(from) + ' から視聴できます' };
  if (until && until < now) return { ok:false, state:'ended', label:'視聴期間が終了しました' };
  // from/until 未設定のコマは常時開放扱い
  return { ok:true, state:'open', label:'視聴できます' };
}

  area.innerHTML =
    '<div class="card">'
    + '<button class="btn ghost" style="width:auto;margin-top:0;padding:8px 14px;font-size:12px" onclick="loadMyCourses()">← 講座一覧へ</button>'
    + '<h2 style="margin-top:12px">' + esc(c.title || '') + '</h2>'
    + (c.description ? '<p class="sub">' + esc(c.description) + '</p>' : '')
    + '</div>'
    + '<div id="lesson-area"><div class="loading">読み込み中…</div></div>';

  const la = document.getElementById('lesson-area');
  try {
    const lessons = await sbGet('online_lessons',
      'online_course_id=eq.' + c.id + '&is_active=not.is.false&select=*&order=sort_order.asc,id.asc');
    if (!lessons.length) {
      la.innerHTML = '<div class="empty">この講座にはまだ授業が登録されていません。</div>';
      return;
    }
    // 視聴状況（進捗％・完了）を取得
    let viewMap = {};
    try {
      const ids = lessons.map(l => l.id).join(',');
      const views = await sbGet('online_views',
        'online_student_id=eq.' + currentOnlineStudent.id +
        '&online_lesson_id=in.(' + ids + ')&select=online_lesson_id,progress_pct,completed');
      views.forEach(v => { viewMap[v.online_lesson_id] = v; });
    } catch(e){ /* 進捗は付加情報なので失敗しても続行 */ }

    const total = lessons.length;
    const doneCount = lessons.filter(l => (viewMap[l.id]||{}).completed).length;
    const coursePct = total ? Math.round(doneCount / total * 100) : 0;

    const summary =
      '<div class="progress-card">'
      + '<div class="pc-row"><span class="pc-lbl">受講の進み具合</span>'
      + '<span class="pc-num"><b>' + doneCount + '</b> / ' + total + ' 回</span></div>'
      + '<div class="bar"><div class="bar-fill" style="width:' + coursePct + '%"></div></div>'
      + '</div>';

    const list = lessons.map((ls) => {
      const w = lessonWindow(ls);
      const v = viewMap[ls.id] || {};
      const done = !!v.completed;
      const pct = done ? 100 : Math.min(100, v.progress_pct || 0);
      const lvid = (ls.source_type === 'youtube') ? extractYouTubeId(ls.source_id) : '';
      const thumb = lvid ? 'https://img.youtube.com/vi/' + lvid + '/mqdefault.jpg' : '';
      const durTxt = ls.duration_sec ? fmtDur(ls.duration_sec) : '';

      const thumbHtml =
        '<div class="thumb' + (thumb ? '' : ' noimg') + '"'
        + (thumb ? ' style="background-image:url(\'' + thumb + '\')"' : '') + '>'
        + (thumb ? '' : '▶')
        + (durTxt ? '<span class="dur">' + durTxt + '</span>' : '')
        + (done ? '<span class="done">✓</span>' : '')
        + '</div>';

      const chips = [];
      if (ls.available_from || ls.available_until) {
        chips.push('<span class="chip info">' +
          esc(fmtJST(ls.available_from) || '—') + '〜' + esc(fmtJST(ls.available_until) || '') + '</span>');
      }
      if (!w.ok) chips.push('<span class="chip lock">' + esc(w.label) + '</span>');

      const progHtml = (!done && pct > 0)
        ? '<div class="bar sm"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
          + '<div class="pct">' + pct + '% まで視聴</div>'
        : '';

      const btnLabel = w.ok
        ? (done ? 'もう一度見る' : (pct > 0 ? '▶ 続きから' : '▶ 視聴する'))
        : (w.state === 'before' ? '公開前' : '公開終了');

      return '<div class="lesson' + (w.ok ? '' : ' is-locked') + '">'
        + thumbHtml
        + '<div class="lesson-body">'
        +   '<h3>' + esc(ls.title || '(授業)') + '</h3>'
        +   (chips.length ? '<div class="meta">' + chips.join('') + '</div>' : '')
        +   progHtml
        +   '<button class="btn sm" ' + (w.ok ? '' : 'disabled style="opacity:.5;cursor:not-allowed"')
        +     ' onclick="openLesson(' + ls.id + ')">' + btnLabel + '</button>'
        + '</div>'
      + '</div>';
    }).join('');

    la.innerHTML = summary + list;
  } catch (e) {
    la.innerHTML = '<div class="empty">授業一覧の読み込みに失敗しました。<br>時間をおいて開き直してください。</div>';
  }
}

// ---- コマを開く：動画プレーヤー + 感想提出 ----
async function openLesson(lessonId) {
  const area = document.getElementById('course-area');
  area.innerHTML = '<div class="loading">読み込み中…</div>';
  let ls;
  try {
    const rows = await sbGet('online_lessons', 'id=eq.' + lessonId + '&select=*&limit=1');
    ls = rows && rows[0];
  } catch(e){ ls = null; }
  if (!ls) { area.innerHTML = '<div class="empty">授業が見つかりませんでした。</div>'; return; }

  // 時間枠を再判定（一覧表示から時間が経っている可能性に備える）
  const w = lessonWindow(ls);
  if (!w.ok) {
    area.innerHTML =
      '<div class="card"><button class="btn ghost" style="width:auto;margin-top:0;padding:8px 14px;font-size:12px" onclick="openCourse(' + ls.online_course_id + ')">← 授業一覧へ</button>'
      + '<div class="empty" style="margin-top:14px">' + esc(w.label) + '</div></div>';
    return;
  }

  const vid = (ls.source_type === 'youtube') ? extractYouTubeId(ls.source_id) : '';
  const hasVideo = !!vid;
  reflectionUnlocked = !hasVideo;   // 動画がある回は視聴後に感想を出す。準備中/既提出は最初から
  const _wmId = (currentOnlineStudent && currentOnlineStudent.id);
  const wmName = _wmId ? esc('No.' + String(_wmId).padStart(4,'0')) : '';
  const player = hasVideo
    ? '<div class="player-wrap"><div id="yt-player"></div>'
      + '<div class="pw-catch" id="pw-catch" onclick="pvTogglePlay()"></div>'
      + (wmName ? '<div class="player-wm" id="player-wm">' + wmName + '</div>' : '')
      + '<div class="pv-bar" id="pv-bar">'
      +   '<button class="pv-btn" id="pv-play" onclick="pvTogglePlay()" aria-label="再生 / 一時停止">▶</button>'
      +   '<span class="pv-time" id="pv-cur">0:00</span>'
      +   '<input class="pv-seek" id="pv-seek" type="range" min="0" max="1000" value="0" oninput="pvSeekInput()" onchange="pvSeekCommit()" aria-label="再生位置">'
      +   '<span class="pv-time" id="pv-dur">0:00</span>'
      +   '<button class="pv-btn" id="pv-mute" onclick="pvToggleMute()" aria-label="ミュート">🔊</button>'
      +   '<input class="pv-vol" id="pv-vol" type="range" min="0" max="100" value="100" oninput="pvVolInput()" aria-label="音量">'
      +   '<button class="pv-btn" id="pv-wide" onclick="toggleWide()" aria-label="拡大">⤢</button>'
      +   '<button class="pv-btn" onclick="toggleFullscreen()" aria-label="全画面">⛶</button>'
      + '</div>'
      + '</div>'
    : '<div class="empty">この授業の動画はまだ準備中です。</div>';

  // 左：目標・要旨（overview 列。空なら非表示）
  const goalHtml = ls.overview
    ? '<div class="goal-box"><div class="lbl">この回の目標・要旨</div>'
      + '<div class="ov-txt">' + esc(ls.overview).replace(/\n/g,'<br>') + '</div></div>'
    : '';

  // 右：教材ダウンロード（material_url 列。空なら準備中表示）
  const materialHtml = ls.material_url
    ? '<a class="dl-btn" href="' + esc(ls.material_url) + '" target="_blank" rel="noopener">'
      + '📄 レジュメをダウンロード</a>'
    : '<div class="empty" style="margin-top:0">教材は準備中です</div>';

  const sideHtml =
    '<div class="goal-box">'
    + '<div class="lbl">教材</div>'
    + materialHtml
    + '</div>';

  // 感想フォーム（動画がある回は視聴後に出現。準備中/既提出は最初から表示）
  const reflectionCard =
    '<div class="card reflect-card' + (reflectionUnlocked ? '' : ' reveal-hidden') + '" id="reflection-card">'
    + (hasVideo ? '<div class="done-badge">✓ 視聴おつかれさまでした</div>' : '')
    + '<h2>感想の提出</h2>'
    + '<p class="sub">今日の授業でわかったこと・質問などを書いて提出してください。</p>'
    + '<textarea id="reflection" rows="5" style="width:100%;padding:13px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;background:var(--bg);resize:vertical" placeholder="今日の授業でわかったこと・質問など"></textarea>'
    + '<button class="btn" id="submit-reflection" onclick="submitReflection(' + ls.id + ')">感想を提出する</button>'
    + '<div id="reflection-msg" class="err" style="background:#E8F6EE;border-color:#A9DFBF;color:#1E6B3F;display:none"></div>'
    + '</div>';

  // 視聴前の待ち案内（動画がある回のみ）
  const waitHtml = reflectionUnlocked ? '' :
    '<div class="watch-note" id="reflection-wait">動画を最後まで視聴すると、感想フォームが開きます。</div>';

  document.body.classList.remove('wide');
  document.body.classList.add('watching');
  area.innerHTML =
    '<div class="watch-head">'
    + '<button class="btn ghost" style="width:auto;margin:0 0 10px;padding:7px 13px;font-size:12px" onclick="leaveLesson(' + ls.online_course_id + ')">← 授業一覧へ</button>'
    + '<div class="crumb">' + esc((currentCourse && currentCourse.title) || '') + '</div>'
    + '<h2>' + esc(ls.title || '') + '</h2>'
    + '</div>'
    + '<div class="watch-grid" id="watch-grid">'
    // 左カラム：目標・要旨
    + '<div class="watch-left">' + goalHtml + '</div>'
    // 中央カラム：動画＋（視聴後に）感想
    + '<div class="watch-main">'
    +   '<div class="card" style="margin-top:0;padding:14px">' + player + waitHtml + '</div>'
    +   reflectionCard
    + '</div>'
    // 右カラム：教材（スマホはトグルで開閉、PCは常時表示）
    + '<div class="watch-side collapsed" id="watch-side">'
    +   '<button class="side-toggle" id="side-toggle" onclick="toggleSide()">'
    +     '<span>教材・資料</span><span class="chev">▾</span></button>'
    +   '<div id="side-body" style="margin-top:10px;display:none">' + sideHtml + '</div>'
    + '</div>'
    + '</div>';

  // 視聴レコードを用意 → プレーヤー起動（進捗記録）
  currentLesson = ls;
  await ensureView(ls.id);
  if (viewAlreadyCompleted) unlockReflection();   // 既に提出済みなら再視聴を求めず解除
  showReflectionReplyIfAny();                      // 既提出なら前回の感想を復元＋先生の返信を表示
  startWatermarkCycle();                            // 氏名＋ID透かしの巡回を開始
  if (vid) startPlayer(vid);
}

// 感想フォームの出現（動画を最後まで視聴 or 既提出で呼ばれる）
function unlockReflection() {
  reflectionUnlocked = true;
  const wait = document.getElementById('reflection-wait');
  const card = document.getElementById('reflection-card');
  if (wait) wait.remove();
  if (card && card.classList.contains('reveal-hidden')) {
    card.classList.remove('reveal-hidden');
    card.classList.add('reveal-in');
  }
}

// 既に感想提出済みなら、前回の感想を復元し、先生からの返信があれば表示する
function showReflectionReplyIfAny() {
  const card = document.getElementById('reflection-card');
  if (!card) return;
  if (viewAlreadyCompleted && viewPrevReflection) {
    const ta = document.getElementById('reflection');
    if (ta && !ta.value) ta.value = viewPrevReflection;
  }
  if (viewReply) {
    let box = document.getElementById('reflection-reply-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'reflection-reply-box';
      box.style.cssText = 'margin-top:12px;border-top:1px dashed var(--border);padding-top:10px';
      card.appendChild(box);
    }
    box.innerHTML =
      '<div style="font-size:12px;color:var(--green-d);font-weight:800;margin-bottom:5px">先生からの返信'
      + (viewReplyAt ? '<span style="color:var(--muted);font-weight:400;margin-left:6px">' + esc(fmtJST(viewReplyAt)) + '</span>' : '')
      + '</div>'
      + '<div style="font-size:14px;line-height:1.75;white-space:pre-wrap;background:#E8F6EE;border:1px solid #A9DFBF;border-radius:10px;padding:12px">'
      + esc(viewReply) + '</div>';
  }
}

// 通し番号の透かし：ふだんは透明で、ときどき一瞬だけランダムな位置に薄く表示する。
// 視聴中はほぼ気にならないが、録画にはランダムな位置・タイミングで写るので追跡に使える。
let wmTimeout = null;
function showWatermarkOnce() {
  const el = document.getElementById('player-wm');
  if (!el) return;
  el.style.top = (8 + Math.random() * 76) + '%';
  el.style.left = (5 + Math.random() * 58) + '%';
  el.classList.add('show');
  setTimeout(function(){ const e = document.getElementById('player-wm'); if (e) e.classList.remove('show'); }, 3500); // 約3.5秒だけ表示
  wmTimeout = setTimeout(showWatermarkOnce, 20000 + Math.random() * 20000); // 次は20〜40秒後
}
function startWatermarkCycle() {
  const el = document.getElementById('player-wm');
  if (!el) return;
  stopWatermarkCycle();
  wmTimeout = setTimeout(showWatermarkOnce, 5000); // 最初は5秒後に一瞬表示
}
function stopWatermarkCycle() {
  if (wmTimeout) { clearTimeout(wmTimeout); wmTimeout = null; }
  if (wmTimer) { clearInterval(wmTimer); wmTimer = null; }
}

// 動画の拡大（左は残して中央＝動画を右へ広げる。PC幅のみ効果）
function toggleWide() {
  const grid = document.getElementById('watch-grid');
  const btn  = document.getElementById('pv-wide');
  if (!grid) return;
  const wide = grid.classList.toggle('wide');
  document.body.classList.toggle('wide', wide);
  if (btn) btn.textContent = wide ? '⤡' : '⤢';
}

// 動画の全画面表示
function toggleFullscreen() {
  const el = document.querySelector('.player-wrap');
  if (!el) return;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (!fsEl) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitEnterFullscreen;
      if (req) req.call(el);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  } catch(e){}
}

// 右カラム（教材）の開閉。スマホではボタンで body を出し入れ、PCはCSSで常時表示。
function toggleSide() {
  const side = document.getElementById('watch-side');
  const body = document.getElementById('side-body');
  const btn  = document.getElementById('side-toggle');
  if (!side || !body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (btn) btn.classList.toggle('open', !open);
}

// 視聴レコードの用意（既存があれば流用、なければ作成）
async function ensureView(lessonId) {
  maxWatchedSec = 0;
  activeSec = 0; lastActiveTs = 0;
  viewPrevReflection = ''; viewReply = ''; viewReplyAt = '';
  lessonDurationSec = (currentLesson && currentLesson.duration_sec) ? currentLesson.duration_sec : 0;
  try {
    const rows = await sbGet('online_views',
      'online_student_id=eq.' + currentOnlineStudent.id +
      '&online_lesson_id=eq.' + lessonId +
      '&select=id,completed,watched_sec,active_sec,first_viewed_at,reflection,reflection_reply,reflection_replied_at&limit=1');
    if (rows && rows[0]) {
      currentViewId = rows[0].id;
      maxWatchedSec = rows[0].watched_sec || 0;   // 前回までの到達点を引き継ぐ
      activeSec = rows[0].active_sec || 0;         // 前回までの実視聴時間を引き継ぐ
      viewHadFirst = !!rows[0].first_viewed_at;
      viewAlreadyCompleted = !!rows[0].completed;
      viewPrevReflection = rows[0].reflection || '';
      viewReply = rows[0].reflection_reply || '';
      viewReplyAt = rows[0].reflection_replied_at || '';
      return;
    }
    const created = await sbPost('online_views', {
      online_student_id: currentOnlineStudent.id,
      online_lesson_id: lessonId,
      completed: false
    });
    currentViewId = created && created[0] ? created[0].id : null;
    viewHadFirst = false;
    viewAlreadyCompleted = false;
  } catch(e){ currentViewId = null; }
}

// ---- 自作の動画コントロール（YT IFrame API 操作）----
function pvTogglePlay() {
  if (!ytPlayer) return;
  let st = -1;
  try { st = ytPlayer.getPlayerState(); } catch(e){}
  try { if (st === YT.PlayerState.PLAYING) ytPlayer.pauseVideo(); else ytPlayer.playVideo(); } catch(e){}
}
function pvToggleMute() {
  if (!ytPlayer) return;
  const btn = document.getElementById('pv-mute'), vol = document.getElementById('pv-vol');
  try {
    if (ytPlayer.isMuted()) {
      ytPlayer.unMute();
      if (vol && +vol.value === 0) { vol.value = '50'; ytPlayer.setVolume(50); }
      if (btn) btn.textContent = '🔊';
    } else {
      ytPlayer.mute();
      if (btn) btn.textContent = '🔇';
    }
  } catch(e){}
}
function pvVolInput() {
  if (!ytPlayer) return;
  const vol = document.getElementById('pv-vol'), btn = document.getElementById('pv-mute');
  const v = +vol.value;
  try {
    ytPlayer.setVolume(v);
    if (v === 0) { ytPlayer.mute(); if (btn) btn.textContent = '🔇'; }
    else { ytPlayer.unMute(); if (btn) btn.textContent = '🔊'; }
  } catch(e){}
}
function pvSeekInput() {
  pvScrubbing = true;
  if (!ytPlayer) return;
  let dur = 0; try { dur = ytPlayer.getDuration() || 0; } catch(e){}
  const seek = document.getElementById('pv-seek'), curEl = document.getElementById('pv-cur');
  if (curEl && dur) curEl.textContent = fmtDur((+seek.value) / 1000 * dur);
}
function pvSeekCommit() {
  if (!ytPlayer) { pvScrubbing = false; return; }
  let dur = 0; try { dur = ytPlayer.getDuration() || 0; } catch(e){}
  const seek = document.getElementById('pv-seek');
  try { ytPlayer.seekTo((+seek.value) / 1000 * dur, true); } catch(e){}
  pvScrubbing = false;
}
function pvTick() {
  if (!ytPlayer) return;
  let dur = 0, cur = 0, st = -1;
  try { dur = ytPlayer.getDuration() || 0; cur = ytPlayer.getCurrentTime() || 0; st = ytPlayer.getPlayerState(); } catch(e){ return; }
  // 実視聴時間の積算：再生中のみカウント。1tickの加算上限を2秒にして
  // バックグラウンド放置（タイマー間引き）や早送りでの水増しを防ぐ。
  const now = Date.now();
  const playing = (st === YT.PlayerState.PLAYING) && !pvScrubbing;
  if (playing) {
    if (lastActiveTs) activeSec += Math.min((now - lastActiveTs) / 1000, 2);
    lastActiveTs = now;
  } else {
    lastActiveTs = 0;
  }
  // 実視聴が規定割合（85%）に達したら感想を解除。シーク／早送りでは到達しない。
  if (dur > 0) { if (activeSec >= dur * 0.85) unlockReflection(); }
  else if (cur > 30) { unlockReflection(); }   // 尺不明時のフォールバック
  // 表示更新
  const durEl = document.getElementById('pv-dur'), curEl = document.getElementById('pv-cur'), seek = document.getElementById('pv-seek');
  if (durEl && dur) durEl.textContent = fmtDur(dur);
  if (!pvScrubbing) {
    if (curEl) curEl.textContent = fmtDur(cur);
    if (seek && dur) seek.value = String(Math.round(cur / dur * 1000));
  }
}

// ---- YouTube IFrame API プレーヤー＋進捗記録 ----
function startPlayer(vid) {
  function create() {
    ytPlayer = new YT.Player('yt-player', {
      videoId: vid,
      playerVars: { rel:0, modestbranding:1, playsinline:1, controls:0, disablekb:1, fs:0, iv_load_policy:3, cc_load_policy:0 },
      events: { onReady: onPlayerReady, onStateChange: onPlayerState }
    });
  }
  if (window.YT && window.YT.Player) { create(); return; }
  // APIコールバックを登録
  window.onYouTubeIframeAPIReady = create;
  if (!ytApiLoading) {
    ytApiLoading = true;
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
}

function onPlayerReady() {
  // 自作コントロールのUI更新を開始＋初期値
  if (!uiTimer) uiTimer = setInterval(pvTick, 300);
  try { const vEl = document.getElementById('pv-vol'); if (vEl) vEl.value = String(Math.round(ytPlayer.getVolume())); } catch(e){}
  try { ytPlayer.setPlaybackRate(1); } catch(e){}
  pvTick();
  // 総尺を取得し、未登録なら online_lessons.duration_sec を補完
  try {
    const dur = Math.floor(ytPlayer.getDuration() || 0);
    if (dur > 0) {
      lessonDurationSec = dur;
      if (currentLesson && !currentLesson.duration_sec) {
        currentLesson.duration_sec = dur;
        sbPatch('online_lessons', 'id=eq.' + currentLesson.id, { duration_sec: dur }).catch(()=>{});
      }
    }
  } catch(e){}
  // 初回視聴時刻
  if (currentViewId && !viewHadFirst) {
    viewHadFirst = true;
    sbPatch('online_views', 'id=eq.' + currentViewId, { first_viewed_at: new Date().toISOString() }).catch(()=>{});
  }
}

function onPlayerState(ev) {
  const pb = document.getElementById('pv-play');
  if (pb) pb.textContent = (ev.data === YT.PlayerState.PLAYING) ? '⏸' : '▶';
  // 1=再生中：定期保存を開始 / それ以外：停止して1回保存
  if (ev.data === YT.PlayerState.PLAYING) {
    if (!progressTimer) progressTimer = setInterval(tickProgress, 15000); // 15秒ごと
  } else {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    tickProgress(); // 一時停止・終了・離脱直前に確定保存
  }
}

function tickProgress() {
  if (!ytPlayer || !currentViewId) return;
  let cur = 0;
  try { cur = Math.floor(ytPlayer.getCurrentTime() || 0); } catch(e){ return; }
  if (cur > maxWatchedSec) maxWatchedSec = cur;
  const pct = lessonDurationSec > 0
    ? Math.min(100, Math.round(maxWatchedSec / lessonDurationSec * 100)) : 0;
  sbPatch('online_views', 'id=eq.' + currentViewId, {
    watched_sec: maxWatchedSec,
    progress_pct: pct,
    active_sec: Math.round(activeSec),
    last_viewed_at: new Date().toISOString()
  }).catch(()=>{});
}

// 授業一覧へ戻る（プレーヤー破棄＋最終保存）
function leaveLesson(courseId) {
  document.body.classList.remove('watching','wide');
  stopWatermarkCycle();
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
  tickProgress();
  try { if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy(); } catch(e){}
  ytPlayer = null;
  openCourse(courseId);
}

// 感想提出 → completed=true + reflection 保存
async function submitReflection(lessonId) {
  const btn = document.getElementById('submit-reflection');
  const msg = document.getElementById('reflection-msg');
  const text = (document.getElementById('reflection').value || '').trim();
  msg.style.display = 'none';
  if (!text) {
    msg.textContent = '感想を入力してください。'; msg.style.color = '#943126';
    msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA'; msg.style.display = 'block';
    return;
  }
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    const payload = { completed: true, reflection: text, completed_at: new Date().toISOString() };
    if (currentViewId) {
      await sbPatch('online_views', 'id=eq.' + currentViewId, payload);
    } else {
      // 念のため：レコードが無ければ作成
      await sbPost('online_views', Object.assign({
        online_student_id: currentOnlineStudent.id, online_lesson_id: lessonId
      }, payload));
    }
    msg.textContent = '感想を提出しました。お疲れさまでした！';
    msg.style.color = '#1E6B3F'; msg.style.background = '#E8F6EE'; msg.style.borderColor = '#A9DFBF';
    msg.style.display = 'block';
    btn.textContent = '提出済み';
    await awardLessonComplete();   // 初回完了なら +5pt
  } catch(e) {
    btn.disabled = false; btn.textContent = '感想を提出する';
    msg.textContent = '送信に失敗しました。時間をおいて試してください。';
    msg.style.color = '#943126'; msg.style.background = '#FDECEA'; msg.style.borderColor = '#E6B0AA';
    msg.style.display = 'block';
  }
}

// タブを閉じる/バックグラウンド化する直前に進捗を確定保存（モバイル対策）
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') tickProgress();
});
window.addEventListener('pagehide', function(){ tickProgress(); });

// 起動時
tryAutoLogin();

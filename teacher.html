<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fit ビデオ補習 - 講師ページ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eef2f4;--ink:#1c2733;--muted:#6b7785;--card:#ffffff;--line:#dce3e7;
    --accent:#2b5876;--accent-soft:#e7eef3;--done:#2f8f6f;--pending:#c9883b;
    --danger:#c0392b;--shadow:0 2px 10px rgba(28,39,51,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%}
  header{padding:18px 16px;text-align:center;background:var(--accent);color:#fff}
  header h1{font-size:17px;letter-spacing:.04em}
  header p{font-size:12px;opacity:.85;margin-top:2px}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
  #login{max-width:360px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow);text-align:center}
  #login h2{font-size:16px;margin-bottom:14px}
  #login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;margin-bottom:10px}
  #login input:focus{outline:none;border-color:var(--accent)}
  #login button{width:100%;padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  #login .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:6px}
  .maintabs{display:flex;gap:6px;margin-bottom:18px}
  .maintab{flex:1;padding:11px 4px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;transition:.15s}
  .maintab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none}
  .panel.active{display:block}
  .form-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:var(--shadow)}
  .form-card h2{font-size:15px;margin-bottom:12px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--muted)}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;background:#fcfdfe}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);margin-top:3px}
  .add-btn{width:100%;padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .add-btn:disabled{background:#a9b6bf;cursor:not-allowed}
  .form-status{font-size:13px;text-align:center;margin-top:8px;min-height:18px}
  .form-status.ok{color:var(--done)}
  .form-status.err{color:var(--danger)}
  .preview{margin-top:10px;border-radius:9px;overflow:hidden;display:none;position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .subject-block{margin-bottom:20px}
  .subject-title{font-size:15px;font-weight:700;margin-bottom:8px;padding-left:8px;border-left:4px solid var(--accent)}
  .v-row{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .v-row .num{font-size:12px;color:var(--muted);width:24px;flex:none}
  .v-row .ttl{font-size:14px;font-weight:600;flex:1}
  .v-row .yid{font-size:11px;color:var(--muted);font-family:monospace}
  .v-row .del{border:0;background:none;color:var(--danger);font-size:13px;cursor:pointer;flex:none;padding:4px}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
  .summary h2{font-size:15px;margin-bottom:10px}
  .bars{display:flex;flex-direction:column;gap:10px}
  .bar-row{display:flex;align-items:center;gap:10px}
  .bar-label{width:42px;font-size:13px;font-weight:600;flex:none}
  .bar-track{flex:1;height:14px;background:var(--accent-soft);border-radius:7px;overflow:hidden}
  .bar-fill{height:100%;background:var(--done);border-radius:7px;transition:width .4s}
  .bar-count{width:62px;text-align:right;font-size:13px;color:var(--muted);flex:none}
  .v-item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .v-top{display:flex;align-items:center;gap:10px}
  .v-status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;flex:none}
  .v-status.done{background:#e3f3ec;color:var(--done)}
  .v-status.pending{background:#fbf0df;color:var(--pending)}
  .v-title{font-size:14px;font-weight:600;flex:1}
  .v-meta{font-size:12px;color:var(--muted);margin-top:6px}
  .v-comment{font-size:14px;margin-top:8px;padding:9px 11px;background:#f7f9fa;border-radius:8px;border:1px solid var(--line)}
  .v-del{border:0;background:none;color:var(--danger);font-size:12px;cursor:pointer;margin-top:6px;padding:2px 0;text-decoration:underline}
  .refresh{display:block;margin:0 0 16px auto;padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:9px;font-size:13px;cursor:pointer;color:var(--accent);font-weight:600}
  .loading{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<header>
  <h1>fit ビデオ補習 — 講師ページ</h1>
  <p>動画の管理と提出状況の確認</p>
</header>

<div id="login">
  <h2>合言葉を入力してください</h2>
  <input type="password" id="pw" placeholder="合言葉" autocomplete="off">
  <button id="loginBtn">開く</button>
  <div class="err" id="loginErr"></div>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="maintabs">
    <div class="maintab active" data-panel="manage">動画の管理</div>
    <div class="maintab" data-panel="progress">提出状況</div>
  </div>

  <div class="panel active" id="panel-manage">
    <div class="form-card">
      <h2>動画を追加</h2>
      <div class="field">
        <label>科目</label>
        <select id="f-subject">
          <option value="chemistry">化学</option>
          <option value="physics">物理</option>
          <option value="math">数学</option>
        </select>
      </div>
      <div class="field">
        <label>タイトル</label>
        <input type="text" id="f-title" placeholder="例）酸化還元の基礎">
      </div>
      <div class="field">
        <label>YouTube</label>
        <input type="text" id="f-url" placeholder="URL・埋め込みコード・動画IDのどれでもOK">
        <div class="hint">watch?v= / youtu.be/ / iframe埋め込み / ID単体 すべて対応</div>
        <div class="preview" id="f-preview"><iframe id="f-preview-frame"></iframe></div>
      </div>
      <button class="add-btn" id="addBtn">この動画を追加</button>
      <div class="form-status" id="addStatus"></div>
    </div>
    <div id="manageList"><div class="loading">読み込み中…</div></div>
  </div>

  <div class="panel" id="panel-progress">
    <button class="refresh" id="refreshBtn">↻ 最新の状態に更新</button>
    <div class="summary">
      <h2 id="studentLabel"></h2>
      <div class="bars" id="bars"></div>
    </div>
    <div id="detail"></div>
  </div>
</div>

<script>
/* ① Supabase 接続設定（生徒ページと同じ値を入れる） */
const SUPABASE_URL = "https://crphhvuqzhotsewigujk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNycGhodnVxemhvdHNld2lndWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODMxNTgsImV4cCI6MjA5NTk1OTE1OH0.D71w8HRxsIh1o8s-o8Euq725R6JwR23O4r43d6i_wO8";

/* ② 講師ページの合言葉（生徒に教えない） */
const TEACHER_PASSWORD = "fit0803";

/* ③ 確認したい生徒の名前（生徒ページの STUDENT_NAME と合わせる） */
const STUDENT_NAME = "砂田千里";

const SUBJECTS = [
  { key:"chemistry", label:"化学" },
  { key:"physics",   label:"物理" },
  { key:"math",      label:"数学" },
];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let videos = [];
let subs = {};

function extractYouTubeId(input){
  if(!input) return null;
  const s = input.trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  const patterns = [
    /youtube\.com\/watch\?[^"'\s]*v=([A-Za-z0-9_-]{11})/,
    /youtu\.be\/([A-Za-z0-9_-]{11})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{11})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/,
  ];
  for(const p of patterns){ const m = s.match(p); if(m) return m[1]; }
  return null;
}

const loginBox = document.getElementById("login");
const appBox   = document.getElementById("app");
document.getElementById("loginBtn").onclick = tryLogin;
document.getElementById("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
function tryLogin(){
  if(document.getElementById("pw").value === TEACHER_PASSWORD){
    loginBox.style.display="none";
    appBox.style.display="block";
    document.getElementById("studentLabel").textContent = STUDENT_NAME + " さんの進捗";
    loadVideos();
  }else{
    document.getElementById("loginErr").textContent = "合言葉が違います";
  }
}

document.querySelectorAll(".maintab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".maintab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    const p = t.dataset.panel;
    document.getElementById("panel-"+p).classList.add("active");
    if(p==="progress") loadProgress();
  };
});

const fUrl = document.getElementById("f-url");
const fPreview = document.getElementById("f-preview");
const fPreviewFrame = document.getElementById("f-preview-frame");
fUrl.addEventListener("input", ()=>{
  const id = extractYouTubeId(fUrl.value);
  if(id){ fPreviewFrame.src = "https://www.youtube.com/embed/"+id; fPreview.style.display="block"; }
  else{ fPreview.style.display="none"; fPreviewFrame.src=""; }
});

document.getElementById("addBtn").onclick = addVideo;
async function addVideo(){
  const subject = document.getElementById("f-subject").value;
  const title = document.getElementById("f-title").value.trim();
  const id = extractYouTubeId(fUrl.value);
  const status = document.getElementById("addStatus");
  status.className = "form-status";
  if(!title){ status.className="form-status err"; status.textContent="タイトルを入力してください"; return; }
  if(!id){ status.className="form-status err"; status.textContent="YouTubeのURL/IDが読み取れませんでした"; return; }
  const btn = document.getElementById("addBtn");
  btn.disabled = true; status.textContent = "追加中…";
  try{
    const order = videos.filter(v=>v.subject===subject).length;
    const { error } = await sb.from("videos").insert({ subject, title, youtube_id:id, sort_order:order });
    if(error) throw error;
    status.className="form-status ok"; status.textContent="追加しました ✓";
    document.getElementById("f-title").value="";
    fUrl.value=""; fPreview.style.display="none"; fPreviewFrame.src="";
    await loadVideos();
  }catch(e){
    status.className="form-status err"; status.textContent="追加に失敗："+e.message;
  }finally{ btn.disabled = false; }
}

async function loadVideos(){
  try{
    const { data, error } = await sb.from("videos").select("*").order("subject").order("sort_order");
    if(error) throw error;
    videos = data||[];
    renderManageList();
  }catch(e){
    document.getElementById("manageList").innerHTML =
      '<div class="loading" style="color:#c0392b">読み込み失敗（'+e.message+'）</div>';
  }
}

function renderManageList(){
  const wrap = document.getElementById("manageList");
  wrap.innerHTML = "";
  SUBJECTS.forEach(s=>{
    const list = videos.filter(v=>v.subject===s.key);
    const block = document.createElement("div");
    block.className = "subject-block";
    block.innerHTML = `<div class="subject-title">${s.label}（${list.length}本）</div>`;
    if(list.length===0){ block.innerHTML += '<div class="hint" style="padding-left:8px">まだありません</div>'; }
    list.forEach((v,i)=>{
      const row = document.createElement("div");
      row.className = "v-row";
      row.innerHTML = `
        <span class="num">${i+1}</span>
        <span class="ttl">${escapeHtml(v.title)}<br><span class="yid">${v.youtube_id}</span></span>
        <button class="del" title="削除">🗑</button>`;
      row.querySelector(".del").onclick = ()=> delVideo(v);
      block.appendChild(row);
    });
    wrap.appendChild(block);
  });
}

async function delVideo(v){
  if(!confirm(`「${v.title}」を削除します。よろしいですか？\n（生徒ページからも消えます）`)) return;
  try{
    const { error } = await sb.from("videos").delete().eq("id", v.id);
    if(error) throw error;
    await loadVideos();
  }catch(e){ alert("削除に失敗："+e.message); }
}

document.getElementById("refreshBtn").onclick = loadProgress;
async function loadProgress(){
  document.getElementById("detail").innerHTML = '<div class="loading">読み込み中…</div>';
  try{
    if(videos.length===0) await loadVideos();
    const { data, error } = await sb.from("homework_submissions").select("*").eq("student_name", STUDENT_NAME);
    if(error) throw error;
    subs = {};
    (data||[]).forEach(r=> subs[r.video_id]=r );
    renderSummary();
    renderDetail();
  }catch(e){
    document.getElementById("detail").innerHTML =
      '<div class="loading" style="color:#c0392b">読み込み失敗（'+e.message+'）</div>';
  }
}

function renderSummary(){
  const bars = document.getElementById("bars");
  bars.innerHTML = "";
  SUBJECTS.forEach(s=>{
    const list = videos.filter(v=>v.subject===s.key);
    const total = list.length;
    const done = list.filter(v=> subs[v.id]).length;
    const pct = total ? Math.round(done/total*100) : 0;
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <div class="bar-label">${s.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-count">${done} / ${total}</div>`;
    bars.appendChild(row);
  });
}

function renderDetail(){
  const wrap = document.getElementById("detail");
  wrap.innerHTML = "";
  SUBJECTS.forEach(s=>{
    const list = videos.filter(v=>v.subject===s.key);
    if(list.length===0) return;
    const block = document.createElement("div");
    block.className = "subject-block";
    block.innerHTML = `<div class="subject-title">${s.label}</div>`;
    list.forEach(v=>{
      const rec = subs[v.id];
      const done = !!rec;
      const item = document.createElement("div");
      item.className = "v-item";
      let html = `
        <div class="v-top">
          <span class="v-status ${done?'done':'pending'}">${done?'提出済み':'未提出'}</span>
          <span class="v-title">${escapeHtml(v.title)}</span>
        </div>`;
      if(done){
        const dt = new Date(rec.created_at);
        const dstr = `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
        html += `<div class="v-meta">提出日時：${dstr}</div>`;
        html += `<div class="v-comment">${rec.comment ? escapeHtml(rec.comment) : '（感想なし）'}</div>`;
        html += `<button class="v-del">この提出を削除（再提出させる）</button>`;
      }
      item.innerHTML = html;
      const del = item.querySelector(".v-del");
      if(del) del.onclick = ()=> removeSub(rec.id, v.title);
      block.appendChild(item);
    });
    wrap.appendChild(block);
  });
}

async function removeSub(id, title){
  if(!confirm(`「${title}」の提出を削除します。\nこの生徒はもう一度提出できるようになります。よろしいですか？`)) return;
  try{
    const { error } = await sb.from("homework_submissions").delete().eq("id", id);
    if(error) throw error;
    loadProgress();
  }catch(e){ alert("削除に失敗："+e.message); }
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>

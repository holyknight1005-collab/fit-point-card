<main>
<h1>受講生の声</h1>
<p class="lead">「超感覚英語」のセミナーに参加した方の感想です（516件）。</p>
<nav aria-label="世代でしぼる"><button type="button" data-ku="" class="on">すべて（516）</button><button type="button" data-ku="社会人">社会人（286）</button><button type="button" data-ku="大学生">大学生（116）</button><button type="button" data-ku="高校生">高校生（88）</button><button type="button" data-ku="中学生以下">中学生以下（24）</button></nav>
<div class="grid" id="list">
<figure data-ku="社会人"><blockquote>受験生時代はもちろんですが、私は大学生、社会人になってからも役に立っていると感じています。 大学生時代に海外留学した際や、今は医師として働いていますが、外国人の患者さんがこられて英語で会話しないといけない場面もあります。そのときも超感覚英語の感覚が自然と英語が言葉としてでてきて、会話することに自信をもてていることにつながっています。</blockquote><figcaption>Mさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>英検2級持ってますが、とっさに簡単な英語も話せないというジレンマがありましたが、英語をイメージで捉えるという今日のお話を伺ってすごく腑に落ちたというか、日本語→英語の変換じゃダメなんだなというのがよくわかりました。そして、英語って面白いなと、また勉強してみようかなと感じました。</blockquote><figcaption>Iさん（社会人）</figcaption></figure>
<figure data-ku="大学生"><blockquote>英語がさらに好きになりました。楽しくて90分が一瞬でした。fitで英語が学べて、超感覚英語に出会えて人生が豊かになった気がします。今まではテストでいい点取るためにとか受験のためにって勉強してたけど英語を感じれるようになって毎日楽しんで学べてます。</blockquote><figcaption>Nさん（大学生）</figcaption></figure>
<figure data-ku="社会人"><blockquote>18年ほど前に初めて超基礎英語（講座名はうろ覚え）を受けたときのことを思い出した。伝え方は変わっている部分があったが、中身（本質）は一貫していて、懐かしさを感じた。18年の間に、海外旅行・海外企業との会議・海外駐在など様々なところで英語を使ってきたが、「1つの単語に1つのイメージ」が英語学習・理解の根本にあるように感じた。 このような機会を作って頂き、ありがとうございました。また頑張ろうと思えました。</blockquote><figcaption>Sさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>久しぶりに超感覚英語を受講できてとても懐かしく、また自分が学んでいた頃から進化していて驚きました。 田尾先生に教わった英語は今も生きていて、今日も午前中にバイク屋の外国人の店員さんに「This switch doesn’t work.」と使ったところでした。</blockquote><figcaption>Iさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>浪人生の時にfitに通っていました。 その時の英語の授業で聴いたことばかりで、すごく懐かしい気持ちになりました！ runのイメージもそのまんま体に染み付いていて日本語訳よりすぐにイメージを動作で表現したほどです。 高校生の時は文法を意識しすぎて、修学旅行で海外に行ったにも関わらず全く話せなかった(単語ですら話せなかった)のですが、田尾先生の授業のおかげで英語を感覚で捉えられるようになっていき、大学で留学生と話す時などは苦手意識が減って拙いながらもコミュニケーションを取ることができました！ 最近では英語を学ぶ機会も話す機会も減ってしまったので、今回の授業を通してまた英語に触れたい、英語で気軽なコミュニケーションを取ってみたいと思うようになりました。 今日は聞けませんでしたが、toは矢印(ちょっと違っていたらすみません)は今でもtoを見るたびに頭の中で再生されます🤭</blockquote><figcaption>Yさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>息子が学生の頃から熱心に取り組んでいた超感覚英語に初めて触れることができました。難しい事を詰め込むのではなく、感覚的に理解でき、英語が苦手な私でもついていけました。初めて英語が楽しかったです。自分が学生の時に出会いたかったなぁ〜</blockquote><figcaption>Sさん（社会人）</figcaption></figure>
<figure data-ku="中学生以下"><blockquote>英語はもともと好きだったけど、習うことが多くなるにつれて何がなんなのかよく分からなくなってきていました。でも今日の授業で、英語は覚えるだけじゃない。学校の教科じゃなくて、言語だということが改めて分かりました。もっともっと英語を喋れるようになりたいと思いました！</blockquote><figcaption>Iさん（中学生以下）</figcaption></figure>
<figure data-ku="社会人"><blockquote>ずっと英語が苦手で嫌いでした。先生にcanとmayの違いを聞いた時に「どっちでも良いよ」って言われて釈然としなかった記憶、細かな疑問が文法の学習では解消されなかったモヤモヤが思い出されて、学生時代に出会いたかったなと思いました。</blockquote><figcaption>Iさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>久々に田尾先生の授業を聴けて嬉しかったです。大学の超感覚英語講座がキッカケで今では英語が話せるようになりましたが、そのキッカケの瞬間を思い出すような講義でした。</blockquote><figcaption>Aさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>高校1年の時に初めて授業を受けた時のことを思い出しました。授業を受けてから、学校の模試で英語の偏差値が9上がった時はびっくりしたのと、とても嬉しかったです。もう10年も前になるのに、1つの単語に1つのイメージはずっと変わらないので、workもrunもその他も、その単語のイメージや使い方などが今も定着しているのは本当に凄いことだなと思いました。</blockquote><figcaption>Wさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>英語を学ぶというこれまでのイメージが、「英語で遊ぶ」という感覚に変わる、とても楽しい時間でした。 特に印象的だったのは、まるで演劇を観ているかのような場面です。ただ内容を楽しむだけでなく、そこに至るまでに皆様が重ねてこられた準備や工夫まで自然と思い浮かび、その熱量がこちらにも伝わってきました。 「学ばなければ」という意識ではなく、「もっと知りたい、もっと学びたい」と感情を動かされるような講習で、英語に対する距離がぐっと近くなったように感じます。 楽しく、そして心に残る素敵な時間を、本当にありがとうございました。</blockquote><figcaption>Iさん（社会人）</figcaption></figure>
<figure data-ku="大学生"><blockquote>僕はfitに出会ったことで英語に興味を持ち、少しずつ「英語を話せる」という自信を持てるようになりました。そして英語を通していろいろな人と出会う中で、文化や考え方、価値観、言葉の捉え方など、たくさんの「違い」を感じられるようになりました。</blockquote><figcaption>Mさん（大学生）</figcaption></figure>
<figure data-ku="大学生"><blockquote>今回の授業で、昨年の講座の感動を思い出すことができたと同時に、思っていたより自分にしっかりと身についていたことにも驚きました。先日カンボジアへ研修に行った際も、昨年英語講座で学んだことを活かせて昨年よりスラスラと英語を使えるようになっていたり、アルバイト先で海外のお客様がお話されていることを聞き取れたりと、実践できた場面がありました。超感覚英語のおかげで、もうやりたくないと思っていた英語を学び直そうという気持ちになっています。</blockquote><figcaption>Hさん（大学生）</figcaption></figure>
<figure data-ku="大学生"><blockquote>最初、「マイクつかない」を英語でどう伝えるかと言われた時、実はパッと思いついていました。私英語苦手なのに、何事！？って内心思いながら「This mic doesn't work!」と画面に言ってました笑。その時頭に浮かんでいたのは、浪人生の時に教わっていた超感覚英語の授業です。いつの間にか、英語を話す"感覚"が身についていたことに、驚きと喜びを噛み締めてます！！！！！！</blockquote><figcaption>Aさん（大学生）</figcaption></figure>
<figure data-ku="社会人"><blockquote>特に「単語を思い出そうとするから、話せない」というお話は、「まさにそれ！」と思いました。以前、外国の方に道を聞かれたことがあり、そのときも英語の単語がなかなか出てこなくて、身振り手振りで一生懸命説明したことがあります。伝えたい気持ちはあるのに、言葉が出てこないことを申し訳なく感じたのを覚えています。 今回のセミナーを聞いて、英語に対する見方が少し変わりました。今までは「英語は難しい」と思っていましたが、知っている単語を日本語に訳すのではなく、その言葉のイメージを持つことで、もっと気軽に英語に触れられるんだなと感じました。</blockquote><figcaption>Iさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>workやrunは、映画を観ていて、よく聞く動詞です。どうやって使えば良いかが分からず使えなかった。もう明日から他の動詞も使える気がします。英語を話すのが楽しくなりそう！</blockquote><figcaption>Dさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>久しぶりの超感覚英語の授業でした。やっぱり一つの単語に一つのイメージですね。仕事で英語を使い始めて、日本語から変換して話すと絶対相手と対等に話せないだろうなと感じることばかりです。もう一度基本に立ち返って、簡単な単語の持つイメージで幅広く表現できるようにしていきたいです。</blockquote><figcaption>Aさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>1つの言葉に1つのイメージ、すごくよい指標を持てました✨ 実際に海外に暮らしていますが、田尾先生の仰るシチュエーションに出くわすことも多く、実践的な答え合わせが出来て嬉しかったです。ありがとうございました。</blockquote><figcaption>Kさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>めちゃくちゃ面白かった！！！ 私自身、大学まで英語を勉強し続けて英語を話せないコンプレックスがあったのですが、今日の授業を聞いて、「もしかして英語って簡単かも？！」と思えました。 1つの単語に1つのイメージ！すごいです。</blockquote><figcaption>Kさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>今まで習ったり、見たりした英語教材の中で一番面白くわかりやすかったです。 もしかしたら話せるかも。と期待してしまう内容でした。</blockquote><figcaption>Aさん（社会人）</figcaption></figure>
<figure data-ku="大学生"><blockquote>卒業から半年経って忘れかけているところも少しあったので、あの頃の雰囲気も含めて思い出せて良かったです。本も気になるので出たら本屋に行ってみようと思います。私事ですが、おかげさまで大学で受けた初めてのTOEICで690点をとることができました。今年度中にもう一回あるので次は800点を目指して頑張ります。今日はありがとうございました。</blockquote><figcaption>Mさん（大学生）</figcaption></figure>
<figure data-ku="社会人"><blockquote>氷河期世代の受験生です。大量の単語と熟語を覚え、毎日長文を訳し、紙の辞書は手垢で真っ黒にしました…しかし喋れません（笑）典型的な昭和の受験英語であっても、大量に英語を浴び続けることで、語感（田尾先生がお話された通り、単語の根っこにあるイメージ）は少しは得ることができました。ただし、時間がかかった！！とにかく遠回りした！！と思います。その根っこの感覚を、子どもたちが身構えずに吸収できる環境が整えば、日本人の英語によるコミュニケーション力はもっと向上すると思います。</blockquote><figcaption>Mさん（社会人）</figcaption></figure>
<figure data-ku="大学生"><blockquote>今までの英語は本当に嫌いで全くわからなくて逃げてきたのですが、今回の講演会を聞いて英語ってこんなに簡単にわかるんだ！？と感じました。ありがとうございました。</blockquote><figcaption>Sさん（大学生）</figcaption></figure>
<figure data-ku="社会人"><blockquote>外国人と会うと目をそらしてしまうくらい苦手な英語ですが、英語が楽しいと感じる事が出来ました。ありがとうございました。</blockquote><figcaption>Tさん（社会人）</figcaption></figure>
<figure data-ku="大学生"><blockquote>fitの超感覚の授業を久しぶりに受けました。 大学生になって、実際に海外にいくきっかけが増え、そこでも超感覚で学習したことを活かすことができ使える英語の大切さを実感しています。</blockquote><figcaption>Tさん（大学生）</figcaption></figure>
<figure data-ku="大学生"><blockquote>初めて講義で寝なかった。こんな講義は初めてだった。楽しかった。</blockquote><figcaption>Nさん（大学生）</figcaption></figure>
<figure data-ku="社会人"><blockquote>英語、abcde.で諦めた僕でも、楽しみながら参加しながら勉強になりました。講演（イベント）に対する勉強にもなりました。英語勉強します。</blockquote><figcaption>Yさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>目から鱗の60代です！もっと聞いてみたい講座でした。</blockquote><figcaption>Cさん（社会人）</figcaption></figure>
<figure data-ku="大学生"><blockquote>今回のセミナーに参加させて頂いて、これまでの英語講座で、1つの単語と1つのイメージというものの中で教えてくださってきたことを改めて目で見ることができて、凄く楽しく学ぶことができました。特に、今までは授業の中でという事だったので、手で表現などという形でしたが、今回は、fitの先生方が準備してくださって、実際にどのように使うのか、など凄く理解できて、更に英語の楽しさを知ることができました。このような素晴らしいセミナーを公演して頂き、本当にありがとうございました。</blockquote><figcaption>Yさん（大学生）</figcaption></figure>
<figure data-ku="社会人"><blockquote>本日、「超感覚英語セミナー」に参加させていただきました。 まず心を打たれたのは、若い皆さんが一つの目標に向かい、全力でイベントをつくり上げている姿です。 会場の準備から運営、参加者への細やかな心配りまで、その一つひとつに情熱と真剣さが込められていました。世代を超えて、多くの人の心を動かす素晴らしい力を感じました。 そして、田尾先生のセミナーにも大変感激いたしました。 英語は、知識として覚えるだけのものではなく、人とつながり、世界を広げるためのもの。そんな英語本来の楽しさと可能性を、あらためて教えていただきました。 田尾先生の言葉と、若い皆さんのひたむきな姿から、たくさんの勇気とエネルギーをいただいた一日でした。 この素晴らしい機会にご一緒できたことに、心より感謝申し上げます。本当にありがとうございました🙇‍♂️✨</blockquote><figcaption>Hさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>fitに通っていた頃を思い出す90分でした。 大学受験が終わった後、英語に触れることはほとんど無くなり、気づけば英語がまた「話せなくなる」ようになっていました。 英語の必要性を感じながらも、学校教育での英語が根付いてしまい、英語習得の難しさや複雑さを強く感じて身につけることから遠ざかっていました。 今日、超感覚英語を改めて体感し、改めて英語の楽しさやfitの思いや素敵さを再認識できました。 今日のような日常会話を簡単な英語で成り立つ講義(様々なシチュエーション)があると楽しみです！ 書籍、楽しみにしてます📚 fit with you.</blockquote><figcaption>Nさん（社会人）</figcaption></figure>
<figure data-ku="社会人"><blockquote>高校と大学で何度も受けてきた授業ですが、今回は田尾先生たちの近況や想いをお伺いし、社会人になったからこそ響く内容があり、非常に参加して良かったです。社会人になって学生時代とは違うスタンスの環境の中におり、色んな面で熱意や興味だけでは通用しなくなり、憤りを感じていました。しかし、久しぶりにfitの超感覚英語を受けて、学生時代の気持ちや、世界は広いんだ！ということを思い出すことができました。愛媛活性化の企画とのことでしたが、私の生き方も活性化してくださったと思います。お誘いいただき、ありがとうございました。またお会いできることを楽しみにしています！</blockquote><figcaption>Hさん（社会人）</figcaption></figure>

(function(){
  var STEP=60,shown=STEP,ku='';
  var cards=[].slice.call(document.querySelectorAll('#list figure')),more=document.getElementById('more');
  function draw(){
    var n=0,total=0;
    cards.forEach(function(c){
      var ok=!ku||c.getAttribute('data-ku')===ku;
      if(ok){total++;}
      c.hidden=!(ok&&n<shown); if(ok&&n<shown){n++;}
    });
    more.parentNode.style.display=total>n?'':'none';
    more.textContent='もっと見る（あと'+(total-n)+'件）';
  }
  more.addEventListener('click',function(){shown+=STEP;draw();});
  [].forEach.call(document.querySelectorAll('nav button'),function(b){
    b.addEventListener('click',function(){
      ku=b.getAttribute('data-ku');shown=STEP;
      [].forEach.call(document.querySelectorAll('nav button'),function(x){x.classList.toggle('on',x===b);});
      draw();
    });
  });
  draw();
})();
</script>
</body>
</html>

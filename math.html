// ===== 数学テスト（平方完成）=====

// 分数を約分して文字列に
function gcd(a,b){ return b===0?Math.abs(a):gcd(b,a%b); }

// 縦並び分数HTML
function fracHTML(n,d){
  if(n===0)return '0';
  const g=gcd(Math.abs(n),Math.abs(d));
  let nn=n/g, dd=d/g;
  if(dd<0){nn=-nn;dd=-dd;}
  if(dd===1)return String(nn);
  return '<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.82em;line-height:1.2;margin:0 1px">'+
    '<span style="border-bottom:1.5px solid currentColor;padding:0 3px;text-align:center">'+nn+'</span>'+
    '<span style="padding:0 3px;text-align:center">'+dd+'</span>'+
  '</span>';
}

// 平方完成：y=ax²+bx+c → y=a(𝑥+p)²+q
function completeSquare(a,b,c){
  const pNum=b, pDen=2*a;
  const g1=gcd(Math.abs(pNum),Math.abs(pDen));
  let pN=pNum/g1, pD=pDen/g1;
  if(pD<0){pN=-pN;pD=-pD;}
  const qNum=4*a*c-b*b, qDen=4*a;
  const g2=gcd(Math.abs(qNum),Math.abs(qDen));
  let qN=qNum/g2, qD=qDen/g2;
  if(qD<0){qN=-qN;qD=-qD;}
  return {a,pN,pD,qN,qD};
}

// 答えのHTML
function ansHTML(res){
  const {a,pN,pD,qN,qD}=res;
  let aStr=a===1?'':a===-1?'-':String(a);
  let xStr;
  if(pN===0){
    xStr='𝑥';
  } else {
    const pF=fracHTML(Math.abs(pN),pD);
    const sign=pN>0?'+':'-';
    xStr='(𝑥'+sign+pF+')';
  }
  let qStr='';
  if(qN!==0){
    const qF=fracHTML(Math.abs(qN),qD);
    qStr=(qN>0?'+':'-')+qF;
  }
  return '𝑦='+aStr+xStr+'²'+qStr;
}

// 答えの一意キー（比較用）
function ansKey(res){
  return res.a+'|'+res.pN+'|'+res.pD+'|'+res.qN+'|'+res.qD;
}

// 問題生成
function makeQuestion(level){
  let a,b,c;
  if(level===1){
    // Q1,Q2：a=1, b偶数 → 整数答え
    a=1;
    const bL1=[-6,-4,-2,2,4,6];
    b=bL1[Math.floor(Math.random()*bL1.length)];
    c=Math.floor(Math.random()*9)-4;
  } else if(level===2){
    // Q3：a=1, b奇数 → 分数答え
    a=1;
    const bL2=[-5,-3,-1,1,3,5,7,-7];
    b=bL2[Math.floor(Math.random()*bL2.length)];
    c=Math.floor(Math.random()*11)-4;
  } else {
    // Q4,Q5：a=2 or 3、bを2aの倍数にして整数答え
    a=[2,2,3,2,3][Math.floor(Math.random()*5)];
    const mult=(Math.floor(Math.random()*3)+1)*(Math.random()<0.5?1:-1);
    b=mult*2*a;
    c=Math.floor(Math.random()*13)-5;
  }

  const correctRes=completeSquare(a,b,c);
  const correctKey=ansKey(correctRes);
  const correctH=ansHTML(correctRes);

  // 8択生成
  // 正解：1個
  // 同じ軸・y違い：各軸2個 × 2軸 = 4個
  // 軸もy座標も違う：残り3個
  const usedKeys=new Set([correctKey]);
  const choiceHTMLs=[correctH];
  const qOffs=[-3,-2,-1,1,2,3,4,-4];

  // ① 正解と同じ軸(b同じ)でqだけ違うダミーを2個
  let axis1Count=0;
  for(const qo of [...qOffs].sort(()=>Math.random()-0.5)){
    if(axis1Count>=2) break;
    const fRes=completeSquare(a,b,c+qo); // bは同じ＝軸は同じ
    const fKey=ansKey(fRes);
    if(!usedKeys.has(fKey)){
      usedKeys.add(fKey); choiceHTMLs.push(ansHTML(fRes)); axis1Count++;
    }
  }

  // ② 別の軸（bをずらす）でqも少しずらして2個
  const bOff = level<3 ? 2 : 2*a; // 軸がちょうどずれる量
  const bSign = Math.random()<0.5 ? 1 : -1;
  const b2 = b + bSign * bOff; // 別の軸
  let axis2Count=0;
  for(const qo of [...qOffs].sort(()=>Math.random()-0.5)){
    if(axis2Count>=2) break;
    const fRes=completeSquare(a,b2,c+qo);
    const fKey=ansKey(fRes);
    if(!usedKeys.has(fKey)){
      usedKeys.add(fKey); choiceHTMLs.push(ansHTML(fRes)); axis2Count++;
    }
  }

  // ③ 軸もyも全然違うダミーで残りを埋める（計8個に）
  const offs=[-3,-2,-1,1,2,3];
  let tries=0;
  while(choiceHTMLs.length<8 && tries<100){
    tries++;
    const o1=offs[Math.floor(Math.random()*offs.length)];
    const o2=offs[Math.floor(Math.random()*offs.length)];
    const fb=level<3?b+o1*2:b+o1*2*a;
    const fRes=completeSquare(a,fb,c+o2);
    const fKey=ansKey(fRes);
    if(!usedKeys.has(fKey)){
      usedKeys.add(fKey); choiceHTMLs.push(ansHTML(fRes));
    }
  }
  const choices=choiceHTMLs.sort(()=>Math.random()-0.5);

  // 問題文HTML
  let qStr='𝑦=';
  if(a!==1&&a!==-1)qStr+=a;
  if(a===-1)qStr+='-';
  qStr+='𝑥²';
  if(b>0)qStr+='+'+b+'𝑥';
  else if(b<0)qStr+=b+'𝑥';
  if(c>0)qStr+='+'+c;
  else if(c<0)qStr+=c;

  return {
    question:qStr,
    choices,
    correct:correctH,
    level,
    timeLimit:level===1?20:60,
    explanation:qStr+'　＝　'+correctH
  };
}

function startMathTest(){
  clearInterval(mTimer);
  mIdx=0; mOK=0; mNG=0; mHistory=[];
  mQuestions=[];
  // Q1,Q2: level1, Q3-5: level2
  for(let i=0;i<5;i++){
    const lv = i<2?1:i===2?2:3;
    mQuestions.push(makeQuestion(lv));
  }
  document.getElementById('math-start').style.display='none';
  document.getElementById('math-result').style.display='none';
  document.getElementById('math-quiz').style.display='flex';
  mShowQ();
}

function mShowQ(){
  const q=mQuestions[mIdx];
  mAnswered=false;
  document.getElementById('m-feedback').style.display='none';
  document.getElementById('m-q-num').textContent='問題 '+(mIdx+1)+' / 5　（'+(q.level===1?'基本':'標準')+'）';
  document.getElementById('m-score').textContent='✅ '+mOK+'　❌ '+mNG;
  document.getElementById('m-prog-bar').style.width=(mIdx/5*100)+'%';
  document.getElementById('m-question').innerHTML=q.question;

  // 選択肢
  const cont=document.getElementById('m-choices');
  cont.innerHTML='';
  q.choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.innerHTML=c;
    btn.style.cssText='width:100%;padding:9px 12px;background:#fff;border:1.5px solid #C8A0D8;border-radius:9px;font-size:13px;font-weight:500;color:#2C2C2A;cursor:pointer;text-align:left;display:block;font-family:STIX Two Math,Cambria Math,Georgia,Times New Roman,serif';
    btn.onclick=()=>mAnswer(c===q.correct,btn,q.correct);
    cont.appendChild(btn);
  });

  // タイマー
  mTimeLeft=q.timeLimit;
  document.getElementById('m-timer-num').textContent=mTimeLeft;
  document.getElementById('m-timer-bar').style.width='100%';
  document.getElementById('m-timer-bar').style.transition='none';
  setTimeout(()=>{
    document.getElementById('m-timer-bar').style.transition='width 1s linear';
    document.getElementById('m-timer-bar').style.width='0%';
  },50);

  clearInterval(mTimer);
  mTimer=setInterval(()=>{
    mTimeLeft--;
    document.getElementById('m-timer-num').textContent=mTimeLeft;
    if(mTimeLeft<=5){
      document.getElementById('m-timer-num').style.color='#D94040';
      document.getElementById('m-timer-bar').style.background='#D94040';
    } else {
      document.getElementById('m-timer-num').style.color='#7B2D8B';
      document.getElementById('m-timer-bar').style.background='#7B2D8B';
    }
    if(mTimeLeft<=0){
      clearInterval(mTimer);
      mTimeOut();
    }
  },1000);
}

function mTimeOut(){
  if(mAnswered)return;
  mAnswered=true;
  mNG++;
  const q=mQuestions[mIdx];
  mHistory.push({q,ok:false,timeout:true});
  // 正解を緑に
  document.querySelectorAll('#m-choices button').forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.correct){b.style.background='#EAF5E1';b.style.borderColor='#3B6D11';b.style.color='#3B6D11';}
  });
  const fb=document.getElementById('m-feedback');
  fb.style.display='block';
  fb.style.background='#FFECEC';fb.style.color='#D94040';
  fb.textContent='⏱ 時間切れ！　正解：'+q.correct;
  setTimeout(mNext,1800);
}

function mAnswer(correct,btn,correctAns){
  if(mAnswered)return;
  mAnswered=true;
  clearInterval(mTimer);
  const q=mQuestions[mIdx];
  document.querySelectorAll('#m-choices button').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correctAns){b.style.background='#EAF5E1';b.style.borderColor='#3B6D11';b.style.color='#3B6D11';}
  });
  const fb=document.getElementById('m-feedback');
  fb.style.display='block';
  if(correct){
    mOK++;
    mHistory.push({q,ok:true,timeout:false});
    fb.style.background='#EAF5E1';fb.style.color='#3B6D11';
    fb.textContent='✅ 正解！';
  } else {
    mNG++;
    mHistory.push({q,ok:false,timeout:false});
    btn.style.background='#FFECEC';btn.style.borderColor='#D94040';btn.style.color='#D94040';
    fb.style.background='#FFECEC';fb.style.color='#D94040';
    fb.textContent='❌ 不正解　正解：'+correctAns;
  }
  setTimeout(mNext,1500);
}

function mNext(){
  mIdx++;
  if(mIdx>=5)mShowResult();else mShowQ();
}

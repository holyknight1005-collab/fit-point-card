<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5A623">
<meta name="robots" content="noindex">
<title>fit 時間割</title>
<!-- 20261018tb1: 印刷用CSSの括弧を修正／共テ対策のコマを紫の帯で区別 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#FAF7F2; --line:#999; --thin:#DDD5C8; --muted:#6F695F; --head:#F4F1EA; --sat:#2D5FA6; --sun:#C0392B; --orange:#F5A623; --orange-l:#FFF3DC; --off:#FBEAEA; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:#222;font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font-family:inherit}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #E6DFD3}
.top-in{max-width:1300px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-in .brand{font-size:13px;color:var(--muted);font-weight:700}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{width:34px;height:32px;border:1px solid #E6DFD3;background:#fff;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;color:#222}
.mnav .lbl{font-size:15px;font-weight:800;min-width:96px;text-align:center}
.seg{display:inline-flex;gap:6px}
.seg button{border:1px solid #E6DFD3;background:#fff;padding:5px 14px;border-radius:16px;font-size:13px;font-weight:700;color:#222;cursor:pointer}
.seg button.on{border-color:var(--orange);background:var(--orange);color:#fff}
.spacer{flex:1}
.back-btn{border:1px solid var(--orange);background:#fff;color:var(--orange);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.back-btn[hidden]{display:none}
.today-btn{border:1px solid #E6DFD3;background:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
main{max-width:1300px;margin:0 auto;padding:14px 16px 40px}
.ttl{font-size:20px;font-weight:800;margin:0 0 2px}
.ttl small{font-size:14px;margin-left:10px}
.upd{font-size:12px;color:var(--muted);margin:0 0 8px}
.timebox{font-size:13px;line-height:1.8;margin-bottom:12px;color:#333}
.timebox .tr{display:block}
.timebox .tl{font-weight:700;margin-right:6px;white-space:nowrap}
.timebox .tl.we{color:var(--sat)}
.timebox .ts span{white-space:nowrap;margin-right:12px;display:inline-block}
.tools{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.tools input{flex:1;min-width:180px;max-width:360px;border:1px solid #E6DFD3;border-radius:8px;padding:7px 10px;font-size:14px;background:#fff}
.gsel{display:inline-flex}
.gsel button{border:1px solid #E6DFD3;background:#fff;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:#444}
.gsel button+button{border-left:0}
.gsel button:first-child{border-radius:8px 0 0 8px}
.gsel button:last-child{border-radius:0 8px 8px 0}
.gsel button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.tools .clr{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px}
#viewtabs{display:inline-flex;margin-left:auto}
#viewtabs button{border:1px solid #E6DFD3;background:#fff;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
#viewtabs button:first-child{border-radius:8px 0 0 8px}
#viewtabs button:last-child{border-radius:0 8px 8px 0}
#viewtabs button+button{border-left:0}
#viewtabs button.on{color:#222;font-weight:700;background:var(--head)}
.note{font-size:12px;color:var(--muted);margin:0 0 8px}
.empty{border:1px dashed #D8D0C2;background:#fff;padding:24px;text-align:center;color:var(--muted);font-size:14px}
.err{border:1px solid #E5B4B4;background:#fff;color:#A33;padding:16px;text-align:center}
.wkwrap{overflow-x:auto;margin-bottom:16px;scroll-margin-top:110px}
.wk{border-collapse:collapse;width:100%;min-width:720px;table-layout:fixed;background:#fff}
.wk th,.wk td{border:1px solid var(--line);padding:3px 4px;vertical-align:top;text-align:center;font-size:12px}
.wk thead th{background:var(--head);font-weight:700;line-height:1.35}
.wk thead th.sat{color:var(--sat)} .wk thead th.sun{color:var(--sun)}
.wk thead th.today{background:var(--orange);color:#fff}
.wk th.p{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--line),-1px 0 0 var(--line);width:34px;background:var(--head);vertical-align:middle;font-size:15px}
.wk td.none{background:repeating-linear-gradient(135deg,#E9E5DE 0,#E9E5DE 4px,#F7F5F1 4px,#F7F5F1 8px)}
.wtimes{font-size:12px;color:#444;line-height:1.7;margin:0 0 4px}
.wt b{display:inline-block;margin-right:8px;font-weight:700}
.wt b.we{color:var(--sat)}
.wt span{white-space:nowrap;margin-right:10px;display:inline-block}
.wk td.out{background:#EEE}
.wk td.off{background:var(--off)}
.wk td.today{background:var(--orange-l)}
.wk .c{padding:3px 0;border-bottom:1px solid var(--thin);line-height:1.35;word-break:break-all}
.wk .c:last-child{border-bottom:0}
.wk .offt{display:block;font-size:10px;color:var(--sun);font-weight:700}
.wk thead th.today .offt{color:#fff}
.x{font-size:10px;color:#B0632A;display:block}
.x.s{color:var(--muted);display:inline}
.cy{margin-left:3px;font-weight:700;color:#9A5A00;white-space:nowrap}
.day{background:#fff;border:1px solid var(--line);margin-bottom:10px;scroll-margin-top:60px}
.day-h{background:var(--head);border-bottom:1px solid var(--line);padding:6px 10px;font-weight:700}
.day-h .sat{color:var(--sat)} .day-h .sun{color:var(--sun)}
.day.today .day-h{background:var(--orange);color:#fff}
.day.today .day-h span{color:#fff}
.offbar{padding:6px 10px;color:var(--sun);font-weight:700;border-bottom:1px solid var(--thin);background:var(--off)}
.slot{display:flex;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot .tm{flex:0 0 40px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--head);border-right:1px solid var(--line)}
.slot .cl{flex:1;min-width:0}
.slot .cl div{padding:6px 10px;border-top:1px solid var(--thin)}
.slot .cl div:first-child{border-top:0}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.7}
.wk .c.ct,.slot .cl div.ct{background:#F3EDFB;box-shadow:inset 3px 0 0 #7B4FBF}
.ctb{display:inline-block;margin-right:3px;padding:0 4px;border-radius:4px;background:#7B4FBF;color:#fff;font-size:10px;font-weight:700;vertical-align:1px}
.gsel button#gct.on,.gsel button.gpk.on{background:#7B4FBF;border-color:#7B4FBF;color:#fff}
.ct-h{font-size:18px;font-weight:800;margin:0 0 2px}
.ct-sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.ct-sub b{color:#7B4FBF}
.ct-mode{display:inline-flex;margin:0 0 12px}
.ct-mode button{border:1px solid #E6DFD3;background:#fff;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#444}
.ct-mode button:first-child{border-radius:8px 0 0 8px}
.ct-mode button:last-child{border-radius:0 8px 8px 0;border-left:0}
.ct-mode button.on{background:#7B4FBF;border-color:#7B4FBF;color:#fff}
.ct-row{display:flex;gap:8px;align-items:baseline;padding:6px 12px;border-top:1px solid var(--thin);font-size:14px}
.ct-row:first-of-type{border-top:0}
.ct-row .no{flex:0 0 48px;font-weight:700;color:#7B4FBF}
.ct-row .dt{flex:0 0 92px;font-weight:700}
.ct-row .dt .sat{color:var(--sat)} .ct-row .dt .sun{color:var(--sun)}
.ct-row .tm{color:#444;font-size:13px;white-space:nowrap}
.ct-row>span:last-child{flex:1;min-width:0}
.ct-row .nm{font-weight:700}
.ct-row.past{color:#AAA;background:#FAFAFA}
.ct-row.past .no,.ct-row.past .dt .sat,.ct-row.past .dt .sun,.ct-row.past .tm{color:#AAA}
.ct-row.next{background:#FFF3DC}
.ct-next{display:inline-block;margin-left:4px;padding:0 6px;border-radius:8px;background:var(--orange);color:#fff;font-size:11px;font-weight:700}
.ct-mon{font-size:14px;font-weight:800;margin:14px 0 6px;padding-left:8px;border-left:4px solid #7B4FBF}
.ct-list{background:#fff;border:1px solid var(--line)}
.ctt{background:#fff;border:1px solid var(--line)}
.ctt-g{background:#7B4FBF;color:#fff;font-weight:800;padding:5px 12px;font-size:14px}
.ctt-r{display:flex;border-top:1px solid var(--line)}
.ctt-g+.ctt-r{border-top:0}
.ctt-l{flex:0 0 110px;background:var(--head);border-right:1px solid var(--line);padding:8px 10px;font-weight:800;font-size:14px;display:flex;align-items:center}
.ctt-c{flex:1;min-width:0;display:flex;flex-wrap:wrap}
.ctt-i{flex:0 0 25%;min-width:200px;padding:6px 10px;border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);font-size:13px;white-space:nowrap}
.ctt-i b{color:#7B4FBF;margin-right:4px}
.ctt-i .sat{color:var(--sat)} .ctt-i .sun{color:var(--sun)}
.ctt-i.past{color:#AAA;background:#FAFAFA}
.ctt-i.past b,.ctt-i.past .sat,.ctt-i.past .sun{color:#AAA}
.ctt-i.next{background:#FFF3DC}
.ctt-msg{padding:8px 12px;font-size:13px;font-weight:700;color:#9A5A00}
@media (max-width:600px){ .ctt-r{display:block} .ctt-l{border-right:0;border-bottom:1px solid var(--thin);padding:5px 10px} .ctt-i{flex-basis:50%;min-width:0;font-size:12px;padding:5px 8px} }
@media (max-width:600px){ .wk th,.wk td{font-size:11px;padding:2px} .wk{min-width:640px} }
@media print{ .top,.tools{display:none!important} body{background:#fff} .wk{break-inside:avoid} }
</style>

</head>
<body>
<div class="top"><div class="top-in">
  <button class="back-btn" id="backBtn" hidden>← アプリに戻る</button>
  <span class="brand">総合学習塾fit</span>
  <div class="mnav"><button id="prev" aria-label="前の月">‹</button><span class="lbl" id="mlabel">―</span><button id="next" aria-label="次の月">›</button></div>
  <div class="seg" id="seg"><button data-d="ko">高校</button><button data-d="sotsu">高卒</button><button data-d="chu">中学</button></div>
  <span class="spacer"></span>
  <button class="today-btn" id="todayBtn">今日</button>
</div></div>
<main>
  <div class="ttl" id="ttl"></div>
  <div class="upd" id="upd"></div>
  <div class="timebox" id="timebox"></div>
  <div class="tools">
    <div class="gsel" id="gsel"><button data-g="">全学年</button><button data-g="1">1年</button><button data-g="2">2年</button><button data-g="3">3年</button><button data-g="ct" id="gct">共テ対策日程</button></div>
    <input id="q" type="search" placeholder="授業名でしぼりこみ（例：附属）" enterkeyhint="search"><button class="clr" id="qclear">クリア</button>
    <div id="viewtabs"><button data-v="week">1ヶ月の表</button><button data-v="day">日ごと</button></div>
  </div>
  <div id="content"><div class="empty">読み込み中…</div></div>
  <div class="foot">総合学習塾 fit ／ 授業の追加・変更はこのページに随時反映されます。</div>
</main>
<script>
(function () {
  var SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var CIRC = ['⓪', '①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨'];
  var DEF = { 1: ['10:20', '11:50'], 2: ['12:30', '14:00'], 3: ['14:20', '15:50'], 4: ['16:10', '17:40'], 5: ['18:00', '19:30'], 6: ['19:50', '21:20'] };

  var qs = new URLSearchParams(location.search);
  // 20261021ks12: 生徒ホーム（app.html）から開いたとき（from=app）だけ「← アプリに戻る」を出す。保護者のリンクには出さない。
  //   新しいタブで開いた → タブを閉じる／同じタブで開いた → 前の画面へ／どちらもできない → app.html を開く
  (function () {
    var b = document.getElementById('backBtn');
    if (!b || qs.get('from') !== 'app') return;
    b.hidden = false;
    b.addEventListener('click', function () {
      if (window.opener && !window.opener.closed) { try { window.close(); } catch (e) {} }
      else if (history.length > 1 && /app\.html/.test(document.referrer || '')) { history.back(); return; }
      setTimeout(function () { if (!window.closed) location.href = 'app.html'; }, 300);
    });
  })();
  var state = {
    div: (qs.get('d') === 'chu' || qs.get('d') === 'sotsu') ? qs.get('d') : 'ko',   // 20261020ks1: sotsu＝高卒（高卒生の授業＋共テ対策）
    month: /^\d{4}-\d{2}$/.test(qs.get('m') || '') ? qs.get('m') : null,
    kosotsu: qs.get('k') === '1',
    view: null, q: '', g: '', data: null
  };
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  state.q = load('fit_tt_q') || '';
  state.g = /^[123]$/.test(qs.get('g') || '') ? qs.get('g') : (load('fit_tt_g') || '');
  state.view = load('fit_tt_view2') || 'week';
  if (state.view === 'ct') state.view = 'week';   // 共テ対策の表示は覚えない（URLの v=ct で開いたときだけ）
  if (qs.get('v') === 'ct' && state.div !== 'chu') state.view = 'ct';
  // 20261012pk1: ピックアップ（スタッフが期間を決めて出すボタン。?p=番号 で直接開く）
  state.picks = null;    // null＝未取得・公開関数なし（そのときは従来の「共テ対策日程」ボタン）
  state.pickId = null;
  state.pcache = {};     // ピックアップの授業日（番号ごと）
  if (/^\d+$/.test(qs.get('p') || '')) { state.view = 'pick'; state.pickId = +qs.get('p'); }
  state.ctMode = load('fit_tt_ctmode') === 'date' ? 'date' : 'course';

  function pad(n) { return String(n).padStart(2, '0'); }
  // 20261020ks1: 高卒は高校部のデータ（高卒生の授業を含めて取得）から、高卒生の授業と共テ対策だけを出す。時刻も高校と同じ。
  function apiDiv() { return state.div === 'chu' ? '中学部' : '高校部'; }
  function divName() { return state.div === 'chu' ? '中学' : state.div === 'sotsu' ? '高卒' : '高校'; }
  function todayJST() {
    var d = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function minus(hhmm, m) { var p = hhmm.split(':'), t = +p[0] * 60 + +p[1] - m; return pad(Math.floor(t / 60)) + ':' + pad(t % 60); }
  if (!state.month) state.month = todayJST().slice(0, 7);

  // その日・その限の時刻（期間設定の上書き → 既定）。中学は終了10分前。
  function ptime(ds, p, periods) {
    var pr = null, ov = periods || (state.data && state.data.periods) || [];
    var parts = ds.split('-'), dw = new Date(+parts[0], +parts[1] - 1, +parts[2]).getDay(), isodow = dw === 0 ? 7 : dw;
    for (var i = 0; i < ov.length; i++) {
      var o = ov[i];
      if (+o.period !== p || ds < o.start_date || ds > o.end_date) continue;
      if (o.weekdays && o.weekdays.length && o.weekdays.indexOf(isodow) === -1) continue;
      pr = [o.start, o.end]; break;
    }
    if (!pr && DEF[p]) pr = DEF[p].slice();
    if (pr && state.div === 'chu') pr = [pr[0], minus(pr[1], 10)];
    return pr;
  }

  async function fetchData(month) {
    var res = await fetch(SB_URL + '/rest/v1/rpc/fit_public_timetable', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_month: month || state.month, p_division: apiDiv(), p_kosotsu: state.div === 'sotsu' ? true : state.kosotsu })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  // 授業の回（①／11-①）。別の公開関数から受け取る。無い（SQL未実行・失敗）ときは回を出さないだけ。
  async function fetchCycles() {
    try {
      var res = await fetch(SB_URL + '/rest/v1/rpc/fit_public_timetable_cycles', {
        method: 'POST',
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_month: state.month, p_division: apiDiv() })
      });
      if (!res.ok) return {};
      var rows = await res.json(), map = {};
      (rows || []).forEach(function (r) {
        var lab = cycLabel(r.d, r.cycle_month, r.cycle_no);
        if (lab) map[r.d + '|' + r.name + '|' + String(r.school || '').replace(/^SSS[：:]\s*/, '')] = lab;
      });
      return map;
    } catch (e) { return {}; }
  }
  // ピックアップの一覧（今日が表示期間に入っているもの）。公開関数が無い・失敗のときは null。
  async function fetchPicks() {
    try {
      var res = await fetch(SB_URL + '/rest/v1/rpc/fit_public_timetable_picks', {
        method: 'POST',
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_division: apiDiv() })
      });
      if (!res.ok) return null;
      var list = (await res.json()) || [];
      if (state.div === 'sotsu') list = list.filter(function (x) { return x.category === 'common_test'; });   // 高卒は共テのピックアップだけ
      return list;
    } catch (e) { return null; }
  }
  // その日の月と同じ月の回は「①」、違う月の回は「11-①」「9-④」
  function circ(n) { n = parseInt(n, 10); if (isNaN(n) || n < 1) return ''; return n <= 20 ? String.fromCharCode(0x2460 + n - 1) : '(' + n + ')'; }
  function cycLabel(ds, cm, no) {
    if (!ds || no == null) return '';
    var c = circ(no); if (!c) return '';
    if (cm == null) return c;   // 20261012cy2: 時期別講座・共テ対策は「何回目か」だけ（例：共通テスト対策英語②）
    return (parseInt(cm, 10) === parseInt(String(ds).slice(5, 7), 10)) ? c : (parseInt(cm, 10) + '-' + c);
  }

  function build() {
    var D = state.data, q = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var cells = {}, used = {};
    (D.sessions || []).forEach(function (s) {
      var school = String(s.school || '').replace(/^SSS[：:]\s*/, '');
      if (state.div === 'sotsu' && !(s.kosotsu || isCT(s.name))) return;   // 高卒：高卒生の授業＋共テ対策
      // 学年でしぼる：その学年の授業と、学年の決まっていない授業（全学年向け）を残す（高卒は学年なし）
      if (state.div !== 'sotsu' && state.g && s.grades && String(s.grades).split(/[^0-9]+/).indexOf(state.g) === -1) return;
      var hay = (pubName(s.name) + ' ' + school + ' ' + (s.subject || '')).toLowerCase();
      if (q.length && !q.every(function (w) { return hay.indexOf(w) !== -1; })) return;
      var p = s.period;
      if (p == null) {   // 限が無い回は開始時刻の近い限へ
        if (!s.start) return;
        var best = null, bd = 1e9, sm = +s.start.slice(0, 2) * 60 + +s.start.slice(3, 5);

    var body = state.view === 'week' ? renderWeek(b) : renderDay(b);
    var total = Object.keys(b.cells).length;
    if (!total) body = '<div class="empty">' + (state.q ? '「' + esc(state.q) + '」に合う授業はこの月にありません。' : 'この月の授業はまだ登録されていません。') + '</div>' + (state.view === 'week' ? body : '');
    var notes = [];
    if (state.g && state.div !== 'sotsu') notes.push(state.g + '年');
    if (state.q) notes.push('「' + esc(state.q) + '」');
    var hasCt = Object.keys(b.cells).some(function (k) { return b.cells[k].some(function (c) { return c.ct; }); });
    el.innerHTML = (notes.length ? '<div class="note">' + notes.join('・') + 'でしぼりこみ中（学年の決まっていない授業も表示）</div>' : '') +
      (hasCt ? '<div class="note"><span class="ctb">共テ</span>紫の帯の授業は共通テスト対策です</div>' : '') + body;
    if (scrollToday) goToday(true);
  }

  // 学年の並びの右に、ピックアップのボタンを出す（公開関数が無いときは従来の「共テ対策日程」）
  function renderPickButtons() {
    var g = document.getElementById('gsel');
    g.querySelectorAll('.gpk').forEach(function (b) { b.remove(); });
    document.getElementById('gct').style.display = (!state.picks && state.div !== 'chu') ? '' : 'none';
    (state.picks || []).forEach(function (P) {
      var b = document.createElement('button');
      b.className = 'gpk'; b.setAttribute('data-g', 'pk' + P.id); b.textContent = P.label;
      b.onclick = function () { state.view = 'pick'; state.pickId = +P.id; render(true); };
      g.appendChild(b);
    });
  }
  function goToday(soft) {
    var t = todayJST();
    if (state.month !== t.slice(0, 7)) { if (soft) return; state.month = t.slice(0, 7); reload(true); return; }
    if (state.view === 'day') {
      var secs = document.querySelectorAll('section.day');
      for (var i = 0; i < secs.length; i++) { if (secs[i].id.slice(2) >= t) { secs[i].scrollIntoView({ block: 'start' }); return; } }
    } else {
      var th = document.querySelector('.wk thead th.today');
      if (th) {
        var wrap = th.closest('.wkwrap');
        wrap.scrollIntoView({ block: 'start' });
        if (wrap.scrollWidth > wrap.clientWidth) { var pc = wrap.querySelector('th.p'); wrap.scrollLeft = Math.max(0, th.offsetLeft - (pc ? pc.offsetWidth : 0)); }   // スマホ：今日の列が見えるように横へ
      }
    }
  }

  async function reload(scrollToday) {
    document.getElementById('content').innerHTML = '<div class="empty">読み込み中…</div>';
    var key = state.month + '|' + state.div;
    try {
      var needPicks = !state.picksDiv || state.picksDiv !== state.div;
      var both = await Promise.all([fetchData(), fetchCycles(), needPicks ? fetchPicks() : Promise.resolve(state.picks)]);
      var d = both[0];
      if (key !== state.month + '|' + state.div) return;
      state.data = d;
      state.cycles = both[1];
      if (needPicks) {
        state.picks = both[2]; state.picksDiv = state.div; state.pcache = {};
        // 旧URL（?v=ct）は「共テ」の区分のピックアップへ。開いていたピックアップが期間外・別の部なら通常の表へ。
        if (state.picks && state.view === 'ct') {
          var ctp = state.picks.filter(function (x) { return x.category === 'common_test'; })[0];
          if (ctp) { state.view = 'pick'; state.pickId = +ctp.id; } else state.view = 'week';
        }
        if (state.view === 'pick' && !pickOf(state.pickId)) state.view = 'week';
      }
      render(scrollToday);
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="err">時間割を読み込めませんでした。時間をおいて開き直してください。</div>';
    }
    syncUrl();
  }
  function syncUrl() {
    var u = new URL(location.href);
    u.searchParams.set('d', state.div);
    if (state.month === todayJST().slice(0, 7)) u.searchParams.delete('m'); else u.searchParams.set('m', state.month);
    if (state.view === 'ct') u.searchParams.set('v', 'ct'); else u.searchParams.delete('v');
    if (state.view === 'pick') u.searchParams.set('p', state.pickId); else u.searchParams.delete('p');
    try { history.replaceState(null, '', u.toString()); } catch (e) {}
  }

  function shift(n) {
    var p = state.month.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1);
    state.month = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    reload(false);
  }

  document.getElementById('prev').onclick = function () { shift(-1); };
  document.getElementById('next').onclick = function () { shift(1); };
  document.getElementById('todayBtn').onclick = function () { goToday(false); };
  document.querySelectorAll('#seg button').forEach(function (bt) { bt.onclick = function () { state.div = bt.getAttribute('data-d'); reload(false); }; });
  document.querySelectorAll('#viewtabs button').forEach(function (bt) { bt.onclick = function () { state.view = bt.getAttribute('data-v'); store('fit_tt_view2', state.view); render(true); }; });
  document.querySelectorAll('#gsel button').forEach(function (bt) { bt.onclick = function () {
    var g = bt.getAttribute('data-g');
    if (g === 'ct') { state.view = 'ct'; render(true); return; }   // 共テ対策日程（学年の選択はそのまま残す）
    var wasCt = state.view === 'ct' || state.view === 'pick';
    if (wasCt) state.view = (load('fit_tt_view2') === 'day') ? 'day' : 'week';
    if (state.div === 'sotsu') { render(wasCt); return; }   // 高卒は学年を変えない（「時間割」で表に戻るだけ）
    state.g = g; store('fit_tt_g', state.g || null); render(wasCt);
  }; });
  var qi = document.getElementById('q'), timer = null;
  qi.value = state.q;
  qi.oninput = function () { clearTimeout(timer); timer = setTimeout(function () { state.q = qi.value; store('fit_tt_q', state.q || null); render(false); }, 200); };
  document.getElementById('qclear').onclick = function () { qi.value = ''; state.q = ''; store('fit_tt_q', null); render(false); };
    reload(true);
})();
</script>
</body>

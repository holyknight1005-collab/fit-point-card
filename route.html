<script>
// ===== fit 共通ログイン（Supabase Auth セッション）sec1 =====
// ・ID＋PINの照合はサーバー（Edge Function fit-login）で行い、ブラウザには PIN を残さない。
// ・発行されたセッションは localStorage 'fit_session_v1' に保存し、同じサイトの全アプリで共有する。
// ・Supabase への fetch は自動でログイン中のトークンに差し替え、期限切れなら自動更新して1回だけ再送する。
const FIT_SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const FIT_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const FIT_SESSION_KEY = 'fit_session_v1';
const FIT_LEGACY_KEYS = ['fit_pin', 'fit_parent_pin', 'fit_staff_hash', 'fit_staff_pin'];
let fitSession = null;
let fitRefreshing = null;
const fitRawFetch = window.fetch.bind(window);

function fitLoadSession() {
  try { fitSession = JSON.parse(localStorage.getItem(FIT_SESSION_KEY) || 'null'); } catch (e) { fitSession = fitSession || null; }
  return fitSession;
}
function fitSaveSession(s) {
  fitSession = s || null;
  try { if (s) localStorage.setItem(FIT_SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(FIT_SESSION_KEY); } catch (e) {}
}
function fitClearLegacy() {
  try { FIT_LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
// 'ok' | 'invalid'（ログインし直しが必要） | 'error'（通信エラー等。セッションは残す）| 'none'
async function fitRefresh(force) {
  const cur = fitLoadSession();
  if (!cur || !cur.refresh_token) return 'none';
  const now = Math.floor(Date.now() / 1000);
  if (!force && (cur.expires_at || 0) - now > 300) return 'ok';
  if (fitRefreshing) return fitRefreshing;
  fitRefreshing = (async () => {
    try {
      const r = await fitRawFetch(FIT_SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: cur.refresh_token })
      });
      if (r.status === 400 || r.status === 401 || r.status === 403) {
        // 別タブが先に更新していればそちらを使う
        const latest = fitLoadSession();
        if (latest && latest.refresh_token !== cur.refresh_token) return 'ok';
        fitSaveSession(null);
        return 'invalid';
      }
      if (!r.ok) return 'error';
      const j = await r.json();
      fitSaveSession(Object.assign({}, cur, {
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        expires_at: j.expires_at || (now + (j.expires_in || 3600))
      }));
      return 'ok';
    } catch (e) { return 'error'; }
    finally { fitRefreshing = null; }
  })();
  return fitRefreshing;
}
// ログイン：kind = 'staff' | 'student' | 'parent' | 'online'
// 戻り値 { ok:true, kind, account } / { ok:false, error:'invalid'|'blocked'|'locked'|... }
async function fitLogin(kind, id, pin) {
  let r, j = null;
  try {
    r = await fitRawFetch(FIT_SB_URL + '/functions/v1/fit-login', {
      method: 'POST',
      headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, id: id, pin: pin })
    });
    j = await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
  if (!j) return { ok: false, error: 'network' };
  if (j.ok) {
    fitSaveSession(Object.assign({}, j.session, { kind: j.kind, account_id: String(j.account.id) }));
    fitClearLegacy();
  }
  return j;
}
function fitLoginErrorText(j, fallback) {
  if (!j) return fallback;
  if (j.error === 'locked') return 'ログインの失敗が続いたため、15分ほど待ってからお試しください。';
  if (j.error === 'blocked') return 'このアカウントは現在ご利用いただけません。塾までお問い合わせください。';
  if (j.error === 'network' || j.error === 'server') return '通信がうまくつながりませんでした。電波の良い場所でもう一度お試しください。';
  return fallback;
}
// ===== 段階B：サーバー関数（RPC）=====
// ポイント加算・ログインボーナス・面談共有メモなどは、サーバー側の関数で行う（生徒は直接書き換えできない）。
async function fitRpc(name, args) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/rpc/' + name, {
    method: 'POST',
    headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  const tx = await r.text();
  if (!r.ok) throw new Error('rpc ' + name + ' ' + r.status + ' ' + tx);
  return tx ? JSON.parse(tx) : null;
}
// 戻り値 { awarded: 実際に加算された点, points: 加算後の合計 }
async function fitAwardPoints(type, points, reason, ref) {
  return await fitRpc('fit_award_points', { p_type: type, p_points: points, p_reason: reason || null, p_ref: ref == null ? null : String(ref) });
}
function fitLogout() {
  const s = fitSession || fitLoadSession();
  fitSaveSession(null);
  fitClearLegacy();
  if (s && s.access_token) {
    fitRawFetch(FIT_SB_URL + '/auth/v1/logout?scope=local', {
      method: 'POST', headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
    }).catch(() => {});
  }
}
// 保存済みセッションから本人の行を取り直す。旧方式（PIN保存）の端末は1回だけ自動で移行する。
// 戻り値 { kind, row } / null（未ログイン）。通信エラー時は例外（ログイン情報は消さない）。
async function fitResume() {
  let s = fitLoadSession();
  if (!s) {
    let email = null, pin = null, pid = null, ppin = null, role = null;
    try {
      email = localStorage.getItem('fit_email'); pin = localStorage.getItem('fit_pin');
      pid = localStorage.getItem('fit_parent_id'); ppin = localStorage.getItem('fit_parent_pin');
      role = localStorage.getItem('fit_role');
    } catch (e) {}
    let j = null;
    if (email && pin) j = await fitLogin(role === 'staff' ? 'staff' : 'student', email, pin);
    else if (pid && ppin) j = await fitLogin('parent', pid, ppin);
    if (j && j.error === 'network') throw new Error('network');
    fitClearLegacy();
    s = fitLoadSession();
    if (!s) return null;
  }
  const rr = await fitRefresh(false);
  if (rr === 'invalid' || rr === 'none') return null;
  s = fitLoadSession();
  if (!s) return null;
  const table = { staff: 'staff', student: 'students', parent: 'parent_accounts', online: 'online_students' }[s.kind];
  if (!table) { fitLogout(); return null; }
  // sec4: 生徒・保護者は students を直接読まず、表示用の列だけ返す関数から受け取る（生徒は自分の1行）
  const res = s.kind === 'student'
    ? await fitRawFetch(FIT_SB_URL + '/rest/v1/rpc/fit_my_students', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
        body: '{}'
      })
    : await fitRawFetch(FIT_SB_URL + '/rest/v1/' + table + '?id=eq.' + encodeURIComponent(s.account_id) + '&select=*', {
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
      });
  if (res.status === 401 || res.status === 403) {
    const again = await fitRefresh(true);
    if (again === 'invalid' || again === 'none') return null;
    throw new Error('auth ' + res.status);
  }
  if (!res.ok) throw new Error('resume ' + res.status);
  const rows = await res.json();
  if (!rows.length || rows[0].is_active === false && s.kind !== 'student') { fitLogout(); return null; }
  return { kind: s.kind, row: rows[0] };
}
// Supabase への fetch をログイン中のトークンに差し替える（各画面のコードはそのまま使える）
window.fetch = async function (input, init) {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (url.indexOf(FIT_SB_URL) !== 0 || url.indexOf('/auth/v1/') > 0 || url.indexOf('/functions/v1/fit-login') > 0) {
    return fitRawFetch(input, init);
  }
  // 呼び出し時点のトークンを控えておく（直後にログアウトしても、その前に始めた保存は通す）
  const tokenAtCall = fitLoadSession() ? fitSession.access_token : null;
  if (tokenAtCall) await fitRefresh(false);
  const send = () => {
    const opt = Object.assign({}, init || {});
    const h = new Headers(opt.headers || (input && typeof input !== 'string' ? input.headers : undefined));
    const tok = (fitSession && fitSession.access_token) || tokenAtCall;
    if (tok) h.set('Authorization', 'Bearer ' + tok);
    opt.headers = h;
    return fitRawFetch(input, opt);
  };
  let res = await send();
  if (res.status === 401 && fitSession && fitSession.refresh_token) {
    const rr = await fitRefresh(true);
    if (rr === 'ok') res = await send();
  }
  return res;
};
setInterval(() => { if (fitSession) fitRefresh(false); }, 60000);


// ============================================================
// ルートの記録（route.html）2026-11-22
// ・ルートヒストリーなどで記録した GPX を取り込み、スタッフ全員の道すじを1枚の地図に重ねる（ポスティングの配り終わった所を見る）
// ・見られるのは fit アプリにスタッフでログインした人だけ（表 staff_routes・SQL rt1）。見られるのはスタッフ全員（Junki 11/22）
// ・消せるのは自分のルート（責任者は全部）。GPX ファイルそのものは残さない（道すじの点だけ・1本 8000 点くらいまで・1m より小さいずれだけ間引く）
// ・地図は国土地理院の地図（淡色地図）＋ Leaflet
// ============================================================
const RT_VERSION = '20261126rt7';   // rt7：GPX を選ぶときの種類のしぼり込み（accept）をやめた（iPhone・Android で .gpx が選べなかった）／rt6：ポスティングの「回」（表 posting_rounds・スタッフ全員が作れる・例：超感覚本チラシ）。ルートはどの回かと配った枚数を持つ。回を選んで見る・前回を灰色で重ねる・町は今回／前回・人ごとの枚数の合計・ルートを「直す」（配った人・枚数・回）（SQL rt3）／rt5：全員の道すじをいつも1枚の地図に（はじめの期間は「ぜんぶ」・人でしぼって消すのをやめ、人を押すとその人を目立たせてほかは薄く）・人ごとに見分けやすい色（入った順に色を割りあて）・線に白いふち・地図の左下に人の色の見本／rt4：取り込んだあと、その日が見える期間に切りかえて地図をそのルートへ寄せる（前は「今月」のままで、9月の GPX が見えず、何も起きていないように見えた）・同じルートをもう一度入れようとしたら知らせて入れない／rt3：配った人の名前（walker_name。はじめは取り込んだ人・大学生など アプリにいない人の名前にも変えられる・あとから「名前を変える」）。人ごとの色・合計・しぼり込みは配った人で（SQL rt2）／rt2：配った範囲（太い帯）と道すじの切りかえ・ポスティングの町の印（済＝緑／まだ＝灰色）・エリアの一覧／地図は 淡色・標準・航空写真 を切りかえ
const RT_KINDS = ['ポスティング', 'その他'];
const RT_MAXPTS = 8000;
const RT_COLORS = ['#E74C3C', '#2980B9', '#27AE60', '#8E44AD', '#E67E22', '#16A085', '#C0392B', '#2C3E50', '#D35400', '#7D3C98', '#1ABC9C', '#B7950B', '#5D6D7E', '#A93226', '#1F618D'];
const HDR = { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' };
let ME = null, IS_MGR = false, STAFF = {}, ROUTES = [], MAP = null, LAYER = null, LINES = {}, SEL = null;
const F = { period: 'all', staff: '', kind: '', from: '', to: '', round: '', prev: true };   // round＝見る回（'' は まだ決めていない＝一番新しい回／'all'＝ぜんぶ）・prev＝前回を重ねる
let ROUNDS = [], PREV_ROUTES = [], PREV_LAYER = null;   // staff＝目立たせる人（ほかの人も消さない）

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const jstDate = (d) => new Date(new Date(d).getTime() + 9 * 3600 * 1000).toISOString().slice(0, 10);
const today = () => jstDate(Date.now());
const md = (iso) => { if (!iso) return ''; const d = jstDate(iso); const p = d.split('-').map(Number); return p[1] + '/' + p[2] + '（' + '日月火水木金土'[new Date(p[0], p[1] - 1, p[2]).getDay()] + '）'; };
const hm = (iso) => iso ? new Date(new Date(iso).getTime() + 9 * 3600 * 1000).toISOString().slice(11, 16) : '';
const km = (m) => (Math.round((m || 0) / 100) / 10).toFixed(1) + 'km';

async function rest(method, path, body, extra) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/' + path, { method, headers: Object.assign({}, HDR, extra || {}), body: body == null ? undefined : JSON.stringify(body) });
  const tx = await r.text();
  if (!r.ok) { let m = tx; try { m = JSON.parse(tx).message || tx; } catch (e) {} throw new Error(method + ' ' + r.status + ' ' + String(m).slice(0, 160)); }
  return tx ? JSON.parse(tx) : null;
}
function errText(e) {
  const m = String((e && e.message) || e || '');
  if (/Failed to fetch|NetworkError|network/i.test(m)) return '通信がうまくつながりませんでした。もう一度お試しください。';
  if (/staff_routes/.test(m) && /does not exist|schema cache|404/.test(m)) return 'まだ表（staff_routes）ができていません。SQL rt1 を流してください。';
  return 'うまくいきませんでした。（' + m.slice(0, 120) + '）';
}
function modal(html) { const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = '<div class="modal">' + html + '</div>'; document.body.append(bg); return bg; }

// ---------- GPX を読む（app.html の これ登録して ⑤ と同じ作り）----------
function rtDist(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dLat = (b[0] - a[0]) * toR, dLng = (b[1] - a[1]) * toR;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
function rtSimplify(pts, eps) {   // Douglas-Peucker（メートルに近い目安で）
  if (pts.length <= 2) return pts.slice();
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]];
  const kx = Math.cos(pts[0][0] * Math.PI / 180) * 111320, ky = 110540;
  while (stack.length) {
    const [s, e] = stack.pop();
    const ax = pts[s][1] * kx, ay = pts[s][0] * ky, bx = pts[e][1] * kx, by = pts[e][0] * ky;
    const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    let maxD = -1, idx = -1;
    for (let i = s + 1; i < e; i++) {
      const px = pts[i][1] * kx, py = pts[i][0] * ky;
      let t = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0; t = Math.max(0, Math.min(1, t));
      const qx = ax + t * dx - px, qy = ay + t * dy - py, d = qx * qx + qy * qy;
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (idx >= 0 && maxD > eps * eps) { keep[idx] = 1; stack.push([s, idx], [idx, e]); }
  }
  return pts.filter((p, i) => keep[i]);
}
function rtParseGpx(text, fileName) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('GPX として読めませんでした');
  const segs = [];
  const take = (nodes) => { const a = []; for (const n of nodes) { const lat = parseFloat(n.getAttribute('lat')), lng = parseFloat(n.getAttribute('lon')); if (!isFinite(lat) || !isFinite(lng)) continue; const te = n.getElementsByTagNameNS('*', 'time')[0]; a.push([lat, lng, te ? Date.parse(te.textContent) : NaN]); } return a; };
  const trksegs = doc.getElementsByTagNameNS('*', 'trkseg');
  for (const sg of trksegs) { const a = take(sg.getElementsByTagNameNS('*', 'trkpt')); if (a.length) segs.push(a); }
  if (!segs.length) for (const rt of doc.getElementsByTagNameNS('*', 'rte')) { const a = take(rt.getElementsByTagNameNS('*', 'rtept')); if (a.length) segs.push(a); }
  if (!segs.length) throw new Error('道すじの点がありません');
  let dist = 0, n = 0, t0 = NaN, t1 = NaN;
  segs.forEach(sg => { for (let i = 0; i < sg.length; i++) { if (i) dist += rtDist(sg[i - 1], sg[i]); n++; const t = sg[i][2]; if (isFinite(t)) { if (!isFinite(t0) || t < t0) t0 = t; if (!isFinite(t1) || t > t1) t1 = t; } } });
  // 間引く（合わせて RT_MAXPTS 点以下になるまで、ゆるめていく）
  let eps = 1, out = null;   // 1m より小さいずれは消す（道からはみ出さない程度）
  for (let k = 0; k < 14; k++) {
    out = segs.map(sg => rtSimplify(sg, eps)).filter(sg => sg.length >= 1);
    if (out.reduce((a, sg) => a + sg.length, 0) <= RT_MAXPTS) break;
    eps *= 1.6;
  }
  const r5 = (v) => Math.round(v * 1e5) / 1e5;
  const points = out.map(sg => sg.map(p => [r5(p[0]), r5(p[1])]));
  const nameEl = doc.getElementsByTagNameNS('*', 'name')[0];
  return { name: (nameEl && nameEl.textContent.trim()) || String(fileName || '').replace(/\.gpx$/i, ''), points: points,
    point_count: points.reduce((a, sg) => a + sg.length, 0), raw_count: n, distance_m: Math.round(dist),
    started_at: isFinite(t0) ? new Date(t0).toISOString() : null, ended_at: isFinite(t1) ? new Date(t1).toISOString() : null };
}

// ---------- ポスティングの町（Junki 11/23 の一覧）----------
// q＝国土地理院の住所検索に渡す文字（なければ「愛媛県松山市」＋名前）。r＝「通った」とみなす半径（m）

  ['中心部', ['清水', '清水町', '勝山', '東雲', '木屋町', '萱町', '緑町', '鉄炮町', '春日町', '味酒', '大手町', '南持田', '湊町', '昭和町', '新玉', '南江戸']],
  ['道後・東部', ['道後', '道後上市', '道後今市', '道後北代', '白水台', '湯渡', '石手', '湯の山', { n: '桑原（1・5・6・7丁目）', q: '愛媛県松山市桑原' }, '樽味', '三町', { n: '松末1丁目', q: '愛媛県松山市松末1丁目' }, '福音寺', '枝松', '小坂', '正円寺']],
  ['久米・石井', ['来住町', '久米', '南久米', '鷹子', '星岡', '東石井', '石井', '北土居', '北井門', '井門町', '椿']],
  ['南部', ['古川', '古川北', '西石井', '余土', '土居田', '小栗', { n: '雄郡一丁目', q: '愛媛県松山市雄郡1丁目' }, { n: '竹原2丁目', q: '愛媛県松山市竹原2丁目' }, { n: '竹原3丁目', q: '愛媛県松山市竹原3丁目' }, '藤原', '土橋', '市坪']],
  ['松山市外', [{ n: '東温市', q: '愛媛県東温市', r: 2500 }, { n: '砥部町（宮内）', q: '愛媛県伊予郡砥部町宮内', r: 800 }]]
].map(([area, list]) => [area, list.map(t => typeof t === 'string' ? { n: t } : t)]);
RT_AREAS.forEach(([area, list]) => list.forEach(t => { t.area = area; t.q = t.q || ('愛媛県松山市' + t.n); t.r = t.r || 500; }));
const RT_TOWNS = [].concat(...RT_AREAS.map(a => a[1]));
const GEO_KEY = 'fit_route_geo_v1';
let GEO = {}; try { GEO = JSON.parse(localStorage.getItem(GEO_KEY) || '{}') || {}; } catch (e) { GEO = {}; }
let VIEW = 'line', TOWN_LAYER = null, GEO_BUSY = false;
async function geocodeTowns() {
  if (GEO_BUSY) return; GEO_BUSY = true;
  const todo = RT_TOWNS.filter(t => !(t.q in GEO));
  for (const t of todo) {
    try {
      const r = await fitRawFetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(t.q));
      const j = r.ok ? await r.json() : [];
      const hit = (j || [])[0];
      GEO[t.q] = hit && hit.geometry && hit.geometry.coordinates ? [hit.geometry.coordinates[1], hit.geometry.coordinates[0]] : null;
    } catch (e) { /* 通信できないときは次の機会に */ break; }
    try { localStorage.setItem(GEO_KEY, JSON.stringify(GEO)); } catch (e) {}
    await new Promise(res => setTimeout(res, 120));
  }
  GEO_BUSY = false;
  drawTowns();
}
// 町ごとに、表示中のルートが中心から r m 以内を通ったか
function townStatus(list, prevList) {
  const st = {};
  RT_TOWNS.forEach(t => {
    const c = GEO[t.q]; st[t.n] = { pos: c || null, hits: [], prev: false };
    if (!c) return;
    const dLat = t.r / 110540, dLng = t.r / (111320 * Math.cos(c[0] * Math.PI / 180));
    list.forEach(r => {
      const segs = Array.isArray(r.points) ? r.points : [];
      let hit = false;
      for (const sg of segs) { for (const q of sg) { if (Math.abs(q[0] - c[0]) <= dLat && Math.abs(q[1] - c[1]) <= dLng && rtDist(q, c) <= t.r) { hit = true; break; } } if (hit) break; }
      if (hit) st[t.n].hits.push(r);
    });
    (prevList || []).some(r => {
      const segs = Array.isArray(r.points) ? r.points : [];
      for (const sg of segs) for (const q of sg) if (Math.abs(q[0] - c[0]) <= dLat && Math.abs(q[1] - c[1]) <= dLng && rtDist(q, c) <= t.r) { st[t.n].prev = true; return true; }
      return false;
    });
  });
  return st;
}
function drawTowns() {
  if (!MAP) return;

  const usePrev = F.prev && PREV_ROUTES.length && prevRound();
  const st = townStatus(shown(), usePrev ? PREV_ROUTES : []);
  RT_TOWNS.forEach(t => {
    const x = st[t.n]; if (!x.pos) return;
    const done = x.hits.length > 0;
    const last = done ? x.hits.slice().sort((a, b) => String(b.started_at || '').localeCompare(String(a.started_at || '')))[0] : null;
    const m = L.circleMarker(x.pos, { radius: 7, color: !done && x.prev ? '#E67E22' : '#fff', weight: !done && x.prev ? 3 : 2, fillColor: done ? '#27AE60' : '#95A5A6', fillOpacity: 0.95 });
    m.bindTooltip(esc(t.n), { permanent: true, direction: 'right', offset: [8, 0], className: 'tlabel' + (done ? ' done' : '') });
    m.bindPopup('<b>' + esc(t.n) + '</b>（' + esc(t.area) + '）' + (t.note ? '<br><span style="color:#888">' + esc(t.note) + '</span>' : '') + '<br>' +
      (done ? '最後に通った日：' + esc(md(last.started_at || last.created_at)) + '（' + esc(whoOf(last)) + '）<br>この回に ' + x.hits.length + '本' : 'この回はまだ通っていません') + (usePrev ? '<br>前回（' + esc(prevRound().name) + '）：' + (x.prev ? '通った' : '通っていない') : ''));
    m.addTo(TOWN_LAYER);
  });
  // エリアの一覧
  const box = $('#areas'); if (!box) return;
  const nAll = RT_TOWNS.length, nDone = RT_TOWNS.filter(t => st[t.n].hits.length).length, nNoPos = RT_TOWNS.filter(t => !st[t.n].pos).length;
  box.innerHTML = '<div class="msg" style="margin-bottom:6px">この回に通った町：<b>' + nDone + '</b> / ' + nAll + '（町の中心から500m以内を通ったら「済」。おおよその目安です）' + (usePrev ? '<br>オレンジのふち＝前回（' + esc(prevRound().name) + '）は通ったのに、今回まだの町' : '') + (GEO_BUSY ? '　位置を調べています…' : nNoPos ? '　位置が分からない町：' + nNoPos : '') + '</div>' +
    RT_AREAS.map(([area, list]) => {
      const d = list.filter(t => st[t.n].hits.length).length;
      return '<div style="margin:8px 0 2px;font-weight:800;font-size:13.5px">' + esc(area) + '　<span class="msg">' + d + ' / ' + list.length + '</span></div><div class="sum">' +
        list.map(t => { const x = st[t.n], ok = x.hits.length > 0; return '<span class="chip" data-town="' + esc(t.n) + '" style="' + (ok ? 'border-color:#27AE60;background:#E9F7EF' : !ok && x.prev ? 'border-color:#E67E22' : '') + (x.pos ? '' : ';opacity:.5') + '">' + (ok ? '✅' : '⬜') + ' ' + esc(t.n) + (usePrev ? '<span style="font-size:10.5px;color:' + (x.prev ? '#E67E22' : '#aaa') + '">前回' + (x.prev ? '✓' : '－') + '</span>' : '') + '</span>'; }).join('') + '</div>';
    }).join('');
  box.querySelectorAll('[data-town]').forEach(c => c.onclick = () => {
    const t = RT_TOWNS.find(x => x.n === c.dataset.town); const pos = t && GEO[t.q];
    if (!pos) { alert('この町の位置が分かりませんでした'); return; }
    MAP.setView(pos, t.r > 1000 ? 13 : 16); window.scrollTo({ top: $('#map').offsetTop - 10, behavior: 'smooth' });
  });
}
// 配った範囲：帯の太さを、地図の縮尺に合わせて約60mにする
const BAND_M = 60;
function bandPx() { const z = MAP.getZoom(), lat = MAP.getCenter().lat; const mpp = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z); return Math.max(3, BAND_M / mpp); }

function range() {
  const t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7);

  if (F.period === 'last') return [ym(y, m - 1), ym(y, m)];
  if (F.period === '3m') return [ym(y, m - 2), null];
  if (F.period === 'range') return [F.from || null, F.to ? new Date(Date.parse(F.to + 'T00:00:00+09:00') + 86400000).toISOString().slice(0, 10) : null];
  return [null, null];
}

    '<label class="lbl">回の名前</label><input class="in" id="rd-name" style="width:100%" value="' + esc(r ? r.name : '') + '" placeholder="例：超感覚本チラシ・2027 春期講習チラシ">' +
    '<label class="lbl">はじまりの日</label><input type="date" class="in" id="rd-start" value="' + esc(r ? (r.start_date || '') : today()) + '">' +
    '<label class="lbl">終わりの日（なくてもよい）</label><input type="date" class="in" id="rd-end" value="' + esc(r ? (r.end_date || '') : '') + '">' +
    '<label class="lbl">配る枚数の目標（なくてもよい）</label><input type="number" min="0" class="in" id="rd-goal" value="' + esc(r && r.goal_sheets != null ? r.goal_sheets : '') + '" placeholder="例：5000">' +
    '<label class="lbl">メモ（なくてもよい）</label><input class="in" id="rd-memo" style="width:100%" value="' + esc(r ? (r.memo || '') : '') + '" placeholder="例：チラシの種類・配る地域">' +
    '<div class="mb"><button class="btn sub" data-no>やめる</button><button class="btn" data-ok>' + (r ? '直す' : '作る') + '</button></div>');
  bg.querySelector('[data-no]').onclick = () => bg.remove();
  bg.querySelector('[data-ok]').onclick = async () => {
    const name = ($('#rd-name').value || '').trim(); if (!name) { alert('回の名前を入れてください'); return; }
    const goal = ($('#rd-goal').value || '').trim();
    const body = { name: name, start_date: $('#rd-start').value || null, end_date: $('#rd-end').value || null, memo: ($('#rd-memo').value || '').trim() || null, goal_sheets: goal === '' ? null : Math.max(0, parseInt(goal, 10) || 0) };
    try {
      if (r) await rest('PATCH', 'posting_rounds?id=eq.' + r.id, body, { Prefer: 'return=minimal' });
      else { body.created_by = ME.row.id; const rows = await rest('POST', 'posting_rounds', body, { Prefer: 'return=representation' }); if (rows && rows[0]) F.round = rows[0].id; }
      bg.remove(); await loadRounds(); load();
    } catch (e) { alert(errText(e)); }
  };
}
async function loadPrev() {
  PREV_ROUTES = [];
  const pr = prevRound(); if (!pr) return;
  try { PREV_ROUTES = await rest('GET', 'staff_routes?select=id,walker_name,staff_id,started_at,distance_m,points&round_id=eq.' + pr.id) || []; } catch (e) { PREV_ROUTES = []; }
}
function drawPrev() {
  if (!MAP) return;
  if (PREV_LAYER) PREV_LAYER.clearLayers(); else PREV_LAYER = L.layerGroup().addTo(MAP);
  if (!F.prev) return;
  PREV_ROUTES.forEach(r => { const segs = Array.isArray(r.points) ? r.points : []; L.polyline(segs, { color: '#7F8C8D', weight: VIEW === 'band' ? bandPx() : 5, opacity: VIEW === 'band' ? 0.18 : 0.45, dashArray: VIEW === 'band' ? null : '2 6', lineCap: 'round', interactive: false }).addTo(PREV_LAYER); });
  try { PREV_LAYER.eachLayer(l => l.bringToBack()); } catch (e) {}
}

async function load() {
  const [a, b] = range();
  if (!ROUNDS.length && !F._roundsTried) { F._roundsTried = true; await loadRounds(); }
  let q = 'staff_routes?select=id,staff_id,walker_name,kind,memo,title,started_at,ended_at,distance_m,point_count,points,created_at,round_id,sheets&order=started_at.desc.nullslast';
  if (F.round && F.round !== 'all' && F.round !== 'none') q += '&round_id=eq.' + F.round;
  if (F.round === 'none') q += '&round_id=is.null';
  if (a) q += '&started_at=gte.' + a + 'T00:00:00%2B09:00';
  if (b) q += '&started_at=lt.' + b + 'T00:00:00%2B09:00';
  $('#list').innerHTML = '<div class="msg">読み込み中…</div>';
  try { ROUTES = await rest('GET', q) || []; }
  catch (e) {
    // 列（round_id・sheets）がまだないとき（SQL rt3 の前）は、前の形で読む
    if (/round_id|sheets/.test(String(e.message))) { try { ROUTES = await rest('GET', q.replace(',round_id,sheets', '').replace(/&round_id=[^&]*/, '')) || []; $('#list').innerHTML = ''; } catch (e2) { ROUTES = []; } }
    else { $('#list').innerHTML = '<div class="msg err">' + esc(errText(e)) + '</div>'; ROUTES = []; }
  }
  await loadPrev();
  const ids = [...new Set(ROUTES.map(whoOf))].sort((x, y) => x.localeCompare(y, 'ja'));
  const sel = $('#f-staff'), cur = F.staff;
  sel.innerHTML = '<option value="">全員を同じように</option>' + ids.map(id => '<option value="' + esc(id) + '"' + (id === cur ? ' selected' : '') + '>' + esc(id) + ' を目立たせる</option>').join('');
  // 色：入った順に割りあてる（人がふえても前の人の色は変わらない・15人まではかぶらない）
  const order = ROUTES.slice().sort((x, y) => String(x.created_at || '').localeCompare(String(y.created_at || ''))).map(whoOf);
  COLOR_MAP = {}; order.forEach(n => { if (!(n in COLOR_MAP)) COLOR_MAP[n] = RT_COLORS[Object.keys(COLOR_MAP).length % RT_COLORS.length]; });
  if (cur && ids.indexOf(cur) < 0) F.staff = '';
  draw(true);
  drawPrev();
}
// 配った人：walker_name（なければ取り込んだスタッフの名前）。色は名前から決める（同じ人はいつも同じ色）
function whoOf(r) { return String((r && r.walker_name) || ((STAFF[r && r.staff_id] || {}).name) || '（不明）').trim(); }
let COLOR_MAP = {};
function colorOf(name) {
  if (COLOR_MAP[name]) return COLOR_MAP[name];
  let h = 0; const t = String(name || ''); for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return RT_COLORS[h % RT_COLORS.length];
}
function walkerNames() {   // 入力の候補：これまでの配った人＋スタッフ
  const a = new Set(); ROUTES.forEach(r => a.add(whoOf(r))); Object.keys(STAFF).forEach(id => { if (STAFF[id].active) a.add(STAFF[id].name); });
  return [...a].filter(Boolean).sort((x, y) => x.localeCompare(y, 'ja'));
}
function shown() { return ROUTES.filter(r => (!F.kind || r.kind === F.kind)); }   // 人ではしぼらない（全員を1枚に）
function dimmed(r) { return (F.staff && whoOf(r) !== F.staff) || (SEL && SEL !== r.id); }
function draw(fit) {
  LAYER.clearLayers(); LINES = {};
  const list = shown();
  let bounds = null;
  list.forEach(r => {
    const segs = Array.isArray(r.points) ? r.points : [];
    const col = colorOf(whoOf(r));
    const dim = dimmed(r);
    if (VIEW === 'line') L.polyline(segs, { color: '#fff', weight: 8, opacity: dim ? 0.25 : 0.9, interactive: false }).addTo(LAYER);   // 白いふち（地図の上で線が見やすい）
    const pl = VIEW === 'band' ? L.polyline(segs, { color: col, weight: bandPx(), opacity: dim ? 0.12 : 0.4, lineCap: 'round', lineJoin: 'round' })
                               : L.polyline(segs, { color: col, weight: SEL === r.id ? 6 : 4.5, opacity: dim ? 0.25 : 0.95 });
    pl.bindPopup('<b>' + esc(whoOf(r)) + '</b>　' + esc(r.kind || '') + '<br>' + esc(md(r.started_at || r.created_at)) + ' ' + esc(hm(r.started_at)) + (r.ended_at ? '〜' + esc(hm(r.ended_at)) : '') + '　' + km(r.distance_m) + (r.memo ? '<br>' + esc(r.memo) : ''));
    pl.on('click', (ev) => { L.DomEvent.stopPropagation(ev); SEL = r.id; highlight(); });
    pl.addTo(LAYER); LINES[r.id] = pl;
    try { const bb = pl.getBounds(); if (bb.isValid()) bounds = bounds ? bounds.extend(bb) : L.latLngBounds(bb.getSouthWest(), bb.getNorthEast()); } catch (e) {}
  });
  if (fit && bounds) MAP.fitBounds(bounds, { padding: [20, 20] });
  drawTowns();
  drawLegend(list);
  // 人ごとの合計
  const by = {};
  list.forEach(r => { const k = whoOf(r); by[k] = by[k] || { n: 0, m: 0, sh: 0 }; by[k].n++; by[k].m += r.distance_m || 0; by[k].sh += r.sheets || 0; });
  const tot = list.reduce((a, r) => a + (r.distance_m || 0), 0), totSh = list.reduce((a, r) => a + (r.sheets || 0), 0);
  const cr = curRound();
  $('#sum').innerHTML = Object.keys(by).length ? Object.keys(by).sort((a, b) => by[b].m - by[a].m).map(k => '<span class="chip' + (F.staff === k ? ' on' : '') + '" data-st="' + esc(k) + '"><span class="dot" style="background:' + colorOf(k) + '"></span>' + esc(k) + '　' + by[k].n + '本・' + km(by[k].m) + (by[k].sh ? '・' + by[k].sh.toLocaleString() + '枚' : '') + '</span>').join('') + '<span class="msg" style="align-self:center">合計 ' + list.length + '本・' + km(tot) + '・' + totSh.toLocaleString() + '枚' + (cr && cr.goal_sheets ? '（目標 ' + Number(cr.goal_sheets).toLocaleString() + '枚の ' + Math.round(totSh * 100 / cr.goal_sheets) + '%）' : '') + '</span>' : '<span class="msg">この期間のルートはありません</span>';
  document.querySelectorAll('[data-st]').forEach(c => c.onclick = () => { F.staff = F.staff === c.dataset.st ? '' : c.dataset.st; $('#f-staff').value = F.staff; SEL = null; draw(); });
  // 一覧
  $('#list').innerHTML = list.length ? list.map(r => {
    const mine = r.staff_id === ME.row.id;
    const up = (STAFF[r.staff_id] || {}).name || '';
    return '<div class="row' + (SEL === r.id ? ' on' : '') + '" data-id="' + r.id + '"><span class="dot" style="background:' + colorOf(whoOf(r)) + '"></span><div class="rmain"><div class="rt">' + esc(md(r.started_at || r.created_at)) + ' ' + esc(hm(r.started_at)) + (r.ended_at ? '〜' + esc(hm(r.ended_at)) : '') + '　' + esc(whoOf(r)) + '</div>' +
      '<div class="rm">' + esc(r.kind || '') + '・' + km(r.distance_m) + (r.sheets ? '・<b>' + Number(r.sheets).toLocaleString() + '枚</b>' : '・<span style="color:#C0392B">枚数なし</span>') + (F.round === 'all' && r.round_id ? '・' + esc(roundName(r.round_id)) : '') + (r.memo ? '・' + esc(r.memo) : '') + (up && up !== whoOf(r) ? '・取り込み：' + esc(up) : '') + '</div></div>' +
      (mine || IS_MGR ? '<button class="btn sub small" data-ren="' + r.id + '">直す</button><button class="btn danger small" data-del="' + r.id + '">消す</button>' : '') + '</div>';
  }).join('') : '<div class="msg">この期間のルートはありません。「＋ GPX を取り込む」から入れてください。</div>';
  document.querySelectorAll('.row[data-id]').forEach(el => el.onclick = (e) => { if (e.target.closest('[data-del],[data-ren]')) return; SEL = el.dataset.id; highlight(true); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delRoute(b.dataset.del));
  document.querySelectorAll('[data-ren]').forEach(b => b.onclick = () => renameRoute(b.dataset.ren));
}
function highlight(zoom) {
  if (VIEW === 'line') { draw(); }
  document.querySelectorAll('.row[data-id]').forEach(el => el.classList.toggle('on', el.dataset.id === SEL));
  const pl = LINES[SEL];
  if (pl) { pl.bringToFront(); if (zoom) { try { MAP.fitBounds(pl.getBounds(), { padding: [30, 30] }); } catch (e) {} } pl.openPopup(); }
}
async function delRoute(id) {
  const r = ROUTES.find(x => x.id === id); if (!r) return;
  const bg = modal('<h3>このルートを消しますか？</h3><div class="msg">' + esc(md(r.started_at || r.created_at)) + '　' + esc(whoOf(r)) + '　' + km(r.distance_m) + '<br>消すと元に戻せません。</div><div class="mb"><button class="btn sub" data-no>やめる</button><button class="btn danger" data-ok>消す</button></div>');
  bg.querySelector('[data-no]').onclick = () => bg.remove();
  bg.querySelector('[data-ok]').onclick = async () => {
    bg.remove();
    try { await rest('DELETE', 'staff_routes?id=eq.' + encodeURIComponent(id), null, { Prefer: 'return=representation' }).then(rows => { if (!rows || !rows.length) throw new Error('消せませんでした（自分のルートだけ消せます）'); }); if (SEL === id) SEL = null; load(); }
    catch (e) { alert(errText(e)); }
  };
}

// ---------- 地図の左下：人の色の見本（押すとその人を目立たせる）----------
let LEGEND = null;
function drawLegend(list) {
  if (!MAP) return;
  if (!LEGEND) { LEGEND = L.control({ position: 'bottomleft' }); LEGEND.onAdd = () => { const d = L.DomUtil.create('div', 'legend'); L.DomEvent.disableClickPropagation(d); return d; }; LEGEND.addTo(MAP); }
  const box = LEGEND.getContainer();
  const names = [...new Set(list.map(whoOf))];
  box.style.display = names.length ? '' : 'none';
  box.innerHTML = names.map(n => '<div class="lg' + (F.staff && F.staff !== n ? ' off' : '') + '" data-lg="' + esc(n) + '"><span class="dot" style="background:' + colorOf(n) + '"></span>' + esc(n) + '</div>').join('');
  box.querySelectorAll('[data-lg]').forEach(el => el.onclick = () => { F.staff = F.staff === el.dataset.lg ? '' : el.dataset.lg; $('#f-staff').value = F.staff; SEL = null; draw(); });
}

// ---------- 配った人の名前を変える（取り込んだ人・責任者）----------
function nameInput(id, val) {
  return '<input class="in" id="' + id + '" list="' + id + '-l" value="' + esc(val || '') + '" style="width:100%" placeholder="例：松山 太郎（大学生）"><datalist id="' + id + '-l">' + walkerNames().map(n => '<option value="' + esc(n) + '">').join('') + '</datalist>';
}
function roundSelect(id, val) {
  return '<select class="in" id="' + id + '" style="width:100%">' + ROUNDS.map(r => '<option value="' + r.id + '"' + (r.id === val ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('') + '<option value=""' + (!val ? ' selected' : '') + '>（回を決めない）</option></select>';
}
function renameRoute(id) {
  const r = ROUTES.find(x => x.id === id); if (!r) return;
  const bg = modal('<h3>ルートを直す</h3><div class="msg">' + esc(md(r.started_at || r.created_at)) + '　' + km(r.distance_m) + '</div><label class="lbl">配った人</label>' + nameInput('rn-name', whoOf(r)) +
    '<div class="msg" style="margin-top:4px">大学生など、アプリに入っていない人の名前も入れられます。同じ人は同じ書き方にすると、合計がまとまります。</div>' +
    '<label class="lbl">配った枚数</label><input type="number" min="0" class="in" id="rn-sheets" value="' + esc(r.sheets != null ? r.sheets : '') + '">' +
    '<label class="lbl">回</label>' + roundSelect('rn-round', r.round_id || '') +
    '<div class="mb"><button class="btn sub" data-no>やめる</button><button class="btn" data-ok>直す</button></div>');
  bg.querySelector('[data-no]').onclick = () => bg.remove();
  bg.querySelector('[data-ok]').onclick = async () => {
    const v = ($('#rn-name').value || '').trim(); if (!v) { alert('名前を入れてください'); return; }
    const shv = ($('#rn-sheets').value || '').trim();
    try {
      const rows = await rest('PATCH', 'staff_routes?id=eq.' + encodeURIComponent(id), { walker_name: v, sheets: shv === '' ? null : Math.max(0, parseInt(shv, 10) || 0), round_id: $('#rn-round').value || null }, { Prefer: 'return=representation' });
      if (!rows || !rows.length) throw new Error('変えられませんでした（自分が取り込んだルートだけ変えられます）');
      bg.remove(); load();
    } catch (e) { alert(/walker_name/.test(String(e.message)) ? '「配った人」の列がまだありません。SQL rt2 を流してください。' : errText(e)); }
  };
}

// ---------- 取り込み ----------
async function importFiles(files) {
  const items = [];
  for (const f of files) {
    try { const txt = await f.text(); const g = rtParseGpx(txt, f.name); g.file = f.name; g.date = g.started_at ? jstDate(g.started_at) : today(); items.push(g); }
    catch (e) { items.push({ file: f.name, error: String(e.message || e) }); }
  }
  const ok = items.filter(x => !x.error);
  const prev = L.layerGroup().addTo(MAP);
  ok.forEach(g => L.polyline(g.points, { color: '#000', weight: 4, dashArray: '6 6', opacity: 0.8 }).addTo(prev));
  try { const b = L.featureGroup(prev.getLayers()).getBounds(); if (b.isValid()) MAP.fitBounds(b, { padding: [20, 20] }); } catch (e) {}
  const bg = modal('<h3>GPX を取り込む（' + ok.length + '本）</h3>' +
    items.map((g, i) => g.error ? '<div class="frow err">✕ ' + esc(g.file) + '：' + esc(g.error) + '</div>' :
      '<div class="frow"><b>' + esc(g.file) + '</b>　' + km(g.distance_m) + '・' + g.point_count + '点' + (g.raw_count > g.point_count ? '（' + g.raw_count + '点から間引き）' : '') +
      '<br>日にち <input type="date" class="in" data-date="' + i + '" value="' + g.date + '">' + (g.started_at ? '　' + hm(g.started_at) + (g.ended_at ? '〜' + hm(g.ended_at) : '') : '　<span class="msg">（時刻なし）</span>') +
      '<br>配った枚数 <input type="number" min="0" class="in" data-sheets="' + i + '" style="width:110px" placeholder="例：300"> 枚</div>').join('') +
    '<label class="lbl">回</label>' + roundSelect('im-round', F.round && F.round !== 'all' && F.round !== 'none' ? F.round : (ROUNDS[0] ? ROUNDS[0].id : '')) +
    '<label class="lbl">配った人（はじめは自分。大学生などに変えられます）</label>' + nameInput('im-who', ME.row.name || '') +
    '<label class="lbl">種類</label><select class="in" id="im-kind">' + RT_KINDS.map(k => '<option>' + k + '</option>').join('') + '</select>' +
    '<label class="lbl">ひとこと（なくてもよい）</label><input class="in" id="im-memo" style="width:100%" placeholder="例：〇〇町の団地まわり">' +
    '<div class="msg" style="margin-top:6px">地図の黒い点線が、これから入れるルートです。GPX ファイルそのものは残しません。</div>' +
    '<div class="mb"><button class="btn sub" data-no>やめる</button><button class="btn" data-ok' + (ok.length ? '' : ' disabled') + '>登録する</button></div>');
  const close = () => { bg.remove(); MAP.removeLayer(prev); };
  bg.querySelector('[data-no]').onclick = close;
  bg.querySelector('[data-ok]').onclick = async () => {
    const kind = $('#im-kind').value, memo = ($('#im-memo').value || '').trim(), who = ($('#im-who').value || '').trim() || (ME.row.name || '');
    const rows = [];
    items.forEach((g, i) => {
      if (g.error) return;
      const d = (bg.querySelector('[data-date="' + i + '"]') || {}).value || g.date;
      let st = g.started_at, en = g.ended_at;
      if (!st || jstDate(st) !== d) { st = d + 'T00:00:00+09:00'; if (!g.started_at) en = null; else { st = d + 'T' + hm(g.started_at) + ':00+09:00'; en = g.ended_at ? d + 'T' + hm(g.ended_at) + ':00+09:00' : null; } }
      const shv = ((bg.querySelector('[data-sheets="' + i + '"]') || {}).value || '').trim();
      rows.push({ staff_id: ME.row.id, walker_name: who, round_id: ($('#im-round') || {}).value || null, sheets: shv === '' ? null : Math.max(0, parseInt(shv, 10) || 0), kind: kind, memo: memo || null, title: g.name || null, started_at: st, ended_at: en, distance_m: g.distance_m, point_count: g.point_count, points: g.points });
    });
    const btn = bg.querySelector('[data-ok]'); btn.disabled = true; btn.textContent = '登録中…';
    try {
      // 同じルート（始まりの時刻と距離が同じ）がもう入っていれば入れない
      const dup = [];
      for (const r of rows) {
        const q = 'staff_routes?select=id&started_at=eq.' + encodeURIComponent(new Date(r.started_at).toISOString()) + '&distance_m=eq.' + r.distance_m + '&limit=1';
        try { const hit = await rest('GET', q); if (hit && hit.length) dup.push(r); } catch (e) {}
      }
      const put = rows.filter(r => dup.indexOf(r) < 0);
      const noSheets = put.filter(r => r.sheets == null).length;
      if (noSheets && !confirm(noSheets + '本、配った枚数が入っていません。このまま登録しますか？（あとで「直す」から入れられます）')) { btn.disabled = false; btn.textContent = '登録する'; return; }
      const rid = put.length ? put[0].round_id : null;
      if (rid && F.round !== 'all' && F.round !== rid) { F.round = rid; const fr = $('#f-round'); if (fr) fr.value = rid; }
      if (put.length) await rest('POST', 'staff_routes', put, { Prefer: 'return=minimal' });
      close();
      // 入れた日が見える期間にして、そのルートへ寄せる
      const ds = rows.map(r => jstDate(r.started_at)).sort();
      const [a, b] = range();
      const endEx = b ? b : '9999-12-31';
      if ((a && ds[0] < a) || ds[ds.length - 1] >= endEx) { F.period = 'all'; $('#f-period').value = 'all'; $('#f-range').style.display = 'none'; }
      await load();
      alert((put.length ? put.length + '本 登録しました（' + ds.map(d => md(d + 'T12:00:00+09:00')).filter((x, i, arr) => arr.indexOf(x) === i).join('・') + '）。' : '') + (dup.length ? '\n' + dup.length + '本は、もう入っていたので入れませんでした。' : ''));
    }
    catch (e) { btn.disabled = false; btn.textContent = '登録する'; alert(/walker_name/.test(String(e.message)) ? '「配った人」の列がまだありません。SQL rt2 を流してください。' : errText(e)); }
  };
}

boot();
</script>

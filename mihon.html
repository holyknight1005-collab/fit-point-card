<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF8EE">
<title>f i t アプリ 見本</title>
<style>
  :root{--bg:#FFF8EE;--card:#fff;--ink:#3a2f28;--sub:#8a7a6c;--line:#f0e2cf;--a:#ff8a5c;--b:#16233A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
  .wrap{max-width:480px;margin:0 auto;padding:28px 16px 40px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.06em}
  .lead{color:var(--sub);font-size:14px;margin:0 0 22px}
  a.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;text-decoration:none;color:inherit;box-shadow:0 4px 14px rgba(120,80,40,.08)}
  a.card:active{transform:scale(.98)}
  .pic{width:76px;height:76px;border-radius:16px;object-fit:cover;flex:none;background:#fde9d6;display:flex;align-items:center;justify-content:center;font-size:36px}
  .t{font-weight:700;font-size:17px}
  .d{font-size:13px;color:var(--sub);margin-top:2px}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;margin-top:6px}
  .tag.need{background:#ffe7dc;color:#c4532a}
  .tag.free{background:#e3f1e6;color:#2f7a45}
  .note{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--sub);margin-top:20px}
  .note b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>f i t アプリ 見本</h1>
  <p class="lead">新しい画面の確認用です。見たいほうを押してください。</p>

  <a class="card" href="app.html#demo">
    <img class="pic" src="img/stu_checkin.jpg" alt="" onerror="this.outerHTML='<div class=&quot;pic&quot;>📱</div>'">
    <div>
      <div class="t">① 生徒の画面</div>
      <div class="d">ホーム・授業・勉強・f i t・じぶん。デモ用の生徒の画面が開きます。上の帯の「スタッフに戻る」で戻れます。</div>
      <span class="tag need">スタッフのログインが必要</span>
    </div>
  </a>

  <a class="card" href="senpai_demo.html">
    <img class="pic" src="img/stu_alumni.jpg" alt="" onerror="this.outerHTML='<div class=&quot;pic&quot;>🎓</div>'">
    <div>
      <div class="t">② 卒業生図鑑（見本）</div>
      <div class="d">架空のデータで動く見本です。画面の「見本の切りかえ」で、生徒・先輩（卒業生）・スタッフの画面を切りかえられます。</div>
      <span class="tag free">ログイン不要</span>
    </div>
  </a>

  <div class="note">
    <b>気づいたことは</b>、アプリの「目安箱」か石田まで。<br>
    ②は見本なので、送信や保存はされません。自由にさわって大丈夫です。
  </div>
</div>
</body>
</html>

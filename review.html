<div class="wrap" id="app"><div class="msg">読み込み中…</div></div>
<script>
// ===== fit 共通ログイン（Supabase Auth セッション）sec1 =====
// ・ID＋PINの照合はサーバー（Edge Function fit-login）で行い、ブラウザには PIN を残さない。
// ・発行されたセッションは localStorage 'fit_session_v1' に保存し、同じサイトの全アプリで共有する。
// ・Supabase への fetch は自動でログイン中のトークンに差し替え、期限切れなら自動更新して1回だけ再送する。
const FIT_SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const FIT_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const FIT_SESSION_KEY = 'fit_session_v1';
const FIT_LEGACY_KEYS = ['fit_pin', 'fit_parent_pin', 'fit_staff_hash', 'fit_staff_pin'];
let fitSession = null;
let fitRefreshing = null;
const fitRawFetch = window.fetch.bind(window);

function fitLoadSession() {
  try { fitSession = JSON.parse(localStorage.getItem(FIT_SESSION_KEY) || 'null'); } catch (e) { fitSession = fitSession || null; }
  return fitSession;
}
function fitSaveSession(s) {
  fitSession = s || null;
  try { if (s) localStorage.setItem(FIT_SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(FIT_SESSION_KEY); } catch (e) {}
}
function fitClearLegacy() {
  try { FIT_LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
// 'ok' | 'invalid'（ログインし直しが必要） | 'error'（通信エラー等。セッションは残す）| 'none'
async function fitRefresh(force) {
  const cur = fitLoadSession();
  if (!cur || !cur.refresh_token) return 'none';
  const now = Math.floor(Date.now() / 1000);
  if (!force && (cur.expires_at || 0) - now > 300) return 'ok';
  if (fitRefreshing) return fitRefreshing;
  fitRefreshing = (async () => {
    try {
      const r = await fitRawFetch(FIT_SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: cur.refresh_token })
      });
      if (r.status === 400 || r.status === 401 || r.status === 403) {
        // 別タブが先に更新していればそちらを使う
        const latest = fitLoadSession();
        if (latest && latest.refresh_token !== cur.refresh_token) return 'ok';
        fitSaveSession(null);
        return 'invalid';
      }
      if (!r.ok) return 'error';
      const j = await r.json();
      fitSaveSession(Object.assign({}, cur, {
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        expires_at: j.expires_at || (now + (j.expires_in || 3600))
      }));
      return 'ok';
    } catch (e) { return 'error'; }
    finally { fitRefreshing = null; }
  })();
  return fitRefreshing;
}
// ログイン：kind = 'staff' | 'student' | 'parent' | 'online'
// 戻り値 { ok:true, kind, account } / { ok:false, error:'invalid'|'blocked'|'locked'|... }
async function fitLogin(kind, id, pin) {
  let r, j = null;
  try {
    r = await fitRawFetch(FIT_SB_URL + '/functions/v1/fit-login', {
      method: 'POST',
      headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, id: id, pin: pin })
    });
    j = await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
  if (!j) return { ok: false, error: 'network' };
  if (j.ok) {
    fitSaveSession(Object.assign({}, j.session, { kind: j.kind, account_id: String(j.account.id) }));
    fitClearLegacy();
  }
  return j;
}
function fitLoginErrorText(j, fallback) {
  if (!j) return fallback;
  if (j.error === 'locked') return 'ログインの失敗が続いたため、15分ほど待ってからお試しください。';
  if (j.error === 'blocked') return 'このアカウントは現在ご利用いただけません。塾までお問い合わせください。';
  if (j.error === 'network' || j.error === 'server') return '通信がうまくつながりませんでした。電波の良い場所でもう一度お試しください。';
  return fallback;
}
// ===== 段階B：サーバー関数（RPC）=====
// ポイント加算・ログインボーナス・面談共有メモなどは、サーバー側の関数で行う（生徒は直接書き換えできない）。
async function fitRpc(name, args) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/rpc/' + name, {
    method: 'POST',
    headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  const tx = await r.text();
  if (!r.ok) throw new Error('rpc ' + name + ' ' + r.status + ' ' + tx);
  return tx ? JSON.parse(tx) : null;
}
// 戻り値 { awarded: 実際に加算された点, points: 加算後の合計 }
async function fitAwardPoints(type, points, reason, ref) {
  return await fitRpc('fit_award_points', { p_type: type, p_points: points, p_reason: reason || null, p_ref: ref == null ? null : String(ref) });
}
function fitLogout() {
  const s = fitSession || fitLoadSession();
  fitSaveSession(null);
  fitClearLegacy();
  if (s && s.access_token) {
    fitRawFetch(FIT_SB_URL + '/auth/v1/logout?scope=local', {
      method: 'POST', headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
    }).catch(() => {});
  }
}
// 保存済みセッションから本人の行を取り直す。旧方式（PIN保存）の端末は1回だけ自動で移行する。
// 戻り値 { kind, row } / null（未ログイン）。通信エラー時は例外（ログイン情報は消さない）。
async function fitResume() {
  let s = fitLoadSession();
  if (!s) {
    let email = null, pin = null, pid = null, ppin = null, role = null;
    try {
      email = localStorage.getItem('fit_email'); pin = localStorage.getItem('fit_pin');
      pid = localStorage.getItem('fit_parent_id'); ppin = localStorage.getItem('fit_parent_pin');
      role = localStorage.getItem('fit_role');
    } catch (e) {}
    let j = null;
    if (email && pin) j = await fitLogin(role === 'staff' ? 'staff' : 'student', email, pin);
    else if (pid && ppin) j = await fitLogin('parent', pid, ppin);
    if (j && j.error === 'network') throw new Error('network');
    fitClearLegacy();
    s = fitLoadSession();
    if (!s) return null;
  }
  const rr = await fitRefresh(false);
  if (rr === 'invalid' || rr === 'none') return null;
  s = fitLoadSession();
  if (!s) return null;
  const table = { staff: 'staff', student: 'students', parent: 'parent_accounts', online: 'online_students' }[s.kind];
  if (!table) { fitLogout(); return null; }
  // sec4: 生徒・保護者は students を直接読まず、表示用の列だけ返す関数から受け取る（生徒は自分の1行）
  const res = s.kind === 'student'
    ? await fitRawFetch(FIT_SB_URL + '/rest/v1/rpc/fit_my_students', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
        body: '{}'
      })
    : await fitRawFetch(FIT_SB_URL + '/rest/v1/' + table + '?id=eq.' + encodeURIComponent(s.account_id) + '&select=*', {
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
      });
  if (res.status === 401 || res.status === 403) {
    const again = await fitRefresh(true);
    if (again === 'invalid' || again === 'none') return null;
    throw new Error('auth ' + res.status);
  }
  if (!res.ok) throw new Error('resume ' + res.status);
  const rows = await res.json();
  if (!rows.length || rows[0].is_active === false && s.kind !== 'student') { fitLogout(); return null; }
  return { kind: s.kind, row: rows[0] };
}
// Supabase への fetch をログイン中のトークンに差し替える（各画面のコードはそのまま使える）
window.fetch = async function (input, init) {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (url.indexOf(FIT_SB_URL) !== 0 || url.indexOf('/auth/v1/') > 0 || url.indexOf('/functions/v1/fit-login') > 0) {
    return fitRawFetch(input, init);
  }
  // 呼び出し時点のトークンを控えておく（直後にログアウトしても、その前に始めた保存は通す）
  const tokenAtCall = fitLoadSession() ? fitSession.access_token : null;
  if (tokenAtCall) await fitRefresh(false);
  const send = () => {
    const opt = Object.assign({}, init || {});
    const h = new Headers(opt.headers || (input && typeof input !== 'string' ? input.headers : undefined));
    const tok = (fitSession && fitSession.access_token) || tokenAtCall;
    if (tok) h.set('Authorization', 'Bearer ' + tok);
    opt.headers = h;
    return fitRawFetch(input, opt);
  };
  let res = await send();
  if (res.status === 401 && fitSession && fitSession.refresh_token) {
    const rr = await fitRefresh(true);
    if (rr === 'ok') res = await send();
  }
  return res;
};
setInterval(() => { if (fitSession) fitRefresh(false); }, 60000);

// ============================================================
// 修正依頼（review.html）
// ・スタッフ：依頼を作る（PDF → ページ画像）・リンクを配る・対応済みにする
// ・リンクを開いた人：ログインなしで名前を入れてメモを残す（関数 review_* だけ使う）
// ============================================================
const RV_BUCKET = 'review';
const RV_PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const RV_KINDS = ['加筆', '修正', '削除', '質問'];
const RV_HDR = { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' };
const qs = new URLSearchParams(location.search);
const TOKEN = (qs.get('r') || '').trim();
let staff = null;          // ログイン中のスタッフ（staff の行）
let RQ = null;             // 依頼（review_get の中身）
let NOTES = [];
let CHECKS = [];
const ui = { version: 0, onlyOpen: false, hl: null, draft: {}, kind: {}, poll: null, busy: false };

const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); })); }
function myKey() { let k = lsGet('review_key'); if (!k || !/^[0-9a-f-]{36}$/i.test(k)) { k = uuid(); lsSet('review_key', k); } return k; }
function myName() { return (lsGet('review_name') || '').trim(); }
function fmt(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function imgUrl(token, v, p, at) { return FIT_SB_URL + '/storage/v1/object/public/' + RV_BUCKET + '/' + token + '/v' + v + '/p-' + p + '.jpg' + (at ? '?t=' + encodeURIComponent(at) : ''); }
function shareUrl(token) { return location.origin + location.pathname + '?r=' + token; }

async function rpc(name, args) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/rpc/' + name, { method: 'POST', headers: RV_HDR, body: JSON.stringify(args || {}) });
  const tx = await r.text();
  if (!r.ok) { let m = tx; try { m = JSON.parse(tx).message || tx; } catch (e) {} throw new Error(m); }
  return tx ? JSON.parse(tx) : null;
}
async function rest(method, path, body, extra) {
  const h = Object.assign({}, RV_HDR, extra || {});
  const r = await fetch(FIT_SB_URL + '/rest/v1/' + path, { method, headers: h, body: body == null ? undefined : JSON.stringify(body) });
  const tx = await r.text();
  if (!r.ok) throw new Error(method + ' ' + r.status + ' ' + tx.slice(0, 160));
  return tx ? JSON.parse(tx) : null;
}
function errText(e) {
  const m = String((e && e.message) || e || '');
  if (m.includes('closed')) return 'この依頼は受付を終えています。';
  if (m.includes('not_found')) return 'この依頼が見つかりません（リンクを確かめてください）。';
  if (m.includes('too_many')) return 'メモの数が上限に達しました。塾にお知らせください。';
  if (m.includes('bad_page')) return 'ページが新しくなっています。画面を開き直してください。';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return '通信がうまくつながりませんでした。もう一度お試しください。';
  return '保存できませんでした。（' + m.slice(0, 80) + '）';
}

// ---------- PDF → ページ画像 ----------
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok, ng) => {
    const sc = document.createElement('script');
    sc.src = RV_PDFJS + 'pdf.min.js';
    sc.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = RV_PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); } catch (e) { ng(e); } };
    sc.onerror = () => ng(new Error('PDF を読む部品を読み込めませんでした'));
    document.head.appendChild(sc);
  });
}
async function upload(path, blob) {
  const res = await fetch(FIT_SB_URL + '/storage/v1/object/' + RV_BUCKET + '/' + path, {
    method: 'POST', headers: { apikey: FIT_ANON, 'Content-Type': 'image/jpeg', 'x-upsert': 'true', 'cache-control': '3600' }, body: blob
  });
  if (!res.ok) { let t = ''; try { t = await res.text(); } catch (e) {} throw new Error('画像を入れられませんでした（' + res.status + '）' + t.slice(0, 120)); }
}
// 戻り値：ページ数
async function pdfToPages(file, token, v, say, prev) {
  const pdfjs = await loadPdfJs();
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  if (doc.numPages > 200) throw new Error('ページが多すぎます（200ページまで）');
  for (let p = 1; p <= doc.numPages; p++) {
    say('ページを画像にしています… ' + p + '／' + doc.numPages);
    const page = await doc.getPage(p);
    const v1 = page.getViewport({ scale: 1 });
    const scale = Math.min(4, 1200 / v1.width);
    const vp = page.getViewport({ scale });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: g, viewport: vp }).promise;
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.8));
    await upload(token + '/v' + v + '/p-' + p + '.jpg', blob);
    if (prev) prev.append(el('img', { src: URL.createObjectURL(blob), alt: p + 'ページ' }));
    cv.width = cv.height = 0;
  }
  return doc.numPages;
}

  box.addEventListener('click', e => {
    if (e.target.closest('.pin') || !canWrite()) return;
    const r = img.getBoundingClientRect();
    ui.draft[p] = { x: +((e.clientX - r.left) / r.width * 100).toFixed(2), y: +((e.clientY - r.top) / r.height * 100).toFixed(2) };

    const ta = $('#ta-' + p);

  }
  side.append(el('div', { class: 'list', id: 'list-' + p }));
  return el('section', { class: 'page', id: 'page-' + p }, box, side);
}

  }
  const names = el('div', { class: 'chk-names' });
  const cur = CHECKS.filter(c => c.version === RQ.current_version);
  const old = CHECKS.filter(c => c.version !== RQ.current_version);
  if (!CHECKS.length) names.textContent = 'まだ確認おわりの人はいません';
  else {
    names.append('確認おわり：');
    cur.forEach((c, i) => { const s = el('b', {}); s.textContent = (i ? '、' : '') + c.author_name + ' ✓'; names.append(s); });
    if (!cur.length) names.append('（最新の版ではまだいません）');
    if (old.length) { const s = el('span', { class: 'old' }); s.textContent = '　前の版で確認：' + old.map(c => c.author_name).join('、'); names.append(s); }
  }
  box.append(names);
}
async function toggleCheck(on, b) {
  const name = staff ? (staff.name || staff.staff_id || 'スタッフ') : myName();
  if (!name) { askName(() => toggleCheck(on, b)); return; }
  b.disabled = true;
  try { await rpc('review_check', { p_token: TOKEN, p_key: myKey(), p_name: name, p_on: on }); await loadNotes(); toast(on ? '確認おわりにしました。ありがとうございました' : 'チェックをはずしました'); }
  catch (e) { b.disabled = false; toast(errText(e)); }
}

function notesFor(p) { return NOTES.filter(n => n.version === ui.version && n.page === p); }
function renderAll() { const n = curPages(); for (let p = 1; p <= n; p++) renderPage(p); }

function renderPage(p) {
  const box = $('#box-' + p); if (!box) return;
  const all = notesFor(p);
  const numOf = new Map(all.map((x, i) => [x.id, i + 1]));
  const shown = ui.onlyOpen ? all.filter(x => !x.done) : all;
  box.querySelectorAll('.pin').forEach(e => e.remove());
  for (const x of shown) {
    if (x.x == null || x.y == null) continue;
    const pin = el('div', { 'data-id': x.id, class: 'pin' + (x.done ? ' done' : '') + (ui.hl === x.id ? ' hl' : ''), style: 'left:' + x.x + '%;top:' + x.y + '%' }, String(numOf.get(x.id)));
    pin.title = x.body;
    pin.addEventListener('click', () => highlight(x.id, true));
    box.append(pin);
  }
  const d = ui.draft[p];
  if (d) box.append(el('div', { class: 'pin draft', style: 'left:' + d.x + '%;top:' + d.y + '%' }, '＋'));
  const ps = $('#ps-' + p);
  if (ps) {
    ps.textContent = '';
    if (d) ps.append('場所：指定済み（青い＋） ', el('button', { type: 'button', class: 'link', onclick: () => { delete ui.draft[p]; renderPage(p); } }, 'はずす'));
    else ps.append('場所：指定なし（ページ全体へのメモ）');
  }
  const list = $('#list-' + p); list.textContent = '';
  if (!shown.length) list.append(el('div', { class: 'empty' }, all.length ? '未対応のメモはありません' : 'まだメモはありません'));
  for (const x of shown) list.append(noteCard(x, numOf.get(x.id)));
  const nav = $('#nav-' + p + ' .n');
  if (nav) { const open = all.filter(x => !x.done).length; nav.textContent = open; nav.classList.toggle('zero', open === 0); }
}

function noteCard(x, num) {
  const open = RQ.is_open;
  const nm = el('span', {}); nm.textContent = x.author_name || '';
  const txt = el('div', { class: 'txt' }); txt.textContent = x.body || '';
  const acts = el('div', { class: 'acts' });
  if (staff) acts.append(el('label', {}, el('input', { type: 'checkbox', checked: !!x.done, onchange: e => setDone(x, e.target.checked, e.target) }), '対応済み'));
  else if (x.done) acts.append(el('span', {}, '✓ 対応済み'));
  if (x.is_mine && open && !x.done) acts.append(el('button', { type: 'button', onclick: () => startEdit(x, txt) }, '書き直す'));
  if ((x.is_mine && open) || staff) acts.append(el('button', { type: 'button', onclick: e => delNote(x, e.currentTarget) }, '消す'));
  const kind = RV_KINDS.includes(x.kind) ? x.kind : '質問';
  const card = el('div', { class: 'note' + (x.done ? ' done' : '') + (ui.hl === x.id ? ' hl' : ''), id: 'note-' + x.id },
    el('div', { class: 'meta' }, el('span', { class: 'num' }, String(num)), el('span', { class: 'kind k-' + kind }, kind), nm, el('span', {}, fmt(x.created_at)),
      x.x == null ? el('span', {}, '・ページ全体') : null, x.updated_at && (new Date(x.updated_at) - new Date(x.created_at)) > 5000 && !x.done ? el('span', {}, '（書き直し）') : null),
    txt, acts);
  card.addEventListener('mouseenter', () => { if (x.x != null) highlight(x.id, false); });
  return card;
}

// 表示を作り直さずに、選んだメモと番号だけ目立たせる（作り直すとボタンの状態が消えるため）
function highlight(id, scroll) {
  if (ui.hl === id && !scroll) return;
  ui.hl = id;
  document.querySelectorAll('.note.hl,.pin.hl').forEach(e => e.classList.remove('hl'));
  const c = document.getElementById('note-' + id); if (c) c.classList.add('hl');
  const pin = document.querySelector('.pin[data-id="' + id + '"]'); if (pin) pin.classList.add('hl');
  if (scroll && c) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function addNote(p, ta, btn) {
  const body = ta.value.trim();
  if (!body) return;
  const name = staff ? (staff.name || staff.staff_id || 'スタッフ') : myName();
  if (!name) { askName(() => addNote(p, ta, btn)); return; }
  btn.disabled = true;
  const d = ui.draft[p];
  try {
    await rpc('review_add', { p_token: TOKEN, p_key: myKey(), p_version: ui.version, p_page: p, p_x: d ? d.x : null, p_y: d ? d.y : null, p_kind: ui.kind[p], p_body: body, p_name: name });
    ta.value = ''; delete ui.draft[p];
    await loadNotes();
    toast('残しました');
  } catch (e) { setStatus(errText(e), true); toast(errText(e)); }
  btn.disabled = false;
}
function startEdit(x, txt) {
  const ta = el('textarea', { class: 'in', maxlength: '2000' }); ta.value = x.body || '';
  const save = el('button', { class: 'btn small', type: 'button' }, '保存');
  const cancel = el('button', { class: 'btn sub small', type: 'button' }, 'やめる');
  txt.replaceWith(el('div', {}, ta, el('div', { class: 'row' }, save, cancel)));
  cancel.onclick = () => renderPage(x.page);
  save.onclick = async () => {
    const t = ta.value.trim(); if (!t) return;
    save.disabled = true;
    try {
      const ok = await rpc('review_edit', { p_token: TOKEN, p_key: myKey(), p_id: x.id, p_body: t });
      if (!ok) toast('書き直せませんでした（受付終了か、対応済みかもしれません）');
      await loadNotes();
    } catch (e) { save.disabled = false; toast(errText(e)); }
  };
}
async function delNote(x, b) {
  if (b.dataset.confirm !== '1') {
    b.dataset.confirm = '1'; b.textContent = '本当に消す？（もう一度押す）'; b.classList.add('warn');
    setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = '消す'; b.classList.remove('warn'); } }, 5000);
    return;
  }
  b.disabled = true;
  try {
    if (x.is_mine) await rpc('review_hide', { p_token: TOKEN, p_key: myKey(), p_id: x.id });
    else if (staff) await rest('PATCH', 'review_notes?id=eq.' + x.id, { hidden: true, updated_at: new Date().toISOString() });
    await loadNotes();
  } catch (e) { b.disabled = false; toast(errText(e)); }
}
async function setDone(x, v, cb) {
  cb.disabled = true;
  try { await rest('PATCH', 'review_notes?id=eq.' + x.id, { done: v }); await loadNotes(); }
  catch (e) { cb.checked = !v; cb.disabled = false; toast('変えられませんでした'); }
}

boot();
</script>
</body>
</html>

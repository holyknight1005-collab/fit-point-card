<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2D6DB5">
<title>fit授業後小テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
<style>
  :root{--green:#2D6DB5;--green-d:#184A86;--green-l:#E8F1FB;--bg:#F5F8FC;--surface:#fff;--text:#2C2C2A;--muted:#7A7770;--border:#D2E0EF;--red:#D94040;--red-l:#FFECEC;--green-ok:#2E8B57;--green-ok-l:#E8F6EE;--orange:#E08A1E;--orange-l:#FDF1DF;--radius:16px;--radius-sm:10px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
  .screen{display:none;min-height:100vh;max-width:480px;margin:0 auto}
  .screen.active{display:block}
  #loading{position:fixed;inset:0;background:rgba(245,248,252,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:500}
  #loading.hidden{display:none}
  .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading-text{font-size:13px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:600;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--green-ok)}
  .toast.info{background:#444}
  .toast.error{background:var(--red)}
  /* ログイン */
  #screen-login{flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
  #screen-login.active{display:flex}
  .login-logo{text-align:center}
  .login-logo .ico{font-size:50px}
  .login-logo .ttl{font-size:22px;font-weight:900;color:var(--green-d);margin-top:6px}
  .login-logo .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .login-card{width:100%;background:var(--surface);border-radius:var(--radius);padding:22px 20px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:1px solid var(--border)}
  .field-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block}
  .field-input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:var(--bg);transition:border-color .15s;margin-bottom:14px}
  .field-input:focus{outline:none;border-color:var(--green)}
  .primary-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),var(--green-d));border:none;border-radius:var(--radius-sm);color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(45,109,181,.3)}
  .error-msg{background:var(--red-l);border:1px solid #F5BABA;border-radius:var(--radius-sm);padding:9px 13px;font-size:12px;color:var(--red);margin-top:10px;display:none}
  .error-msg.show{display:block}
  /* 共通 */
  .header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
  .header .h-title{font-size:16px;font-weight:700;color:var(--green-d)}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer}
  .wrap{padding:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:12px;box-shadow:0 4px 14px -6px rgba(45,109,181,.14),0 2px 6px -4px rgba(0,0,0,.05)}
  .sec-title{font-size:14px;font-weight:800;color:var(--green-d);margin:4px 0 12px;text-align:center;letter-spacing:.5px}
  .set-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 6px 18px -8px rgba(45,109,181,.18),0 2px 8px -5px rgba(0,0,0,.06);transition:box-shadow .15s,transform .15s}
  .set-card:hover{box-shadow:0 10px 26px -8px rgba(45,109,181,.26),0 3px 10px -5px rgba(0,0,0,.08)}
  .set-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .set-title{font-size:15px;font-weight:800;color:var(--text);line-height:1.4;flex:1;min-width:0;word-break:break-word}
  .set-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .mini-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;background:var(--bg);border:1.5px solid var(--border);color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer;transition:all .12s}
  .mini-btn:hover{border-color:var(--green);color:var(--green-d);background:var(--green-l)}
  .sel,.inp,.ta{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:var(--bg)}
  .sel:focus,.inp:focus,.ta:focus{outline:none;border-color:var(--green)}
  .ta{resize:vertical;min-height:90px}
  .btn{padding:12px;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff}
  .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-ok{background:linear-gradient(135deg,#2E8B57,#1E6B3E);color:#fff}
  .btn-warn{background:var(--orange-l);color:var(--orange);border:1px solid #F3D08A}
  .btn-block{width:100%}
  .role-tabs{display:flex;gap:8px;margin-bottom:16px}
  .role-tab{flex:1;padding:12px 0;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;border-radius:12px;cursor:pointer;text-align:center;transition:all .15s;box-shadow:0 2px 6px -4px rgba(0,0,0,.06)}
  .role-tab:hover{border-color:var(--green);color:var(--green-d)}
  .role-tab.active{background:linear-gradient(135deg,var(--green),var(--green-d));border-color:var(--green);color:#fff;box-shadow:0 6px 16px -6px rgba(45,109,181,.45)}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:11px}
  .pill-num{background:var(--green-l);color:var(--green-d)}
  .pill-choice{background:var(--green-ok-l);color:var(--green-ok)}
  .pill-ready{background:var(--orange-l);color:var(--orange)}
  .pill-open{background:var(--green-ok-l);color:var(--green-ok)}
  .pill-closed{background:#EEE;color:var(--muted)}
  .muted{color:var(--muted);font-size:12px}
  .choice-opt{padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;cursor:pointer;background:var(--surface);margin-bottom:7px}
  .choice-opt.sel{border-color:var(--green);background:var(--green-l);font-weight:700}
  .choice-opt.correct{border-color:var(--green-ok);background:var(--green-ok-l)}
  .choice-opt.wrong{border-color:var(--red);background:var(--red-l)}
  .bar-bg{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px}
  /* 数式そのものは途中改行で崩さない。ただし問題文（日本語＋数式）は折り返せるようにする。
     .katex を inline-block にして「1つの塊」として扱い、塊の内部は改行しない。
     塊と塊のあいだ、および日本語テキスト部分は通常どおり折り返す。 */
  .katex{white-space:nowrap;display:inline-block;max-width:100%;vertical-align:middle}
  .q-jp{white-space:normal;word-break:break-all}
  .q-text,.choice-opt{overflow-wrap:break-word;word-break:normal;line-height:1.9}
</style>
</head>
<body>

<div id="loading" class="hidden"><div class="spinner"></div><div id="loading-text">読み込み中...</div></div>
<div id="toast" class="toast"></div>

<!-- ===== ログイン ===== -->
<div id="screen-login" class="screen">
  <div class="login-logo">
    <div class="ico">📝</div>
    <div class="ttl">fit授業後小テスト</div>
    <div class="sub">ログインしてください</div>
  </div>
  <div class="login-card">
    <label class="field-label">メールアドレス（スタッフはID）</label>
    <input type="text" id="login-email" class="field-input" autocomplete="username" placeholder="例：student@example.com / fit003">
    <label class="field-label">パスワード</label>
    <input type="password" id="login-pin" class="field-input" autocomplete="current-password" placeholder="パスワード">
    <button class="primary-btn" onclick="doLogin()">ログイン</button>
    <div id="login-error" class="error-msg"></div>
    <label style="display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:var(--muted);cursor:pointer">
      <input type="checkbox" id="keep-login" checked style="width:16px;height:16px"> ログイン状態を保持
    </label>
  </div>
  <div id="quiz-version-label" style="font-size:10px;color:var(--muted);margin-top:4px"></div>
</div>

<!-- ===== 生徒ホーム（解けるテスト一覧） ===== -->
<div id="screen-student" class="screen">
  <div class="header">
    <span class="h-title" id="stu-hello">小テスト</span>
    <button class="icon-btn" onclick="logout()">ログアウト</button>
  </div>
  <div class="wrap">
    <div class="sec-title">受けられる小テスト</div>
    <div id="stu-quiz-list"><div class="muted" style="text-align:center;padding:20px">読み込み中...</div></div>
  </div>
</div>

<!-- ===== 生徒：解答画面 ===== -->
<div id="screen-solve" class="screen">
  <div class="header">
    <span class="h-title" id="solve-title">小テスト</span>
    <button class="icon-btn" onclick="backToStudent()">戻る</button>
  </div>
  <div class="wrap">
    <div id="solve-timer" style="display:none;position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 10px;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span style="font-size:12px;font-weight:700;color:var(--ink)">⏱ 制限時間</span>
        <span id="solve-timer-label" style="font-size:14px;font-weight:800;color:var(--ink)">--</span>
      </div>
      <div style="height:8px;background:var(--line);border-radius:5px;overflow:hidden">
        <div id="solve-timer-fill" style="height:100%;width:100%;background:var(--green-ok);border-radius:5px;transition:width 1s linear,background .3s"></div>
      </div>
    </div>
    <div id="solve-progress" class="muted" style="margin-bottom:10px"></div>
    <div id="solve-questions"></div>
    <button id="solve-submit" class="btn btn-primary btn-block" style="margin-top:8px" onclick="onSolveSubmitClick()">答え合わせ</button>
    <div id="solve-result" style="display:none;margin-top:14px"></div>
  </div>
</div>

<!-- ===== スタッフ画面 ===== -->
<div id="screen-staff" class="screen">
  <div class="header">
    <span class="h-title" id="staff-hello">小テスト管理</span>
    <button class="icon-btn" onclick="logout()">ログアウト</button>
  </div>
  <div class="wrap">
    <div class="role-tabs">
      <div class="role-tab active" id="rtab-list" onclick="staffTab('list')">📋 一覧</div>
      <div class="role-tab" id="rtab-create" onclick="staffTab('create')">✏️ 作成</div>
      <div class="role-tab" id="rtab-stats" onclick="staffTab('stats')">📊 集計</div>

    <!-- 一覧（テスト＆配信） -->
    <div id="stafftab-list">
      <div class="sec-title">作成したテスト</div>
      <div id="staff-set-list"><div class="muted" style="text-align:center;padding:16px">読み込み中...</div></div>
    </div>

    <!-- 作成 -->
    <div id="stafftab-create" style="display:none">
      <div id="cr-edit-banner" style="display:none;background:var(--green-l);border:1.5px solid var(--green);border-radius:10px;padding:10px 12px;margin-bottom:12px;align-items:center;justify-content:space-between;gap:10px">
        <div style="font-size:13px;font-weight:700;color:var(--green-d)">✏️ 編集中：<span id="cr-edit-name"></span></div>

    </div>
  </div>
</div>

<script>
// ============================================================
// バージョン管理（キャッシュ対策・自動リロード）
// デプロイのたびにこの値を上げ、quiz_version.txt の中身と一致させること。
// app.html とは独立管理（quiz_version.txt を参照）。app側の更新で quiz が巻き込まれない。
// ============================================================
const QUIZ_VERSION = '20260702h';

// quiz_version.txt を見て新版があれば1回だけ自動リロード（無限ループ防止つき）
async function checkQuizVersion(){
  try{
    const url = 'quiz_version.txt?t=' + Date.now(); // キャッシュ回避
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) return; // 無い/取得失敗時は何もしない（フェイルセーフ）
    const latest = (await res.text()).trim();
    if(!latest) return;
    if(latest === QUIZ_VERSION){
      try{ sessionStorage.removeItem('quizReloadedFor'); }catch(e){}
      return;
    }
    // 新版あり。同一セッションで一度リロード済みなら止める（無限ループ防止）
    let guard = null;
    try{ guard = sessionStorage.getItem('quizReloadedFor'); }catch(e){}
    if(guard === latest) return;
    try{ sessionStorage.setItem('quizReloadedFor', latest); }catch(e){}
    const u = new URL(window.location.href);
    u.searchParams.set('v', latest);
    window.location.replace(u.toString());
  }catch(e){ /* オフライン等は無視 */ }
}

// ============================================================
// Supabase ヘルパー（math.html / chem.html と同じ作法）
// ============================================================
const SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const SB_HDR = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

async function sbGet(table, query){
  const res = await fetch(SB_URL+'/rest/v1/'+table+'?'+query, {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!res.ok){ throw new Error(table+' GET '+res.status); }
  return await res.json();
}
async function sbPost(table, body, prefer){
  const h = Object.assign({}, SB_HDR);
  h['Prefer'] = prefer || 'return=representation';
  const res = await fetch(SB_URL+'/rest/v1/'+table, {method:'POST',headers:h,body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error(table+' POST '+res.status+' '+t); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
async function sbPatch(table, query, body){
  const res = await fetch(SB_URL+'/rest/v1/'+table+'?'+query, {method:'PATCH',headers:Object.assign({}, SB_HDR, {'Prefer':'return=minimal'}),body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error(table+' PATCH '+res.status+' '+t); }
}
async function sbDelete(table, query){
  const res = await fetch(SB_URL+'/rest/v1/'+table+'?'+query, {method:'DELETE',headers:Object.assign({}, SB_HDR, {'Prefer':'return=minimal'})});
  if(!res.ok){ const t=await res.text(); throw new Error(table+' DELETE '+res.status+' '+t); }
}

// ============================================================
// 日付（JST安全）
// ============================================================
function getTodayJST(){
  const now = new Date();
  const jst = new Date(now.getTime() + (now.getTimezoneOffset()*60000) + 9*3600000);
  return jst.getFullYear()+'-'+String(jst.getMonth()+1).padStart(2,'0')+'-'+String(jst.getDate()).padStart(2,'0');
}
function fmtDateLabel(dstr, period){
  const d = new Date(dstr+'T00:00:00+09:00');
  const wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate()+'（'+wd+'）'+(period?' '+period+'限':'');
}

// ============================================================
// 数式表示（KaTeX）
// プレーン文字列（例「π/3」「sinθ=1/2」）を LaTeX に自動変換し、
// KaTeX できれいに描画する。$...$ で囲んだ箇所は LaTeX としてそのまま扱う。
// ============================================================

// 全角記号 → 半角（数式化の前に正規化。全角スペースも半角へ）
const MATH_NORMALIZE = [
  ['＞','>'],['＜','<'],['＝','='],['＋','+'],['－','-'],['−','-'],['ー','-'],
  ['（','('],['）',')'],['　',' ']
];

// ギリシャ文字・記号 → LaTeX
// LaTeX コマンド（\word 形式）は直後に英字が続くと \geqqe のように衝突するため、
// 置換先の末尾に必ず半角スペースを入れて区切る。上付き（^..）系は付けない。
const MATH_SYMBOLS = [
  ['≦','\\leqq '],['≧','\\geqq '],['≤','\\le '],['≥','\\ge '],['≠','\\neq '],
  ['×','\\times '],['÷','\\div '],['±','\\pm '],['√','\\sqrt '],['∞','\\infty '],
  ['°','^\\circ'],['π','\\pi '],['θ','\\theta '],['α','\\alpha '],['β','\\beta '],
  ['γ','\\gamma '],['Δ','\\Delta '],['Σ','\\sum '],['∫','\\int '],
  ['²','^2'],['³','^3'],['⁴','^4']
];

// 三角・対数・極限などの関数名（\sin 等にして斜体化を防ぐ）
const MATH_FUNCS = ['sin','cos','tan','log','ln','lim','sec','csc','cot'];

// プレーン式 → LaTeX 文字列
function toLatex(raw){
  let s = String(raw==null?'':raw);
  // 全角記号を半角へ正規化（数式化の前に）
  MATH_NORMALIZE.forEach(([from,to])=>{ s = s.split(from).join(to); });
  // 記号を LaTeX に置換
  MATH_SYMBOLS.forEach(([from,to])=>{ s = s.split(from).join(to); });
  // 関数名を \sin 等に（既に \ が付くものは触らない／lookbehind不使用でiOS旧版も安全）
  MATH_FUNCS.forEach(fn=>{
    s = s.replace(new RegExp('(\\\\?)\\b'+fn+'\\b','g'), function(m, bs){
      return bs ? m : '\\'+fn+' ';
    });
  });
  // 指数（^の直後）を波括弧で囲む。LaTeXは^の直後1文字しか上付きにしないため、
  // 波括弧なしの複数文字指数（例 3^(x-1), x^10, 2^-3）は崩れる。これを補正する。
  // 既に ^{...} の形になっているものは触らない。分数変換の前に確定させる。
  // 対応：^( ... )  → ^{( ... )} ／ ^英数字や符号の連なり → ^{...}
  s = s.replace(/\^\s*(\([^()]*\)|[+\-]?[0-9A-Za-z.]+|\\[a-zA-Z]+)/g, function(m, exp){
    return '^{'+exp+'}';
  });
  // 指数の中身（^{...}）は、分数を2階建てにすると縦に膨らんで枠をはみ出す。
  // 指数内はスラッシュ表記のままにしたいので、分数変換の前にプレースホルダへ退避する。
  const expStash = [];
  s = s.replace(/\^\{([^{}]*)\}/g, function(m, inner){
    // 指数内の余計な丸括弧は外す（(π/2) → π/2 で見た目すっきり）
    let e = inner;
    if(/^\(.*\)$/.test(e)){ e = e.slice(1,-1); }
    expStash.push(e);
    return '\u0001'+(expStash.length-1)+'\u0002';
  });
  // 「分子/分母」を \dfrac に変換（指数の外側のみ。指数内は退避済みなので影響なし）。
  // 分子：数字・\pi・\theta・ギリシャ・英字・( ) の連なり、分母：同様。
  // 例: 5\pi/6 → \dfrac{5\pi}{6} , 1/2 → \dfrac{1}{2} , (x+1)/2 → \dfrac{(x+1)}{2}
  const term = '(?:\\\\[a-zA-Z]+|[0-9A-Za-z]|\\([^()]*\\))+';
  const fracRe = new RegExp('('+term+')\\s*/\\s*('+term+')','g');
  s = s.replace(fracRe, function(m, num, den){
    return '\\dfrac{'+num+'}{'+den+'}';
  });
  // 退避した指数を復元（中のスラッシュはそのまま＝1行に収まる）
  s = s.replace(/\u0001(\d+)\u0002/g, function(m, idx){
    return '^{'+expStash[+idx]+'}';
  });
  return s;
}

// 文字列を KaTeX 描画済み HTML にして返す（失敗時は esc にフォールバック）
function mathHTML(raw){
  const s = String(raw==null?'':raw);
  try{
    if(typeof katex==='undefined'){ return esc(s); } // 未ロード時は素のテキスト
    // $...$ が含まれていれば、その内側だけ数式・外側は通常テキストとして扱う
    if(s.indexOf('$')>=0){
      let out=''; let i=0;
      while(i<s.length){
        const open=s.indexOf('$',i);
        if(open<0){ out+=esc(s.slice(i)); break; }
        out+=esc(s.slice(i,open));
        const close=s.indexOf('$',open+1);
        if(close<0){ out+=esc(s.slice(open)); break; }
        const expr=s.slice(open+1,close);
        out+=katex.renderToString(toLatex(expr),{throwOnError:false,displayMode:false});
        i=close+1;
      }
      return out;
    }
    // $ が無い場合：日本語（かな・漢字等）はテキストとして出し、
    // 数式になりうる区間だけを KaTeX 化する。こうすると日本語の切れ目で自然に折り返せる。
    if(!/[\u3040-\u30FF\u3400-\u9FFF]/.test(s)){
      // 日本語を含まない＝全体を数式として描画
      return katex.renderToString(toLatex(s),{throwOnError:false,displayMode:false});
    }
    let out=''; let last=0; let m2;
    const re=/[\u3040-\u309F\u30A0-\u30FF\u3400-\u9FFF\u3000\u3001\u3002\u300C\u300D\u300E\u300F\uFF01\uFF1F]+/g;
    while((m2=re.exec(s))!==null){
      const before=s.slice(last, m2.index);
      if(before.trim()!==''){ out+=katex.renderToString(toLatex(before),{throwOnError:false,displayMode:false}); }
      else { out+=esc(before); }
      out+='<span class="q-jp">'+esc(m2[0])+'</span>';
      last=m2.index+m2[0].length;
    }
    const tail=s.slice(last);
    if(tail.trim()!==''){ out+=katex.renderToString(toLatex(tail),{throwOnError:false,displayMode:false}); }
    else { out+=esc(tail); }
    return out;
  }catch(e){
    return esc(s);
  }
}

let currentStudent = null;   // {id,name,points}
let isStaff = false;
let staffId = null;          // 'fitNNN'（スタッフ時）

function saveLoginState(email,pin,role){ localStorage.setItem('fit_email',email); localStorage.setItem('fit_pin',pin); localStorage.setItem('fit_role',role); }
function clearLoginState(){ localStorage.removeItem('fit_email'); localStorage.removeItem('fit_pin'); localStorage.removeItem('fit_role'); }

// PINハッシュ化（app.html と同一：staff_id をソルトに利用）
async function hashPin(staffId, pin){
  const salt = 'fit-juku::' + String(staffId).toLowerCase() + '::';
  const enc = new TextEncoder().encode(salt + String(pin));
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function tryStaffLogin(idOrEmail, pin){
  const sid = idOrEmail.trim().toLowerCase();
  // staff_id だけで取得し、PIN照合はクライアント側で行う（pin_hash対応）
  const data = await sbGet('staff','staff_id=eq.'+encodeURIComponent(sid)+'&is_active=eq.true&select=*');
  if(!data || !data.length) return false;
  const st = data[0];
  let ok = false;
  if(st.pin_hash){
    // 移行済み：入力PINをハッシュ化して照合
    const h = await hashPin(sid, pin);
    ok = (h === st.pin_hash);
  }else{
    // 未移行：平文pinと照合
    ok = (String(st.pin) === pin);
  }
  if(!ok) return false;
  isStaff = true; staffId = st.staff_id;
  currentStudent = { id: st.id, name: st.name, points: 0 };
  return true;
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim().toLowerCase();
  const rawId=document.getElementById('login-email').value.trim();
  const pin=document.getElementById('login-pin').value.trim();
  const err=document.getElementById('login-error');
  if(!email||!pin){ err.textContent='メールアドレスとパスワードを入力してください'; err.classList.add('show'); return; }
  showLoading('ログイン中...');
  try{
    const data=await sbGet('students','email=eq.'+encodeURIComponent(email)+'&pin=eq.'+encodeURIComponent(pin)+'&select=*');
    if(data && data.length){
      err.classList.remove('show');
      currentStudent=data[0]; isStaff=false; staffId=null;
      saveLoginState(email,pin,'student');
      await afterLogin();
      return;
    }
    const ok = await tryStaffLogin(rawId, pin);
    if(ok){
      err.classList.remove('show');
      saveLoginState(rawId,pin,'staff');
      await afterLogin();
      return;
    }
    hideLoading();
    err.textContent='メールアドレス（またはスタッフID）かパスワードが違います'; err.classList.add('show');
  }catch(e){ hideLoading(); err.textContent='接続エラー: '+e.message; err.classList.add('show'); }
}

async function autoLogin(){
  const email=localStorage.getItem('fit_email');
  const pin=localStorage.getItem('fit_pin');
  const role=localStorage.getItem('fit_role');
  if(!email||!pin){ showScreen('screen-login'); return; }
  showLoading('自動ログイン中...');
  try{
    if(role==='staff'){
      const ok=await tryStaffLogin(email,pin);
      if(!ok){ clearLoginState(); hideLoading(); showScreen('screen-login'); return; }
      await afterLogin(); return;
    }
    const data=await sbGet('students','email=eq.'+encodeURIComponent(email)+'&pin=eq.'+encodeURIComponent(pin)+'&select=*');
    if(!data||!data.length){ clearLoginState(); hideLoading(); showScreen('screen-login'); return; }
    currentStudent=data[0]; isStaff=false; staffId=null;
    await afterLogin();
  }catch(e){ clearLoginState(); hideLoading(); showScreen('screen-login'); }
}

function logout(){ currentStudent=null; isStaff=false; staffId=null; clearLoginState(); showScreen('screen-login'); }

async function afterLogin(){
  hideLoading();
  if(isStaff){
    document.getElementById('staff-hello').textContent='小テスト管理（'+currentStudent.name+'）';
    showScreen('screen-staff');
    staffTab('list');
  }else{
    document.getElementById('stu-hello').textContent=(currentStudent.name||'')+'さん';
    showScreen('screen-student');
    loadStudentQuizzes();
  }
}

function resetCreateForm(toCreateTab){

// 既存テストを編集モードで読み込む
async function editSet(setId){
  showLoading('読み込み中...');
  try{
    const [sets, qs] = await Promise.all([
      sbGet('mini_quiz_sets','id=eq.'+setId+'&select=*'),
      sbGet('mini_quiz_questions','quiz_set_id=eq.'+setId+'&order=q_order&select=*')
    ]);
    if(!sets.length){ hideLoading(); showToast('テストが見つかりません','error'); return; }
    const s = sets[0];
    crEditSetId = setId;
    crQuestions = qs.map(q=>{
      if(q.q_type==='choice'){
        let ch = Array.isArray(q.choices) ? q.choices.slice() : [];
        // 正解を先頭にして6つに整える（作成フォームの仕様に合わせる）
        ch = [q.answer].concat(ch.filter(c=>c!==q.answer));
        while(ch.length<6) ch.push('');
        ch = ch.slice(0,6);
        return {type:'choice', text:String(q.text), answer:String(q.answer), choices:ch, time_limit_sec:(q.time_limit_sec!=null?q.time_limit_sec:null)};
      }
      return {type:'number', text:String(q.text), answer:String(q.answer), choices:null, time_limit_sec:(q.time_limit_sec!=null?q.time_limit_sec:null)};
    });
    // フォームに反映
    document.getElementById('cr-title').value = s.title || '';
    document.getElementById('cr-subject').value = s.subject || 'その他';
    // 時間設定
    const tm = s.time_mode || 'none';
    document.getElementById('cr-time-mode').value = tm;
    if(tm==='total' && s.time_limit_sec) document.getElementById('cr-total-min').value = Math.round(s.time_limit_sec/60);
    onTimeModeChange();
    document.getElementById('cr-edit-name').textContent = s.title || '';
    document.getElementById('cr-edit-banner').style.display = 'flex';
    document.getElementById('cr-save-btn').textContent = '💾 変更を保存';
    renderCrQuestions();
    // タブ切替（loadStaffSetsを走らせず直接表示）
    ['list','create','stats'].forEach(t=>{
      document.getElementById('stafftab-'+t).style.display = (t==='create')?'block':'none';
      document.getElementById('rtab-'+t).classList.toggle('active', t==='create');
    });
    hideLoading();
    window.scrollTo(0,0);
  }catch(e){ hideLoading(); showToast('読み込みエラー: '+e.message,'error'); }
}

function addQuestion(type){
  if(type==='choice'){
    crQuestions.push({type:'choice', text:'', answer:'', choices:['','','','','','']});
  }else{
    crQuestions.push({type:'number', text:'', answer:'', choices:null});
  }
  renderCrQuestions();
}
function removeQuestion(i){ crQuestions.splice(i,1); renderCrQuestions(); }
function moveQuestion(i,dir){
  const j=i+dir; if(j<0||j>=crQuestions.length) return;
  const tmp=crQuestions[i]; crQuestions[i]=crQuestions[j]; crQuestions[j]=tmp; renderCrQuestions();
}

// フォーム入力をcrQuestionsに反映（再描画せず保持）
function crSet(i, field, val){ if(crQuestions[i]) crQuestions[i][field]=val; }
function crSetChoice(i, ci, val){ if(crQuestions[i] && crQuestions[i].choices) crQuestions[i].choices[ci]=val; }

function renderCrQuestions(){
  document.getElementById('cr-qcount').textContent = crQuestions.length;
  const el = document.getElementById('cr-questions');
  el.innerHTML = crQuestions.map((q,i)=>{
    const pill = q.type==='choice'
      ? '<span class="pill pill-choice">6択</span>'
      : '<span class="pill pill-num">数値入力</span>';
    let body;
    if(q.type==='choice'){
      body = '<div class="muted" style="margin:6px 0 4px">選択肢（1つ目＝正解）</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">' +
        q.choices.map((c,ci)=>'<input type="text" class="inp" style="font-size:13px;'+(ci===0?'border-color:var(--green-ok)':'')+'" placeholder="'+(ci===0?'正解':'選択肢')+'" value="'+esc(c)+'" oninput="crSetChoice('+i+','+ci+',this.value)">').join('') +
        '</div>';
    }else{
      body = '<div class="muted" style="margin:6px 0 4px">正解の数値（ダミーは自動生成）</div>' +
        '<input type="text" class="inp" style="font-size:13px;max-width:140px" placeholder="例：4" value="'+esc(q.answer)+'" oninput="crSet('+i+',\'answer\',this.value)">';
    }
    // 問題ごと制限モードのときだけ、この問の制限秒数を入力
    const isPerQ = document.getElementById('cr-time-mode') && document.getElementById('cr-time-mode').value === 'per_q';
    const perqField = isPerQ
      ? '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)"><span class="muted" style="margin-right:6px">⏱ この問の制限（秒）</span>'+
        '<input type="number" class="inp" style="font-size:13px;max-width:110px;display:inline-block" min="0" step="5" placeholder="例：30" value="'+(q.time_limit_sec!=null?esc(String(q.time_limit_sec)):'')+'" oninput="crSet('+i+',\'time_limit_sec\',this.value===\'\'?null:parseInt(this.value))"></div>'
      : '';
    return '<div class="card">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
        '<span style="font-size:12px;font-weight:700">問'+(i+1)+' '+pill+'</span>'+
        '<span>'+
          '<button class="icon-btn" style="padding:3px 7px" onclick="moveQuestion('+i+',-1)">↑</button> '+
          '<button class="icon-btn" style="padding:3px 7px" onclick="moveQuestion('+i+',1)">↓</button> '+
          '<button class="icon-btn" style="padding:3px 7px;color:var(--red)" onclick="removeQuestion('+i+')">削除</button>'+
        '</span>'+
      '</div>'+
      '<input type="text" class="inp" style="font-size:13px" placeholder="問題文" value="'+esc(q.text)+'" oninput="crSet('+i+',\'text\',this.value)">'+
      body+
      perqField+
    '</div>';
  }).join('');
}

// 時間モード切替：全体制限の分入力・問題ごとヒントの表示を切り替え、問題カードを再描画

// クリップボードにコピー（新API→execCommandフォールバック）
async function copyToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){ /* フォールバックへ */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

// 今フォームにある問題を JSON 文字列にする（見本/コピー用）
function buildCurrentQuizJson(){
  const title = (document.getElementById('cr-title') ? document.getElementById('cr-title').value.trim() : '') || '';
  const subject = (document.getElementById('cr-subject') ? document.getElementById('cr-subject').value : '') || '';
  const questions = (crQuestions || []).map(q => {
    if(q.type === 'choice'){
      return { type:'choice', text:q.text||'', answer:q.answer||'', choices:(q.choices||[]).filter(c=>c!=='') };
    }
    return { type:'number', text:q.text||'', answer:q.answer||'' };
  });
  const obj = {};
  if(title) obj.title = title;
  if(subject) obj.subject = subject;
  obj.questions = questions;
  return JSON.stringify(obj, null, 2);
}

// 今の問題をそのままJSONでコピー（下のテキストエリアにも表示して中身を確認できる）
async function copyCurrentJson(){
  if(!crQuestions || !crQuestions.length){ showToast('先に問題を1問以上つくってください','error'); return; }
  const json = buildCurrentQuizJson();

  showToast(ok ? 'JSONを表示＆コピーしました' : '表示しました（コピーは失敗）', ok ? 'success' : 'error');
}

// ChatGPT等に貼る用：依頼文＋今の問題を見本として付けてコピー

function importJson(){
  const raw = document.getElementById('cr-json').value.trim();
  if(!raw){ showToast('JSONを貼り付けてください','error'); return; }
  let obj;
  try{ obj = JSON.parse(raw); }catch(e){ showToast('JSONの形式が正しくありません','error'); return; }
  const qs = Array.isArray(obj) ? obj : obj.questions;
  if(!Array.isArray(qs) || !qs.length){ showToast('questions が見つかりません','error'); return; }
  if(obj.title && !document.getElementById('cr-title').value) document.getElementById('cr-title').value = obj.title;
  if(obj.subject) document.getElementById('cr-subject').value = obj.subject;
  let added=0, skipped=0;
  qs.forEach(q=>{
    if(!q || !q.text || q.answer==null){ skipped++; return; }
    if(q.type==='choice'){
      let ch = Array.isArray(q.choices) ? q.choices.slice() : [];
      // 正解を必ず含め、6つに整える
      if(ch.indexOf(q.answer)===-1) ch.unshift(q.answer);
      ch = ch.filter((v,idx)=>ch.indexOf(v)===idx); // 重複除去
      while(ch.length<6) ch.push('');
      ch = ch.slice(0,6);
      // 正解を先頭に
      ch = [q.answer].concat(ch.filter(c=>c!==q.answer)).slice(0,6);
      crQuestions.push({type:'choice', text:String(q.text), answer:String(q.answer), choices:ch});
    }else{
      crQuestions.push({type:'number', text:String(q.text), answer:String(q.answer), choices:null});
    }
    added++;
  });
  document.getElementById('cr-json').value='';
  renderCrQuestions();
  showToast(added+'問を取り込みました'+(skipped?'（'+skipped+'問スキップ）':''), 'success');
}

// テスト保存（mini_quiz_sets + mini_quiz_questions）
async function saveQuizSet(){
  const title = document.getElementById('cr-title').value.trim();
  const subject = document.getElementById('cr-subject').value;
  if(!title){ showToast('テスト名を入力してください','error'); return; }
  // 時間設定を収集
  const timeMode = (document.getElementById('cr-time-mode') && document.getElementById('cr-time-mode').value) || 'none';
  let totalLimitSec = null;
  if(timeMode==='total'){
    const min = parseFloat(document.getElementById('cr-total-min').value);
    if(!(min>0)){ showToast('全体の制限時間（分）を入力してください','error'); return; }
    totalLimitSec = Math.round(min*60);
  }
  // 入力チェック
  const valid = crQuestions.filter(q=>q.text && q.answer);
  if(!valid.length){ showToast('問題を1問以上入力してください','error'); return; }
  if(timeMode==='per_q'){
    const noLimit = valid.some(q=>!(q.time_limit_sec>0));
    if(noLimit && !confirm('制限秒数が未設定（0または空欄）の問題があります。その問は無制限になります。このまま保存しますか？')) return;
  }
  for(const q of valid){
    if(q.type==='choice'){
      const filled = q.choices.filter(c=>c && c.trim());
      if(filled.length<2){ showToast('6択問題は選択肢を2つ以上入力してください','error'); return; }
      if(q.choices.indexOf(q.answer)===-1 && filled.indexOf(q.answer)===-1){
        // 1つ目を正解扱いにしているので answer 同期
        q.answer = q.choices[0];
      }
    }
  }
  showLoading('保存中...');
  try{
    if(crEditSetId){
      // 編集モード：set を更新 → 既存問題を全削除 → 全INSERT（全置換）
      await sbPatch('mini_quiz_sets','id=eq.'+crEditSetId,{ title:title, subject:subject, time_mode:timeMode, time_limit_sec:totalLimitSec });
      await sbDelete('mini_quiz_questions','quiz_set_id=eq.'+crEditSetId);
      const rows = valid.map((q,idx)=>({
        quiz_set_id:crEditSetId, q_order:idx, q_type:q.type, text:q.text, answer:q.answer,
        choices: q.type==='choice' ? q.choices.filter(c=>c && c.trim()) : null,
        time_limit_sec: (timeMode==='per_q' && q.time_limit_sec>0) ? q.time_limit_sec : null
      }));
      await sbPost('mini_quiz_questions', rows, 'return=minimal');
      hideLoading();
      resetCreateForm(false);
      showToast('変更を保存しました', 'success');
      staffTab('list');
      return;
    }
    const set = await sbPost('mini_quiz_sets', { title:title, subject:subject, created_by:staffId, time_mode:timeMode, time_limit_sec:totalLimitSec });
    const setId = Array.isArray(set)?set[0].id:set.id;
    const rows = valid.map((q,idx)=>({
      quiz_set_id:setId, q_order:idx, q_type:q.type, text:q.text, answer:q.answer,
      choices: q.type==='choice' ? q.choices.filter(c=>c && c.trim()) : null,
      time_limit_sec: (timeMode==='per_q' && q.time_limit_sec>0) ? q.time_limit_sec : null
    }));
    await sbPost('mini_quiz_questions', rows, 'return=minimal');
    hideLoading();
    crQuestions=[]; renderCrQuestions();
    document.getElementById('cr-title').value='';
    showToast('テストを保存しました', 'success');
    staffTab('list');
  }catch(e){ hideLoading(); showToast('保存エラー: '+e.message, 'error'); }
}

// 配信の削除：配信本体＋その受験結果をまとめて物理削除。
// 要 SQL: allow_quiz_delete.sql（未実行だと403/権限エラー → 案内トースト）
async function deleteAssign(assignId){
  // まず受験件数を確認して警告文を出す
  let n=0;
  try{ const rs=await sbGet('mini_quiz_results','quiz_assignment_id=eq.'+assignId+'&select=id'); n=(rs||[]).length; }catch(e){}
  const warn = n>0
    ? ('この配信を削除しますか？\n受験結果 '+n+'件も一緒に削除されます。（元に戻せません）')
    : 'この配信を削除しますか？（元に戻せません）';
  if(!confirm(warn)) return;
  showLoading('削除中...');
  try{
    // 先に結果を消してから配信を消す（外部キー無しでも整合を保つ）
    if(n>0){ await sbDelete('mini_quiz_results','quiz_assignment_id=eq.'+assignId); }
    await sbDelete('mini_quiz_assignments','id=eq.'+assignId);
    hideLoading(); showToast('配信を削除しました','success'); loadStaffSets();
    // 統計画面が開いていれば配信リストを更新
    if(typeof loadAssignSelectForStats==='function'){ try{ loadAssignSelectForStats(); }catch(e){} }
  }catch(e){
    hideLoading();
    const msg=String(e&&e.message||e);
    if(/403|permission|denied|policy/i.test(msg)){
      showToast('削除権限がありません。allow_quiz_delete.sql を実行してください','error');
    }else{
      showToast('削除エラー: '+msg,'error');
    }
  }
}

let solveState=null; // {assignId, setId, questions:[{...,shuffled:[]}], given:[]}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// 秒数を「◯分◯秒」表記に（60未満は「◯秒」）
function fmtElapsed(sec){
  if(sec==null || isNaN(sec)) return '';
  const s = Math.max(0, Math.round(sec));
  if(s < 60) return s + '秒';
  const m = Math.floor(s/60), r = s%60;
  return m + '分' + (r ? r + '秒' : '');
}
// 数値問題のダミー選択肢を自動生成（正解の周辺値）
function genNumberChoices(answer){
  const n = parseFloat(answer);
  const set = new Set([answer]);
  if(!isNaN(n) && isFinite(n)){
    const cands = [n+1, n-1, n+2, n-2, -n, n*2, Math.round(n/2), n+10, n-10];
    for(const c of cands){
      if(set.size>=6) break;
      // 整数なら整数表記、小数なら桁を合わせる
      let v = Number.isInteger(n) ? String(Math.round(c)) : String(c);
      if(v!==answer) set.add(v);
    }
  }
  // 数値変換できない/足りない場合の保険
  let i=1;
  while(set.size<6){ set.add(answer+'?'+i); i++; }
  return shuffle([...set].slice(0,6));
}

async function startSolve(assignId, setId){
  showLoading('読み込み中...');
  try{
    // 二重提出ガード（最新確認）
    const exist = await sbGet('mini_quiz_results','quiz_assignment_id=eq.'+assignId+'&student_id=eq.'+currentStudent.id+'&select=id');
    if(exist && exist.length){ hideLoading(); showToast('この小テストは提出済みです','info'); loadStudentQuizzes(); return; }
    const qs = await sbGet('mini_quiz_questions','quiz_set_id=eq.'+setId+'&order=q_order&select=*');
    if(!qs.length){ hideLoading(); showToast('問題がありません','error'); return; }
    const set = await sbGet('mini_quiz_sets','id=eq.'+setId+'&select=title,time_mode,time_limit_sec');
    const timeMode = (set[0] && set[0].time_mode) || 'none';
    const totalLimitSec = (set[0] && set[0].time_limit_sec) || null;
    solveState={ assignId, setId, timeMode, totalLimitSec, startedAt: Date.now(), questions: qs.map(q=>{
      let display=null;
      if(q.q_type==='choice'){ display = shuffle((q.choices||[]).filter(c=>c&&String(c).trim())); }
      else { display = genNumberChoices(q.answer); }
      return { id:q.id, type:q.q_type, text:q.text, answer:q.answer, display:display, time_limit_sec:(q.time_limit_sec!=null?q.time_limit_sec:null) };
    }), given:{}, curQ:0 };
    hideLoading();
    document.getElementById('solve-title').textContent = (set[0]&&set[0].title)||'小テスト';
    document.getElementById('solve-result').style.display='none';
    document.getElementById('solve-submit').style.display='block';
    showScreen('screen-solve');
    if(timeMode==='per_q'){ startPerQuestion(0); }
    else { renderSolve(); if(timeMode==='total'){ startTotalTimer(totalLimitSec); } }
  }catch(e){ hideLoading(); showToast('エラー: '+e.message,'error'); }
}

// ============================================================
// タイマー：全体制限（total）
// ============================================================
let quizTimer = null;
function clearQuizTimer(){ if(quizTimer){ clearInterval(quizTimer); quizTimer=null; } }

function startTotalTimer(limitSec){
  clearQuizTimer();
  const bar = document.getElementById('solve-timer');
  bar.style.display = 'block';
  let remain = limitSec;
  const label = document.getElementById('solve-timer-label');
  const fill = document.getElementById('solve-timer-fill');
  function paint(){
    const mm = Math.floor(remain/60), ss = remain%60;
    label.textContent = '残り ' + mm + ':' + String(ss).padStart(2,'0');
    const pct = Math.max(0, Math.round(remain/limitSec*100));
    fill.style.width = pct + '%';
    fill.style.background = remain<=10 ? 'var(--red)' : (remain<=30 ? 'var(--orange, #E0A96F)' : 'var(--green-ok)');
  }
  paint();
  quizTimer = setInterval(()=>{
    remain--;
    if(remain<=0){ paint(); clearQuizTimer(); showToast('時間切れです。自動提出します','info'); submitSolve(true); return; }
    paint();
  }, 1000);
}

// ============================================================
// タイマー：問題ごと制限（per_q）— 1問ずつ表示、戻れない、時間切れで次へ／最終問で自動提出
// ============================================================
function startPerQuestion(idx){
  const st = solveState;
  st.curQ = idx;
  clearQuizTimer();
  renderSolveSingle(idx);
  const q = st.questions[idx];
  const limit = (q.time_limit_sec>0) ? q.time_limit_sec : null;
  const bar = document.getElementById('solve-timer');
  if(!limit){ bar.style.display='none'; return; } // 無制限の問は次へボタンのみ
  bar.style.display='block';
  let remain = limit;
  const label = document.getElementById('solve-timer-label');
  const fill = document.getElementById('solve-timer-fill');
  function paint(){
    label.textContent = '残り ' + remain + '秒';
    const pct = Math.max(0, Math.round(remain/limit*100));
    fill.style.width = pct + '%';
    fill.style.background = remain<=3 ? 'var(--red)' : (remain<=8 ? 'var(--orange, #E0A96F)' : 'var(--green-ok)');
  }
  paint();
  quizTimer = setInterval(()=>{
    remain--;
    if(remain<=0){ paint(); clearQuizTimer(); nextPerQuestion(); return; }
    paint();
  }, 1000);
}

// per_q：次の問題へ（最終問なら提出）
function nextPerQuestion(){
  const st = solveState;
  clearQuizTimer();
  const next = st.curQ + 1;
  if(next >= st.questions.length){ submitSolve(true); return; }
  startPerQuestion(next);
}

// ============================================================
// スタッフ：プレビュー（生徒画面と同じ見た目を、ログイン切替なし・DB書き込みなしで確認）
// ============================================================
// 共通：問題配列 [{id,type,text,answer,choices}] から solveState を組み、solve画面をプレビュー表示
function openPreview(title, questions, fromList){
  if(!questions || !questions.length){ showToast('プレビューする問題がありません','error'); return; }
  solveState = { assignId:null, setId:null, preview:true, fromList:!!fromList, questions: questions.map(q=>{
    let display=null;
    if(q.type==='choice'){ display = shuffle((q.choices||[]).filter(c=>c&&String(c).trim())); }
    else { display = genNumberChoices(q.answer); }
    return { id:q.id, type:q.type, text:q.text, answer:q.answer, display:display };
  }), given:{} };
  document.getElementById('solve-title').textContent = (title||'小テスト') + '（プレビュー）';
  renderSolve();
  document.getElementById('solve-result').style.display='none';
  // 提出ボタンを「答え合わせを見る」に差し替え（採点はローカルのみ・DB書き込みなし）
  const btn = document.getElementById('solve-submit');
  btn.style.display='block';
  btn.textContent='✅ 答え合わせを表示（プレビュー）';
  showScreen('screen-solve');
  window.scrollTo(0,0);
}

// 作成フォームの現在の問題（未保存でもOK）からプレビュー
function previewFromCreate(){
  const valid = (crQuestions||[]).filter(q=>q.text && q.answer);
  if(!valid.length){ showToast('先に問題を1問以上入力してください','error'); return; }
  const title = (document.getElementById('cr-title').value || '').trim() || '（無題）';
  const questions = valid.map((q,idx)=>({
    id:'preview-'+idx, type:q.type, text:q.text, answer:q.answer,
    choices: q.type==='choice' ? (q.choices||[]).filter(c=>c && c.trim()) : null
  }));
  openPreview(title, questions, false);
}

// 保存済みテスト（setId）からプレビュー
async function previewSet(setId, title){
  showLoading('読み込み中...');
  try{
    const qs = await sbGet('mini_quiz_questions','quiz_set_id=eq.'+setId+'&order=q_order&select=*');
    hideLoading();
    if(!qs.length){ showToast('問題がありません','error'); return; }
    const questions = qs.map(q=>({ id:q.id, type:q.q_type, text:q.text, answer:q.answer, choices:q.choices }));
    openPreview(title, questions, true);
  }catch(e){ hideLoading(); showToast('読み込みエラー: '+e.message,'error'); }
}

// プレビューの「答え合わせ表示」：DBに書かず、その場で正誤ハイライトのみ行う
function previewGrade(){
  const st=solveState;
  let correct=0;
  const answers = st.questions.map(q=>{
    const given = st.given[q.id]!=null ? String(st.given[q.id]) : null;
    const ok = given!=null && String(given).trim()===String(q.answer).trim();
    if(ok) correct++;
    return { question_id:q.id, given:given, correct:ok };
  });
  document.getElementById('solve-submit').style.display='none';
  const ansMap={}; answers.forEach(a=>ansMap[a.question_id]=a);
  st.questions.forEach(q=>{
    const card=document.querySelector('.card[data-qid="'+q.id+'"]');
    if(!card) return;
    const a=ansMap[q.id];
    card.querySelectorAll('.choice-opt').forEach(o=>{
      const v=o.getAttribute('data-val');
      o.style.pointerEvents='none';
      if(v===String(q.answer)) o.classList.add('correct');
      else if(a && a.given===v && !a.correct) o.classList.add('wrong');
    });
  });
  const total=st.questions.length;
  const rate = total?Math.round(correct/total*100):0;
  const box=document.getElementById('solve-result');
  box.style.display='block';
  box.innerHTML='<div style="background:var(--green-ok-l);border-radius:12px;padding:16px;text-align:center">'+
    '<div style="font-size:13px;color:var(--green-ok);font-weight:700">プレビュー採点（保存されません）</div>'+
    '<div style="font-size:28px;font-weight:900;color:var(--green-ok)">'+correct+' / '+total+' 正解</div>'+
    '<div class="muted">正答率 '+rate+'%　正解を緑で表示しています</div>'+
    '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="exitPreview()">スタッフ画面に戻る</button>'+
  '</div>';
  box.scrollIntoView({behavior:'smooth'});
}

// プレビュー終了：スタッフ画面へ戻る
function exitPreview(){
  clearQuizTimer();
  const tb = document.getElementById('solve-timer'); if(tb) tb.style.display='none';
  const wasList = (solveState && solveState.fromList);
  solveState=null;
  showScreen('screen-staff');
  staffTab(wasList ? 'list' : 'create');
}

function renderSolve(){
  const st=solveState;
  document.getElementById('solve-progress').textContent = (st.preview? '【プレビュー】全' : '全')+st.questions.length+'問　自分で解いてから答えを選んでね';
  document.getElementById('solve-questions').innerHTML = st.questions.map((q,i)=>{
    const opts = q.display.map(c=>{
      const selp = (st.given[q.id]===String(c))?' sel':'';
      return '<div class="choice-opt'+selp+'" onclick="pickAnswer(this)" data-qid="'+esc(q.id)+'" data-val="'+esc(String(c))+'">'+mathHTML(c)+'</div>';
    }).join('');
    const typeLabel = q.type==='number' ? '<span class="pill pill-num">数値</span>' : '<span class="pill pill-choice">6択</span>';
    return '<div class="card" data-qid="'+q.id+'">'+
      '<div style="font-size:11px;color:var(--green-d);margin-bottom:3px">問'+(i+1)+' '+typeLabel+'</div>'+
      '<div style="font-size:15px;font-weight:500;margin-bottom:10px">'+mathHTML(q.text)+'</div>'+
      opts+
    '</div>';
  }).join('');
}

// per_q：1問だけ表示（進捗と「次へ」ボタン付き、戻る操作なし）
function renderSolveSingle(idx){
  const st = solveState;
  const q = st.questions[idx];
  const total = st.questions.length;
  document.getElementById('solve-progress').textContent = '問 ' + (idx+1) + ' / ' + total + '　※前の問題には戻れません';
  const opts = q.display.map(c=>{
    const selp = (st.given[q.id]===String(c))?' sel':'';
    return '<div class="choice-opt'+selp+'" onclick="pickAnswer(this)" data-qid="'+esc(q.id)+'" data-val="'+esc(String(c))+'">'+mathHTML(c)+'</div>';
  }).join('');
  const typeLabel = q.type==='number' ? '<span class="pill pill-num">数値</span>' : '<span class="pill pill-choice">6択</span>';
  document.getElementById('solve-questions').innerHTML =
    '<div class="card" data-qid="'+q.id+'">'+
      '<div style="font-size:11px;color:var(--green-d);margin-bottom:3px">問'+(idx+1)+' '+typeLabel+'</div>'+
      '<div style="font-size:15px;font-weight:500;margin-bottom:10px">'+mathHTML(q.text)+'</div>'+
      opts+
    '</div>';
  // 提出ボタンのラベルを「次へ／提出する」に（動作は onSolveSubmitClick が分岐）
  const btn = document.getElementById('solve-submit');
  btn.style.display = 'block';
  btn.textContent = (idx+1>=total) ? '提出する' : '次の問題へ →';
}

function pickAnswer(elDom){
  const qid = elDom.getAttribute('data-qid');
  const val = elDom.getAttribute('data-val');
  solveState.given[qid]=val;
  // 同じ問題カード内の選択状態を更新
  const card = elDom.closest('.card[data-qid]');
  card.querySelectorAll('.choice-opt').forEach(o=>o.classList.remove('sel'));
  elDom.classList.add('sel');
}

// 提出ボタンの統一ハンドラ：モードに応じて分岐
function onSolveSubmitClick(){
  const st = solveState;
  if(!st){ return; }
  if(st.preview){ previewGrade(); return; }
  if(st.timeMode==='per_q'){ nextPerQuestion(); return; } // 次へ／最終問なら提出
  submitSolve(false);
}

async function submitSolve(auto){
  const st=solveState;
  // プレビュー中は採点だけローカルで表示（DBに書かない）
  if(st && st.preview){ previewGrade(); return; }
  clearQuizTimer();
  // 自動提出（時間切れ）のときは未回答確認をスキップ
  if(!auto){
    const unanswered = st.questions.filter(q=>st.given[q.id]==null);
    if(unanswered.length){ if(!confirm(unanswered.length+'問 未回答です。提出しますか？')) return; }
  }
  const elapsedSec = st.startedAt ? Math.max(0, Math.round((Date.now()-st.startedAt)/1000)) : null;
  showLoading('採点中...');
  try{
    let correct=0;
    const answers = st.questions.map(q=>{
      const given = st.given[q.id]!=null ? String(st.given[q.id]) : null;
      const ok = given!=null && String(given).trim()===String(q.answer).trim();
      if(ok) correct++;
      return { question_id:q.id, given:given, correct:ok };
    });
    // 1人1回：UNIQUE制約で二重提出を弾く
    await sbPost('mini_quiz_results',{
      quiz_assignment_id:st.assignId, student_id:currentStudent.id,
      answers:answers, correct_count:correct, total_count:st.questions.length,
      elapsed_sec:elapsedSec
    },'return=minimal');
    hideLoading();
    showSolveResult(correct, st.questions.length, answers);
  }catch(e){
    hideLoading();
    if(String(e.message).indexOf('409')!==-1 || String(e.message).indexOf('duplicate')!==-1){
      showToast('この小テストは提出済みです','info'); backToStudent();
    }else{
      showToast('提出エラー: '+e.message,'error');
    }
  }
}

async function showSolveResult(correct, total, answers){
  clearQuizTimer();
  document.getElementById('solve-timer').style.display='none';
  document.getElementById('solve-submit').style.display='none';
  const st=solveState;
  // per_q モードは1問ずつ表示だったので、結果画面では全問を並べ直してから正誤を反映
  if(st.timeMode==='per_q'){
    document.getElementById('solve-progress').textContent = '全'+st.questions.length+'問の結果';
    document.getElementById('solve-questions').innerHTML = st.questions.map((q,i)=>{
      const opts = q.display.map(c=>{
        const selp = (st.given[q.id]===String(c))?' sel':'';
        return '<div class="choice-opt'+selp+'" data-qid="'+esc(q.id)+'" data-val="'+esc(String(c))+'">'+mathHTML(c)+'</div>';
      }).join('');
      const typeLabel = q.type==='number' ? '<span class="pill pill-num">数値</span>' : '<span class="pill pill-choice">6択</span>';
      return '<div class="card" data-qid="'+q.id+'">'+
        '<div style="font-size:11px;color:var(--green-d);margin-bottom:3px">問'+(i+1)+' '+typeLabel+'</div>'+
        '<div style="font-size:15px;font-weight:500;margin-bottom:10px">'+mathHTML(q.text)+'</div>'+opts+'</div>';
    }).join('');
  }
  // 各問題の正誤を画面に反映
  const ansMap={}; answers.forEach(a=>ansMap[a.question_id]=a);
  st.questions.forEach(q=>{
    const card=document.querySelector('.card[data-qid="'+q.id+'"]');
    if(!card) return;
    const a=ansMap[q.id];
    card.querySelectorAll('.choice-opt').forEach(o=>{
      const v=o.getAttribute('data-val');
      o.style.pointerEvents='none';
      if(v===String(q.answer)) o.classList.add('correct');
      else if(a && a.given===v && !a.correct) o.classList.add('wrong');
    });
  });
  // クラス平均（任意：取得できなければ省略）
  let avgHtml='';
  try{
    const results = await sbGet('mini_quiz_results','quiz_assignment_id=eq.'+st.assignId+'&select=correct_count,total_count');
    if(results.length){
      const avg = results.reduce((s,r)=>s+(r.total_count?r.correct_count/r.total_count:0),0)/results.length;
      avgHtml='<div class="muted" style="margin-top:4px">クラス平均 '+Math.round(avg*100)+'%（'+results.length+'人提出）</div>';
    }
  }catch(e){}
  const rate = total?Math.round(correct/total*100):0;
  const elapsedLabel = st.startedAt ? fmtElapsed(Math.round((Date.now()-st.startedAt)/1000)) : '';
  const box=document.getElementById('solve-result');
  box.style.display='block';
  box.innerHTML='<div style="background:var(--green-ok-l);border-radius:12px;padding:16px;text-align:center">'+
    '<div style="font-size:13px;color:var(--green-ok);font-weight:700">提出完了</div>'+
    '<div style="font-size:28px;font-weight:900;color:var(--green-ok)">'+correct+' / '+total+' 正解</div>'+
    '<div class="muted">正答率 '+rate+'%'+(elapsedLabel?'　⏱ '+elapsedLabel:'')+'</div>'+avgHtml+
    '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="backToStudent()">一覧に戻る</button>'+
  '</div>';
  box.scrollIntoView({behavior:'smooth'});
}

async function loadAssignSelectForStats(){
  const sel=document.getElementById('st-assign-select');
  try{
    const assigns = await sbGet('mini_quiz_assignments','order=session_date.desc&select=*&limit=80');
    if(!assigns.length){ sel.innerHTML='<option value="">配信がありません</option>'; document.getElementById('stats-body').innerHTML=''; return; }
    const setIds=[...new Set(assigns.map(a=>a.quiz_set_id))];
    const clsIds=[...new Set(assigns.map(a=>a.class_master_id))];
    const [sets,cms]=await Promise.all([
      sbGet('mini_quiz_sets','id=in.('+setIds.join(',')+')&select=id,title'),
      sbGet('class_master','id=in.('+clsIds.join(',')+')&select=id,name')
    ]);
    const setMap={}; sets.forEach(s=>setMap[s.id]=s.title);
    const clsMap={}; cms.forEach(c=>clsMap[c.id]=c.name);
    sel.innerHTML='<option value="">配信を選択</option>'+assigns.map(a=>{
      const label=(setMap[a.quiz_set_id]||'テスト')+' / '+(clsMap[a.class_master_id]||'授業')+' '+fmtDateLabel(a.session_date,a.period);
      return '<option value="'+a.id+'|'+a.quiz_set_id+'">'+esc(label)+'</option>';
    }).join('');
  }catch(e){ sel.innerHTML='<option value="">エラー</option>'; }
}

async function loadStats(){
  const v=document.getElementById('st-assign-select').value;
  const body=document.getElementById('stats-body');
  if(!v){ body.innerHTML=''; return; }
  const [assignId, setId]=v.split('|');
  body.innerHTML='<div class="muted" style="text-align:center;padding:16px">集計中...</div>';
  try{
    const [qs, results] = await Promise.all([
      sbGet('mini_quiz_questions','quiz_set_id=eq.'+setId+'&order=q_order&select=*'),
      sbGet('mini_quiz_results','quiz_assignment_id=eq.'+assignId+'&select=*')
    ]);
    if(!results.length){ body.innerHTML='<div class="muted" style="text-align:center;padding:16px">まだ提出がありません</div>'; return; }
    // 全体平均
    const avg = results.reduce((s,r)=>s+(r.total_count?r.correct_count/r.total_count:0),0)/results.length;
    // 問題別正答率
    const perQ={}; qs.forEach(q=>perQ[q.id]={ok:0,total:0,text:q.text});
    results.forEach(r=>{
      (r.answers||[]).forEach(a=>{
        if(perQ[a.question_id]){ perQ[a.question_id].total++; if(a.correct) perQ[a.question_id].ok++; }
      });
    });
    let html='<div style="display:flex;gap:8px;margin-bottom:12px">'+
      '<div class="card" style="flex:1;text-align:center;margin:0"><div class="muted">提出</div><div style="font-size:22px;font-weight:900">'+results.length+'</div></div>'+
      '<div class="card" style="flex:1;text-align:center;margin:0"><div class="muted">平均点</div><div style="font-size:22px;font-weight:900;color:var(--green-ok)">'+Math.round(avg*100)+'%</div></div>'+
    '</div>';
    html+='<div class="sec-title">問題別 正答率</div>';
    qs.forEach((q,i)=>{
      const p=perQ[q.id]; const rate=p.total?Math.round(p.ok/p.total*100):0;
      const color = rate>=70?'var(--green-ok)':rate>=50?'var(--orange)':'var(--red)';
      html+='<div style="margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'+
          '<span>問'+(i+1)+'　'+esc(q.text.slice(0,18))+(q.text.length>18?'…':'')+'</span>'+
          '<span style="font-weight:700;color:'+color+'">'+rate+'%</span>'+
        '</div>'+
        '<div class="bar-bg"><div class="bar-fill" style="width:'+rate+'%;background:'+color+'"></div></div>'+
      '</div>';
    });
    // 生徒別（折りたたみ）＋各問◯×展開＋結果取消
    const sids=results.map(r=>r.student_id);
    let nameMap={};
    if(sids.length){ try{ const stus=await sbGet('students','id=in.('+sids.join(',')+')&select=id,name'); stus.forEach(s=>nameMap[s.id]=s.name); }catch(e){} }
    // 問題の並び順マップ（question_id -> 表示番号）
    const qOrder={}; qs.forEach((q,i)=>{ qOrder[q.id]=i+1; });
    // 展開・取消ハンドラ用に結果を保持
    window._statCtx = { assignId: assignId, results: results, nameMap: nameMap, qOrder: qOrder, qCount: qs.length };
    const sorted = results.slice().sort((a,b)=>((b.correct_count||0)/(b.total_count||1))-((a.correct_count||0)/(a.total_count||1)));
    html+='<div class="card" style="margin-top:8px"><div style="font-size:12px;font-weight:700;cursor:pointer" onclick="document.getElementById(\'stat-students\').style.display=document.getElementById(\'stat-students\').style.display===\'none\'?\'block\':\'none\'">👥 生徒別の正誤を見る ▼</div>'+
      '<div id="stat-students" style="display:none;margin-top:8px">'+
      sorted.map(r=>{
        const nm=esc(nameMap[r.student_id]||'(生徒)');
        const sc=(r.correct_count!=null?r.correct_count:'-')+'/'+(r.total_count!=null?r.total_count:'-');
        const el=fmtElapsed(r.elapsed_sec);
        return '<div style="border-top:1px solid var(--border)">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 0;cursor:pointer" onclick="toggleStatStudent(\''+r.id+'\')">'+
            '<span>▸ '+nm+'</span>'+
            '<span style="display:flex;gap:10px;align-items:center">'+
              (el?'<span class="muted" style="font-size:11px">⏱ '+el+'</span>':'')+
              '<span style="font-weight:700">'+sc+'</span>'+
              '<button class="btn btn-ghost" style="padding:3px 8px;font-size:11px;color:var(--red)" onclick="event.stopPropagation();deleteResult(\''+r.id+'\')">取消</button>'+
            '</span>'+
          '</div>'+
          '<div id="statstu-'+r.id+'" style="display:none;padding:4px 0 10px"></div>'+
        '</div>';
      }).join('')+
      '</div></div>';
    body.innerHTML=html;
  }catch(e){ body.innerHTML='<div class="muted" style="text-align:center;padding:16px;color:var(--red)">エラー: '+esc(e.message)+'</div>'; }
}

// 生徒行をタップ → 各問◯×を展開表示（mini_quiz_results.answers を使用）
function toggleStatStudent(resultId){
  const box=document.getElementById('statstu-'+resultId);
  if(!box) return;
  if(box.style.display!=='none'){ box.style.display='none'; return; }
  const ctx=window._statCtx||{};
  const r=(ctx.results||[]).find(x=>String(x.id)===String(resultId));
  if(!r){ box.style.display='block'; box.innerHTML='<div class="muted" style="font-size:11px">データがありません</div>'; return; }
  const ans=(r.answers||[]).slice().sort((a,b)=>(ctx.qOrder[a.question_id]||0)-(ctx.qOrder[b.question_id]||0));
  let inner='';
  if(!ans.length){
    inner='<div class="muted" style="font-size:11px">各問の記録がありません（旧形式の結果）</div>';
  }else{
    inner='<div style="display:flex;flex-wrap:wrap;gap:5px">'+
      ans.map(a=>{
        const num=ctx.qOrder[a.question_id]||'?';
        const ok=a.correct;
        return '<span style="font-size:11px;padding:2px 8px;border-radius:8px;font-weight:700;background:'+(ok?'#E8F6EE':'#FCE9E7')+';color:'+(ok?'var(--green-ok)':'var(--red)')+'">問'+num+' '+(ok?'○':'×')+'</span>';
      }).join('')+
    '</div>';
  }
  box.style.display='block';
  box.innerHTML=inner;
}

// 受験結果の取消：1件の結果を物理削除（再受験できるようにする）
// 要 SQL: allow_quiz_delete.sql
async function deleteResult(resultId){
  if(!confirm('この生徒の受験結果を取り消しますか？\n（再受験できるようになります。元に戻せません）')) return;
  showLoading('取消中...');
  try{
    await sbDelete('mini_quiz_results','id=eq.'+resultId);
    hideLoading(); showToast('結果を取り消しました','success');
    loadStats();
  }catch(e){
    hideLoading();
    const msg=String(e&&e.message||e);
    if(/403|permission|denied|policy/i.test(msg)){
      showToast('削除権限がありません。allow_quiz_delete.sql を実行してください','error');
    }else{
      showToast('取消エラー: '+msg,'error');
    }
  }
}

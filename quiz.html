<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2D6DB5">
<title>fit授業後小テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--green:#2D6DB5;--green-d:#184A86;--green-l:#E8F1FB;--bg:#F5F8FC;--surface:#fff;--text:#2C2C2A;--muted:#7A7770;--border:#D2E0EF;--red:#D94040;--red-l:#FFECEC;--green-ok:#2E8B57;--green-ok-l:#E8F6EE;--orange:#E08A1E;--orange-l:#FDF1DF;--radius:16px;--radius-sm:10px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
  .screen{display:none;min-height:100vh;max-width:480px;margin:0 auto}
  .screen.active{display:block}
  #loading{position:fixed;inset:0;background:rgba(245,248,252,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:500}
  #loading.hidden{display:none}
  .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading-text{font-size:13px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:600;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--green-ok)}
  .toast.info{background:#444}
  .toast.error{background:var(--red)}
  /* ログイン */
  #screen-login{flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
  #screen-login.active{display:flex}
  .login-logo{text-align:center}
  .login-logo .ico{font-size:50px}
  .login-logo .ttl{font-size:22px;font-weight:900;color:var(--green-d);margin-top:6px}
  .login-logo .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .login-card{width:100%;background:var(--surface);border-radius:var(--radius);padding:22px 20px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:1px solid var(--border)}
  .field-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block}
  .field-input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:var(--bg);transition:border-color .15s;margin-bottom:14px}
  .field-input:focus{outline:none;border-color:var(--green)}
  .primary-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),var(--green-d));border:none;border-radius:var(--radius-sm);color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(45,109,181,.3)}
  .error-msg{background:var(--red-l);border:1px solid #F5BABA;border-radius:var(--radius-sm);padding:9px 13px;font-size:12px;color:var(--red);margin-top:10px;display:none}
  .error-msg.show{display:block}
  /* 共通 */
  .header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
  .header .h-title{font-size:16px;font-weight:700;color:var(--green-d)}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer}
  .wrap{padding:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;margin-bottom:10px}
  .sec-title{font-size:13px;font-weight:700;color:var(--text);margin:4px 0 10px}
  .sel,.inp,.ta{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:var(--bg)}
  .sel:focus,.inp:focus,.ta:focus{outline:none;border-color:var(--green)}
  .ta{resize:vertical;min-height:90px}
  .btn{padding:12px;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff}
  .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-ok{background:linear-gradient(135deg,#2E8B57,#1E6B3E);color:#fff}
  .btn-warn{background:var(--orange-l);color:var(--orange);border:1px solid #F3D08A}
  .btn-block{width:100%}
  .role-tabs{display:flex;gap:8px;margin-bottom:14px}
  .role-tab{flex:1;padding:11px 0;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;border-radius:10px;cursor:pointer}
  .role-tab.active{background:linear-gradient(135deg,var(--green),var(--green-d));border-color:var(--green);color:#fff}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:11px}
  .pill-num{background:var(--green-l);color:var(--green-d)}
  .pill-choice{background:var(--green-ok-l);color:var(--green-ok)}
  .pill-ready{background:var(--orange-l);color:var(--orange)}
  .pill-open{background:var(--green-ok-l);color:var(--green-ok)}
  .pill-closed{background:#EEE;color:var(--muted)}
  .muted{color:var(--muted);font-size:12px}
  .choice-opt{padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;cursor:pointer;background:var(--surface);margin-bottom:7px}
  .choice-opt.sel{border-color:var(--green);background:var(--green-l);font-weight:700}
  .choice-opt.correct{border-color:var(--green-ok);background:var(--green-ok-l)}
  .choice-opt.wrong{border-color:var(--red);background:var(--red-l)}
  .bar-bg{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px}
</style>
</head>
<body>

<div id="loading" class="hidden"><div class="spinner"></div><div id="loading-text">読み込み中...</div></div>
<div id="toast" class="toast"></div>

<!-- ===== ログイン ===== -->
<div id="screen-login" class="screen">
  <div class="login-logo">
    <div class="ico">📝</div>
    <div class="ttl">fit授業後小テスト</div>
    <div class="sub">ログインしてください</div>
  </div>
  <div class="login-card">
    <label class="field-label">メールアドレス（スタッフはID）</label>
    <input type="text" id="login-email" class="field-input" autocomplete="username" placeholder="例：student@example.com / fit003">
    <label class="field-label">パスワード</label>
    <input type="password" id="login-pin" class="field-input" autocomplete="current-password" placeholder="パスワード">
    <button class="primary-btn" onclick="doLogin()">ログイン</button>
    <div id="login-error" class="error-msg"></div>
    <label style="display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:var(--muted);cursor:pointer">
      <input type="checkbox" id="keep-login" checked style="width:16px;height:16px"> ログイン状態を保持
    </label>
  </div>
</div>

<!-- ===== 生徒ホーム（解けるテスト一覧） ===== -->
<div id="screen-student" class="screen">
  <div class="header">
    <span class="h-title" id="stu-hello">小テスト</span>
    <button class="icon-btn" onclick="logout()">ログアウト</button>
  </div>
  <div class="wrap">
    <div class="sec-title">受けられる小テスト</div>
    <div id="stu-quiz-list"><div class="muted" style="text-align:center;padding:20px">読み込み中...</div></div>
  </div>
</div>

<!-- ===== 生徒：解答画面 ===== -->
<div id="screen-solve" class="screen">
  <div class="header">
    <span class="h-title" id="solve-title">小テスト</span>
    <button class="icon-btn" onclick="backToStudent()">戻る</button>
  </div>
  <div class="wrap">
    <div id="solve-progress" class="muted" style="margin-bottom:10px"></div>
    <div id="solve-questions"></div>
    <button id="solve-submit" class="btn btn-primary btn-block" style="margin-top:8px" onclick="submitSolve()">答え合わせ</button>
    <div id="solve-result" style="display:none;margin-top:14px"></div>
  </div>
</div>

<!-- ===== スタッフ画面 ===== -->
<div id="screen-staff" class="screen">
  <div class="header">
    <span class="h-title" id="staff-hello">小テスト管理</span>
    <button class="icon-btn" onclick="logout()">ログアウト</button>
  </div>
  <div class="wrap">
    <div class="role-tabs">
      <div class="role-tab active" id="rtab-list" onclick="staffTab('list')">📋 一覧</div>
      <div class="role-tab" id="rtab-create" onclick="staffTab('create')">✏️ 作成</div>
      <div class="role-tab" id="rtab-stats" onclick="staffTab('stats')">📊 集計</div>
    </div>

    <!-- 一覧（テスト＆配信） -->
    <div id="stafftab-list">
      <div class="sec-title">作成したテスト</div>
      <div id="staff-set-list"><div class="muted" style="text-align:center;padding:16px">読み込み中...</div></div>
    </div>

    <!-- 作成 -->
    <div id="stafftab-create" style="display:none">
      <div class="card">
        <div class="sec-title">小テストを作成</div>
        <label class="field-label">テスト名</label>
        <input type="text" id="cr-title" class="inp" placeholder="例：6/18 J北1年数学 復習テスト" style="margin-bottom:10px">
        <label class="field-label">科目</label>
        <select id="cr-subject" class="sel" style="margin-bottom:10px">
          <option value="数学">数学</option>
          <option value="化学">化学</option>
          <option value="物理">物理</option>
          <option value="英語">英語</option>
          <option value="国語">国語</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <!-- AI貼り付け取り込み -->
      <div class="card" style="border-color:var(--green);background:var(--green-l)">
        <div class="sec-title" style="color:var(--green-d)">🤖 AIで作った問題を貼り付け</div>
        <div class="muted" style="margin-bottom:8px">Claudeに下記フォーマットで問題を作ってもらい、JSONを貼り付けて取り込めます。</div>
        <textarea id="cr-json" class="ta" placeholder='{"questions":[{"type":"number","text":"2x+6=14 のとき x=","answer":"4"},{"type":"choice","text":"y=2x²の頂点は？","answer":"(0,0)","choices":["(0,0)","(1,2)","(0,2)","(2,0)","(-1,2)","(0,-2)"]}]}'></textarea>
        <div style="display:flex;gap:7px;margin-top:8px">
          <button class="btn btn-ghost" style="flex:1" onclick="showJsonFormat()">📄 フォーマット例</button>
          <button class="btn btn-primary" style="flex:1" onclick="importJson()">取り込み</button>
        </div>
      </div>

      <div class="sec-title">問題（<span id="cr-qcount">0</span>問）</div>
      <div id="cr-questions"></div>
      <div style="display:flex;gap:7px;margin-bottom:10px">
        <button class="btn btn-ghost" style="flex:1;border-style:dashed" onclick="addQuestion('number')">＋ 数値問題</button>
        <button class="btn btn-ghost" style="flex:1;border-style:dashed" onclick="addQuestion('choice')">＋ 6択問題</button>
      </div>
      <button class="btn btn-primary btn-block" onclick="saveQuizSet()">💾 テストを保存</button>
    </div>

    <!-- 集計 -->
    <div id="stafftab-stats" style="display:none">
      <div class="sec-title">配信を選んで正答率を見る</div>
      <select id="st-assign-select" class="sel" style="margin-bottom:12px" onchange="loadStats()">
        <option value="">配信を選択</option>
      </select>
      <div id="stats-body"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// Supabase ヘルパー（math.html / chem.html と同じ作法）
// ============================================================
const SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const SB_HDR = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

async function sbGet(table, query){
  const res = await fetch(SB_URL+'/rest/v1/'+table+'?'+query, {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!res.ok){ throw new Error(table+' GET '+res.status); }
  return await res.json();
}
async function sbPost(table, body, prefer){
  const h = Object.assign({}, SB_HDR);
  h['Prefer'] = prefer || 'return=representation';
  const res = await fetch(SB_URL+'/rest/v1/'+table, {method:'POST',headers:h,body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error(table+' POST '+res.status+' '+t); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
async function sbPatch(table, query, body){
  const res = await fetch(SB_URL+'/rest/v1/'+table+'?'+query, {method:'PATCH',headers:Object.assign({}, SB_HDR, {'Prefer':'return=minimal'}),body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error(table+' PATCH '+res.status+' '+t); }
}

// ============================================================
// 日付（JST安全）
// ============================================================
function getTodayJST(){
  const now = new Date();
  const jst = new Date(now.getTime() + (now.getTimezoneOffset()*60000) + 9*3600000);
  return jst.getFullYear()+'-'+String(jst.getMonth()+1).padStart(2,'0')+'-'+String(jst.getDate()).padStart(2,'0');
}
function fmtDateLabel(dstr, period){
  const d = new Date(dstr+'T00:00:00+09:00');
  const wd = ['日','月','火','水','木','金','土'][d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate()+'（'+wd+'）'+(period?' '+period+'限':'');
}

// ============================================================
// UI ユーティリティ
// ============================================================
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function showLoading(t){ const l=document.getElementById('loading'); document.getElementById('loading-text').textContent=t||'読み込み中...'; l.classList.remove('hidden'); }
function hideLoading(){ document.getElementById('loading').classList.add('hidden'); }
let toastTimer=null;
function showToast(msg,type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(type||''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
// 認証（students優先→staffフォールバック、math.htmlと同一作法）
// ============================================================
let currentStudent = null;   // {id,name,points}
let isStaff = false;
let staffId = null;          // 'fitNNN'（スタッフ時）

function saveLoginState(email,pin,role){ localStorage.setItem('fit_email',email); localStorage.setItem('fit_pin',pin); localStorage.setItem('fit_role',role); }
function clearLoginState(){ localStorage.removeItem('fit_email'); localStorage.removeItem('fit_pin'); localStorage.removeItem('fit_role'); }

async function tryStaffLogin(idOrEmail, pin){
  const sid = idOrEmail.trim();
  const data = await sbGet('staff','staff_id=eq.'+encodeURIComponent(sid)+'&pin=eq.'+encodeURIComponent(pin)+'&is_active=eq.true&select=*');
  if(!data || !data.length) return false;
  const st = data[0];
  isStaff = true; staffId = st.staff_id;
  currentStudent = { id: st.id, name: st.name, points: 0 };
  return true;
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim().toLowerCase();
  const rawId=document.getElementById('login-email').value.trim();
  const pin=document.getElementById('login-pin').value.trim();
  const err=document.getElementById('login-error');
  if(!email||!pin){ err.textContent='メールアドレスとパスワードを入力してください'; err.classList.add('show'); return; }
  showLoading('ログイン中...');
  try{
    const data=await sbGet('students','email=eq.'+encodeURIComponent(email)+'&pin=eq.'+encodeURIComponent(pin)+'&select=*');
    if(data && data.length){
      err.classList.remove('show');
      currentStudent=data[0]; isStaff=false; staffId=null;
      saveLoginState(email,pin,'student');
      await afterLogin();
      return;
    }
    const ok = await tryStaffLogin(rawId, pin);
    if(ok){
      err.classList.remove('show');
      saveLoginState(rawId,pin,'staff');
      await afterLogin();
      return;
    }
    hideLoading();
    err.textContent='メールアドレス（またはスタッフID）かパスワードが違います'; err.classList.add('show');
  }catch(e){ hideLoading(); err.textContent='接続エラー: '+e.message; err.classList.add('show'); }
}

async function autoLogin(){
  const email=localStorage.getItem('fit_email');
  const pin=localStorage.getItem('fit_pin');
  const role=localStorage.getItem('fit_role');
  if(!email||!pin){ showScreen('screen-login'); return; }
  showLoading('自動ログイン中...');
  try{
    if(role==='staff'){
      const ok=await tryStaffLogin(email,pin);
      if(!ok){ clearLoginState(); hideLoading(); showScreen('screen-login'); return; }
      await afterLogin(); return;
    }
    const data=await sbGet('students','email=eq.'+encodeURIComponent(email)+'&pin=eq.'+encodeURIComponent(pin)+'&select=*');
    if(!data||!data.length){ clearLoginState(); hideLoading(); showScreen('screen-login'); return; }
    currentStudent=data[0]; isStaff=false; staffId=null;
    await afterLogin();
  }catch(e){ clearLoginState(); hideLoading(); showScreen('screen-login'); }
}

function logout(){ currentStudent=null; isStaff=false; staffId=null; clearLoginState(); showScreen('screen-login'); }

async function afterLogin(){
  hideLoading();
  if(isStaff){
    document.getElementById('staff-hello').textContent='小テスト管理（'+currentStudent.name+'）';
    showScreen('screen-staff');
    staffTab('list');
  }else{
    document.getElementById('stu-hello').textContent=(currentStudent.name||'')+'さん';
    showScreen('screen-student');
    loadStudentQuizzes();
  }
}

// ============================================================
// 起動
// ============================================================
window.addEventListener('DOMContentLoaded', autoLogin);

// ============================================================
// スタッフ：タブ切替
// ============================================================
function staffTab(tab){
  ['list','create','stats'].forEach(t=>{
    document.getElementById('stafftab-'+t).style.display = (t===tab)?'block':'none';
    document.getElementById('rtab-'+t).classList.toggle('active', t===tab);
  });
  if(tab==='list') loadStaffSets();
  if(tab==='stats') loadAssignSelectForStats();
}

// ============================================================
// スタッフ：問題作成フォーム
// ============================================================
let crQuestions = []; // [{type, text, answer, choices:[]}]

function addQuestion(type){
  if(type==='choice'){
    crQuestions.push({type:'choice', text:'', answer:'', choices:['','','','','','']});
  }else{
    crQuestions.push({type:'number', text:'', answer:'', choices:null});
  }
  renderCrQuestions();
}
function removeQuestion(i){ crQuestions.splice(i,1); renderCrQuestions(); }
function moveQuestion(i,dir){
  const j=i+dir; if(j<0||j>=crQuestions.length) return;
  const tmp=crQuestions[i]; crQuestions[i]=crQuestions[j]; crQuestions[j]=tmp; renderCrQuestions();
}

// フォーム入力をcrQuestionsに反映（再描画せず保持）
function crSet(i, field, val){ if(crQuestions[i]) crQuestions[i][field]=val; }
function crSetChoice(i, ci, val){ if(crQuestions[i] && crQuestions[i].choices) crQuestions[i].choices[ci]=val; }

function renderCrQuestions(){
  document.getElementById('cr-qcount').textContent = crQuestions.length;
  const el = document.getElementById('cr-questions');
  el.innerHTML = crQuestions.map((q,i)=>{
    const pill = q.type==='choice'
      ? '<span class="pill pill-choice">6択</span>'
      : '<span class="pill pill-num">数値入力</span>';
    let body;
    if(q.type==='choice'){
      body = '<div class="muted" style="margin:6px 0 4px">選択肢（1つ目＝正解）</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">' +
        q.choices.map((c,ci)=>'<input type="text" class="inp" style="font-size:13px;'+(ci===0?'border-color:var(--green-ok)':'')+'" placeholder="'+(ci===0?'正解':'選択肢')+'" value="'+esc(c)+'" oninput="crSetChoice('+i+','+ci+',this.value)">').join('') +
        '</div>';
    }else{
      body = '<div class="muted" style="margin:6px 0 4px">正解の数値（ダミーは自動生成）</div>' +
        '<input type="text" class="inp" style="font-size:13px;max-width:140px" placeholder="例：4" value="'+esc(q.answer)+'" oninput="crSet('+i+',\'answer\',this.value)">';
    }
    return '<div class="card">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
        '<span style="font-size:12px;font-weight:700">問'+(i+1)+' '+pill+'</span>'+
        '<span>'+
          '<button class="icon-btn" style="padding:3px 7px" onclick="moveQuestion('+i+',-1)">↑</button> '+
          '<button class="icon-btn" style="padding:3px 7px" onclick="moveQuestion('+i+',1)">↓</button> '+
          '<button class="icon-btn" style="padding:3px 7px;color:var(--red)" onclick="removeQuestion('+i+')">削除</button>'+

// AI貼り付け取り込み
function showJsonFormat(){
  const sample = '【Claudeへの依頼例】\n「2次関数の頂点を求める問題を5問、下のJSON形式で作って」\n\n【形式】\n{\n  "questions": [\n    { "type":"number", "text":"問題文", "answer":"4" },\n    { "type":"choice", "text":"問題文", "answer":"正解", "choices":["正解","選択肢2","選択肢3","選択肢4","選択肢5","選択肢6"] }\n  ]\n}\n\n・type は "number"（数値入力）か "choice"（6択）\n・number は answer だけでOK（ダミー自動生成）\n・choice は choices に正解を必ず含める';
  alert(sample);
}
function importJson(){
  const raw = document.getElementById('cr-json').value.trim();
  if(!raw){ showToast('JSONを貼り付けてください','error'); return; }
  let obj;
  try{ obj = JSON.parse(raw); }catch(e){ showToast('JSONの形式が正しくありません','error'); return; }
  const qs = Array.isArray(obj) ? obj : obj.questions;
  if(!Array.isArray(qs) || !qs.length){ showToast('questions が見つかりません','error'); return; }
  if(obj.title && !document.getElementById('cr-title').value) document.getElementById('cr-title').value = obj.title;
  if(obj.subject) document.getElementById('cr-subject').value = obj.subject;
  let added=0, skipped=0;
  qs.forEach(q=>{
    if(!q || !q.text || q.answer==null){ skipped++; return; }
    if(q.type==='choice'){
      let ch = Array.isArray(q.choices) ? q.choices.slice() : [];
      // 正解を必ず含め、6つに整える
      if(ch.indexOf(q.answer)===-1) ch.unshift(q.answer);
      ch = ch.filter((v,idx)=>ch.indexOf(v)===idx); // 重複除去
      while(ch.length<6) ch.push('');
      ch = ch.slice(0,6);
      // 正解を先頭に
      ch = [q.answer].concat(ch.filter(c=>c!==q.answer)).slice(0,6);
      crQuestions.push({type:'choice', text:String(q.text), answer:String(q.answer), choices:ch});
    }else{
      crQuestions.push({type:'number', text:String(q.text), answer:String(q.answer), choices:null});
    }
    added++;
  });
  document.getElementById('cr-json').value='';
  renderCrQuestions();
  showToast(added+'問を取り込みました'+(skipped?'（'+skipped+'問スキップ）':''), 'success');
}

// テスト保存（mini_quiz_sets + mini_quiz_questions）
async function saveQuizSet(){
  const title = document.getElementById('cr-title').value.trim();
  const subject = document.getElementById('cr-subject').value;
  if(!title){ showToast('テスト名を入力してください','error'); return; }
  // 入力チェック
  const valid = crQuestions.filter(q=>q.text && q.answer);
  if(!valid.length){ showToast('問題を1問以上入力してください','error'); return; }
  for(const q of valid){
    if(q.type==='choice'){
      const filled = q.choices.filter(c=>c && c.trim());
      if(filled.length<2){ showToast('6択問題は選択肢を2つ以上入力してください','error'); return; }
      if(q.choices.indexOf(q.answer)===-1 && filled.indexOf(q.answer)===-1){
        // 1つ目を正解扱いにしているので answer 同期
        q.answer = q.choices[0];
      }
    }
  }
  showLoading('保存中...');
  try{
    const set = await sbPost('mini_quiz_sets', { title:title, subject:subject, created_by:staffId });
    const setId = Array.isArray(set)?set[0].id:set.id;
    const rows = valid.map((q,idx)=>({
      quiz_set_id:setId, q_order:idx, q_type:q.type, text:q.text, answer:q.answer,
      choices: q.type==='choice' ? q.choices.filter(c=>c && c.trim()) : null
    }));
    await sbPost('mini_quiz_questions', rows, 'return=minimal');
    hideLoading();
    crQuestions=[]; renderCrQuestions();
    document.getElementById('cr-title').value='';
    showToast('テストを保存しました', 'success');
    staffTab('list');
  }catch(e){ hideLoading(); showToast('保存エラー: '+e.message, 'error'); }
}

let solveState=null; // {assignId, setId, questions:[{...,shuffled:[]}], given:[]}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// 数値問題のダミー選択肢を自動生成（正解の周辺値）
function genNumberChoices(answer){
  const n = parseFloat(answer);
  const set = new Set([answer]);
  if(!isNaN(n) && isFinite(n)){
    const cands = [n+1, n-1, n+2, n-2, -n, n*2, Math.round(n/2), n+10, n-10];
    for(const c of cands){
      if(set.size>=6) break;
      // 整数なら整数表記、小数なら桁を合わせる
      let v = Number.isInteger(n) ? String(Math.round(c)) : String(c);
      if(v!==answer) set.add(v);
    }
  }
  // 数値変換できない/足りない場合の保険
  let i=1;
  while(set.size<6){ set.add(answer+'?'+i); i++; }
  return shuffle([...set].slice(0,6));
}

async function startSolve(assignId, setId){
  showLoading('読み込み中...');
  try{
    // 二重提出ガード（最新確認）
    const exist = await sbGet('mini_quiz_results','quiz_assignment_id=eq.'+assignId+'&student_id=eq.'+currentStudent.id+'&select=id');
    if(exist && exist.length){ hideLoading(); showToast('この小テストは提出済みです','info'); loadStudentQuizzes(); return; }
    const qs = await sbGet('mini_quiz_questions','quiz_set_id=eq.'+setId+'&order=q_order&select=*');
    if(!qs.length){ hideLoading(); showToast('問題がありません','error'); return; }
    const set = await sbGet('mini_quiz_sets','id=eq.'+setId+'&select=title');
    solveState={ assignId, setId, questions: qs.map(q=>{
      let display=null;
      if(q.q_type==='choice'){ display = shuffle((q.choices||[]).filter(c=>c&&String(c).trim())); }
      else { display = genNumberChoices(q.answer); }
      return { id:q.id, type:q.q_type, text:q.text, answer:q.answer, display:display };
    }), given:{} };
    hideLoading();
    document.getElementById('solve-title').textContent = (set[0]&&set[0].title)||'小テスト';
    renderSolve();
    document.getElementById('solve-result').style.display='none';
    document.getElementById('solve-submit').style.display='block';
    showScreen('screen-solve');
  }catch(e){ hideLoading(); showToast('エラー: '+e.message,'error'); }
}

function renderSolve(){
  const st=solveState;
  document.getElementById('solve-progress').textContent='全'+st.questions.length+'問　自分で解いてから答えを選んでね';
  document.getElementById('solve-questions').innerHTML = st.questions.map((q,i)=>{
    const opts = q.display.map(c=>{
      const selp = (st.given[q.id]===String(c))?' sel':'';
      return '<div class="choice-opt'+selp+'" onclick="pickAnswer(this)" data-qid="'+esc(q.id)+'" data-val="'+esc(String(c))+'">'+esc(c)+'</div>';
    }).join('');
    const typeLabel = q.type==='number' ? '<span class="pill pill-num">数値</span>' : '<span class="pill pill-choice">6択</span>';
    return '<div class="card" data-qid="'+q.id+'">'+
      '<div style="font-size:11px;color:var(--green-d);margin-bottom:3px">問'+(i+1)+' '+typeLabel+'</div>'+
      '<div style="font-size:15px;font-weight:500;margin-bottom:10px">'+esc(q.text)+'</div>'+
      opts+
    '</div>';
  }).join('');
}

function pickAnswer(elDom){
  const qid = elDom.getAttribute('data-qid');
  const val = elDom.getAttribute('data-val');
  solveState.given[qid]=val;
  // 同じ問題カード内の選択状態を更新
  const card = elDom.closest('.card[data-qid]');
  card.querySelectorAll('.choice-opt').forEach(o=>o.classList.remove('sel'));
  elDom.classList.add('sel');
}

async function submitSolve(){
  const st=solveState;
  const unanswered = st.questions.filter(q=>st.given[q.id]==null);
  if(unanswered.length){ if(!confirm(unanswered.length+'問 未回答です。提出しますか？')) return; }
  showLoading('採点中...');
  try{
    let correct=0;
    const answers = st.questions.map(q=>{
      const given = st.given[q.id]!=null ? String(st.given[q.id]) : null;
      const ok = given!=null && String(given).trim()===String(q.answer).trim();
      if(ok) correct++;
      return { question_id:q.id, given:given, correct:ok };
    });
    // 1人1回：UNIQUE制約で二重提出を弾く
    await sbPost('mini_quiz_results',{
      quiz_assignment_id:st.assignId, student_id:currentStudent.id,
      answers:answers, correct_count:correct, total_count:st.questions.length
    },'return=minimal');
    hideLoading();
    showSolveResult(correct, st.questions.length, answers);
  }catch(e){
    hideLoading();
    if(String(e.message).indexOf('409')!==-1 || String(e.message).indexOf('duplicate')!==-1){
      showToast('この小テストは提出済みです','info'); backToStudent();
    }else{
      showToast('提出エラー: '+e.message,'error');
    }
  }
}

async function showSolveResult(correct, total, answers){
  document.getElementById('solve-submit').style.display='none';
  // 各問題の正誤を画面に反映
  const st=solveState;
  const ansMap={}; answers.forEach(a=>ansMap[a.question_id]=a);
  st.questions.forEach(q=>{
    const card=document.querySelector('.card[data-qid="'+q.id+'"]');
    if(!card) return;
    const a=ansMap[q.id];
    card.querySelectorAll('.choice-opt').forEach(o=>{
      const v=o.getAttribute('data-val');
      o.style.pointerEvents='none';
      if(v===String(q.answer)) o.classList.add('correct');
      else if(a && a.given===v && !a.correct) o.classList.add('wrong');
    });
  });
  // クラス平均（任意：取得できなければ省略）
  let avgHtml='';
  try{
    const results = await sbGet('mini_quiz_results','quiz_assignment_id=eq.'+st.assignId+'&select=correct_count,total_count');
    if(results.length){
      const avg = results.reduce((s,r)=>s+(r.total_count?r.correct_count/r.total_count:0),0)/results.length;
      avgHtml='<div class="muted" style="margin-top:4px">クラス平均 '+Math.round(avg*100)+'%（'+results.length+'人提出）</div>';
    }
  }catch(e){}
  const rate = total?Math.round(correct/total*100):0;
  const box=document.getElementById('solve-result');
  box.style.display='block';
  box.innerHTML='<div style="background:var(--green-ok-l);border-radius:12px;padding:16px;text-align:center">'+
    '<div style="font-size:13px;color:var(--green-ok);font-weight:700">提出完了</div>'+
    '<div style="font-size:28px;font-weight:900;color:var(--green-ok)">'+correct+' / '+total+' 正解</div>'+
    '<div class="muted">正答率 '+rate+'%</div>'+avgHtml+
    '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="backToStudent()">一覧に戻る</button>'+
  '</div>';
  box.scrollIntoView({behavior:'smooth'});
}

// 提出済みの結果を見る
async function viewMyResult(assignId){
  showLoading('読み込み中...');
  try{
    const res = await sbGet('mini_quiz_results','quiz_assignment_id=eq.'+assignId+'&student_id=eq.'+currentStudent.id+'&select=*');
    if(!res.length){ hideLoading(); showToast('結果が見つかりません','error'); return; }
    const r=res[0];
    hideLoading();
    const rate=r.total_count?Math.round(r.correct_count/r.total_count*100):0;
    document.getElementById('solve-title').textContent='結果';
    document.getElementById('solve-progress').textContent='';
    document.getElementById('solve-questions').innerHTML='';
    document.getElementById('solve-submit').style.display='none';
    const box=document.getElementById('solve-result');
    box.style.display='block';
    box.innerHTML='<div style="background:var(--green-ok-l);border-radius:12px;padding:16px;text-align:center">'+
      '<div style="font-size:13px;color:var(--green-ok);font-weight:700">提出済み</div>'+
      '<div style="font-size:28px;font-weight:900;color:var(--green-ok)">'+r.correct_count+' / '+r.total_count+' 正解</div>'+
      '<div class="muted">正答率 '+rate+'%</div>'+
      '<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="backToStudent()">一覧に戻る</button>'+
    '</div>';
    showScreen('screen-solve');
  }catch(e){ hideLoading(); showToast('エラー: '+e.message,'error'); }
}

function backToStudent(){ solveState=null; showScreen('screen-student'); loadStudentQuizzes(); }

// ============================================================
// スタッフ：集計（正答率）
// ============================================================
async function loadAssignSelectForStats(){
  const sel=document.getElementById('st-assign-select');
  try{
    const assigns = await sbGet('mini_quiz_assignments','order=session_date.desc&select=*&limit=80');
    if(!assigns.length){ sel.innerHTML='<option value="">配信がありません</option>'; document.getElementById('stats-body').innerHTML=''; return; }
    const setIds=[...new Set(assigns.map(a=>a.quiz_set_id))];
    const clsIds=[...new Set(assigns.map(a=>a.class_master_id))];
    const [sets,cms]=await Promise.all([
      sbGet('mini_quiz_sets','id=in.('+setIds.join(',')+')&select=id,title'),
      sbGet('class_master','id=in.('+clsIds.join(',')+')&select=id,name')
    ]);
    const setMap={}; sets.forEach(s=>setMap[s.id]=s.title);
    const clsMap={}; cms.forEach(c=>clsMap[c.id]=c.name);
    sel.innerHTML='<option value="">配信を選択</option>'+assigns.map(a=>{
      const label=(setMap[a.quiz_set_id]||'テスト')+' / '+(clsMap[a.class_master_id]||'授業')+' '+fmtDateLabel(a.session_date,a.period);
      return '<option value="'+a.id+'|'+a.quiz_set_id+'">'+esc(label)+'</option>';
    }).join('');
  }catch(e){ sel.innerHTML='<option value="">エラー</option>'; }
}

async function loadStats(){
  const v=document.getElementById('st-assign-select').value;
  const body=document.getElementById('stats-body');
  if(!v){ body.innerHTML=''; return; }
  const [assignId, setId]=v.split('|');
  body.innerHTML='<div class="muted" style="text-align:center;padding:16px">集計中...</div>';
  try{
    const [qs, results] = await Promise.all([
      sbGet('mini_quiz_questions','quiz_set_id=eq.'+setId+'&order=q_order&select=*'),
      sbGet('mini_quiz_results','quiz_assignment_id=eq.'+assignId+'&select=*')
    ]);
    if(!results.length){ body.innerHTML='<div class="muted" style="text-align:center;padding:16px">まだ提出がありません</div>'; return; }
    // 全体平均
    const avg = results.reduce((s,r)=>s+(r.total_count?r.correct_count/r.total_count:0),0)/results.length;
    // 問題別正答率
    const perQ={}; qs.forEach(q=>perQ[q.id]={ok:0,total:0,text:q.text});
    results.forEach(r=>{
      (r.answers||[]).forEach(a=>{
        if(perQ[a.question_id]){ perQ[a.question_id].total++; if(a.correct) perQ[a.question_id].ok++; }
      });
    });
    let html='<div style="display:flex;gap:8px;margin-bottom:12px">'+
      '<div class="card" style="flex:1;text-align:center;margin:0"><div class="muted">提出</div><div style="font-size:22px;font-weight:900">'+results.length+'</div></div>'+
      '<div class="card" style="flex:1;text-align:center;margin:0"><div class="muted">平均点</div><div style="font-size:22px;font-weight:900;color:var(--green-ok)">'+Math.round(avg*100)+'%</div></div>'+
    '</div>';
    html+='<div class="sec-title">問題別 正答率</div>';
    qs.forEach((q,i)=>{
      const p=perQ[q.id]; const rate=p.total?Math.round(p.ok/p.total*100):0;
      const color = rate>=70?'var(--green-ok)':rate>=50?'var(--orange)':'var(--red)';
      html+='<div style="margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">'+
          '<span>問'+(i+1)+'　'+esc(q.text.slice(0,18))+(q.text.length>18?'…':'')+'</span>'+
          '<span style="font-weight:700;color:'+color+'">'+rate+'%</span>'+
        '</div>'+
        '<div class="bar-bg"><div class="bar-fill" style="width:'+rate+'%;background:'+color+'"></div></div>'+
      '</div>';
    });
    // 生徒別（折りたたみ）
    const sids=results.map(r=>r.student_id);
    let nameMap={};
    if(sids.length){ try{ const stus=await sbGet('students','id=in.('+sids.join(',')+')&select=id,name'); stus.forEach(s=>nameMap[s.id]=s.name); }catch(e){} }
    html+='<div class="card" style="margin-top:8px"><div style="font-size:12px;font-weight:700;cursor:pointer" onclick="document.getElementById(\'stat-students\').style.display=document.getElementById(\'stat-students\').style.display===\'none\'?\'block\':\'none\'">👥 生徒別の正誤を見る ▼</div>'+
      '<div id="stat-students" style="display:none;margin-top:8px">'+
      results.sort((a,b)=>(b.correct_count/b.total_count)-(a.correct_count/a.total_count)).map(r=>
        '<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid var(--border)">'+
          '<span>'+esc(nameMap[r.student_id]||'(生徒)')+'</span>'+
          '<span style="font-weight:700">'+r.correct_count+'/'+r.total_count+'</span>'+
        '</div>'
      ).join('')+
      '</div></div>';
    body.innerHTML=html;
  }catch(e){ body.innerHTML='<div class="muted" style="text-align:center;padding:16px;color:var(--red)">エラー: '+esc(e.message)+'</div>'; }
}

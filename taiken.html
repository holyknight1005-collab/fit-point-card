<script>
// ===== fit 共通ログイン（Supabase Auth セッション）sec1 =====
// ・ID＋PINの照合はサーバー（Edge Function fit-login）で行い、ブラウザには PIN を残さない。
// ・発行されたセッションは localStorage 'fit_session_v1' に保存し、同じサイトの全アプリで共有する。
// ・Supabase への fetch は自動でログイン中のトークンに差し替え、期限切れなら自動更新して1回だけ再送する。
const FIT_SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const FIT_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const FIT_SESSION_KEY = 'fit_session_v1';
const FIT_LEGACY_KEYS = ['fit_pin', 'fit_parent_pin', 'fit_staff_hash', 'fit_staff_pin'];
let fitSession = null;
let fitRefreshing = null;
const fitRawFetch = window.fetch.bind(window);

function fitLoadSession() {
  try { fitSession = JSON.parse(localStorage.getItem(FIT_SESSION_KEY) || 'null'); } catch (e) { fitSession = fitSession || null; }
  return fitSession;
}
function fitSaveSession(s) {
  fitSession = s || null;
  try { if (s) localStorage.setItem(FIT_SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(FIT_SESSION_KEY); } catch (e) {}
}
function fitClearLegacy() {
  try { FIT_LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
// 'ok' | 'invalid'（ログインし直しが必要） | 'error'（通信エラー等。セッションは残す）| 'none'
async function fitRefresh(force) {
  const cur = fitLoadSession();
  if (!cur || !cur.refresh_token) return 'none';
  const now = Math.floor(Date.now() / 1000);
  if (!force && (cur.expires_at || 0) - now > 300) return 'ok';
  if (fitRefreshing) return fitRefreshing;
  fitRefreshing = (async () => {
    try {
      const r = await fitRawFetch(FIT_SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: cur.refresh_token })
      });
      if (r.status === 400 || r.status === 401 || r.status === 403) {
        // 別タブが先に更新していればそちらを使う
        const latest = fitLoadSession();
        if (latest && latest.refresh_token !== cur.refresh_token) return 'ok';
        fitSaveSession(null);
        return 'invalid';
      }
      if (!r.ok) return 'error';
      const j = await r.json();
      fitSaveSession(Object.assign({}, cur, {
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        expires_at: j.expires_at || (now + (j.expires_in || 3600))
      }));
      return 'ok';
    } catch (e) { return 'error'; }
    finally { fitRefreshing = null; }
  })();
  return fitRefreshing;
}
// ログイン：kind = 'staff' | 'student' | 'parent' | 'online'
// 戻り値 { ok:true, kind, account } / { ok:false, error:'invalid'|'blocked'|'locked'|... }
async function fitLogin(kind, id, pin) {
  let r, j = null;
  try {
    r = await fitRawFetch(FIT_SB_URL + '/functions/v1/fit-login', {
      method: 'POST',
      headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, id: id, pin: pin })
    });
    j = await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
  if (!j) return { ok: false, error: 'network' };
  if (j.ok) {
    fitSaveSession(Object.assign({}, j.session, { kind: j.kind, account_id: String(j.account.id) }));
    fitClearLegacy();
  }
  return j;
}
function fitLoginErrorText(j, fallback) {
  if (!j) return fallback;
  if (j.error === 'locked') return 'ログインの失敗が続いたため、15分ほど待ってからお試しください。';
  if (j.error === 'blocked') return 'このアカウントは現在ご利用いただけません。塾までお問い合わせください。';
  if (j.error === 'network' || j.error === 'server') return '通信がうまくつながりませんでした。電波の良い場所でもう一度お試しください。';
  return fallback;
}
// ===== 段階B：サーバー関数（RPC）=====
// ポイント加算・ログインボーナス・面談共有メモなどは、サーバー側の関数で行う（生徒は直接書き換えできない）。
async function fitRpc(name, args) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/rpc/' + name, {
    method: 'POST',
    headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  const tx = await r.text();
  if (!r.ok) throw new Error('rpc ' + name + ' ' + r.status + ' ' + tx);
  return tx ? JSON.parse(tx) : null;
}
// 戻り値 { awarded: 実際に加算された点, points: 加算後の合計 }
async function fitAwardPoints(type, points, reason, ref) {
  return await fitRpc('fit_award_points', { p_type: type, p_points: points, p_reason: reason || null, p_ref: ref == null ? null : String(ref) });
}
function fitLogout() {
  const s = fitSession || fitLoadSession();
  fitSaveSession(null);
  fitClearLegacy();
  if (s && s.access_token) {
    fitRawFetch(FIT_SB_URL + '/auth/v1/logout?scope=local', {
      method: 'POST', headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
    }).catch(() => {});
  }
}
// 保存済みセッションから本人の行を取り直す。旧方式（PIN保存）の端末は1回だけ自動で移行する。
// 戻り値 { kind, row } / null（未ログイン）。通信エラー時は例外（ログイン情報は消さない）。
async function fitResume() {
  let s = fitLoadSession();
  if (!s) {
    let email = null, pin = null, pid = null, ppin = null, role = null;
    try {
      email = localStorage.getItem('fit_email'); pin = localStorage.getItem('fit_pin');
      pid = localStorage.getItem('fit_parent_id'); ppin = localStorage.getItem('fit_parent_pin');
      role = localStorage.getItem('fit_role');
    } catch (e) {}
    let j = null;
    if (email && pin) j = await fitLogin(role === 'staff' ? 'staff' : 'student', email, pin);
    else if (pid && ppin) j = await fitLogin('parent', pid, ppin);
    if (j && j.error === 'network') throw new Error('network');
    fitClearLegacy();
    s = fitLoadSession();
    if (!s) return null;
  }
  const rr = await fitRefresh(false);
  if (rr === 'invalid' || rr === 'none') return null;
  s = fitLoadSession();
  if (!s) return null;
  const table = { staff: 'staff', student: 'students', parent: 'parent_accounts', online: 'online_students' }[s.kind];
  if (!table) { fitLogout(); return null; }
  // sec4: 生徒・保護者は students を直接読まず、表示用の列だけ返す関数から受け取る（生徒は自分の1行）
  const res = s.kind === 'student'
    ? await fitRawFetch(FIT_SB_URL + '/rest/v1/rpc/fit_my_students', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
        body: '{}'
      })
    : await fitRawFetch(FIT_SB_URL + '/rest/v1/' + table + '?id=eq.' + encodeURIComponent(s.account_id) + '&select=*', {
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
      });
  if (res.status === 401 || res.status === 403) {
    const again = await fitRefresh(true);
    if (again === 'invalid' || again === 'none') return null;
    throw new Error('auth ' + res.status);
  }
  if (!res.ok) throw new Error('resume ' + res.status);
  const rows = await res.json();
  if (!rows.length || rows[0].is_active === false && s.kind !== 'student') { fitLogout(); return null; }
  return { kind: s.kind, row: rows[0] };
}
// Supabase への fetch をログイン中のトークンに差し替える（各画面のコードはそのまま使える）
window.fetch = async function (input, init) {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (url.indexOf(FIT_SB_URL) !== 0 || url.indexOf('/auth/v1/') > 0 || url.indexOf('/functions/v1/fit-login') > 0) {
    return fitRawFetch(input, init);
  }
  // 呼び出し時点のトークンを控えておく（直後にログアウトしても、その前に始めた保存は通す）
  const tokenAtCall = fitLoadSession() ? fitSession.access_token : null;
  if (tokenAtCall) await fitRefresh(false);
  const send = () => {
    const opt = Object.assign({}, init || {});
    const h = new Headers(opt.headers || (input && typeof input !== 'string' ? input.headers : undefined));
    const tok = (fitSession && fitSession.access_token) || tokenAtCall;
    if (tok) h.set('Authorization', 'Bearer ' + tok);
    opt.headers = h;
    return fitRawFetch(input, opt);
  };
  let res = await send();
  if (res.status === 401 && fitSession && fitSession.refresh_token) {
    const rr = await fitRefresh(true);
    if (rr === 'ok') res = await send();
  }
  return res;
};
setInterval(() => { if (fitSession) fitRefresh(false); }, 60000);

// ============================================================
// 合格体験記（taiken.html）2026-11-12
// ・生徒・保護者・オンライン生：公開分だけを関数 taiken_list() で読む（年度・区分・フルネームは受け取らない）
// ・スタッフ：表 taiken_stories を直接読む・直す・公開／載せない・消す（検閲）
// ============================================================
const TK_VERSION = '20261112tk1';
const TK_HDR = { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' };
const TK_LIST_COLS = 'id,src_no,year,kubun,full_name,name_kana,kana_mark,initials,school,univ,faculty,dept,memo,status,reviewed_by,reviewed_at';
const ST_LABEL = { draft: '未確認', published: '公開中', hidden: '載せない' };
let ME = null;             // { kind, row }
let isStaff = false;
let PUB = null;            // 公開分（読む画面）
let ROWS = null;           // スタッフ：全件（文は入れない）
let CUR = null;            // スタッフ：開いている1件（文つき）
let dirty = false;
let curHash = '';
let skipHash = false;
const rf = { univ: '', school: '', q: '' };                       // 読む画面のしぼりこみ
const sf = { year: '', status: '', mark: false, q: '' };          // スタッフのしぼりこみ

const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v == null ? '' : v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c);
  return e;
}
function put(parent, ...kids) { for (const c of kids.flat(Infinity)) if (c != null && c !== false) parent.append(c); }
function fmt(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ''); }
function ansList(a) { return Array.isArray(a) ? a.filter(x => x && typeof x === 'object') : []; }
function fac(r) { return [r.faculty, r.dept].filter(Boolean).join(' '); }

async function rpc(name, args) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/rpc/' + name, { method: 'POST', headers: TK_HDR, body: JSON.stringify(args || {}) });
  const tx = await r.text();
  if (!r.ok) { let m = tx; try { m = JSON.parse(tx).message || tx; } catch (e) {} throw new Error(m); }
  return tx ? JSON.parse(tx) : null;
}
async function rest(method, path, body, extra) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/' + path, { method, headers: Object.assign({}, TK_HDR, extra || {}), body: body == null ? undefined : JSON.stringify(body) });
  const tx = await r.text();
  if (!r.ok) throw new Error(method + ' ' + r.status + ' ' + tx.slice(0, 160));
  return tx ? JSON.parse(tx) : null;
}
function errText(e) {
  const m = String((e && e.message) || e || '');
  if (/Failed to fetch|NetworkError|network/i.test(m)) return '通信がうまくつながりませんでした。もう一度お試しください。';
  return 'うまくいきませんでした。（' + m.slice(0, 100) + '）';
}

// 確かめの小窓（OK なら true）
function ask(title, text, okLabel, danger) {
  return new Promise(res => {
    const close = v => { bg.remove(); res(v); };
    const bg = el('div', { class: 'modal-bg' },
      el('div', { class: 'modal' },
        el('h3', {}, title),
        el('div', { style: 'font-size:14px;white-space:pre-wrap' }, text),
        el('div', { class: 'mb' },
          el('button', { class: 'btn sub', onclick: () => close(false) }, 'やめる'),
          el('button', { class: danger ? 'btn danger' : 'btn', onclick: () => close(true) }, okLabel))));
    document.body.append(bg);
  });
}

// ---------- 起動・画面の切りかえ ----------
function hero(sub) {
  const h = $('#hero'); h.textContent = '';
  const online = ME && ME.kind === 'online';
  const who = isStaff ? ('スタッフ：' + (ME.row.name || '')) : '';
  h.append(el('div', { class: 'hero' }, el('div', { class: 'hero-in' },
    el('a', { class: 'back', href: online ? 'online.html' : 'app.html' }, online ? '‹ オンライン講座に戻る' : '‹ アプリに戻る'),
    who ? el('span', { class: 'who' }, who) : null,
    el('h1', {}, '合格体験記'),
    el('p', {}, sub || 'f i t の先輩たちが、後輩のみなさんに残してくれた言葉です。'))));
}
function go(h) { if (location.hash === h || (!h && !location.hash)) route(); else location.hash = h; }
async function onHash() {
  if (skipHash) { skipHash = false; return; }
  if (dirty) {
    const ok = await ask('保存していない変更があります', 'このまま移ると、直したところは消えます。', '保存せずに移る');
    if (!ok) { skipHash = true; location.hash = curHash; return; }
    dirty = false;
  }
  route();
}
function route() {
  curHash = location.hash;
  const h = location.hash.replace(/^#/, '');
  window.scrollTo(0, 0);
  if (isStaff && h === 'k') return staffHome();
  if (isStaff && h.startsWith('k/')) return staffOpen(h.slice(2));
  if (h.startsWith('y/')) return readOpen(h.slice(2));
  if (isStaff && h !== 'y') return staffHome();
  readHome();
}
async function boot() {
  let netErr = false;
  try { ME = await fitResume(); } catch (e) { netErr = true; }
  if (!ME) return noAccess(netErr);
  isStaff = ME.kind === 'staff';
  window.addEventListener('hashchange', onHash);
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  route();
}
function noAccess(netErr) {
  hero();
  const app = $('#app'); app.textContent = '';
  put(app, el('div', { class: 'card' },
    el('p', { style: 'margin:0 0 8px;font-weight:700' }, netErr ? '通信がうまくつながりませんでした。' : 'fitアプリのログインが必要です。'),
    el('p', { class: 'msg' }, netErr ? '少し待ってから、このページを開き直してください。' : '合格体験記は、fitアプリにログインした人が読めます。fitアプリにログインしてから、もう一度開いてください。'),
    el('p', { style: 'margin:12px 0 0' }, el('a', { href: 'app.html', class: 'btn' }, 'fitアプリを開く'))));
}
function staffTabs(on) {
  if (!isStaff) return null;
  return el('div', { class: 'tabs' },
    el('button', { class: 'tab' + (on === 'k' ? ' on' : ''), onclick: () => go('#k') }, '検閲（スタッフ）'),
    el('button', { class: 'tab' + (on === 'y' ? ' on' : ''), onclick: () => go('#y') }, '生徒に見える画面'));
}

// ============================================================
// 読む画面（生徒・保護者・オンライン生・スタッフの確かめ）
// ============================================================
async function loadPub(force) {
  if (PUB && !force) return PUB;
  const rows = await rpc('taiken_list', {});
  PUB = (rows || []).map(r => ({ id: String(r.id), initials: r.initials || '', school: r.school || '', univ: r.univ || '', faculty: r.faculty || '', dept: r.dept || '', answers: ansList(r.answers) }));
  PUB.forEach(r => { r._t = norm([r.univ, r.faculty, r.dept, r.school, ...r.answers.map(a => a.a)].join(' ')); });
  PUB.sort((a, b) => a.univ.localeCompare(b.univ, 'ja') || fac(a).localeCompare(fac(b), 'ja'));
  return PUB;
}
function pubFiltered() {
  const q = norm(rf.q);
  return PUB.filter(r => (!rf.univ || r.univ === rf.univ) && (!rf.school || r.school === rf.school) && (!q || r._t.includes(q)));
}
function optCounts(key) {
  const m = new Map();
  PUB.forEach(r => { if (r[key]) m.set(r[key], (m.get(r[key]) || 0) + 1); });
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ja'));
}
async function readHome() {
  hero();
  const app = $('#app'); app.textContent = '';
  const msg = el('div', { class: 'msg' }, '読み込み中…');
  put(app, staffTabs('y'), msg);
  try { await loadPub(isStaff); } catch (e) { msg.className = 'msg err'; msg.textContent = errText(e); return; }
  msg.remove();
  if (!PUB.length) {
    put(app, el('div', { class: 'card' }, el('p', { style: 'margin:0;font-weight:700' }, 'ただいま準備中です。'), el('p', { class: 'msg' }, '先輩たちの体験記を、順番に載せていきます。')));
    return;
  }
  hero('全部で ' + PUB.length + ' 人の先輩の体験記があります。');
  const sel = (key, label) => {
    const s = el('select', { class: 'in', onchange: () => { rf[key] = s.value; draw(); } },
      el('option', { value: '' }, label + '（すべて）'),
      optCounts(key).map(([v, n]) => el('option', { value: v }, v + '（' + n + '）')));
    s.value = rf[key]; return s;
  };
  const kw = el('input', { class: 'in wide', type: 'search', placeholder: 'ことばでさがす（学部・部活・英語 など）', value: rf.q, oninput: () => { rf.q = kw.value; draw(); } });
  const cnt = el('div', { class: 'count' });
  const list = el('div', {});
  put(app, el('div', { class: 'filters' }, sel('univ', '大学'), sel('school', '出身校'), kw), cnt, list);
  function draw() {
    const rows = pubFiltered();
    list.textContent = '';
    cnt.textContent = (rf.univ || rf.school || rf.q) ? (rows.length + ' 人') : '';
    if (!rows.length) { list.append(el('div', { class: 'msg' }, '当てはまる体験記がありません。しぼりこみを変えてみてください。')); return; }
    const groups = new Map();
    rows.forEach(r => { const k = r.univ || '（大学名なし）'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
    for (const [u, rs] of groups) {
      list.append(el('div', { class: 'ug' },
        el('h2', {}, u, el('small', {}, rs.length + '人')),
        el('div', { class: 'sl' }, rs.map(r => el('button', { class: 'st-card', onclick: () => go('#y/' + r.id) },
          el('span', { class: 'f' }, fac(r) || u),
          el('span', { class: 'w' }, [r.initials ? r.initials + ' さん' : '', r.school].filter(Boolean).join('・')),
          el('span', { class: 'pv' }, (r.answers.find(a => a.a) || {}).a || ''))))));
    }
  }
  draw();
}
function storyView(r) {
  return [
    el('div', { class: 'story-head' },
      el('div', { class: 'u' }, [r.univ, r.faculty, r.dept].filter(Boolean).join(' ')),
      el('div', { class: 'w' }, [r.initials ? r.initials + ' さん' : '', r.school ? r.school + ' 出身' : ''].filter(Boolean).join('・'))),
    ansList(r.answers).filter(a => String(a.a || '').trim()).map(a => el('div', { class: 'qa' }, el('div', { class: 'q' }, a.q || ''), el('div', { class: 'a' }, a.a)))
  ].flat();
}
async function readOpen(id) {
  hero();
  const app = $('#app'); app.textContent = '';
  const msg = el('div', { class: 'msg' }, '読み込み中…'); put(app, msg);
  try { await loadPub(false); } catch (e) { msg.className = 'msg err'; msg.textContent = errText(e); return; }
  msg.remove();
  const rows = pubFiltered();
  const r = PUB.find(x => x.id === id);
  const back = el('button', { class: 'btn sub small', onclick: () => go('#y') }, '‹ 一覧にもどる');
  if (!r) { put(app, back, el('div', { class: 'msg' }, 'この体験記は見つかりませんでした。')); return; }
  const i = rows.findIndex(x => x.id === id);
  const prev = i > 0 ? rows[i - 1] : null, next = i >= 0 && i < rows.length - 1 ? rows[i + 1] : null;
  put(app, el('div', { style: 'margin-bottom:10px' }, back), ...storyView(r),
    el('div', { class: 'nav' },
      prev ? el('button', { class: 'btn sub', onclick: () => go('#y/' + prev.id) }, '‹ 前の人') : el('span', {}),
      next ? el('button', { class: 'btn sub', onclick: () => go('#y/' + next.id) }, '次の人 ›') : el('span', {})));
}

// ============================================================
// スタッフ：検閲
// ============================================================
function hasMark(r) { return !!(String(r.memo || '').trim() || r.kana_mark); }
function staffFiltered() {
  const q = norm(sf.q);
  return ROWS.filter(r => (!sf.year || String(r.year) === sf.year) && (!sf.status || r.status === sf.status) && (!sf.mark || hasMark(r))
    && (!q || norm([r.full_name, r.name_kana, r.initials, r.univ, r.faculty, r.dept, r.school].join(' ')).includes(q)));
}
async function loadRows(force) {
  if (ROWS && !force) return ROWS;
  ROWS = await rest('GET', 'taiken_stories?select=' + TK_LIST_COLS + '&order=year.desc,src_no.asc') || [];
  return ROWS;
}
async function staffHome() {
  hero('スタッフの画面です。読む・直す・公開する。生徒には「公開中」だけが見えます（年度と現役・浪人は見えません）。');
  const app = $('#app'); app.textContent = '';
  const msg = el('div', { class: 'msg' }, '読み込み中…');
  put(app, staffTabs('k'), msg);
  try { await loadRows(true); } catch (e) { msg.className = 'msg err'; msg.textContent = errText(e); return; }
  msg.remove();
  const chips = el('div', { class: 'chips' });
  const years = [...new Set(ROWS.map(r => r.year))].sort((a, b) => b - a);
  const ySel = el('select', { class: 'in', onchange: () => { sf.year = ySel.value; draw(); } }, el('option', { value: '' }, '年度（すべて）'), years.map(y => el('option', { value: String(y) }, y + '年')));
  ySel.value = sf.year;
  const sSel = el('select', { class: 'in', onchange: () => { sf.status = sSel.value; draw(); } }, el('option', { value: '' }, '状態（すべて）'), Object.entries(ST_LABEL).map(([k, v]) => el('option', { value: k }, v)));
  const mk = el('input', { type: 'checkbox', onchange: () => { sf.mark = mk.checked; draw(); } }); mk.checked = sf.mark;
  const kw = el('input', { class: 'in', type: 'search', placeholder: '名前・大学・出身校', value: sf.q, oninput: () => { sf.q = kw.value; draw(); } });
  const cnt = el('div', { class: 'count' });
  const list = el('div', { class: 'rows' });
  put(app, chips, el('div', { class: 'filters st' }, ySel, sSel, kw,
    el('label', { style: 'display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer' }, mk, '印あり（メモ・よみ）だけ')), cnt, list);
  function draw() {
    sSel.value = sf.status;
    chips.textContent = '';
    const base = ROWS.filter(r => !sf.year || String(r.year) === sf.year);
    [['', 'ぜんぶ'], ['draft', '未確認'], ['published', '公開中'], ['hidden', '載せない']].forEach(([k, lb]) => {
      const n = k ? base.filter(r => r.status === k).length : base.length;
      chips.append(el('button', { class: 'chip' + (sf.status === k ? ' on' : ''), onclick: () => { sf.status = k; draw(); } }, lb, el('b', {}, String(n))));
    });
    const rows = staffFiltered();
    cnt.textContent = rows.length + ' 件';
    list.textContent = '';
    rows.forEach(r => list.append(el('button', { class: 'row', onclick: () => go('#k/' + r.id) },
      el('span', { class: 'badge b-' + r.status }, ST_LABEL[r.status] || r.status),
      el('span', {}, String(r.year) + (r.kubun === '浪人' ? '浪' : '')),
      el('span', { class: 'nm' }, el('b', {}, r.initials || ''), r.full_name || ''),
      el('span', { class: 'un' }, [r.univ, r.faculty].filter(Boolean).join(' ')),
      el('span', { class: 'sc' }, r.school || ''),
      el('span', { class: 'mk' }, [r.kana_mark ? 'よみ' + r.kana_mark : '', String(r.memo || '').trim() ? 'メモ' : ''].filter(Boolean).join('・')))));
    if (!rows.length) list.append(el('div', { class: 'msg' }, '当てはまるものがありません。'));
  }
  draw();
}

async function staffOpen(id) {
  hero('スタッフの画面です。誤字脱字だけ直し、口調はそのままに。');
  const app = $('#app'); app.textContent = '';
  const msg = el('div', { class: 'msg' }, '読み込み中…');
  const back = el('button', { class: 'btn sub small', onclick: () => go('#k') }, '‹ 一覧にもどる');
  put(app, el('div', { style: 'margin-bottom:8px' }, back), msg);
  try {
    await loadRows(false);
    const got = await rest('GET', 'taiken_stories?id=eq.' + encodeURIComponent(id) + '&select=*');
    CUR = got && got[0];
  } catch (e) { msg.className = 'msg err'; msg.textContent = errText(e); return; }
  if (!CUR) { msg.textContent = 'この体験記は見つかりませんでした（消されたかもしれません）。'; return; }
  msg.textContent = ''; msg.className = 'msg'; msg.style.cssText = 'flex-basis:100%;margin:0';
  dirty = false;
  const r = CUR;
  const list = staffFiltered();
  const i = list.findIndex(x => String(x.id) === String(id));
  const prev = i > 0 ? list[i - 1] : null, next = i >= 0 && i < list.length - 1 ? list[i + 1] : null;
  const touch = () => { dirty = true; };
  const F = {};
  const inp = (key, label, opt) => {
    const e = opt ? el('select', { class: 'in', onchange: touch }, opt.map(o => el('option', { value: o[0] }, o[1]))) : el('input', { class: 'in', oninput: touch });
    e.value = r[key] == null ? '' : String(r[key]);
    F[key] = e;
    return el('label', {}, el('span', { class: 'lbl' }, label), e);
  };
  const stBadge = el('span', { class: 'badge b-' + r.status }, ST_LABEL[r.status] || r.status);
  const stInfo = el('span', { class: 'msg', style: 'margin-left:8px' }, r.reviewed_at ? ('確かめた人：' + (r.reviewed_by || '') + '（' + fmt(r.reviewed_at) + '）') : '');
  const memo = el('textarea', { class: 'in', oninput: touch, style: 'background:var(--orange-l)' }); memo.value = r.memo || '';
  const raws = ansList(r.answers_raw);
  const A = ansList(r.answers).map((a, k) => {
    const ta = el('textarea', { class: 'in', oninput: () => { touch(); fit(ta); } }); ta.value = a.a || '';
    const raw = raws.find(x => x.q === a.q) || raws[k];
    const rawText = raw ? String(raw.a || '') : '';
    return { q: a.q, ta, rawText };
  });
  const fit = ta => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 4) + 'px'; };

  function collect() {
    const o = {};
    ['full_name', 'name_kana', 'kana_mark', 'initials', 'school', 'univ', 'faculty', 'dept'].forEach(k => { const v = F[k].value.trim(); o[k] = v || null; });
    o.year = parseInt(F.year.value, 10) || r.year;
    o.kubun = F.kubun.value;
    o.memo = memo.value.trim() || null;
    o.answers = A.map(x => ({ q: x.q, a: x.ta.value }));
    return o;
  }
  let busy = false;
  async function save(status) {
    if (busy) return false;
    busy = true; msg.className = 'msg'; msg.textContent = '保存中…';
    const body = collect();
    if (status) {
      body.status = status;
      if (status === 'draft') { body.reviewed_by = null; body.reviewed_at = null; }
      else { body.reviewed_by = ME.row.name || 'スタッフ'; body.reviewed_at = new Date().toISOString(); }
    }
    try {
      const got = await rest('PATCH', 'taiken_stories?id=eq.' + encodeURIComponent(r.id), body, { Prefer: 'return=representation' });
      if (!got || !got.length) throw new Error('保存できる行がありませんでした');
      Object.assign(r, got[0]);
      const li = ROWS.find(x => String(x.id) === String(r.id)); if (li) Object.assign(li, got[0]);
      dirty = false; PUB = null;
      stBadge.className = 'badge b-' + r.status; stBadge.textContent = ST_LABEL[r.status] || r.status;
      stInfo.textContent = r.reviewed_at ? ('確かめた人：' + (r.reviewed_by || '') + '（' + fmt(r.reviewed_at) + '）') : '';
      msg.className = 'msg ok';
      msg.textContent = status === 'published' ? '公開しました（生徒・保護者に見えます）。' : status === 'hidden' ? '「載せない」にしました。' : status === 'draft' ? '未確認に戻しました。' : '保存しました。';
      busy = false; return true;
    } catch (e) { msg.className = 'msg err'; msg.textContent = errText(e); busy = false; return false; }
  }
  function preview() {
    const o = collect();
    const bg = el('div', { class: 'modal-bg', onclick: e => { if (e.target === bg) bg.remove(); } },
      el('div', { class: 'modal big' }, el('h3', {}, '生徒に見える形'), storyView(o),
        el('div', { class: 'mb' }, el('button', { class: 'btn sub', onclick: () => bg.remove() }, 'とじる'))));
    document.body.append(bg);
  }
  async function del() {
    const ok = await ask('この体験記を消しますか？', (r.full_name || '') + '（' + (r.univ || '') + '）\n消すと元に戻せません。生徒に見せないだけなら「載せない」を使ってください。', '消す', true);
    if (!ok) return;
    try {
      await rest('DELETE', 'taiken_stories?id=eq.' + encodeURIComponent(r.id), null, { Prefer: 'return=representation' }).then(g => { if (!g || !g.length) throw new Error('消せませんでした（消す決まりのSQLが未実行かもしれません）'); });
      ROWS = ROWS.filter(x => String(x.id) !== String(r.id)); PUB = null; dirty = false;
      go(next ? '#k/' + next.id : '#k');
    } catch (e) { msg.className = 'msg err'; msg.textContent = errText(e); }
  }

  put(app, 
    el('div', { style: 'display:flex;align-items:center;flex-wrap:wrap;gap:4px' }, stBadge, el('span', { class: 'msg', style: 'margin:0 0 0 8px' }, 'No.' + (r.src_no == null ? '—' : r.src_no) + (i >= 0 ? '　' + (i + 1) + ' / ' + list.length : '')), stInfo),
    el('span', { class: 'lbl' }, 'メモ（検閲で見てほしい所・迷うところ。スタッフだけ）'), memo,
    el('div', { class: 'grid2' },
      inp('full_name', '名前（スタッフだけ）'), inp('name_kana', 'よみ（スタッフだけ）'),
      inp('kana_mark', 'よみの印', [['', 'なし'], ['△', '△ 読みは不確か'], ['？', '？ イニシャルが変わるかも']]), inp('initials', 'イニシャル（名.姓）'),
      inp('univ', '大学'), inp('faculty', '学部'), inp('dept', '学科'), inp('school', '出身校'),
      inp('year', '年度（スタッフだけ）'), inp('kubun', '区分（スタッフだけ）', [['現役', '現役'], ['浪人', '浪人']])),
    A.map(x => el('div', { style: 'margin-top:6px' },
      el('span', { class: 'lbl', style: 'color:var(--orange-d);font-size:13px' }, x.q || ''), x.ta,
      x.rawText ? el('details', { class: 'raw' }, el('summary', { class: x.rawText !== x.ta.value ? 'diff' : '' }, x.rawText !== x.ta.value ? '入力のまま（直したところあり）' : '入力のまま（同じ）'), el('div', {}, x.rawText)) : null)),
    el('div', { class: 'acts' },
      el('button', { class: 'btn sub', onclick: () => save(null) }, '保存'),
      el('button', { class: 'btn green', onclick: () => save('published') }, '公開する'),
      el('button', { class: 'btn sub', onclick: () => save('hidden') }, '載せない'),
      el('button', { class: 'btn sub', onclick: () => save('draft') }, '未確認に戻す'),
      el('button', { class: 'btn sub', onclick: preview }, '生徒に見える形'),
      el('span', { class: 'sp' }),
      el('button', { class: 'btn sub', disabled: !prev, onclick: () => prev && go('#k/' + prev.id) }, '‹ 前'),
      el('button', { class: 'btn sub', disabled: !next, onclick: () => next && go('#k/' + next.id) }, '次 ›'),
      msg),
    el('div', { class: 'delbox' }, el('button', { class: 'btn danger small', onclick: del }, 'この体験記を消す')));
  A.forEach(x => fit(x.ta)); fit(memo);
}

boot();
</script>

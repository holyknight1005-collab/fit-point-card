<style>

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}

.in{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}

<script>
// ===== fit 共通ログイン（Supabase Auth セッション）sec1 =====
// ・ID＋PINの照合はサーバー（Edge Function fit-login）で行い、ブラウザには PIN を残さない。
// ・発行されたセッションは localStorage 'fit_session_v1' に保存し、同じサイトの全アプリで共有する。
// ・Supabase への fetch は自動でログイン中のトークンに差し替え、期限切れなら自動更新して1回だけ再送する。
const FIT_SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const FIT_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const FIT_SESSION_KEY = 'fit_session_v1';
const FIT_LEGACY_KEYS = ['fit_pin', 'fit_parent_pin', 'fit_staff_hash', 'fit_staff_pin'];
let fitSession = null;
let fitRefreshing = null;
const fitRawFetch = window.fetch.bind(window);

function fitLoadSession() {
  try { fitSession = JSON.parse(localStorage.getItem(FIT_SESSION_KEY) || 'null'); } catch (e) { fitSession = fitSession || null; }
  return fitSession;
}
function fitSaveSession(s) {
  fitSession = s || null;
  try { if (s) localStorage.setItem(FIT_SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(FIT_SESSION_KEY); } catch (e) {}
}
function fitClearLegacy() {
  try { FIT_LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
// 'ok' | 'invalid'（ログインし直しが必要） | 'error'（通信エラー等。セッションは残す）| 'none'
async function fitRefresh(force) {
  const cur = fitLoadSession();
  if (!cur || !cur.refresh_token) return 'none';
  const now = Math.floor(Date.now() / 1000);
  if (!force && (cur.expires_at || 0) - now > 300) return 'ok';
  if (fitRefreshing) return fitRefreshing;
  fitRefreshing = (async () => {
    try {
      const r = await fitRawFetch(FIT_SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: cur.refresh_token })
      });
      if (r.status === 400 || r.status === 401 || r.status === 403) {
        // 別タブが先に更新していればそちらを使う
        const latest = fitLoadSession();
        if (latest && latest.refresh_token !== cur.refresh_token) return 'ok';
        fitSaveSession(null);
        return 'invalid';
      }
      if (!r.ok) return 'error';
      const j = await r.json();
      fitSaveSession(Object.assign({}, cur, {
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        expires_at: j.expires_at || (now + (j.expires_in || 3600))
      }));
      return 'ok';
    } catch (e) { return 'error'; }
    finally { fitRefreshing = null; }
  })();
  return fitRefreshing;
}
// ログイン：kind = 'staff' | 'student' | 'parent' | 'online'
// 戻り値 { ok:true, kind, account } / { ok:false, error:'invalid'|'blocked'|'locked'|... }
async function fitLogin(kind, id, pin) {
  let r, j = null;
  try {
    r = await fitRawFetch(FIT_SB_URL + '/functions/v1/fit-login', {
      method: 'POST',
      headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, id: id, pin: pin })
    });
    j = await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
  if (!j) return { ok: false, error: 'network' };
  if (j.ok) {
    fitSaveSession(Object.assign({}, j.session, { kind: j.kind, account_id: String(j.account.id) }));
    fitClearLegacy();
  }
  return j;
}
function fitLoginErrorText(j, fallback) {
  if (!j) return fallback;
  if (j.error === 'locked') return 'ログインの失敗が続いたため、15分ほど待ってからお試しください。';
  if (j.error === 'blocked') return 'このアカウントは現在ご利用いただけません。塾までお問い合わせください。';
  if (j.error === 'network' || j.error === 'server') return '通信がうまくつながりませんでした。電波の良い場所でもう一度お試しください。';
  return fallback;
}
// ===== 段階B：サーバー関数（RPC）=====
// ポイント加算・ログインボーナス・面談共有メモなどは、サーバー側の関数で行う（生徒は直接書き換えできない）。
async function fitRpc(name, args) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/rpc/' + name, {
    method: 'POST',
    headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  const tx = await r.text();
  if (!r.ok) throw new Error('rpc ' + name + ' ' + r.status + ' ' + tx);
  return tx ? JSON.parse(tx) : null;
}
function fitLogout() {
  const s = fitSession || fitLoadSession();
  fitSaveSession(null);
  fitClearLegacy();
  if (s && s.access_token) {
    fitRawFetch(FIT_SB_URL + '/auth/v1/logout?scope=local', {
      method: 'POST', headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
    }).catch(() => {});
  }
}
// 保存済みセッションから本人の行を取り直す。旧方式（PIN保存）の端末は1回だけ自動で移行する。
// 戻り値 { kind, row } / null（未ログイン）。通信エラー時は例外（ログイン情報は消さない）。
async function fitResume() {
  let s = fitLoadSession();
  if (!s) {
    let email = null, pin = null, pid = null, ppin = null, role = null;
    try {
      email = localStorage.getItem('fit_email'); pin = localStorage.getItem('fit_pin');
      pid = localStorage.getItem('fit_parent_id'); ppin = localStorage.getItem('fit_parent_pin');
      role = localStorage.getItem('fit_role');
    } catch (e) {}
    let j = null;
    if (email && pin) j = await fitLogin(role === 'staff' ? 'staff' : 'student', email, pin);
    else if (pid && ppin) j = await fitLogin('parent', pid, ppin);
    if (j && j.error === 'network') throw new Error('network');
    fitClearLegacy();
    s = fitLoadSession();
    if (!s) return null;
  }
  const rr = await fitRefresh(false);
  if (rr === 'invalid' || rr === 'none') return null;
  s = fitLoadSession();
  if (!s) return null;
  const table = { staff: 'staff', student: 'students', parent: 'parent_accounts', online: 'online_students' }[s.kind];
  if (!table) { fitLogout(); return null; }
  // sec4: 生徒・保護者は students を直接読まず、表示用の列だけ返す関数から受け取る（生徒は自分の1行）
  const res = s.kind === 'student'
    ? await fitRawFetch(FIT_SB_URL + '/rest/v1/rpc/fit_my_students', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
        body: '{}'
      })
    : await fitRawFetch(FIT_SB_URL + '/rest/v1/' + table + '?id=eq.' + encodeURIComponent(s.account_id) + '&select=*', {
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
      });
  if (res.status === 401 || res.status === 403) {
    const again = await fitRefresh(true);
    if (again === 'invalid' || again === 'none') return null;
    throw new Error('auth ' + res.status);
  }
  if (!res.ok) throw new Error('resume ' + res.status);
  const rows = await res.json();
  if (!rows.length || rows[0].is_active === false && s.kind !== 'student') { fitLogout(); return null; }
  return { kind: s.kind, row: rows[0] };
}
// Supabase への fetch をログイン中のトークンに差し替える（各画面のコードはそのまま使える）
window.fetch = async function (input, init) {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (url.indexOf(FIT_SB_URL) !== 0 || url.indexOf('/auth/v1/') > 0 || url.indexOf('/functions/v1/fit-login') > 0) {
    return fitRawFetch(input, init);
  }
  // 呼び出し時点のトークンを控えておく（直後にログアウトしても、その前に始めた保存は通す）
  const tokenAtCall = fitLoadSession() ? fitSession.access_token : null;
  if (tokenAtCall) await fitRefresh(false);
  const send = () => {
    const opt = Object.assign({}, init || {});
    const h = new Headers(opt.headers || (input && typeof input !== 'string' ? input.headers : undefined));
    const tok = (fitSession && fitSession.access_token) || tokenAtCall;
    if (tok) h.set('Authorization', 'Bearer ' + tok);
    opt.headers = h;
    return fitRawFetch(input, opt);
  };
  let res = await send();
  if (res.status === 401 && fitSession && fitSession.refresh_token) {
    const rr = await fitRefresh(true);
    if (rr === 'ok') res = await send();
  }
  return res;
};
setInterval(() => { if (fitSession) fitRefresh(false); }, 60000);

// ============================================================
// fit kids 個別レッスン（kids.html）2026-11-13
// ・PE 用のアドレス。ここに直接入ると、保護者は予約の画面、PE スタッフは管理の画面が出る（ログインは fit 共通。fitアプリに入っていれば入り直さない）
// ・kd1：ログイン（保護者＝メール＋パスワード／スタッフ＝スタッフID）・パスワードを忘れたとき・パスワードを変える・
//        スタッフ「家庭の登録」（保護者と子どもを1回で登録 → ログイン情報をメール）・責任者「PE スタッフ」（だれが何をできるか）
// ・表：kids_children・pe_places・pe_slots・pe_requests・pe_staff（01_メモ/20261113_kids1.sql）。小学生は students には入れない
// ============================================================
const KD_VERSION = '20261113kd1';
const KD_URL = location.origin + location.pathname;
const KD_HDR = { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' };
const KD_GRADES = ['年少', '年中', '年長', '小1', '小2', '小3', '小4', '小5', '小6'];
const KD_MANAGERS = ['fit001', 'fit002', 'fit003', 'fit010'];   // 責任者（代表・橋田・石田・亀井）。app.html と同じ4人
let ME = null;                       // { kind, row }
let PERM = { manager: false, slots: false, register: false };
let TAB = 'fam';
let FAM = [];                        // [{ parent, kids:[] }]
let STAFF = [], PESTAFF = {};

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = () => $('#app');
function busy(btn, on, text) { if (!btn) return; if (on) { btn.dataset.t = btn.textContent; btn.textContent = text || 'おまちください…'; btn.disabled = true; } else { btn.textContent = btn.dataset.t || btn.textContent; btn.disabled = false; } }
function showMsg(id, text, kind) { const e = document.getElementById(id); if (!e) return; e.className = 'msg ' + (kind || 'bad'); e.textContent = text; e.style.display = text ? 'block' : 'none'; }

async function api(path, opt) {
  opt = opt || {};
  const h = Object.assign({}, KD_HDR, opt.headers || {});
  const r = await fetch(FIT_SB_URL + '/rest/v1/' + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
  const tx = await r.text();
  if (!r.ok) throw new Error((opt.method || 'GET') + ' ' + path.split('?')[0] + ' ' + r.status + ' ' + tx.slice(0, 200));
  return tx ? JSON.parse(tx) : null;
}
const apiPost = (t, body) => api(t, { method: 'POST', headers: { 'Prefer': 'return=representation' }, body });
const apiPatch = (t, q, body) => api(t + '?' + q, { method: 'PATCH', headers: { 'Prefer': 'return=representation' }, body });

// fit-login の action（パスワードの発行・変更・忘れたとき）
async function pwCall(action, body, withToken) {
  const h = Object.assign({}, KD_HDR);
  if (withToken) {
    try { await fitRefresh(); } catch (e) {}
    const s = fitLoadSession();
    if (!s || !s.access_token) return { ok: false, error: 'not_logged_in' };
    h['x-fit-token'] = s.access_token;
  }
  try {
    const r = await fitRawFetch(FIT_SB_URL + '/functions/v1/fit-login', { method: 'POST', headers: h, body: JSON.stringify(Object.assign({ action: action, page_url: KD_URL }, body || {})) });
    return await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
}
function pwErr(j) {
  if (!j) return '通信がうまくつながりませんでした';
  if (j.error === 'weak' && j.message) return j.message;
  return ({ wrong_current: '今のパスワードがちがいます', locked: '失敗がつづいたため、15分ほど待ってからお試しください', bad_code: '確認コードがちがうか、時間が切れています。もう一度コードを送ってください', not_allowed: 'この操作はできません（ログインし直してください）', not_logged_in: 'ログインし直してください', network: '通信がうまくつながりませんでした', student_unusable: 'このアカウントは止めてあるため、発行できません', not_found: '見つかりませんでした' })[j.error] || 'うまくいきませんでした（' + (j.error || '') + '）';
}
// 画面でも先に確かめる（サーバーと同じ決まりの、かんたんな部分だけ。最後はサーバーが決める）
function pwLocalProblem(pw) {
  if (pw.length < 6) return '6文字以上にしてください（数字6桁でもよい）';
  if (pw.length > 64) return '64文字以内にしてください';
  if (!/^[\x21-\x7e]+$/.test(pw)) return '半角の英字・数字・記号だけで入れてください（全角や空白は使えません）';
  return '';
}
const PW_RULE = '<div class="muted" style="margin-top:8px">6文字以上（数字6桁でもよい）。111111・123456 のような並びやくり返し、メールアドレスと同じ文字は使えません。</div>';

// ---------- 入口 ----------
async function boot() {
  try {
    ME = await fitResume();
  } catch (e) {
    app().innerHTML = '<div class="card center"><div class="big">📡</div>通信がうまくつながりませんでした。<div style="margin-top:12px"><button class="btn" onclick="location.reload()">もう一度</button></div></div>';
    return;
  }
  route();
}
function setWho() {
  const w = $('#who');
  if (!ME) { w.style.display = 'none'; return; }
  w.style.display = 'block';
  w.innerHTML = esc(ME.row.name || '') + (ME.kind === 'staff' ? '（スタッフ）' : ' さま');
}
async function route() {
  setWho(); closeOv();
  if (!ME) return viewLogin();
  if (ME.kind === 'parent') return viewParent();
  if (ME.kind === 'staff') return viewStaff();
  app().innerHTML = '<div class="card center"><div class="big">🙇</div>このページは、fit kids の保護者さまと PE スタッフ用です。<div class="muted" style="margin-top:6px">今は別のアカウント（生徒など）でログインしています。</div><div class="row" style="justify-content:center;margin-top:14px"><a class="btn ghost" href="app.html">fitアプリへ</a><button class="btn" onclick="doLogout()">ログアウトして入り直す</button></div></div>';
}
function doLogout() { fitLogout(); ME = null; route(); }

// ---------- ログイン ----------
function viewLogin(prefill) {
  app().innerHTML =
    '<div class="card"><h2>ログイン</h2>' +
    '<div class="muted">保護者さまは、塾からお知らせしたメールアドレスとパスワードで入ってください。</div>' +
    '<label class="lbl" for="lg-id">メールアドレス（スタッフはスタッフID）</label><input class="in" id="lg-id" type="text" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" value="' + esc(prefill || '') + '">' +

async function doLogin() {
  const id = ($('#lg-id').value || '').trim(), pw = ($('#lg-pw').value || '').trim();

      '<label class="lbl" for="fg-code">メールに届いた6桁の確認コード</label><input class="in" id="fg-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">' +
      '<label class="lbl" for="fg-new">新しいパスワード</label><input class="in" id="fg-new" type="password" autocomplete="new-password">' +

  $('#fg-back').onclick = () => viewLogin(($('#fg-mail').value || '').trim());
  $('#fg-send').onclick = async () => {
    const m = ($('#fg-mail').value || '').trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return showMsg('fg-msg', 'メールアドレスを入れてください');
    const b = $('#fg-send'); busy(b, true, '送っています…');
    const j = await pwCall('forgot', { email: m });
    busy(b, false);
    if (!j.ok) return showMsg('fg-msg', pwErr(j));
    showMsg('fg-msg', '登録のあるメールアドレスなら、確認コードを送りました。届いた6桁を下に入れてください（15分で使えなくなります）。', 'good');
    $('#fg-step2').style.display = 'block'; b.textContent = 'もう一度送る';
  };
  $('#fg-reset').onclick = async () => {
    const m = ($('#fg-mail').value || '').trim().toLowerCase(), c = ($('#fg-code').value || '').replace(/\D/g, ''), n = $('#fg-new').value, n2 = $('#fg-new2').value;
    if (c.length !== 6) return showMsg('fg-msg2', '6桁の確認コードを入れてください');
    if (n !== n2) return showMsg('fg-msg2', '新しいパスワードが2回とも同じになっていません');
    const p = pwLocalProblem(n); if (p) return showMsg('fg-msg2', p);
    const b = $('#fg-reset'); busy(b, true);
    const j = await pwCall('reset', { email: m, code: c, next: n });

// ----- 家庭の登録 -----
async function loadFam() {
  const kids = await api('kids_children?select=*&order=created_at') || [];
  const pids = [...new Set(kids.map(k => k.parent_id))];
  let parents = [];
  if (pids.length) parents = await api('parent_accounts?id=in.(' + pids.join(',') + ')&select=id,name,login_id,is_active,last_login,created_at') || [];
  const byId = {}; parents.forEach(p => { byId[p.id] = { parent: p, kids: [] }; });
  kids.forEach(k => { if (byId[k.parent_id]) byId[k.parent_id].kids.push(k); });
  FAM = Object.values(byId).sort((a, b) => String(b.parent.created_at || '').localeCompare(String(a.parent.created_at || '')));
}
async function paneFam() {
  const pane = $('#pane');
  try { await loadFam(); } catch (e) { pane.innerHTML = '<div class="card"><div class="msg bad" style="display:block;margin-top:0">読み込めませんでした</div><div class="muted" style="word-break:break-all;margin-top:6px">' + esc(e.message) + '</div></div>'; return; }
  const nKids = FAM.reduce((n, f) => n + f.kids.filter(k => k.is_active).length, 0);
  pane.innerHTML =
    '<div class="card"><div class="row"><div style="flex:1;min-width:150px"><h2 style="margin:0">家庭の登録</h2><div class="muted">' + FAM.length + '家庭・お子さま ' + nKids + '人</div></div><button class="btn sun" id="fam-new">＋ 家庭を登録</button></div></div>' +
    (FAM.length ? FAM.map(famHtml).join('') : '<div class="card center muted">まだ登録がありません。「＋ 家庭を登録」から入れてください。</div>');
  $('#fam-new').onclick = () => openFamForm();
  pane.querySelectorAll('[data-act]').forEach(b => b.onclick = () => famAct(b.dataset.act, b.dataset.pid, b.dataset.kid));
}
function famHtml(f) {
  const p = f.parent;
  return '<div class="fam"><div class="fam-h"><b>' + esc(p.name || '') + '</b><span class="sp"></span>' + (p.last_login ? '<span class="muted">さいごのログイン ' + esc(String(p.last_login).slice(0, 10).replace(/-/g, '/')) + '</span>' : '<span class="muted">まだログインなし</span>') + '</div>' +
    '<div class="mail">' + esc(p.login_id || '') + '</div>' +
    f.kids.map(k => '<div class="kid' + (k.is_active ? '' : ' off') + '"><span class="kid-n">' + esc(k.name) + '</span>' + (k.kana ? '<span class="muted">' + esc(k.kana) + '</span>' : '') + (k.grade ? '<span class="chip">' + esc(k.grade) + '</span>' : '') + (k.school ? '<span class="muted">' + esc(k.school) + '</span>' : '') + (k.is_active ? '' : '<span class="muted">（お休み中）</span>') + '<span class="sp"></span><button class="btn ghost sm" data-act="kid-edit" data-pid="' + esc(p.id) + '" data-kid="' + esc(k.id) + '">直す</button></div>').join('') +
    '<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="kid-add" data-pid="' + esc(p.id) + '">＋ きょうだいを足す</button><button class="btn ghost sm" data-act="issue" data-pid="' + esc(p.id) + '">🔑 新しいパスワードを発行</button></div></div>';
}
function famAct(act, pid, kid) {
  const f = FAM.find(x => String(x.parent.id) === String(pid)); if (!f) return;
  if (act === 'issue') return openIssue(f.parent);
  if (act === 'kid-add') return openKidForm(f.parent, null);
  if (act === 'kid-edit') return openKidForm(f.parent, f.kids.find(k => String(k.id) === String(kid)));
}
function kidFields(i, k) {
  k = k || {};
  return '<div class="kidrow" data-kidrow="' + i + '">' +
    '<label class="lbl" style="margin-top:0" for="kf-name-' + i + '">お子さまの名前</label><input class="in" id="kf-name-' + i + '" value="' + esc(k.name || '') + '" placeholder="例：石田 たろう">' +
    '<div class="two"><div><label class="lbl" for="kf-kana-' + i + '">ふりがな</label><input class="in" id="kf-kana-' + i + '" value="' + esc(k.kana || '') + '"></div>' +

    '<label class="lbl" for="kf-school-' + i + '">学校・園（なくてもよい）</label><input class="in" id="kf-school-' + i + '" value="' + esc(k.school || '') + '">' +

function readKid(i) {

function openFamForm() {
  let n = 1;
  openOv('<div class="modal-h"><b>＋ 家庭を登録</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' +
    '<label class="lbl" for="ff-name">保護者のお名前</label><input class="in" id="ff-name" placeholder="例：石田 花子">' +
    '<label class="lbl" for="ff-mail">メールアドレス（ログインID になります）</label><input class="in" id="ff-mail" type="email" autocapitalize="off" spellcheck="false">' +
    '<div id="ff-kids">' + kidFields(0) + '</div>' +
    '<div style="margin-top:8px"><button class="btn ghost sm" id="ff-more">＋ きょうだいも入れる</button></div>' +
    '<label class="row" style="margin-top:14px"><input type="checkbox" id="ff-send" checked style="width:20px;height:20px"><span>ログイン情報（6桁のパスワード）をメールで送る</span></label>' +
    '<div class="msg bad" id="ff-msg" style="display:none"></div>' +
    '<button class="btn wide" id="ff-go" style="margin-top:14px">登録する</button>');
  $('#ff-more').onclick = () => { $('#ff-kids').insertAdjacentHTML('beforeend', kidFields(n)); n++; };
  $('#ff-go').onclick = async () => {
    const name = ($('#ff-name').value || '').trim(), mail = ($('#ff-mail').value || '').trim().toLowerCase();
    const kids = []; for (let i = 0; i < n; i++) { const k = readKid(i); if (k.name) kids.push(k); }
    if (!name) return showMsg('ff-msg', '保護者のお名前を入れてください');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return showMsg('ff-msg', 'メールアドレスを正しく入れてください');
    if (!kids.length) return showMsg('ff-msg', 'お子さまの名前を入れてください');
    const send = $('#ff-send').checked, btn = $('#ff-go'); busy(btn, true, '登録しています…');
    try {
      const dup = await api('parent_accounts?login_id=eq.' + encodeURIComponent(mail) + '&select=id,name,is_active') || [];
      let parent = dup[0], isNew = false;
      if (!parent) {
        // 最初のパスワードは、このあとサーバーがランダムに作る。ここでは、だれにも分からない値を入れておく
        const junk = 'pw-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
        const made = await apiPost('parent_accounts', { login_id: mail, pin: junk, name: name, is_active: true });
        parent = Array.isArray(made) ? made[0] : made; isNew = true;
        if (!parent || !parent.id) throw new Error('保護者を登録できませんでした');
      }
      await apiPost('kids_children', kids.map(k => Object.assign({ parent_id: parent.id, created_by: ME.row.id }, k)));
      if (!isNew) {
        busy(btn, false); await paneFam();
        openOv('<div class="center"><div class="big">👪</div><b>お子さまを足しました</b><div class="muted" style="margin-top:6px">このメールアドレスは、もう登録のある保護者（' + esc(parent.name || '') + ' さま）でした。保護者の登録とパスワードはそのままです。</div><button class="btn wide" style="margin-top:14px" onclick="closeOv()">とじる</button></div>');
        return;
      }
      const j = await pwCall('issue', { parent_id: parent.id, send_mail: send }, true);
      busy(btn, false); await paneFam();
      if (!j.ok) { openOv('<div class="center"><div class="big">⚠️</div><b>登録はできましたが、パスワードを発行できませんでした</b><div class="muted" style="margin-top:6px">' + esc(pwErr(j)) + '<br>一覧の「🔑 新しいパスワードを発行」から、もう一度お試しください。</div><button class="btn wide" style="margin-top:14px" onclick="closeOv()">とじる</button></div>'); return; }
      showIssued(Object.assign({}, parent, { name: name, login_id: mail }), j, send, true);
    } catch (e) { busy(btn, false); showMsg('ff-msg', '登録できませんでした：' + e.message); }
  };
}
function openKidForm(parent, kid) {
  openOv('<div class="modal-h"><b>' + (kid ? 'お子さまの登録を直す' : '＋ きょうだいを足す') + '</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' +

  $('#kf-go').onclick = async () => {
    const k = readKid(0); if (!k.name) return showMsg('kf-msg', 'お子さまの名前を入れてください');
    const btn = $('#kf-go'); busy(btn, true);
    try {
      if (kid) await apiPatch('kids_children', 'id=eq.' + encodeURIComponent(kid.id), Object.assign({ is_active: $('#kf-active').checked, updated_at: new Date().toISOString() }, k));
      else await apiPost('kids_children', Object.assign({ parent_id: parent.id, created_by: ME.row.id }, k));
      closeOv(); await paneFam();
    } catch (e) { busy(btn, false); showMsg('kf-msg', '保存できませんでした：' + e.message); }
  };
}
function openIssue(parent) {
  openOv('<div class="modal-h"><b>🔑 新しいパスワードを発行</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' +
    '<div><b>' + esc(parent.name || '') + '</b> さまのパスワードを、ランダムに作って登録します。</div>' +
    '<div class="msg bad" style="display:block">今のパスワード（ご本人が決めたものも）は使えなくなります。</div>' +
    '<div class="mail" style="margin-top:8px">ログインID：' + esc(parent.login_id || '') + '</div>' +
    '<label class="row" style="margin-top:12px"><input type="checkbox" id="is-send" checked style="width:20px;height:20px"><span>保護者のメールにも送る</span></label>' +
    '<div class="msg bad" id="is-msg" style="display:none"></div><button class="btn wide" id="is-go" style="margin-top:14px">発行する</button>');
  $('#is-go').onclick = async () => {
    const send = $('#is-send').checked, btn = $('#is-go'); busy(btn, true, '発行しています…');
    const j = await pwCall('issue', { parent_id: parent.id, send_mail: send }, true);
    busy(btn, false);
    if (!j.ok) return showMsg('is-msg', pwErr(j));
    showIssued(parent, j, send, false);
  };
}
function showIssued(parent, j, send, isNew) {
  openOv('<div class="center"><div class="big">✅</div><b>' + (isNew ? '登録しました' : 'パスワードを発行しました') + '</b></div>' +
    '<div style="margin-top:10px"><b>' + esc(parent.name || '') + '</b> さま</div>' +
    '<div class="lbl">ログインするページ</div><div class="mail">' + esc(KD_URL) + '</div>' +
    '<div class="lbl">ログインID</div><div class="mail" style="font-size:15px;color:var(--ink);font-weight:700">' + esc(parent.login_id || '') + '</div>' +
    '<div class="lbl">パスワード</div><div class="pw">' + esc(j.password || '') + '</div>' +
    '<div class="msg ' + (j.mailed ? 'good' : (send ? 'bad' : 'info')) + '" style="display:block">' + (j.mailed ? '📧 保護者のメールにも送りました' : (send ? '⚠ メールは送れませんでした。この画面のパスワードを、直接お伝えください' : 'メールは送っていません。この画面のパスワードを、直接お伝えください')) + '</div>' +
    '<div class="muted" style="margin-top:8px">このパスワードは、この画面をとじると二度と見られません。</div>' +
    '<button class="btn wide" style="margin-top:14px" onclick="closeOv()">とじる</button>');
}

// ----- PE スタッフ（責任者だけ）-----
async function paneStf() {
  const pane = $('#pane');
  try {
    STAFF = (await api('staff?select=id,staff_id,name,is_active&order=staff_id') || []).filter(s => s.is_active !== false);
    PESTAFF = {}; (await api('pe_staff?select=*') || []).forEach(r => { PESTAFF[r.staff_uuid] = r; });
  } catch (e) { pane.innerHTML = '<div class="card"><div class="msg bad" style="display:block;margin-top:0">読み込めませんでした</div><div class="muted" style="word-break:break-all;margin-top:6px">' + esc(e.message) + '</div></div>'; return; }
  const row = s => { const r = PESTAFF[s.id] || {}; return '<div class="stf"><div class="stf-n">' + esc(s.name || '') + ' <span class="muted">' + esc(s.staff_id || '') + '</span></div><label><input type="checkbox" data-su="' + esc(s.id) + '" data-col="can_slots"' + (r.can_slots ? ' checked' : '') + '>枠・承認</label><label><input type="checkbox" data-su="' + esc(s.id) + '" data-col="can_register"' + (r.can_register ? ' checked' : '') + '>家庭の登録</label></div>'; };
  const on = STAFF.filter(s => PESTAFF[s.id] && (PESTAFF[s.id].can_slots || PESTAFF[s.id].can_register)), off = STAFF.filter(s => on.indexOf(s) < 0);
  pane.innerHTML = '<div class="card"><h2>PE スタッフ</h2><div class="muted">印をつけた人が、このページを使えます。責任者（代表・橋田・石田・亀井）は、印がなくても全部使えます。</div><div id="stf-msg" class="msg good" style="display:none"></div>' +
    '<h3 style="margin-top:14px">使える人</h3>' + (on.length ? on.map(row).join('') : '<div class="muted">まだいません</div>') +
    '<h3 style="margin-top:18px">ほかのスタッフ</h3><input class="in" id="stf-q" placeholder="名前でさがす" style="margin-bottom:6px"><div id="stf-off">' + off.map(row).join('') + '</div></div>';
  $('#stf-q').oninput = e => { const q = e.target.value.trim(); $('#stf-off').innerHTML = off.filter(s => !q || String(s.name || '').indexOf(q) >= 0 || String(s.staff_id || '').indexOf(q) >= 0).map(row).join(''); bind(); };
  function bind() { pane.querySelectorAll('input[data-su]').forEach(c => c.onchange = () => saveStf(c)); }
  bind();
}
async function saveStf(c) {
  const su = c.dataset.su, cur = PESTAFF[su] || { staff_uuid: su, can_slots: false, can_register: false };
  const next = Object.assign({}, cur, { [c.dataset.col]: c.checked, updated_at: new Date().toISOString() });
  c.disabled = true;
  try {
    await api('pe_staff?on_conflict=staff_uuid', { method: 'POST', headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' }, body: { staff_uuid: su, can_slots: !!next.can_slots, can_register: !!next.can_register, updated_at: next.updated_at } });
    PESTAFF[su] = next; showMsg('stf-msg', '保存しました', 'good');
  } catch (e) { c.checked = !c.checked; showMsg('stf-msg', '保存できませんでした：' + e.message, 'bad'); }
  c.disabled = false;
}

boot();
</script>

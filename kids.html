<style>

html,body{margin:0}
body{font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}

<body>
<div class="top"><div class="top-in"><div class="logo">fit kids<small>個別レッスン</small></div><div class="who" id="who" style="display:none"></div></div></div>

<script>
// ===== fit 共通ログイン（Supabase Auth セッション）sec1 =====
// ・ID＋PINの照合はサーバー（Edge Function fit-login）で行い、ブラウザには PIN を残さない。
// ・発行されたセッションは localStorage 'fit_session_v1' に保存し、同じサイトの全アプリで共有する。
// ・Supabase への fetch は自動でログイン中のトークンに差し替え、期限切れなら自動更新して1回だけ再送する。
const FIT_SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const FIT_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';
const FIT_SESSION_KEY = 'fit_session_v1';
const FIT_LEGACY_KEYS = ['fit_pin', 'fit_parent_pin', 'fit_staff_hash', 'fit_staff_pin'];
let fitSession = null;
let fitRefreshing = null;
const fitRawFetch = window.fetch.bind(window);

function fitLoadSession() {
  try { fitSession = JSON.parse(localStorage.getItem(FIT_SESSION_KEY) || 'null'); } catch (e) { fitSession = fitSession || null; }
  return fitSession;
}
function fitSaveSession(s) {
  fitSession = s || null;
  try { if (s) localStorage.setItem(FIT_SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(FIT_SESSION_KEY); } catch (e) {}
}
function fitClearLegacy() {
  try { FIT_LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
// 'ok' | 'invalid'（ログインし直しが必要） | 'error'（通信エラー等。セッションは残す）| 'none'
async function fitRefresh(force) {
  const cur = fitLoadSession();
  if (!cur || !cur.refresh_token) return 'none';
  const now = Math.floor(Date.now() / 1000);
  if (!force && (cur.expires_at || 0) - now > 300) return 'ok';
  if (fitRefreshing) return fitRefreshing;
  fitRefreshing = (async () => {
    try {
      const r = await fitRawFetch(FIT_SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: cur.refresh_token })
      });
      if (r.status === 400 || r.status === 401 || r.status === 403) {
        // 別タブが先に更新していればそちらを使う
        const latest = fitLoadSession();
        if (latest && latest.refresh_token !== cur.refresh_token) return 'ok';
        fitSaveSession(null);
        return 'invalid';
      }
      if (!r.ok) return 'error';
      const j = await r.json();
      fitSaveSession(Object.assign({}, cur, {
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        expires_at: j.expires_at || (now + (j.expires_in || 3600))
      }));
      return 'ok';
    } catch (e) { return 'error'; }
    finally { fitRefreshing = null; }
  })();
  return fitRefreshing;
}
// ログイン：kind = 'staff' | 'student' | 'parent' | 'online'
// 戻り値 { ok:true, kind, account } / { ok:false, error:'invalid'|'blocked'|'locked'|... }
async function fitLogin(kind, id, pin) {
  let r, j = null;
  try {
    r = await fitRawFetch(FIT_SB_URL + '/functions/v1/fit-login', {
      method: 'POST',
      headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, id: id, pin: pin })
    });
    j = await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
  if (!j) return { ok: false, error: 'network' };
  if (j.ok) {
    fitSaveSession(Object.assign({}, j.session, { kind: j.kind, account_id: String(j.account.id) }));
    fitClearLegacy();
  }
  return j;
}
function fitLoginErrorText(j, fallback) {
  if (!j) return fallback;
  if (j.error === 'locked') return 'ログインの失敗が続いたため、15分ほど待ってからお試しください。';
  if (j.error === 'blocked') return 'このアカウントは現在ご利用いただけません。塾までお問い合わせください。';
  if (j.error === 'network' || j.error === 'server') return '通信がうまくつながりませんでした。電波の良い場所でもう一度お試しください。';
  return fallback;
}
// ===== 段階B：サーバー関数（RPC）=====
// ポイント加算・ログインボーナス・面談共有メモなどは、サーバー側の関数で行う（生徒は直接書き換えできない）。
async function fitRpc(name, args) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/rpc/' + name, {
    method: 'POST',
    headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  });
  const tx = await r.text();
  if (!r.ok) throw new Error('rpc ' + name + ' ' + r.status + ' ' + tx);
  return tx ? JSON.parse(tx) : null;
}
function fitLogout() {
  const s = fitSession || fitLoadSession();
  fitSaveSession(null);
  fitClearLegacy();
  if (s && s.access_token) {
    fitRawFetch(FIT_SB_URL + '/auth/v1/logout?scope=local', {
      method: 'POST', headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
    }).catch(() => {});
  }
}
// 保存済みセッションから本人の行を取り直す。旧方式（PIN保存）の端末は1回だけ自動で移行する。
// 戻り値 { kind, row } / null（未ログイン）。通信エラー時は例外（ログイン情報は消さない）。
async function fitResume() {
  let s = fitLoadSession();
  if (!s) {
    let email = null, pin = null, pid = null, ppin = null, role = null;
    try {
      email = localStorage.getItem('fit_email'); pin = localStorage.getItem('fit_pin');
      pid = localStorage.getItem('fit_parent_id'); ppin = localStorage.getItem('fit_parent_pin');
      role = localStorage.getItem('fit_role');
    } catch (e) {}
    let j = null;
    if (email && pin) j = await fitLogin(role === 'staff' ? 'staff' : 'student', email, pin);
    else if (pid && ppin) j = await fitLogin('parent', pid, ppin);
    if (j && j.error === 'network') throw new Error('network');
    fitClearLegacy();
    s = fitLoadSession();
    if (!s) return null;
  }
  const rr = await fitRefresh(false);
  if (rr === 'invalid' || rr === 'none') return null;
  s = fitLoadSession();
  if (!s) return null;
  const table = { staff: 'staff', student: 'students', parent: 'parent_accounts', online: 'online_students' }[s.kind];
  if (!table) { fitLogout(); return null; }
  // sec4: 生徒・保護者は students を直接読まず、表示用の列だけ返す関数から受け取る（生徒は自分の1行）
  const res = s.kind === 'student'
    ? await fitRawFetch(FIT_SB_URL + '/rest/v1/rpc/fit_my_students', {
        method: 'POST',
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json' },
        body: '{}'
      })
    : await fitRawFetch(FIT_SB_URL + '/rest/v1/' + table + '?id=eq.' + encodeURIComponent(s.account_id) + '&select=*', {
        headers: { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + s.access_token }
      });
  if (res.status === 401 || res.status === 403) {
    const again = await fitRefresh(true);
    if (again === 'invalid' || again === 'none') return null;
    throw new Error('auth ' + res.status);
  }
  if (!res.ok) throw new Error('resume ' + res.status);
  const rows = await res.json();
  if (!rows.length || rows[0].is_active === false && s.kind !== 'student') { fitLogout(); return null; }
  return { kind: s.kind, row: rows[0] };
}
// Supabase への fetch をログイン中のトークンに差し替える（各画面のコードはそのまま使える）
window.fetch = async function (input, init) {
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (url.indexOf(FIT_SB_URL) !== 0 || url.indexOf('/auth/v1/') > 0 || url.indexOf('/functions/v1/fit-login') > 0) {
    return fitRawFetch(input, init);
  }
  // 呼び出し時点のトークンを控えておく（直後にログアウトしても、その前に始めた保存は通す）
  const tokenAtCall = fitLoadSession() ? fitSession.access_token : null;
  if (tokenAtCall) await fitRefresh(false);
  const send = () => {
    const opt = Object.assign({}, init || {});
    const h = new Headers(opt.headers || (input && typeof input !== 'string' ? input.headers : undefined));
    const tok = (fitSession && fitSession.access_token) || tokenAtCall;
    if (tok) h.set('Authorization', 'Bearer ' + tok);
    opt.headers = h;
    return fitRawFetch(input, opt);
  };
  let res = await send();
  if (res.status === 401 && fitSession && fitSession.refresh_token) {
    const rr = await fitRefresh(true);
    if (rr === 'ok') res = await send();
  }
  return res;
};
setInterval(() => { if (fitSession) fitRefresh(false); }, 60000);

// ============================================================
// fit kids 個別レッスン（kids.html）2026-11-13
// ・PE 用のアドレス。ここに直接入ると、保護者は予約の画面、PE スタッフは管理の画面が出る（ログインは fit 共通。fitアプリに入っていれば入り直さない）
// ・kd1：ログイン（保護者＝メール＋パスワード／スタッフ＝スタッフID）・パスワードを忘れたとき・パスワードを変える・
//        スタッフ「家庭の登録」（保護者と子どもを1回で登録 → ログイン情報をメール）・責任者「PE スタッフ」（だれが何をできるか）
// ・表：kids_children・pe_places・pe_slots・pe_requests・pe_staff（01_メモ/20261113_kids1.sql）。小学生は students には入れない
// ============================================================
const KD_VERSION = '20261113kd4';   // kd4：保護者が希望の日時（第1〜第3・00分か30分から・2日前まで）を出せる → スタッフが場所をえらんで確定（SQL kids4）／枠の登録も30分からを選べる。
//   // kd3：保護者の予約（種類 → 第1〜第3希望 → 申請）・確定したレッスン・変更・キャンセル／スタッフの承認・動かす・中止／はじめての方の登録の申請（SQL kids2）。
//   // kd2：スタッフ「枠と申請」に、枠の登録（日・時刻・場所）と場所のリスト
const KD_URL = location.origin + location.pathname;
const KD_HDR = { 'apikey': FIT_ANON, 'Authorization': 'Bearer ' + FIT_ANON, 'Content-Type': 'application/json' };
const KD_GRADES = ['年少', '年中', '年長', '小1', '小2', '小3', '小4', '小5', '小6'];
const KD_MANAGERS = ['fit001', 'fit002', 'fit003', 'fit010'];   // 責任者（代表・橋田・石田・亀井）。app.html と同じ4人
let ME = null;                       // { kind, row }
let PERM = { manager: false, slots: false, register: false };
let TAB = 'fam';
let FAM = [];                        // [{ parent, kids:[] }]
let STAFF = [], PESTAFF = {};

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = () => $('#app');
function busy(btn, on, text) { if (!btn) return; if (on) { btn.dataset.t = btn.textContent; btn.textContent = text || 'おまちください…'; btn.disabled = true; } else { btn.textContent = btn.dataset.t || btn.textContent; btn.disabled = false; } }
function showMsg(id, text, kind) { const e = document.getElementById(id); if (!e) return; e.className = 'msg ' + (kind || 'bad'); e.textContent = text; e.style.display = text ? 'block' : 'none'; }

async function api(path, opt) {
  opt = opt || {};
  const h = Object.assign({}, KD_HDR, opt.headers || {});
  const r = await fetch(FIT_SB_URL + '/rest/v1/' + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
  const tx = await r.text();
  if (!r.ok) throw new Error((opt.method || 'GET') + ' ' + path.split('?')[0] + ' ' + r.status + ' ' + tx.slice(0, 200));
  return tx ? JSON.parse(tx) : null;
}
const apiPost = (t, body) => api(t, { method: 'POST', headers: { 'Prefer': 'return=representation' }, body });
const apiPatch = (t, q, body) => api(t + '?' + q, { method: 'PATCH', headers: { 'Prefer': 'return=representation' }, body });

// fit-login の action（パスワードの発行・変更・忘れたとき）
async function pwCall(action, body, withToken) {
  const h = Object.assign({}, KD_HDR);
  if (withToken) {
    try { await fitRefresh(); } catch (e) {}
    const s = fitLoadSession();
    if (!s || !s.access_token) return { ok: false, error: 'not_logged_in' };
    h['x-fit-token'] = s.access_token;
  }
  try {
    const r = await fitRawFetch(FIT_SB_URL + '/functions/v1/fit-login', { method: 'POST', headers: h, body: JSON.stringify(Object.assign({ action: action, page_url: KD_URL }, body || {})) });
    return await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
}
function pwErr(j) {
  if (!j) return '通信がうまくつながりませんでした';
  if (j.error === 'weak' && j.message) return j.message;
  return ({ wrong_current: '今のパスワードがちがいます', locked: '失敗がつづいたため、15分ほど待ってからお試しください', bad_code: '確認コードがちがうか、時間が切れています。もう一度コードを送ってください', not_allowed: 'この操作はできません（ログインし直してください）', not_logged_in: 'ログインし直してください', network: '通信がうまくつながりませんでした', student_unusable: 'このアカウントは止めてあるため、発行できません', not_found: '見つかりませんでした' })[j.error] || 'うまくいきませんでした（' + (j.error || '') + '）';
}
// 画面でも先に確かめる（サーバーと同じ決まりの、かんたんな部分だけ。最後はサーバーが決める）
function pwLocalProblem(pw) {
  if (pw.length < 6) return '6文字以上にしてください（数字6桁でもよい）';
  if (pw.length > 64) return '64文字以内にしてください';
  if (!/^[\x21-\x7e]+$/.test(pw)) return '半角の英字・数字・記号だけで入れてください（全角や空白は使えません）';
  return '';
}
const PW_RULE = '<div class="muted" style="margin-top:8px">6文字以上（数字6桁でもよい）。111111・123456 のような並びやくり返し、メールアドレスと同じ文字は使えません。</div>';

// ---------- 入口 ----------
async function boot() {
  try {
    ME = await fitResume();
  } catch (e) {
    app().innerHTML = '<div class="card center"><div class="big">📡</div>通信がうまくつながりませんでした。<div style="margin-top:12px"><button class="btn" onclick="location.reload()">もう一度</button></div></div>';
    return;
  }
  route();
}
function setWho() {
  const w = $('#who');
  if (!ME) { w.style.display = 'none'; return; }
  w.style.display = 'block';
  w.innerHTML = esc(ME.row.name || '') + (ME.kind === 'staff' ? '（スタッフ）' : ' さま');
}
async function route() {
  setWho(); closeOv();
  if (!ME) return viewLogin();
  if (ME.kind === 'parent') return viewParent();
  if (ME.kind === 'staff') return viewStaff();
  app().innerHTML = '<div class="card center"><div class="big">🙇</div>このページは、fit kids の保護者さまと PE スタッフ用です。<div class="muted" style="margin-top:6px">今は別のアカウント（生徒など）でログインしています。</div><div class="row" style="justify-content:center;margin-top:14px"><a class="btn ghost" href="app.html">fitアプリへ</a><button class="btn" onclick="doLogout()">ログアウトして入り直す</button></div></div>';
}
function doLogout() { fitLogout(); ME = null; route(); }

  $('#lg-signup').onclick = viewSignup;

async function doLogin() {
  const id = ($('#lg-id').value || '').trim(), pw = ($('#lg-pw').value || '').trim();
  if (!id || !pw) return showMsg('lg-msg', 'メールアドレスとパスワードを入れてください');
  const btn = $('#lg-go'); busy(btn, true, 'ログイン中…');
  const kind = id.indexOf('@') >= 0 ? 'parent' : 'staff';
  const j = await fitLogin(kind, kind === 'parent' ? id.toLowerCase() : id, pw);
  busy(btn, false);
  if (!j.ok) return showMsg('lg-msg', fitLoginErrorText(j, (kind === 'parent' ? 'メールアドレス' : 'ID') + 'かパスワードがちがいます'));
  ME = { kind: j.kind, row: j.account };
  route();
}

  let n = 1;
  app().innerHTML =
    '<div class="card"><h2>登録の申請</h2><div class="muted">fit kids のスタッフが確認したあと、ログイン情報をメールでお送りします。</div>' +
    '<label class="lbl" for="su-name">保護者のお名前</label><input class="in" id="su-name" autocomplete="name">' +
    '<label class="lbl" for="su-mail">メールアドレス</label><input class="in" id="su-mail" type="email" autocomplete="email" autocapitalize="off">' +
    '<label class="lbl" for="su-mail2">メールアドレス（もう一度）</label><input class="in" id="su-mail2" type="email" autocomplete="off" autocapitalize="off">' +
    '<div id="su-kids">' + kidFields(0) + '</div>' +
    '<div style="margin-top:8px"><button class="btn ghost sm" id="su-more">＋ きょうだいも入れる</button></div>' +
    '<label class="lbl" for="su-msg-in">スタッフへのひとこと（なくてもよい）</label><textarea class="in" id="su-msg-in" rows="2" maxlength="300"></textarea>' +
    '<div class="msg bad" id="su-msg" style="display:none"></div>' +
    '<button class="btn wide" id="su-go" style="margin-top:14px">申請する</button>' +
    '<div class="center" style="margin-top:6px"><button class="btn plain" id="su-back">ログインにもどる</button></div></div>';
  $('#su-back').onclick = () => viewLogin();
  $('#su-more').onclick = () => { if (n < 6) { $('#su-kids').insertAdjacentHTML('beforeend', kidFields(n)); n++; } };
  $('#su-go').onclick = async () => {
    const name = ($('#su-name').value || '').trim(), mail = ($('#su-mail').value || '').trim().toLowerCase(), mail2 = ($('#su-mail2').value || '').trim().toLowerCase();
    const kids = []; for (let i = 0; i < n; i++) { const k = readKid(i); if (k.name) kids.push(k); }
    if (!name) return showMsg('su-msg', '保護者のお名前を入れてください');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return showMsg('su-msg', 'メールアドレスを正しく入れてください');
    if (mail !== mail2) return showMsg('su-msg', 'メールアドレスが2回とも同じになっていません');
    if (!kids.length) return showMsg('su-msg', 'お子さまの名前を入れてください');
    const b = $('#su-go'); busy(b, true, '送っています…');
    try {
      await rpc('pe_signup', { p: { parent_name: name, email: mail, children: kids, message: ($('#su-msg-in').value || '').trim() || null } });
      app().innerHTML = '<div class="card center"><div class="big">✅</div><b>申請を受け付けました</b><div class="muted" style="margin-top:6px">スタッフが確認したあと、<b>' + esc(mail) + '</b> にログイン情報をお送りします。少しお待ちください。</div><button class="btn wide" style="margin-top:14px" id="su-ok">とじる</button></div>';
      $('#su-ok').onclick = () => viewLogin(mail);

  };
}

      '<label class="lbl" for="fg-code">メールに届いた6桁の確認コード</label><input class="in" id="fg-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">' +

  $('#fg-back').onclick = () => viewLogin(($('#fg-mail').value || '').trim());
  $('#fg-send').onclick = async () => {
    const m = ($('#fg-mail').value || '').trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return showMsg('fg-msg', 'メールアドレスを入れてください');
    const b = $('#fg-send'); busy(b, true, '送っています…');
    const j = await pwCall('forgot', { email: m });

    showMsg('fg-msg', '登録のあるメールアドレスなら、確認コードを送りました。届いた6桁を下に入れてください（15分で使えなくなります）。', 'good');
    $('#fg-step2').style.display = 'block'; b.textContent = 'もう一度送る';
  };
  $('#fg-reset').onclick = async () => {
    const m = ($('#fg-mail').value || '').trim().toLowerCase(), c = ($('#fg-code').value || '').replace(/\D/g, ''), n = $('#fg-new').value, n2 = $('#fg-new2').value;
    if (c.length !== 6) return showMsg('fg-msg2', '6桁の確認コードを入れてください');

// ---------- 保護者の画面（kd3：予約・確定した日程・変更・キャンセル） ----------
const KD_KINDS = ['運動全般', 'かけっこ', '水泳', '鉄棒', '自転車'];
const KD_KIND_ICON = { '運動全般': '🤸', 'かけっこ': '🏃', '水泳': '🏊', '鉄棒': '🏋️', '自転車': '🚲' };
const KD_WD = ['日', '月', '火', '水', '木', '金', '土'];
function todayJST() { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' }); }
function addDays(d, n) { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }
function wdOf(d) { return new Date(d + 'T00:00:00Z').getUTCDay(); }
function dateLabel(d) { return Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)) + '（' + KD_WD[wdOf(d)] + '）'; }
function timeLabel(t) { const h = Number(String(t).slice(0, 2)), m = String(t).slice(3, 5); return h + ':' + m + '〜' + (h + 1) + ':' + m; }
// 変更・キャンセルの締め切り（前の日の18時・日本時間）を過ぎていないか。最後はサーバーが決める
function beforeDeadline(slotDate) { return Date.now() < new Date(addDays(slotDate, -1) + 'T18:00:00+09:00').getTime(); }
async function rpc(name, args) {
  const r = await fetch(FIT_SB_URL + '/rest/v1/rpc/' + name, { method: 'POST', headers: KD_HDR, body: JSON.stringify(args || {}) });
  const tx = await r.text(); let j = null; try { j = tx ? JSON.parse(tx) : null; } catch (e) {}
  if (!r.ok) { const m = (j && j.message) || ''; throw new Error(m.indexOf('fit: ') === 0 ? m.slice(5) : ('うまくいきませんでした（' + r.status + '）' + (m ? ' ' + m.slice(0, 120) : ''))); }
  return j;
}
let P = { kids: [], places: {}, slots: {}, reqs: [] };
let W = null;   // 予約の途中：{ child, kind, picks:[枠ID], open:[], changeOf }
async function loadParent() {
  const month0 = todayJST().slice(0, 8) + '01';
  const [kids, places, slots, reqs] = await Promise.all([
    api('kids_children?parent_id=eq.' + encodeURIComponent(ME.row.id) + '&is_active=eq.true&select=id,name,grade,school&order=created_at'),
    api('pe_places?select=id,name,meet_at,parent_note,kinds'),
    api('pe_slots?slot_date=gte.' + month0 + '&select=id,slot_date,start_time,place_id,capacity,status&order=slot_date,start_time'),
    api('pe_requests?parent_id=eq.' + encodeURIComponent(ME.row.id) + '&select=*&order=created_at.desc&limit=200')
  ]);
  P = { kids: kids || [], places: {}, slots: {}, reqs: reqs || [] };
  (places || []).forEach(p => { P.places[p.id] = p; });
  (slots || []).forEach(s => { P.slots[s.id] = s; });
}
const kidName = id => { const k = P.kids.find(x => x.id === id); return k ? k.name : 'お子さま'; };
// 保護者が出した希望の日時（{ d:'2026-11-20', t:'13:30' }）
function wishText(w) { return w ? dateLabel(w.d) + ' ' + timeLabel(w.t) : ''; }
// 申請のいちばん上の希望を、文にする（枠からえらんだ申請・希望の日時の申請のどちらでも）
function firstWishText(r) { return (r.wishes && r.wishes.length) ? wishText(r.wishes[0]) + '　（場所はスタッフが決めます）' : slotText(r.slot1_id); }
// 希望の日時でえらべる開始の時刻（PE スタッフの決まり：平日 13:00〜17:00／土日 16:00〜18:00・00分か30分）
function wishTimes(d) {
  if (!d) return [];
  const we = wdOf(d) === 0 || wdOf(d) === 6, from = we ? 16 : 13, to = we ? 18 : 17, out = [];
  for (let h = from; h <= to; h++) { out.push(String(h).padStart(2, '0') + ':00'); if (h < to) out.push(String(h).padStart(2, '0') + ':30'); }
  return out;
}
// 1か月先の日（月末は、次の月の月末まで）
function addMonth(d) {
  const y = Number(d.slice(0, 4)), m = Number(d.slice(5, 7)), day = Number(d.slice(8, 10));
  const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return new Date(Date.UTC(y, m, Math.min(day, last))).toISOString().slice(0, 10);
}
function slotText(id) { const s = P.slots[id]; if (!s) return '（前の日程）'; const p = P.places[s.place_id] || {}; return dateLabel(s.slot_date) + ' ' + timeLabel(s.start_time) + '　' + (p.name || ''); }
// その子の、その月の何回目か（確定している日程を、日にちの順に数える）
function lessonNo(req) {
  const s = P.slots[req.confirmed_slot_id]; if (!s) return '';
  const ym = s.slot_date.slice(0, 7);
  const same = P.reqs.filter(r => r.status === 'confirmed' && r.child_id === req.child_id && P.slots[r.confirmed_slot_id] && P.slots[r.confirmed_slot_id].slot_date.slice(0, 7) === ym)
    .sort((a, b) => (P.slots[a.confirmed_slot_id].slot_date + P.slots[a.confirmed_slot_id].start_time).localeCompare(P.slots[b.confirmed_slot_id].slot_date + P.slots[b.confirmed_slot_id].start_time));
  return Number(ym.slice(5, 7)) + '月 ' + (same.findIndex(r => r.id === req.id) + 1) + '回目';
}
async function viewParent() {
  app().innerHTML = '<div class="card center muted">読み込み中…</div>';
  try { await loadParent(); }
  catch (e) { app().innerHTML = '<div class="card"><div class="msg bad" style="display:block;margin-top:0">読み込めませんでした。時間をおいて、もう一度お試しください。</div><div class="row" style="margin-top:12px"><button class="btn" onclick="route()">もう一度</button><button class="btn ghost" onclick="doLogout()">ログアウト</button></div></div>'; return; }
  const t0 = todayJST();
  const conf = P.reqs.filter(r => r.status === 'confirmed' && P.slots[r.confirmed_slot_id] && P.slots[r.confirmed_slot_id].slot_date >= t0)
    .sort((a, b) => (P.slots[a.confirmed_slot_id].slot_date + P.slots[a.confirmed_slot_id].start_time).localeCompare(P.slots[b.confirmed_slot_id].slot_date + P.slots[b.confirmed_slot_id].start_time));
  const pend = P.reqs.filter(r => r.status === 'pending');
  const since = new Date(Date.now() - 14 * 86400000).toISOString();
  const news = P.reqs.filter(r => (r.status === 'rejected' || (r.status === 'cancelled' && r.reply)) && String(r.updated_at || '') >= since).slice(0, 5);
  const confHtml = conf.map(r => {
    const s = P.slots[r.confirmed_slot_id], p = P.places[s.place_id] || {}, can = beforeDeadline(s.slot_date), chg = pend.some(x => x.change_of === r.id);
    return '<div class="lesson"><div class="lesson-d">' + dateLabel(s.slot_date) + '<span>' + timeLabel(s.start_time) + '</span></div>' +
      '<div class="row" style="margin:6px 0"><b>' + esc(kidName(r.child_id)) + '</b><span class="chip">' + (KD_KIND_ICON[r.kind] || '') + ' ' + esc(r.kind) + '</span><span class="chip blue">' + lessonNo(r) + '</span></div>' +
      '<div>📍 <b>' + esc(p.name || '') + '</b></div>' + (p.meet_at ? '<div class="muted">集合：' + esc(p.meet_at) + '</div>' : '') + (p.parent_note ? '<div class="muted">' + esc(p.parent_note) + '</div>' : '') +
      (r.reply ? '<div class="msg info" style="display:block">スタッフより：' + esc(r.reply) + '</div>' : '') +
      (chg ? '<div class="msg info" style="display:block">日程の変更を申請しています（スタッフの返事を待っています）</div>' : '') +
      (can ? '<div class="row" style="margin-top:10px">' + (chg ? '' : '<button class="btn ghost sm" data-pact="change" data-rid="' + esc(r.id) + '">日程を変える</button>') + '<button class="btn ghost sm" data-pact="cancel" data-rid="' + esc(r.id) + '">キャンセル</button></div>'
           : '<div class="muted" style="margin-top:8px">変更・キャンセルは前の日の18時までです。お急ぎのときは、fit kids の公式LINE でご連絡ください。</div>') + '</div>';
  }).join('');
  const pendHtml = pend.map(r =>
    '<div class="fam"><div class="row"><b>' + esc(kidName(r.child_id)) + '</b><span class="chip">' + (KD_KIND_ICON[r.kind] || '') + ' ' + esc(r.kind) + '</span>' + (r.change_of ? '<span class="chip blue">日程の変更</span>' : '') + '</div>' +
    ((r.wishes && r.wishes.length)
      ? r.wishes.map((w, i) => '<div class="muted" style="color:var(--ink)">第' + (i + 1) + '希望：' + esc(wishText(w)) + '</div>').join('') + '<div class="muted">場所は、スタッフが決めてお知らせします</div>'
      : [r.slot1_id, r.slot2_id, r.slot3_id].map((id, i) => id ? '<div class="muted" style="color:var(--ink)">第' + (i + 1) + '希望：' + esc(slotText(id)) + '</div>' : '').join('')) +

  const newsHtml = news.map(r => '<div class="fam"><div class="row"><b>' + esc(kidName(r.child_id)) + '</b><span class="chip">' + esc(r.kind) + '</span><span class="muted">' + (r.status === 'rejected' ? '今回は日程が合いませんでした' : 'この日程はなくなりました') + '</span></div>' +
    '<div class="muted" style="color:var(--ink)">' + esc(r.confirmed_slot_id ? slotText(r.confirmed_slot_id) : firstWishText(r)) + '</div>' + (r.reply ? '<div class="msg info" style="display:block">スタッフより：' + esc(r.reply) + '</div>' : '') + '</div>').join('');
  app().innerHTML =
    (P.kids.length
      ? '<button class="btn sun wide big-btn" id="p-new">＋ レッスンを予約する</button>'
      : '<div class="card center"><div class="big">🙇</div>お子さまの登録がまだありません。<div class="muted">fit kids のスタッフまでお問い合わせください。</div></div>') +
    '<h2 class="sec">📅 確定したレッスン</h2>' + (confHtml || '<div class="card center muted">これからのレッスンは、まだありません。</div>') +
    (pendHtml ? '<h2 class="sec">⏳ 確認中の申請</h2>' + pendHtml : '') +
    (newsHtml ? '<h2 class="sec">📣 お知らせ</h2>' + newsHtml : '') +
    '<div class="row" style="justify-content:center;margin-top:18px"><button class="btn plain" onclick="openChangePw()">🔑 パスワードを変える</button><button class="btn plain" onclick="doLogout()">ログアウト</button></div>';
  const nb = $('#p-new'); if (nb) nb.onclick = () => startBooking(null);
  app().querySelectorAll('[data-pact]').forEach(b => b.onclick = () => parentAct(b.dataset.pact, b.dataset.rid));
}
function parentAct(act, rid) {
  const r = P.reqs.find(x => x.id === rid); if (!r) return;
  if (act === 'change') return startBooking(r);
  const conf = r.status === 'confirmed';
  openOv('<div class="modal-h"><b>' + (conf ? 'このレッスンをキャンセルしますか？' : 'この申請を取り消しますか？') + '</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' +
    '<div><b>' + esc(kidName(r.child_id)) + '</b>　' + esc(r.kind) + '</div><div>' + esc(conf ? slotText(r.confirmed_slot_id) : firstWishText(r)) + '</div>' +
    '<div class="msg bad" id="pc-msg" style="display:none"></div><div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeOv()">やめる</button><button class="btn" id="pc-go">' + (conf ? 'キャンセルする' : '取り消す') + '</button></div>');
  $('#pc-go').onclick = async () => {
    const b = $('#pc-go'); busy(b, true);
    try { await rpc('pe_request_cancel', { p_id: rid }); closeOv(); await viewParent(); }
    catch (e) { busy(b, false); showMsg('pc-msg', e.message); }
  };
}
// ----- 予約：子ども → 種類 → 枠（第1〜第3希望）→ 申請 -----
function startBooking(changeReq) {
  W = { child: changeReq ? changeReq.child_id : (P.kids.length === 1 ? P.kids[0].id : null), kind: changeReq ? changeReq.kind : null, picks: [], open: [], changeOf: changeReq ? changeReq.id : null };
  if (!W.child) return bookChild();
  if (!W.kind) return bookKind();
  bookSlots();
}
function bookHead(title, step) {
  return '<div class="modal-h"><b>' + title + '</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' + (W.changeOf ? '<div class="msg info" style="display:block;margin-top:0">日程の変更の申請です。新しい日程が決まるまで、今の日程はそのままです。</div>' : '') +
    '<div class="steps" aria-hidden="true">' + [1, 2, 3].map(i => '<span class="' + (i <= step ? 'on' : '') + '"></span>').join('') + '</div>';
}
function bookChild() {
  openOv(bookHead('どのお子さまのレッスンですか？', 1) + P.kids.map(k => '<button class="pick" data-c="' + esc(k.id) + '"><b>' + esc(k.name) + '</b>' + (k.grade ? '<span class="chip">' + esc(k.grade) + '</span>' : '') + '</button>').join(''));
  $('#ov').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { W.child = b.dataset.c; bookKind(); });
}
function bookKind() {
  openOv(bookHead('レッスンの種類をえらんでください', 2) + '<div class="muted">' + esc(kidName(W.child)) + ' さん</div>' +
    '<div class="kinds">' + KD_KINDS.map(k => '<button class="pick kind" data-k="' + esc(k) + '"><span class="big" aria-hidden="true">' + KD_KIND_ICON[k] + '</span><b>' + esc(k) + '</b></button>').join('') + '</div>' +
    (P.kids.length > 1 && !W.changeOf ? '<button class="btn plain" id="bk-back">‹ お子さまをえらび直す</button>' : ''));
  $('#ov').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { W.kind = b.dataset.k; W.picks = []; bookSlots(); });
  const bb = $('#bk-back'); if (bb) bb.onclick = bookChild;
}
async function bookSlots() {
  openOv(bookHead('希望の日時をえらんでください', 3) + '<div class="center muted" style="padding:20px 0">空いている枠をさがしています…</div>');
  try { W.open = await rpc('pe_open_slots', { p_kind: W.kind }) || []; }
  catch (e) { openOv(bookHead('希望の日時をえらんでください', 3) + '<div class="msg bad" style="display:block">' + esc(e.message) + '</div><button class="btn wide" style="margin-top:12px" onclick="closeOv()">とじる</button>'); return; }
  // 変更のときは、今の日程と同じ枠は出さない
  if (W.changeOf) { const cur = (P.reqs.find(r => r.id === W.changeOf) || {}).confirmed_slot_id; W.open = W.open.filter(s => s.id !== cur); }
  drawSlots();
}
function drawSlots() {
  const days = {}; W.open.forEach(s => { (days[s.slot_date] || (days[s.slot_date] = [])).push(s); });
  const list = Object.keys(days).sort().map(d => '<div class="day"><div class="day-h">' + dateLabel(d) + '</div>' + days[d].map(s => {
    const i = W.picks.indexOf(s.id);
    return '<button class="pick slot' + (i >= 0 ? ' on' : '') + '" data-s="' + esc(s.id) + '" aria-pressed="' + (i >= 0) + '"><span class="rank">' + (i >= 0 ? '第' + (i + 1) + '希望' : 'えらぶ') + '</span><span style="flex:1;min-width:0;text-align:left"><b>' + timeLabel(s.start_time) + '</b><br><span class="muted">' + esc(s.place) + (s.taken ? '・あと' + (s.capacity - s.taken) + '人' : '') + '</span></span></button>';
  }).join('') + '</div>').join('');
  const back = '<div class="card center" style="margin-top:14px;background:var(--sky);border-color:var(--sky)"><b>' + (W.open.length ? '合う日時がないときは' : '希望の日時を、スタッフに伝えられます') + '</b><div class="muted" style="margin:4px 0 10px">ご希望の日時を3つまで出せます。場所はスタッフが決めます。</div><button class="btn ghost" id="bk-wish">✏️ 希望の日時を伝える</button></div>' +
    (W.changeOf ? '' : '<button class="btn plain" id="bk-back">‹ 種類をえらび直す</button>');
  openOv(bookHead('希望の日時をえらんでください', 3) +
    '<div class="row"><b>' + esc(kidName(W.child)) + '</b><span class="chip">' + KD_KIND_ICON[W.kind] + ' ' + esc(W.kind) + '</span></div>' +
    (W.open.length
      ? '<div class="muted" style="margin:6px 0">押した順に、第1〜第3希望になります（1つだけでも申請できます）。もう一度押すと外れます。</div>' + list +
        '<label class="lbl" for="bk-msg-in">スタッフへのひとこと（なくてもよい）</label><textarea class="in" id="bk-msg-in" rows="2" maxlength="300">' + esc(W.msg || '') + '</textarea>' +
        '<div class="msg bad" id="bk-msg" style="display:none"></div><button class="btn wide" id="bk-go" style="margin-top:12px"' + (W.picks.length ? '' : ' disabled') + '>' + (W.picks.length ? W.picks.length + 'つの希望で申請する' : '日時をえらんでください') + '</button>'
      : '<div class="card center" style="margin-top:12px"><div class="big">🗓</div>今、申請できる枠がありません。<div class="muted">申請は3日前まで・1か月先までです。ほかの種類もお試しください。</div></div>') + back);
  const bb = $('#bk-back'); if (bb) bb.onclick = bookKind;
  $('#bk-wish').onclick = () => { const t = $('#bk-msg-in'); if (t) W.msg = t.value; bookWish(); };
  const keep = () => { const t = $('#bk-msg-in'); if (t) W.msg = t.value; };
  $('#ov').querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    keep(); const id = b.dataset.s, i = W.picks.indexOf(id);
    if (i >= 0) W.picks.splice(i, 1); else if (W.picks.length < 3) W.picks.push(id); else { drawSlots(); return showMsg('bk-msg', '希望は3つまでです。外したい枠をもう一度押してください'); }
    drawSlots();
  });
  const go = $('#bk-go'); if (go) go.onclick = async () => {
    keep(); busy(go, true, '申請しています…');
    try {
      await rpc('pe_request_create', { p_child: W.child, p_kind: W.kind, p_slot1: W.picks[0], p_slot2: W.picks[1] || null, p_slot3: W.picks[2] || null, p_message: W.msg || null, p_change_of: W.changeOf });
      W = null;
      openOv('<div class="center"><div class="big">✅</div><b>申請しました</b><div class="muted" style="margin-top:6px">スタッフが確認して、日程を決めます。決まったら、このページの「確定したレッスン」に出ます。</div><button class="btn wide" style="margin-top:14px" id="bk-ok">とじる</button></div>');
      $('#bk-ok').onclick = () => { closeOv(); viewParent(); };
    } catch (e) { busy(go, false); showMsg('bk-msg', e.message); if (/うまった|締め切/.test(e.message)) { W.picks = []; try { W.open = await rpc('pe_open_slots', { p_kind: W.kind }) || []; } catch (e2) {} } }
  };
}

// ----- 予約：希望の日時を伝える（第1〜第3希望。開始は00分か30分。場所はスタッフが決める）-----
function bookWish() {
  const t0 = todayJST(), min = addDays(t0, 2), max = addMonth(t0);
  W.wish = W.wish || [{ d: '', t: '' }, { d: '', t: '' }, { d: '', t: '' }];
  const row = i => '<div class="kidrow"><div class="lbl" style="margin-top:0">第' + (i + 1) + '希望' + (i ? '（なくてもよい）' : '') + '</div><div class="two">' +
    '<div><label class="muted" for="bw-d-' + i + '">日にち</label><input class="in" type="date" id="bw-d-' + i + '" min="' + min + '" max="' + max + '" value="' + esc(W.wish[i].d) + '"></div>' +
    '<div><label class="muted" for="bw-t-' + i + '">開始の時刻</label><select class="in" id="bw-t-' + i + '"></select></div></div><div class="muted" id="bw-n-' + i + '"></div></div>';
  openOv(bookHead('希望の日時を教えてください', 3) +
    '<div class="row"><b>' + esc(kidName(W.child)) + '</b><span class="chip">' + KD_KIND_ICON[W.kind] + ' ' + esc(W.kind) + '</span></div>' +
    '<div class="muted" style="margin:6px 0">' + dateLabel(min) + ' 〜 ' + dateLabel(max) + ' の日でえらべます（2日前まで）。レッスンは60分です。開始は、平日 13:00〜17:00・土日 16:00〜18:00 の、00分か30分です。</div>' +
    row(0) + row(1) + row(2) +
    '<label class="lbl" for="bk-msg-in">スタッフへのひとこと（なくてもよい）</label><textarea class="in" id="bk-msg-in" rows="2" maxlength="300">' + esc(W.msg || '') + '</textarea>' +
    '<div class="msg bad" id="bk-msg" style="display:none"></div><button class="btn wide" id="bw-go" style="margin-top:12px">この希望で申請する</button>' +
    '<button class="btn plain" id="bw-back">‹ 空いている枠からえらぶ</button>');
  const fill = i => {
    const d = $('#bw-d-' + i).value, sel = $('#bw-t-' + i), ts = wishTimes(d), cur = W.wish[i].t;
    sel.innerHTML = d ? '<option value="">えらぶ</option>' + ts.map(t => '<option value="' + t + '"' + (t === cur ? ' selected' : '') + '>' + timeLabel(t) + '</option>').join('') : '<option value="">先に日にちを</option>';
    sel.disabled = !d;
    $('#bw-n-' + i).textContent = d ? dateLabel(d) + (wdOf(d) === 0 || wdOf(d) === 6 ? '・土日は 16:00〜18:00 から' : '・平日は 13:00〜17:00 から') : '';
  };
  const read = () => { for (let i = 0; i < 3; i++) W.wish[i] = { d: $('#bw-d-' + i).value, t: $('#bw-t-' + i).value }; W.msg = $('#bk-msg-in').value; };
  for (let i = 0; i < 3; i++) { fill(i); $('#bw-d-' + i).onchange = () => { W.wish[i].t = ''; fill(i); showMsg('bk-msg', ''); }; $('#bw-t-' + i).onchange = () => showMsg('bk-msg', ''); }
  $('#bw-back').onclick = () => { read(); drawSlots(); };
  $('#bw-go').onclick = async () => {
    read();
    const list = [];
    for (let i = 0; i < 3; i++) {
      const w = W.wish[i];
      if (!w.d && !w.t) continue;
      if (!w.d || !w.t) return showMsg('bk-msg', '第' + (i + 1) + '希望の、日にちと時刻の両方をえらんでください');
      if (w.d < min || w.d > max) return showMsg('bk-msg', '第' + (i + 1) + '希望は、' + dateLabel(min) + ' 〜 ' + dateLabel(max) + ' の日にしてください');
      if (list.some(x => x.d === w.d && x.t === w.t)) return showMsg('bk-msg', '同じ日時が2回入っています');
      list.push({ d: w.d, t: w.t });
    }
    if (!W.wish[0].d) return showMsg('bk-msg', '第1希望を入れてください');
    const go = $('#bw-go'); busy(go, true, '申請しています…');
    try {
      await rpc('pe_request_wish', { p_child: W.child, p_kind: W.kind, p_wishes: list, p_message: W.msg || null, p_change_of: W.changeOf });
      W = null;
      openOv('<div class="center"><div class="big">✅</div><b>申請しました</b><div class="muted" style="margin-top:6px">スタッフが確認して、日時と場所を決めます。決まったら、このページの「確定したレッスン」に出ます。</div><button class="btn wide" style="margin-top:14px" id="bk-ok">とじる</button></div>');
      $('#bk-ok').onclick = () => { closeOv(); viewParent(); };
    } catch (e) { busy(go, false); showMsg('bk-msg', e.message); }
  };
}

// ---------- スタッフの画面 ----------
async function loadPerm() {
  const r = ME.row || {};
  let manager = r.role === 'admin' || KD_MANAGERS.indexOf(String(r.staff_id || '').toLowerCase()) >= 0;
  if (!manager) {
    try { const p = await api('staff_permissions?staff_id=eq.' + encodeURIComponent(r.staff_id) + '&select=is_manager'); manager = !!(p && p[0] && p[0].is_manager); } catch (e) {}
  }
  let mine = null;
  try { const p = await api('pe_staff?staff_uuid=eq.' + encodeURIComponent(r.id) + '&select=*'); mine = p && p[0]; } catch (e) { PERM = { manager: manager, slots: manager, register: manager, err: e.message }; return; }
  PERM = { manager: manager, slots: manager || !!(mine && mine.can_slots), register: manager || !!(mine && mine.can_register) };
}
async function viewStaff() {
  app().innerHTML = '<div class="card center muted">読み込み中…</div>';
  await loadPerm();
  if (PERM.err) { app().innerHTML = '<div class="card"><div class="msg bad" style="display:block;margin-top:0">PE の表を読めませんでした（SQL kids1 がまだかもしれません）。</div><div class="muted" style="margin-top:8px;word-break:break-all">' + esc(PERM.err) + '</div><div class="row" style="margin-top:12px"><button class="btn" onclick="route()">もう一度</button><a class="btn ghost" href="app.html">fitアプリへ</a></div></div>'; return; }
  if (!PERM.manager && !PERM.slots && !PERM.register) {
    app().innerHTML = '<div class="card center"><div class="big">🔒</div><b>PE の画面を使う設定が、まだありません</b><div class="muted" style="margin-top:6px">責任者（石田など）に「PE スタッフ」の設定を頼んでください。</div><div class="row" style="justify-content:center;margin-top:14px"><a class="btn ghost" href="app.html">fitアプリへ</a><button class="btn plain" onclick="doLogout()">ログアウト</button></div></div>';
    return;
  }
  if (TAB === 'fam' && !PERM.register) TAB = PERM.manager ? 'stf' : 'slot';
  renderStaff();
}
function renderStaff() {
  const tabs = [];
  if (PERM.register) tabs.push(['fam', '👪 家庭の登録']);
  if (PERM.slots) tabs.push(['slot', '🗓 枠と申請']);
  if (PERM.manager) tabs.push(['stf', '⚙ PE スタッフ']);
  app().innerHTML = '<div class="tabs">' + tabs.map(t => '<button class="tab' + (TAB === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') + '</div><div id="pane"><div class="card center muted">読み込み中…</div></div>' +
    '<div class="row" style="justify-content:center;margin-top:8px"><a class="btn plain" href="app.html">fitアプリへ</a><button class="btn plain" onclick="doLogout()">ログアウト</button></div>';
  app().querySelectorAll('.tab').forEach(b => b.onclick = () => { TAB = b.dataset.tab; renderStaff(); });
  if (TAB === 'fam') paneFam(); else if (TAB === 'stf') paneStf(); else paneSlot();
}

// ----- 家庭の登録 -----
async function loadFam() {
  const kids = await api('kids_children?select=*&order=created_at') || [];
  const pids = [...new Set(kids.map(k => k.parent_id))];
  let parents = [];
  if (pids.length) parents = await api('parent_accounts?id=in.(' + pids.join(',') + ')&select=id,name,login_id,is_active,last_login,created_at') || [];
  const byId = {}; parents.forEach(p => { byId[p.id] = { parent: p, kids: [] }; });
  kids.forEach(k => { if (byId[k.parent_id]) byId[k.parent_id].kids.push(k); });
  FAM = Object.values(byId).sort((a, b) => String(b.parent.created_at || '').localeCompare(String(a.parent.created_at || '')));
}
async function paneFam() {
  const pane = $('#pane');

  const nKids = FAM.reduce((n, f) => n + f.kids.filter(k => k.is_active).length, 0);

    (SIGNUPS.length ? '<h2 class="sec">📝 登録の申請（' + SIGNUPS.length + '件）</h2>' + SIGNUPS.map(signupHtml).join('') + '<h2 class="sec">登録ずみの家庭</h2>' : '') +
    (FAM.length ? FAM.map(famHtml).join('') : '<div class="card center muted">まだ登録がありません。「＋ 家庭を登録」から入れてください。</div>');

async function makeFamily(name, mail, kids, send) {
  const dup = await api('parent_accounts?login_id=eq.' + encodeURIComponent(mail) + '&select=id,name,is_active') || [];

  if (!parent) {
    // 最初のパスワードは、このあとサーバーがランダムに作る。ここでは、だれにも分からない値を入れておく
    const junk = 'pw-' + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
    const made = await apiPost('parent_accounts', { login_id: mail, pin: junk, name: name, is_active: true });
    parent = Array.isArray(made) ? made[0] : made; isNew = true;
    if (!parent || !parent.id) throw new Error('保護者を登録できませんでした');

  await apiPost('kids_children', kids.map(k => ({ parent_id: parent.id, created_by: ME.row.id, name: k.name, kana: k.kana || null, grade: k.grade || null, school: k.school || null })));

}

let PLACES = [], SLOTS = [], REQS = [];
// 開始時刻の目安（PE スタッフの答え：平日 13〜17時／土日 16〜18時）。ほかの時刻もえらべる
function usualHours(d) { const w = wdOf(d); return (w === 0 || w === 6) ? [16, 17, 18] : [13, 14, 15, 16, 17]; }
let SKIDS = {}, SPAR = {};   // スタッフ用：子ども・保護者の名前
async function loadSlots() {
  const t0 = todayJST();
  PLACES = await api('pe_places?select=*&order=sort_no,name') || [];
  SLOTS = await api('pe_slots?slot_date=gte.' + t0 + '&select=*&order=slot_date,start_time') || [];

}
function slotUse(id) {

}
const sSlot = id => SLOTS.find(s => s.id === id);

  const reply = '<label class="lbl" for="rq-reply">保護者へのひとこと（なくてもよい）</label><textarea class="in" id="rq-reply" rows="2" maxlength="300"></textarea>';
  const foot = (label) => '<div class="msg bad" id="rq-msg" style="display:none"></div><div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeOv()">やめる</button><button class="btn" id="rq-go">' + label + '</button></div>';
  const run = (fn) => { $('#rq-go').onclick = async () => { const b = $('#rq-go'); busy(b, true); try { await fn(($('#rq-reply') || {}).value || null); closeOv(); await paneSlot(); } catch (e) { busy(b, false); showMsg('rq-msg', e.message); } }; };
  if (act === 'ok') {
    openOv('<div class="modal-h"><b>この日程で確定しますか？</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' + who + '<div class="pw" style="font-size:18px;letter-spacing:0;margin-top:8px">' + esc(sSlotText(sid)) + '</div>' + reply + foot('確定する'));
    return run(rep => rpc('pe_decide', { p_id: rid, p_slot: sid, p_reply: rep }));
  }
  if (act === 'ng') {
    openOv('<div class="modal-h"><b>今回はむずかしい、と返しますか？</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' + who + '<div class="muted" style="margin-top:6px">保護者の画面に「今回は日程が合いませんでした」と出ます。ほかの日をすすめるときは、ひとことに書いてください。</div>' + reply + foot('返す'));
    return run(rep => rpc('pe_decide', { p_id: rid, p_slot: null, p_reply: rep }));
  }
  if (act === 'wish') {
    const w = (r.wishes || [])[Number(no) - 1]; if (!w) return;
    const places = PLACES.filter(p => p.is_active && (p.kinds || []).indexOf(r.kind) >= 0);
    if (!places.length) return alertBox('「' + r.kind + '」ができる場所が、場所のリストにありません');
    const same = SLOTS.filter(s => s.slot_date === w.d && s.status !== 'cancelled');
    openOv('<div class="modal-h"><b>場所をえらんで確定します</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' + who +
      '<div class="pw" style="font-size:18px;letter-spacing:0;margin-top:8px">' + esc(wishText(w)) + '</div>' +
      '<label class="lbl" for="rq-place">場所</label><select class="in" id="rq-place">' + places.map(p => '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>').join('') + '</select>' +
      '<div class="muted" style="margin-top:6px">この日時・場所の枠がなければ作ります（定員2人。あと1人分は、ほかの家庭にも出ます）。あれば、そこに入れます。</div>' +
      (same.length ? '<div class="msg info" style="display:block">この日の、ほかの枠：' + same.map(s => '<br>' + esc(timeLabel(s.start_time) + '　' + (sPlace(s.place_id).name || '') + '（確定 ' + slotUse(s.id).conf + '/' + s.capacity + '人）')).join('') + '</div>' : '') +
      reply + foot('確定する'));
    return run(rep => rpc('pe_decide_wish', { p_id: rid, p_no: Number(no), p_place: $('#rq-place').value, p_reply: rep }));
  }
  if (act === 'move') {
    const cur = r.confirmed_slot_id;
    const opts = SLOTS.filter(s => s.id !== cur && s.status !== 'cancelled' && slotUse(s.id).conf < s.capacity && (sPlace(s.place_id).kinds || []).indexOf(r.kind) >= 0);
    openOv('<div class="modal-h"><b>日程を動かす・中止する</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' + who + '<div class="muted">今の日程：' + esc(sSlotText(cur)) + '</div>' +
      '<label class="lbl" for="rq-to">どうしますか</label><select class="in" id="rq-to"><option value="">このレッスンを中止する</option>' + opts.map(s => '<option value="' + esc(s.id) + '">動かす → ' + esc(sSlotText(s.id)) + '</option>').join('') + '</select>' +
      '<div class="muted" style="margin-top:6px">雨の日などに使います。保護者には LINE でも連絡してください（アプリからの通知は、まだありません）。</div>' + reply + foot('決める'));
    return run(rep => rpc('pe_staff_move', { p_id: rid, p_slot: $('#rq-to').value || null, p_reply: rep }));
  }
}
async function slotAct(act, sid, btn) {
  const sl = SLOTS.find(x => x.id === sid); if (!sl) return;
  if (act === 'del') {
    openOv('<div class="modal-h"><b>この枠を消しますか？</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div><div>' + dateLabel(sl.slot_date) + ' ' + timeLabel(sl.start_time) + '</div><div class="muted" style="margin-top:6px">まだだれも申請していない枠です。消すと元にもどせません。</div><div class="msg bad" id="sd-msg" style="display:none"></div><div class="row" style="margin-top:14px"><button class="btn ghost" onclick="closeOv()">やめる</button><button class="btn" id="sd-go">消す</button></div>');
    $('#sd-go').onclick = async () => {
      const b = $('#sd-go'); busy(b, true);
      try {
        // 消す直前に、申請が入っていないかをもう一度見る
        const q = 'or=(slot1_id.eq.' + sid + ',slot2_id.eq.' + sid + ',slot3_id.eq.' + sid + ',confirmed_slot_id.eq.' + sid + ')&select=id&limit=1';
        const used = await api('pe_requests?' + q) || [];
        if (used.length) { busy(b, false); return showMsg('sd-msg', 'この枠には申請が入りました。消さずに「止める」を使ってください'); }
        await api('pe_slots?id=eq.' + encodeURIComponent(sid), { method: 'DELETE' });
        closeOv(); await paneSlot();
      } catch (e) { busy(b, false); showMsg('sd-msg', '消せませんでした：' + e.message); }
    };
    return;
  }
  busy(btn, true, '…');
  try { await apiPatch('pe_slots', 'id=eq.' + encodeURIComponent(sid), { status: act === 'stop' ? 'closed' : 'open' }); await paneSlot(); }
  catch (e) { busy(btn, false); alertBox('変えられませんでした：' + e.message); }
}
function alertBox(text) { openOv('<div class="center"><div class="big">⚠️</div><div>' + esc(text) + '</div><button class="btn wide" style="margin-top:14px" onclick="closeOv()">とじる</button></div>'); }
function openSlotForm() {
  const act = PLACES.filter(p => p.is_active);
  if (!act.length) return alertBox('先に「📍 場所のリスト」で、場所を入れてください');
  const t0 = todayJST();
  openOv('<div class="modal-h"><b>＋ 枠を登録</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' +
    '<label class="lbl" for="sf-date">日にち</label><input class="in" id="sf-date" type="date" min="' + t0 + '" value="' + addDays(t0, 3) + '">' +
    '<div class="muted" id="sf-daynote"></div>' +
    '<label class="lbl" for="sf-place">場所</label><select class="in" id="sf-place">' + act.map(p => '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>').join('') + '</select>' +
    '<div class="muted" id="sf-kinds" style="margin-top:6px"></div>' +
    '<div class="lbl">開始の時刻（いくつでもえらべます・1枠60分）</div><div class="row" id="sf-hours"></div>' +
    '<label class="lbl" for="sf-min">何分から</label><select class="in" id="sf-min"><option value="00">00分から（例 16:00〜17:00）</option><option value="30">30分から（例 16:30〜17:30）</option></select>' +
    '<label class="lbl" for="sf-cap">1枠の人数</label><select class="in" id="sf-cap"><option>1</option><option selected>2</option></select>' +
    '<div class="msg bad" id="sf-msg" style="display:none"></div><button class="btn wide" id="sf-go" style="margin-top:14px">登録する</button>');
  const picked = new Set();
  const drawHours = () => {
    const d = $('#sf-date').value; if (!d) { $('#sf-hours').innerHTML = ''; return; }
    const us = usualHours(d), all = []; for (let h = 9; h <= 19; h++) all.push(h);
    $('#sf-daynote').textContent = dateLabel(d) + '・よく使う時刻は ' + us.map(h => h + '時').join('・') + (d < addDays(todayJST(), 3) ? '（保護者の申請は3日前までなので、この日は申請できません）' : '');
    $('#sf-hours').innerHTML = all.map(h => '<button type="button" class="tab' + (picked.has(h) ? ' on' : '') + '" data-h="' + h + '" style="' + (us.indexOf(h) < 0 ? 'opacity:.55' : '') + '" aria-pressed="' + picked.has(h) + '">' + h + ':00</button>').join('');
    $('#sf-hours').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { const h = Number(b.dataset.h); if (picked.has(h)) picked.delete(h); else picked.add(h); showMsg('sf-msg', ''); drawHours(); });
  };
  const drawKinds = () => { const p = PLACES.find(x => x.id === $('#sf-place').value) || {}; $('#sf-kinds').innerHTML = 'できるレッスン：' + ((p.kinds || []).map(k => '<span class="chip">' + esc(k) + '</span>').join(' ') || 'なし') + (p.meet_at ? '<br>集合：' + esc(p.meet_at) : ''); };
  $('#sf-date').onchange = () => { picked.clear(); drawHours(); };
  $('#sf-place').onchange = drawKinds;
  drawHours(); drawKinds();
  $('#sf-go').onclick = async () => {
    const d = $('#sf-date').value, pid = $('#sf-place').value, cap = Number($('#sf-cap').value);
    if (!d || d < todayJST()) return showMsg('sf-msg', '今日からあとの日にちをえらんでください');
    if (!picked.size) return showMsg('sf-msg', '開始の時刻をえらんでください');
    const btn = $('#sf-go'); busy(btn, true, '登録しています…');
    try {
      const have = await api('pe_slots?slot_date=eq.' + d + '&place_id=eq.' + encodeURIComponent(pid) + '&select=start_time') || [];
      const mm = $('#sf-min').value === '30' ? '30' : '00';
      const taken = new Set(have.map(x => String(x.start_time).slice(0, 5)));
      const add = [...picked].sort((a, b) => a - b).map(h => String(h).padStart(2, '0') + ':' + mm).filter(t => !taken.has(t));
      if (add.length) await apiPost('pe_slots', add.map(t => ({ slot_date: d, start_time: t, place_id: pid, capacity: cap, created_by: ME.row.id })));
      const skip = picked.size - add.length;
      closeOv(); await paneSlot();
      if (skip) alertBox(add.length + 'この枠を登録しました。同じ日・同じ時刻・同じ場所の枠が ' + skip + 'こ、もうあったので、それは足していません。');
    } catch (e) { busy(btn, false); showMsg('sf-msg', '登録できませんでした：' + e.message); }
  };
}
function openPlaces() {
  openOv('<div class="modal-h"><b>📍 場所のリスト</b><button class="x" onclick="closeOv()" aria-label="とじる">×</button></div>' +
    PLACES.map(p => '<div class="kid' + (p.is_active ? '' : ' off') + '"><div style="flex:1;min-width:0"><div class="kid-n">' + esc(p.name) + (p.is_active ? '' : '（使っていない）') + '</div><div class="muted">集合：' + esc(p.meet_at || '') + '</div><div>' + (p.kinds || []).map(k => '<span class="chip">' + esc(k) + '</span>').join(' ') + '</div></div><button class="btn ghost sm" data-pl="' + esc(p.id) + '">直す</button></div>').join('') +
    '<button class="btn ghost wide" id="pl-new" style="margin-top:12px">＋ 場所を足す</button>');
  $('#pl-new').onclick = () => openPlaceForm(null);
  $('#ov').querySelectorAll('[data-pl]').forEach(b => b.onclick = () => openPlaceForm(PLACES.find(p => p.id === b.dataset.pl)));
}
function openPlaceForm(p) {
  const v = p || { kinds: [], is_active: true };
  openOv('<div class="modal-h"><b>' + (p ? '場所を直す' : '＋ 場所を足す') + '</b><button class="x" id="pf-x" aria-label="もどる">×</button></div>' +
    '<label class="lbl" for="pf-name">場所の名前</label><input class="in" id="pf-name" value="' + esc(v.name || '') + '">' +
    '<label class="lbl" for="pf-meet">集合する場所</label><input class="in" id="pf-meet" value="' + esc(v.meet_at || '') + '">' +
    '<label class="lbl" for="pf-note">保護者に伝えること</label><textarea class="in" id="pf-note" rows="2">' + esc(v.parent_note || '') + '</textarea>' +
    '<div class="lbl">ここでするレッスン</div><div class="row">' + KD_KINDS.map(k => '<label class="row" style="gap:4px;min-height:36px"><input type="checkbox" data-kind="' + esc(k) + '"' + ((v.kinds || []).indexOf(k) >= 0 ? ' checked' : '') + ' style="width:20px;height:20px">' + esc(k) + '</label>').join('') + '</div>' +
    (p ? '<label class="row" style="margin-top:12px"><input type="checkbox" id="pf-active"' + (v.is_active ? ' checked' : '') + ' style="width:20px;height:20px"><span>この場所を使う（外すと、新しい枠でえらべなくなります）</span></label>' : '') +
    '<div class="msg bad" id="pf-msg" style="display:none"></div><button class="btn wide" id="pf-go" style="margin-top:14px">保存する</button>');
  $('#pf-x').onclick = openPlaces;
  $('#pf-go').onclick = async () => {
    const name = ($('#pf-name').value || '').trim(); if (!name) return showMsg('pf-msg', '場所の名前を入れてください');
    const kinds = [...$('#ov').querySelectorAll('[data-kind]')].filter(c => c.checked).map(c => c.dataset.kind);
    if (!kinds.length) return showMsg('pf-msg', 'ここでするレッスンを1つ以上えらんでください');
    const body = { name: name, meet_at: ($('#pf-meet').value || '').trim() || null, parent_note: ($('#pf-note').value || '').trim() || null, kinds: kinds };
    const btn = $('#pf-go'); busy(btn, true);
    try {
      if (p) await apiPatch('pe_places', 'id=eq.' + encodeURIComponent(p.id), Object.assign({ is_active: $('#pf-active').checked }, body));
      else await apiPost('pe_places', Object.assign({ sort_no: PLACES.length + 1 }, body));
      await paneSlot(); openPlaces();
    } catch (e) { busy(btn, false); showMsg('pf-msg', /23505|duplicate/.test(e.message) ? '同じ名前の場所が、もうあります' : '保存できませんでした：' + e.message); }
  };
}

// ----- PE スタッフ（責任者だけ）-----
async function paneStf() {
  const pane = $('#pane');
  try {
    STAFF = (await api('staff?select=id,staff_id,name,is_active&order=staff_id') || []).filter(s => s.is_active !== false);
    PESTAFF = {}; (await api('pe_staff?select=*') || []).forEach(r => { PESTAFF[r.staff_uuid] = r; });
  } catch (e) { pane.innerHTML = '<div class="card"><div class="msg bad" style="display:block;margin-top:0">読み込めませんでした</div><div class="muted" style="word-break:break-all;margin-top:6px">' + esc(e.message) + '</div></div>'; return; }
  const row = s => { const r = PESTAFF[s.id] || {}; return '<div class="stf"><div class="stf-n">' + esc(s.name || '') + ' <span class="muted">' + esc(s.staff_id || '') + '</span></div><label><input type="checkbox" data-su="' + esc(s.id) + '" data-col="can_slots"' + (r.can_slots ? ' checked' : '') + '>枠・承認</label><label><input type="checkbox" data-su="' + esc(s.id) + '" data-col="can_register"' + (r.can_register ? ' checked' : '') + '>家庭の登録</label></div>'; };
  const on = STAFF.filter(s => PESTAFF[s.id] && (PESTAFF[s.id].can_slots || PESTAFF[s.id].can_register)), off = STAFF.filter(s => on.indexOf(s) < 0);
  pane.innerHTML = '<div class="card"><h2>PE スタッフ</h2><div class="muted">印をつけた人が、このページを使えます。責任者（代表・橋田・石田・亀井）は、印がなくても全部使えます。</div><div id="stf-msg" class="msg good" style="display:none"></div>' +
    '<h3 style="margin-top:14px">使える人</h3>' + (on.length ? on.map(row).join('') : '<div class="muted">まだいません</div>') +
    '<h3 style="margin-top:18px">ほかのスタッフ</h3><input class="in" id="stf-q" placeholder="名前でさがす" style="margin-bottom:6px"><div id="stf-off">' + off.map(row).join('') + '</div></div>';
  $('#stf-q').oninput = e => { const q = e.target.value.trim(); $('#stf-off').innerHTML = off.filter(s => !q || String(s.name || '').indexOf(q) >= 0 || String(s.staff_id || '').indexOf(q) >= 0).map(row).join(''); bind(); };
  function bind() { pane.querySelectorAll('input[data-su]').forEach(c => c.onchange = () => saveStf(c)); }
  bind();
}
async function saveStf(c) {
  const su = c.dataset.su, cur = PESTAFF[su] || { staff_uuid: su, can_slots: false, can_register: false };
  const next = Object.assign({}, cur, { [c.dataset.col]: c.checked, updated_at: new Date().toISOString() });
  c.disabled = true;
  try {
    await api('pe_staff?on_conflict=staff_uuid', { method: 'POST', headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' }, body: { staff_uuid: su, can_slots: !!next.can_slots, can_register: !!next.can_register, updated_at: next.updated_at } });
    PESTAFF[su] = next; showMsg('stf-msg', '保存しました', 'good');
  } catch (e) { c.checked = !c.checked; showMsg('stf-msg', '保存できませんでした：' + e.message, 'bad'); }
  c.disabled = false;
}

boot();
</script>
</body>

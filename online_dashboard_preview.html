<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学習ダッシュボード プレビュー</title>
<style>
 :root{--orange:#F0A030;--orange-l:#F7D9A8;--orange-d:#D9832A;--bg:#FBF6EE;--surface:#FFFFFF;--border:#EADFCB;--text:#3B342B;--muted:#9A8F7D;--radius-sm:10px}
 *{box-sizing:border-box}body{margin:0;background:#efe7da;font-family:'Noto Sans JP',sans-serif;color:var(--text);padding:20px 16px}
 .note{max-width:420px;margin:0 auto 12px;font-size:12px;color:#6b6156;text-align:center;line-height:1.6}
 .card{max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
 h2{margin:0 0 8px;font-size:17px}
 .dash-stats{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
 .dash-stat{flex:1;min-width:70px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
 .dash-stat .v{font-size:18px;font-weight:900;color:var(--orange-d);line-height:1.1}
 .dash-stat .l{font-size:10px;color:var(--muted);margin-top:2px}
 .dash-bars{display:flex;align-items:flex-end;gap:6px;height:84px;margin:6px 0 2px}
 .dash-bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
 .dash-bcol .b{width:70%;background:linear-gradient(var(--orange-l),var(--orange));border-radius:5px 5px 0 0;min-height:3px}
 .dash-bcol.today .b{background:linear-gradient(var(--orange),var(--orange-d))}
 .dash-bcol .d{font-size:9px;color:var(--muted)}
 .cat-row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
 .cat-row .cl{width:104px;color:var(--text);font-weight:700;flex:none}
 .cat-row .ct{flex:1;height:8px;background:#EEE3CE;border-radius:999px;overflow:hidden;min-width:0}
 .cat-row .cf{height:100%;background:var(--cc,var(--orange));border-radius:999px}
 .cat-row .cn{width:44px;text-align:right;color:var(--muted);font-weight:700;flex:none}
 .sl-quick{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 4px}
 .sl-qbtn{flex:1;min-width:96px;border:1px solid var(--orange-l);background:linear-gradient(rgba(240,160,48,.08),rgba(240,160,48,.08)),var(--surface);border-radius:10px;padding:11px 8px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--orange-d);text-align:center}
 .hd{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
</style></head><body>
<div class="note">確認用プレビュー（学習ダッシュボード・サンプル値）。週バー＝日別の学習時間、内訳＝今月の取り組み回数、下＝DMMワンタップ記録。</div>
<div class="card">
 <h2>学習ダッシュボード</h2>
 <div class="dash-bars" id="bars"></div>
 <div class="dash-stats">
  <div class="dash-stat"><div class="v">3h40m</div><div class="l">今週の学習</div></div>
  <div class="dash-stat"><div class="v">18h05m</div><div class="l">累計の学習</div></div>
  <div class="dash-stat"><div class="v">🔥6</div><div class="l">連続</div></div>
  <div class="dash-stat"><div class="v">7</div><div class="l">動画完了</div></div>
 </div>
 <div class="hd">今月の取り組み（回数）</div>
 <div id="cats"></div>
 <div class="hd">ワンタップで記録</div>
 <div class="sl-quick">
  <button class="sl-qbtn">🗣 DMMレッスン<br><span style="font-size:10px;color:var(--muted);font-weight:600">25分</span></button>
  <button class="sl-qbtn">📚 DMM単語<br><span style="font-size:10px;color:var(--muted);font-weight:600">15分</span></button>
 </div>
 <div class="hd">✍️ 自習を記録する</div>
 <input type="text" placeholder="やったこと（例：単語帳 Unit3）" style="width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);box-sizing:border-box">
</div>
<script>
const mins=[40,0,55,30,25,60,30]; const wd=['月','火','水','木','金','土','日']; const mx=Math.max(...mins);
document.getElementById('bars').innerHTML=mins.map((m,i)=>'<div class="dash-bcol'+(i===6?' today':'')+'"><div class="b" style="height:'+Math.round(m/mx*100)+'%"></div><div class="d">'+wd[i]+'</div></div>').join('');
const cats=[['講座（動画）','#F5A623',7],['DMMレッスン','#5DA9E9',5],['DMM単語','#7BC96F',9],['自習','#E3934A',4],['その他','#9AA0A6',1]];
const cmx=Math.max(...cats.map(c=>c[2]));
document.getElementById('cats').innerHTML=cats.map(c=>'<div class="cat-row" style="--cc:'+c[1]+'"><span class="cl">'+c[0]+'</span><span class="ct"><span class="cf" style="width:'+Math.round(c[2]/cmx*100)+'%"></span></span><span class="cn">'+c[2]+'回</span></div>').join('');
</script></body></html>

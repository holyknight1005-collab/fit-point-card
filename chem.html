<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B7A52">
<title>J化学演習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--green:#1B7A52;--green-d:#0E4D33;--green-l:#E1F4EC;--bg:#F2FAF6;--surface:#fff;--text:#2C2C2A;--muted:#7A8F86;--border:#DCEDE4;--red:#D94040;--red-l:#FFECEC;--radius:16px;--radius-sm:10px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
  .screen{display:none;min-height:100vh;max-width:430px;margin:0 auto}
  .screen.active{display:block}

  /* ローディング */
  #loading{position:fixed;inset:0;background:rgba(242,250,246,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:500}
  #loading.hidden{display:none}
  .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading-text{font-size:13px;color:var(--muted)}

  /* トースト */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:600;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:var(--green)}
  .toast.info{background:#444}

  /* ログイン */
  #screen-login{flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
  #screen-login.active{display:flex}
  .login-logo{text-align:center}
  .login-logo .ico{font-size:54px}
  .login-logo .ttl{font-size:22px;font-weight:900;color:var(--green-d);margin-top:6px}
  .login-logo .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .login-card{width:100%;background:var(--surface);border-radius:var(--radius);padding:22px 20px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:1px solid var(--border)}
  .field-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block}
  .field-input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:'Noto Sans JP',sans-serif;color:var(--text);background:var(--bg);transition:border-color .15s;margin-bottom:14px}
  .field-input:focus{outline:none;border-color:var(--green)}
  .primary-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--green),var(--green-d));border:none;border-radius:var(--radius-sm);color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(27,122,82,.3)}
  .error-msg{background:var(--red-l);border:1px solid #F5BABA;border-radius:var(--radius-sm);padding:9px 13px;font-size:12px;color:var(--red);margin-top:10px;display:none}
  .error-msg.show{display:block}

  /* ホーム */
  #screen-home{padding:18px 16px 50px}
  .home-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .home-hello{font-size:15px;font-weight:700;color:var(--green-d)}
  .point-pill{background:var(--green-l);border:1px solid var(--border);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--green-d)}
  .point-pill b{font-size:15px}
  .section-title{font-size:13px;font-weight:700;color:var(--text);margin:6px 0 10px}
  .home-logout{background:none;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:11px;padding:5px 10px;border-radius:8px;cursor:pointer}

  /* アクセス不可表示 */
  #screen-denied{display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;gap:14px;text-align:center;min-height:100vh}
  #screen-denied.active{display:flex}
</style>
</head>
<body>

<!-- ローディング -->
<div id="loading" class="hidden"><div class="spinner"></div><div id="loading-text">読み込み中...</div></div>
<!-- トースト -->
<div id="toast" class="toast"></div>

<!-- ===== ログイン ===== -->
<div id="screen-login" class="screen">
  <div class="login-logo">
    <div class="ico">⚗️</div>
    <div class="ttl">J化学演習</div>
    <div class="sub">fitポイントと同じID・パスワードでログイン</div>
  </div>
  <div class="login-card">
    <label class="field-label">メールアドレス</label>
    <input id="login-email" class="field-input" type="email" inputmode="email" placeholder="メールアドレス" autocomplete="username">
    <label class="field-label">パスワード（PIN）</label>
    <input id="login-pin" class="field-input" type="password" inputmode="numeric" placeholder="パスワード" autocomplete="current-password">
    <button class="primary-btn" onclick="doLogin()">ログイン</button>
    <div id="login-error" class="error-msg"></div>
    <div style="text-align:center;margin-top:16px">
      <button class="home-logout" onclick="showScreen('screen-staff-login')" style="padding:7px 14px">👨‍🏫 スタッフの方はこちら</button>
    </div>
  </div>
</div>

<!-- ===== スタッフログイン ===== -->
<div id="screen-staff-login" class="screen">
  <div class="login-logo">
    <div class="ico">👨‍🏫</div>
    <div class="ttl">スタッフログイン</div>
    <div class="sub">スタッフIDと5桁パスワードを入力してください</div>
  </div>
  <div class="login-card">
    <label class="field-label">スタッフID</label>
    <input id="staff-id" class="field-input" type="text" autocomplete="username" placeholder="例：fit001" style="text-transform:lowercase">
    <label class="field-label">パスワード（5桁）</label>
    <input id="staff-pin" class="field-input" type="password" inputmode="numeric" maxlength="5" placeholder="・・・・・" autocomplete="current-password">
    <button class="primary-btn" onclick="doStaffLogin()">ログイン</button>
    <div id="staff-login-error" class="error-msg"></div>
    <div style="text-align:center;margin-top:16px">
      <button class="home-logout" onclick="showScreen('screen-login')" style="padding:7px 14px">← 生徒ログインに戻る</button>
    </div>
  </div>
</div>

<!-- ===== スタッフ：間違い分析 ===== -->
<div id="screen-staff" class="screen">
  <div class="home-top">
    <div class="home-hello" id="staff-hello">スタッフモード</div>
    <button class="home-logout" onclick="logout()">ログアウト</button>
  </div>
  <div class="section-title">📊 化学演習・間違い分析</div>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="home-logout" id="staff-tab-student" onclick="staffRenderBy('student')" style="flex:1;padding:9px 0;font-size:12px">生徒別</button>
    <button class="home-logout" id="staff-tab-part" onclick="staffRenderBy('part')" style="flex:1;padding:9px 0;font-size:12px">パート別</button>
    <button class="home-logout" onclick="staffOpenPractice()" style="flex:1;padding:9px 0;font-size:12px;color:var(--green-d);border-color:var(--green)">演習を試す</button>
  </div>
  <div id="staff-summary" style="font-size:12px;color:var(--muted);margin-bottom:10px"></div>
  <div id="staff-analysis" style="display:flex;flex-direction:column;gap:10px"></div>
</div>

<!-- ===== 受講していない場合 ===== -->
<div id="screen-denied" class="screen">
  <div style="font-size:48px">🔒</div>
  <div style="font-size:17px;font-weight:700;color:var(--green-d)">化学の授業を受けている人だけが使えます</div>
  <div style="font-size:13px;color:var(--muted);line-height:1.7">化学を受講しているのに表示されない場合は、<br>講師に伝えてください。</div>
  <button class="home-logout" onclick="logout()" style="margin-top:8px;padding:9px 18px">ログアウト</button>
</div>

<!-- ===== ホーム（カテゴリー選択） ===== -->
<div id="screen-home" class="screen">
  <div class="home-top">
    <div class="home-hello" id="home-hello">こんにちは</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="point-pill">fitP <b id="student-points">0</b></div>
      <button class="home-logout" onclick="logout()">ログアウト</button>
    </div>
  </div>
  <div class="section-title">J化学演習</div>
  <div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px">パートを選んでね。正解するとfitポイントがたまります。</div>
  <div onclick="chemStartReview()" style="background:linear-gradient(135deg,#C26A1B,#9A5215);border-radius:14px;padding:14px 16px;color:#fff;cursor:pointer;box-shadow:0 3px 12px rgba(194,106,27,.3);margin-bottom:14px;display:flex;align-items:center;gap:10px">
    <span style="font-size:22px">🔁</span>
    <div style="flex:1"><div style="font-size:15px;font-weight:700">まちがえた問題を復習</div>
    <div style="font-size:11px;opacity:.9;margin-top:2px">これまで間違えた問題をまとめて出題（最大20問）</div></div>
    <span style="font-size:18px">›</span>
  </div>
  <div id="chem-cards" style="display:flex;flex-direction:column;gap:12px"></div>
</div>

<!-- ===== 化学 出題画面 ===== -->
<div id="screen-chem" style="display:none;position:fixed;inset:0;z-index:300;background:#F2FAF6;flex-direction:column;max-width:430px;margin:0 auto;overflow-y:auto">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #DCEDE4;box-shadow:0 1px 4px rgba(0,0,0,0.06);position:sticky;top:0;z-index:10">
    <span style="font-size:20px">⚗️</span>
    <span id="chem-header" style="font-size:14px;font-weight:700;color:#0E4D33">J化学演習</span>
    <button id="chem-back-btn" onclick="chemBack()" style="background:none;border:1px solid #DCEDE4;color:#1B7A52;font-size:12px;cursor:pointer;padding:5px 10px;border-radius:8px">← 戻る</button>
  </div>
  <!-- カテゴリー選択（ホームのカードはこの画面外。ここは出題＆結果用） -->
  <div id="chem-menu" style="display:none;flex:1;padding:20px 16px;flex-direction:column;gap:14px">
    <div style="font-size:13px;color:#5A7268;line-height:1.6;margin-bottom:2px">パートを選んでね。正解するとfitポイントがたまります。</div>
    <div id="chem-cards-inner" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
  <div id="chem-quiz" style="display:none;flex:1;padding:18px 16px;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span id="chem-quiz-title" style="font-size:15px;font-weight:700;color:#0E4D33"></span>
      <span id="chem-prog" style="font-size:12px;color:#7A8F86;font-family:monospace"></span>
    </div>
    <div style="height:6px;background:#E1EDE7;border-radius:99px;overflow:hidden"><div id="chem-bar" style="height:100%;background:linear-gradient(90deg,#1B7A52,#34C77B);width:0%;transition:width .3s"></div></div>
    <div id="chem-qbody"></div>
    <div id="chem-fb" style="text-align:center;min-height:24px;font-weight:700;font-size:14px"></div>
    <div id="chem-next" style="text-align:center"></div>
  </div>
  <div id="chem-result" style="display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;gap:14px;text-align:center">
    <div style="font-size:48px">🎉</div>
    <div id="chem-result-score" style="font-size:34px;font-weight:800;color:#1B7A52;font-family:monospace"></div>
    <div id="chem-result-msg" style="font-size:14px;color:#5A7268"></div>
    <div id="chem-result-extra"></div>
    <button onclick="backToHome()" style="margin-top:8px;padding:13px 26px;background:#fff;border:1.5px solid #1B7A52;border-radius:12px;color:#0E4D33;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;cursor:pointer">カテゴリーに戻る</button>
  </div>
</div>

<script>
/* ===== Supabase 接続（本体と同じプロジェクト） ===== */
const SB_URL = 'https://bqdvmfskpnlshqljwhqz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxZHZtZnNrcG5sc2hxbGp3aHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTYzOTksImV4cCI6MjA5NDY3MjM5OX0.I26ODw819ueVfEnfS3SN8ZT_O_oJg6ET6W8GWsRSBfU';

async function sbGet(table, query){
  const res = await fetch(SB_URL+'/rest/v1/'+table+'?'+query, {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}
async function sbPost(table, body){
  const res = await fetch(SB_URL+'/rest/v1/'+table, {method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
  if(!res.ok) throw new Error(await res.text());
}
async function sbPatch(table, query, body){
  const res = await fetch(SB_URL+'/rest/v1/'+table+'?'+query, {method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
  if(!res.ok) throw new Error(await res.text());
}

/* ===== UI部品 ===== */
function showLoading(t){ document.getElementById('loading-text').textContent=t||'読み込み中...'; document.getElementById('loading').classList.remove('hidden'); }
function hideLoading(){ document.getElementById('loading').classList.add('hidden'); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function showToast(msg,type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(type||'info'); setTimeout(()=>t.classList.remove('show'),2800); }

/* ===== 認証（本体と同じ fit_email / fit_pin を共有） ===== */
let currentStudent = null;
let currentStaff = null;

function saveLoginState(email,pin){ localStorage.setItem('fit_email',email); localStorage.setItem('fit_pin',pin); localStorage.setItem('fit_role','student'); }
function saveStaffLoginState(staffId,pin){ localStorage.setItem('fit_staff_id',staffId); localStorage.setItem('fit_staff_pin',pin); localStorage.setItem('fit_role','staff'); }
function clearLoginState(){ localStorage.removeItem('fit_email'); localStorage.removeItem('fit_pin'); localStorage.removeItem('fit_role'); localStorage.removeItem('fit_staff_id'); localStorage.removeItem('fit_staff_pin'); }

async function autoLogin(){
  const role=localStorage.getItem('fit_role');
  // スタッフの引き継ぎ（app.html からの遷移）
  if(role==='staff'){
    const sid=localStorage.getItem('fit_staff_id');
    const spin=localStorage.getItem('fit_staff_pin');
    if(sid&&spin){
      showLoading('自動ログイン中...');
      try{
        const data=await sbGet('staff','staff_id=eq.'+encodeURIComponent(sid)+'&pin=eq.'+encodeURIComponent(spin)+'&is_active=eq.true&select=*');
        if(data&&data.length){ currentStaff=data[0]; await afterStaffLogin(); return; }
      }catch(e){ /* fallthrough */ }
    }
    hideLoading(); showScreen('screen-staff-login'); return;
  }
  const email=localStorage.getItem('fit_email');
  const pin=localStorage.getItem('fit_pin');
  if(!email||!pin){ showScreen('screen-login'); return; }
  showLoading('自動ログイン中...');
  try{
    const data=await sbGet('students','email=eq.'+encodeURIComponent(email)+'&pin=eq.'+encodeURIComponent(pin)+'&select=*');
    if(!data||!data.length){ clearLoginState(); hideLoading(); showScreen('screen-login'); return; }
    currentStudent=data[0];
    await afterLogin();
  }catch(e){ clearLoginState(); hideLoading(); showScreen('screen-login'); }
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim().toLowerCase();
  const pin=document.getElementById('login-pin').value.trim();
  const err=document.getElementById('login-error');
  if(!email||!pin){ err.textContent='メールアドレスとパスワードを入力してください'; err.classList.add('show'); return; }
  showLoading('ログイン中...');
  try{
    const data=await sbGet('students','email=eq.'+encodeURIComponent(email)+'&pin=eq.'+encodeURIComponent(pin)+'&select=*');
    if(!data||!data.length){ err.textContent='メールアドレスまたはパスワードが違います'; err.classList.add('show'); hideLoading(); return; }
    err.classList.remove('show');
    currentStudent=data[0];
    saveLoginState(email,pin);
    await afterLogin();
  }catch(e){ hideLoading(); err.textContent='接続エラー: '+e.message; err.classList.add('show'); }
}

function logout(){ currentStudent=null; currentStaff=null; clearLoginState(); showScreen('screen-login'); }

/* ===== スタッフ認証 ===== */
async function doStaffLogin(){
  const sid=document.getElementById('staff-id').value.trim().toLowerCase();
  const pin=document.getElementById('staff-pin').value.trim();
  const err=document.getElementById('staff-login-error');
  if(!sid||!pin){ err.textContent='IDとパスワードを入力してください'; err.classList.add('show'); return; }
  showLoading('ログイン中...');
  try{
    const data=await sbGet('staff','staff_id=eq.'+encodeURIComponent(sid)+'&pin=eq.'+encodeURIComponent(pin)+'&is_active=eq.true&select=*');
    if(!data||!data.length){ err.textContent='IDまたはパスワードが違います'; err.classList.add('show'); hideLoading(); return; }
    err.classList.remove('show');
    currentStaff=data[0];
    saveStaffLoginState(sid,pin);
    await afterStaffLogin();
  }catch(e){ hideLoading(); err.textContent='通信がうまくつながらなかったみたい。もう一度試してね。'; err.classList.add('show'); }
}

async function afterStaffLogin(){
  hideLoading();
  document.getElementById('staff-hello').textContent=(currentStaff.name||'スタッフ')+'さん（スタッフ）';
  showScreen('screen-staff');
  await staffLoadAnalysis();
}

/* スタッフ：間違いログを集計して表示 */
let staffWrongRows=[];
let staffStudentMap={};
async function staffLoadAnalysis(){
  const box=document.getElementById('staff-analysis');
  const sum=document.getElementById('staff-summary');
  box.innerHTML=''; sum.textContent='読み込み中...';
  try{
    // 未解決の間違いを全件取得
    staffWrongRows=await sbGet('chem_wrong_logs','resolved=eq.false&select=student_id,part,part_title,question,wrong_count&order=wrong_count.desc') || [];
    // 生徒名を引く
    const ids=[...new Set(staffWrongRows.map(r=>r.student_id))];
    staffStudentMap={};
    if(ids.length){
      const studs=await sbGet('students','id=in.('+ids.join(',')+')&select=id,name') || [];
      studs.forEach(s=>{ staffStudentMap[s.id]=s.name||'(名前なし)'; });
    }
    const totalWrong=staffWrongRows.reduce((a,r)=>a+(r.wrong_count||1),0);
    sum.textContent='未解決の間違い：'+staffWrongRows.length+'件（のべ'+totalWrong+'回）／対象生徒 '+ids.length+'名';
    staffRenderBy('student');
  }catch(e){
    sum.textContent='';
    box.innerHTML='<div style="font-size:13px;color:var(--red)">読み込みに失敗しました。chem_wrong_logs テーブルとRLS設定を確認してください。</div>';
  }
}

function staffRenderBy(mode){
  const box=document.getElementById('staff-analysis');
  // タブのハイライト
  const ts=document.getElementById('staff-tab-student'), tp=document.getElementById('staff-tab-part');
  if(ts&&tp){
    ts.style.color = mode==='student'?'var(--green-d)':'var(--muted)';
    ts.style.borderColor = mode==='student'?'var(--green)':'var(--border)';
    tp.style.color = mode==='part'?'var(--green-d)':'var(--muted)';
    tp.style.borderColor = mode==='part'?'var(--green)':'var(--border)';
  }
  box.innerHTML='';
  if(!staffWrongRows.length){ box.innerHTML='<div style="font-size:13px;color:var(--muted)">未解決の間違いはありません。</div>'; return; }
  // 集計
  const groups={};
  staffWrongRows.forEach(r=>{
    const key = mode==='student' ? (staffStudentMap[r.student_id]||r.student_id) : (r.part_title||r.part);
    if(!groups[key]) groups[key]={count:0, total:0, items:[]};
    groups[key].count++;
    groups[key].total+=(r.wrong_count||1);
    groups[key].items.push(r);
  });
  // のべ回数の多い順
  const sorted=Object.entries(groups).sort((a,b)=>b[1].total-a[1].total);
  sorted.forEach(([key,g])=>{
    const card=document.createElement('div');
    card.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.05)';
    const detailId='det-'+Math.random().toString(36).slice(2,9);
    const itemsHtml=g.items
      .sort((a,b)=>(b.wrong_count||1)-(a.wrong_count||1))
      .map(r=>{
        const label = mode==='student' ? (r.part_title||r.part) : (staffStudentMap[r.student_id]||r.student_id);
        return '<div style="font-size:12px;color:var(--text);padding:6px 0;border-top:1px solid var(--border)">'
          +'<span style="color:var(--muted)">['+escapeHtml(label)+']</span> '
          +escapeHtml(r.question)
          +' <b style="color:var(--red)">×'+(r.wrong_count||1)+'</b></div>';
      }).join('');
    card.innerHTML='<div onclick="(function(el){var d=el.parentNode.querySelector(\'#'+detailId+'\');d.style.display=d.style.display===\'none\'?\'block\':\'none\';})(this)" style="display:flex;align-items:center;gap:8px;cursor:pointer">'

      +'<div id="'+detailId+'" style="display:none;margin-top:4px">'+itemsHtml+'</div>';
    box.appendChild(card);
  });
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===== 受講判定：教科「化学」のクラスを受講しているか ===== */
async function isChemEnrolled(){
  try{
    const enrolls=await sbGet('class_enrollments',
      'student_id=eq.'+currentStudent.id+'&select=class_master(name,subject)');
    if(!enrolls||!enrolls.length) return false;
    return enrolls.some(e=>{
      const cm=e.class_master;
      if(!cm) return false;
      const subj=(cm.subject||'');
      const name=(cm.name||'');
      // 教科が「化学」または授業名に「化学」を含む場合に許可
      return subj.indexOf('化学')>=0 || name.indexOf('化学')>=0;
    });
  }catch(e){ console.error('enroll check error',e); return false; }
}

async function afterLogin(){
  const ok=await isChemEnrolled();
  hideLoading();
  if(!ok){ showScreen('screen-denied'); return; }
  document.getElementById('home-hello').textContent=(currentStudent.name||'')+'さん、こんにちは';
  document.getElementById('student-points').textContent=(currentStudent.points||0).toLocaleString();
  showScreen('screen-home');
  renderHomeCards();
}

/* ホームのカテゴリーカードを描画（出題画面の中ではなくホームに） */
function renderHomeCards(){
  const wrap=document.getElementById('chem-cards');
  wrap.innerHTML='';
  let lastGroup=null;
  CHEM_ORDER.forEach(key=>{
    const d=CHEM_DATA[key];
    // グループ見出し（化学基礎①／②）
    const g=d.group||null;
    if(g && g!==lastGroup && typeof CHEM_GROUPS!=='undefined' && CHEM_GROUPS[g]){
      const gd=CHEM_GROUPS[g];
      const head=document.createElement('div');
      head.style.cssText='margin:'+(lastGroup?'18px':'2px')+' 0 8px;display:flex;align-items:baseline;gap:8px';
      head.innerHTML='<span style="font-size:14px;font-weight:900;color:#0E4D33">'+gd.label+'</span>'
        +'<span style="font-size:11px;color:#7A8F86">'+gd.sub+'</span>';
      wrap.appendChild(head);
      lastGroup=g;
    }
    let count;
    if(d.type==='reading'){
      count = d.cards.length+'項目';
    } else {
      const totalQ = chemFullPool(d).length;
      const remainQ = chemRemainingPool(key, d).length;
      count = (remainQ===0)
        ? '✅ 全'+totalQ+'問 制覇'
        : '残り'+remainQ+' / 全'+totalQ+'問';
    }
    const card=document.createElement('div');
    card.style.cssText='background:#fff;border:1px solid #DCEDE4;border-left:4px solid '+d.color+';border-radius:14px;padding:15px 16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.05)';
    card.onclick=()=>chemStart(key);
    card.innerHTML='<div style="display:flex;align-items:center;gap:10px">'
      +'<span style="font-size:22px">'+d.icon+'</span>'
      +'<div style="flex:1"><div style="font-size:15px;font-weight:700;color:#2C2C2A">'+d.title+'</div>'
      +'<div style="font-size:11px;color:#7A8F86;margin-top:2px">'+d.sub+'　/　'+count+'</div></div>'
      +'<span style="color:'+d.color+';font-size:18px">›</span></div>';
    wrap.appendChild(card);
  });
}

/* 出題開始（化学画面を開いてクイズ表示） */
function chemStart(key){
  chemCur=CHEM_DATA[key]; chemCur._key=key; chemIdx=0; chemScore=0;
  chemSessionWrong=[]; chemReviewMode=false;
  document.getElementById('screen-chem').style.display='flex';
  document.getElementById('chem-header').textContent=chemCur.title;
  document.getElementById('chem-quiz-title').textContent=chemCur.title;
  if(chemCur.type==='reading'){ chemRenderReading(); return; }
  // 正解済みを除いた残りプールから出題
  const remaining = chemRemainingPool(key, chemCur);
  if(remaining.length===0){
    // 全問制覇 → クリア画面
    chemShowCleared(key);
    return;
  }
  chemQset = chemSample(remaining, chemCur.pick);
  chemShow('quiz');
  chemRenderQ();
}

/* 全問正解済みのときのクリア画面（リセット可能） */
function chemShowCleared(key){
  const d=CHEM_DATA[key];
  const total=chemFullPool(d).length;
  chemShow('result');
  document.getElementById('chem-result-score').textContent='🎉 全問制覇！';
  document.getElementById('chem-result-msg').textContent=d.title+' の全'+total+'問を正解済みです。';
  const box=document.getElementById('chem-result-extra');
  if(box){
    box.innerHTML='<button onclick="chemResetMastered(\''+key+'\');chemStart(\''+key+'\')" '
      +'style="padding:13px 26px;background:linear-gradient(135deg,#C26A1B,#9A5215);border:none;border-radius:12px;color:#fff;font-family:\'Noto Sans JP\',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px">'
      +'もう一度はじめから（リセット）</button>';
  }
}

/* 化学画面内の表示切替（quiz / result のみ。menu はホーム側を使う） */
function chemShow(which){
  document.getElementById('chem-menu').style.display='none';
  document.getElementById('chem-quiz').style.display   = which==='quiz'   ? 'flex':'none';
  document.getElementById('chem-result').style.display = which==='result' ? 'flex':'none';
}

/* ============================================================ */
/* 正解済み管理（全問制覇モード・localStorage保存）            */
/*  正解した問題のsubjectを「正解済み」として記録し、         */
/*  次回以降の出題から除外。残りが尽きたらリセット可能。       */
/* ============================================================ */
function chemMasteredKey(partKey){
  const who = (typeof currentStudent!=='undefined' && currentStudent && currentStudent.id) ? currentStudent.id : 'guest';
  return 'chem_mastered_'+who+'_'+partKey;
}
function chemGetMastered(partKey){
  try{ return JSON.parse(localStorage.getItem(chemMasteredKey(partKey))||'[]'); }
  catch(e){ return []; }
}
function chemAddMastered(partKey, subject){
  const list = chemGetMastered(partKey);
  if(!list.includes(subject)){
    list.push(subject);
    try{ localStorage.setItem(chemMasteredKey(partKey), JSON.stringify(list)); }catch(e){}
  }
}
function chemResetMastered(partKey){
  try{ localStorage.removeItem(chemMasteredKey(partKey)); }catch(e){}
}
/* パートの全問プール（mole は基本＋応用）を返す */
function chemFullPool(d){
  return (d.pool||[]).concat(d.advPool||[]);
}
/* まだ正解していない問題だけ返す */
function chemRemainingPool(partKey, d){
  const mastered = chemGetMastered(partKey);
  return chemFullPool(d).filter(q=>!mastered.includes(q.subject));
}

/* 配列をシャッフルしてn個取り出す */
function chemSample(arr, n){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return (n && n<a.length) ? a.slice(0,n) : a;
}

/* ポイント連動：students.points 加算 + point_logs 記録 */
async function chemAwardPoints(pts, reason){
  if(!currentStudent || pts<=0) return;
  try{
    const newPts=(currentStudent.points||0)+pts;
    await sbPatch('students','id=eq.'+currentStudent.id,{points:newPts});
    await sbPost('point_logs',{student_id:currentStudent.id, points:pts, reason:reason, type:'chem'});
    currentStudent.points=newPts;
    const el=document.getElementById('student-points');
    if(el) el.textContent=newPts.toLocaleString();
    showToast('⚗️ +'+pts+'pt 獲得！','success');
  }catch(e){ console.error('chem points error', e); }
}

/* ============================================================ */
let chemSessionWrong = [];   // このセッションで間違えた問題
let chemReviewMode = false;  // 復習モード中か（復習中の間違いは点を与えない）

/* 採点フック：正誤を記録 */
function chemMark(q, isCorrect){
  if(isCorrect){
    // 正解 → 全問制覇モードの「正解済み」に追加（このパート単位）
    if(chemCur && chemCur._key) chemAddMastered(chemCur._key, q.subject);
    // 復習で正解 → 解決済みにする
    if(chemReviewMode) chemResolveWrong(q);
    else chemResolveWrong(q); // 通常モードでも、過去に間違えた問題を正解したら解決
  } else {
    // セッション間違いリストに積む（重複防止）
    if(!chemSessionWrong.some(w=>w.subject===q.subject && w._part===chemCur._key)){
      const rec = Object.assign({}, q, {_part:chemCur._key, _partTitle:chemCur.title});
      chemSessionWrong.push(rec);
    }
    chemRecordWrong(q);
  }
}

/* Supabaseへ間違いを記録（同じ問題は回数+1のupsert） */
async function chemRecordWrong(q){
  if(!currentStudent) return;
  try{
    // 既存行を探す
    const exist = await sbGet('chem_wrong_logs',
      'student_id=eq.'+currentStudent.id
      +'&part=eq.'+encodeURIComponent(chemCur._key)
      +'&question=eq.'+encodeURIComponent(q.subject)
      +'&select=id,wrong_count');
    if(exist && exist.length){
      await sbPatch('chem_wrong_logs','id=eq.'+exist[0].id,
        {wrong_count:(exist[0].wrong_count||1)+1, resolved:false, updated_at:new Date().toISOString()});
    } else {
      await sbPost('chem_wrong_logs',{
        student_id:currentStudent.id, part:chemCur._key, part_title:chemCur.title,
        question:q.subject, answer:String(q.answer||''), wrong_count:1, resolved:false
      });
    }
  }catch(e){ console.error('record wrong error', e); }
}

/* 正解したら解決済みに */
async function chemResolveWrong(q){
  if(!currentStudent) return;
  try{
    await sbPatch('chem_wrong_logs',
      'student_id=eq.'+currentStudent.id
      +'&part=eq.'+encodeURIComponent(chemCur._key)
      +'&question=eq.'+encodeURIComponent(q.subject),
      {resolved:true, updated_at:new Date().toISOString()});
  }catch(e){ /* 行がなければ何もしない */ }
}

/* パート終了画面に「間違いだけもう一度」ボタンを足す */
function chemResultExtra(){
  const box=document.getElementById('chem-result-extra');
  if(!box) return;
  if(chemSessionWrong.length>0){
    box.innerHTML='<button onclick="chemRetryWrong()" style="padding:13px 26px;background:linear-gradient(135deg,#C26A1B,#9A5215);border:none;border-radius:12px;color:#fff;font-family:\'Noto Sans JP\',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px">まちがえた'+chemSessionWrong.length+'問だけもう一度</button>';
  } else {
    box.innerHTML='';
  }
}

/* このセッションの間違いだけ再出題 */
function chemRetryWrong(){
  const wrong = chemSessionWrong.slice();
  if(!wrong.length) return;
  // パートはまたぐ可能性があるが、表示・採点は元のtypeで行うため _part 単位で動かす
  // ここでは1パート内の復習を想定（同パートの間違いを再出題）
  chemReviewMode = true;
  chemQset = chemSample(wrong, wrong.length);
  chemIdx=0; chemScore=0;
  chemSessionWrong = []; // 再挑戦分は新たに集計
  // type は chemCur のものを使う（同一パート内）
  chemShow('quiz');
  document.getElementById('chem-quiz-title').textContent=chemCur.title+'（まちがい直し）';
  chemRenderQ();
}

/* ホーム：苦手（未解決の間違い）を全パート横断で復習 */
async function chemStartReview(){
  if(!currentStudent) return;
  showLoading('まちがえた問題を集めています...');
  try{
    const rows = await sbGet('chem_wrong_logs',
      'student_id=eq.'+currentStudent.id+'&resolved=eq.false&select=*&order=wrong_count.desc&limit=20');
    hideLoading();
    if(!rows || !rows.length){ showToast('まちがえた問題はありません🎉','success'); return; }
    // 元の問題データを CHEM_DATA から復元（type・choices・hint等を取り戻す）
    const restored=[];
    rows.forEach(r=>{
      const part=CHEM_DATA[r.part];
      if(!part) return;
      const src = (part.pool||[]).concat(part.advPool||[]);
      const q = src.find(x=>x.subject===r.question);
      if(q){ const c=Object.assign({},q,{_part:r.part,_partTitle:r.part_title||part.title,_type:part.type}); restored.push(c); }
    });
    if(!restored.length){ showToast('復習できる問題が見つかりませんでした','info'); return; }
    // 復習専用のミニパートを構成（パート混在に対応するため、各問でtypeを切り替える）
    chemCur = {title:'まちがい直し', _key:'review', type:'mixed'};
    chemReviewMode = true;
    chemQset = chemSample(restored, restored.length);
    chemIdx=0; chemScore=0; chemSessionWrong=[];
    document.getElementById('screen-chem').style.display='flex';
    document.getElementById('chem-header').textContent='まちがい直し';
    document.getElementById('chem-quiz-title').textContent='まちがい直し';
    chemShow('quiz');
    chemRenderReviewQ();
  }catch(e){ hideLoading(); console.error(e); showToast('読み込みエラー','info'); }
}

/* 復習（混在パート）用の1問描画：各問のtypeで切り替え */
function chemRenderReviewQ(){
  const total=chemQset.length;
  if(chemIdx>=total){
    chemResult(chemScore+' / '+total, 'まちがい直しが完了！正解したものは苦手リストから消えます。');
    return;
  }
  chemProgress(chemIdx,total);
  document.getElementById('chem-fb').textContent='';
  document.getElementById('chem-fb').style.color='';
  document.getElementById('chem-next').innerHTML='';
  const q=chemQset[chemIdx];
  // 復習中は採点時に正しい part を参照させるため chemCur._key を一時差し替え
  chemCur._key = q._part;
  chemCur.title = q._partTitle || 'まちがい直し';
  const t = q._type;
  if(t==='choice') chemRenderChoice(q);
  else if(t==='input') chemRenderInput(q);
  else if(t==='reveal') chemRenderReveal(q);
}
